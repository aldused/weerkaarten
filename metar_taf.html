<script>
// ── Weerfenomeen codes → Nederlands ────────────────────────────────────────
const WX_NL = {
  // Neerslag
  'RA':'regen', 'DZ':'motregen', 'SN':'sneeuw', 'SG':'sneeuwkorrels',
  'IC':'ijskristallen', 'GR':'hagel', 'GS':'kleine hagel',
  'UP':'onbekende neerslag',
  // Gevroren
  'FZRA':'aanvriezende regen', 'FZDZ':'aanvrezende motregen',
  'FZFG':'aanvriezende mist',
  // Onweer
  'TS':'onweer', 'TSRA':'onweer met regen', 'TSSN':'onweer met sneeuw',
  'TSGR':'onweer met hagel',
  // Zicht
  'FG':'mist', 'BR':'nevel', 'HZ':'waas', 'FU':'rook',
  'VA':'vulkaanas', 'DU':'stof', 'SA':'zand', 'MIFG':'mistbanken',
  'BCFG':'banken mist', 'PRFG':'gedeeltelijke mist',
  // Wind
  'SQ':'windvlaag', 'FC':'windhoos', 'SS':'zandstorm', 'DS':'stofstorm',
  'BLSN':'stuifsneeuw', 'BLDU':'stuifstof', 'BLSA':'stuifzand',
  // Overig
  'PO':'stofwervel', 'VCSH':'buien in de buurt', 'VCTS':'onweer in de buurt',
};

const INTENSITEIT = {'-':'lichte ', '+':'zware ', 'VC':'in de buurt: '};

const COVER_NL = {
  'SKC':'onbewolkt', 'CLR':'onbewolkt', 'NSC':'geen significante bewolking',
  'CAVOK':'CAVOK – goed zicht, geen significante wolken',
  'FEW':'weinig bewolking', 'SCT':'gedeeltelijk bewolkt',
  'BKN':'grotendeels bewolkt', 'OVC':'geheel bewolkt', 'VV':'verticaal zicht',
};

const RICHTING_NL = {
  'N':'noord','NNO':'noord-noordoost','NO':'noordoost','ONO':'oost-noordoost',
  'O':'oost','OZO':'oost-zuidoost','ZO':'zuidoost','ZZO':'zuid-zuidoost',
  'Z':'zuid','ZZW':'zuid-zuidwest','ZW':'zuidwest','WZW':'west-zuidwest',
  'W':'west','WNW':'west-noordwest','NW':'noordwest','NNW':'noord-noordwest',
};

function graden_naar_richting(deg) {
  if (deg === null || deg === undefined) return '';
  const richtingen = ['N','NNO','NO','ONO','O','OZO','ZO','ZZO','Z','ZZW','ZW','WZW','W','WNW','NW','NNW'];
  const idx = Math.round(deg / 22.5) % 16;
  return richtingen[idx];
}

function vertaal_wx(wx) {
  if (!wx || wx === 'NSW') return '';
  let result = [];
  // Splits op bekende patronen
  const stukken = wx.split(/\s+/);
  for (let s of stukken) {
    if (!s) continue;
    let prefix = '';
    let code = s;
    if (s.startsWith('VC')) { prefix = 'in de buurt: '; code = s.slice(2); }
    else if (s.startsWith('+')) { prefix = 'zware '; code = s.slice(1); }
    else if (s.startsWith('-')) { prefix = 'lichte '; code = s.slice(1); }
    // Zoek in WX_NL
    if (WX_NL[code]) result.push(prefix + WX_NL[code]);
    else {
      // Probeer combinaties (TSRA = TS + RA)
      let gevonden = false;
      for (let len = 4; len >= 2; len--) {
        const deel = code.slice(0, len);
        const rest = code.slice(len);
        if (WX_NL[deel] && (rest === '' || WX_NL[rest])) {
          result.push(prefix + WX_NL[deel] + (rest ? ' met ' + WX_NL[rest] : ''));
          gevonden = true; break;
        }
      }
      if (!gevonden && s !== 'NSW') result.push(s);
    }
  }
  return result.join(', ');
}

function vertaal_wind(wdir, wspd, wgst, wunit) {
  if (wdir === undefined || wspd === undefined) return '';
  const kt = wunit === 'KMH' ? Math.round(wspd / 1.852) : (wunit === 'MPS' ? Math.round(wspd * 1.944) : wspd);
  const ms  = Math.round(kt * 0.5144 * 10) / 10;
  const bft = kt_naar_bft(kt);
  if (wspd === 0 && wdir === 0) return 'windstil';
  const richting = wdir === 990 ? 'veranderlijke richting' : `uit het ${graden_naar_richting(wdir)} (${wdir}°)`;
  let str = `${richting}, ${kt} kt (${ms} m/s, Bft ${bft})`;
  if (wgst) {
    const gkt = wunit === 'KMH' ? Math.round(wgst / 1.852) : (wunit === 'MPS' ? Math.round(wgst * 1.944) : wgst);
    const gms = Math.round(gkt * 0.5144 * 10) / 10;
    str += `, stoten tot ${gkt} kt (${gms} m/s)`;
  }
  return str;
}

function kt_naar_bft(kt) {
  const schaal = [1,3,6,10,16,21,27,33,40,47,55,63];
  for (let i = 0; i < schaal.length; i++) if (kt <= schaal[i]) return i;
  return 12;
}

function vertaal_zicht(visib) {
  if (visib === undefined || visib === null) return '';
  const v = parseFloat(visib);
  if (isNaN(v)) return visib;
  // API geeft SM (statute miles)
  if (v >= 6) return 'zicht 10 km of meer';
  const km = (v * 1.609).toFixed(2);
  const m  = Math.round(v * 1609);
  if (v >= 1) return `zicht ${km} km`;
  return `zicht ${m} m${m < 800 ? ' – mist' : m < 5000 ? ' – nevel' : ''}`;
}

function vertaal_wolken(clouds, cavok, wxString) {
  if (cavok || wxString === 'CAVOK') return 'CAVOK – geen significante wolken, zicht ≥10 km';
  if (!clouds || clouds.length === 0) return '';
  return clouds.map(c => {
    const cover = COVER_NL[c.cover] || c.cover;
    const hoogte = c.base !== undefined ? ` op ${c.base * 30} m (${c.base}00 ft)` : '';
    const type = c.type ? ` (${c.type === 'CB' ? 'cumulonimbus' : c.type === 'TCU' ? 'torencumulus' : c.type})` : '';
    return cover + hoogte + type;
  }).join('; ');
}

function vertaal_temp(temp, dewp) {
  if (temp === undefined) return '';
  let str = `temperatuur ${temp}°C`;
  if (dewp !== undefined) {
    str += `, dauwpunt ${dewp}°C`;
    const dep = temp - dewp;
    if (dep <= 2) str += ` (mistkans hoog, depressie ${dep}°)`;
    else if (dep <= 5) str += ` (nevel mogelijk)`;
  }
  return str;
}

function vertaal_qnh(altim) {
  if (!altim) return '';
  return `QNH ${altim.toFixed(0)} hPa`;
}

// ── METAR vertaler ─────────────────────────────────────────────────────────
function vertaal_metar(m) {
  if (!m) return '';
  const regels = [];

  // Observatietijd
  if (m.obsTime) {
    const d = new Date(m.obsTime * 1000);
    const utc = d.toUTCString().replace(':00 GMT','Z').slice(5);
    const lok = d.toLocaleString('nl-NL', {timeZone:'Europe/Amsterdam', hour:'2-digit', minute:'2-digit', day:'numeric', month:'short'});
    regels.push({cls:'', tekst:`Waarneming: ${lok} lokaal (${utc})`});
  }

  // Wind
  const wind = vertaal_wind(m.wdir, m.wspd, m.wgst, m.wunit);
  if (wind) regels.push({cls:'vt-wind', tekst: `Wind: ${wind}`});

  // Zicht
  const zicht = vertaal_zicht(m.visib);
  if (zicht) regels.push({cls:'vt-zicht', tekst: zicht.charAt(0).toUpperCase() + zicht.slice(1)});

  // Rvr
  if (m.rvr) regels.push({cls:'vt-zicht', tekst:`Baanzicht (RVR): ${m.rvr}`});

  // Weerfenomeen
  if (m.wxString && m.wxString !== 'CAVOK') {
    const wx = vertaal_wx(m.wxString);
    if (wx) regels.push({cls:'vt-wx', tekst:`Weer: ${wx}`});
  }

  // Wolken
  const wolken = vertaal_wolken(m.clouds, m.visib >= 6 && (!m.wxString || m.wxString === 'CAVOK'), m.wxString);
  if (wolken) regels.push({cls:'vt-wolken', tekst:`Bewolking: ${wolken}`});

  // Temperatuur + dauwpunt
  const temp = vertaal_temp(m.temp, m.dewp);
  if (temp) regels.push({cls:'vt-temp', tekst: temp.charAt(0).toUpperCase() + temp.slice(1)});

  // QNH
  const qnh = vertaal_qnh(m.altim);
  if (qnh) regels.push({cls:'vt-qnh', tekst: qnh});

  // Vluchtkategorie
  const cat = m.flightCategory;
  if (cat) {
    const uitleg = {
      'VFR':  'VFR – visuele vluchtomstandigheden (goed vliegweer)',
      'MVFR': 'MVFR – marginale visuele omstandigheden',
      'IFR':  'IFR – instrumentvluchten vereist (slecht zicht of lage wolken)',
      'LIFR': 'LIFR – laag IFR (zeer slecht zicht of zeer lage wolkenbasis)',
    };
    regels.push({cls: cat === 'VFR' ? 'vt-zicht' : cat === 'MVFR' ? 'vt-qnh' : 'vt-wx',
                 tekst: uitleg[cat] || cat});
  }

  return regels;
}

// ── TAF vertaler ───────────────────────────────────────────────────────────
function vertaal_taf_raw(raw) {
  if (!raw) return [];
  const regels = [];

  // Splits TAF in periodes
  const periodes = raw
    .replace(/\r?\n/g,' ')
    .replace(/\s{2,}/g,' ')
    .split(/(?=\b(?:BECMG|TEMPO|FM\d{6}|PROB\d{2}(?:\s+TEMPO)?)\b)/);

  for (let p of periodes) {
    p = p.trim();
    if (!p) continue;

    // Periodelabel
    let label = '';
    let rest  = p;
    const periodMatch = p.match(/^(TAF\s+\w+\s+\d{6}Z\s+\d{4}\/\d{4}|BECMG\s+\d{4}\/\d{4}|TEMPO\s+\d{4}\/\d{4}|FM\d{6}|PROB\d{2}(?:\s+TEMPO\s+\d{4}\/\d{4})?(?:\s+\d{4}\/\d{4})?)/);
    if (periodMatch) {
      label = periodMatch[1];
      rest  = p.slice(label.length).trim();
    }

    const deelRegels = [];

    // Label vertaling
    if (label) {
      let labelNL = '';
      if (label.startsWith('TAF')) {
        const geldig = label.match(/(\d{4})\/(\d{4})/);
        if (geldig) {
          labelNL = `TAF geldig van dag ${geldig[1].slice(0,2)} ${geldig[1].slice(2)}:00 UTC tot dag ${geldig[2].slice(0,2)} ${geldig[2].slice(2)}:00 UTC`;
        }
      } else if (label.startsWith('BECMG')) {
        const t = label.match(/(\d{4})\/(\d{4})/);
        labelNL = t ? `Geleidelijke overgang van dag ${parseInt(t[1].slice(0,2))} ${t[1].slice(2)}:00u tot dag ${parseInt(t[2].slice(0,2))} ${t[2].slice(2)}:00u UTC` : 'Geleidelijke overgang';
      } else if (label.startsWith('TEMPO')) {
        const t = label.match(/(\d{4})\/(\d{4})/);
        labelNL = t ? `Tijdelijk van dag ${parseInt(t[1].slice(0,2))} ${t[1].slice(2)}:00u tot dag ${parseInt(t[2].slice(0,2))} ${t[2].slice(2)}:00u UTC` : 'Tijdelijk';
      } else if (label.startsWith('FM')) {
        const fm = label.match(/FM(\d{2})(\d{2})(\d{2})/);
        labelNL = fm ? `Vanaf dag ${fm[1]} om ${fm[2]}:${fm[3]} UTC` : label;
      } else if (label.startsWith('PROB')) {
        const kans = label.match(/PROB(\d{2})/);
        const tempo = label.includes('TEMPO');
        labelNL = `${kans ? kans[1] + '% kans' : 'Kans'}${tempo ? ' (tijdelijk)' : ''}`;
      }
      if (labelNL) deelRegels.push({cls:'vt-periode', tekst: labelNL});
    }

    // Wind
    const windM = rest.match(/\b(\d{3}|VRB)(\d{2,3})(?:G(\d{2,3}))?(KT|MPS|KMH)\b/);
    if (windM) {
      const dir  = windM[1] === 'VRB' ? 990 : parseInt(windM[1]);
      const spd  = parseInt(windM[2]);
      const gust = windM[3] ? parseInt(windM[3]) : undefined;
      const unit = windM[4];
      const w = vertaal_wind(dir, spd, gust, unit);
      if (w) deelRegels.push({cls:'vt-wind', tekst:`Wind: ${w}`});
    }

    // Zicht
    const zichtM = rest.match(/\b(\d{4})\b/);
    const smM    = rest.match(/\b(\d+(?:\/\d+)?SM)\b/);
    if (zichtM && !windM?.[0]?.includes(zichtM[1])) {
      const m_val = parseInt(zichtM[1]);
      if (m_val <= 9999) {
        const zichtStr = m_val >= 9999 ? 'zicht 10 km of meer' : m_val >= 1000 ? `zicht ${(m_val/1000).toFixed(1)} km` : `zicht ${m_val} m`;
        deelRegels.push({cls:'vt-zicht', tekst: zichtStr.charAt(0).toUpperCase() + zichtStr.slice(1)});
      }
    } else if (smM) {
      const sm = smM[1];
      deelRegels.push({cls:'vt-zicht', tekst: vertaal_zicht(parseFloat(sm))});
    } else if (rest.includes('CAVOK')) {
      deelRegels.push({cls:'vt-zicht', tekst:'CAVOK – zicht ≥10 km, geen significante wolken'});
    }

    // Weerfenomeen
    const wxTokens = rest.match(/\b(?:[-+]?(?:VC)?(?:TS|DZ|RA|SN|SG|IC|GR|GS|UP|FZ(?:RA|DZ|FG)|BR|FG|FU|VA|DU|SA|HZ|PO|SQ|FC|SS|DS|BLSN|BLDU|BLSA|MIFG|BCFG|PRFG|NSW|VCTS|VCSH))+\b/g);
    if (wxTokens) {
      const wx = wxTokens.map(w => vertaal_wx(w)).filter(Boolean).join(', ');
      if (wx) deelRegels.push({cls:'vt-wx', tekst:`Weer: ${wx}`});
    }

    // Wolken
    const wolkMatches = [...rest.matchAll(/\b(SKC|CLR|NSC|FEW|SCT|BKN|OVC|VV)(\d{3})?(CB|TCU)?\b/g)];
    if (wolkMatches.length > 0) {
      const wolkStr = wolkMatches.map(wm => {
        const cover  = COVER_NL[wm[1]] || wm[1];
        const hoogte = wm[2] ? ` op ${parseInt(wm[2])*30} m (${wm[2]} ft × 100)` : '';
        const type   = wm[3] ? ` (${wm[3] === 'CB' ? 'cumulonimbus' : 'torencumulus'})` : '';
        return cover + hoogte + type;
      }).join('; ');
      deelRegels.push({cls:'vt-wolken', tekst:`Bewolking: ${wolkStr}`});
    }

    if (deelRegels.length > 0) regels.push(...deelRegels);
  }

  return regels;
}

// ── Hulpfuncties weergave ───────────────────────────────────────────────────
function regels_naar_html(regels) {
  if (!regels || regels.length === 0) return '';
  return regels.map(r =>

}

function zoekLuchthaven(query) {
  const q = query.toLowerCase().trim();
  if (!q) return [];
  // Directe ICAO match
  if (/^[A-Z]{4}$/i.test(q)) return [];
  // Zoek op naam
  return AIRPORTS.filter(([icao, nl, en]) =>
    nl.toLowerCase().includes(q) ||
    en.toLowerCase().includes(q) ||
    icao.toLowerCase().includes(q)
  ).slice(0, 6);
}

function suggesties(val) {
  const lijst = document.getElementById('suggestie-lijst');
  if (val.length < 2) { lijst.style.display = 'none'; return; }
  if (/^[A-Z]{4}$/i.test(val.trim())) { lijst.style.display = 'none'; return; }
  const resultaten = zoekLuchthaven(val);
  if (resultaten.length === 0) { lijst.style.display = 'none'; return; }
  lijst.style.display = 'block';
  lijst.innerHTML = resultaten.map(([icao, nl, en]) =>
    `<button onclick="toonCode('${icao}')" style="
      display:inline-block;margin:3px 4px;padding:5px 12px;
      background:#111e2e;border:1px solid #2a4a70;border-radius:16px;
      color:#a8c4e8;font-size:0.82em;font-weight:600;cursor:pointer;">
      <span style="color:#2ec4e8">${icao}</span> ${nl}
    </button>`
  ).join('');
}

const GROEPEN = [
  { label: "🇳🇱 Nederland", prefix: "EH" },
  { label: "🇧🇪 België",    prefix: "EB" },
  { label: "🇩🇪 Duitsland", prefix: "ED" },

  { label: "🇫🇷 Frankrijk", prefix: "LF" },
  { label: "Overig",        prefix: "" },
];

function bouwSidebar(data) {
  const stations = Object.entries(data)
    .filter(([k]) => !k.startsWith('_'))
    .map(([k, v]) => ({
      icao: k,
      naam: (v.metar?.name || k).replace(/\s*airport\s*/i,'').trim(),
      cat:  v.metar?.flightCategory || '',
    }))
    .sort((a, b) => a.icao.localeCompare(b.icao));

  const lijst = document.getElementById('sidebar-lijst');
  lijst.innerHTML = '';

  for (const groep of GROEPEN) {
    const items = groep.prefix
      ? stations.filter(s => s.icao.startsWith(groep.prefix))
      : stations.filter(s => !GROEPEN.slice(0,-1).some(g => s.icao.startsWith(g.prefix)));
    if (items.length === 0) continue;

    const titel = document.createElement('div');
    titel.className = 'sidebar-groep-titel';
    titel.textContent = groep.label;
    lijst.appendChild(titel);

    for (const s of items) {
      const div = document.createElement('div');
      div.className = 'sidebar-station';
      div.dataset.icao = s.icao;
      div.dataset.zoek = (s.icao + ' ' + s.naam).toLowerCase();
      const catKl = {VFR:'cat-vfr',MVFR:'cat-mvfr',IFR:'cat-ifr',LIFR:'cat-lifr'}[s.cat] || '';
      div.innerHTML = `<span class="icao">${s.icao}</span><span class="naam">${s.naam}</span>${s.cat ? `<span class="cat ${catKl}">${s.cat}</span>` : ''}`;
      div.onclick = () => {
        document.querySelectorAll('.sidebar-station').forEach(el => el.classList.remove('actief'));
        div.classList.add('actief');
        toonCode(s.icao);
      };
      lijst.appendChild(div);
    }
  }
}

function filterSidebar(val) {
  const q = val.toLowerCase();
  document.querySelectorAll('.sidebar-station').forEach(el => {
    el.style.display = el.dataset.zoek.includes(q) ? '' : 'none';
  });
  document.querySelectorAll('.sidebar-groep-titel').forEach(titel => {
    let volgende = titel.nextElementSibling;
    let zichtbaar = false;
    while (volgende && !volgende.classList.contains('sidebar-groep-titel')) {
      if (volgende.style.display !== 'none') zichtbaar = true;
      volgende = volgende.nextElementSibling;
    }
    titel.style.display = zichtbaar ? '' : 'none';
  });
}

function zoek() {
  document.getElementById('suggestie-lijst').style.display = 'none';
  const val = document.getElementById('zoek-input').value.trim();
  if (!val) return;
  // Directe ICAO-code
  if (/^[A-Z]{4}$/i.test(val)) { toonCode(val.toUpperCase()); return; }
  // Plaatsnaam → zoek eerste match
  const matches = zoekLuchthaven(val);
  if (matches.length === 1) {
    toonCode(matches[0][0]);
  } else if (matches.length > 1) {
    // Toon suggesties
    document.getElementById('suggestie-lijst').style.display = 'block';
    document.getElementById('suggestie-lijst').innerHTML =
      '<span style="font-size:0.78em;color:#6a8aaa;margin-right:8px;">Kies een vliegveld:</span>' +
      matches.map(([icao, nl]) =>
        `<button onclick="toonCode('${icao}')" style="display:inline-block;margin:3px 4px;padding:5px 12px;background:#111e2e;border:1px solid #2a4a70;border-radius:16px;color:#a8c4e8;font-size:0.82em;font-weight:600;cursor:pointer;"><span style="color:#2ec4e8">${icao}</span> ${nl}</button>`
      ).join('');
  } else {
    document.getElementById('resultaat').innerHTML =
      `<div class="fout">Geen luchthaven gevonden voor "${val}". Probeer een ICAO-code (bijv. EHRD).</div>`;
  }
}

function toonCode(code) {
  document.getElementById('zoek-input').value = code;
  const el = document.getElementById('resultaat');
  const entry = allData[code];
  if (!entry) {
    el.innerHTML = `<div class="fout">⚠ Geen data voor <strong>${code}</strong>.<br><small>Controleer de ICAO-code of wacht op de volgende update.</small></div>`;
    return;
  }
  toon(code, entry.metar, entry.taf);
}

function param(label, waarde, extraKlasse = 'param-waarde') {
  return `<div class="param"><div class="param-label">${label}</div><div class="${extraKlasse}">${waarde}</div></div>`;
}
function catKleur(cat) { return {VFR:'vfr',MVFR:'mvfr',IFR:'ifr',LIFR:'lifr'}[cat] || ''; }

function windStr(m) {
  if (m.wdir === undefined && !m.wspd) return '–';
  const dir = m.wdir === 0 && m.wspd === 0 ? 'Stil' : (m.wdir === 990 ? 'VRB' : m.wdir + '°');
  const snd  = m.wspd !== undefined ? m.wspd + ' kt' : '';
  const gust = m.wgst ? ' (stoot ' + m.wgst + ' kt)' : '';
  return `${dir} ${snd}${gust}`.trim();
}
function zichtStrKort(m) {
  if (!m.visib) return '–';
  const v = parseFloat(m.visib);
  if (v >= 6) return '≥10 km';
  return (v * 1.609).toFixed(1) + ' km';
}
function wolkenStrKort(m) {
  if (!m.clouds || m.clouds.length === 0) return m.wxString === 'CAVOK' ? 'CAVOK' : '–';
  return m.clouds.map(c => `${c.cover}${c.base !== undefined ? ' ' + c.base*30 + 'm' : ''}`).join(', ');
}
function formatTAF(raw) {
  if (!raw) return '–';
  return raw.replace(/\r?\n/g,' ').replace(/\s{2,}/g,' ')
    .replace(/(BECMG|TEMPO|FM\d{6}|PROB\d{2}\s+TEMPO|PROB\d{2})/g,'\n<span class="taf-periode">$1</span>')
    .replace(/(\d{5}(?:G\d{2,3})?(?:KT|MPS|KMH))/g,'<span class="taf-wind">$1</span>')
    .replace(/\b(CAVOK|[0-9]+SM|[0-9]{4})\b/g,'<span class="taf-zicht">$1</span>')
    .replace(/\b(SKC|FEW|SCT|BKN|OVC|VV)(\d{3})/g,'<span class="taf-wolken">$1$2</span>')
    .replace(/\b(-|\+)?(RA|SN|SG|DZ|GR|GS|FZRA|FZDZ|TSRA|TS|BR|FG|MIFG|FU|HZ|BLSN|SQ|FC)\b/g,'<span class="taf-wx">$&</span>');
}

function toon(code, m, t) {
  const el = document.getElementById('resultaat');
  if (!m) { el.innerHTML = `<div class="fout">Geen METAR voor ${code}</div>`; return; }
  const cat  = m.flightCategory || '';
  const naam = m.name || m.stationId || code;
  const tijd = m.obsTime ? new Date(m.obsTime*1000).toUTCString().replace(':00 GMT','Z').slice(5) : '';

  const metarVertaling = vertaal_metar(m);
  const tafVertaling   = t ? vertaal_taf_raw(t.rawTAF || t.tafText || '') : [];

  let html = `
    <div class="station-info">
      <span class="station-naam">${naam}</span>
      <span class="cat-badge cat-${cat}">${cat}</span>
      &nbsp;·&nbsp; ${m.stationId||code}
      ${m.lat ? '&nbsp;·&nbsp; ' + m.lat.toFixed(2) + '°N ' + (m.lon||0).toFixed(2) + '°E' : ''}
      ${m.elev ? '&nbsp;·&nbsp; ' + m.elev + 'm' : ''}
    </div>
    <div class="blok">
      <div class="blok-header">
        <span class="blok-titel">METAR</span>
        <span class="blok-tijd">${tijd}</span>
      </div>
      <div class="raw-metar">${m.rawOb||'–'}</div>
      ${vertaling_blok(metarVertaling)}
      <div class="decoded">
        <div class="decoded-grid">
          ${param('Temperatuur', m.temp !== undefined ? m.temp + ' °C' : '–')}
          ${param('Dauwpunt',    m.dewp !== undefined ? m.dewp + ' °C' : '–')}
          ${param('Wind',        windStr(m))}
          ${param('Zichtbaarheid', zichtStrKort(m))}
          ${param('QNH',         m.altim ? m.altim.toFixed(0) + ' hPa' : '–')}
          ${param('Wolken',      wolkenStrKort(m))}
          ${param('Weerfenomeen',m.wxString || 'geen')}
          ${param('Vluchtcat.',  cat, 'param-waarde ' + catKleur(cat))}
        </div>
      </div>
    </div>`;

  if (t) {
    const tafTijd = t.issueTime ? new Date(t.issueTime*1000).toUTCString().replace(':00 GMT','Z').slice(5) : '';
    html += `
      <div class="blok">
        <div class="blok-header">
          <span class="blok-titel">TAF</span>
          <span class="blok-tijd">afgifte: ${tafTijd}</span>
        </div>
        <div class="taf-raw">${formatTAF(t.rawTAF || t.tafText || '')}</div>
        ${vertaling_blok(tafVertaling)}
      </div>`;
  } else {
    html += `<div class="blok"><div class="status">Geen TAF beschikbaar voor ${code}</div></div>`;
  }
  el.innerHTML = html;
}

// ── Luchtvaart bulletin ───────────────────────────────────────────────────
function laadBulletin() {
  fetch("luchtvaart_bulletin.json?t=" + Date.now())
    .then(r => r.json())
    .then(data => {
      if (!data || !data.tekst) return;
      document.getElementById('bulletin-wrap').innerHTML = `
        <div class="bulletin-blok">
          <div class="bulletin-header">
            <span class="bulletin-titel">✈️ Weerbulletin kleine luchtvaart (KNMI)</span>
            <span class="bulletin-tijd">${data.tijd || ''} · bijgewerkt: ${data.update || ''}</span>
          </div>
          <div class="bulletin-tekst">${data.tekst}</div>
          <div class="bulletin-link">
            Bron: <a href="https://www.knmi.nl/nederland-nu/luchtvaart/weerbulletin-kleine-luchtvaart" target="_blank">knmi.nl</a>
            &nbsp;·&nbsp;
            <a href="https://www.luchtvaartmeteo.nl/" target="_blank">luchtvaartmeteo.nl</a>
          </div>
        </div>`;
    })
    .catch(() => {});
}

laadBulletin();
</script>
</body>
</html>
