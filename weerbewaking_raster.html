<!doctype html>
<html lang="nl">
<head><script src="/weerlab-native-only.js?v=20261027-audit2"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Weerbewaking – Weekraster</title>
<link rel="stylesheet" href="weerbewaking_raster.css?v=20261026-1">
<style>
#gate{position:fixed;inset:0;z-index:9999;background:radial-gradient(ellipse at 50% 40%,#0f3a6b 0,#00448a 70%);display:flex;align-items:center;justify-content:center;color:#fff;font-family:system-ui,'Segoe UI',sans-serif}
#gate[hidden]{display:none}
#gate form{background:rgba(0,0,0,.28);border:1px solid rgba(255,255,255,.3);border-radius:14px;padding:28px 30px;width:min(360px,90vw);text-align:center;box-shadow:0 18px 50px rgba(0,0,0,.45)}
#gate h1{font-size:20px;margin:0 0 4px} #gate p{margin:0 0 16px;font-size:13px;opacity:.8}
#gate input{width:100%;padding:11px 13px;border-radius:8px;border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.12);color:#fff;font-size:16px;text-align:center;outline:none}
#gate input:focus{border-color:#ffe000} #gate button{margin-top:12px;width:100%;padding:11px;border-radius:8px;border:0;background:#ffe000;color:#00305e;font-weight:700;font-size:15px;cursor:pointer}
#gate .err{color:#ffb4b4;font-size:13px;min-height:18px;margin-top:10px}
</style>
</head>
<body>
<div id="gate" hidden><form id="gateForm" autocomplete="off"><h1>Weekraster</h1><p>Beta · voer het wachtwoord in</p>
<input id="gatePw" type="password" placeholder="Wachtwoord" autocomplete="off" autofocus><button type="submit">Openen</button><div class="err" id="gateErr"></div></form></div>

<div id="defs"></div>
<header id="bar">
  <div class="titlewrap"><a class="back" href="weerbewaking.html" onclick="if(window.parent!==window){try{window.parent.openWeerbewakingSubpage('home',false);return false}catch(e){}}">← Overzicht</a><div class="title">Weekraster</div></div>
  <div class="tools">
    <span class="viewwrap"><button id="viewBtn" title="Onderdelen in het raster aan of uit zetten">👁</button><div id="viewMenu" hidden></div></span>
    <button id="report" title="Weerbericht, kopiëren en exporteren">📝</button>
    <button id="tgLeft" title="Paneel met huidig weer tonen/verbergen">◧</button>
    <button id="tgRight" title="Plaatsenlijst tonen/verbergen">◨</button>
    <button id="prev" title="Eerder">‹</button>
    <button id="next" title="Later">›</button>
    <select id="selSrc" title="Gegevensbron"></select>
    <select id="selDays" title="Aantal dagen"><option value="7">7 dagen</option><option value="10">10 dagen</option></select>
    <select id="selWind" title="Wind"></select>
    <select id="selTemp" title="Temperatuur"><option value="c">°C</option><option value="f">°F</option></select>
    <button id="refresh" title="Vernieuwen (Ctrl+R)">⟳</button>
    <button id="gear" title="Voorkeuren">⚙</button>
  </div>
</header>
<main>
  <aside id="left"></aside>
  <section id="grid"></section>
  <aside id="right">
    <div class="search"><span>🔍</span><input id="q" placeholder="Zoek een plaats" autocomplete="off"></div>
    <div id="list"></div>
  </aside>
</main>
<div id="pop" hidden></div>
<div id="ctx" hidden></div>
<div id="modal" hidden><div class="card" id="prefs"></div></div>
<script>
/* Toegang: alleen deze pagina vraagt een wachtwoord (lichte beta-poort, geen echte beveiliging).
   Wie al via de weerbewaking-hub is ingelogd (sessionStorage wb_unlocked) komt direct binnen. */
(function () {
  var HASH = "ac1e10ab1516037572531e6cade521ae938bc6b11077dec11a5a03a6b913d4f2", KEY = 'raster_ok', LIBS = ['weerbewaking_raster_core.js','weerbewaking_raster_icons.js','weerbewaking_raster_grid.js','weerbewaking_raster_app.js'], V = '20261027-native-audit2';
  function ok() { try { return sessionStorage.getItem(KEY) === '1' || sessionStorage.getItem('wb_unlocked') === '1'; } catch (e) { return false; } }
  function boot() {
    var i = 0; (function next() { if (i >= LIBS.length) return; var s = document.createElement('script'); s.src = LIBS[i++] + '?v=' + V; s.onload = next; s.onerror = function(){ document.getElementById('grid').innerHTML = '<div class="empty">Kon ' + s.src + ' niet laden.</div>'; }; document.body.appendChild(s); })();
  }
  function hex(buf) { return Array.prototype.map.call(new Uint8Array(buf), function (b) { return ('0' + b.toString(16)).slice(-2); }).join(''); }
  if (ok()) { boot(); return; }
  var gate = document.getElementById('gate'), form = document.getElementById('gateForm'), pw = document.getElementById('gatePw'), err = document.getElementById('gateErr');
  gate.hidden = false; setTimeout(function () { pw.focus(); }, 50);
  form.addEventListener('submit', function (e) {
    e.preventDefault(); err.textContent = '';
    if (!(window.crypto && crypto.subtle)) { err.textContent = 'Open deze pagina via https (of localhost).'; return; }
    crypto.subtle.digest('SHA-256', new TextEncoder().encode(pw.value.trim())).then(function (d) {
      if (hex(d) === HASH) { try { sessionStorage.setItem(KEY, '1'); } catch (x) {} gate.hidden = true; boot(); }
      else { err.textContent = 'Onjuist wachtwoord'; pw.select(); }
    });
  });
})();
</script>
</body>
</html>
