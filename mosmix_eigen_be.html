<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Eigen Weerkaart België – Ed Aldus WM</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: Arial, sans-serif; background: #f0f4f8; color: #1a2b40; }
.header { background: #00205b; padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; border-bottom: 2px solid #2ec4e8; }
.header-titel { color: white; font-size: 14px; font-weight: 700; }
.header-sub { color: #a8c4e8; font-size: 11px; margin-top: 2px; }
.toolbar { background: white; padding: 10px 16px; display: flex; gap: 6px; flex-wrap: wrap; align-items: center; border-bottom: 1px solid #dde6f0; }
.toolbar-label { font-size: 11px; font-weight: 700; color: #555; text-transform: uppercase; margin-right: 4px; }
.chk { padding: 4px 12px; border-radius: 14px; border: 1px solid #c5d3e3; background: #f0f4f8; color: #888; font-size: 11px; font-weight: 600; cursor: pointer; transition: all 0.12s; user-select: none; }
.chk:hover { background: #dce9f7; }
.chk.aan { color: white; border-color: transparent; background: #003366; }
.dag-btn { padding: 5px 14px; border-radius: 16px; border: 1px solid #c5d3e3; background: #f0f4f8; color: #2a4a70; font-size: 12px; font-weight: 600; cursor: pointer; }
.dag-btn.actief { background: #0d9488; color: white; border-color: #0d9488; }
.ctrl-row { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; padding: 8px 16px; background: #fafbfc; border-bottom: 1px solid #eef2f6; }
select.prim { padding: 4px 8px; border-radius: 6px; border: 1px solid #c5d3e3; font-size: 11px; background: white; }
.btn-opslaan { padding: 5px 16px; border-radius: 16px; border: none; background: #003366; color: white; font-size: 12px; font-weight: 700; cursor: pointer; margin-left: auto; }
.kaart-wrap { display: flex; justify-content: center; padding: 16px; }
.kaart-box { width: 100%; max-width: 700px; }
.kaart-header-band { background: #003366; color: white; padding: 8px 14px; border-radius: 4px 4px 0 0; display: flex; justify-content: space-between; align-items: center; }
.kaart-header-band .links { font-size: 13px; font-weight: 700; }
.kaart-header-band .sub { font-size: 10px; color: #a8c8e8; margin-top: 1px; }
.kaart-header-band .rechts { font-size: 13px; font-weight: 700; text-align: right; }
.kaart-header-band .rechts-sub { font-size: 10px; color: #a8c8e8; }
.kaart-container { position: relative; width: 100%; }
.kaart-container img { width: 100%; display: block; border-radius: 0 0 4px 4px; }
.kaart-container svg { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
.legenda-actief { display: flex; gap: 12px; flex-wrap: wrap; padding: 8px 16px; font-size: 11px; color: #555; justify-content: center; }
.legenda-actief span { display: flex; align-items: center; gap: 4px; }
.leg-blok { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }
#status { text-align: center; padding: 40px; color: #888; font-size: 13px; }
</style>
</head>
<body>
<div class="header">
  <div>
    <div class="header-titel">Ed Aldus WM — Eigen Weerkaart België</div>
    <div class="header-sub">DWD MOSMIX voorspelling · <span id="hdr-run">laden...</span></div>
  </div>
  <div style="text-align:right;color:#a8c4e8;font-size:11px;">
    <div id="hdr-update"></div>
  </div>
</div>

<div class="toolbar">
  <span class="toolbar-label">Lagen:</span>
  <button class="chk aan" data-laag="TX">🌡 TX</button>
  <button class="chk aan" data-laag="TN">❄ TN</button>
  <button class="chk" data-laag="RR">🌧 Neerslag</button>
  <button class="chk" data-laag="SQ">☀ Zon</button>
  <button class="chk aan" data-laag="FF">🌬 Wind</button>
  <button class="chk" data-laag="FX">💨 Windstoot</button>
  <button class="chk" data-laag="Neff">☁ Bewolking</button>
  <button class="chk" data-laag="TTD">💧 Dauwpunt</button>
  <button class="chk" data-laag="gevoels">🥶 Gevoels</button>
  <button class="chk" data-laag="wwM">🌫 Mist</button>
  <button class="chk" data-laag="VV">👁 Zicht</button>
  <button class="chk" data-laag="wwZ">🧊 Hagel</button>
</div>

<div class="ctrl-row">
  <span class="toolbar-label">Dag:</span>
  <div id="dag-btns"></div>
  <span class="toolbar-label" style="margin-left:12px;">Bolletje kleur:</span>
  <select class="prim" id="sel-primair" onchange="teken()">
    <option value="TX">TX Max</option>
    <option value="TN">TN Min</option>
    <option value="FF">Wind</option>
    <option value="RR">Neerslag</option>
    <option value="Neff">Bewolking</option>
  </select>
  <button class="btn-opslaan" onclick="slaOp()">⬇ PNG</button>
</div>

<div class="kaart-wrap">
  <div class="kaart-box">
    <div class="kaart-header-band">
      <div><div class="links">Ed Aldus WM</div><div class="sub">Eigen weerkaart · DWD MOSMIX</div></div>
      <div style="text-align:right;"><div class="rechts" id="kaart-dag">–</div><div class="rechts-sub" id="kaart-lagen">–</div></div>
    </div>
    <div class="kaart-container">
      <img src="kaart_basis_be.png" id="kaart-basis" alt="Basiskaart" crossorigin="anonymous">
      <svg id="nl-kaart" viewBox="0 0 800 1100" xmlns="http://www.w3.org/2000/svg"></svg>
    </div>
  </div>
</div>
<div class="legenda-actief" id="legenda"></div>
<div id="status">Laden...</div>
<div style="text-align:center;font-size:11px;color:#888;padding:6px 0;">© Ed Aldus WM · Data: DWD MOSMIX</div>

<script>
const LON_MIN=1.5, LON_MAX=6.6, LAT_MIN=49.2, LAT_MAX=51.7;
const SVG_W=800, SVG_H=1100;
function lonToX(lon){return (lon-LON_MIN)/(LON_MAX-LON_MIN)*SVG_W;}
function latToY(lat){return (1-(lat-LAT_MIN)/(LAT_MAX-LAT_MIN))*SVG_H;}
function ns(tag){return document.createElementNS("http://www.w3.org/2000/svg",tag);}

const NL_DAGEN=["Zo","Ma","Di","Wo","Do","Vr","Za"];
function dagLabel(d){return NL_DAGEN[d.getDay()]+" "+d.getDate()+"/"+(d.getMonth()+1);}

const BFT=[0.3,1.6,3.4,5.5,8.0,10.8,13.9,17.2,20.8,24.5,28.5,32.7];
function kmhBft(kmh){if(!kmh)return 0;let b=0;for(let i=0;i<BFT.length;i++){if(kmh/3.6>=BFT[i])b=i+1;else break;}return b;}
function windpijl(dd){if(dd==null)return "";const p=["↓","↙","←","↖","↑","↗","→","↘"];return p[Math.round(dd/45)%8];}

function hexToRgb(h){return [parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];}
function interpKleur(val,schaal,stops){
  const t=Math.max(0,Math.min(1,(val-schaal[0])/(schaal[1]-schaal[0])));
  const c=stops.map(s=>hexToRgb(s[0]));
  const idx=Math.min(c.length-2,Math.floor(t*(c.length-1)));
  const f=t*(c.length-1)-idx;
  const a=c[idx],b=c[idx+1];
  const r=Math.round(a[0]+f*(b[0]-a[0])),g=Math.round(a[1]+f*(b[1]-a[1])),bl=Math.round(a[2]+f*(b[2]-a[2]));
  const lum=(0.299*r+0.587*g+0.114*bl)/255;
  return [`rgb(${r},${g},${bl})`,lum<0.55?"white":"#222"];
}

const PARAMS = {
  TX:  {label:"TX",    kleur:"#c0392b", eenheid:"°", dec:1, pos:"boven",
        kleuren:[["#084594","≤0"],["#4292c6","5"],["#9ecae1","10"],["#ffffcc","15"],["#fed976","20"],["#fd8d3c","25"],["#800026","30+"]],schaal:[-5,35]},
  TN:  {label:"TN",    kleur:"#2471a3", eenheid:"°", dec:1, pos:"boven2",
        kleuren:[["#084594","≤-5"],["#4292c6","0"],["#9ecae1","5"],["#ffffcc","10"],["#fed976","15"]],schaal:[-10,15]},
  RR:  {label:"RR",    kleur:"#1a5276", eenheid:"mm", dec:1, pos:"rechts_boven",
        kleuren:[["#f7fbff","0"],["#c6dbef","2"],["#6baed6","5"],["#2171b5","10"],["#084594","20"]],schaal:[0,30]},
  SQ:  {label:"Zon",   kleur:"#b7950b", eenheid:"u", dec:1, pos:"rechts_onder",
        kleuren:[["#888","0"],["#c8c8c8","2"],["#FFB347","5"],["#FFC200","8"],["#FFD700","12+"]],schaal:[0,12]},
  FF:  {label:"Wind",  kleur:"#1a7a4a", eenheid:"", dec:0, pos:"links",
        kleuren:[["#e8f5e9","1-2"],["#a5d6a7","3"],["#ffeb3b","4"],["#ff9800","5"],["#f44336","6"],["#b71c1c","7+"]],schaal:[0,50]},
  FX:  {label:"Stoot", kleur:"#6c3483", eenheid:"km/h", dec:0, pos:"links_boven",
        kleuren:[["#e8f5e9","20"],["#a5d6a7","40"],["#ffeb3b","60"],["#ff9800","80"],["#f44336","100"]],schaal:[20,120]},
  Neff:{label:"Bew",   kleur:"#616161", eenheid:"%", dec:0, pos:"onder",
        kleuren:[["#FFD700","0"],["#c8c8c8","50"],["#444","100"]],schaal:[0,100]},
  TTD: {label:"Dauw",  kleur:"#2980b9", eenheid:"°", dec:1, pos:"links_onder",
        kleuren:[["#1a3a6b","≤-5"],["#2980b9","0"],["#a8d8ea","5"],["#ffffcc","10"],["#fed976","15"]],schaal:[-5,20]},
  gevoels:{label:"Gev",kleur:"#5b2c6f",eenheid:"°",dec:1, pos:"links_onder",
        kleuren:[["#4a0080","≤-15"],["#1a3a6b","-10"],["#2980b9","-5"],["#a8d8ea","0"],["#e8f4f8","5"],["#ffffcc","10+"]],schaal:[-15,10]},
  wwM: {label:"Mist",  kleur:"#7f8c8d", eenheid:"%", dec:0, pos:"onder2",
        kleuren:[["#f7fbff","0"],["#6baed6","30"],["#084594","70"]],schaal:[0,90]},
  VV:  {label:"Zicht", kleur:"#5d4037", eenheid:"km", dec:1, pos:"rechts_onder",
        kleuren:[["#4a0080","≤0.2"],["#6baed6","1"],["#ffffcc","5"],["#f7fbff","10+"]],schaal:[0,10]},
  wwZ: {label:"Hagel", kleur:"#c0392b", eenheid:"%", dec:0, pos:"onder2",
        kleuren:[["#f7fbff","0"],["#ffeb3b","20"],["#f44336","50"]],schaal:[0,70]},
};

// Positie offsets rond het bolletje (R=16)
const R = 16;
const POSITIES = {
  boven:        {dx:0,   dy:-R-8,  anchor:"middle"},
  boven2:       {dx:0,   dy:-R-20, anchor:"middle"},
  rechts_boven: {dx:R+18,dy:-4,    anchor:"start"},
  rechts_onder: {dx:R+18,dy:10,    anchor:"start"},
  onder:        {dx:0,   dy:R+14,  anchor:"middle"},
  onder2:       {dx:0,   dy:R+26,  anchor:"middle"},
  links:        {dx:-R-18,dy:4,    anchor:"end"},
  links_boven:  {dx:-R-18,dy:-8,   anchor:"end"},
  links_onder:  {dx:-R-18,dy:16,   anchor:"end"},
};

let mosmixData = null, huidigDag = null;
const actieveLagen = new Set(["TX","TN","FF"]);

function txtLabel(svg, x, y, tekst, kleur, anchor, size) {
  size = size || 10;
  const w = tekst.length * size * 0.6 + 6;
  const bg = ns("rect");
  const rx = anchor === "middle" ? x - w/2 : anchor === "end" ? x - w : x;
  bg.setAttribute("x", rx); bg.setAttribute("y", y - size + 1);
  bg.setAttribute("width", w); bg.setAttribute("height", size + 3);
  bg.setAttribute("rx", "2"); bg.setAttribute("fill", "rgba(255,255,255,0.88)");
  bg.setAttribute("stroke", "#ccc"); bg.setAttribute("stroke-width", "0.3");
  svg.appendChild(bg);

  const t = ns("text");
  t.setAttribute("x", x); t.setAttribute("y", y);
  t.setAttribute("text-anchor", anchor);
  t.setAttribute("font-size", size); t.setAttribute("font-weight", "bold");
  t.setAttribute("font-family", "Arial,sans-serif");
  t.setAttribute("fill", kleur);
  t.textContent = tekst;
  svg.appendChild(t);
}

function formatVal(param, val) {
  if (val == null) return null;
  if (param === "FF") return windpijl(null) + val.toFixed(0) + "·" + kmhBft(val) + "Bft";
  if (param === "FX") return val.toFixed(0);
  if (param === "VV") return val < 10 ? Math.round(val*1000) + "m" : val.toFixed(0) + "km";
  if (param === "Neff") return val + "%";
  if (param === "wwM" || param === "wwZ") return val + "%";
  if (param === "SQ") return val.toFixed(1) + "u";
  if (param === "RR") return val.toFixed(1);
  return val.toFixed(PARAMS[param]?.dec ?? 1) + (PARAMS[param]?.eenheid || "");
}

function teken() {
  const svg = document.getElementById("nl-kaart");
  svg.innerHTML = "";
  if (!mosmixData || !huidigDag) return;

  const dagObj = mosmixData.data[huidigDag];
  if (!dagObj) return;

  const stations = mosmixData.stations;
  const primParam = document.getElementById("sel-primair").value;
  const primData = dagObj[primParam] || {};
  const primP = PARAMS[primParam];

  // Update header
  const d = new Date(huidigDag + "T12:00:00");
  document.getElementById("kaart-dag").textContent = dagLabel(d);
  const laagNamen = [...actieveLagen].map(l => PARAMS[l]?.label || l).join(" · ");
  document.getElementById("kaart-lagen").textContent = laagNamen || "Geen lagen";

  // Teken stations
  Object.entries(stations).forEach(([naam, coords]) => {
    const cx = lonToX(coords[0]), cy = latToY(coords[1]);
    const g = ns("g");

    // Bolletje (kleur = primaire parameter)
    const primVal = primData[naam];
    let bg = "#ccc", fg = "#333";
    if (primVal != null && primP) {
      [bg, fg] = interpKleur(primVal, primP.schaal, primP.kleuren);
    }

    const circle = ns("circle");
    circle.setAttribute("cx", cx); circle.setAttribute("cy", cy);
    circle.setAttribute("r", R); circle.setAttribute("fill", bg);
    circle.setAttribute("stroke", "white"); circle.setAttribute("stroke-width", "1.5");
    g.appendChild(circle);
    svg.appendChild(g);

    // Labels per actieve laag
    const gebruiktePos = new Set();
    actieveLagen.forEach(laag => {
      const p = PARAMS[laag];
      if (!p) return;
      const val = dagObj[laag]?.[naam];
      if (val == null) return;

      // Wind: speciaal — pijl + Bft
      if (laag === "FF") {
        const dd = dagObj["DD"]?.[naam];
        const pijl = windpijl(dd);
        const bft = kmhBft(val);
        const tekst = pijl + val.toFixed(0) + "·" + bft + "Bft";
        let pos = POSITIES[p.pos];
        txtLabel(svg, cx + pos.dx, cy + pos.dy, tekst, p.kleur, pos.anchor, 9);
        gebruiktePos.add(p.pos);
        return;
      }

      // Bepaal positie (als al bezet, zoek alternatief)
      let posKey = p.pos;
      if (gebruiktePos.has(posKey)) {
        // Zoek vrije positie
        const alt = ["rechts_boven","rechts_onder","links_boven","links_onder","onder","onder2","boven2"];
        for (const a of alt) {
          if (!gebruiktePos.has(a)) { posKey = a; break; }
        }
      }
      gebruiktePos.add(posKey);
      const pos = POSITIES[posKey];

      const tekst = formatVal(laag, val);
      if (!tekst) return;
      txtLabel(svg, cx + pos.dx, cy + pos.dy, tekst, p.kleur, pos.anchor, 9);
    });
  });

  // Copyright
  const cr = ns("text");
  cr.setAttribute("x", SVG_W - 10); cr.setAttribute("y", SVG_H - 12);
  cr.setAttribute("text-anchor", "end"); cr.setAttribute("font-size", "16");
  cr.setAttribute("font-family", "Arial,sans-serif"); cr.setAttribute("font-style", "italic");
  cr.setAttribute("fill", "#888"); cr.textContent = "© Ed Aldus / DWD MOSMIX";
  svg.appendChild(cr);

  // Legenda (primaire parameter)
  if (primP) {
    document.getElementById("legenda").innerHTML = primP.kleuren.map(([k, l]) =>
      `<span><span class="leg-blok" style="background:${k}"></span>${l}</span>`
    ).join("");
  }

  document.getElementById("status").textContent = "";
}

function maakDagKnoppen() {
  const wrap = document.getElementById("dag-btns");
  wrap.innerHTML = "";
  const vandaag = new Date().toISOString().slice(0, 10);
  mosmixData.dagen.forEach((dag, i) => {
    const btn = document.createElement("button");
    btn.className = "dag-btn" + (dag === huidigDag ? " actief" : "");
    const d = new Date(dag + "T12:00:00");
    btn.textContent = i === 0 && dag === vandaag ? "Vandaag" : i === 1 ? "Morgen" : dagLabel(d);
    btn.onclick = () => {
      huidigDag = dag;
      document.querySelectorAll(".dag-btn").forEach(b => b.classList.remove("actief"));
      btn.classList.add("actief");
      teken();
    };
    wrap.appendChild(btn);
  });
}

// Toggle lagen
document.querySelectorAll(".chk").forEach(btn => {
  btn.addEventListener("click", () => {
    const laag = btn.dataset.laag;
    if (actieveLagen.has(laag)) {
      actieveLagen.delete(laag);
      btn.classList.remove("aan");
    } else {
      actieveLagen.add(laag);
      btn.classList.add("aan");
    }
    teken();
  });
});

// PNG export
function slaOp() {
  const img = document.getElementById("kaart-basis");
  const svg = document.getElementById("nl-kaart");
  const canvas = document.createElement("canvas");
  const scale = 2;
  const hdrH = 44;
  canvas.width = img.naturalWidth * scale;
  canvas.height = (img.naturalHeight + hdrH) * scale;
  const ctx = canvas.getContext("2d");
  ctx.scale(scale, scale);

  // Header
  ctx.fillStyle = "#003366"; ctx.fillRect(0, 0, img.naturalWidth, hdrH);
  ctx.fillStyle = "white"; ctx.font = "bold 14px Arial"; ctx.textAlign = "left";
  ctx.fillText("Ed Aldus WM — Eigen Weerkaart België", 14, 20);
  ctx.fillStyle = "#a8c8e8"; ctx.font = "10px Arial";
  const lagen = [...actieveLagen].map(l => PARAMS[l]?.label || l).join(" · ");
  ctx.fillText(lagen, 14, 34);
  ctx.textAlign = "right"; ctx.fillStyle = "white"; ctx.font = "bold 14px Arial";
  ctx.fillText(document.getElementById("kaart-dag").textContent, img.naturalWidth - 14, 20);
  ctx.fillStyle = "#a8c8e8"; ctx.font = "10px Arial";
  ctx.fillText("DWD MOSMIX", img.naturalWidth - 14, 34);
  ctx.textAlign = "left";

  // Kaart
  ctx.drawImage(img, 0, hdrH, img.naturalWidth, img.naturalHeight);

  // SVG
  const svgStr = new XMLSerializer().serializeToString(svg);
  const blob = new Blob([svgStr], {type: "image/svg+xml;charset=utf-8"});
  const url = URL.createObjectURL(blob);
  const svgImg = new Image();
  svgImg.onload = () => {
    ctx.drawImage(svgImg, 0, hdrH, img.naturalWidth, img.naturalHeight);
    URL.revokeObjectURL(url);
    const a = document.createElement("a");
    a.download = "eigen_kaart_" + huidigDag + ".png";
    a.href = canvas.toDataURL("image/png");
    a.click();
  };
  svgImg.src = url;
}

// Laden
fetch("mosmix_be.json?t=" + Date.now())
  .then(r => r.json())
  .then(json => {
    mosmixData = json;
    huidigDag = json.dagen[0];
    document.getElementById("hdr-run").textContent = "Run: " + (json.run || "").replace("T", " ").replace(":00:00Z", " UTC");
    document.getElementById("hdr-update").textContent = "Bijgewerkt: " + (json.bijgewerkt || "");
    maakDagKnoppen();
    teken();
  })
  .catch(e => { document.getElementById("status").textContent = "Fout: " + e.message; });
</script>
</body>
</html>
