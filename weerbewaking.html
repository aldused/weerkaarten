<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Weerbewaking – Ed Aldus WM</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0b0f1a;--bg2:#111826;--panel:#161f2e;--border:#1e2d42;--text:#d8e8f4;--text2:#6a8aaa;--accent:#2ec4e8;--gold:#f0c040}
body{font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}

/* ── PIN-SCHERM ── */
#pin-scherm{
  position:fixed;inset:0;z-index:999;
  background:radial-gradient(ellipse at 50% 40%,#0f1e3a 0%,#070b14 100%);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;
}
.pin-logo{font-size:3rem;margin-bottom:4px}
.pin-titel{font-size:1.3rem;font-weight:700;color:white;letter-spacing:.04em}
.pin-sub{font-size:.8rem;color:var(--text2)}
.pin-dots{display:flex;gap:14px;margin:8px 0}
.pin-dot{width:16px;height:16px;border-radius:50%;border:2px solid var(--text2);transition:all .2s}
.pin-dot.gevuld{background:var(--accent);border-color:var(--accent);box-shadow:0 0 8px rgba(46,196,232,0.5)}
.pin-dot.fout{background:#cc2222;border-color:#cc2222}
.pin-keypad{display:grid;grid-template-columns:repeat(3,72px);gap:10px}
.pin-key{
  height:72px;border-radius:12px;border:1px solid var(--border);
  background:var(--panel);color:var(--text);
  font-size:1.5rem;font-weight:600;cursor:pointer;
  font-family:Inter,sans-serif;transition:all .1s;
  display:flex;align-items:center;justify-content:center;
  user-select:none;
}
.pin-key:hover{background:#1e2d42;border-color:var(--accent);color:white}
.pin-key:active{transform:scale(0.94);background:#0f3060}
.pin-key.wis{font-size:1rem;color:var(--text2)}
.pin-fout-tekst{font-size:.8rem;color:#cc5555;height:18px;text-align:center}
#pin-scherm.verborgen{display:none}

/* ── HEADER ── */
.header{background:#071428;border-bottom:2px solid var(--accent);padding:10px 20px;display:flex;align-items:center;justify-content:space-between}
.header h1{font-size:1rem;font-weight:700;color:white;display:flex;align-items:center;gap:8px}
.header-sub{font-size:.7rem;color:var(--text2);margin-top:2px}
#klok{font-size:.8rem;color:var(--text2)}
.btn-slot{padding:5px 12px;border-radius:6px;background:rgba(240,192,64,0.12);border:1px solid var(--gold);color:var(--gold);font-size:.75rem;font-weight:600;cursor:pointer;font-family:Inter,sans-serif}
.btn-slot:hover{background:rgba(240,192,64,0.22)}

/* ── INHOUD ── */
#inhoud{padding:20px;display:none}
.inhoud-placeholder{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:80px 20px;color:var(--text2);text-align:center;gap:12px;
}
.inhoud-placeholder .icoon{font-size:3rem;opacity:.4}
.inhoud-placeholder p{font-size:.9rem;max-width:360px;line-height:1.6}
</style>
</head>
<body>

<!-- ── PIN-SCHERM ── -->
<div id="pin-scherm">
  <div class="pin-logo">🔒</div>
  <div class="pin-titel">Weerbewaking</div>
  <div class="pin-sub">Voer de pincode in</div>
  <div class="pin-dots" id="pin-dots">
    <div class="pin-dot" id="d0"></div>
    <div class="pin-dot" id="d1"></div>
    <div class="pin-dot" id="d2"></div>
    <div class="pin-dot" id="d3"></div>
  </div>
  <div class="pin-fout-tekst" id="pin-fout"></div>
  <div class="pin-keypad">
    <button class="pin-key" onclick="pinDruk('1')">1</button>
    <button class="pin-key" onclick="pinDruk('2')">2</button>
    <button class="pin-key" onclick="pinDruk('3')">3</button>
    <button class="pin-key" onclick="pinDruk('4')">4</button>
    <button class="pin-key" onclick="pinDruk('5')">5</button>
    <button class="pin-key" onclick="pinDruk('6')">6</button>
    <button class="pin-key" onclick="pinDruk('7')">7</button>
    <button class="pin-key" onclick="pinDruk('8')">8</button>
    <button class="pin-key" onclick="pinDruk('9')">9</button>
    <button class="pin-key wis" onclick="pinWis()">⌫</button>
    <button class="pin-key" onclick="pinDruk('0')">0</button>
    <button class="pin-key wis" onclick="pinReset()" style="font-size:.75rem">✕</button>
  </div>
</div>

<!-- ── PAGINA ── -->
<div class="header">
  <div>
    <h1>🔒 Weerbewaking</h1>
    <div class="header-sub">Ed Aldus WM · persoonlijk dashboard</div>
  </div>
  <div style="display:flex;align-items:center;gap:12px">
    <span id="klok"></span>
    <button class="btn-slot" onclick="vergrendel()">🔒 Vergrendel</button>
    <a href="index.html" style="font-size:.75rem;color:var(--text2);text-decoration:none">← Terug</a>
  </div>
</div>

<div id="inhoud">
  <div class="inhoud-placeholder">
    <div class="icoon">📡</div>
    <p>Weerbewaking is ontgrendeld.<br>Hier komen de bewakingsonderdelen.</p>
  </div>
</div>

<script>
// ── Pincode (hash opgeslagen, niet plaintext) ──
// Standaard pin: 1234 → wijzig dit door de hash hieronder te vervangen
// Pincode opgeslagen als SHA-256 hash
const PIN_HASH = '0985b889a1fe4f4e1fb925061ac6fb2247f10875f5fcbe63eec2ab55ed68970e';
const SESSION_KEY = 'wb_unlocked';

let ingevoerd = '';

// Check sessie
if (sessionStorage.getItem(SESSION_KEY) === '1') ontgrendel();

async function pinDruk(c) {
  if (ingevoerd.length >= 4) return;
  ingevoerd += c;
  updateDots();
  if (ingevoerd.length === 4) {
    const hash = await sha256(ingevoerd);
    if (hash === PIN_HASH) {
      sessionStorage.setItem(SESSION_KEY, '1');
      // Kort groen flash
      document.querySelectorAll('.pin-dot').forEach(d => { d.style.background='#22aa44'; d.style.borderColor='#22aa44'; });
      setTimeout(ontgrendel, 300);
    } else {
      document.querySelectorAll('.pin-dot').forEach(d => d.classList.add('fout'));
      document.getElementById('pin-fout').textContent = 'Onjuiste pincode';
      setTimeout(() => { pinReset(); document.getElementById('pin-fout').textContent = ''; }, 800);
    }
  }
}

function pinWis() {
  if (ingevoerd.length > 0) { ingevoerd = ingevoerd.slice(0, -1); updateDots(); }
}

function pinReset() {
  ingevoerd = '';
  updateDots();
  document.querySelectorAll('.pin-dot').forEach(d => d.classList.remove('fout'));
}

function updateDots() {
  for (let i = 0; i < 4; i++) {
    const d = document.getElementById('d' + i);
    d.classList.remove('fout');
    d.classList.toggle('gevuld', i < ingevoerd.length);
  }
}

function ontgrendel() {
  document.getElementById('pin-scherm').classList.add('verborgen');
  document.getElementById('inhoud').style.display = 'block';
}

function vergrendel() {
  sessionStorage.removeItem(SESSION_KEY);
  ingevoerd = '';
  updateDots();
  document.getElementById('pin-fout').textContent = '';
  document.getElementById('pin-scherm').classList.remove('verborgen');
  document.getElementById('inhoud').style.display = 'none';
}

// SHA-256 via Web Crypto API
async function sha256(str) {
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,'0')).join('');
}

// Keyboard support
document.addEventListener('keydown', e => {
  if (document.getElementById('pin-scherm').classList.contains('verborgen')) return;
  if (e.key >= '0' && e.key <= '9') pinDruk(e.key);
  else if (e.key === 'Backspace') pinWis();
  else if (e.key === 'Escape') pinReset();
});

// Klok
function updateKlok() {
  document.getElementById('klok').textContent =
    new Date().toLocaleString('nl-NL', { timeZone:'Europe/Amsterdam', weekday:'short', day:'2-digit', month:'short', hour:'2-digit', minute:'2-digit' });
}
updateKlok(); setInterval(updateKlok, 30000);
</script>
</body>
</html>
