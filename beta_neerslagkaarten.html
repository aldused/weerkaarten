<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Neerslagkaarten · Weerlab</title>
<link rel="stylesheet" href="neerslag_mix_leaflet.css">
<style>
*{box-sizing:border-box}
body{margin:0;color:#e6ecf5;background:#0d1420;font:15px/1.45 system-ui,sans-serif}
main{max-width:1150px;margin:auto;padding:16px;display:grid;gap:12px}
h1,p{margin:0}
h1{font-size:clamp(22px,4vw,32px)}
.controls,#legend{display:flex;align-items:center;flex-wrap:wrap;gap:8px 12px}
label{display:inline-flex;align-items:center;gap:6px}
select{font:inherit;color:inherit;background:#172235;border:1px solid #536885;border-radius:6px;padding:7px}
#map{height:clamp(340px,65vh,760px);background:#dde5ec;border-radius:9px}
#legend span{display:inline-flex;gap:5px;align-items:center;font-size:13px}
#legend i{width:15px;height:13px;border:1px solid #8895a7}
#source,#status,#point{color:#c2cfe1;font-size:14px}
</style>
<script defer src="neerslag_mix_leaflet.js"></script>
<script defer src="neerslagkaarten-core.js"></script>
<script defer src="neerslagkaarten-map.js"></script>
</head>
<body>
<main>
<h1>Neerslagverwachting</h1>
<div class="controls">
<label>Gebied <select id="region"><option>Rijnmond</option><option>Nederland</option></select></label>
<label>Datum <select id="date" disabled></select></label>
<label>Dagdeel <select id="part" disabled></select></label>
<label>Tijdlijn <select id="hour" disabled></select></label>
</div>
<p id="status" role="status">Modelgegevens laden…</p>
<div id="map" aria-label="Kaart van de verwachte neerslag"></div>
<div id="legend" aria-label="Legenda in millimeter per uur"></div>
<p id="point" aria-live="polite">Klik op de kaart voor de waarde van het modelroosterpunt.</p>
<p id="source"></p>
<p>De getoonde uurintensiteit is een gemiddelde over één modeluur. De dagdeelkaart middelt over de beschikbare uren. Buien kunnen in werkelijkheid afwijken in plaats en tijd.</p>
</main>
</body>
</html>
