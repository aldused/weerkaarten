<script>
const LON_MIN=3.3, LON_MAX=7.4, LAT_MIN=50.45, LAT_MAX=53.8;
const SVG_W=800, SVG_H=1100;
function lonToX(lon) { return (lon - LON_MIN) / (LON_MAX - LON_MIN) * SVG_W; }
function latToY(lat) { return (1 - (lat - LAT_MIN) / (LAT_MAX - LAT_MIN)) * SVG_H; }

  "Herwijnen":[5.146,51.859],"Eindhoven":[5.377,51.451],"Volkel":[5.707,51.657],
  "Ell":[5.763,51.198],"Maastricht":[5.770,50.911],"Arcen":[6.196,51.500],"Horst":[6.029,51.449],

const PARAMS = {

    schaal:[-5,40] },
  min: { label:"Minimum temperatuur (°C)", eenheid:"°", decimalen:1,
    kleuren:[["#084594",-12],["#1565c0",-9],["#1e88e5",-6],["#42a5f5",-3],["#90caf9",-1],["#b2dfdb",0],["#2e8b57",3],["#66bb6a",6],["#cddc39",9],["#ffeb3b",12],["#fbc02d",15],["#f57f17",18],["#ef6c00",21]],
    schaal:[-15,22] },
  t10n: { label:"Min grastemperatuur 10cm", eenheid:"°", decimalen:1,
    kleuren:[["#1a3a6b",-10],["#2980b9",-5],["#a8d8ea",0],["#ffffcc",5],["#fed976",10],["#fd8d3c",15],["#e65100",20]],
    schaal:[-15,25] },
  rr: { label:"Neerslag (mm)", eenheid:" mm", decimalen:1,
    kleuren:[["#c6dbef","0.1"],["#6baed6","5"],["#2171b5","15"],["#084594","30+"]],
    schaal:[0,30] },
  fx: { label:"Max windstoot (km/h)", eenheid:" km/h", decimalen:0,
    kleuren:[["#ffffff",5],["#c8e6c9",8],["#81c784",11],["#4caf50",14],["#ffee58",17],["#ffa726",21],["#ff7043",25],["#e53935",30]],
    schaal:[0,35] },
  ff: { label:"Gem. wind hoogste uur (m/s)", eenheid:" m/s", decimalen:1,
    kleuren:[["#ffffff",0],["#c8e6c9",2],["#81c784",4],["#4caf50",6],["#ffee58",8],["#ffa726",11],["#ff7043",14],["#e53935",17],["#b71c1c",21],["#7b1fa2",25]],
    schaal:[0,25] },
  gevoels: { label:"Min gevoelstemperatuur (°C)", eenheid:"°", decimalen:1,
    kleuren:[["#1a3a6b","≤-15°"],["#2980b9","-10°"],["#a8d8ea","-5°"],["#e8f4f8","0°"],["#ffffcc","5°"]],

  sq: { label:"Zonneschijn (uur)", eenheid:" u", decimalen:1,
    kleuren:[["#fffacd","1u"],["#ffe066","4u"],["#ffa500","8u"],["#ff6600","12u+"]],
    schaal:[0,12] },
};

function hexToRgb(hex) {
  return [parseInt(hex.slice(1,3),16),parseInt(hex.slice(3,5),16),parseInt(hex.slice(5,7),16)];
}
function interpKleur(val, schaal, stops) {
  const colors = stops.map(s=>hexToRgb(s[0]));
  let idx, f;
  if(typeof stops[0][1]==='number'){
    const temps=stops.map(s=>s[1]);
    const v=Math.max(temps[0],Math.min(temps[temps.length-1],val));
    idx=temps.length-2;
    for(let i=0;i<temps.length-1;i++){if(v<=temps[i+1]){idx=i;break;}}
    f=(v-temps[idx])/(temps[idx+1]-temps[idx]);
  } else {
    const t=Math.max(0,Math.min(1,(val-schaal[0])/(schaal[1]-schaal[0])));
    idx=Math.min(colors.length-2,Math.floor(t*(colors.length-1)));
    f=t*(colors.length-1)-idx;
  }
  const a=colors[idx],b=colors[idx+1];
  const r=Math.round(a[0]+f*(b[0]-a[0])), g=Math.round(a[1]+f*(b[1]-a[1])), bl=Math.round(a[2]+f*(b[2]-a[2]));
  const lum=(0.299*r+0.587*g+0.114*bl)/255;
  return [`rgb(${r},${g},${bl})`, lum<0.55?"white":"#222"];
}

function ns(tag) { return document.createElementNS("http://www.w3.org/2000/svg",tag); }

// ── Heatmap: Modified Shepard + Gaussian blur ───────────────────────────────
const HEATMAP_RES = 3;
const BASEMAP_W = 1600;
const BASEMAP_H = 2200;
const SHEPARD_POWER = 2.5;
const SHEPARD_KNN = 8;
const BLUR_SIGMA = 2;
const HEATMAP_ALPHA = 0.55;
const HEATMAP_PARAMS_TOP = new Set(["max","min","t10n","ff","fx"]);
const CONTOUR_PARAMS_TOP = {
  max:  { step: 1,  major: 5,  unit: "°",    factor: 1 },
  min:  { step: 1,  major: 5,  unit: "°",    factor: 1 },
  t10n: { step: 1,  major: 5,  unit: "°",    factor: 1 },
  fx:   { step: 10, major: 20, unit: " km/h", factor: 3.6 },
};
let landMask = null;
let laatsteVeld = null;
let provincies = null;

function bouwBasemap(svg){
  while(svg.firstChild) svg.removeChild(svg.firstChild);
  if(!provincies) return;
  const ringD = (ring) => {
    let d = "";
    ring.forEach(([lon,lat], i) => {
      const x = lonToX(lon), y = latToY(lat);
      d += (i===0?"M":"L") + x.toFixed(1) + " " + y.toFixed(1);
    });
    return d + "Z";
  };
  let d = "";
  for(const feat of provincies.features){
    const g = feat.geometry;
    const polys = g.type==="Polygon" ? [g.coordinates] : g.coordinates;
    for(const poly of polys){
      for(const ring of poly) d += ringD(ring);
    }
  }
  const landPath = ns("path");
  landPath.setAttribute("d", d);
  landPath.setAttribute("class","basemap-land");
  landPath.setAttribute("fill-rule","evenodd");
  svg.appendChild(landPath);
  const provPath = ns("path");
  provPath.setAttribute("d", d);
  provPath.setAttribute("class","basemap-prov");
  svg.appendChild(provPath);
}

function tekenBuitengrens(svg){
  if(!provincies) return;
  const ringD = (ring) => {
    let d = "";
    ring.forEach(([lon,lat], i) => {
      const x = lonToX(lon), y = latToY(lat);
      d += (i===0?"M":"L") + x.toFixed(1) + " " + y.toFixed(1);
    });
    return d + "Z";
  };
  let d = "";
  for(const feat of provincies.features){
    const g = feat.geometry;
    const polys = g.type==="Polygon" ? [g.coordinates] : g.coordinates;
    for(const poly of polys) d += ringD(poly[0]);
  }
  const p = ns("path");
  p.setAttribute("d", d);
  p.setAttribute("class","nl-buitengrens");
  svg.appendChild(p);
}

function maakLandMask(){
  if(!provincies) return;
  const c = document.createElement("canvas");
  c.width = BASEMAP_W; c.height = BASEMAP_H;
  const ctx = c.getContext("2d");
  ctx.fillStyle = "#000";
  ctx.beginPath();
  for(const feat of provincies.features){
    const g = feat.geometry;
    const polys = g.type==="Polygon" ? [g.coordinates] : g.coordinates;
    for(const poly of polys){
      for(const ring of poly){
        ring.forEach(([lon,lat], i) => {
          const x = lonToX(lon)/SVG_W * BASEMAP_W;
          const y = latToY(lat)/SVG_H * BASEMAP_H;
          if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
        });
        ctx.closePath();
      }
    }
  }
  ctx.fill("evenodd");
  const px = ctx.getImageData(0,0,BASEMAP_W,BASEMAP_H).data;
  const R = HEATMAP_RES;
  const w = Math.ceil(BASEMAP_W/R), h = Math.ceil(BASEMAP_H/R);
  const data = new Uint8Array(w*h);
  for(let y=0;y<h;y++) for(let x=0;x<w;x++){
    let isLand=false;
    for(let dy=0; dy<R && !isLand; dy++) for(let dx=0; dx<R && !isLand; dx++){
      const sx = Math.min(x*R+dx, BASEMAP_W-1), sy = Math.min(y*R+dy, BASEMAP_H-1);
      if(px[(sy*BASEMAP_W+sx)*4+3] > 0) isLand=true;
    }
    data[y*w+x] = isLand ? 1 : 0;
  }
  landMask = {w, h, data};
}

function _shepardVeld(punten){
  const w=landMask.w, h=landMask.h;
  if(punten.length < 3) return null;
  const N = punten.length;
  const K = Math.min(SHEPARD_KNN, N);
  const veld = new Float32Array(w*h);
  for(let y=0;y<h;y++) for(let x=0;x<w;x++){
    const idx = y*w+x;
    if(!landMask.data[idx]) continue;
    const dArr = new Float64Array(N);
    for(let i=0;i<N;i++){
      const dx=x-punten[i].x, dy=y-punten[i].y;
      dArr[i] = Math.sqrt(dx*dx+dy*dy);
    }
    const idxs = new Int32Array(N); for(let i=0;i<N;i++) idxs[i]=i;
    for(let k=0;k<K;k++){
      let mi=k;
      for(let j=k+1;j<N;j++) if(dArr[idxs[j]]<dArr[idxs[mi]]) mi=j;
      const t=idxs[k]; idxs[k]=idxs[mi]; idxs[mi]=t;
    }
    const R = dArr[idxs[K-1]] + 1e-6;
    let sumW=0, sumWV=0;
    for(let k=0;k<K;k++){
      const i=idxs[k], d=dArr[i];
      if(d<0.7){ sumWV=punten[i].val; sumW=1; break; }
      const num = (R-d)/(R*d);
      const wi = Math.pow(num, SHEPARD_POWER);
      sumW+=wi; sumWV+=wi*punten[i].val;
    }
    veld[idx] = sumWV/sumW;
  }
  return veld;
}

function _blurVeld(veld){
  const sigma = BLUR_SIGMA;
  if(sigma<=0) return veld;
  const w=landMask.w, h=landMask.h, mask=landMask.data;
  const radius = Math.max(1, Math.ceil(sigma*3));
  const kernel = new Float32Array(radius*2+1);
  let ks=0;
  for(let i=-radius;i<=radius;i++){
    const v = Math.exp(-(i*i)/(2*sigma*sigma));
    kernel[i+radius]=v; ks+=v;
  }
  for(let i=0;i<kernel.length;i++) kernel[i]/=ks;
  const tmp = new Float32Array(w*h);
  for(let y=0;y<h;y++) for(let x=0;x<w;x++){
    if(!mask[y*w+x]){ tmp[y*w+x]=0; continue; }
    let s=0, ws=0;
    for(let k=-radius;k<=radius;k++){
      const xx=x+k; if(xx<0||xx>=w) continue;
      if(!mask[y*w+xx]) continue;
      const wt=kernel[k+radius];
      s+=veld[y*w+xx]*wt; ws+=wt;
    }
    tmp[y*w+x] = ws>0 ? s/ws : veld[y*w+x];
  }
  const out = new Float32Array(w*h);
  for(let y=0;y<h;y++) for(let x=0;x<w;x++){
    if(!mask[y*w+x]){ out[y*w+x]=0; continue; }
    let s=0, ws=0;
    for(let k=-radius;k<=radius;k++){
      const yy=y+k; if(yy<0||yy>=h) continue;
      if(!mask[yy*w+x]) continue;
      const wt=kernel[k+radius];
      s+=tmp[yy*w+x]*wt; ws+=wt;
    }
    out[y*w+x] = ws>0 ? s/ws : tmp[y*w+x];
  }
  return out;
}

function tekenHeatmap(ddata, param){
  const hc = document.getElementById("heatmap");
  const p = PARAMS[param];
  laatsteVeld = null;
  if(!p || !HEATMAP_PARAMS_TOP.has(param)){ hc.width=1; hc.height=1; return; }
  if(!landMask) maakLandMask();
  if(!landMask){ hc.width=1; hc.height=1; return; }

  const w = landMask.w, h = landMask.h;
  const rijen = ddata[param] || [];
  const punten = [];
  rijen.forEach(item => {
    const naam = item[1], val = item[0];
    if(!COORDS[naam] || val == null) return;
    const [lon, lat] = COORDS[naam];
    punten.push({x: lonToX(lon)/SVG_W*w, y: latToY(lat)/SVG_H*h, val});
  });
  let veld = _shepardVeld(punten);
  if(!veld) return;
  veld = _blurVeld(veld);
  laatsteVeld = {w, h, veld};

  hc.width = BASEMAP_W; hc.height = BASEMAP_H;
  const ctx = hc.getContext("2d");
  ctx.clearRect(0, 0, hc.width, hc.height);

  const tmpC = document.createElement("canvas");
  tmpC.width = w; tmpC.height = h;
  const tctx = tmpC.getContext("2d");
  const imgData = tctx.createImageData(w, h);
  const buf = imgData.data;
  for(let i=0;i<w*h;i++){
    if(!landMask.data[i]){ buf[i*4+3]=0; continue; }
    const v = veld[i];
    const [bg] = interpKleur(v, p.schaal, p.kleuren);
    const m = bg.match(/\d+/g);
    buf[i*4]=+m[0]; buf[i*4+1]=+m[1]; buf[i*4+2]=+m[2];
    buf[i*4+3] = Math.round(HEATMAP_ALPHA*255);
  }
  tctx.putImageData(imgData, 0, 0);
  ctx.imageSmoothingEnabled = true;
  ctx.imageSmoothingQuality = "high";
  ctx.drawImage(tmpC, 0, 0, hc.width, hc.height);
}

// ── Contouren (marching squares op het geïnterpoleerde veld) ───────────────
function _chainSegments(segs){
  const key = p => p[0].toFixed(2)+","+p[1].toFixed(2);
  const map = new Map();
  const used = new Uint8Array(segs.length);
  segs.forEach((s, i) => {
    for(let e=0; e<2; e++){
      const k = key(s[e]);
      if(!map.has(k)) map.set(k, []);
      map.get(k).push({seg:i, end:e});
    }
  });
  const lines = [];
  for(let i=0;i<segs.length;i++){
    if(used[i]) continue;
    used[i] = 1;
    const line = [segs[i][0].slice(), segs[i][1].slice()];
    let curKey = key(segs[i][1]);
    while(true){
      const cands = map.get(curKey) || [];
      let next = null;
      for(const c of cands){ if(!used[c.seg]){ next = c; break; } }
      if(!next) break;
      used[next.seg] = 1;
      const np = segs[next.seg][1-next.end];
      line.push(np.slice());
      curKey = key(np);
    }
    curKey = key(segs[i][0]);
    while(true){
      const cands = map.get(curKey) || [];
      let next = null;
      for(const c of cands){ if(!used[c.seg]){ next = c; break; } }
      if(!next) break;
      used[next.seg] = 1;
      const np = segs[next.seg][1-next.end];
      line.unshift(np.slice());
      curKey = key(np);
    }
    lines.push(line);
  }
  return lines;
}

function _polylineLength(pl){
  let L = 0;
  for(let i=1;i<pl.length;i++) L += Math.hypot(pl[i][0]-pl[i-1][0], pl[i][1]-pl[i-1][1]);
  return L;
}

function tekenContouren(svg, param){
  if(!laatsteVeld || !landMask) return;
  const conf = CONTOUR_PARAMS_TOP[param];
  if(!conf) return;
  const {w, h, veld} = laatsteVeld;
  const mask = landMask.data;
  const factor = conf.factor || 1;
  let vmin = Infinity, vmax = -Infinity;
  for(let i=0;i<w*h;i++){
    if(!mask[i]) continue;
    const v = veld[i]*factor;
    if(v < vmin) vmin = v;
    if(v > vmax) vmax = v;
  }
  if(!isFinite(vmin)) return;
  const step = conf.step;
  const lMin = Math.ceil((vmin + 1e-6)/step)*step;
  const lMax = Math.floor((vmax - 1e-6)/step)*step;
  if(lMin > lMax) return;

  const R = HEATMAP_RES;
  const sx = SVG_W/BASEMAP_W, sy = SVG_H/BASEMAP_H;
  const cw = R*sx, ch = R*sy;
  const cellX = x => (x*R + R/2)*sx;
  const cellY = y => (y*R + R/2)*sy;

  const gLines = ns("g");
  gLines.setAttribute("class","contours");
  gLines.setAttribute("pointer-events","none");
  const labels = [];

  for(let li = Math.round(lMin/step); li <= Math.round(lMax/step); li++){
    const level = li*step;
    const fieldLevel = level / factor;
    const isMajor = (li % Math.round(conf.major/step)) === 0;
    const segs = [];
    for(let y=0; y<h-1; y++){
      const row0 = y*w, row1 = (y+1)*w;
      for(let x=0; x<w-1; x++){
        const i00 = row0+x, i10 = row0+x+1, i01 = row1+x, i11 = row1+x+1;
        if(!mask[i00] || !mask[i10] || !mask[i01] || !mask[i11]) continue;
        const v00 = veld[i00], v10 = veld[i10], v01 = veld[i01], v11 = veld[i11];
        let code = 0;
        if(v00 >= fieldLevel) code |= 1;
        if(v10 >= fieldLevel) code |= 2;
        if(v11 >= fieldLevel) code |= 4;
        if(v01 >= fieldLevel) code |= 8;
        if(code === 0 || code === 15) continue;
        const px = cellX(x), py = cellY(y);
        const lerp = (a,b) => {
          const d = b - a;
          if(Math.abs(d) < 1e-9) return 0.5;
          return (fieldLevel - a)/d;
        };
        const eTop   = () => [px + lerp(v00,v10)*cw, py];
        const eRight = () => [px + cw, py + lerp(v10,v11)*ch];
        const eBot   = () => [px + lerp(v01,v11)*cw, py + ch];
        const eLeft  = () => [px, py + lerp(v00,v01)*ch];
        switch(code){
          case 1: case 14: segs.push([eLeft(),  eTop()  ]); break;
          case 2: case 13: segs.push([eTop(),   eRight()]); break;
          case 3: case 12: segs.push([eLeft(),  eRight()]); break;
          case 4: case 11: segs.push([eRight(), eBot()  ]); break;
          case 6: case 9:  segs.push([eTop(),   eBot()  ]); break;
          case 7: case 8:  segs.push([eLeft(),  eBot()  ]); break;
          case 5: {
            const avg = (v00+v10+v01+v11)/4;
            if(avg >= level){ segs.push([eLeft(), eTop()]); segs.push([eRight(), eBot()]); }
            else            { segs.push([eLeft(), eBot()]); segs.push([eTop(),  eRight()]); }
            break;
          }
          case 10: {
            const avg = (v00+v10+v01+v11)/4;
            if(avg >= level){ segs.push([eTop(), eRight()]); segs.push([eLeft(), eBot()]); }
            else            { segs.push([eLeft(), eTop()]);  segs.push([eRight(), eBot()]); }
            break;
          }
        }
      }
    }
    if(!segs.length) continue;
    const polylines = _chainSegments(segs);
    let d = "";
    for(const line of polylines){
      if(line.length < 2) continue;
      d += `M${line[0][0].toFixed(2)} ${line[0][1].toFixed(2)}`;
      for(let i=1;i<line.length;i++) d += `L${line[i][0].toFixed(2)} ${line[i][1].toFixed(2)}`;
    }
    const path = ns("path");
    path.setAttribute("d", d);
    path.setAttribute("fill","none");
    path.setAttribute("stroke", isMajor ? "rgba(15,23,42,0.75)" : "rgba(15,23,42,0.32)");
    path.setAttribute("stroke-width", isMajor ? "1.2" : "0.55");
    path.setAttribute("stroke-linecap","round");
    path.setAttribute("stroke-linejoin","round");
    gLines.appendChild(path);

    if(isMajor){
      const cand = polylines
        .map(pl => ({pl, len: _polylineLength(pl)}))
        .filter(o => o.len > 90)
        .sort((a,b) => b.len - a.len);
      const placed = [];
      for(const o of cand){
        if(placed.length >= 3) break;
        const pl = o.pl;
        const midIdx = Math.floor(pl.length/2);
        const mid = pl[midIdx];
        if(placed.some(q => Math.hypot(q[0]-mid[0], q[1]-mid[1]) < 110)) continue;
        placed.push(mid);
        const i0 = Math.max(0, midIdx - 3), i1 = Math.min(pl.length-1, midIdx + 3);
        const ang = Math.atan2(pl[i1][1]-pl[i0][1], pl[i1][0]-pl[i0][0]);
        labels.push({x: mid[0], y: mid[1], text: String(level) + conf.unit, ang});
      }
    }
  }

  svg.appendChild(gLines);

  if(labels.length){
    const gLabels = ns("g");
    gLabels.setAttribute("class","contour-labels");
    gLabels.setAttribute("pointer-events","none");
    for(const lb of labels){
      let deg = lb.ang * 180/Math.PI;
      if(deg > 90) deg -= 180;
      if(deg < -90) deg += 180;
      const t = ns("text");
      t.setAttribute("x", lb.x.toFixed(1));
      t.setAttribute("y", lb.y.toFixed(1));
      t.setAttribute("text-anchor","middle");
      t.setAttribute("dominant-baseline","middle");
      t.setAttribute("font-family","Arial,sans-serif");
      t.setAttribute("font-weight","700");
      t.setAttribute("font-size","13");
      t.setAttribute("fill","#0f172a");
      t.setAttribute("paint-order","stroke");
      t.setAttribute("stroke","white");
      t.setAttribute("stroke-width","3.5");
      t.setAttribute("stroke-linejoin","round");
      t.setAttribute("transform", `rotate(${deg.toFixed(1)} ${lb.x.toFixed(1)} ${lb.y.toFixed(1)})`);
      t.textContent = lb.text;
      gLabels.appendChild(t);
    }
    svg.appendChild(gLabels);
  }
}

// Heatmap-stationsstijl: kleine dot + grote waarde met witte halo, rang-rand voor #1/#2
function tekenHeatmapStation(svg, naam, val, idx, tijdstip, param){
  const p = PARAMS[param];
  const [lon,lat] = COORDS[naam];
  const cx = lonToX(lon), cy = latToY(lat);
  const g = ns("g");

  // Dot + ranking ring
  const dot = ns("circle");
  dot.setAttribute("cx", cx.toFixed(1)); dot.setAttribute("cy", cy.toFixed(1));
  dot.setAttribute("r", idx===0?"6":idx===1?"5":"3");
  dot.setAttribute("fill", idx===0?"#cc0000":idx===1?"#e6a800":"#1a1a1a");
  dot.setAttribute("stroke","white"); dot.setAttribute("stroke-width", idx<=1?"2":"1");
  g.appendChild(dot);

  let tekst;
  if(param==="fx") tekst = (val*3.6).toFixed(0);
  else tekst = val.toFixed(p.decimalen);

  const t = ns("text");
  t.setAttribute("x", cx.toFixed(1)); t.setAttribute("y", (cy-9).toFixed(1));
  t.setAttribute("text-anchor","middle");
  t.setAttribute("font-family","Arial,sans-serif");
  t.setAttribute("font-weight","700");
  t.setAttribute("font-size","20");
  t.setAttribute("fill","#1a1a1a");

  t.setAttribute("stroke","white");
  t.setAttribute("stroke-width","4");
  t.setAttribute("stroke-linejoin","round");
  t.textContent = tekst;
  g.appendChild(t);

  if(tijdstip){
    const tt = ns("text");
    tt.setAttribute("x", cx.toFixed(1)); tt.setAttribute("y", (cy+15).toFixed(1));
    tt.setAttribute("text-anchor","middle");
    tt.setAttribute("font-family","Arial,sans-serif");
    tt.setAttribute("font-size","11");
    tt.setAttribute("font-weight","700");
    tt.setAttribute("fill","#444");
    tt.setAttribute("paint-order","stroke");
    tt.setAttribute("stroke","white");
    tt.setAttribute("stroke-width","3");
    tt.setAttribute("stroke-linejoin","round");
    tt.textContent = tijdstip;
    g.appendChild(tt);
  }

  svg.appendChild(g);
}

function tekenKaart(dagData, param) {
  const svg = document.getElementById("nl-kaart");
  svg.innerHTML = "";
  const p = PARAMS[param];
  const rijen = dagData[param] || [];

  tekenBuitengrens(svg);
  tekenHeatmap(dagData, param);
  tekenContouren(svg, param);

  const isHeatmap = HEATMAP_PARAMS_TOP.has(param);

  rijen.forEach((item, idx) => {
    const naam = item[1];
    if (!COORDS[naam]) return;
    const val = item[0];
    const tijdstip = item[2] || null;

    if(isHeatmap){
      tekenHeatmapStation(svg, naam, val, idx, tijdstip, param);
      return;
    }

    const [lon,lat] = COORDS[naam];
    const cx = lonToX(lon), cy = latToY(lat);
    const [bg,fg] = interpKleur(val, p.schaal, p.kleuren);
    let tekst;
    if (param === "fx") tekst = (val*3.6).toFixed(0);
    else tekst = val.toFixed(p.decimalen);

    const g = ns("g");
    const r = 22;
    const circle = ns("circle");
    circle.setAttribute("cx", cx); circle.setAttribute("cy", cy);
    circle.setAttribute("r", r);
    circle.setAttribute("fill", bg); circle.setAttribute("fill-opacity", "0.72");
    circle.setAttribute("stroke", idx === 0 ? "#cc0000" : idx === 1 ? "#e6a800" : "white");
    circle.setAttribute("stroke-width", idx <= 1 ? "3.5" : "1.5");
    g.appendChild(circle);

    // Buitenste ring voor #1 en #2
    if (idx === 0 || idx === 1) {
      const ring = ns("circle");
      ring.setAttribute("cx", cx); ring.setAttribute("cy", cy);
      ring.setAttribute("r", r + 5);
      ring.setAttribute("fill", "none");
      ring.setAttribute("stroke", idx === 0 ? "#cc0000" : "#e6a800");
      ring.setAttribute("stroke-width", "2");
      ring.setAttribute("stroke-dasharray", idx === 0 ? "5,3" : "4,4");
      g.appendChild(ring);
    }

    const text = ns("text");
    text.setAttribute("x", cx);
    text.setAttribute("y", tijdstip ? cy - 3 : cy + 4);
    text.setAttribute("text-anchor", "middle");
    text.setAttribute("font-size", "12");
    text.setAttribute("font-weight", "bold");
    text.setAttribute("font-family", "Arial,sans-serif");
    text.setAttribute("fill", fg);
    text.textContent = tekst;
    g.appendChild(text);

    if (tijdstip) {
      const tr = ns("rect");
      tr.setAttribute("x", cx-20); tr.setAttribute("y", cy+6);
      tr.setAttribute("width", 40); tr.setAttribute("height", 13);
      tr.setAttribute("rx", 3); tr.setAttribute("fill", "white");
      tr.setAttribute("stroke", "#ccc"); tr.setAttribute("stroke-width", "0.8");
      g.appendChild(tr);
      const tt = ns("text");
      tt.setAttribute("x", cx); tt.setAttribute("y", cy+15);
      tt.setAttribute("text-anchor", "middle");
      tt.setAttribute("font-size", "9");
      tt.setAttribute("font-family", "Arial,sans-serif");
      tt.setAttribute("fill", "#444");
      tt.textContent = tijdstip;
      g.appendChild(tt);
    }
    svg.appendChild(g);
  });

  // Top 3 paneel linksboven
  const top3Kleuren = ["#cc0000","#8B6914","#888888"];
  const top3Labels  = ["1","2","3"];
  const top3Rijen   = (dagData[param] || []).slice(0,3);
  const paneel_x = 10, paneel_y = 10;
  const paneel_b = 180, rij_h = 38, paneel_h = 20 + top3Rijen.length * rij_h;

  // Achtergrond paneel
  const pRect = ns("rect");
  pRect.setAttribute("x", paneel_x); pRect.setAttribute("y", paneel_y);
  pRect.setAttribute("width", paneel_b); pRect.setAttribute("height", paneel_h);
  pRect.setAttribute("rx", 6); pRect.setAttribute("fill", "white");
  pRect.setAttribute("fill-opacity", "0.88");
  pRect.setAttribute("stroke", "#cccccc"); pRect.setAttribute("stroke-width", "0.8");
  svg.appendChild(pRect);

  // Titel
  const pTitel = ns("text");
  pTitel.setAttribute("x", paneel_x + paneel_b/2); pTitel.setAttribute("y", paneel_y + 14);
  pTitel.setAttribute("text-anchor", "middle");
  pTitel.setAttribute("font-size", "11"); pTitel.setAttribute("font-weight", "bold");
  pTitel.setAttribute("font-family", "Arial,sans-serif"); pTitel.setAttribute("fill", "#003366");
  pTitel.textContent = "Top 3 " + (PARAMS[param]?.label || param);
  svg.appendChild(pTitel);

  top3Rijen.forEach((item, idx) => {
    const naam = item[1], val = item[0], tijdstip = item[2] || null;
    const ry = paneel_y + 22 + idx * rij_h;
    const medKleur = top3Kleuren[idx];

    // Medaille cirkel
    const med = ns("circle");
    med.setAttribute("cx", paneel_x + 18); med.setAttribute("cy", ry + 12);
    med.setAttribute("r", 12); med.setAttribute("fill", medKleur);
    svg.appendChild(med);
    const medTxt = ns("text");
    medTxt.setAttribute("x", paneel_x + 18); medTxt.setAttribute("y", ry + 17);
    medTxt.setAttribute("text-anchor", "middle"); medTxt.setAttribute("font-size", "13");
    medTxt.setAttribute("font-weight", "bold"); medTxt.setAttribute("font-family", "Arial,sans-serif");
    medTxt.setAttribute("fill", "white"); medTxt.textContent = top3Labels[idx];
    svg.appendChild(medTxt);

    // Station naam
    const stn = ns("text");
    stn.setAttribute("x", paneel_x + 35); stn.setAttribute("y", ry + 10);
    stn.setAttribute("font-size", "11"); stn.setAttribute("font-weight", "bold");
    stn.setAttribute("font-family", "Arial,sans-serif"); stn.setAttribute("fill", "#222222");
    stn.textContent = naam;
    svg.appendChild(stn);

    // Waarde
    let waardeTxt;
    if (param === "fx") waardeTxt = (val*3.6).toFixed(0) + " km/h";
    else if (param === "ff") {
      const BFT_THRESH = [0.3,1.6,3.4,5.5,8.0,10.8,13.9,17.2,20.8,24.5,28.5,32.7];
      let bft = 0;
      for (let i = 0; i < BFT_THRESH.length; i++) { if (val >= BFT_THRESH[i]) bft = i+1; else break; }
      waardeTxt = val.toFixed(1) + " m/s (Bft " + bft + ")";
    }
    else waardeTxt = val.toFixed(PARAMS[param]?.decimalen || 1) + (PARAMS[param]?.eenheid || "");
    const wrd = ns("text");
    wrd.setAttribute("x", paneel_x + 35); wrd.setAttribute("y", ry + 24);
    wrd.setAttribute("font-size", "10"); wrd.setAttribute("font-family", "Arial,sans-serif");
    wrd.setAttribute("fill", medKleur); wrd.setAttribute("font-weight", "bold");
    wrd.textContent = waardeTxt + (tijdstip ? "  om " + tijdstip : "");
    svg.appendChild(wrd);
  });

  // Copyright binnenin kaart
  const cr = ns("text");
  cr.setAttribute("x", SVG_W - 10);
  cr.setAttribute("y", SVG_H - 12);
  cr.setAttribute("text-anchor", "end");
  cr.setAttribute("font-size", "18");
  cr.setAttribute("font-family", "Arial,sans-serif");
  cr.setAttribute("font-style", "italic");
  cr.setAttribute("fill", "#888888");
  cr.textContent = "© Ed Aldus / KNMI";
  svg.appendChild(cr);

  // Tijdstempel alleen op vandaag
  const vandaagKey = new Date().toISOString().slice(0,10);
  if (huidigDag === vandaagKey) {
    const now = new Date();
    const tijdTekst = now.toLocaleString("nl-NL",{day:"2-digit",month:"short",hour:"2-digit",minute:"2-digit"});
    const ts = ns("text");
    ts.setAttribute("x", 10);
    ts.setAttribute("y", SVG_H - 12);
    ts.setAttribute("text-anchor", "start");
    ts.setAttribute("font-size", "18");
    ts.setAttribute("font-family", "Arial,sans-serif");
    ts.setAttribute("font-style", "italic");
    ts.setAttribute("fill", "#888888");
    ts.textContent = "Stand: " + tijdTekst;
    svg.appendChild(ts);
  }
}

function maakLegenda(param) {
  const p = PARAMS[param];
  document.getElementById("legenda").innerHTML = p.kleuren.map(([k,l],i,arr)=>{
    const label=typeof l==='number'?(i===0?`≤${l}°`:i===arr.length-1?`${l}°+`:`${l}°`):l;
    return `<div class="legenda-item"><div class="legenda-blok" style="background:${k}"></div>${label}</div>`;
  }).join("");
}

const NL_DAGEN = ["Zondag","Maandag","Dinsdag","Woensdag","Donderdag","Vrijdag","Zaterdag"];
const NL_MND = ["","jan","feb","mrt","apr","mei","jun","jul","aug","sep","okt","nov","dec"];
function dagLabel(d) { return `${NL_DAGEN[d.getDay()]} ${d.getDate()} ${NL_MND[d.getMonth()+1]}`; }

let dagData = {}, huidigParam = "max", huidigDag = "vandaag";

function update() {
  const key = huidigDag;
  const d = new Date(key + "T12:00:00");
  const dd = dagData[key];
  if (!dd) { document.getElementById("status").textContent = `Geen data voor ${key}`; return; }
  document.getElementById("status").textContent = "";
  const lbl = dagLabel(d);
  document.getElementById("hdr-datum").textContent = lbl;
  document.getElementById("kaart-dag-label").textContent = lbl;
  document.getElementById("kaart-subtitel").textContent = PARAMS[huidigParam].label;
  tekenKaart(dd, huidigParam);
  maakLegenda(huidigParam);
}

function _exportCanvas(callback){
  const baseSvg = document.getElementById("basemap-svg");
  const overlay = document.getElementById("nl-kaart");
  const header = document.getElementById("kaart-header");
  const W = BASEMAP_W, H = BASEMAP_H;
  const headerH = 120;
  const canvas = document.createElement("canvas");
  canvas.width = W;
  canvas.height = H + headerH;
  const ctx = canvas.getContext("2d");
  tekenHeader(ctx, W, headerH);

  const svgToImg = (svg, extraStyle) => new Promise(res => {
    const clone = svg.cloneNode(true);
    if(extraStyle){
      const st = document.createElementNS("http://www.w3.org/2000/svg","style");
      st.textContent = extraStyle;
      clone.insertBefore(st, clone.firstChild);
    }
    clone.setAttribute("xmlns","http://www.w3.org/2000/svg");
    clone.setAttribute("width", W);
    clone.setAttribute("height", H);
    const blob = new Blob([new XMLSerializer().serializeToString(clone)], {type:"image/svg+xml"});
    const url = URL.createObjectURL(blob);
    const im = new Image();
    im.onload = () => { URL.revokeObjectURL(url); res(im); };
    im.src = url;
  });

  const baseStyle = `
    svg { background: #b8d4e8; }
    .basemap-land { fill: #f5efd9; }
    .basemap-prov { fill: none; stroke: rgba(255,255,255,0.7); stroke-width: 0.6; }
  `;
  const overlayStyle = `
    .nl-buitengrens { fill: none; stroke: white; stroke-width: 2; stroke-linejoin: round; }
  `;

  Promise.all([svgToImg(baseSvg, baseStyle), svgToImg(overlay, overlayStyle)]).then(([baseImg, ovImg]) => {
    ctx.fillStyle = "#b8d4e8";
    ctx.fillRect(0, headerH, W, H);
    ctx.drawImage(baseImg, 0, headerH, W, H);
    const hc = document.getElementById("heatmap");
    if(hc.width > 1) ctx.drawImage(hc, 0, headerH, W, H);
    ctx.drawImage(ovImg, 0, headerH, W, H);
    callback(canvas);
  });
}

function slaOp(){
  _exportCanvas(canvas => {
    const a = document.createElement("a");
    a.href = canvas.toDataURL("image/png");
    a.download = `edaldus_topkaart_${huidigParam}_${huidigDag}.png`;
    a.click();
  });
}

function openZoom(){
  _exportCanvas(canvas => {
    document.getElementById("lightbox-img").src = canvas.toDataURL("image/png");
    document.getElementById("lightbox").classList.add("actief");
  });
}
function sluitZoom() { document.getElementById("lightbox").classList.remove("actief"); }
document.addEventListener("keydown", e => { if(e.key==="Escape") sluitZoom(); });

function toggleArchief() {
  const menu = document.getElementById("archief-menu");
  const btn = document.getElementById("btn-archief");
  const open = menu.style.display === "none";
  menu.style.display = open ? "block" : "none";
  btn.classList.toggle("actief", open);
}
document.addEventListener("click", e => {
  if (!e.target.closest("#btn-archief") && !e.target.closest("#archief-menu")) {
    document.getElementById("archief-menu").style.display = "none";
    document.getElementById("btn-archief").classList.remove("actief");
  }
});
function selecteerDag(key) {
  huidigDag = key;
  document.querySelectorAll(".btn-dag").forEach(b => b.classList.remove("actief"));
  document.getElementById("btn-archief").classList.add("actief");
  update();
}

function tekenHeader(ctx, breedte, hoogte) {
  ctx.fillStyle = "#003366";
  ctx.fillRect(0, 0, breedte, hoogte);
  ctx.fillStyle = "#4a90c4";
  ctx.fillRect(0, hoogte-4, breedte, 4);
  const pad = 28;
  ctx.fillStyle = "white"; ctx.font = "bold 44px Arial"; ctx.textAlign = "left"; ctx.textBaseline = "alphabetic";
  ctx.fillText("Ed Aldus WM", pad, 56);
  ctx.fillStyle = "#a8c8e8"; ctx.font = "26px Arial";
  ctx.fillText("Waarnemingen KNMI", pad, 94);
  ctx.fillStyle = "white"; ctx.font = "bold 44px Arial"; ctx.textAlign = "right";
  ctx.fillText(document.getElementById("kaart-dag-label").textContent, breedte-pad, 56);
  ctx.fillStyle = "#a8c8e8"; ctx.font = "26px Arial";
  ctx.fillText(document.getElementById("kaart-subtitel").textContent, breedte-pad, 94);
  ctx.textAlign = "left";
}

document.getElementById("param-btns").addEventListener("click", e => {
  const btn = e.target.closest(".btn-param"); if (!btn) return;
  huidigParam = btn.dataset.param;
  document.querySelectorAll(".btn-param").forEach(b=>b.classList.remove("actief"));
  btn.classList.add("actief"); update();
});
document.getElementById("dag-btns").addEventListener("click", e => {
  const btn = e.target.closest(".btn-dag"); if (!btn) return;
  huidigDag = btn.dataset.dag;
  document.querySelectorAll(".btn-dag").forEach(b=>b.classList.remove("actief"));
  document.getElementById("btn-archief").classList.remove("actief");
  btn.classList.add("actief"); update();
});
// slaOp: gebruik huidigDag als bestandsnaam


function startLaad() {
  const fTop = fetch("https://data.weerlab.nl/toplijst.json?t="+Date.now()).then(r=>r.json());
  const fGeo = fetch("nl_provincies.geojson").then(r=>r.json());
  Promise.all([fTop, fGeo]).then(([data, geo])=>{
    provincies = geo;
    bouwBasemap(document.getElementById("basemap-svg"));
    maakLandMask();
    dagData = data;
    const laatste = Object.keys(data).sort().reverse()[0];
    if (laatste) document.getElementById("hdr-update").textContent = `Bijgewerkt: ${data[laatste].update||laatste}`;
    document.getElementById("status").textContent = "";
    const dagKeys = Object.keys(data).sort().reverse();
    const dagBtns = document.getElementById("dag-btns");

    // Vandaag, gisteren, eergisteren
    dagKeys.slice(0, 3).forEach((key, i) => {
      const d = new Date(key + "T12:00:00");
      const lbl = i === 0 ? "Vandaag" : i === 1 ? "Gisteren" : "Eergisteren";
      const btn = document.createElement("button");
      btn.className = "btn-dag" + (i === 0 ? " actief" : "");
      btn.dataset.dag = key;
      btn.textContent = lbl;
      dagBtns.appendChild(btn);
    });

    // Archief dropdown: dagen 4-10
    const archiefMenu = document.getElementById("archief-menu");
    dagKeys.slice(3, 10).forEach(key => {
      const d = new Date(key + "T12:00:00");
      const item = document.createElement("div");
      item.textContent = dagLabel(d);
      item.dataset.dag = key;
      item.style.cssText = "padding:8px 16px;cursor:pointer;font-size:12px;color:#2a4a70;font-weight:600;border-bottom:1px solid #f0f4f8;";
      item.onmouseover = () => item.style.background = "#f0f4f8";
      item.onmouseout  = () => item.style.background = "white";
      item.onclick = () => {
        selecteerDag(key);
        document.getElementById("archief-menu").style.display = "none";
        document.getElementById("btn-archief").classList.remove("actief");
      };
      archiefMenu.appendChild(item);
    });

    huidigDag = dagKeys[0];
    update();
  }).catch(e=>document.getElementById("status").textContent="Kon toplijst.json niet laden: "+e.message);
}
startLaad();
</script>
