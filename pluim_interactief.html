<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#f0f3f7;--bg2:#ffffff;--header:#003366;--panel:#ffffff;--border:#d0d8e4;--text:#1a2b40;--text2:#5a6a80;--accent:#0066cc;--red:#cc2222;--green:#228822;--yellow:#cc9900}
body{font-family:Inter,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
.header{background:var(--header);padding:14px 20px;display:flex;align-items:center;justify-content:space-between;border-bottom:2px solid #2ec4e8}
.header h1{font-family:monospace;font-size:1.1rem;font-weight:700;color:white;letter-spacing:.02em}
.header p{font-size:.72rem;color:#a8c4e8;margin-top:2px}
.header-right{font-size:.72rem;color:#a8c4e8;text-align:right}
.controls{background:var(--panel);border-bottom:1px solid var(--border);padding:12px 16px;display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;box-shadow:0 1px 4px rgba(0,0,0,0.06)}
.ctrl-groep{display:flex;flex-direction:column;gap:4px}
.ctrl-groep label{font-size:.68rem;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:.05em}
select,input[type=date]{background:white;border:1px solid var(--border);color:var(--text);border-radius:6px;padding:6px 10px;font-size:.82rem;font-family:Inter,sans-serif;outline:none;cursor:pointer;min-width:160px}
.periode-btns,.type-btns{display:flex;gap:5px}
.periode-btn,.type-btn{padding:6px 12px;border-radius:6px;border:1px solid var(--border);background:#f5f7fa;color:var(--text2);font-size:.78rem;font-weight:600;cursor:pointer;transition:all .15s}
.type-btn{padding:6px 14px}
.periode-btn.actief,.type-btn.actief{background:var(--accent);border-color:var(--accent);color:white}
.periode-btn:hover,.type-btn:hover{border-color:var(--accent);color:var(--text)}
.datum-range{display:flex;align-items:center;gap:6px}
.datum-range span{color:var(--text2);font-size:.8rem}
.btn-laden{padding:7px 18px;border-radius:6px;background:var(--accent);border:none;color:white;font-size:.82rem;font-weight:600;cursor:pointer;font-family:Inter,sans-serif;transition:opacity .15s}
.btn-laden:hover{opacity:.85}
.btn-laden:disabled{opacity:.4;cursor:wait}
.btn-download{padding:7px 18px;border-radius:6px;background:#1a5a30;border:1px solid #2a7a40;color:white;font-size:.82rem;font-weight:600;cursor:pointer;font-family:Inter,sans-serif}
#grafiek-wrap{padding:12px 16px}
.grafiek-blok{margin-bottom:8px}
.grafiek-titel{font-size:.9rem;font-weight:600;color:#003366;margin-bottom:5px}
.legenda{display:flex;flex-wrap:wrap;gap:12px;font-size:.75rem;color:var(--text2);margin-bottom:6px}
.legenda span{display:flex;align-items:center;gap:5px}
.leg-lijn{display:inline-block;width:20px;height:3px;border-radius:2px;flex-shrink:0}
.leg-blok{display:inline-block;width:10px;height:10px;border-radius:2px;flex-shrink:0}
#status{text-align:center;padding:60px;color:var(--text2);font-size:.9rem}
.spinner{display:inline-block;width:20px;height:20px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;vertical-align:middle;margin-right:8px}
@keyframes spin{to{transform:rotate(360deg)}}
#copyright{text-align:center;font-size:.7rem;color:#888;padding:6px 0 12px;font-family:monospace}
.verg-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:12px 16px}
.verg-cel{background:white;border-radius:8px;padding:10px;min-width:0;overflow:hidden;border:1px solid #d0d8e4}
.zoek-item{padding:8px 12px;cursor:pointer;font-size:.82rem;color:var(--text);border-bottom:1px solid #e0e4ea}
.zoek-item:hover{background:#f0f4f8}
.zoek-item:last-child{border-bottom:none}
.verg-cel-titel{font-size:.82rem;font-weight:600;color:#003366;margin-bottom:4px}
@media(max-width:900px){.type-btns{flex-wrap:wrap}}
@media(max-width:900px){.verg-grid{grid-template-columns:1fr}}
@media(max-width:600px){.controls{flex-direction:column}}
</style>

<script>
const NL_DAGEN = ['Zo','Ma','Di','Wo','Do','Vr','Za'];
const NL_MND   = ['Jan','Feb','Mrt','Apr','Mei','Jun','Jul','Aug','Sep','Okt','Nov','Dec'];
const GRID='#d0d8e4', TICK='#5a6a80';

// ── Dag/nacht arcering plugin ──
let chartTimestamps = {}; // per chart-id de timestamps opslaan
const nachtPlugin = {
  id: 'nachtArcering',
  beforeDraw(chart) {
    const ts = chartTimestamps[chart.canvas.id];
    if (!ts || !ts.length) return;
    const ctx = chart.ctx;
    const xScale = chart.scales.x;
    const yScale = chart.scales.y || chart.scales.y1;
    if (!xScale || !yScale) return;
    ctx.save();
    ctx.fillStyle = 'rgba(0,0,40,0.08)';
    let inNacht = false, startX = 0;
    for (let i = 0; i < ts.length; i++) {
      const h = new Date(ts[i]).getHours();
      const isNacht = h < 6 || h >= 18;
      const px = xScale.getPixelForValue(i);
      if (isNacht && !inNacht) { inNacht = true; startX = px; }
      if (!isNacht && inNacht) {
        ctx.fillRect(startX, yScale.top, px - startX, yScale.bottom - yScale.top);
        inNacht = false;
      }
    }
    if (inNacht) ctx.fillRect(startX, yScale.top, xScale.getPixelForValue(ts.length - 1) - startX, yScale.bottom - yScale.top);
    ctx.restore();
  }
};
Chart.register(nachtPlugin);

// ── Crosshair: verticale lijn + info + pin bij dubbelklik ──
let crosshairData = {};
let crosshairPinned = null; // {idx, x, html, items} als gepind

function crosshairBerekenItems(cd, idx) {
  const ensVals = (cd.tA||[]).map(m => m[idx]).filter(v => v != null);
  const maxVal = ensVals.length ? Math.max(...ensVals) : null;
  const minVal = ensVals.length ? Math.min(...ensVals) : null;
  const medVal = cd.tMed ? cd.tMed[idx] : null;
  const hresVal = cd.hTemp ? cd.hTemp[idx] : null;
  const mosTx = cd.mosTxData ? cd.mosTxData[idx] : null;
  const mosTn = cd.mosTnData ? cd.mosTnData[idx] : null;
  const ts = chartTimestamps['canvas-temp'];
  const tijd = ts && ts[idx] ? new Date(ts[idx]).toLocaleString('nl-NL',{weekday:'short',day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}) : '';

  const items = [{t:tijd,c:'#555'}];
  if (maxVal != null) items.push({t:`Max: ${maxVal.toFixed(1)}°`,c:'#cc6600'});
  if (hresVal != null) items.push({t:`HRES: ${hresVal.toFixed(1)}°`,c:'#2299ff'});
  if (medVal != null) items.push({t:`Med: ${medVal.toFixed(1)}°`,c:'#cc2222'});
  if (minVal != null) items.push({t:`Min: ${minVal.toFixed(1)}°`,c:'#2266aa'});
  if (mosTx != null) items.push({t:`MOS TX: ${mosTx.toFixed(1)}°`,c:'#ff4444'});
  if (mosTn != null) items.push({t:`MOS TN: ${mosTn.toFixed(1)}°`,c:'#4488ff'});

  let html = items.map(it => `<span style="color:${it.c}">${it.t.includes(':')?it.t:`<b>${it.t}</b>`}</span>`).join('');
  return {items, html, idx};
}

function crosshairTekenBalk(ctx, items, x, yScale) {
  ctx.save();
  ctx.font = 'bold 10px Inter,Arial,sans-serif';
  const pad = 6;
  let totalW = pad;
  items.forEach(it => { totalW += ctx.measureText(it.t).width + 10; });
  const barH = 18;
  const barY = yScale.top - barH - 2;
  ctx.fillStyle = 'rgba(255,255,255,0.92)';
  ctx.strokeStyle = '#d0d8e4';
  ctx.lineWidth = 0.8;
  ctx.beginPath();
  ctx.roundRect(Math.max(0,x-totalW/2), barY, totalW, barH, 3);
  ctx.fill(); ctx.stroke();
  let tx = Math.max(0,x-totalW/2) + pad;
  items.forEach(it => {
    ctx.fillStyle = it.c;
    ctx.fillText(it.t, tx, barY + 13);
    tx += ctx.measureText(it.t).width + 10;
  });
  ctx.restore();
}

const crosshairPlugin = {
  id: 'crosshairInfo',
  afterEvent(chart, args) {
    if (chart.canvas.id !== 'canvas-temp') return;
    const evt = args.event;
    const info = document.getElementById('crosshair-info');
    if (!info) return;
    const cd = crosshairData['canvas-temp'];
    if (!cd) return;

    // Dubbelklik: pin/unpin
    if (evt.type === 'click' && evt.native && evt.native.detail === 2) {
      if (crosshairPinned) {
        crosshairPinned = null;
        info.style.background = '#f8f9fb';
      } else if (chart._chIdx != null) {
        const r = crosshairBerekenItems(cd, chart._chIdx);
        crosshairPinned = {idx: chart._chIdx, x: chart._chX, html: r.html, items: r.items};
        info.innerHTML = r.html + '<span style="color:#0d9488;font-size:.7rem;margin-left:8px">📌 vastgezet</span>';
        info.style.background = '#e8f8f5';
      }
      return;
    }

    // Als gepind, niet updaten bij mousemove
    if (crosshairPinned) return;

    if (evt.type === 'mouseout') {
      chart._chIdx = null;
      info.style.display = 'none';
      return;
    }
    if (evt.type !== 'mousemove') return;
    const xScale = chart.scales.x;
    if (!xScale) return;
    const idx = Math.round(xScale.getValueForPixel(evt.x));
    if (idx < 0 || idx >= (cd.tMed||[]).length) { info.style.display = 'none'; chart._chIdx = null; return; }

    chart._chIdx = idx;
    chart._chX = evt.x;

    const r = crosshairBerekenItems(cd, idx);
    info.innerHTML = r.html;
    info.style.display = 'flex';
    info.style.background = '#f8f9fb';
  },
  afterDraw(chart) {
    if (chart.canvas.id !== 'canvas-temp') return;
    const xScale = chart.scales.x;
    const yScale = chart.scales.y;
    if (!xScale || !yScale) return;

    // Teken gepinde crosshair (blijft in PNG!)
    if (crosshairPinned) {
      const px = xScale.getPixelForValue(crosshairPinned.idx);
      const ctx = chart.ctx;
      ctx.save();
      ctx.beginPath();
      ctx.setLineDash([4, 3]);
      ctx.lineWidth = 1.5;
      ctx.strokeStyle = '#0d9488';
      ctx.moveTo(px, yScale.top);
      ctx.lineTo(px, yScale.bottom);
      ctx.stroke();
      ctx.restore();
      crosshairTekenBalk(ctx, crosshairPinned.items, px, yScale);
    }

    // Teken live crosshair (alleen op scherm, niet als gepind)
    if (!crosshairPinned && chart._chIdx != null) {
      const px = chart._chX || xScale.getPixelForValue(chart._chIdx);
      const ctx = chart.ctx;
      ctx.save();
      ctx.beginPath();
      ctx.setLineDash([4, 3]);
      ctx.lineWidth = 1.2;
      ctx.strokeStyle = '#888';
      ctx.moveTo(px, yScale.top);
      ctx.lineTo(px, yScale.bottom);
      ctx.stroke();
      ctx.restore();
    }
  }
};

async function haalMosmix() {
  if (mosmixCache) return mosmixCache;
  try {
    const r = await fetch('mosmix_nl.json?t=' + Date.now());
    mosmixCache = await r.json();
    return mosmixCache;
  } catch(e) { console.warn('MOSMIX laden mislukt:', e); return null; }
}

function dichtstbijStation(mosmix, lat, lon) {
  let best = null, bestDist = Infinity;
  for (const [naam, coords] of Object.entries(mosmix.stations)) {
    const dx = coords[0] - parseFloat(lon), dy = coords[1] - parseFloat(lat);
    const dist = dx*dx + dy*dy;
    if (dist < bestDist) { bestDist = dist; best = naam; }
  }
  return best;
}

function mosmixBolletjes(mosmix, station, ts) {
  if (!mosmix || !station) return null;
  const txPunten = [], tnPunten = [], rrDagPunten = [], rrNachtPunten = [];
  const dagen = mosmix.dagen || [];
  for (const dag of dagen) {
    const txVal = mosmix.data[dag]?.TX?.[station];
    const tnVal = mosmix.data[dag]?.TN?.[station];
    const rrDagVal = mosmix.data[dag]?.RR_D?.[station];
    const rrNachtVal = mosmix.data[dag]?.RR_N?.[station];
    let txIdx = -1, tnIdx = -1, rrDagIdx = -1, rrNachtIdx = -1;
    for (let i = 0; i < ts.length; i++) {
      if (ts[i].startsWith(dag)) {
        const h = new Date(ts[i]).getHours();
        if (h >= 15 && h <= 17 && txIdx === -1) txIdx = i;  // TX om 16:00
        if (h >= 4 && h <= 6 && tnIdx === -1) tnIdx = i;    // TN om 05:00
        if (h >= 11 && h <= 13 && rrDagIdx === -1) rrDagIdx = i;  // RR dag om 12:00
        if (h >= 23 && rrNachtIdx === -1) rrNachtIdx = i;         // RR nacht om 23:00
        if (h === 0 && rrNachtIdx === -1) rrNachtIdx = i;         // of 00:00
      }
    }
    if (txVal != null && txIdx >= 0) txPunten.push({x: txIdx, y: txVal});
    if (tnVal != null && tnIdx >= 0) tnPunten.push({x: tnIdx, y: tnVal});
    if (rrDagVal != null && rrDagVal > 0 && rrDagIdx >= 0) rrDagPunten.push({x: rrDagIdx, y: rrDagVal});
    if (rrNachtVal != null && rrNachtVal > 0 && rrNachtIdx >= 0) rrNachtPunten.push({x: rrNachtIdx, y: rrNachtVal});
  }
  return { tx: txPunten, tn: tnPunten, rrDag: rrDagPunten, rrNacht: rrNachtPunten, station };
}

function medC(arr,j){
  const v=arr.map(m=>m[j]).filter(x=>x!=null).sort((a,b)=>a-b);
  if(!v.length)return null;
  const mid=Math.floor(v.length/2);
  return v.length%2?v[mid]:(v[mid-1]+v[mid])/2;
}
function pctC(arr,j,p){
  const v=arr.map(m=>m[j]).filter(x=>x!=null).sort((a,b)=>a-b);
  if(!v.length)return null;
  const i=(p/100)*(v.length-1),lo=Math.floor(i),hi=Math.ceil(i);
  return v[lo]+(v[hi]-v[lo])*(i-lo);
}

async function fetchT(url,ms=25000){
  const ctrl=new AbortController();
  const id=setTimeout(()=>ctrl.abort(),ms);
  try{
    const r=await fetch(url,{signal:ctrl.signal});
    clearTimeout(id);
    if(!r.ok)throw new Error(`HTTP ${r.status}`);
    return await r.json();
  }catch(e){clearTimeout(id);throw new Error(e.name==='AbortError'?'Time-out':e.message);}
}

function filterT(times,van,tot){
  if(!van||!tot)return times.map((_,i)=>i);
  const v=new Date(van+'T00:00:00'),t=new Date(tot+'T23:59:59');
  return times.map((ts,i)=>new Date(ts)>=v&&new Date(ts)<=t?i:-1).filter(i=>i>=0);
}

async function laadTemp(lat,lon,naam,dagen,van,tot){
  document.getElementById('header-sub').textContent='51 ensembleleden · Bron: Open-Meteo';
  const[ens,hres]=await Promise.all([
    fetchT(`https://ensemble-api.open-meteo.com/v1/ensemble?latitude=${lat}&longitude=${lon}&hourly=temperature_2m,precipitation&models=ecmwf_ifs025&timezone=Europe%2FAmsterdam&forecast_days=${dagen}`),
    fetchT(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&hourly=temperature_2m,precipitation&models=ecmwf_ifs&timezone=Europe%2FAmsterdam&forecast_days=${dagen}`),
  ]);
  if(!ens?.hourly?.time) throw new Error('Geen ensemble data ontvangen');
  const times=ens.hourly.time;
  const idx=filterT(times,van,tot),ts=idx.map(i=>times[i]);
  const tK=Object.keys(ens.hourly).filter(k=>k.startsWith('temperature_2m_member'));
  const pK=Object.keys(ens.hourly).filter(k=>k.startsWith('precipitation_member'));
  const tA=tK.map(k=>idx.map(i=>ens.hourly[k][i]));
  const pA=pK.map(k=>idx.map(i=>ens.hourly[k][i]));
  const tMed=ts.map((_,j)=>medC(tA,j));
  const tP25=ts.map((_,j)=>pctC(tA,j,25));
  const tP75=ts.map((_,j)=>pctC(tA,j,75));
  const hIdx=filterT(hres.hourly.time,van,tot);
  const hTs=hIdx.map(i=>hres.hourly.time[i]);
  const hTemp=hIdx.map(i=>hres.hourly.temperature_2m[i]);
  const hPrecip=hIdx.map(i=>hres.hourly.precipitation[i]);
  // HRES gemapped op ensemble-timestamps voor crosshair
  const hTempMap = {};
  hTs.forEach((t,i) => { hTempMap[t] = hTemp[i]; });
  const hTempMapped = ts.map(t => hTempMap[t] ?? null);
  const pMed=ts.map((_,j)=>medC(pA,j));
  const pKans=ts.map((_,j)=>pA.map(m=>m[j]).filter(v=>v!=null&&v>0.1).length/pA.length*100);
  const lab=getLab(ts);
  const hLab=getLab(hTs);

  // MOSMIX TX/TN bolletjes
  const mosmix = await haalMosmix();
  const mosStation = mosmix ? dichtstbijStation(mosmix, lat, lon) : null;
  const mosBol = mosmixBolletjes(mosmix, mosStation, ts);
  const mosTxData = Array(ts.length).fill(null);
  const mosTnData = Array(ts.length).fill(null);
  const mosRrDagData = Array(ts.length).fill(null);
  const mosRrNachtData = Array(ts.length).fill(null);
  if (mosBol) {
    mosBol.tx.forEach(p => { if (p.x >= 0 && p.x < mosTxData.length) mosTxData[p.x] = p.y; });
    mosBol.tn.forEach(p => { if (p.x >= 0 && p.x < mosTnData.length) mosTnData[p.x] = p.y; });
    mosBol.rrDag.forEach(p => { if (p.x >= 0 && p.x < mosRrDagData.length) mosRrDagData[p.x] = p.y; });
    mosBol.rrNacht.forEach(p => { if (p.x >= 0 && p.x < mosRrNachtData.length) mosRrNachtData[p.x] = p.y; });
  }
  const mosLabel = mosStation ? ` · MOSMIX ${mosStation}` : '';

  // Temp chart
  document.getElementById('blok-temp').style.display='';

async function laadBewolking(lat,lon,naam,dagen,van,tot){

  ]);

  const idx=filterT(times,van,tot),ts=idx.map(i=>times[i]);

// ── Windrichting ──
async function laadWindrichting(lat,lon,naam,dagen,van,tot){
  const ens=await fetchT(`https://ensemble-api.open-meteo.com/v1/ensemble?latitude=${lat}&longitude=${lon}&hourly=winddirection_10m,windspeed_10m&models=ecmwf_ifs025&windspeed_unit=kmh&timezone=Europe%2FAmsterdam&forecast_days=${dagen}`);
  const times=ens.hourly.time;
  const idx=filterT(times,van,tot),ts=idx.map(i=>times[i]);
  const ddK=Object.keys(ens.hourly).filter(k=>k.startsWith('winddirection_10m_member'));
  const ffK=Object.keys(ens.hourly).filter(k=>k.startsWith('windspeed_10m_member'));
  const ddA=ddK.map(k=>idx.map(i=>ens.hourly[k][i]));
  const ffA=ffK.map(k=>idx.map(i=>ens.hourly[k][i]));
  const ddMed=ts.map((_,j)=>{
    const v=ddA.map(m=>m[j]).filter(x=>x!=null);
    if(!v.length)return null;
    const sinM=v.reduce((s,d)=>s+Math.sin(d*Math.PI/180),0)/v.length;
    const cosM=v.reduce((s,d)=>s+Math.cos(d*Math.PI/180),0)/v.length;
    return(Math.atan2(sinM,cosM)*180/Math.PI+360)%360;
  });
  const spread=ts.map((_,j)=>{
    const v=ddA.map(m=>m[j]).filter(x=>x!=null);
    if(v.length<2)return 0;
    const sinM=v.reduce((s,d)=>s+Math.sin(d*Math.PI/180),0)/v.length;
    const cosM=v.reduce((s,d)=>s+Math.cos(d*Math.PI/180),0)/v.length;
    return Math.round((1-Math.sqrt(sinM**2+cosM**2))*180);
  });
  const ffMed=ts.map((_,j)=>medC(ffA,j));
  const lab=getLab(ts);
  document.getElementById('blok-winddir').style.display='';
  document.getElementById('titel-winddir').textContent=`ECMWF – ${naam}  Windrichting`;
  document.getElementById('leg-winddir').innerHTML=legHtml([
    ['#f5e642','Mediaan richting','lijn'],['rgba(245,230,66,0.25)','Spreiding (°)','blok'],
  ]);
  chartTimestamps['canvas-winddir']=ts;
  actieveCharts.winddir=new Chart(document.getElementById('canvas-winddir'),{
    data:{labels:lab,datasets:[
      {type:'bar',data:spread,backgroundColor:'rgba(245,230,66,0.18)',yAxisID:'y2',order:3},
      {type:'line',data:ddMed,borderColor:'#f5e642',borderWidth:2,pointRadius:3,pointBackgroundColor:'#f5e642',fill:false,tension:0.1,yAxisID:'y1',order:1},
    ]},
    options:{...cfgBase,
      plugins:{legend:{display:false},tooltip:{
        backgroundColor:'rgba(255,255,255,0.96)',titleColor:'#1a2b40',bodyColor:'#333',borderColor:'#d0d8e4',borderWidth:1,
        callbacks:{label:ctx=>{
          if(ctx.datasetIndex===1)return ` Richting: ${ctx.parsed.y!=null?ctx.parsed.y.toFixed(0):'-'}°`;
          if(ctx.datasetIndex===0)return ` Spreiding: ±${ctx.parsed.y.toFixed(0)}°`;
        }}
      }},
      scales:{
        x:cfgBase.scales.x,
        y1:{...yAs('left','°'),min:0,max:360,ticks:{...yAs('left','°').ticks,callback:v=>{
          const dir=['N','NO','O','ZO','Z','ZW','W','NW','N'];
          return `${dir[Math.round(v/45)%9]} (${v}°)`;
        },stepSize:45}},
        y2:{...yAs('right','°','rgba(245,230,66,0.6)'),grid:{display:false},max:180},
      }
    }
  });
}

      {type:'line',data:dpP75,borderColor:'transparent',fill:false,pointRadius:0,tension:0.3,order:9},
      {type:'line',data:dpMed,borderColor:'#22aa22',borderWidth:2.5,pointRadius:0,fill:false,tension:0.3,order:1},
      {type:'line',data:hDp,borderColor:'#2299ff',borderWidth:2,pointRadius:0,fill:false,tension:0.3,order:2,xAxisID:'xH'},
      {type:'line',data:rhMed,borderColor:'rgba(100,220,180,0.7)',borderWidth:1.5,borderDash:[4,3],pointRadius:0,fill:false,tension:0.3,order:3,yAxisID:'y2'},
      {type:'line',data:hRh,borderColor:'rgba(50,200,150,0.7)',borderWidth:1.5,borderDash:[4,3],pointRadius:0,fill:false,tension:0.3,order:4,yAxisID:'y2',xAxisID:'xH'},
    ]},
    options:{...cfgBase,
      plugins:{legend:{display:false},tooltip:{
        backgroundColor:'rgba(255,255,255,0.96)',titleColor:'#1a2b40',bodyColor:'#333',borderColor:'#d0d8e4',borderWidth:1,
        filter:item=>item.datasetIndex>=dpA.length+2&&item.datasetIndex<=dpA.length+5,
        callbacks:{label:ctx=>{
          const names=['Mediaan dp','HRES dp','Mediaan RV','HRES RV'];
          const units=['°C','°C','%','%'];
          const i=ctx.datasetIndex-dpA.length-2;
          if(i<0||i>=names.length)return null;
          return ` ${names[i]}: ${ctx.parsed.y!=null?ctx.parsed.y.toFixed(1):'-'}${units[i]}`;
        }}
      }},
      scales:{
        x:cfgBase.scales.x,xH:{display:false,labels:hLab},
        y:yAs('left','°C','#66ccff'),
        y2:{...yAs('right','%','rgba(100,220,180,0.7)'),grid:{display:false},min:0,max:100},
      }
    }
  });
}

let vergDagen=7,vergModel='ecmwf';
let vergCharts={};

function setVergPeriode(d,btn){
  vergDagen=d;
  document.querySelectorAll('.vbtn').forEach(b=>{b.style.background='#1e3a5a';b.style.color='#aaa';b.style.border='1px solid #2a2a50';});
  if(btn){btn.style.background='#2299ff';btn.style.color='white';btn.style.border='none';}
}
function setVergModel(m,btn){
  vergModel=m;
  document.querySelectorAll('.vmbtn').forEach(b=>{b.style.background='#1e3a5a';b.style.color='#aaa';b.style.border='1px solid #2a2a50';});
  if(btn){btn.style.background='#2299ff';btn.style.color='white';btn.style.border='none';}
  const lbl=document.getElementById('verg-titel-lbl');
  if(lbl)lbl.textContent=m==='hres'?'4 Stations – HRES deterministisch':'4 Pluimen – '+m.toUpperCase()+' ENS';
}

function openVergelijking(){
  // Gebruik vaste stations lijst voor 4-pluimen dropdowns
  const stnHTML=VERG_STATIONS_HTML;
  document.getElementById('grafiek-wrap').style.display='none';
  document.getElementById('vergelijking-wrap').style.display='';
  document.getElementById('btn-reset').style.display='';
  window.scrollTo({top:0,behavior:'smooth'});

  const bestaand=document.getElementById('verg-controls');
  if(bestaand)bestaand.remove();

  const ctrls=document.createElement('div');
  ctrls.id='verg-controls';
  ctrls.style.cssText='padding:12px 16px;background:white;border-bottom:1px solid #d0d8e4;display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end';

  const types=[{val:'temp',lbl:'&#127777; Temp'},{val:'wind',lbl:'&#128168; Wind'},{val:'cloud',lbl:'&#9729;&#65039; Bewolking'},{val:'neerslag',lbl:'&#127783; Neerslag'},{val:'sneeuw',lbl:'&#10052;&#65039; Sneeuw'},{val:'onweer',lbl:'&#9928;&#65039; Onweer'},{val:'hoogte',lbl:'&#128225; 850/500 hPa'},{val:'dauwpunt',lbl:'&#128167; Dauwpunt'}];
  const btnStyle='padding:5px 10px;border-radius:5px;font-size:.75rem;font-weight:600;cursor:pointer';

  let html=`<div style="font-size:.75rem;color:#8888bb;font-weight:700;text-transform:uppercase;letter-spacing:.05em" id="verg-titel-lbl">4 Pluimen / Stations</div>`;
  html+=`<div style="display:flex;flex-direction:column;gap:4px"><label style="font-size:.65rem;color:#5a6a80;text-transform:uppercase;font-weight:600">Periode</label><div style="display:flex;gap:4px">
    <button onclick="setVergPeriode(7,this)" class="vbtn" style="${btnStyle};background:#2299ff;border:none;color:white">7d</button>
    <button onclick="setVergPeriode(10,this)" class="vbtn" style="${btnStyle};background:#e8ecf2;border:1px solid #d0d8e4;color:#666">10d</button>
    <button onclick="setVergPeriode(16,this)" class="vbtn" style="${btnStyle};background:#e8ecf2;border:1px solid #d0d8e4;color:#666">16d</button>
  </div></div>`;
  html+=`<div style="display:flex;flex-direction:column;gap:4px"><label style="font-size:.65rem;color:#5a6a80;text-transform:uppercase;font-weight:600">Model</label><div style="display:flex;gap:4px">
    <button onclick="setVergModel('ecmwf',this)" class="vmbtn" style="${btnStyle};background:#2299ff;border:none;color:white">ECMWF</button>
    <button onclick="setVergModel('icon',this)" class="vmbtn" style="${btnStyle};background:#e8ecf2;border:1px solid #d0d8e4;color:#666">ICON</button>
    <button onclick="setVergModel('hres',this)" class="vmbtn" style="${btnStyle};background:#e8ecf2;border:1px solid #d0d8e4;color:#666">HRES</button>
  </div></div>`;

  for(let i=0;i<4;i++){
    html+=`<div style="display:flex;flex-direction:column;gap:4px">
      <label style="font-size:.65rem;color:#5a6a80;text-transform:uppercase;font-weight:600">Pluim ${i+1}</label>
      <select id="verg-stn-${i}" style="background:white;border:1px solid #d0d8e4;color:#1a2b40;border-radius:6px;padding:5px 8px;font-size:.78rem">${stnHTML}</select>
      <select id="verg-type-${i}" style="background:white;border:1px solid #d0d8e4;color:#1a2b40;border-radius:6px;padding:5px 8px;font-size:.78rem">
        ${types.map(t=>`<option value="${t.val}">${t.lbl}</option>`).join('')}
      </select>
    </div>`;
  }
  html+=`<div style="display:flex;gap:8px;align-items:flex-end">
    <button onclick="laadVergelijking()" style="${btnStyle};background:#2299ff;border:none;color:white;padding:7px 16px">&#9654; Laden</button>
    <button onclick="downloadVergelijking()" style="${btnStyle};background:#1a5a30;border:1px solid #2a7a40;color:white;padding:7px 16px">&#11015; PNG</button>
  </div>`;
  ctrls.innerHTML=html;
  document.querySelector('.controls').after(ctrls);

  for(let i=0;i<4;i++){
    const se=document.getElementById(`verg-stn-${i}`);
    const te=document.getElementById(`verg-type-${i}`);
    const os=localStorage.getItem(`verg-stn-${i}`);
    const ot=localStorage.getItem(`verg-type-${i}`);
    // Probeer opgeslagen waarde; als die niet in de lijst staat gebruik huidigStation
    if(os){
      se.value=os;
      if(!se.value) se.value=`${huidigStation.lat},${huidigStation.lon},${huidigStation.naam}`;
    }
    if(ot) te.value=ot;
    se.addEventListener('change',()=>localStorage.setItem(`verg-stn-${i}`,se.value));
    te.addEventListener('change',()=>localStorage.setItem(`verg-type-${i}`,te.value));
  }
}

async function laadVergelijking(){
  Object.values(vergCharts).forEach(c=>{try{c.destroy();}catch(e){}});
  vergCharts={};
  const wrap=document.getElementById('vergelijking-wrap');
  const oudGrid=document.getElementById('verg-grid');
  if(oudGrid)oudGrid.remove();
  const grid=document.createElement('div');
  grid.id='verg-grid';grid.className='verg-grid';
  wrap.appendChild(grid);

  for(let i=0;i<4;i++){
    const div=document.createElement('div');
    div.id=`verg-cel-${i}`;div.className='verg-cel';
    div.innerHTML=`<div class="verg-cel-titel">Pluim ${i+1} laden…</div><div style="position:relative;width:100%;height:300px"><canvas id="verg-canvas-${i}"></canvas></div>`;
    grid.appendChild(div);
  }
  setTimeout(()=>grid.scrollIntoView({behavior:'smooth',block:'start'}),100);

  for(let i=0;i<4;i++){
    const se=document.getElementById(`verg-stn-${i}`);
    const te=document.getElementById(`verg-type-${i}`);
    if(!se||!te)continue;
    const sv=se.value.split(',');
    if(sv.length<3||!sv[0]||!sv[1]){continue;}
    const lat=sv[0],lon=sv[1],naam=sv[2]||'Onbekend';
    try{
      await laadVergPluim(i,lat,lon,naam,te.value,vergDagen,vergModel);
    }catch(e){
      const cel=document.getElementById(`verg-cel-${i}`);
      if(cel) cel.innerHTML=`<div style="color:#ee4444;padding:20px;font-size:.85rem">&#9888;&#65039; Fout bij ${naam}: ${e.message}</div>`;
    }
  }
}

async function laadVergPluim(idx,lat,lon,naam,type,dagen,model){
  if(model==='hres'){await laadVergHres(idx,lat,lon,naam,type,dagen);return;}
  const ensModel=model==='icon'?'icon_seamless':'ecmwf_ifs025';
  // GFS ensemble ondersteunt alleen temp en neerslag (geen wind/cloud members)
  if(model==='gfs'&&(type==='wind'||type==='cloud'||type==='onweer')){
    const cel=document.getElementById(`verg-cel-${idx}`);
    if(cel)cel.innerHTML=`<div style="color:#ffaa44;padding:20px;font-size:.85rem">⚠️ GFS ondersteunt geen ${type} ensembleleden. Kies Temp of Neerslag.</div>`;
    return;
  }
  let apiTimes=[];
  const mLbl=model==='icon'?'ICON':'ECMWF';
  const medK=model==='icon'?'#22ddaa':'#ee3333';
  const ensK=model==='icon'?'rgba(20,160,120,0.40)':'rgba(20,130,20,0.40)';

  let datasets,scales,tooltipCb,titel;

  if(type==='temp'||type==='neerslag'){
    const ens=await fetchT(`https://ensemble-api.open-meteo.com/v1/ensemble?latitude=${lat}&longitude=${lon}&hourly=temperature_2m,precipitation&models=${ensModel}&timezone=Europe%2FAmsterdam&forecast_days=${dagen}`);
    const times=ens.hourly.time,ts=times;
    apiTimes=ts;
    const tK=Object.keys(ens.hourly).filter(k=>k.startsWith('temperature_2m_member'));
    const pK=Object.keys(ens.hourly).filter(k=>k.startsWith('precipitation_member'));
    const tA=tK.map(k=>ens.hourly[k]);
    const pA=pK.map(k=>ens.hourly[k]);
    if(type==='temp'){
      const tMed=ts.map((_,j)=>medC(tA,j));
      const p25=ts.map((_,j)=>pctC(tA,j,25));
      const p75=ts.map((_,j)=>pctC(tA,j,75));
      titel=`${mLbl} – ${naam} – Temp`;
      datasets=[
        ...ensDatasets(tA,ensK),
        {type:'line',data:p25,borderColor:'transparent',backgroundColor:ensK,fill:'+1',pointRadius:0,tension:0.3,order:9},
        {type:'line',data:p75,borderColor:'transparent',fill:false,pointRadius:0,tension:0.3,order:9},
        {type:'line',data:tMed,borderColor:medK,borderWidth:2,pointRadius:0,fill:false,tension:0.3,order:1},
        {type:'line',data:Array(ts.length).fill(10),borderColor:'rgba(200,50,50,0.4)',borderWidth:0.7,borderDash:[4,4],pointRadius:0,fill:false,order:3},
        {type:'line',data:Array(ts.length).fill(20),borderColor:'rgba(200,50,50,0.3)',borderWidth:0.7,borderDash:[4,4],pointRadius:0,fill:false,order:3},
      ];
      scales={x:{...cfgBase.scales.x},y:yAs('left','°C')};
      tooltipCb={filter:item=>item.datasetIndex===tA.length+2,callbacks:{label:ctx=>` Med: ${ctx.parsed.y!=null?ctx.parsed.y.toFixed(1):'-'}°C`}};
    }else{
      const pMed=ts.map((_,j)=>medC(pA,j));
      const kans=ts.map((_,j)=>pA.map(m=>m[j]).filter(v=>v!=null&&v>0.1).length/pA.length*100);
      titel=`${mLbl} – ${naam} – Neerslag`;
      const pEnsK=model==='icon'?'rgba(20,160,120,0.45)':'rgba(40,160,40,0.45)';
      datasets=[
        ...ensDatasets(pA,pEnsK),
        {type:'line',data:pMed,borderColor:medK,borderWidth:2,pointRadius:0,fill:false,tension:0.3,order:1},
      ];
      scales={x:{...cfgBase.scales.x},y:{...yAs('left',' mm'),min:0}};
      tooltipCb={filter:item=>item.datasetIndex===pA.length,callbacks:{label:ctx=>` Med: ${ctx.parsed.y!=null?ctx.parsed.y.toFixed(2):'-'} mm/u`}};
    }
  }else if(type==='wind'){
    const ens=await fetchT(`https://ensemble-api.open-meteo.com/v1/ensemble?latitude=${lat}&longitude=${lon}&hourly=windspeed_10m&models=${ensModel}&windspeed_unit=kmh&timezone=Europe%2FAmsterdam&forecast_days=${dagen}`);
    const ts=ens.hourly.time;
    apiTimes=ts;
    const ffK=Object.keys(ens.hourly).filter(k=>k.startsWith('windspeed_10m_member'));
    const ffA=ffK.map(k=>ens.hourly[k]);
    const ffMed=ts.map((_,j)=>medC(ffA,j));
    const p25=ts.map((_,j)=>pctC(ffA,j,25));
    const p75=ts.map((_,j)=>pctC(ffA,j,75));
    titel=`${mLbl} – ${naam} – Wind`;
    datasets=[
      ...ensDatasets(ffA,ensK),
      {type:'line',data:p25,borderColor:'transparent',backgroundColor:ensK,fill:'+1',pointRadius:0,tension:0.3,order:9},
      {type:'line',data:p75,borderColor:'transparent',fill:false,pointRadius:0,tension:0.3,order:9},
      {type:'line',data:ffMed,borderColor:medK,borderWidth:2,pointRadius:0,fill:false,tension:0.3,order:1},
    ];
    scales={x:{...cfgBase.scales.x},y:yAs('left',' km/u')};
    tooltipCb={filter:item=>item.datasetIndex===ffA.length+2,callbacks:{label:ctx=>` Med: ${ctx.parsed.y!=null?ctx.parsed.y.toFixed(0):'-'} km/u`}};
  }else if(type==='cloud'){
    const ens=await fetchT(`https://ensemble-api.open-meteo.com/v1/ensemble?latitude=${lat}&longitude=${lon}&hourly=cloudcover&models=${ensModel}&timezone=Europe%2FAmsterdam&forecast_days=${dagen}`);
    const ts=ens.hourly.time;
    apiTimes=ts;
    const ccK=Object.keys(ens.hourly).filter(k=>k.startsWith('cloudcover_member'));
    const members=ccK.map(k=>ens.hourly[k]);
    const ccMed=ts.map((_,j)=>medC(members,j));
    const CATS=[['Onbewolkt',0,12,'rgba(245,230,66,0.85)'],['Licht',12,37,'rgba(220,210,140,0.75)'],['Half',37,62,'rgba(160,148,100,0.70)'],['Zwaar',62,87,'rgba(130,130,150,0.65)'],['Geheel',87,101,'rgba(55,55,70,0.80)']];
    titel=`${mLbl} – ${naam} – Bewolking`;
    datasets=[
      ...CATS.map(([n,lo,hi,kleur])=>({
        type:'bar',label:n,
        data:ts.map((_,j)=>{const col=members.map(m=>m[j]).filter(v=>v!=null);return col.length?col.filter(v=>v>=lo&&v<hi).length/col.length*100:0;}),
        backgroundColor:kleur,order:2,stack:'ens',barPercentage:1,categoryPercentage:1,
      })),
      {type:'line',data:ccMed,borderColor:'white',borderWidth:1.5,pointRadius:0,fill:false,tension:0.3,order:1},
    ];
    scales={x:{...cfgBase.scales.x},y:{...yAs('left','%'),stacked:true,max:100}};
    tooltipCb={filter:item=>item.datasetIndex<5,callbacks:{label:ctx=>` ${ctx.dataset.label}: ${ctx.parsed.y.toFixed(0)}%`}};
  }else if(type==='sneeuw'){
    const ens=await fetchT(`https://ensemble-api.open-meteo.com/v1/ensemble?latitude=${lat}&longitude=${lon}&hourly=snowfall,temperature_2m&models=${ensModel}&timezone=Europe%2FAmsterdam&forecast_days=${dagen}`);
    const ts=ens.hourly.time;
    apiTimes=ts;
    const sfK=Object.keys(ens.hourly).filter(k=>k.startsWith('snowfall_member'));
    const tK=Object.keys(ens.hourly).filter(k=>k.startsWith('temperature_2m_member'));
    const sfA=sfK.map(k=>ens.hourly[k]);
    const tA=tK.map(k=>ens.hourly[k]);
    const sfMed=ts.map((_,j)=>medC(sfA,j));
    const sfP25=ts.map((_,j)=>pctC(sfA,j,25));
    const sfP75=ts.map((_,j)=>pctC(sfA,j,75));
    const sfP90=ts.map((_,j)=>pctC(sfA,j,90));
    const kans=ts.map((_,j)=>sfA.map(m=>m[j]).filter(v=>v!=null&&v>0.1).length/(sfA.length||1)*100);
    const kansV=ts.map((_,j)=>tA.map(m=>m[j]).filter(v=>v!=null&&v<0).length/(tA.length||1)*100);
    titel=`${mLbl} – ${naam} – Sneeuw`;
    datasets=[
      {type:'line',data:sfP25,borderColor:'transparent',backgroundColor:'rgba(150,200,255,0.18)',fill:'+1',pointRadius:0,tension:0.3,order:9},
      {type:'line',data:sfP90,borderColor:'transparent',fill:false,pointRadius:0,tension:0.3,order:9},
      {type:'line',data:sfP25,borderColor:'transparent',backgroundColor:'rgba(150,200,255,0.32)',fill:'+1',pointRadius:0,tension:0.3,order:8},
      {type:'line',data:sfP75,borderColor:'transparent',fill:false,pointRadius:0,tension:0.3,order:8},
      {type:'line',data:sfMed,borderColor:'#aaddff',borderWidth:2,pointRadius:0,fill:false,tension:0.3,order:1},
      {type:'bar',data:kans,backgroundColor:'rgba(150,200,255,0.35)',yAxisID:'y2',order:4,barPercentage:1,categoryPercentage:1},
      {type:'bar',data:kansV,backgroundColor:'rgba(180,100,255,0.5)',yAxisID:'y2',order:3,barPercentage:0.5,categoryPercentage:0.8},
    ];
    scales={x:{...cfgBase.scales.x},y:{...yAs('left',' cm/u'),min:0},y2:{...yAs('right','%','rgba(150,200,255,0.7)'),grid:{display:false},min:0,max:100}};
    tooltipCb={filter:item=>item.datasetIndex>=4,callbacks:{label:ctx=>{
      if(ctx.datasetIndex===4)return ` Med: ${ctx.parsed.y.toFixed(2)} cm/u`;
      if(ctx.datasetIndex===5)return ` Sneeuwkans: ${ctx.parsed.y.toFixed(0)}%`;
      if(ctx.datasetIndex===6)return ` Vrieskans: ${ctx.parsed.y.toFixed(0)}%`;
    }}};
  }else if(type==='onweer'){
    const ens=await fetchT(`https://ensemble-api.open-meteo.com/v1/ensemble?latitude=${lat}&longitude=${lon}&hourly=cape,lifted_index&models=${ensModel}&timezone=Europe%2FAmsterdam&forecast_days=${dagen}`);
    const ts=ens.hourly.time;
    apiTimes=ts;
    const cK=Object.keys(ens.hourly).filter(k=>k.startsWith('cape_member'));
    const liK=Object.keys(ens.hourly).filter(k=>k.startsWith('lifted_index_member'));
    const cA=cK.map(k=>ens.hourly[k]);
    const liA=liK.map(k=>ens.hourly[k]);
    const capeMed=ts.map((_,j)=>medC(cA,j));
    const kL=ts.map((_,j)=>cA.map(m=>m[j]).filter(v=>v!=null&&v>100).length/(cA.length||1)*100);
    const kM=ts.map((_,j)=>cA.map(m=>m[j]).filter(v=>v!=null&&v>500).length/(cA.length||1)*100);
    const kZ=ts.map((_,j)=>cA.map(m=>m[j]).filter(v=>v!=null&&v>1500).length/(cA.length||1)*100);
    const kO=ts.map((_,j)=>liA.map(m=>m[j]).filter(v=>v!=null&&v<0).length/(liA.length||1)*100);
    titel=`${mLbl} – ${naam} – Onweer`;
    datasets=[
      {type:'bar',data:kL,backgroundColor:'rgba(255,200,50,0.28)',yAxisID:'y2',order:4,barPercentage:1,categoryPercentage:1},
      {type:'bar',data:kM,backgroundColor:'rgba(255,120,30,0.48)',yAxisID:'y2',order:3,barPercentage:1,categoryPercentage:1},
      {type:'bar',data:kZ,backgroundColor:'rgba(220,50,50,0.68)',yAxisID:'y2',order:2,barPercentage:1,categoryPercentage:1},
      {type:'bar',data:kO,backgroundColor:'rgba(180,100,255,0.35)',yAxisID:'y2',order:5,barPercentage:0.5,categoryPercentage:0.8},
      {type:'line',data:capeMed,borderColor:'#ffdd44',borderWidth:2,pointRadius:0,fill:false,tension:0.3,yAxisID:'y1',order:1},
    ];
    scales={x:{...cfgBase.scales.x},y1:{...yAs('left',' J/kg','#ffdd44'),min:0},y2:{...yAs('right','%','rgba(255,180,50,0.7)'),grid:{display:false},min:0,max:100}};
    tooltipCb={callbacks:{label:ctx=>{
      const n=['CAPE>100%','CAPE>500%','CAPE>1500%','LI<0%','CAPE'];
      const u=['%','%','%','%',' J/kg'];
      return ` ${n[ctx.datasetIndex]}: ${ctx.parsed.y.toFixed(0)}${u[ctx.datasetIndex]}`;
    }}};
  }

  const cel=document.getElementById(`verg-cel-${idx}`);
  cel.innerHTML=`<div class="verg-cel-titel" id="verg-t-${idx}">${titel}</div><div style="position:relative;width:100%;height:300px"><canvas id="verg-canvas-${idx}"></canvas></div>`;
  const labArr=getLab(apiTimes);
  vergCharts[idx]=new Chart(document.getElementById(`verg-canvas-${idx}`),{
    data:{labels:labArr,datasets},
    options:{...cfgBase,
      plugins:{legend:{display:false},tooltip:{backgroundColor:'rgba(255,255,255,0.96)',titleColor:'#1a2b40',bodyColor:'#333',borderColor:'#d0d8e4',borderWidth:1,...tooltipCb}},
      scales,
      barPercentage:type==='cloud'?1:0.9,categoryPercentage:type==='cloud'?1:0.8,
    }
  });
}



// ── ECMWF vs ICON vergelijking (Temp + Neerslag + Wind) ──
async function laadVergelijkingModel(lat,lon,naam,dagen,van,tot){
  document.getElementById('header-sub').textContent='ECMWF 51 vs ICON 40 leden · Bron: Open-Meteo';

  // Haal temp+neerslag+wind op voor beide modellen tegelijk
  const[ensE,ensI,windE,windI]=await Promise.all([
    fetchT(`https://ensemble-api.open-meteo.com/v1/ensemble?latitude=${lat}&longitude=${lon}&hourly=temperature_2m,precipitation&models=ecmwf_ifs025&timezone=Europe%2FAmsterdam&forecast_days=${dagen}`),

  ]);

  // Temp

  const tAE=Object.keys(ensE.hourly).filter(k=>k.startsWith('temperature_2m_member')).map(k=>idx.map(i=>ensE.hourly[k][i]));

  const eMedT=ts.map((_,j)=>medC(tAE,j)), eP25T=ts.map((_,j)=>pctC(tAE,j,25)), eP75T=ts.map((_,j)=>pctC(tAE,j,75));
  const iMedT=tsI.map((_,j)=>medC(tAI,j)), iP25T=tsI.map((_,j)=>pctC(tAI,j,25)), iP75T=tsI.map((_,j)=>pctC(tAI,j,75));

  // Neerslag

  const iKans=tsI.map((_,j)=>pAI.map(m=>m[j]).filter(v=>v!=null&&v>0.1).length/(pAI.length||1)*100);

  // Wind
  const idxW=filterT(windE.hourly.time,van,tot),tsW=idxW.map(i=>windE.hourly.time[i]);
  const idxWI=filterT(windI.hourly.time,van,tot),tsWI=idxWI.map(i=>windI.hourly.time[i]);
  const ffAE=Object.keys(windE.hourly).filter(k=>k.startsWith('windspeed_10m_member')).map(k=>idxW.map(i=>windE.hourly[k][i]));
  const ffAI=Object.keys(windI.hourly).filter(k=>k.startsWith('windspeed_10m_member')).map(k=>idxWI.map(i=>windI.hourly[k][i]));
  const eMedW=tsW.map((_,j)=>medC(ffAE,j)), eP25W=tsW.map((_,j)=>pctC(ffAE,j,25)), eP75W=tsW.map((_,j)=>pctC(ffAE,j,75));
  const iMedW=tsWI.map((_,j)=>medC(ffAI,j)), iP25W=tsWI.map((_,j)=>pctC(ffAI,j,25)), iP75W=tsWI.map((_,j)=>pctC(ffAI,j,75));
  const labW=getLab(tsW),labWI=getLab(tsWI);

  const ttCfg={backgroundColor:'rgba(13,13,26,0.97)',titleColor:'#ddddf0',bodyColor:'#aabbcc',borderColor:'#334466',borderWidth:1};

  // ── Temperatuur ──
  document.getElementById('blok-vergelijking').style.display='';
  document.getElementById('titel-vergelijking').textContent=`ECMWF vs ICON – ${naam}  Temperatuur`;
  document.getElementById('leg-vergelijking').innerHTML=legHtml([
    ['rgba(68,221,68,0.4)','ECMWF IQR','blok'],['#ee3333','ECMWF mediaan','lijn'],
    ['rgba(34,221,170,0.4)','ICON IQR','blok'],['#22ddaa','ICON mediaan','lijn'],
  ]);
  if(actieveCharts.vergelijking) actieveCharts.vergelijking.destroy();
  chartTimestamps['canvas-vergelijking']=ts;
  actieveCharts.vergelijking=new Chart(document.getElementById('canvas-vergelijking'),{
    data:{labels:lab,datasets:[
      {type:'line',data:eP25T,borderColor:'transparent',backgroundColor:'rgba(20,130,20,0.40)',fill:'+1',pointRadius:0,tension:0.3,order:9},
      {type:'line',data:eP75T,borderColor:'transparent',fill:false,pointRadius:0,tension:0.3,order:9},
      {type:'line',data:iP25T,borderColor:'transparent',backgroundColor:'rgba(20,160,120,0.40)',fill:'+1',pointRadius:0,tension:0.3,order:8,xAxisID:'xI'},
      {type:'line',data:iP75T,borderColor:'transparent',fill:false,pointRadius:0,tension:0.3,order:8,xAxisID:'xI'},
      {type:'line',data:eMedT,borderColor:'#ee3333',borderWidth:2.5,pointRadius:0,fill:false,tension:0.3,order:2},
      {type:'line',data:iMedT,borderColor:'#22ddaa',borderWidth:2.5,pointRadius:0,fill:false,tension:0.3,order:1,xAxisID:'xI'},
    ]},
    options:{...cfgBase,plugins:{legend:{display:false},tooltip:{...ttCfg,
      filter:item=>item.datasetIndex>=4,
      callbacks:{label:ctx=>{const n=['ECMWF','ICON'];const i=ctx.datasetIndex-4;if(i<0||i>1)return null;return ` ${n[i]}: ${ctx.parsed.y!=null?ctx.parsed.y.toFixed(1):'-'}°C`;}}}},
      scales:{x:cfgBase.scales.x,xI:{display:false,labels:labI},y:yAs('left','°C')}}
  });

  // ── Neerslag ──
  document.getElementById('blok-verg-neerslag').style.display='';
  document.getElementById('titel-verg-neerslag').textContent=`ECMWF vs ICON – ${naam}  Neerslag & kans`;
  document.getElementById('leg-verg-neerslag').innerHTML=legHtml([
    ['#ee3333','ECMWF mediaan','lijn'],['rgba(238,51,51,0.25)','ECMWF kans %','blok'],
    ['#22ddaa','ICON mediaan','lijn'],['rgba(34,221,170,0.25)','ICON kans %','blok'],

      {type:'bar',data:iKans,backgroundColor:'rgba(34,221,170,0.20)',yAxisID:'y2',order:3,xAxisID:'xI'},
      {type:'line',data:eMedP,borderColor:'#ee3333',borderWidth:2,pointRadius:0,fill:false,tension:0.3,yAxisID:'y1',order:2},

      callbacks:{label:ctx=>{
        const n=['ECMWF kans','ICON kans','ECMWF med.','ICON med.'];
        const u=[' %',' %',' mm/u',' mm/u'];
        if(ctx.datasetIndex>3)return null;

        return ` ${n[ctx.datasetIndex]}: ${v!=null?(ctx.datasetIndex<2?v.toFixed(0):v.toFixed(2)):'-'}${u[ctx.datasetIndex]}`;
      }}}},
      scales:{x:cfgBase.scales.x,xI:{display:false,labels:labI},

// ── HRES Operationeel (deterministisch, geen ensemble) ──
async function laadHres(lat,lon,naam,dagen,van,tot){
  document.getElementById('header-sub').textContent='HRES operationeel · Bron: Open-Meteo';

  // Bepaal vorige run: 12Z gisteren of 00Z vandaag
  const nu=new Date();
  const utcH=nu.getUTCHours();
  let vorigeRun;
  if(utcH>=9){
    // Huidige run = 00Z vandaag, vorige = 12Z gisteren
    const gisteren=new Date(+nu-86400000);
    vorigeRun=`${gisteren.toISOString().slice(0,10)}T12:00`;
  } else {
    // Huidige run = 12Z gisteren, vorige = 00Z gisteren
    const gisteren=new Date(+nu-86400000);
    vorigeRun=`${gisteren.toISOString().slice(0,10)}T00:00`;
  }

  // Haal huidige én vorige run op parallel
  const baseUrl=`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&hourly=temperature_2m,precipitation,windspeed_10m,windgusts_10m&models=ecmwf_ifs&windspeed_unit=kmh&timezone=Europe%2FAmsterdam&forecast_days=${dagen}`;
  // Previous Runs API: variabelen met _previous_day1 suffix = voorspelling van 1 dag geleden
  const prevUrl=`https://previous-runs-api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&hourly=temperature_2m_previous_day1,precipitation_previous_day1,windspeed_10m_previous_day1,windgusts_10m_previous_day1&models=ecmwf_ifs&windspeed_unit=kmh&timezone=Europe%2FAmsterdam&forecast_days=${dagen}`;

  const[hres,prev]=await Promise.all([
    fetchT(baseUrl),
    fetchT(prevUrl).catch(e=>{console.warn('Previous runs fout:',e);return null;}),
  ]);

  const times=hres.hourly.time;
  const idx=filterT(times,van,tot),ts=idx.map(i=>times[i]);
  const hTemp=idx.map(i=>hres.hourly.temperature_2m[i]);
  const hPrec=idx.map(i=>hres.hourly.precipitation[i]);
  const hFF=idx.map(i=>hres.hourly.windspeed_10m[i]);
  const hFX=idx.map(i=>hres.hourly.windgusts_10m[i]);
  const lab=getLab(ts);
  const ttCfg={backgroundColor:'rgba(13,13,26,0.97)',titleColor:'#ddddf0',bodyColor:'#aabbcc',borderColor:'#334466',borderWidth:1};

  // Map vorige run op dezelfde tijdstempels (match op string + epoch fallback)
  let pTemp=null,pPrec=null,pFF=null,pFX=null;
  if(prev&&prev.hourly&&prev.hourly.time){
    const tKey='temperature_2m_previous_day1';
    const pKey='precipitation_previous_day1';
    const ffKey='windspeed_10m_previous_day1';
    const fxKey='windgusts_10m_previous_day1';
    // Bouw lookup op string EN epoch
    const pByStr={}, pByEpoch={};
    prev.hourly.time.forEach((t,i)=>{
      const row={
        t: prev.hourly[tKey]?.[i]??null,
        p: prev.hourly[pKey]?.[i]??null,
        ff: prev.hourly[ffKey]?.[i]??null,
        fx: prev.hourly[fxKey]?.[i]??null,
      };
      pByStr[t]=row;
      pByEpoch[new Date(t).getTime()]=row;
    });
    pTemp=[]; pPrec=[]; pFF=[]; pFX=[];
    let heeftData=false;
    ts.forEach(t=>{
      const d=pByStr[t]||pByEpoch[new Date(t).getTime()];
      pTemp.push(d?.t??null);
      pPrec.push(d?.p??null);
      pFF.push(d?.ff??null);
      pFX.push(d?.fx??null);
      if(d?.t!=null) heeftData=true;
    });
    if(!heeftData){pTemp=null;pPrec=null;pFF=null;pFX=null;}
  }

  const runNaam=utcH>=9?'00Z vandaag':'12Z gisteren';
  const prevNaam=utcH>=9?'12Z gisteren':'00Z gisteren';

  // ── Temperatuur ──
  document.getElementById('blok-hres').style.display='';
  document.getElementById('titel-hres').textContent=`HRES – ${naam}  Temperatuur`;
  document.getElementById('leg-hres').innerHTML=legHtml([
    ['#2299ff',`Huidige run (${runNaam})`,'lijn'],
    ['rgba(150,210,255,0.7)',`Vorige run (${prevNaam})`,'lijn'],
    ['rgba(200,50,50,0.5)','10° / 20°C','dash'],
  ]);
  if(actieveCharts.hres)actieveCharts.hres.destroy();
  chartTimestamps['canvas-hres']=ts;
  actieveCharts.hres=new Chart(document.getElementById('canvas-hres'),{
    data:{labels:lab,datasets:[
      {type:'line',data:hTemp,borderColor:'#2299ff',borderWidth:2.5,pointRadius:0,fill:false,tension:0.3,order:1},
      ...(pTemp&&pTemp.some(v=>v!==null)?[{type:'line',data:pTemp,borderColor:'rgba(150,210,255,0.7)',borderWidth:1.5,borderDash:[3,2],pointRadius:0,fill:false,tension:0.3,order:2,spanGaps:true}]:[]),
      {type:'line',data:Array(ts.length).fill(10),borderColor:'rgba(200,50,50,0.45)',borderWidth:0.8,borderDash:[5,4],pointRadius:0,fill:false,order:4},
      {type:'line',data:Array(ts.length).fill(20),borderColor:'rgba(200,50,50,0.35)',borderWidth:0.7,borderDash:[5,4],pointRadius:0,fill:false,order:4},
    ]},
    options:{...cfgBase,
      plugins:{legend:{display:false},tooltip:{...ttCfg,
        filter:item=>item.datasetIndex<=(pTemp?1:0),
        callbacks:{label:ctx=>{
          const namen=pTemp?[`${runNaam}`,`${prevNaam}`]:[`${runNaam}`];
          return ` ${namen[ctx.datasetIndex]}: ${ctx.parsed.y!=null?ctx.parsed.y.toFixed(1):'-'}°C`;
        }}
      }},
      scales:{x:cfgBase.scales.x,y:yAs('left','°C')}
    }
  });

  // ── Neerslag ──
  document.getElementById('blok-hres-neerslag').style.display='';
  document.getElementById('titel-hres-neerslag').textContent=`HRES – ${naam}  Neerslag`;
  document.getElementById('leg-hres-neerslag').innerHTML=legHtml([
    ['rgba(34,153,255,0.6)','Huidige run','blok'],
    ...(pPrec?[['rgba(34,153,255,0.3)','Vorige run','blok']]:[] ),
  ]);
  if(actieveCharts['hres-neerslag'])actieveCharts['hres-neerslag'].destroy();
  chartTimestamps['canvas-hres-neerslag']=ts;
  actieveCharts['hres-neerslag']=new Chart(document.getElementById('canvas-hres-neerslag'),{
    data:{labels:lab,datasets:[
      ...(pPrec?[{type:'bar',data:pPrec,backgroundColor:'rgba(34,153,255,0.25)',order:2,barPercentage:1,categoryPercentage:1}]:[]),
      {type:'bar',data:hPrec,backgroundColor:'rgba(34,153,255,0.6)',order:1,barPercentage:0.6,categoryPercentage:0.9},
    ]},
    options:{...cfgBase,
      plugins:{legend:{display:false},tooltip:{...ttCfg,
        callbacks:{label:ctx=>{
          if(pPrec){
            if(ctx.datasetIndex===0)return ` ${prevNaam}: ${ctx.parsed.y.toFixed(2)} mm/u`;
            return ` ${runNaam}: ${ctx.parsed.y.toFixed(2)} mm/u`;
          }
          return ` HRES: ${ctx.parsed.y.toFixed(2)} mm/u`;
        }}
      }},
      scales:{x:cfgBase.scales.x,y:{...yAs('left',' mm'),min:0}}
    }
  });

  // ── Wind ──
  document.getElementById('blok-hres-wind').style.display='';
  document.getElementById('titel-hres-wind').textContent=`HRES – ${naam}  Wind (km/u)`;
  document.getElementById('leg-hres-wind').innerHTML=legHtml([
    ['#2299ff','Wind huidig','lijn'],['#ff6633','Stoten huidig','dash'],
    ...(pFF?[['rgba(34,153,255,0.4)','Wind vorig','lijn'],['rgba(255,102,51,0.4)','Stoten vorig','dash']]:[] ),
  ]);
  if(actieveCharts['hres-wind'])actieveCharts['hres-wind'].destroy();
  chartTimestamps['canvas-hres-wind']=ts;
  actieveCharts['hres-wind']=new Chart(document.getElementById('canvas-hres-wind'),{
    data:{labels:lab,datasets:[
      ...(pFF?[
        {type:'line',data:pFF,borderColor:'rgba(34,153,255,0.4)',borderWidth:1.2,borderDash:[2,2],pointRadius:0,fill:false,tension:0.3,order:4},
        {type:'line',data:pFX,borderColor:'rgba(255,102,51,0.4)',borderWidth:1.2,borderDash:[2,2],pointRadius:0,fill:false,tension:0.3,order:3},
      ]:[]),
      {type:'line',data:hFF,borderColor:'#2299ff',borderWidth:2.5,pointRadius:0,fill:false,tension:0.3,order:2},
      {type:'line',data:hFX,borderColor:'#ff6633',borderWidth:2,borderDash:[4,3],pointRadius:0,fill:false,tension:0.3,order:1},
    ]},
    options:{...cfgBase,
      plugins:{legend:{display:false},tooltip:{...ttCfg,
        filter:item=>item.datasetIndex>=(pFF?2:0),
        callbacks:{label:ctx=>{
          const base=pFF?2:0;
          const namen=['Wind huidig','Stoten huidig'];
          const i=ctx.datasetIndex-base;
          if(i<0||i>=namen.length)return null;
          return ` ${namen[i]}: ${ctx.parsed.y.toFixed(0)} km/u`;
        }}
      }},
      scales:{x:cfgBase.scales.x,y:yAs('left',' km/u')}
    }
  });
}

// ── 4 Stations: HRES deterministisch ──
async function laadVergHres(idx,lat,lon,naam,type,dagen){
  const url=type==='wind'
    ?`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&hourly=windspeed_10m,windgusts_10m&models=ecmwf_ifs&windspeed_unit=kmh&timezone=Europe%2FAmsterdam&forecast_days=${dagen}`
    :`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&hourly=temperature_2m,precipitation&models=ecmwf_ifs&timezone=Europe%2FAmsterdam&forecast_days=${dagen}`;
  const prevUrl=type==='wind'
    ?`https://previous-runs-api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&hourly=windspeed_10m_previous_day1,windgusts_10m_previous_day1&models=ecmwf_ifs&windspeed_unit=kmh&timezone=Europe%2FAmsterdam&forecast_days=${dagen}`
    :`https://previous-runs-api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&hourly=temperature_2m_previous_day1,precipitation_previous_day1&models=ecmwf_ifs&timezone=Europe%2FAmsterdam&forecast_days=${dagen}`;
  const[hres,prev]=await Promise.all([fetchT(url),fetchT(prevUrl).catch(()=>null)]);
  const ts=hres.hourly.time;
  const lab=getLab(ts);

  // Vorige run mapping
  let pLookup={};
  if(prev&&prev.hourly&&prev.hourly.time){
    prev.hourly.time.forEach((t,i)=>{
      pLookup[t]={
        t:prev.hourly.temperature_2m_previous_day1?.[i]??null,
        p:prev.hourly.precipitation_previous_day1?.[i]??null,
        ff:prev.hourly.windspeed_10m_previous_day1?.[i]??null,
        fx:prev.hourly.windgusts_10m_previous_day1?.[i]??null,
      };
    });
  }
  const heeftPrev=Object.keys(pLookup).length>0;

  let datasets,scales,tooltipCb,titel;

  if(type==='temp'){
    const pTemp=heeftPrev?ts.map(t=>pLookup[t]?.t??null):null;
    titel=`HRES – ${naam} – Temp`;
    datasets=[
      {type:'line',data:hres.hourly.temperature_2m,borderColor:'#2299ff',borderWidth:2,pointRadius:0,fill:false,tension:0.3},
      ...(pTemp&&pTemp.some(v=>v!==null)?[{type:'line',data:pTemp,borderColor:'rgba(150,210,255,0.6)',borderWidth:1.2,borderDash:[3,2],pointRadius:0,fill:false,tension:0.3,spanGaps:true}]:[]),
      {type:'line',data:Array(ts.length).fill(10),borderColor:'rgba(200,50,50,0.4)',borderWidth:0.7,borderDash:[4,4],pointRadius:0,fill:false},
      {type:'line',data:Array(ts.length).fill(20),borderColor:'rgba(200,50,50,0.3)',borderWidth:0.7,borderDash:[4,4],pointRadius:0,fill:false},
    ];
    scales={x:{...cfgBase.scales.x,ticks:{...cfgBase.scales.x.ticks,maxTicksLimit:8}},y:yAs('left','°C')};
    tooltipCb={filter:item=>item.datasetIndex<=(pTemp?1:0),callbacks:{label:ctx=>{
      const n=pTemp?['HRES huidig','HRES vorig']:['HRES'];
      return ` ${n[ctx.datasetIndex]}: ${ctx.parsed.y!=null?ctx.parsed.y.toFixed(1):'-'}°C`;
    }}};
  }else if(type==='neerslag'){
    const pPrec=heeftPrev?ts.map(t=>pLookup[t]?.p??null):null;
    titel=`HRES – ${naam} – Neerslag`;
    datasets=[
      ...(pPrec&&pPrec.some(v=>v!==null)?[{type:'bar',data:pPrec,backgroundColor:'rgba(34,153,255,0.2)',order:2,barPercentage:1,categoryPercentage:1}]:[]),
      {type:'bar',data:hres.hourly.precipitation,backgroundColor:'rgba(34,153,255,0.5)',order:1,barPercentage:0.6,categoryPercentage:0.9},
    ];
    scales={x:{...cfgBase.scales.x,ticks:{...cfgBase.scales.x.ticks,maxTicksLimit:8}},y:{...yAs('left',' mm'),min:0}};
    tooltipCb={callbacks:{label:ctx=>` ${ctx.datasetIndex===0&&pPrec?'Vorig':'HRES'}: ${ctx.parsed.y.toFixed(2)} mm/u`}};
  }else if(type==='wind'){
    const pFF=heeftPrev?ts.map(t=>pLookup[t]?.ff??null):null;
    const pFX=heeftPrev?ts.map(t=>pLookup[t]?.fx??null):null;
    titel=`HRES – ${naam} – Wind`;
    datasets=[
      ...(pFF&&pFF.some(v=>v!==null)?[
        {type:'line',data:pFF,borderColor:'rgba(34,153,255,0.35)',borderWidth:1,borderDash:[2,2],pointRadius:0,fill:false,tension:0.3},
        {type:'line',data:pFX,borderColor:'rgba(255,102,51,0.35)',borderWidth:1,borderDash:[2,2],pointRadius:0,fill:false,tension:0.3},
      ]:[]),
      {type:'line',data:hres.hourly.windspeed_10m,borderColor:'#2299ff',borderWidth:2,pointRadius:0,fill:false,tension:0.3},
      {type:'line',data:hres.hourly.windgusts_10m,borderColor:'#ff6633',borderWidth:2,borderDash:[4,3],pointRadius:0,fill:false,tension:0.3},
    ];
    scales={x:{...cfgBase.scales.x,ticks:{...cfgBase.scales.x.ticks,maxTicksLimit:8}},y:yAs('left',' km/u')};
    const base=pFF&&pFF.some(v=>v!==null)?2:0;
    tooltipCb={filter:item=>item.datasetIndex>=base,callbacks:{label:ctx=>{
      const n=['Wind','Stoten'];return ` ${n[ctx.datasetIndex-base]}: ${ctx.parsed.y.toFixed(0)} km/u`;
    }}};
  }else if(type==='cloud'){
    titel=`HRES – ${naam} – Bewolking`;
    const hres2=await fetchT(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&hourly=cloudcover&models=ecmwf_ifs&timezone=Europe%2FAmsterdam&forecast_days=${dagen}`);
    datasets=[{type:'bar',data:hres2.hourly.cloudcover,backgroundColor:'rgba(130,130,150,0.6)',order:1,barPercentage:1,categoryPercentage:1}];
    scales={x:{...cfgBase.scales.x,ticks:{...cfgBase.scales.x.ticks,maxTicksLimit:8}},y:{...yAs('left','%'),min:0,max:100}};
    tooltipCb={callbacks:{label:ctx=>` Bewolking: ${ctx.parsed.y.toFixed(0)}%`}};
  }else{
    titel=`HRES – ${naam}`;
    datasets=[{type:'line',data:hres.hourly.temperature_2m,borderColor:'#2299ff',borderWidth:2,pointRadius:0,fill:false,tension:0.3}];
    scales={x:{...cfgBase.scales.x},y:yAs('left','°C')};
    tooltipCb={};
  }

  const cel=document.getElementById(`verg-cel-${idx}`);
  cel.innerHTML=`<div class="verg-cel-titel">${titel}</div><div style="position:relative;width:100%;height:300px"><canvas id="verg-canvas-${idx}"></canvas></div>`;
  vergCharts[idx]=new Chart(document.getElementById(`verg-canvas-${idx}`),{
    data:{labels:getLab(ts),datasets},
    options:{...cfgBase,
      plugins:{legend:{display:false},tooltip:{backgroundColor:'rgba(255,255,255,0.96)',titleColor:'#1a2b40',bodyColor:'#333',borderColor:'#d0d8e4',borderWidth:1,...tooltipCb}},
      scales,barPercentage:type==='cloud'?1:0.9,categoryPercentage:type==='cloud'?1:0.8,
    }
  });
}
// ── PNG download met formaat-opties ──
function maakPngCanvas(canvasList,naam,typeLabel,modelLabel,eigenTekst){
  const HDR=eigenTekst?68:48, PAD=8, FOOT=22;
  const W=canvasList[0].width;
  const totH=HDR+canvasList.reduce((s,c)=>s+c.height+PAD,0)-PAD+FOOT;
  const out=document.createElement('canvas');
  out.width=W; out.height=totH;
  const ctx=out.getContext('2d');

  // Lichte achtergrond
  ctx.fillStyle='#f0f3f7';
  ctx.fillRect(0,0,W,totH);

  // Header (donkerblauw)
  ctx.fillStyle='#003366';
  ctx.fillRect(0,0,W,HDR);

  // Links: titel + sub
  ctx.fillStyle='white';
  ctx.font='bold 15px Inter,sans-serif';
  ctx.fillText('Ed Aldus WM',14,20);
  ctx.fillStyle='#a8c8e8';
  ctx.font='11px Inter,sans-serif';
  ctx.fillText(`${naam} · ${typeLabel} · ${modelLabel}`,14,36);
  if(eigenTekst){
    ctx.fillStyle='#f5e642';
    ctx.font='bold 13px Inter,sans-serif';
    ctx.fillText(eigenTekst,14,54);
  }

  // Rechts: datum + copyright
  const datStr=new Date().toLocaleString('nl-NL',{timeZone:'Europe/Amsterdam',day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'});
  ctx.textAlign='right';
  ctx.fillStyle='white';
  ctx.font='bold 12px Inter,sans-serif';
  ctx.fillText(datStr,W-14,20);
  ctx.fillStyle='#6a8aaa';
  ctx.font='10px Inter,sans-serif';
  ctx.fillText('© Ed Aldus WM | open-meteo.com',W-14,34);
  ctx.textAlign='left';
  ctx.fillStyle='#2ec4e8';
  ctx.fillRect(0,HDR-2,W,2);

  // Charts
  let y=HDR;
  canvasList.forEach((c,i)=>{ctx.drawImage(c,0,y);y+=c.height+(i<canvasList.length-1?PAD:0);});

  // Footer
  ctx.fillStyle='rgba(240,243,247,0.95)';
  ctx.fillRect(0,totH-FOOT,W,FOOT);
  ctx.fillStyle='#888';
  ctx.font='10px Inter,sans-serif';
  ctx.fillText('© Ed Aldus WM · Data: Open-Meteo · weerlab.nl',8,totH-7);
  return out;
}

function schaalCanvas(src,doelW,doelH){
  const out=document.createElement('canvas');
  out.width=doelW; out.height=doelH;
  const ctx=out.getContext('2d');
  ctx.fillStyle='#f0f3f7';
  ctx.fillRect(0,0,doelW,doelH);
  const schaal=Math.min(doelW/src.width,doelH/src.height);
  const w=src.width*schaal,h=src.height*schaal;
  ctx.drawImage(src,(doelW-w)/2,(doelH-h)/2,w,h);
  return out;
}

function downloadPng(){
  const{naam}=getStationInfo();
  const ts=new Date().toISOString().slice(0,16).replace('T','_').replace(':','');
  const formaat=document.getElementById('png-formaat')?.value||'auto';
  const deel=document.getElementById('png-deel')?.value||'alles';
  const eigenTekst=document.getElementById('png-tekst')?.value||'';
  const ids={temp:'canvas-temp',cloud:'canvas-cloud',wind:'canvas-wind',winddir:'canvas-winddir',
             sneeuw:'canvas-sneeuw',onweer:'canvas-onweer',hoogte:'canvas-hoogte',
             icon:'canvas-icon',vergelijking:'canvas-vergelijking',hres:'canvas-hres',dauwpunt:'canvas-dauwpunt'};
  const neerslagIds={temp:'canvas-neerslag',icon:'canvas-icon-neerslag',vergelijking:'canvas-verg-neerslag',hres:'canvas-hres-neerslag'};
  const kansenIds={temp:'canvas-neer-kansen',icon:'canvas-icon-kansen'};
  const windIds={vergelijking:'canvas-verg-wind',hres:'canvas-hres-wind'};
  const modelNamen={temp:'ECMWF ENS',icon:'ICON ENS',cloud:'ECMWF ENS',wind:'ECMWF ENS',winddir:'ECMWF ENS',sneeuw:'ECMWF ENS',onweer:'ECMWF ENS',hoogte:'ECMWF ENS',vergelijking:'ECMWF vs ICON',hres:'HRES operationeel',dauwpunt:'ECMWF ENS'};
  const typeNamen={temp:'Temperatuur',icon:'ICON Temperatuur',cloud:'Bewolking',wind:'Wind',winddir:'Windrichting',sneeuw:'Sneeuwkans',onweer:'Onweer',hoogte:'850/500 hPa',vergelijking:'Vergelijking',hres:'HRES operationeel',dauwpunt:'Dauwpunt & Vochtigheid'};

  // Forceer chart update zodat gepinde crosshair op canvas staat
  if(crosshairPinned && actieveCharts.temp) actieveCharts.temp.update('none');

  let canvassen=[];
  let typeLabel=typeNamen[actieveType]||'';

  if(deel==='temp'||deel==='alles'){
    const mainC=document.getElementById(ids[actieveType]||'canvas-temp');
    if(mainC) canvassen.push(mainC);
    if(deel==='temp') typeLabel='Temperatuur';
  }
  if(deel==='neerslag'||deel==='alles'){
    const nC=document.getElementById(neerslagIds[actieveType]);
    if(nC) canvassen.push(nC);
    if(deel==='neerslag') typeLabel='Neerslag';
  }
  if(deel==='kansen'||deel==='alles'){
    const kC=document.getElementById(kansenIds[actieveType]);
    if(kC) canvassen.push(kC);
    if(deel==='kansen') typeLabel='Neerslagkansen';
  }
  if(deel==='alles'){
    const wC=document.getElementById(windIds[actieveType]);
    if(wC) canvassen.push(wC);
  }

  if(!canvassen.length)return;

  let uit=maakPngCanvas(canvassen,naam,typeLabel,modelNamen[actieveType]||'ECMWF ENS',eigenTekst||null);

  if(formaat==='social') uit=schaalCanvas(uit,1200,630);
  else if(formaat==='square') uit=schaalCanvas(uit,1080,1080);
  else if(formaat==='story') uit=schaalCanvas(uit,1080,1920);

  const a=document.createElement('a');
  a.href=uit.toDataURL('image/png');
  a.download=`pluim_${naam.toLowerCase().replace(/\s+/g,'_')}_${deel}_${formaat}_${ts}.png`;
  a.click();
}

function downloadVergelijking(){
  const canvassen=[];
  const titels=[];
  for(let i=0;i<4;i++){
    const c=document.getElementById(`verg-canvas-${i}`);
    const t=document.getElementById(`verg-t-${i}`);
    if(c) { canvassen.push(c); titels.push(t?.textContent||`Pluim ${i+1}`); }
  }
  if(!canvassen.length)return;

  const PAD=12, HDR=52, FOOT=24, TITL=28, GAP=8;
  const cW=canvassen[0].width, cH=canvassen[0].height;
  const totW=cW*2+PAD*3;
  const rows=Math.ceil(canvassen.length/2);
  const totH=HDR+rows*(TITL+cH+GAP)+FOOT;
  const out=document.createElement('canvas');
  out.width=totW; out.height=totH;
  const ctx=out.getContext('2d');

  // Achtergrond
  ctx.fillStyle='#0d0d1a'; ctx.fillRect(0,0,totW,totH);

  // Header
  ctx.fillStyle='#0f3460'; ctx.fillRect(0,0,totW,HDR);
  ctx.fillStyle='white'; ctx.font='bold 16px Inter,sans-serif';
  ctx.fillText('Ed Aldus WM — 4 Pluimen vergelijking',PAD,24);
  ctx.fillStyle='#8aaccc'; ctx.font='12px Inter,sans-serif';
  const datStr=new Date().toLocaleString('nl-NL',{timeZone:'Europe/Amsterdam',day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'});
  ctx.fillText(datStr,PAD,42);
  ctx.textAlign='right';
  ctx.fillText('© Ed Aldus WM | open-meteo.com',totW-PAD,42);
  ctx.textAlign='left';
  ctx.fillStyle='#4a90c4'; ctx.fillRect(0,HDR-2,totW,2);

  // 2x2 grid
  canvassen.forEach((c,i)=>{
    const col=i%2, row=Math.floor(i/2);
    const x=PAD+col*(cW+PAD);
    const y=HDR+row*(TITL+cH+GAP);
    // Titel
    ctx.fillStyle='white'; ctx.font='bold 13px Inter,sans-serif';
    ctx.fillText(titels[i],x,y+18);
    // Chart
    ctx.drawImage(c,x,y+TITL);
  });

  // Footer
  ctx.fillStyle='rgba(10,10,28,0.9)'; ctx.fillRect(0,totH-FOOT,totW,FOOT);
  ctx.fillStyle='#556677'; ctx.font='10px Inter,sans-serif';
  ctx.textAlign='left';
  ctx.fillText('© Ed Aldus WM | Data: Open-Meteo | weerlab.nl',PAD,totH-8);

  const a=document.createElement('a');
  const ts=new Date().toISOString().slice(0,16).replace('T','_').replace(':','');
  a.href=out.toDataURL('image/png');
  a.download=`pluim_4luik_${ts}.png`;
  a.click();
}

// ── Reset ──
function resetAlles(){
  document.getElementById('vergelijking-wrap').style.display='none';
  document.getElementById('grafiek-wrap').style.display='';
  const c=document.getElementById('verg-controls');
  if(c)c.remove();
  verwijderAlles();
  document.getElementById('status').innerHTML='Selecteer een station en klik op <strong>Ophalen</strong>';
  document.getElementById('status').style.display='';
  document.getElementById('png-opties').style.display='none';
  document.getElementById('btn-reset').style.display='none';
  document.getElementById('run-info').textContent='–';
  document.querySelectorAll('.type-btn').forEach((b,i)=>b.classList.toggle('actief',i===0));
  actieveType='temp';
  window.scrollTo({top:0,behavior:'smooth'});
}

// ── URL state ──
function saveState(){
  const{lat,lon,naam}=getStationInfo();
  const h=`${actieveType}|${actievePreset}|${lat}|${lon}|${naam}`;
  history.replaceState(null,'','#'+encodeURIComponent(h));
}
function restoreState(){
  const h=decodeURIComponent(window.location.hash.slice(1));
  if(!h)return false;
  const parts=h.split('|');
  if(parts.length<5)return false;
  const[type,preset,lat,lon,naam]=parts;
  if(!lat||!lon||isNaN(parseFloat(lat))||isNaN(parseFloat(lon)))return false;
  // Herstel type
  document.querySelectorAll('.type-btn').forEach(b=>{
    b.classList.toggle('actief',b.dataset.type===type);
  });
  actieveType=type||'temp';
  // Herstel periode
  document.querySelectorAll('.periode-btn').forEach(b=>{
    b.classList.toggle('actief',b.dataset.preset===preset);
  });
  actievePreset=preset||'7';
  document.getElementById('wrap-custom').style.display=preset==='custom'?'':'none';
  // Herstel station
  setStation(lat,lon,naam||'Onbekend');
  return true;
}

// Sla state op na elke data-load
const origLaadData=laadData;
laadData=async function(){await origLaadData();saveState();};

// ── Auto-refresh ──
let autoRefreshInterval=null;
function toggleAutoRefresh(){
  const btn=document.getElementById('btn-auto');
  if(autoRefreshInterval){
    clearInterval(autoRefreshInterval);
    autoRefreshInterval=null;
    btn.style.background='#1e3a5a';btn.style.color='#aaa';btn.textContent='⟳ Auto-refresh uit';
  }else{
    autoRefreshInterval=setInterval(()=>{if(!document.getElementById('btn-laden').disabled)laadData();},300000); // 5 min
    btn.style.background='#0d9488';btn.style.color='white';btn.textContent='⟳ Auto-refresh 5 min';
  }
}

// ── Init ──
window.addEventListener('load',()=>{
  document.getElementById('run-info').textContent=bepaalRun();
  toonFavorieten();
  restoreState();
  setTimeout(laadData,300);
});
