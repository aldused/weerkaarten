// SVG extent: lon 3.0-7.5, lat 50.5-53.8
const LON_MIN=3.0, LON_MAX=7.5, LAT_MIN=50.5, LAT_MAX=53.8;
const SVG_W=400, SVG_H=520;
function lonToX(lon) { return (lon - LON_MIN) / (LON_MAX - LON_MIN) * SVG_W; }
function latToY(lat) { return (1 - (lat - LAT_MIN) / (LAT_MAX - LAT_MIN)) * SVG_H; }

// Kolomindices in CSV (0-based na STN,YYYYMMDD)
const PARAM_COL = {
  TG:  {col:10, div:10, eenheid:"°C",  label:"Gem. temp"},
  TN:  {col:11, div:10, eenheid:"°C",  label:"Min temp"},
  TX:  {col:13, div:10, eenheid:"°C",  label:"Max temp"},
  SQ:  {col:17, div:10, eenheid:"u",   label:"Zonneschijn"},
  RH:  {col:21, div:10, eenheid:"mm",  label:"Neerslag"},
  PG:  {col:24, div:10, eenheid:"hPa", label:"Luchtdruk"},
  FG:  {col:4,  div:10, eenheid:"m/s", label:"Gem. wind"},
  FXX: {col:8,  div:10, eenheid:"m/s", label:"Max windstoot"},
};

const NL_MAANDEN = ["","januari","februari","maart","april","mei","juni","juli","augustus","september","oktober","november","december"];

let huidigParam = "TX";
let huidigData = {};

// Kleurschalen per parameter
function getKleur(param, waarde) {
  if (waarde === null) return "#cccccc";
  if (param === "TX" || param === "TG" || param === "TN") {
    const schaal = [
      {grens:-10, kleur:"#084594"},{grens:-5,  kleur:"#2166ac"},
      {grens:0,   kleur:"#4393c3"},{grens:5,   kleur:"#92c5de"},
      {grens:10,  kleur:"#d1e5f0"},{grens:15,  kleur:"#fddbc7"},
      {grens:20,  kleur:"#f4a582"},{grens:25,  kleur:"#d6604d"},
      {grens:30,  kleur:"#b2182b"},{grens:999, kleur:"#67001f"},
    ];
    for (const s of schaal) if (waarde < s.grens) return s.kleur;
    return "#67001f";
  }
  if (param === "RH") {
    if (waarde <= 0)  return "#f7fbff";
    if (waarde < 2)   return "#c6dbef";
    if (waarde < 5)   return "#6baed6";
    if (waarde < 10)  return "#2171b5";
    if (waarde < 20)  return "#084594";
    return "#08306b";
  }
  if (param === "FG" || param === "FXX") {
    if (waarde < 3)   return "#ffffcc";
    if (waarde < 6)   return "#a1dab4";
    if (waarde < 9)   return "#41b6c4";
    if (waarde < 12)  return "#2c7fb8";
    if (waarde < 15)  return "#253494";
    return "#081d58";
  }
  if (param === "SQ") {
    if (waarde <= 0)  return "#f7f7f7";
    if (waarde < 2)   return "#fee391";
    if (waarde < 4)   return "#fec44f";
    if (waarde < 6)   return "#fe9929";
    if (waarde < 8)   return "#d95f0e";
    return "#993404";
  }
  if (param === "PG") {
    if (waarde < 990)  return "#084594";
    if (waarde < 1000) return "#4393c3";
    if (waarde < 1010) return "#d1e5f0";
    if (waarde < 1020) return "#fddbc7";
    if (waarde < 1030) return "#d6604d";
    return "#b2182b";
  }
  return "#aaaaaa";
}

function tekstKleur(kleur) {
  // Simpele luma check
  const r = parseInt(kleur.slice(1,3),16), g = parseInt(kleur.slice(3,5),16), b = parseInt(kleur.slice(5,7),16);
  return (r*299+g*587+b*114)/1000 > 150 ? "#333" : "white";
}

    TX: [{k:"#084594",t:"< -10°C"},{k:"#2166ac",t:"-10–-5°C"},{k:"#4393c3",t:"-5–0°C"},{k:"#92c5de",t:"0–5°C"},{k:"#d1e5f0",t:"5–10°C"},{k:"#fddbc7",t:"10–15°C"},{k:"#f4a582",t:"15–20°C"},{k:"#d6604d",t:"20–25°C"},{k:"#b2182b",t:"25–30°C"},{k:"#67001f",t:"> 30°C"}],
    TN: [{k:"#084594",t:"< -10°C"},{k:"#2166ac",t:"-10–-5°C"},{k:"#4393c3",t:"-5–0°C"},{k:"#92c5de",t:"0–5°C"},{k:"#d1e5f0",t:"5–10°C"},{k:"#fddbc7",t:"10–15°C"},{k:"#f4a582",t:"15–20°C"},{k:"#d6604d",t:"20–25°C"},{k:"#b2182b",t:"25–30°C"},{k:"#67001f",t:"> 30°C"}],
    TG: [{k:"#084594",t:"< -10°C"},{k:"#2166ac",t:"-10–-5°C"},{k:"#4393c3",t:"-5–0°C"},{k:"#92c5de",t:"0–5°C"},{k:"#d1e5f0",t:"5–10°C"},{k:"#fddbc7",t:"10–15°C"},{k:"#f4a582",t:"15–20°C"},{k:"#d6604d",t:"20–25°C"},{k:"#b2182b",t:"25–30°C"}],
    RH: [{k:"#f7fbff",t:"0 mm"},{k:"#c6dbef",t:"< 2 mm"},{k:"#6baed6",t:"2–5 mm"},{k:"#2171b5",t:"5–10 mm"},{k:"#084594",t:"10–20 mm"},{k:"#08306b",t:"> 20 mm"}],
    FG: [{k:"#ffffcc",t:"< 3 m/s"},{k:"#a1dab4",t:"3–6 m/s"},{k:"#41b6c4",t:"6–9 m/s"},{k:"#2c7fb8",t:"9–12 m/s"},{k:"#253494",t:"12–15 m/s"},{k:"#081d58",t:"> 15 m/s"}],
    FXX:[{k:"#ffffcc",t:"< 3 m/s"},{k:"#a1dab4",t:"3–6 m/s"},{k:"#41b6c4",t:"6–9 m/s"},{k:"#2c7fb8",t:"9–12 m/s"},{k:"#253494",t:"12–15 m/s"},{k:"#081d58",t:"> 15 m/s"}],
    SQ: [{k:"#f7f7f7",t:"0 u"},{k:"#fee391",t:"< 2 u"},{k:"#fec44f",t:"2–4 u"},{k:"#fe9929",t:"4–6 u"},{k:"#d95f0e",t:"6–8 u"},{k:"#993404",t:"> 8 u"}],
    PG: [{k:"#084594",t:"< 990 hPa"},{k:"#4393c3",t:"990–1000"},{k:"#d1e5f0",t:"1000–1010"},{k:"#fddbc7",t:"1010–1020"},{k:"#d6604d",t:"1020–1030"},{k:"#b2182b",t:"> 1030 hPa"}],
  };
  const items = legendas[param] || [];
  return `<div class="legenda">
    <div class="legenda-titel">${PARAM_COL[param].label} (${PARAM_COL[param].eenheid})</div>
    <div class="legenda-items">${items.map(i=>`<div class="legenda-item"><div class="legenda-kleur" style="background:${i.k};border:1px solid #ccc;"></div><span>${i.t}</span></div>`).join("")}
    <div class="legenda-item"><div class="legenda-kleur" style="background:#ccc;border:1px solid #aaa;"></div><span>Geen data</span></div>
    </div></div>`;
}

function tekenKaart() {
  const laag = document.getElementById("stations-laag");
  laag.innerHTML = "";
  const info = document.getElementById("info-tbody");
  info.innerHTML = "";
  document.getElementById("th-param").textContent = `${PARAM_COL[huidigParam].label} (${PARAM_COL[huidigParam].eenheid})`;

  const rijen = [];
  for (const st of STATIONS) {
    const waarde = huidigData[st.stn] !== undefined ? huidigData[st.stn] : null;
    const x = lonToX(st.lon), y = latToY(st.lat);
    const kleur = getKleur(huidigParam, waarde);
    const tk = tekstKleur(kleur);
    const tekst = waarde !== null ? String(waarde) : "–";

    // Cirkel + label
    const g = document.createElementNS("http://www.w3.org/2000/svg","g");
    g.style.cursor = "pointer";
    g.setAttribute("title", `${st.naam}: ${tekst} ${PARAM_COL[huidigParam].eenheid}`);

    const circle = document.createElementNS("http://www.w3.org/2000/svg","circle");
    circle.setAttribute("cx", x); circle.setAttribute("cy", y);
    circle.setAttribute("r", "14"); circle.setAttribute("fill", kleur);
    circle.setAttribute("stroke", "#555"); circle.setAttribute("stroke-width", "0.8");

    const text = document.createElementNS("http://www.w3.org/2000/svg","text");
    text.setAttribute("x", x); text.setAttribute("y", y+1);
    text.setAttribute("text-anchor","middle"); text.setAttribute("dominant-baseline","middle");
    text.setAttribute("font-size","7.5"); text.setAttribute("font-weight","bold");
    text.setAttribute("fill", tk); text.textContent = tekst;

    g.appendChild(circle); g.appendChild(text);
    laag.appendChild(g);

    rijen.push({naam: st.naam, waarde});
  }

  // Sorteer tabel op waarde
  rijen.sort((a,b) => (b.waarde??-9999) - (a.waarde??-9999));
  rijen.forEach(r => {
    const tr = document.createElement("tr");
    tr.innerHTML = `<td>${r.naam}</td><td><strong>${r.waarde !== null ? r.waarde : "–"}</strong> ${r.waarde !== null ? PARAM_COL[huidigParam].eenheid : ""}</td>`;
    info.appendChild(tr);
  });

  document.getElementById("legenda").innerHTML = maakLegenda(huidigParam);
}

function wisselParam(param) {
  huidigParam = param;
  document.querySelectorAll(".param-btn").forEach(b => b.classList.remove("actief"));
  document.getElementById("btn-" + param).classList.add("actief");
  if (Object.keys(huidigData).length > 0) laadDag();
}

function getDatumStr() {
  const dag = String(document.getElementById("inp-dag").value).padStart(2,"0");
  const maand = String(document.getElementById("inp-maand").value).padStart(2,"0");
  const jaar = document.getElementById("inp-jaar").value;
  return `${jaar}${maand}${dag}`;
}

function getDatumLabel() {
  const dag = parseInt(document.getElementById("inp-dag").value);
  const maand = parseInt(document.getElementById("inp-maand").value);
  const jaar = parseInt(document.getElementById("inp-jaar").value);
  const d = new Date(jaar, maand-1, dag);
  return `${NL_DAGEN_LANG[d.getDay()]} ${dag} ${NL_MAANDEN[maand]} ${jaar}`;
}

async function laadDag() {
  const datumStr = getDatumStr();
  const datumLabel = getDatumLabel();
  const status = document.getElementById("status");
  status.className = "status";
  status.textContent = `⏳ Data laden voor ${datumLabel}...`;
  status.style.display = "block";
  document.getElementById("kaart-wrapper").style.display = "none";

  huidigData = {};

  try {
    const apiUrl = `https://www.daggegevens.knmi.nl/klimatologie/daggegevens`;
    const postData = `start=${datumStr}&end=${datumStr}&stns=ALL&vars=TX:TN:TG:RH:FG:FXX:SQ:PG&fmt=json`;
    const proxyUrl = `https://api.allorigins.win/raw?url=${encodeURIComponent(apiUrl + "?" + postData)}`;

    // Probeer eerst direct (CORS), anders via proxy
    let json;
    try {
      const res = await fetch(apiUrl, {
        method: "POST",
        headers: {"Content-Type": "application/x-www-form-urlencoded"},
        body: postData
      });
      json = await res.json();
    } catch(e) {
      // CORS fallback: GET via proxy
      const res2 = await fetch(proxyUrl);
      json = await res2.json();
    }

    if (!json || json.length === 0) {
      status.className = "status fout";
      status.textContent = `Geen data gevonden voor ${datumLabel}.`;
      return;
    }

    const info = PARAM_COL[huidigParam];
    for (const rij of json) {
      const stn = rij.station_code;
      const raw = rij[huidigParam];
      if (raw !== null && raw !== undefined) {
        huidigData[stn] = Math.round(raw / info.div * 10) / 10;
      }
    }

    if (Object.keys(huidigData).length === 0) {
      status.className = "status fout";
      status.textContent = `Geen data gevonden voor ${datumLabel}.`;
      return;
    }

    status.style.display = "none";
    document.getElementById("kaart-wrapper").style.display = "flex";
    document.getElementById("kaart-titel").textContent = `${info.label} — ${datumLabel}`;
    document.getElementById("info-titel").textContent = datumLabel;
    tekenKaart();

  } catch(e) {
    status.className = "status fout";
    status.textContent = `Fout bij ophalen: ${e.message}`;
  }
}

function navigeer(richting) {
  const dag = parseInt(document.getElementById("inp-dag").value);
  const maand = parseInt(document.getElementById("inp-maand").value);
  const jaar = parseInt(document.getElementById("inp-jaar").value);
  const d = new Date(jaar, maand-1, dag);
  d.setDate(d.getDate() + richting);
  document.getElementById("inp-dag").value = d.getDate();
  document.getElementById("inp-maand").value = d.getMonth() + 1;
  document.getElementById("inp-jaar").value = d.getFullYear();
  laadDag();
}

// Initialiseer met vandaag min 1 jaar
const gisteren = new Date();
gisteren.setFullYear(gisteren.getFullYear() - 1);
document.getElementById("inp-dag").value = gisteren.getDate();
document.getElementById("inp-maand").value = gisteren.getMonth() + 1;
document.getElementById("inp-jaar").value = gisteren.getFullYear();
</script>
