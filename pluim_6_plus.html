<script>
const STATIONS = [
  { name:"Rotterdam",        lat:51.9244, lon:4.4777 },
  { name:"De Bilt",          lat:52.1010, lon:5.1800 },
  { name:"Den Helder",       lat:52.9230, lon:4.7800 },
  { name:"Hoek van Holland", lat:51.9789, lon:4.1336 },
  { name:"Maastricht",       lat:50.9100, lon:5.7700 },
  { name:"Enschede",         lat:52.2700, lon:6.8900 },
  { name:"Eindhoven",        lat:51.4416, lon:5.4697 },
  { name:"Wateringen",       lat:52.0244, lon:4.2867 },
  { name:"Dordrecht",        lat:51.8133, lon:4.6900 },
  { name:"Soestdijk",        lat:52.1797, lon:5.2872 },
  { name:"Rhoon",            lat:51.8650, lon:4.4267 },
  { name:"Ridderkerk",       lat:51.8722, lon:4.6075 },
  { name:"Londen",           lat:51.5074, lon:-0.1278 },
];

const DAGEN_KORT = ["zo","ma","di","wo","do","vr","za"];
const DAGEN_LANG = ["zondag","maandag","dinsdag","woensdag","donderdag","vrijdag","zaterdag"];
const MAANDEN = ["jan","feb","mrt","apr","mei","jun","jul","aug","sep","okt","nov","dec"];
const MAANDEN_LANG = ["januari","februari","maart","april","mei","juni","juli","augustus","september","oktober","november","december"];
const HOUR_MS = 60 * 60 * 1000;
const DAY_MS = 24 * HOUR_MS;

const C_GREEN="#2e8b3e", C_BLACK="#1a1a1a", C_RED="#cc0000", C_DARKRED="#8b1414";
const C_NACHT="#ededed", C_GRID="#cccccc", C_AXIS="#333";

let pageSvgString = "";

const OM_PROXY_BASE = (location.protocol === 'https:' && /(^|\.)weerlab\.nl$/.test(location.hostname))
  ? 'https://om.weerlab.nl/om'
  : null;
const _fetchCache = {};
const _fetchInflight = {};
const CACHE_TTL = 8 * 60 * 1000;
const FAST_UPDATE_WINDOWS = [
  { start: 5 * 60 + 30, end: 12 * 60 },
  { start: 17 * 60 + 30, end: 23 * 60 + 59 },
];
const FAST_UPDATE_INTERVAL_MS = 2 * 60 * 1000;
const NORMAL_UPDATE_INTERVAL_MS = 15 * 60 * 1000;
let autoRefreshTimer = null;

function rewriteOM(url) {
  if (!OM_PROXY_BASE) return url;
  const map = [
    ['https://ensemble-api.open-meteo.com/v1/ensemble', `${OM_PROXY_BASE}/ensemble`],
  ];
  for (const [from, to] of map) {
    if (url.startsWith(from)) return to + url.slice(from.length);
  }
  return url;
}

function addFreshParam(url) {
  if (!OM_PROXY_BASE) return url;
  const u = new URL(url, location.href);
  u.searchParams.set('_weerlab_fresh', '1');
  return u.toString();
}

function isFastUpdateWindow(d = new Date()) {
  const m = d.getHours() * 60 + d.getMinutes();
  return FAST_UPDATE_WINDOWS.some(w => m >= w.start && m <= w.end);
}

async function fetchJson(url, ms = 30000, retries = 3, force = false, edgeFresh = false) {
  const cacheKey = rewriteOM(url);
  const requestUrl = edgeFresh ? addFreshParam(cacheKey) : cacheKey;
  const cached = _fetchCache[cacheKey];
  if (!force && cached && Date.now() - cached.ts < CACHE_TTL) return cached.data;
  if (!force && _fetchInflight[cacheKey]) return _fetchInflight[cacheKey];

  _fetchInflight[cacheKey] = (async () => {
    for (let poging = 0; poging < retries; poging++) {
      const ctrl = new AbortController();
      const id = setTimeout(() => ctrl.abort(), ms);
      try {
        const r = await fetch(requestUrl, { signal: ctrl.signal, cache: force ? 'no-store' : 'default' });
        clearTimeout(id);
        if (r.status === 429 && poging < retries - 1) {
          await new Promise(res => setTimeout(res, 2000 * (poging + 1)));
          continue;
        }
        if (!r.ok) throw new Error(`HTTP ${r.status}`);
        const data = await r.json();
        _fetchCache[cacheKey] = { data, ts: Date.now() };
        return data;
      } catch (e) {
        clearTimeout(id);
        if (poging === retries - 1) throw new Error(e.name === 'AbortError' ? 'time-out' : e.message);
        await new Promise(res => setTimeout(res, 1200 * (poging + 1)));
      }
    }
  })().finally(() => { delete _fetchInflight[cacheKey]; });
  return _fetchInflight[cacheKey];
}

const urlParams = new URLSearchParams(window.location.search);
const lockMode = urlParams.get('lock') === '1';
const wantedStationName = (urlParams.get('station') || urlParams.get('st') || '')
  .replace(/[<>&]/g, '').trim().slice(0, 80);
const wantedStation = wantedStationName.toLowerCase().replace(/[\s_-]/g,'');
const wantedLat = Number(urlParams.get('lat'));
const wantedLon = Number(urlParams.get('lon'));
const hasWantedCoordinates = urlParams.has('lat') && urlParams.has('lon')
  && Number.isFinite(wantedLat) && wantedLat >= -90 && wantedLat <= 90
  && Number.isFinite(wantedLon) && wantedLon >= -180 && wantedLon <= 180;
let initialIdx = 0;
if (wantedStation) {
  const m = STATIONS.findIndex(s => s.name.toLowerCase().replace(/[\s_-]/g,'') === wantedStation);
  if (m >= 0) {
    initialIdx = m;
  } else if (hasWantedCoordinates) {
    STATIONS.push({ name: wantedStationName, lat: wantedLat, lon: wantedLon });
    initialIdx = STATIONS.length - 1;
  }
}
let currentStation = STATIONS[initialIdx];

if (lockMode) {
  document.getElementById('lblStation').style.display = 'none';
  document.getElementById('stSel').style.display = 'none';
  document.getElementById('lblPlaats').textContent = 'Plaats';
}

const stSel = document.getElementById('stSel');
STATIONS.forEach((s,i) => {
  const o = document.createElement('option');
  o.value = i; o.textContent = s.name;
  if (i === initialIdx) o.selected = true;
  stSel.appendChild(o);
});
stSel.addEventListener('change', () => {
  currentStation = STATIONS[stSel.value];
  const u = new URL(window.location);
  u.searchParams.set('station', currentStation.name);
  u.searchParams.set('lat', String(currentStation.lat));
  u.searchParams.set('lon', String(currentStation.lon));
  history.replaceState(null, '', u);
  loadAndRender(isFastUpdateWindow());
});
document.getElementById('btnRefresh').addEventListener('click', () => loadAndRender(true, true));
document.getElementById('btnPng').addEventListener('click', exportPng);

async function zoekPlaats() {
  const inp = document.getElementById('plaatsInput');
  const err = document.getElementById('plaatsFout');
  err.textContent = '';
  const q = inp.value.trim();
  if (!q) return;
  try {
    const r = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(q)}&count=1&language=nl&format=json`);
    if (!r.ok) throw new Error('HTTP '+r.status);
    const j = await r.json();
    if (!j.results || !j.results.length) { err.textContent = 'Niet gevonden'; return; }
    const hit = j.results[0];
    const label = hit.country_code && hit.country_code !== 'NL' ? `${hit.name} (${hit.country_code})` : hit.name;
    const existing = STATIONS.findIndex(s => Math.abs(s.lat-hit.latitude)<0.01 && Math.abs(s.lon-hit.longitude)<0.01);
    let idx;
    if (existing >= 0) {
      idx = existing;
    } else {
      STATIONS.push({ name: label, lat: hit.latitude, lon: hit.longitude });
      idx = STATIONS.length - 1;
      const o = document.createElement('option');
      o.value = idx; o.textContent = label;
      stSel.appendChild(o);
    }
    stSel.value = idx;
    currentStation = STATIONS[idx];
    const u = new URL(window.location);
    u.searchParams.set('station', currentStation.name);
    u.searchParams.set('lat', String(currentStation.lat));
    u.searchParams.set('lon', String(currentStation.lon));
    history.replaceState(null, '', u);
    loadAndRender(isFastUpdateWindow());
  } catch(e) {
    err.textContent = 'Zoekfout: '+e.message;
  }
}
document.getElementById('btnZoek').addEventListener('click', zoekPlaats);
document.getElementById('plaatsInput').addEventListener('keydown', e => { if (e.key === 'Enter') zoekPlaats(); });

function nlDate(d, langDay=true) {
  return `${langDay ? DAGEN_LANG[d.getDay()] : DAGEN_KORT[d.getDay()]} ${d.getDate()} ${MAANDEN_LANG[d.getMonth()]} ${d.getFullYear()}`;
}
function nlShortDM(d) { return `${String(d.getDate()).padStart(2,'0')}-${String(d.getMonth()+1).padStart(2,'0')}`; }

const SIX_PLUS_CORE_VARIABLES = 'cloudcover,winddirection_10m';
const SIX_PLUS_OPTIONAL_VARIABLES = 'cape,temperature_850hPa,temperature_500hPa';

async function fetchEnsemble(lat, lon, runMeta, force = false, edgeFresh = false, variables = SIX_PLUS_CORE_VARIABLES) {
  const { startHour, endHour } = runHourBoundsFromMeta(runMeta);
  // De vroegere daggrens start_date=${startDate}&end_date=${endDate} voorkwam
  // afkappen na middernacht, maar start_hour/end_hour borgt nu ook het cyclusuur.
  const url = `https://ensemble-api.open-meteo.com/v1/ensemble?latitude=${lat}&longitude=${lon}`
    + `&hourly=${encodeURIComponent(variables)}`
    + `&models=ecmwf_ifs025&start_hour=${encodeURIComponent(startHour)}&end_hour=${encodeURIComponent(endHour)}`
    + `&temporal_resolution=native&timezone=GMT`;
  try {
    const data = WeerlabPlumeMath.markUtcTimes(await fetchJson(url, 30000, 3, force, edgeFresh));
    return trimHourlyToRunWindow(data, runMeta, 'Ensemble');
  } catch (e) {
    throw new Error("Ensemble " + e.message);
  }
}
function mergeOptionalEnsembleFields(core, optional, variables, runMeta) {
  const merged = {
    ...core,
    hourly: { ...(core?.hourly || {}) },
    hourly_units: { ...(core?.hourly_units || {}) },
  };
  const requested = String(variables || '').split(',').map(value => value.trim()).filter(Boolean);
  const unavailable = new Set(merged.weerlab_unavailable_variables || []);
  const expectedRunMs = verifiedRunStartFromMeta(runMeta);
  const optionalRunMs = optional?.weerlab_run ? Date.parse(optional.weerlab_run) : expectedRunMs;
  const coreTimes = merged.hourly.time || [];
  const optionalTimes = optional?.hourly?.time || [];
  const sameRun = Number.isFinite(optionalRunMs) && optionalRunMs === expectedRunMs;
  const sameTimes = coreTimes.length === optionalTimes.length &&
    coreTimes.every((time, index) => Date.parse(time) === Date.parse(optionalTimes[index]));
  if (!optional || !sameRun || !sameTimes) {
    requested.forEach(variable => unavailable.add(variable));
    merged.weerlab_unavailable_variables = [...unavailable];
    return merged;
  }
  const optionalUnavailable = new Set(optional.weerlab_unavailable_variables || []);
  for (const variable of requested) {
    if (optionalUnavailable.has(variable)) {
      unavailable.add(variable);
      continue;
    }
    for (const [key, values] of Object.entries(optional.hourly || {})) {
      if (key === variable || key.startsWith(`${variable}_member`)) merged.hourly[key] = values;
    }
    for (const [key, unit] of Object.entries(optional.hourly_units || {})) {
      if (key === variable || key.startsWith(`${variable}_member`)) merged.hourly_units[key] = unit;
    }
  }
  merged.weerlab_unavailable_variables = [...unavailable];
  return merged;
}
async function fetchHres(lat, lon, runMeta, force = false, edgeFresh = false) {
  const runInitialization = runInitializationFromMeta(runMeta);
  const url = `https://single-runs-api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}`
    + `&hourly=cloudcover,winddirection_10m,cape,temperature_850hPa,temperature_500hPa`
    + `&models=ecmwf_ifs&run=${encodeURIComponent(runInitialization)}`
    + `&forecast_days=15&temporal_resolution=native&timezone=GMT`;
  try {
    const data = WeerlabPlumeMath.markUtcTimes(await fetchJson(url, 30000, 3, force, edgeFresh));
    if (data?.weerlab_run && Date.parse(data.weerlab_run) !== verifiedRunStartFromMeta(runMeta)) {
      throw new Error('antwoord hoort bij een andere ECMWF-run');
    }
    return trimHourlyToRunWindow(data, runMeta, 'HRES', false);
  } catch (e) {
    throw new Error("HRES " + e.message);
  }
}

// Ontbrekende waarden blijven null (pathOf slaat ze over) — 0-vullen gaf
// een valse "klif" naar 0 aan het einde van reeksen die korter zijn.
function fillNaN(arr) { return arr.map(v => (v==null || isNaN(v)) ? null : v); }
function membersOf(hourly, key) {
  const members = [];
  if (Array.isArray(hourly?.[key])) members.push(hourly[key].slice());
  for (let member = 1; member <= 50; member++) {
    const memberKey = `${key}_member${String(member).padStart(2, '0')}`;
    if (Array.isArray(hourly?.[memberKey])) members.push(hourly[memberKey].slice());
  }
  return members;
}
function boundedMembersOf(hourly, key, startIndex, cutoffLength) {
  return membersOf(hourly, key)
    .map(series => fillNaN(series.slice(startIndex, startIndex + cutoffLength)));
}
function trimTrailingMissing(matrix) {
  if (!matrix.length) return matrix;
  const length = Math.max(0, ...matrix.map(series => Array.isArray(series) ? series.length : 0));
  let last = -1;
  for (let index = length - 1; index >= 0; index--) {
    if (matrix.some(series => Array.isArray(series) && Number.isFinite(series[index]))) {
      last = index;
      break;
    }
  }
  return last < 0 ? [] : matrix.map(series => series.slice(0, last + 1));
}
function requireMemberMatrix(matrix, label, expectedCount = 51) {
  const usable = Array.isArray(matrix)
    ? matrix.filter(series => Array.isArray(series) && series.some(Number.isFinite))
    : [];
  if (!Array.isArray(matrix) || matrix.length !== expectedCount || usable.length !== expectedCount) {
    throw new Error(`Geen geldige ${label}ensembledata beschikbaar: ${usable.length} van ${expectedCount} leden in deze modelrun.`);
  }
  return matrix;
}
function optionalMemberMatrix(hourly, key, startIndex, cutoffLength, unavailableVariables) {
  const unavailable = unavailableVariables instanceof Set
    ? unavailableVariables
    : new Set(unavailableVariables || []);
  if (unavailable.has(key)) return null;
  try {
    // Een optioneel paneel verschijnt alleen als exact dezelfde complete
    // controle + member01…member50 voor de hele gekozen run aanwezig zijn.
    // Een gedeeltelijk drukvlakveld wordt dus nooit tot null-statistiek of met
    // waarden uit een andere cyclus aangevuld.
    exactEnsembleMembers(hourly, key);
    return requireMemberMatrix(
      trimTrailingMissing(boundedMembersOf(hourly, key, startIndex, cutoffLength)),
      `${key}-`,
    );
  } catch (error) {
    console.warn(`Optioneel 6+-paneel ${key} overgeslagen:`, error.message);
    return null;
  }
}
function exactEnsembleMembers(hourly, key, expectedCount = 51) {
  const expectedKeys = [key];
  for (let member = 1; member < expectedCount; member++) {
    expectedKeys.push(`${key}_member${String(member).padStart(2, '0')}`);
  }
  const actualKeys = Object.keys(hourly || {})
    .filter(candidate => candidate === key || candidate.startsWith(`${key}_member`));
  if (actualKeys.length !== expectedKeys.length || expectedKeys.some(expected => !actualKeys.includes(expected))) {
    throw new Error(`${key}: exact dezelfde ${expectedCount} ensembleleden zijn vereist`);
  }
  const expectedLength = Array.isArray(hourly?.time) ? hourly.time.length : 0;
  const matrix = expectedKeys.map(memberKey => hourly[memberKey]);
  const incomplete = matrix.some(series => !Array.isArray(series) || series.length !== expectedLength ||
    series.some(value => !Number.isFinite(value)));
  if (!expectedLength || incomplete) {
    throw new Error(`${key}: de gekozen run is nog niet op ieder tijdstip volledig geladen voor alle ${expectedCount} leden`);
  }
  return matrix.map(series => series.slice());
}
function exactCommonEnsemble(hourly, keys) {
  const matrices = {};
  for (const key of keys) matrices[key] = exactEnsembleMembers(hourly, key);
  return matrices;
}
function addLegacyFieldAliases(hourly) {
  if (!hourly || typeof hourly !== 'object') return hourly;
  const aliases = [
    ['cloud_cover', 'cloudcover'],
    ['wind_direction_10m', 'winddirection_10m'],
  ];
  for (const [canonical, legacy] of aliases) {
    if (Array.isArray(hourly[canonical]) && !Array.isArray(hourly[legacy])) hourly[legacy] = hourly[canonical];
    for (let member = 1; member <= 50; member++) {
      const suffix = `_member${String(member).padStart(2, '0')}`;
      if (Array.isArray(hourly[canonical + suffix]) && !Array.isArray(hourly[legacy + suffix])) {
        hourly[legacy + suffix] = hourly[canonical + suffix];
      }
    }
  }
  return hourly;
}
function alignHresSeries(targetTimes, sourceTimes, sourceValues, label, required = true) {
  if (!Array.isArray(sourceValues) || sourceValues.length !== sourceTimes.length) {
    throw new Error(`Operationele HRES-${label} heeft geen geldige tijdas`);
  }
  const finiteIndexes = sourceValues
    .map((value, index) => Number.isFinite(value) ? index : -1)
    .filter(index => index >= 0);
  if (!finiteIndexes.length) {
    if (required) throw new Error(`Operationele HRES-${label} is niet beschikbaar voor de gekozen run`);
    return targetTimes.map(() => null);
  }
  const firstIndex = finiteIndexes[0];
  const lastIndex = finiteIndexes[finiteIndexes.length - 1];
  if (sourceValues.slice(firstIndex, lastIndex + 1).some(value => !Number.isFinite(value))) {
    throw new Error(`Operationele HRES-${label} bevat een intern datagat`);
  }
  const firstMs = sourceTimes[firstIndex]?.getTime();
  const lastMs = sourceTimes[lastIndex]?.getTime();
  if (required && targetTimes[0]?.getTime() < firstMs) {
    throw new Error(`Operationele HRES-${label} begint na de gekozen run`);
  }
  const byTimestamp = new Map(sourceTimes.slice(firstIndex, lastIndex + 1)
    .map((time, offset) => [time.getTime(), sourceValues[firstIndex + offset]]));
  return targetTimes.map(time => {
    const timestamp = time.getTime();
    if (timestamp < firstMs || timestamp > lastMs) return null;
    if (!byTimestamp.has(timestamp)) {

function computeNightBlocks(times, xMode) {

      while (j < times.length && times[j].getUTCHours() !== 6) j++;

      const b = Math.min(j, times.length);
      blocks.push([a, b]);
      i = j-1;
    }

  return blocks;

  const verified = verifiedRunMeta(meta);
  return {
    startHour: new Date(verified.last_run_initialisation_time * 1000).toISOString().slice(0, 16),
    endHour: new Date(verified.data_end_time * 1000).toISOString().slice(0, 16),
  };
}
function trimHourlyToRunWindow(data, meta, sourceLabel, requireFullEnd = true) {
  const verified = verifiedRunMeta(meta);
  const hourly = data?.hourly;
  const rawTimes = Array.isArray(hourly?.time) ? hourly.time : [];
  if (!rawTimes.length) throw new Error(`${sourceLabel} bevat geen tijdas`);
  const seriesEntries = Object.entries(hourly)
    .filter(([key, values]) => key !== 'time' && Array.isArray(values));
  const lengths = new Set(seriesEntries.map(([, values]) => values.length));
  if (!seriesEntries.length || lengths.size !== 1) {
    throw new Error(`${sourceLabel} heeft variabelen met verschillende lengtes`);
  }
  const valueCount = seriesEntries[0][1].length;
  if (rawTimes.length < valueCount || rawTimes.length > valueCount + 1) {
    throw new Error(`${sourceLabel} heeft een afwijkende tijdas`);
  }
  const valueTimes = rawTimes.slice(0, valueCount);
  const parsedTimes = valueTimes.map(value => new Date(value).getTime());
  if (parsedTimes.some(value => !Number.isFinite(value)) ||
      parsedTimes.some((value, index) => index > 0 && value <= parsedTimes[index - 1])) {
    throw new Error(`${sourceLabel} heeft geen strikt oplopende UTC-tijdas`);
  }
  const startMs = verified.last_run_initialisation_time * 1000;
  const endMs = verified.data_end_time * 1000;
  const indexes = parsedTimes
    .map((time, index) => ({ time, index }))
    .filter(item => item.time >= startMs && item.time <= endMs)
    .map(item => item.index);
  if (indexes.length < 2) throw new Error(`${sourceLabel} bevat te weinig stappen in de gekozen run`);
  const firstMs = parsedTimes[indexes[0]];
  const lastValueMs = parsedTimes[indexes[indexes.length - 1]];
  const boundaryMs = rawTimes.length === valueCount + 1
    ? new Date(rawTimes[valueCount]).getTime()
    : lastValueMs;
  if (firstMs !== startMs || (requireFullEnd && boundaryMs !== endMs)) {
    throw new Error(`${sourceLabel} dekt niet exact de gekozen ECMWF-run`);
  }
  const boundedHourly = { time: indexes.map(index => valueTimes[index]) };
  for (const [key, values] of seriesEntries) {
    boundedHourly[key] = indexes.map(index => values[index]);
  }
  return WeerlabPlumeMath.markUtcTimes({ ...data, hourly: boundedHourly });
}
function cutoffLengthForDataEnd(times, dataEndMs) {
  if (!Array.isArray(times) || !Number.isFinite(dataEndMs)) return 0;
  let count = 0;
  for (const time of times) {
    const value = time instanceof Date ? time.getTime() : new Date(time).getTime();
    if (!Number.isFinite(value) || value > dataEndMs) break;
    count++;
  }
  return count;
}
async function fetchCycleMatchedData(lat, lon, force = false, edgeFresh = false) {
  const runControl = window.WeerlabPlumeRuns;
  await runControl?.ensureLocation?.(lat, lon);
  const selectedRunMs = Date.parse(runControl?.selectedRunIso?.() || '');
  const liveRunMs = Number(runControl?.state?.liveMeta?.last_run_initialisation_time) * 1000;
  if (Number.isFinite(selectedRunMs) && selectedRunMs === liveRunMs) {
    // CAPE ontbreekt in de snelle 00/06-voorlevering. Schakel voor dezelfde
    // actuele cyclus door naar de complete bron; historische cycli blijven exact.
    await runControl?.ensureVariables?.(['cape']);
  }
  // De gewone forecast-API kan al op een nieuwere 06/18-run staan. Selecteer
  // HRES daarom expliciet via Single Runs en controleer na het ophalen dat de
  // ENS-metadata niet tussentijds van cyclus is gewisseld.
  for (let attempt = 0; attempt < 2; attempt++) {
    const runMeta = verifiedRunMeta(await fetchRunMeta());
    // De ensemble-endpoint heeft zelf geen run-selector. Om een eerder in de
    // browser/edge gecachte cyclus uit te sluiten, wordt hij na de metadata
    // altijd vers en zonder edge-cache opgehaald.
    const retryFresh = true;
    const [coreEns, optionalEns, hres] = await Promise.all([
      fetchEnsemble(lat, lon, runMeta, retryFresh, true, SIX_PLUS_CORE_VARIABLES),
      fetchEnsemble(
        lat, lon, runMeta, retryFresh, true, SIX_PLUS_OPTIONAL_VARIABLES,
      ).catch(error => {
        console.warn('Optionele ENS-velden niet beschikbaar:', error.message);
        return null;
      }),
      fetchHres(lat, lon, runMeta, force || attempt > 0, edgeFresh).catch(error => {
        // Single Runs loopt niet voor elke cyclus gelijk op met ENS. De exacte
        // HRES-overlay is aanvullend: bij ontbreken blijft dezelfde ENS-run
        // zichtbaar, zonder een HRES-reeks uit een andere initialisatie.
        console.warn('Exacte HRES-overlay niet beschikbaar:', error.message);
        return null;
      }),
    ]);
    const metaAfter = verifiedRunMeta(await fetchRunMeta());
    const sameInitialisation = Number(metaAfter?.last_run_initialisation_time) === Number(runMeta.last_run_initialisation_time);
    if (sameInitialisation && sameRunMeta(runMeta, metaAfter)) {
      const ens = mergeOptionalEnsembleFields(
        coreEns, optionalEns, SIX_PLUS_OPTIONAL_VARIABLES, runMeta,
      );
      return { ens, hres, runMeta };
    }
  }
  throw new Error('ECMWF ENS-run wisselde tijdens het laden; probeer opnieuw.');
}
function runMetaTeksten(meta) {
  if (!meta?.last_run_initialisation_time) return null;
  const init = new Date(meta.last_run_initialisation_time * 1000);
  const availS = meta.last_run_availability_time || meta.last_run_initialisation_time;
  const fmtT = d => d.toLocaleTimeString('nl-NL', { timeZone: 'Europe/Amsterdam', hour: '2-digit', minute: '2-digit' });
  const RUN_STAP = 6 * 3600 * 1000;
  const fmtRun = d => `${DAGEN_KORT[d.getUTCDay()]} ${d.getUTCDate()} ${MAANDEN[d.getUTCMonth()]} ${String(d.getUTCHours()).padStart(2,'0')} UTC`;
  const volgendeModelRun = new Date(init.getTime() + RUN_STAP);
  const horizonUren = meta.data_end_time
    ? Math.round((meta.data_end_time - meta.last_run_initialisation_time) / 3600)
    : null;
  const isTussenrun = [6, 18].includes(init.getUTCHours());
  const dekking = Number.isFinite(horizonUren)
    ? (isTussenrun
      ? `tussenrun ${String(init.getUTCHours()).padStart(2,'0')} UTC: actuele dekking ${horizonUren} uur (kan korter zijn)`
      : `${horizonUren} uur brondekking`)
    : (isTussenrun ? 'tussenrun 06/18 UTC: dekking kan korter zijn' : '');
  return {
    runLabel: fmtRun(init),
    coverageLabel: dekking,
    detail: [
      `bron beschikbaar ${fmtT(new Date(availS * 1000))}`,
      dekking,
      `volgende modelrun: ${fmtRun(volgendeModelRun)}`,
    ].filter(Boolean).join(' · '),
  };
}

async function loadAndRender(force = false, edgeFresh = false) {
  const loader = document.getElementById('loader');
  const host = document.getElementById('pageHost');
  loader.classList.remove('verborgen');
  const label = force ? 'Nieuwe ensembledata controleren' : 'Ensemble laden';
  loader.innerHTML = `<div class="spinner"></div><div style="font-size:13px;font-weight:600;color:#2a4a70">${label} voor ${currentStation.name}…</div>`;
  host.innerHTML = '';

  try {
    const { ens, hres, runMeta } = await fetchCycleMatchedData(
      currentStation.lat,
      currentStation.lon,
      force,
      edgeFresh,
    );
    const model = buildModel(
      ens,
      hres,
      verifiedRunStartFromMeta(runMeta),
      verifiedDataEndFromMeta(runMeta),
    );
    const rm = runMetaTeksten(runMeta);
    if (rm) {
      model.runLabel = rm.runLabel;
      model.coverageLabel = rm.coverageLabel;
    }
    pageSvgString = buildPageSvg(model);
    host.innerHTML = pageSvgString;

    document.getElementById('hdrDatum').textContent = model.datumTxt.charAt(0).toUpperCase() + model.datumTxt.slice(1);
    document.getElementById('hdrRun').textContent = `ENS-pluim ${model.runLabel} · ${model.nMembers} leden · ${model.panelStatus}${rm ? ` · ${rm.detail}` : ''}`;
    document.getElementById('runinfo').textContent = `ENS-pluim: ${model.runLabel} · ${model.panelStatus} · ${model.hresStatus}${rm ? ` · ${rm.detail}` : ''} · ${currentStation.name} (${currentStation.lat.toFixed(3)}, ${currentStation.lon.toFixed(3)})`;
    loader.classList.add('verborgen');
  } catch (e) {
    loader.innerHTML = `<div class="err">⚠ ${e.message}</div><button class="btn btn-primair" onclick="loadAndRender(isFastUpdateWindow())">Opnieuw</button>`;
  }
}

function buildModel(ens, hres, verifiedRunStartMs, verifiedDataEndMs) {
  const hourly = addLegacyFieldAliases(ens && ens.hourly);
  const rawTimes = hourly && Array.isArray(hourly.time) ? hourly.time.map(t => new Date(t)) : [];
  if (!rawTimes.length || rawTimes.some(time => !Number.isFinite(time.getTime()))) {
    throw new Error('Geen geldige tijdstappen beschikbaar in deze modelrun.');
  }
  if (rawTimes[0].getTime() !== verifiedRunStartMs) {
    throw new Error('Ensemble begint niet exact op de gekozen ECMWF-initialisatie.');
  }
  if (ens?.weerlab_run && Date.parse(ens.weerlab_run) !== verifiedRunStartMs) {
    throw new Error('Ensembleantwoord hoort bij een andere ECMWF-run.');
  }
  const startIndex = rawTimes.findIndex(time => time.getTime() >= verifiedRunStartMs);
  if (startIndex < 0) {
    throw new Error('Geen ENS-tijdstappen vanaf de geverifieerde initialisatie.');
  }
  const candidateTimes = rawTimes.slice(startIndex);
  const cutoffLength = cutoffLengthForDataEnd(candidateTimes, verifiedDataEndMs);
  if (cutoffLength < 1) {
    throw new Error('Geen ENS-tijdstappen binnen de geverifieerde brondekking.');
  }
  const times = candidateTimes.slice(0, cutoffLength);

  const requiredVariables = ['cloudcover', 'winddirection_10m'];
  const optionalVariables = ['cape', 'temperature_850hPa', 'temperature_500hPa'];
  const unavailable = new Set(ens?.weerlab_unavailable_variables || []);
  const unavailableAliases = {
    cloudcover: 'cloud_cover',
    winddirection_10m: 'wind_direction_10m',
  };
  const missing = requiredVariables.filter(key => unavailable.has(key) || unavailable.has(unavailableAliases[key]));
  if (missing.length) {
    throw new Error(`De gekozen run mist ${missing.join(', ')}; er wordt niets uit een andere run gemengd.`);
  }
  // Deze controle gaat vóór iedere statistiek: de vier kernpanelen moeten
  // dezelfde controle + member01…member50 hebben, zonder één ontbrekend punt.
  exactCommonEnsemble(hourly, requiredVariables);

  const cloudMembers = requireMemberMatrix(trimTrailingMissing(boundedMembersOf(hourly, 'cloudcover', startIndex, cutoffLength)), 'bewolkings');
  const wdirMembers  = requireMemberMatrix(trimTrailingMissing(boundedMembersOf(hourly, 'winddirection_10m', startIndex, cutoffLength)), 'windrichtings');
  const capeMembers = optionalMemberMatrix(
    hourly, optionalVariables[0], startIndex, cutoffLength, unavailable,
  );
  const t850Members = optionalMemberMatrix(
    hourly, optionalVariables[1], startIndex, cutoffLength, unavailable,
  );
  const t500Members = optionalMemberMatrix(
    hourly, optionalVariables[2], startIndex, cutoffLength, unavailable,
  );

  const N = Math.min(
    times.length,
    ...[cloudMembers, wdirMembers]
      .map(matrix => Math.max(...matrix.map(series => series.length)))
  );
  if (!Number.isFinite(N) || N < 1) {
    throw new Error('Geen gemeenschappelijke geldige tijdstappen beschikbaar in deze modelrun.');
  }
  if (N !== times.length) {
    throw new Error('De gekozen run is niet over de volledige brondekking geladen.');
  }
  const useTimes = times.slice(0, N);
  const firstTime = useTimes[0];
  const lastTime = useTimes[useTimes.length - 1];
  const firstDay = Date.UTC(firstTime.getUTCFullYear(), firstTime.getUTCMonth(), firstTime.getUTCDate());
  const lastDay = Date.UTC(lastTime.getUTCFullYear(), lastTime.getUTCMonth(), lastTime.getUTCDate());
  const nDays = Math.max(1, Math.round((lastDay - firstDay) / DAY_MS) + 1);
  const trimMatrix = matrix => matrix.map(series => Array.from({length:N}, (_, index) => {
    const value = series[index];
    return Number.isFinite(value) ? value : null;
  }));
  const cloudUse = trimMatrix(cloudMembers);
  const wdirUse = trimMatrix(wdirMembers);
  const capeUse = capeMembers ? trimMatrix(capeMembers) : null;
  const t850Use = t850Members ? trimMatrix(t850Members) : null;
  const t500Use = t500Members ? trimMatrix(t500Members) : null;

  const hr = addLegacyFieldAliases(hres?.hourly || {});
  const hresTimes = (hr.time || []).map(time => new Date(time));
  if (hres?.weerlab_run && Date.parse(hres.weerlab_run) !== verifiedRunStartMs) {
    throw new Error('Operationele HRES hoort bij een andere ECMWF-initialisatie.');
  }
  if (hres && (!hresTimes.length || hresTimes.some(time => !Number.isFinite(time.getTime())) ||
      hresTimes[0].getTime() !== verifiedRunStartMs)) {
    throw new Error('Operationele HRES begint niet exact op de gekozen ECMWF-initialisatie.');
  }
  const hresIndex = new Map(hresTimes.map((time, index) => [time.getTime(), index]));
  const alignHres = arr => useTimes.map(time => {
    const i = hresIndex.get(time.getTime());
    if (i == null || i >= arr.length) return null;
    const v = arr[i];
    return (v == null || isNaN(v)) ? null : v;
  });
  const optionalAlignHres = (arr, label) => {
    if (!hresTimes.length || !Array.isArray(arr) || arr.length !== hresTimes.length) {
      return useTimes.map(() => null);
    }
    const aligned = alignHres(arr);
    try {
      const checked = alignHresSeries(useTimes, hresTimes, arr, label, false);
      if (aligned.some((value, index) => value !== checked[index])) {
        throw new Error(`Operationele HRES-${label} kon niet exact op timestamps worden gekoppeld`);
      }
      return checked;
    } catch (error) {
      console.warn(`Exacte HRES-${label} overgeslagen:`, error.message);
      return useTimes.map(() => null);
    }
  };
  const cloudHres = optionalAlignHres(hr.cloudcover, 'bewolking');
  const capeHres  = optionalAlignHres(hr.cape, 'CAPE');
  const t850Hres  = optionalAlignHres(hr.temperature_850hPa, 'temperatuur 850 hPa');
  const t500Hres  = optionalAlignHres(hr.temperature_500hPa, 'temperatuur 500 hPa');

  const cloudEns = cloudUse;
  const capeEns  = capeUse;
  const t850Ens  = t850Use;
  const t500Ens  = t500Use;

  const pct = (arrs, p) => percentile(arrs, p);
  const pcts = arrs => ({ p10:pct(arrs,0.1), p25:pct(arrs,0.25), p50:pct(arrs,0.5), p75:pct(arrs,0.75), p90:pct(arrs,0.9) });

  const cloudP = pcts(cloudEns);
  const capeP  = capeEns ? pcts(capeEns) : null;
  const t850P  = t850Ens ? pcts(t850Ens) : null;
  const t500P  = t500Ens ? pcts(t500Ens) : null;

  const runDate = useTimes[0];
  const runLabel = 'niet geverifieerd';
  const datumTxt = `${DAGEN_LANG[runDate.getUTCDay()]} ${runDate.getUTCDate()} ${MAANDEN_LANG[runDate.getUTCMonth()]} ${runDate.getUTCFullYear()}`;
  const todayStr = `${String(runDate.getUTCDate()).padStart(2,'0')}-${String(runDate.getUTCMonth()+1).padStart(2,'0')}-${runDate.getUTCFullYear()}`;

  const cloudStack = cloudStackSeries(cloudUse);
  const wdirStack  = windDirStackSeries(wdirUse);

  const panels = [
    { title:"Bewolking (%) — fanplot", ...cloudP, hres:cloudHres, fanColor:'#5a7ba8', xMode:'model', yMin:0, yMax:100, valueFmt:v=>Math.round(v) },
    { title:"Bewolking — kans per categorie", stacked:cloudStack, xMode:'model', yMin:0, yMax:100, valueFmt:v=>Math.round(v) },
    { title:"Windrichting — kans per sector", stacked:wdirStack, xMode:'model', yMin:0, yMax:100, valueFmt:v=>Math.round(v) },
  ];
  if (capeP) {
    panels.push({ title:"Onweer — CAPE (J/kg)", ...capeP, hres:capeHres, fanColor:'#cc6600', xMode:'model', yMin:0, yMax:5000 });
  }
  if (t850P) {
    const [t850Mn, t850Mx] = pad(...rangeOf([t850P.p10, t850P.p90], t850Hres), 0.08);
    panels.push({ title:"Temperatuur 850 hPa (°C)", ...t850P, hres:t850Hres, fanColor:'#cc0033', xMode:'model', yMin:Math.floor(t850Mn/2)*2, yMax:Math.ceil(t850Mx/2)*2, valueFmt:v=>v.toFixed(0)+"°" });
  }
  if (t500P) {
    const [t500Mn, t500Mx] = pad(...rangeOf([t500P.p10, t500P.p90], t500Hres), 0.08);
    panels.push({ title:"Temperatuur 500 hPa (°C)", ...t500P, hres:t500Hres, fanColor:'#5566cc', xMode:'model', yMin:Math.floor(t500Mn/2)*2, yMax:Math.ceil(t500Mx/2)*2, valueFmt:v=>v.toFixed(0)+"°" });
  }
  const hasHres = panels.some(panel => Array.isArray(panel.hres) && panel.hres.some(Number.isFinite));
  const missingPanels = [
    ...(!capeP ? ['CAPE/onweer'] : []),
    ...(!t850P ? ['850 hPa'] : []),
    ...(!t500P ? ['500 hPa'] : []),
  ];
  const panelStatus = panels.length === 6
    ? '6 van 6 panelen'
    : `${panels.length} van 6 panelen · ${missingPanels.join(', ')} tijdelijk niet beschikbaar voor deze run`;
  const hresStatus = hasHres ? 'exacte HRES-overlay waar beschikbaar' : 'exacte HRES-overlay niet beschikbaar';

  return {
    station: currentStation.name,
    nMembers: cloudEns.length,
    datumTxt, runLabel,
    footLeft: `Weerlab.nl ${todayStr}, gegenereerd op basis van ECMWF/Open-Meteo`,
    footRight: `Bron: ECMWF IFS-ENS`,
    nDays, times: useTimes, panels, panelStatus, hasHres, hresStatus,
  };
}

function exportPng() {
  const btn = document.getElementById('btnPng');
  if (!pageSvgString) { alert("Pluim eerst laden"); return; }
  btn.disabled = true; const old = btn.textContent; btn.textContent = "PNG renderen…";
  const blob = new Blob([pageSvgString], { type:'image/svg+xml;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const img = new Image();
  img.onload = () => {
    const SCALE = 1.18;
    const w = Math.round(PAGE_W * SCALE);
    const h = Math.round(PAGE_H * SCALE);
    const canvas = document.createElement('canvas');
    canvas.width = w; canvas.height = h;
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = "#ffffff"; ctx.fillRect(0,0,w,h);
    ctx.drawImage(img, 0, 0, w, h);
    canvas.toBlob(b => {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(b);
      a.download = `pluim_${currentStation.name.toLowerCase().replace(/\s+/g,'_')}_a4.png`;
      a.click();
      URL.revokeObjectURL(url);
      btn.disabled = false; btn.textContent = old;
    }, 'image/png');
  };
  img.onerror = () => { alert("PNG-render mislukt"); btn.disabled = false; btn.textContent = old; };
  img.src = url;
}

function scheduleAutoRefresh() {
  if (autoRefreshTimer) clearTimeout(autoRefreshTimer);
  const delay = isFastUpdateWindow() ? FAST_UPDATE_INTERVAL_MS : NORMAL_UPDATE_INTERVAL_MS;
  autoRefreshTimer = setTimeout(async () => {
    const force = isFastUpdateWindow();
    if (!document.hidden) {
      try { await loadAndRender(force); } catch (_) {}
    }
    scheduleAutoRefresh();
  }, delay);
}

document.addEventListener('visibilitychange', () => {
  if (!document.hidden && isFastUpdateWindow()) loadAndRender(true);
});

loadAndRender(isFastUpdateWindow());
scheduleAutoRefresh();
</script>
