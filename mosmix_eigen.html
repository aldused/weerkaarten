function tekenNLGrens(svg) {
  NL_GRENS.forEach(ring => {
    const pts = ring.map(([lon, lat]) => lonToX(lon) + "," + latToY(lat)).join(" ");
    // Donkere schaduw eronder voor contrast
    const shadow = ns("polyline");
    shadow.setAttribute("points", pts);
    shadow.setAttribute("fill", "none");
    shadow.setAttribute("stroke", "#444");
    shadow.setAttribute("stroke-width", "4.5");
    shadow.setAttribute("stroke-linejoin", "round");
    shadow.setAttribute("stroke-linecap", "round");
    shadow.setAttribute("opacity", "0.5");
    svg.appendChild(shadow);
    // Witte lijn erop
    const poly = ns("polyline");
    poly.setAttribute("points", pts);
    poly.setAttribute("fill", "none");
    poly.setAttribute("stroke", "white");
    poly.setAttribute("stroke-width", "2.2");
    poly.setAttribute("stroke-linejoin", "round");
    poly.setAttribute("stroke-linecap", "round");
    svg.appendChild(poly);
  });
}

const NL_DAGEN=["Zo","Ma","Di","Wo","Do","Vr","Za"];
function dagLabel(d){return NL_DAGEN[d.getDay()]+" "+d.getDate()+"/"+(d.getMonth()+1);}

const BFT=[0.3,1.6,3.4,5.5,8.0,10.8,13.9,17.2,20.8,24.5,28.5,32.7];
function kmhBft(kmh){if(!kmh)return 0;let b=0;for(let i=0;i<BFT.length;i++){if(kmh/3.6>=BFT[i])b=i+1;else break;}return b;}
function windpijl(dd){if(dd==null)return "";const p=["↓","↙","←","↖","↑","↗","→","↘"];return p[Math.round(dd/45)%8];}

function hexToRgb(h){return [parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];}
function interpKleur(val,schaal,stops){
  const t=Math.max(0,Math.min(1,(val-schaal[0])/(schaal[1]-schaal[0])));
  const c=stops.map(s=>hexToRgb(s[0]));
  const idx=Math.min(c.length-2,Math.floor(t*(c.length-1)));
  const f=t*(c.length-1)-idx;
  const a=c[idx],b=c[idx+1];
  const r=Math.round(a[0]+f*(b[0]-a[0])),g=Math.round(a[1]+f*(b[1]-a[1])),bl=Math.round(a[2]+f*(b[2]-a[2]));
  const lum=(0.299*r+0.587*g+0.114*bl)/255;
  return [`rgb(${r},${g},${bl})`,lum<0.55?"white":"#222"];
}

// Positie offsets rond het bolletje (R=16)
const R = 16;
const POSITIES = {
  boven:        {dx:0,   dy:-R-8,  anchor:"middle"},
  boven2:       {dx:0,   dy:-R-20, anchor:"middle"},
  rechts_boven: {dx:R+18,dy:-4,    anchor:"start"},
  rechts_onder: {dx:R+18,dy:10,    anchor:"start"},
  onder:        {dx:0,   dy:R+14,  anchor:"middle"},
  onder2:       {dx:0,   dy:R+26,  anchor:"middle"},
  links:        {dx:-R-18,dy:4,    anchor:"end"},
  links_boven:  {dx:-R-18,dy:-8,   anchor:"end"},
  links_onder:  {dx:-R-18,dy:16,   anchor:"end"},
};

let mosmixData = null, huidigDag = null;
const actieveLagen = new Set(["TX","TN","FF"]);

function txtLabel(svg, x, y, tekst, kleur, anchor, size) {
  size = size || 10;
  const w = tekst.length * size * 0.6 + 6;
  const bg = ns("rect");
  const rx = anchor === "middle" ? x - w/2 : anchor === "end" ? x - w : x;
  bg.setAttribute("x", rx); bg.setAttribute("y", y - size + 1);
  bg.setAttribute("width", w); bg.setAttribute("height", size + 3);
  bg.setAttribute("rx", "2"); bg.setAttribute("fill", "rgba(255,255,255,0.88)");
  bg.setAttribute("stroke", "#ccc"); bg.setAttribute("stroke-width", "0.3");
  svg.appendChild(bg);

  const t = ns("text");
  t.setAttribute("x", x); t.setAttribute("y", y);
  t.setAttribute("text-anchor", anchor);
  t.setAttribute("font-size", size); t.setAttribute("font-weight", "bold");
  t.setAttribute("font-family", "Arial,sans-serif");
  t.setAttribute("fill", kleur);
  t.textContent = tekst;
  svg.appendChild(t);
}

function formatVal(param, val) {
  if (val == null) return null;
  if (param === "FF") return windpijl(null) + val.toFixed(0) + "·" + kmhBft(val) + "Bft";
  if (param === "FX") return val.toFixed(0);
  if (param === "VV") return val < 10 ? Math.round(val*1000) + "m" : val.toFixed(0) + "km";
  if (param === "Neff") return val + "%";
  if (param === "wwM" || param === "wwZ") return val + "%";
  if (param === "SQ") return val.toFixed(1) + "u";
  if (param === "RR") return val.toFixed(1);
  return val.toFixed(PARAMS[param]?.dec ?? 1) + (PARAMS[param]?.eenheid || "");
}

function teken() {
  const svg = document.getElementById("nl-kaart");
  svg.innerHTML = "";
  tekenNLGrens(svg);
  if (!mosmixData || !huidigDag) return;

  const dagObj = mosmixData.data[huidigDag];
  if (!dagObj) return;

  const stations = mosmixData.stations;
  const primParam = document.getElementById("sel-primair").value;
  const primData = dagObj[primParam] || {};
  const primP = PARAMS[primParam];

  // Update header
  const d = new Date(huidigDag + "T12:00:00");
  document.getElementById("kaart-dag").textContent = dagLabel(d);
  const laagNamen = [...actieveLagen].map(l => PARAMS[l]?.label || l).join(" · ");
  document.getElementById("kaart-lagen").textContent = laagNamen || "Geen lagen";

  // Teken stations
  Object.entries(stations).forEach(([naam, coords]) => {
    const cx = lonToX(coords[0]), cy = latToY(coords[1]);
    const g = ns("g");

    // Bolletje (kleur = primaire parameter)
    const primVal = primData[naam];
    let bg = "#ccc", fg = "#333";
    if (primVal != null && primP) {
      [bg, fg] = interpKleur(primVal, primP.schaal, primP.kleuren);
    }

    const circle = ns("circle");
    circle.setAttribute("cx", cx); circle.setAttribute("cy", cy);
    circle.setAttribute("r", R); circle.setAttribute("fill", bg);
    circle.setAttribute("stroke", "white"); circle.setAttribute("stroke-width", "1.5");
    g.appendChild(circle);
    svg.appendChild(g);

    // Labels per actieve laag
    const gebruiktePos = new Set();
    actieveLagen.forEach(laag => {
      const p = PARAMS[laag];
      if (!p) return;
      const val = dagObj[laag]?.[naam];
      if (val == null) return;

      // Wind: speciaal — pijl + Bft
      if (laag === "FF") {
        const dd = dagObj["DD"]?.[naam];
        const pijl = windpijl(dd);
        const bft = kmhBft(val);
        const tekst = pijl + val.toFixed(0) + "·" + bft + "Bft";
        let pos = POSITIES[p.pos];
        txtLabel(svg, cx + pos.dx, cy + pos.dy, tekst, p.kleur, pos.anchor, 9);
        gebruiktePos.add(p.pos);
        return;
      }

      // Bepaal positie (als al bezet, zoek alternatief)
      let posKey = p.pos;
      if (gebruiktePos.has(posKey)) {
        // Zoek vrije positie
        const alt = ["rechts_boven","rechts_onder","links_boven","links_onder","onder","onder2","boven2"];
        for (const a of alt) {
          if (!gebruiktePos.has(a)) { posKey = a; break; }
        }
      }
      gebruiktePos.add(posKey);
      const pos = POSITIES[posKey];

      const tekst = formatVal(laag, val);
      if (!tekst) return;
      txtLabel(svg, cx + pos.dx, cy + pos.dy, tekst, p.kleur, pos.anchor, 9);
    });
  });

  // Copyright
  const cr = ns("text");
  cr.setAttribute("x", SVG_W - 10); cr.setAttribute("y", SVG_H - 12);
  cr.setAttribute("text-anchor", "end"); cr.setAttribute("font-size", "16");
  cr.setAttribute("font-family", "Arial,sans-serif"); cr.setAttribute("font-style", "italic");
  cr.setAttribute("fill", "#888"); cr.textContent = "© Ed Aldus / DWD MOSMIX";
  svg.appendChild(cr);

  // Legenda (primaire parameter)
  if (primP) {
    document.getElementById("legenda").innerHTML = primP.kleuren.map(([k, l]) =>
      `<span><span class="leg-blok" style="background:${k}"></span>${l}</span>`
    ).join("");
  }

  document.getElementById("status").textContent = "";
}

function maakDagKnoppen() {
  const wrap = document.getElementById("dag-btns");
  wrap.innerHTML = "";
  const vandaag = new Date().toISOString().slice(0, 10);
  mosmixData.dagen.forEach((dag, i) => {
    const btn = document.createElement("button");
    btn.className = "dag-btn" + (dag === huidigDag ? " actief" : "");
    const d = new Date(dag + "T12:00:00");
    btn.textContent = i === 0 && dag === vandaag ? "Vandaag" : i === 1 ? "Morgen" : dagLabel(d);
    btn.onclick = () => {
      huidigDag = dag;
      document.querySelectorAll(".dag-btn").forEach(b => b.classList.remove("actief"));
      btn.classList.add("actief");
      teken();
    };
    wrap.appendChild(btn);
  });
}

// Toggle lagen
document.querySelectorAll(".chk").forEach(btn => {
  btn.addEventListener("click", () => {
    const laag = btn.dataset.laag;
    if (actieveLagen.has(laag)) {
      actieveLagen.delete(laag);
      btn.classList.remove("aan");
    } else {
      actieveLagen.add(laag);
      btn.classList.add("aan");
    }
    teken();
  });
});

// PNG export
function slaOp() {
  const img = document.getElementById("kaart-basis");
  const svg = document.getElementById("nl-kaart");
  const canvas = document.createElement("canvas");
  const scale = 2;
  const hdrH = 44;
  canvas.width = img.naturalWidth * scale;
  canvas.height = (img.naturalHeight + hdrH) * scale;
  const ctx = canvas.getContext("2d");
  ctx.scale(scale, scale);

  // Header
  ctx.fillStyle = "#003366"; ctx.fillRect(0, 0, img.naturalWidth, hdrH);
  ctx.fillStyle = "white"; ctx.font = "bold 14px Arial"; ctx.textAlign = "left";
  ctx.fillText("Ed Aldus WM — Eigen Weerkaart", 14, 20);
  ctx.fillStyle = "#a8c8e8"; ctx.font = "10px Arial";
  const lagen = [...actieveLagen].map(l => PARAMS[l]?.label || l).join(" · ");
  ctx.fillText(lagen, 14, 34);
  ctx.textAlign = "right"; ctx.fillStyle = "white"; ctx.font = "bold 14px Arial";
  ctx.fillText(document.getElementById("kaart-dag").textContent, img.naturalWidth - 14, 20);
  ctx.fillStyle = "#a8c8e8"; ctx.font = "10px Arial";
  ctx.fillText("DWD MOSMIX", img.naturalWidth - 14, 34);
  ctx.textAlign = "left";

  // Kaart
  ctx.drawImage(img, 0, hdrH, img.naturalWidth, img.naturalHeight);

  // SVG
  const svgStr = new XMLSerializer().serializeToString(svg);
  const blob = new Blob([svgStr], {type: "image/svg+xml;charset=utf-8"});
  const url = URL.createObjectURL(blob);
  const svgImg = new Image();
  svgImg.onload = () => {
    ctx.drawImage(svgImg, 0, hdrH, img.naturalWidth, img.naturalHeight);
    URL.revokeObjectURL(url);
    const a = document.createElement("a");
    a.download = "eigen_kaart_" + huidigDag + ".png";
    a.href = canvas.toDataURL("image/png");
    a.click();
  };
  svgImg.src = url;
}

// Laden
fetch("mosmix_nl.json?t=" + Date.now())
  .then(r => r.json())
  .then(json => {
    mosmixData = json;
    huidigDag = json.dagen[0];
    document.getElementById("hdr-run").textContent = "Run: " + (json.run || "").replace("T", " ").replace(":00:00Z", " UTC");
    document.getElementById("hdr-update").textContent = "Bijgewerkt: " + (json.bijgewerkt || "");
    maakDagKnoppen();
    teken();
  })
  .catch(e => { document.getElementById("status").textContent = "Fout: " + e.message; });
</script>
