<style>
*,*::before,*::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'DM Sans', 'Segoe UI', Inter, Arial, sans-serif;

}

/* ── Chart ── */

<body>

<div class="header">
  <div>
    <h1>Opers-<span>Multi</span></h1>

  </div>

</div>

<div class="controls">

  </div>
  <div class="legend" id="legend"></div>
</div>
<div class="footer">Opers-Multi · Weerlab.nl · modellen via Open-Meteo · MOSMIX via DWD · gemeten temperatuur via KNMI 10-minutenwaarnemingen</div>

<script>
// ── Modellen (Open-Meteo deterministische slugs) ──────────────────────────
// width = lijndikte; thuismodel (HARMONIE-NL) en UKMO dik, zoals Wetterzentrale
const MODELS = [
  { slug:'knmi_harmonie_arome_netherlands', label:'HARMONIE (KNMI-NL)', color:'#111111', width:2.6 },
  { slug:'knmi_harmonie_arome_europe',      label:'HARMONIE (KNMI-EU)', color:'#4aa3df', width:1.6 },
  { slug:'meteofrance_arome_france_hd',     label:'AROME',     color:'#6fce5e', width:1.4 },
  { slug:'meteofrance_arpege_europe',       label:'ARPEGE',    color:'#d9c63f', width:1.4 },
  { slug:'dwd_icon',                        label:'ICON',      color:'#34c2bf', width:1.4 },
  { slug:'dwd_icon_eu',                     label:'ICON-EU',   color:'#1f8f8c', width:1.2 },
  { slug:'dwd_icon_d2',                     label:'ICON-D2',   color:'#86dad7', width:1.2 },
  { slug:'gfs_seamless',                    label:'GFS',       color:'#e8902e', width:1.4 },
  { slug:'ecmwf_ifs025',                    label:'ECMWF',     color:'#e8722e', width:1.8 },
  { slug:'ecmwf_aifs025_single',            label:'AIFS',      color:'#9b59d6', width:1.4 },
  { slug:'ukmo_global_deterministic_10km',  label:'UKMO',      color:'#0f7a72', width:2.6 },
  { slug:'gem_global',                      label:'GEM',       color:'#8a8f99', width:1.4 },
  { slug:'jma_seamless',                    label:'JMA',       color:'#d64a8a', width:1.2 },
  { slug:'metno_seamless',                  label:'MET Norway',color:'#5b6cff', width:1.2 },
  { slug:'cma_grapes_global',               label:'CMA',       color:'#c0653a', width:1.2 },
];

// ── MOSMIX: DWD statistisch nabewerkte puntverwachting (bias-gecorrigeerd) ──
// Dient als "beste schatting"-referentie tussen de ruwe modellen. Alleen
// getoond als er een MOSMIX-station binnen MOSMIX_MAX_KM van de gekozen
// locatie ligt (31 stations NL/BE/DE-grensstrook in het uurbestand).
const MOSMIX_MAX_KM = 40;
const MOSMIX_KLEUR  = '#c400c4';
const MOSMIX_LOKAAL = location.protocol === 'file:' || ['localhost','127.0.0.1'].includes(location.hostname);
const MOSMIX_URL     = MOSMIX_LOKAAL ? 'mosmix_uurlijks_nl.json' : 'https://data.weerlab.nl/mosmix_uurlijks_nl.json';
const MOSMIX_DAG_URL = MOSMIX_LOKAAL ? 'mosmix_nl.json'          : 'https://data.weerlab.nl/mosmix_nl.json';
const ACTUEEL_URL    = MOSMIX_LOKAAL ? 'actueel.json'             : 'https://data.weerlab.nl/actueel.json';
const OBS_KLEUR      = '#d81b48';
const VERVERS_MS     = 10 * 60 * 1000;
let mosmixCache = null, mosmixDagCache = null;
let mosmixCacheTijd = 0;

function afstandKm(lat1, lon1, lat2, lon2) {
  const R = 6371, rad = Math.PI / 180;
  const dLat = (lat2 - lat1) * rad, dLon = (lon2 - lon1) * rad;
  const a = Math.sin(dLat/2)**2 + Math.cos(lat1*rad) * Math.cos(lat2*rad) * Math.sin(dLon/2)**2;
  return 2 * R * Math.asin(Math.sqrt(a));
}

async function haalMosmix(lat, lon) {
  try {
    if (!mosmixCache || Date.now() - mosmixCacheTijd >= VERVERS_MS) {
      // dag-bestand (TX per datum) parallel met uurbestand; TX mag falen
      const [uur, dag] = await Promise.all([
        fetchJSON(MOSMIX_URL, true),
        fetchJSON(MOSMIX_DAG_URL, true).catch(() => null),
      ]);
      mosmixCache = uur;
      mosmixDagCache = dag;
      mosmixCacheTijd = Date.now();
    }
    let best = null, bestKm = Infinity;
    for (const [naam, co] of Object.entries(mosmixCache.stations || {})) {
      const km = afstandKm(lat, lon, co[1], co[0]);   // stations: [lon, lat]
      if (km < bestKm) { bestKm = km; best = naam; }
    }
    if (!best || bestKm > MOSMIX_MAX_KM) return null;
    const s = mosmixCache.data?.[best];
    if (!s?.tijden || !s?.TTT?.some(x => x != null)) return null;
    // TX (echte dagmax uit dag-bestand): { '2026-07-05': 21.9, ... }
    const tx = {};
    for (const [datum, veld] of Object.entries(mosmixDagCache?.data || {})) {
      const v = veld?.TX?.[best];
      if (v != null) tx[datum] = v;
    }
    return {
      station: best, km: bestKm, time: s.tijden,
      temp: s.TTT, precip: s.RR1c, wind: s.FF, tx
    };
  } catch (e) { return null; }
}

async function haalKnmiMeting(lat, lon) {
  try {
    const bron = await fetchJSON(ACTUEEL_URL, true);
    let best = null, bestKm = Infinity;
    for (const station of Object.values(bron?.stations || {})) {
      if (!Number.isFinite(+station?.lat) || !Number.isFinite(+station?.lon)) continue;
      const historie = (station.historie || []).filter(p => p?.t && Number.isFinite(+p.ta));
      if (!historie.length && !Number.isFinite(+station.ta)) continue;
      const km = afstandKm(lat, lon, +station.lat, +station.lon);
      if (km < bestKm) { bestKm = km; best = station; }
    }
    if (!best) return null;
    const punten = (best.historie || [])
      .filter(p => p?.t && Number.isFinite(+p.ta))
      .map(p => ({ t:p.t, ta:+p.ta }));
    if (!punten.length && Number.isFinite(+best.ta)) {
      punten.push({ t:new Date().toISOString(), ta:+best.ta });
    }
    return {
      station: best.naam || 'KNMI-station',
      km: bestKm,
      bijgewerkt: bron.bijgewerkt || '',
      time: punten.map(p => p.t),
      temp: punten.map(p => p.ta),
    };
  } catch (e) { return null; }
}

const QUICK = [
  { n:'Rotterdam',   lat:51.9225, lon:4.4792 },
  { n:'De Bilt',     lat:52.1015, lon:5.1779 },
  { n:'Groningen',   lat:53.2194, lon:6.5665 },
  { n:'Maastricht',  lat:50.8514, lon:5.6910 },
  { n:'Den Helder',  lat:52.9588, lon:4.7606 },
  { n:'Vlissingen',  lat:51.4426, lon:3.5736 },
];

const FORECAST_DAYS = 7;
const API = 'https://api.open-meteo.com/v1/forecast';
const PARAMS = {
  temp:   { field:'temp',   label:'Temperatuur', exportLabel:'temperatuur', yTitle:'2 m temperatuur (°C)', unit:'°', decimals:1 },
  precip: { field:'precip', label:'Neerslag',    exportLabel:'neerslag',    yTitle:'Neerslag per uur (mm)', unit:' mm', decimals:1 },
  bft:    { field:'wind',   label:'Windkracht',  exportLabel:'windkracht',  yTitle:'Windkracht op 10 m (Bft)', unit:' Bft', decimals:0 },
};
let chart = null;
let huidigeParam = 'temp';
let huidigePlaats = '';      // voor plaatslabel rechtsonder + PNG-download
let huidigeDatasets = [];    // voor legend in PNG-download
let huidigeTIMES = [];       // voor PNG-export op vaste maat
let laatsteData = null;       // modeldata hergebruiken bij wisselen van parameter
let huidigeLocatie = null;    // voor automatische 10-minutenverversing
let laatsteOphaalTijd = null;
let laadVolgnummer = 0;
let verversTimer = null;

const fmtClock = d => String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
const MND = ['jan','feb','mrt','apr','mei','jun','jul','aug','sep','okt','nov','dec'];
const DAG = ['zo','ma','di','wo','do','vr','za'];

async function fetchJSON(url, vers = false) {
  const scheiding = url.includes('?') ? '&' : '?';
  const doel = vers ? `${url}${scheiding}_=${Date.now()}` : url;
  const r = await fetch(doel, vers ? { cache:'no-store' } : undefined);
  if (!r.ok) throw new Error('HTTP ' + r.status);
  return r.json();
}

// Batch modellen in één multi-model request (responsevelden krijgen een model-suffix).
// Scheelt 15 losse requests → minder kans op rate-limit. Eén kapotte batch
// dropt alleen z'n eigen modellen (.catch() → []).
const BATCH_SIZE = 8;
async function haalBatch(batch, lat, lon) {
  const slugs = batch.map(m => m.slug).join(',');
  const url = `${API}?latitude=${lat}&longitude=${lon}`
            + `&hourly=temperature_2m,precipitation,wind_speed_10m&models=${slugs}`
            + `&wind_speed_unit=kmh&precipitation_unit=mm`
            + `&timezone=Europe%2FAmsterdam&forecast_days=${FORECAST_DAYS}`;
  try {
    // Open-Meteo kiest per slug de nieuwste beschikbare operationele run.
    // Cache-busting voorkomt dat een oudere browser/CDN-response blijft hangen.
    const j = await fetchJSON(url, true);
    const t = j?.hourly?.time;
    if (!t) return [];
    return batch.map(m => {
      const temp = j.hourly['temperature_2m_' + m.slug];
      const precip = j.hourly['precipitation_' + m.slug];
      const wind = j.hourly['wind_speed_10m_' + m.slug];
      if (![temp, precip, wind].some(v => v?.some(x => x != null))) return null;
      return { ...m, time: t, temp, precip, wind };
    }).filter(Boolean);
  } catch (e) { return []; }
}

async function laad(lat, lon, naam) {
  const mijnVolgnummer = ++laadVolgnummer;
  huidigeLocatie = { lat:+lat, lon:+lon, naam };
  huidigePlaats = naam;
  laatsteData = null;
  document.getElementById('locName').textContent  = naam;
  document.getElementById('locCoord').innerHTML   =
    `${(+lat).toFixed(4)}°N, ${(+lon).toFixed(4)}°E`;
  document.getElementById('status').style.display = '';
  document.getElementById('status').textContent   = 'Modellen laden…';
  document.getElementById('chart').style.display  = 'none';

  // Zon op/onder (best match) + alle modellen parallel
  const sunP = fetchJSON(`${API}?latitude=${lat}&longitude=${lon}`
            + `&daily=sunrise,sunset&timezone=Europe%2FAmsterdam&forecast_days=1`).catch(()=>null);
  const mosP = haalMosmix(lat, lon);
  const obsP = haalKnmiMeting(lat, lon);
  const batches = [];
  for (let i = 0; i < MODELS.length; i += BATCH_SIZE) batches.push(MODELS.slice(i, i + BATCH_SIZE));
  const results = (await Promise.all(batches.map(b => haalBatch(b, lat, lon)))).flat();
  const sun = await sunP;
  const mosmix = await mosP;
  const obs = await obsP;
  if (mijnVolgnummer !== laadVolgnummer) return;

  if (sun?.daily?.sunrise) {
    document.getElementById('sunrise').textContent = fmtClock(new Date(sun.daily.sunrise[0]));
    document.getElementById('sunset').textContent  = fmtClock(new Date(sun.daily.sunset[0]));
  }

  const ok = results.filter(Boolean);
  if (!ok.length) {
    document.getElementById('status').textContent = 'Geen modeldata beschikbaar voor deze locatie.';
    return;
  }

  // Gemeenschappelijke tijd-as op 10 minuten. De modellen blijven uurlijks,
  // maar de KNMI-lijn krijgt zo ieder werkelijk meetpunt tot en met "nu".
  let modelTimes = [];
  for (const r of ok) if (r.time.length > modelTimes.length) modelTimes = r.time;
  const modelDatums = modelTimes.map(t => new Date(t)).filter(d => Number.isFinite(d.getTime()));
  const stap = 10 * 60 * 1000;
  const begin = Math.floor(modelDatums[0].getTime() / stap) * stap;
  const einde = Math.ceil(modelDatums.at(-1).getTime() / stap) * stap;
  const TIMES = [];
  for (let t = begin; t <= einde; t += stap) TIMES.push(new Date(t));
  laatsteOphaalTijd = new Date();
  laatsteData = { TIMES, ok, mosmix, obs };
  toonParameter(huidigeParam);
}

function kmhNaarBft(kmh) {
  if (kmh == null || !Number.isFinite(+kmh)) return null;
  const grenzen = [1, 6, 12, 20, 29, 39, 50, 62, 75, 89, 103, 118];
  for (let b = 0; b < grenzen.length; b++) if (+kmh < grenzen[b]) return b;
  return 12;
}

function toonParameter(param) {
  if (!PARAMS[param]) return;
  huidigeParam = param;
  document.querySelectorAll('.param-btn').forEach(b => b.classList.toggle('actief', b.dataset.param === param));
  if (!laatsteData) return;

  const { TIMES, ok, mosmix, obs } = laatsteData;
  const cfg = PARAMS[param];
  const stap = 10 * 60 * 1000;
  const idx = new Map(TIMES.map((t,i) => [Math.round(t.getTime() / stap), i]));
  const mapReeks = (mt, mv) => {
    const data = new Array(TIMES.length).fill(null);
    if (!mt || !mv) return data;
    for (let i = 0; i < mt.length; i++) {
      const ms = new Date(mt[i]).getTime();
      if (!Number.isFinite(ms)) continue;
      const j = idx.get(Math.round(ms / stap));
      if (j != null) data[j] = param === 'bft' ? kmhNaarBft(mv[i]) : mv[i];
    }
    return data;
  };

  const beschikbaar = ok.filter(r => r[cfg.field]?.some(x => x != null));
  const datasets = beschikbaar.map(r => ({
    label: r.label, data: mapReeks(r.time, r[cfg.field]),
    borderColor: r.color, backgroundColor: r.color,
    borderWidth: r.width, borderDash: r.dash || [],
    pointRadius: 0, pointHoverRadius: 4,
    tension: param === 'temp' ? 0.35 : 0,
    stepped: param === 'bft', spanGaps: true, _slug: r.slug,
  }));

  const mosReeks = mosmix?.[cfg.field];
  if (mosReeks?.some(x => x != null)) {
    datasets.unshift({
      label: `MOSMIX (${mosmix.station})`,
      data: mapReeks(mosmix.time, mosReeks),
      borderColor: MOSMIX_KLEUR, backgroundColor: MOSMIX_KLEUR,
      borderWidth: 3, borderDash: [8, 5],
      pointRadius: 0, pointHoverRadius: 4,
      tension: param === 'temp' ? 0.35 : 0,
      stepped: param === 'bft', spanGaps: true, _slug: 'mosmix',
    });
  }

  // Alleen bij temperatuur: gemeten 10-minutenreeks van het dichtstbijzijnde
  // KNMI-station, van lokale middernacht tot de laatste beschikbare meting.
  if (param === 'temp' && obs?.temp?.some(x => x != null)) {
    datasets.unshift({
      label: `Gemeten (KNMI ${obs.station})`,
      data: mapReeks(obs.time, obs.temp),
      borderColor: OBS_KLEUR, backgroundColor: OBS_KLEUR,
      borderWidth: 2, borderDash: [],
      pointRadius: 0, pointHoverRadius: 4,
      tension: 0.12, spanGaps: false, _slug: 'knmi_obs',
    });
  }

  // Alleen bij temperatuur: echte MOSMIX-dagmax als ruit op het warmste uur.
  if (param === 'temp' && mosmix) {
    const txData = new Array(TIMES.length).fill(null);
    const piek = {};
    for (let i = 0; i < mosmix.time.length; i++) {
      const ms = new Date(mosmix.time[i]).getTime();
      const j = Number.isFinite(ms) ? idx.get(Math.round(ms / stap)) : null;
      const t = mosmix.temp[i];
      if (j == null || t == null) continue;
      const datum = mosmix.time[i].slice(0, 10);
      if (!(datum in (mosmix.tx || {}))) continue;
      if (!piek[datum] || t > piek[datum].t) piek[datum] = { j, t };
    }
    for (const [datum, p] of Object.entries(piek)) txData[p.j] = mosmix.tx[datum];
    if (txData.some(x => x != null)) datasets.push({
      label: 'MOSMIX dagmax (TX)', data: txData,
      borderColor: MOSMIX_KLEUR, backgroundColor: MOSMIX_KLEUR,
      borderWidth: 0, showLine: false,
      pointRadius: 5, pointHoverRadius: 7, pointStyle: 'rectRot',
      spanGaps: false, _slug: 'mosmix_tx',
    });
  }

  const gemist = MODELS.length - beschikbaar.length;
  const verversd = laatsteOphaalTijd ? fmtClock(laatsteOphaalTijd) : '–';
  document.getElementById('runInfo').textContent =
    `${beschikbaar.length} modellen · ${cfg.label.toLowerCase()}`
    + (gemist ? ` · ${gemist} niet beschikbaar` : '')
    + (param === 'temp'
        ? (obs ? ` · gemeten: ${obs.station} (${obs.km < 1 ? '<1' : Math.round(obs.km)} km)` : ' · geen KNMI-meting')
        : '')
    + (mosmix ? ` · MOSMIX: ${mosmix.station} (${mosmix.km < 1 ? '<1' : Math.round(mosmix.km)} km)`
              : ' · geen MOSMIX-station binnen 40 km')
    + ` · nieuwste runs/metingen opgehaald ${verversd}`;

  teken(TIMES, datasets, param);
  bouwLegend(datasets);
}

// Zachte rode stippel-referentielijnen bij 25/30/35° (onder de modellijnen)
const DREMPELS = [25, 30, 35];
const drempelPlugin = {
  id: 'drempels',
  beforeDatasetsDraw(chart) {
    const { ctx, chartArea, scales } = chart;
    const y = scales.y; if (!y) return;
    ctx.save();
    ctx.strokeStyle = 'rgba(204,0,0,0.22)';
    ctx.lineWidth = 1;
    ctx.setLineDash([4, 4]);
    DREMPELS.forEach(t => {
      if (t < y.min || t > y.max) return;
      const py = y.getPixelForValue(t);
      ctx.beginPath();
      ctx.moveTo(chartArea.left, py);
      ctx.lineTo(chartArea.right, py);
      ctx.stroke();
    });
    ctx.restore();
  }
};

// Plaatsnaam rechtsonder in de grafiek (zit ook in de PNG-download)
const plaatsLabelPlugin = {
  id: 'plaatsLabel',
  afterDraw(chart) {
    if (!huidigePlaats) return;
    const { ctx, chartArea } = chart;
    ctx.save();
    ctx.font = '600 14px "DM Sans", sans-serif';
    ctx.fillStyle = 'rgba(35,55,85,0.5)';
    ctx.textAlign = 'right';
    ctx.textBaseline = 'bottom';
    ctx.fillText(huidigePlaats, chartArea.right - 10, chartArea.bottom - 8);
    ctx.restore();
  }
};

// Config gedeeld door live-chart en PNG-export (export: responsive uit + vaste dpr)
function chartConfig(TIMES, datasets, param, dpr) {
  const cfg = PARAMS[param];
  return {
    type: 'line',
    plugins: param === 'temp' ? [drempelPlugin, plaatsLabelPlugin] : [plaatsLabelPlugin],
    data: { labels: TIMES.map((_,i)=>i), datasets },
    options: {
      responsive: dpr == null, maintainAspectRatio: false,
      ...(dpr != null ? { devicePixelRatio: dpr } : {}),
      animation: false,
      interaction: { mode: 'index', intersect: false },
      plugins: {
        legend: { display: false },
        tooltip: {
          filter: (it) => it.parsed.y != null,   // TX-marker: alleen op piek-uur tonen
          itemSort: (a,b) => b.parsed.y - a.parsed.y,
          backgroundColor: 'rgba(255,255,255,0.97)',
          titleColor: '#1a2b40', bodyColor: '#1a2b40',
          borderColor: '#cdd8e6', borderWidth: 1,
          padding: 10, boxPadding: 4, usePointStyle: true,
          titleFont: { family:'DM Sans', weight:'600', size:13 },
          bodyFont:  { family:'DM Mono', size:12 },
          callbacks: {
            title: (items) => {
              const d = TIMES[items[0].dataIndex];
              return `${DAG[d.getDay()]} ${d.getDate()} ${MND[d.getMonth()]} ${fmtClock(d)}`;
            },
            label: (it) => {
              const v = it.parsed.y;
              return ` ${it.dataset.label}: ${v == null ? '–' : v.toFixed(cfg.decimals)}${cfg.unit}`;
            },
          }
        }
      },
      scales: {
        x: {
          grid: { color: '#eef2f7' },
          ticks: {
            font: { family:'DM Sans', size:11 }, color:'#5a6a80',
            maxRotation: 0, autoSkip: false,
            callback: (val, i) => {
              const d = TIMES[i]; if (!d) return '';
              const h = d.getHours();
              if (h === 0 && d.getMinutes() === 0) return [DAG[d.getDay()], `${d.getDate()} ${MND[d.getMonth()]}`];
              if (h === 12 && d.getMinutes() === 0) return '12:00';
              return '';
            }
          }
        },
        y: {
          beginAtZero: param !== 'temp',
          ...(param === 'bft' ? { min:0, max:12 } : {}),
          title: { display: true, text: cfg.yTitle, font:{family:'DM Sans', size:11}, color:'#5a6a80' },
          grid: { color: '#eef2f7' },
          ticks: {
            font:{family:'DM Mono', size:11}, color:'#5a6a80',
            ...(param === 'bft' ? { stepSize:1, precision:0 } : {}),
            callback: v => v + cfg.unit
          }
        }
      }
    }
  };
}

function teken(TIMES, datasets, param) {
  document.getElementById('status').style.display = 'none';
  const cv = document.getElementById('chart');
  cv.style.display = '';
  if (chart) chart.destroy();
  huidigeDatasets = datasets;
  huidigeTIMES = TIMES;
  chart = new Chart(cv, chartConfig(TIMES, datasets, param));
}

function bouwLegend(datasets) {
  const box = document.getElementById('legend');
  box.innerHTML = '';
  datasets.forEach((ds, i) => {
    const el = document.createElement('div');
    el.className = 'item';
    if (ds.showLine === false) {                          // TX-marker: ruit i.p.v. lijn
      el.innerHTML = `<span style="color:${ds.borderColor};font-size:12px;line-height:1">&#9670;</span>${ds.label}`;
    } else {
      const dash = ds.borderDash && ds.borderDash.length; // MOSMIX: gestreept swatch
      const bg = dash
        ? `repeating-linear-gradient(90deg, ${ds.borderColor} 0 5px, transparent 5px 8px)`
        : ds.borderColor;
      el.innerHTML = `<span class="swatch" style="background:${bg}"></span>${ds.label}`;
    }
    el.onclick = () => {
      const meta = chart.getDatasetMeta(i);
      meta.hidden = meta.hidden === null ? !chart.data.datasets[i].hidden : !meta.hidden;
      el.classList.toggle('off', meta.hidden);
      chart.update();
    };
    box.appendChild(el);
  });
}

// ── Download PNG (kop + grafiek + legend + voet, weerlab-stijl) ─────────────
const EXPORT_W = 832, EXPORT_H = 625, EXPORT_DPR = 2;   // grafiek 1664×1250 px

function downloadPNG() {
  if (!chart) return;
  const plaats = huidigePlaats || 'locatie';
  // Offscreen op vaste maat renderen: exportgrootte staat los van het
  // browservenster. Verborgen (weggeklikte) modellen blijven ook uit de PNG.
  const ds = huidigeDatasets.filter((d, i) => !chart.getDatasetMeta(i).hidden);
  if (!ds.length) return;
  const p2 = n => String(n).padStart(2, '0');
  const nu = new Date();
  const ts = `${nu.getFullYear()}${p2(nu.getMonth()+1)}${p2(nu.getDate())}_${p2(nu.getHours())}${p2(nu.getMinutes())}`;

  const cvOff = document.createElement('canvas');
  cvOff.width = EXPORT_W; cvOff.height = EXPORT_H;
  const tmp = new Chart(cvOff, chartConfig(huidigeTIMES, ds, huidigeParam, EXPORT_DPR));
  const cw = cvOff.width, ch = cvOff.height;      // na Chart-init: ×EXPORT_DPR
  const pad = 26, headerH = 60, footerH = 38;
  const cols = 5, rowH = 30;
  const legRows = Math.ceil(ds.length / cols);
  const legendH = legRows * rowH + 18;
  const W = cw + pad * 2;
  const H = headerH + ch + legendH + footerH;

  const off = document.createElement('canvas');
  off.width = W; off.height = H;
  const ctx = off.getContext('2d');
  ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, W, H);

  // Kop (navy)
  ctx.fillStyle = '#003366'; ctx.fillRect(0, 0, W, headerH);
  ctx.textBaseline = 'middle';
  ctx.fillStyle = '#ffffff';
  ctx.font = 'bold 22px "DM Sans","Segoe UI",sans-serif';
  ctx.textAlign = 'left';
  const cfg = PARAMS[huidigeParam];
  ctx.fillText(`Opers-Multi ${cfg.exportLabel} — ${plaats}`, pad, headerH / 2);
  ctx.fillStyle = '#a8c4e8';
  ctx.font = '14px "DM Sans","Segoe UI",sans-serif';
  ctx.textAlign = 'right';
  const nMod = ds.filter(d => MODELS.some(m => m.slug === d._slug)).length;
  const metMos = ds.some(d => d._slug === 'mosmix');
  const metObs = ds.some(d => d._slug === 'knmi_obs');
  ctx.fillText(`Ed Aldus · ${cfg.label} · ${nMod} modellen${metMos ? ' + MOSMIX' : ''}${metObs ? ' + KNMI gemeten' : ''}`, W - pad, headerH / 2);

  // Grafiek
  ctx.drawImage(cvOff, pad, headerH, cw, ch);
  tmp.destroy();

  // Legend (kleur-lijntje + label, in kolommen)
  const legY = headerH + ch + 12;
  const colW = cw / cols;
  ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  ds.forEach((d, i) => {
    const x = pad + (i % cols) * colW;
    const y = legY + Math.floor(i / cols) * rowH + rowH / 2;
    if (d.showLine === false) {                 // TX-marker: ruit
      ctx.fillStyle = d.borderColor;
      const s = 6, cx = x + 15;
      ctx.beginPath();
      ctx.moveTo(cx, y - s); ctx.lineTo(cx + s, y); ctx.lineTo(cx, y + s); ctx.lineTo(cx - s, y);
      ctx.closePath(); ctx.fill();
    } else {
      ctx.strokeStyle = d.borderColor;
      ctx.lineWidth = Math.max(2.5, d.borderWidth);
      ctx.setLineDash(d.borderDash && d.borderDash.length ? d.borderDash : []);
      ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + 30, y); ctx.stroke();
      ctx.setLineDash([]);
    }
    ctx.fillStyle = '#1a2b40';
    ctx.font = '600 14px "DM Sans","Segoe UI",sans-serif';
    ctx.fillText(d.label, x + 38, y);
  });

  // Voet
  ctx.fillStyle = '#8899aa';
  ctx.font = '13px "DM Sans","Segoe UI",sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('© Ed Aldus / weerlab.nl — Modellen: Open-Meteo · MOSMIX: DWD · metingen: KNMI 10-minutenwaarnemingen', W / 2, H - footerH / 2);

  const link = document.createElement('a');
  link.download = `opers_multi_${huidigeParam}_${plaats.toLowerCase().replace(/\s+/g,'_')}_${ts}.png`;
  link.href = off.toDataURL('image/png', 1.0);
  link.click();
}

// ── Zoeken (Open-Meteo geocoding) ──────────────────────────────────────────
const zoek = document.getElementById('search');
const sugg = document.getElementById('suggest');
let sIdx = -1, sItems = [];
let debounce;

zoek.addEventListener('input', () => {
  clearTimeout(debounce);
  const q = zoek.value.trim();
  if (q.length < 2) { sugg.style.display = 'none'; return; }
  debounce = setTimeout(async () => {
    try {
      const j = await fetchJSON(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(q)}&count=6&language=nl`);
      sItems = j?.results || [];
      sIdx = -1;
      if (!sItems.length) { sugg.style.display = 'none'; return; }
      sugg.innerHTML = sItems.map((r,i) =>
        `<div data-i="${i}">${r.name} <small>${[r.admin1, r.country_code].filter(Boolean).join(', ')}</small></div>`).join('');
      sugg.querySelectorAll('div').forEach(d => d.onclick = () => kies(+d.dataset.i));
      sugg.style.display = 'block';
    } catch (e) { sugg.style.display = 'none'; }
  }, 250);
});

zoek.addEventListener('keydown', (e) => {
  const items = sugg.querySelectorAll('div');
  if (!items.length) return;
  if (e.key === 'ArrowDown') { sIdx = Math.min(sIdx+1, items.length-1); e.preventDefault(); }
  else if (e.key === 'ArrowUp') { sIdx = Math.max(sIdx-1, 0); e.preventDefault(); }
  else if (e.key === 'Enter') { kies(sIdx < 0 ? 0 : sIdx); return; }
  else return;
  items.forEach((d,i) => d.classList.toggle('active', i === sIdx));
});

document.addEventListener('click', (e) => {
  if (!e.target.closest('.search-wrap')) sugg.style.display = 'none';
});

function kies(i) {
  const r = sItems[i]; if (!r) return;
  sugg.style.display = 'none';
  zoek.value = r.name;
  laad(r.latitude, r.longitude, r.name);
}

// ── Quick-knoppen ──────────────────────────────────────────────────────────
const qbox = document.getElementById('quick');
QUICK.forEach(s => {
  const b = document.createElement('button');
  b.textContent = s.n;
  b.onclick = () => { zoek.value = ''; laad(s.lat, s.lon, s.n); };
  qbox.appendChild(b);
});

document.querySelectorAll('.param-btn').forEach(b => {
  b.addEventListener('click', () => toonParameter(b.dataset.param));
});

function startAutomatischVerversen() {
  if (verversTimer) clearInterval(verversTimer);
  verversTimer = setInterval(() => {
    if (huidigeLocatie) laad(huidigeLocatie.lat, huidigeLocatie.lon, huidigeLocatie.naam);
  }, VERVERS_MS);
}

document.addEventListener('visibilitychange', () => {
  if (document.visibilityState !== 'visible' || !huidigeLocatie || !laatsteOphaalTijd) return;
  if (Date.now() - laatsteOphaalTijd.getTime() >= VERVERS_MS) {
    laad(huidigeLocatie.lat, huidigeLocatie.lon, huidigeLocatie.naam);
  }
});

// ── Start: Rotterdam ─────────────────────────────────────────────────────────
laad(51.9225, 4.4792, 'Rotterdam');
startAutomatischVerversen();
