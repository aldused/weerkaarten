<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vlaggenweer - Ed Aldus WM</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,Arial,sans-serif;background:#eef3f8;color:#0f2744;min-height:100vh}
.header{background:#073b70;color:white;padding:12px 18px;display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:3px solid #2ec4e8}
.title{font-size:1rem;font-weight:800}
.sub{font-size:.75rem;color:#b9d7f3;margin-top:2px}
.actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:8px 12px;border-radius:7px;text-decoration:none;font-size:.8rem;font-weight:800;border:1px solid rgba(255,255,255,.25);color:white;background:#0d9488}
.btn.sec{background:rgba(255,255,255,.08)}
.wrap{max-width:1280px;margin:0 auto;padding:18px}
.preview{background:white;border:1px solid #cdd9e5;box-shadow:0 12px 30px rgba(15,39,68,.12);overflow:auto}
.preview img{display:block;width:100%;height:auto}
.note{font-size:.78rem;color:#52677d;margin-top:10px}
@media(max-width:700px){
  .header{align-items:flex-start;flex-direction:column}
  .actions{justify-content:flex-start}
  .wrap{padding:10px}
}
</style>
</head>
<body>
<script>
  if (window.self === window.top) {
    window.location.replace('index.html#weerbewaking');
  }
</script>
<div class="header">
  <div>
    <div class="title">Vlaggenweer</div>
    <div class="sub">Rotterdam · ochtend, middag en avond</div>
  </div>
  <div class="actions">
    <a class="btn" href="VLAGGENWEER.pdf" download>Download PDF</a>
    <a class="btn sec" href="VLAGGENWEER.docx" download>Bewerkbare DOCX</a>
    <a class="btn sec" href="weerbewaking.html">Terug</a>
  </div>
</div>
<main class="wrap">
  <div class="preview">
    <img src="VLAGGENWEER.png" alt="Vlaggenweer Rotterdam">
  </div>
  <div class="note">De preview toont de PDF-versie. Gebruik Bewerkbare DOCX om de waarden zelf in Word aan te passen.</div>
</main>
</body>
</html>
