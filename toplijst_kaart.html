<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Toplijst Kaart – Ed Aldus WM</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: Arial, sans-serif; background: #f0f4f8; color: #1a2b40; }
.header { background: #00205b; padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; border-bottom: 2px solid #2ec4e8; }
.header-titel { color: white; font-size: 14px; font-weight: 700; }
.header-sub { color: #a8c4e8; font-size: 11px; margin-top: 2px; }
.toolbar { background: white; padding: 10px 16px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; border-bottom: 1px solid #dde6f0; }
.btn-param, .btn-dag {
  padding: 5px 14px; border-radius: 16px; border: 1px solid #c5d3e3;
  background: #f0f4f8; color: #2a4a70; font-size: 12px; font-weight: 600;
  cursor: pointer; transition: all 0.12s;
}
.btn-param:hover, .btn-dag:hover { background: #dce9f7; }
.btn-param.actief { color: white; border-color: transparent; }
.btn-param.tx.actief { background: #c0392b; }
.btn-param.tn.actief { background: #2471a3; }
.btn-param.rr.actief { background: #1a7a4a; }
.btn-param.fx.actief { background: #6c3483; }
.btn-param.sq.actief { background: #e67e00; }
.btn-dag.actief { background: #003366; color: white; border-color: #003366; }
.btn-opslaan { padding: 5px 16px; border-radius: 16px; border: none; background: #003366; color: white; font-size: 12px; font-weight: 700; cursor: pointer; margin-left: auto; }
.btn-opslaan:hover { background: #0055aa; }
.kaart-wrap { display: flex; justify-content: center; padding: 16px; }
.kaart-container { position: relative; width: 100%; max-width: 560px; }
.kaart-container img { width: 100%; display: block; border-radius: 4px; }
.kaart-container svg {
  position: absolute; top: 0; left: 0; width: 100%; height: 100%;
  pointer-events: none;
}
.kaart-header-band {
  background: #003366; color: white;
  padding: 8px 14px; border-radius: 4px 4px 0 0;
  display: flex; justify-content: space-between; align-items: center;
  margin-bottom: 0;
}
.kaart-header-band .links { font-size: 13px; font-weight: 700; }
.kaart-header-band .sub { font-size: 10px; color: #a8c8e8; margin-top: 1px; }
.kaart-header-band .rechts { font-size: 13px; font-weight: 700; text-align: right; }
.kaart-header-band .rechts-sub { font-size: 10px; color: #a8c8e8; }
.legenda { display: flex; gap: 6px; flex-wrap: wrap; padding: 0 16px 16px; justify-content: center; }
.legenda-item { display: flex; align-items: center; gap: 4px; font-size: 11px; color: #5a7090; }
.legenda-blok { width: 14px; height: 14px; border-radius: 3px; border: 1px solid #ccc; }
.status { text-align: center; padding: 12px; font-size: 12px; color: #888; }
.zoom-hint { text-align:center; font-size:11px; color:#888; padding:4px 0 0; cursor:pointer; }
#lightbox { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.88); z-index:1000; justify-content:center; align-items:center; }
#lightbox.actief { display:flex; }
#lightbox img { max-width:95vw; max-height:95vh; border-radius:6px; }
#lightbox-sluit { position:fixed; top:16px; right:22px; font-size:2em; color:white; cursor:pointer; }
</style>
</head>
<body>

<div class="header">
  <div>
    <div class="header-titel">Ed Aldus WM — Toplijst Kaart</div>
    <div class="header-sub">KNMI waarnemingen · <span id="hdr-datum">laden...</span></div>
  </div>
  <div id="hdr-update" style="font-size:11px;color:#a8c4e8;"></div>
</div>

<div class="toolbar">
  <div style="display:flex;gap:4px;" id="param-btns">
    <button class="btn-param tx actief" data-param="max">🌡 TX Max</button>
    <button class="btn-param tn" data-param="min">❄ TN Min</button>
    <button class="btn-param rr" data-param="rr">🌧 Neerslag</button>
    <button class="btn-param fx" data-param="fx">💨 Windstoot</button>
    <button class="btn-param sq" data-param="sq">☀ Zon</button>
  </div>
  <div style="display:flex;gap:4px;" id="dag-btns">
    <button class="btn-dag actief" data-dag="vandaag">Vandaag</button>
    <button class="btn-dag" data-dag="gisteren">Gisteren</button>
  </div>
  <button class="btn-opslaan" onclick="slaOp()">⬇ Opslaan PNG</button>
</div>

<div class="kaart-wrap">
  <div style="width:100%;max-width:560px;">
    <div class="kaart-header-band" id="kaart-header">
      <div>
        <div class="links">Ed Aldus WM</div>
        <div class="sub">Waarnemingen KNMI</div>
      </div>
      <div style="text-align:right;">
        <div class="rechts" id="kaart-dag-label">–</div>
        <div class="rechts-sub" id="kaart-subtitel">Maximum temperatuur (°C)</div>
      </div>
    </div>
    <div class="kaart-container" onclick="openZoom()" style="cursor:zoom-in;">
      <img src="kaart_basis_nl.png" id="kaart-basis" alt="Basiskaart Nederland">
      <svg id="nl-kaart" viewBox="0 0 800 1100" xmlns="http://www.w3.org/2000/svg"></svg>
    </div>

    <div class="zoom-hint" onclick="openZoom()">🔍 klik voor vergroting</div>
  </div>
</div>

<div id="lightbox" onclick="sluitZoom()">
  <span id="lightbox-sluit" onclick="sluitZoom()">✕</span>
  <img id="lightbox-img" src="" alt="">
</div>

<div class="legenda" id="legenda"></div>
<div class="status" id="status">Laden...</div>

<script>
const LON_MIN=3.3, LON_MAX=7.4, LAT_MIN=50.45, LAT_MAX=53.8;
const SVG_W=800, SVG_H=1100;
function lonToX(lon) { return (lon - LON_MIN) / (LON_MAX - LON_MIN) * SVG_W; }
function latToY(lat) { return (1 - (lat - LAT_MIN) / (LAT_MAX - LAT_MIN)) * SVG_H; }

const COORDS = {
  "Voorschoten":[4.447,52.125],"IJmuiden":[4.555,52.458],"Texelhors":[4.862,52.982],
  "Den Helder":[4.789,52.928],"Schiphol":[4.781,52.309],"Vlieland":[4.920,53.250],
  "Wijdenes":[5.166,52.632],"Berkhout":[4.979,52.644],"Terschelling":[5.350,53.392],
  "Wijk aan Zee":[4.601,52.504],"Houtribdijk":[5.385,52.649],"De Bilt":[5.178,52.101],
  "Soesterberg":[5.276,52.128],"Stavoren":[5.362,52.882],"Lelystad":[5.521,52.458],
  "Leeuwarden":[5.774,53.224],"Marknesse":[5.888,52.703],"Deelen":[5.885,52.060],
  "Lauwersoog":[6.201,53.413],"Heino":[6.261,52.439],"Hoogeveen":[6.520,52.730],
  "Eelde":[6.586,53.123],"Hupsel":[6.657,52.069],"Nieuw Beerta":[7.150,53.197],
  "Twenthe":[6.889,52.275],"Vlissingen":[3.596,51.442],"Westdorpe":[3.861,51.226],
  "Wilhelminadorp":[3.884,51.527],"Stavenisse":[4.001,51.594],"Hoek van Holland":[4.131,51.978],
  "Tholen":[4.219,51.531],"Woensdrecht":[4.342,51.449],"Rotterdam Geulhaven":[4.320,51.893],
  "Rotterdam Airport":[4.437,51.957],"Cabauw":[4.926,51.971],"Gilze-Rijen":[4.931,51.567],
  "Herwijnen":[5.146,51.859],"Eindhoven":[5.377,51.451],"Volkel":[5.707,51.657],
  "Ell":[5.763,51.198],"Maastricht":[5.770,50.911],"Arcen":[6.196,51.500],"Horst":[6.029,51.449],
};

const PARAMS = {
  max: { label:"Maximum temperatuur (°C)", eenheid:"°", decimalen:1,
    kleuren:[["#084594","≤0°"],["#4292c6","5°"],["#9ecae1","10°"],["#ffffcc","15°"],["#fed976","20°"],["#fd8d3c","25°"],["#800026","30°+"]],
    schaal:[-5,30] },
  min: { label:"Minimum temperatuur (°C)", eenheid:"°", decimalen:1,
    kleuren:[["#1a3a6b","≤-10°"],["#2980b9","-5°"],["#a8d8ea","0°"],["#ffffcc","5°"],["#fed976","10°"],["#fd8d3c","15°+"]],
    schaal:[-15,20] },
  rr: { label:"Neerslag (mm)", eenheid:" mm", decimalen:1,
    kleuren:[["#c6dbef","0.1"],["#6baed6","5"],["#2171b5","15"],["#084594","30+"]],
    schaal:[0,30] },
  fx: { label:"Max windstoot (km/h)", eenheid:" km/h", decimalen:0,
    kleuren:[["#d4b896","<50"],["#b5835a","60"],["#8b5e3c","70"],["#6b3a1f","80"],["#3d1a08","90+"]],
    schaal:[0,40] },
  sq: { label:"Zonneschijn (uur)", eenheid:" u", decimalen:1,
    kleuren:[["#fffacd","1u"],["#ffe066","4u"],["#ffa500","8u"],["#ff6600","12u+"]],
    schaal:[0,12] },
};

function hexToRgb(hex) {
  return [parseInt(hex.slice(1,3),16),parseInt(hex.slice(3,5),16),parseInt(hex.slice(5,7),16)];
}
function interpKleur(val, schaal, stops) {
  const t = Math.max(0,Math.min(1,(val-schaal[0])/(schaal[1]-schaal[0])));
  const colors = stops.map(s=>hexToRgb(s[0]));
  const idx = Math.min(colors.length-2, Math.floor(t*(colors.length-1)));
  const f = t*(colors.length-1)-idx;
  const a=colors[idx],b=colors[idx+1];
  const r=Math.round(a[0]+f*(b[0]-a[0])), g=Math.round(a[1]+f*(b[1]-a[1])), bl=Math.round(a[2]+f*(b[2]-a[2]));
  const lum=(0.299*r+0.587*g+0.114*bl)/255;
  return [`rgb(${r},${g},${bl})`, lum<0.55?"white":"#222"];
}

function ns(tag) { return document.createElementNS("http://www.w3.org/2000/svg",tag); }

function tekenKaart(dagData, param) {
  const svg = document.getElementById("nl-kaart");
  svg.innerHTML = "";
  const p = PARAMS[param];
  const rijen = dagData[param] || [];

  rijen.forEach(item => {
    const naam = item[1];
    if (!COORDS[naam]) return;
    const val = item[0];

    const tijdstip = item[2] || null;
    const [lon,lat] = COORDS[naam];
    const cx = lonToX(lon), cy = latToY(lat);
    const [bg,fg] = interpKleur(val, p.schaal, p.kleuren);
    let tekst;
    if (param === "fx") tekst = (val*3.6).toFixed(0);
    else tekst = val.toFixed(p.decimalen);

    const g = ns("g");
    const r = 22;
    const circle = ns("circle");
    circle.setAttribute("cx", cx); circle.setAttribute("cy", cy);
    circle.setAttribute("r", r);
    circle.setAttribute("fill", bg);
    circle.setAttribute("stroke", "white");
    circle.setAttribute("stroke-width", "1.5");
    g.appendChild(circle);

    const text = ns("text");
    text.setAttribute("x", cx);
    text.setAttribute("y", tijdstip ? cy - 3 : cy + 4);
    text.setAttribute("text-anchor", "middle");
    text.setAttribute("font-size", "12");
    text.setAttribute("font-weight", "bold");
    text.setAttribute("font-family", "Arial,sans-serif");
    text.setAttribute("fill", fg);
    text.textContent = tekst;
    g.appendChild(text);

    if (tijdstip) {
      const tr = ns("rect");
      tr.setAttribute("x", cx-20); tr.setAttribute("y", cy+6);
      tr.setAttribute("width", 40); tr.setAttribute("height", 13);
      tr.setAttribute("rx", 3); tr.setAttribute("fill", "white");
      tr.setAttribute("stroke", "#ccc"); tr.setAttribute("stroke-width", "0.8");
      g.appendChild(tr);
      const tt = ns("text");
      tt.setAttribute("x", cx); tt.setAttribute("y", cy+15);
      tt.setAttribute("text-anchor", "middle");
      tt.setAttribute("font-size", "9");
      tt.setAttribute("font-family", "Arial,sans-serif");
      tt.setAttribute("fill", "#444");
      tt.textContent = tijdstip;
      g.appendChild(tt);
    }
    svg.appendChild(g);
  });

  // Copyright binnenin kaart
  const cr = ns("text");
  cr.setAttribute("x", SVG_W - 10);
  cr.setAttribute("y", SVG_H - 12);
  cr.setAttribute("text-anchor", "end");
  cr.setAttribute("font-size", "18");
  cr.setAttribute("font-family", "Arial,sans-serif");
  cr.setAttribute("font-style", "italic");
  cr.setAttribute("fill", "#888888");
  cr.textContent = "© Ed Aldus / KNMI";
  svg.appendChild(cr);
}

function maakLegenda(param) {
  const p = PARAMS[param];
  document.getElementById("legenda").innerHTML = p.kleuren.map(([k,l]) =>
    `<div class="legenda-item"><div class="legenda-blok" style="background:${k}"></div>${l}</div>`
  ).join("");
}

const NL_DAGEN = ["Zondag","Maandag","Dinsdag","Woensdag","Donderdag","Vrijdag","Zaterdag"];
const NL_MND = ["","jan","feb","mrt","apr","mei","jun","jul","aug","sep","okt","nov","dec"];
function dagLabel(d) { return `${NL_DAGEN[d.getDay()]} ${d.getDate()} ${NL_MND[d.getMonth()+1]}`; }

let dagData = {}, huidigParam = "max", huidigDag = "vandaag";

function huidigDatum() {
  const d = new Date(); d.setHours(12,0,0,0);
  if (huidigDag === "gisteren") d.setDate(d.getDate()-1);
  return d;
}

function update() {
  const d = huidigDatum();
  const key = d.toISOString().slice(0,10);
  const dd = dagData[key];
  if (!dd) { document.getElementById("status").textContent = `Geen data voor ${key}`; return; }
  document.getElementById("status").textContent = "";
  const lbl = dagLabel(d);
  document.getElementById("hdr-datum").textContent = lbl;
  document.getElementById("kaart-dag-label").textContent = lbl;
  document.getElementById("kaart-subtitel").textContent = PARAMS[huidigParam].label;
  tekenKaart(dd, huidigParam);
  maakLegenda(huidigParam);
}

function slaOp() {
  const img = document.getElementById("kaart-basis");
  const svg = document.getElementById("nl-kaart");
  const header = document.getElementById("kaart-header");
  const canvas = document.createElement("canvas");
  const scale = 2;
  canvas.width = img.naturalWidth * scale;
  canvas.height = (img.naturalHeight + header.offsetHeight) * scale;
  const ctx = canvas.getContext("2d");
  ctx.scale(scale, scale);
  tekenHeader(ctx, img.naturalWidth, header.offsetHeight);
  // Kaart
  ctx.drawImage(img,0,header.offsetHeight);
  // SVG overlay
  const serializer = new XMLSerializer();
  const svgStr = serializer.serializeToString(svg);
  const blob = new Blob([svgStr],{type:"image/svg+xml"});
  const url = URL.createObjectURL(blob);
  const svgImg = new Image();
  svgImg.onload = () => {
    ctx.drawImage(svgImg,0,header.offsetHeight,img.naturalWidth,img.naturalHeight);
    URL.revokeObjectURL(url);
    const a = document.createElement("a");
    a.href = canvas.toDataURL("image/png");
    a.download = `edaldus_topkaart_${huidigParam}_${huidigDag}.png`;
    a.click();
  };
  svgImg.src = url;
}

function openZoom() {
  // Render kaart naar canvas en toon in lightbox
  const img = document.getElementById("kaart-basis");
  const svg = document.getElementById("nl-kaart");
  const header = document.getElementById("kaart-header");
  const canvas = document.createElement("canvas");
  const scale = 2;
  canvas.width = img.naturalWidth * scale;
  canvas.height = (img.naturalHeight + header.offsetHeight) * scale;
  const ctx = canvas.getContext("2d");
  ctx.scale(scale, scale);
  tekenHeader(ctx, img.naturalWidth, header.offsetHeight);
  ctx.drawImage(img, 0, header.offsetHeight);
  const serializer = new XMLSerializer();
  const svgStr = serializer.serializeToString(svg);
  const blob = new Blob([svgStr],{type:"image/svg+xml"});
  const url = URL.createObjectURL(blob);
  const svgImg = new Image();
  svgImg.onload = () => {
    ctx.drawImage(svgImg, 0, header.offsetHeight, img.naturalWidth, img.naturalHeight);
    URL.revokeObjectURL(url);
    document.getElementById("lightbox-img").src = canvas.toDataURL("image/png");
    document.getElementById("lightbox").classList.add("actief");
  };
  svgImg.src = url;
}
function sluitZoom() { document.getElementById("lightbox").classList.remove("actief"); }
document.addEventListener("keydown", e => { if(e.key==="Escape") sluitZoom(); });

function tekenHeader(ctx, breedte, hoogte) {
  ctx.fillStyle = "#003366";
  ctx.fillRect(0, 0, breedte, hoogte);
  ctx.fillStyle = "#4a90c4";
  ctx.fillRect(0, hoogte-2, breedte, 2);
  ctx.fillStyle = "white"; ctx.font = "bold 14px Arial"; ctx.textAlign = "left";
  ctx.fillText("Ed Aldus WM", 14, 20);
  ctx.fillStyle = "#a8c8e8"; ctx.font = "10px Arial";
  ctx.fillText("Waarnemingen KNMI", 14, 34);
  ctx.fillStyle = "white"; ctx.font = "bold 14px Arial"; ctx.textAlign = "right";
  ctx.fillText(document.getElementById("kaart-dag-label").textContent, breedte-14, 20);
  ctx.fillStyle = "#a8c8e8"; ctx.font = "10px Arial";
  ctx.fillText(document.getElementById("kaart-subtitel").textContent, breedte-14, 34);
  ctx.textAlign = "left";
}

document.getElementById("param-btns").addEventListener("click", e => {
  const btn = e.target.closest(".btn-param"); if (!btn) return;
  huidigParam = btn.dataset.param;
  document.querySelectorAll(".btn-param").forEach(b=>b.classList.remove("actief"));
  btn.classList.add("actief"); update();
});
document.getElementById("dag-btns").addEventListener("click", e => {
  const btn = e.target.closest(".btn-dag"); if (!btn) return;
  huidigDag = btn.dataset.dag;
  document.querySelectorAll(".btn-dag").forEach(b=>b.classList.remove("actief"));
  btn.classList.add("actief"); update();
});

const imgEl = document.getElementById("kaart-basis");
function startLaad() {
  fetch("toplijst.json?t="+Date.now()).then(r=>r.json()).then(data=>{
    dagData = data;
    const laatste = Object.keys(data).sort().reverse()[0];
    if (laatste) document.getElementById("hdr-update").textContent = `Bijgewerkt: ${data[laatste].update||laatste}`;
    document.getElementById("status").textContent = "";
    update();
  }).catch(e=>document.getElementById("status").textContent="Kon toplijst.json niet laden: "+e.message);
}
if (imgEl.complete) startLaad();
else imgEl.onload = startLaad;
</script>
</body>
</html>
