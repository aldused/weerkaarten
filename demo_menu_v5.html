<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Weerlab · voorstel index-indeling (demo v5)</title>
<link rel="stylesheet" href="weerlab_design_tokens.css">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'DM Sans',Arial,sans-serif;background:var(--wl-color-background);color:var(--wl-color-text);display:flex;flex-direction:column}

/* ── demo-balk (zit NIET in het echte ontwerp) ── */
.demobar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:7px 14px;background:#111c33;color:#cfe0f5;font-size:12px;border-bottom:2px solid #2ec4e8}
.demobar strong{color:#fff}
.demobar .schakel{display:flex;gap:2px;background:rgba(255,255,255,.08);border-radius:7px;padding:2px}
.demobar .schakel button{border:0;background:transparent;color:#9fb6d4;font:600 12px 'DM Sans';padding:4px 12px;border-radius:5px;cursor:pointer}
.demobar .schakel button.aan{background:#2ec4e8;color:#05283d}

.wrap{display:flex;flex:1;min-height:0}

/* ── SIDEBAR ── */
.sidebar{width:238px;min-width:238px;background:#00205b;color:#fff;display:flex;flex-direction:column;overflow-y:auto;height:calc(100vh - 36px)}
.merkblok{padding:13px 14px 11px;border-bottom:1px solid rgba(255,255,255,.1)}
.merk{font:800 15px 'DM Sans';letter-spacing:-.01em}
.merk span{color:#2ec4e8}
.merksub{font-size:10.5px;color:#8fb0d8;margin-top:2px}
.zoek{margin:10px 12px 6px;display:flex;align-items:center;gap:7px;background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.14);border-radius:8px;padding:7px 9px}
.zoek input{flex:1;background:transparent;border:0;color:#fff;font:500 12.5px 'DM Sans';outline:none}
.zoek input::placeholder{color:#7f9dc4}
.zoek .kbd{font-size:10px;color:#7f9dc4;border:1px solid rgba(255,255,255,.2);border-radius:4px;padding:0 4px}

.ws-nav{display:flex;gap:9px;align-items:center;margin:6px 10px;padding:8px 10px;border-radius:8px;background:rgba(16,185,129,.14);border:1px solid rgba(16,185,129,.32);cursor:pointer}
.ws-dot{width:9px;height:9px;border-radius:50%;background:#10b981;flex:none}
.ws-nav b{font-size:12px}
.ws-nav small{display:block;font-size:10.5px;color:#9fc7bb}

.rub{border-top:1px solid rgba(255,255,255,.07)}
.rub-kop{width:100%;display:flex;align-items:center;gap:8px;padding:9px 13px;background:none;border:0;color:#dbe8f8;font:700 11.5px 'DM Sans';text-transform:uppercase;letter-spacing:.06em;cursor:pointer;text-align:left}
.rub-kop .ico{font-size:13px;width:16px;text-align:center}
.rub-kop .tel{margin-left:auto;font-size:10px;font-weight:600;color:#6f90bd;background:rgba(255,255,255,.07);border-radius:9px;padding:1px 7px;letter-spacing:0}
.rub-kop .chev{color:#6f90bd;font-size:10px;transition:transform .15s}
.rub.dicht .chev{transform:rotate(-90deg)}
.rub.dicht .rub-body{display:none}
.rub-body{padding-bottom:6px}
.subkop{padding:7px 14px 3px;font:700 9.5px 'DM Sans';text-transform:uppercase;letter-spacing:.1em;color:#4a6f9a}
.item{display:flex;align-items:center;gap:7px;padding:6px 13px 6px 26px;font:500 12.5px 'DM Sans';color:#c7d8ee;cursor:pointer;border-left:3px solid transparent}
.item:hover{background:rgba(255,255,255,.07);color:#fff}
.item.aan{background:rgba(46,196,232,.16);border-left-color:#2ec4e8;color:#fff;font-weight:700}
.item .badge{margin-left:auto;font:600 9.5px 'DM Sans';color:#8fb0d8;background:rgba(255,255,255,.09);border-radius:9px;padding:1px 6px}
.item .uit{margin-left:auto;color:#6f90bd;font-size:10px}
.subitems{display:none;padding:2px 0 4px}
.item-groep.open .subitems{display:block}
.item-groep.open>.item .uit{transform:rotate(90deg);display:inline-block}
.subitem{padding:5px 13px 5px 40px;font:500 12px 'DM Sans';color:#9ab6d8;cursor:pointer;border-left:3px solid transparent}
.subitem:hover{background:rgba(255,255,255,.06);color:#fff}
.subitem.aan{color:#fff;border-left-color:#2ec4e8;background:rgba(46,196,232,.1)}
.sb-voet{margin-top:auto;padding:8px 10px 14px}
.sb-voet .item{border-radius:7px;padding-left:13px}

/* ── HOOFD ── */
.hoofd{flex:1;overflow-y:auto;height:calc(100vh - 36px)}
.topbar{position:sticky;top:0;z-index:5;background:var(--wl-color-surface);border-bottom:1px solid var(--wl-color-border);padding:10px 22px;display:flex;align-items:center;gap:14px}
.kruimel{font-size:12px;color:var(--wl-color-text-muted);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.kruimel a{color:var(--wl-color-accent-strong);text-decoration:none;cursor:pointer;font-weight:600}
.kruimel a:hover{text-decoration:underline}
.kruimel .nu{color:var(--wl-color-text);font-weight:700}
.topbar h1{font:800 17px 'DM Sans';letter-spacing:-.01em}
.topbar .rechts{margin-left:auto;display:flex;gap:8px}
.topbtn{font:600 11.5px 'DM Sans';border:1px solid var(--wl-color-border-strong);background:var(--wl-color-surface);color:var(--wl-color-text-muted);border-radius:7px;padding:5px 10px;cursor:pointer}

.paneel{padding:20px 22px 40px;max-width:1240px}
.stub{border:2px dashed var(--wl-color-border-strong);border-radius:14px;padding:46px 20px;text-align:center;color:var(--wl-color-text-muted);background:var(--wl-color-surface-muted)}
.stub b{display:block;font-size:16px;color:var(--wl-color-text);margin-bottom:4px}

/* ── HOME ── */
.hero{background:linear-gradient(120deg,#00205b,#0b3a8a 60%,#035e7a);border-radius:16px;padding:20px 22px;color:#fff;display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.hero h2{font:800 21px 'DM Sans';letter-spacing:-.02em}
.hero p{font-size:13px;color:#bcd6f2;margin-top:4px;max-width:520px}
.hero .status{margin-left:auto;display:flex;align-items:center;gap:9px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);border-radius:11px;padding:10px 14px;cursor:pointer}
.hero .status b{font-size:12.5px}
.hero .status small{display:block;font-size:11px;color:#bcd6f2}

.snelrij{display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));gap:10px;margin-top:14px}
.snel{background:var(--wl-color-surface);border:1px solid var(--wl-color-border);border-radius:12px;padding:12px 13px;text-align:left;cursor:pointer;display:flex;gap:10px;align-items:center;font-family:inherit}
.snel:hover{border-color:var(--wl-color-accent);box-shadow:0 3px 12px rgba(0,32,91,.08)}
.snel .ic{font-size:19px}
.snel b{display:block;font:700 13px 'DM Sans';color:var(--wl-color-text)}
.snel small{font-size:11px;color:var(--wl-color-text-muted)}

.blokkop{margin:26px 0 10px;display:flex;align-items:baseline;gap:10px}
.blokkop h3{font:800 15px 'DM Sans'}
.blokkop span{font-size:12px;color:var(--wl-color-text-muted)}

.catalogus{display:grid;grid-template-columns:repeat(auto-fit,minmax(268px,1fr));gap:14px}
.cat{background:var(--wl-color-surface);border:1px solid var(--wl-color-border);border-radius:14px;padding:14px 15px 12px}
.cat-kop{display:flex;align-items:center;gap:9px;padding-bottom:9px;border-bottom:1px solid var(--wl-color-border);margin-bottom:9px}
.cat-kop .ico{font-size:17px}
.cat-kop b{font:800 13.5px 'DM Sans'}
.cat-kop small{display:block;font-size:11px;color:var(--wl-color-text-muted);font-weight:500}
.cat-sub{font:700 9.5px 'DM Sans';text-transform:uppercase;letter-spacing:.09em;color:var(--wl-color-text-soft);margin:9px 0 4px}
.cat-sub:first-child{margin-top:0}
.cat a{display:flex;align-items:center;gap:7px;padding:4px 6px;margin:0 -6px;border-radius:7px;font-size:12.5px;color:var(--wl-color-text);text-decoration:none;cursor:pointer}
.cat a:hover{background:var(--wl-color-primary-soft);color:var(--wl-color-accent-strong)}
.cat a .n{margin-left:auto;font-size:10px;color:var(--wl-color-text-soft);background:var(--wl-color-background-soft);border-radius:8px;padding:1px 6px}

.note{margin-top:26px;background:#fff8e5;border:1px solid #f0d48a;border-radius:12px;padding:13px 15px;font-size:12.5px;color:#5c4708;line-height:1.55}
.note b{display:block;margin-bottom:4px}
.note li{margin-left:16px}

@media(max-width:820px){.sidebar{display:none}.paneel{padding:14px}}
</style>
</head>
<body>

<div class="demobar">
  <strong>DEMO v5</strong>
  <span>voorstel nieuwe index-indeling · voorbeelddata, niets is live gekoppeld</span>
  <span class="schakel" id="schakel">
    <button class="aan" data-mode="nieuw">Nieuwe indeling</button>
    <button data-mode="huidig">Huidige indeling</button>
  </span>
  <span id="modeinfo" style="color:#8fb0d8"></span>
</div>

<div class="wrap">
  <nav class="sidebar" id="sidebar"></nav>
  <main class="hoofd">
    <div class="topbar">
      <div>
        <div class="kruimel" id="kruimel"></div>
        <h1 id="titel">Overzicht</h1>
      </div>
      <div class="rechts">
        <button class="topbtn">☆ Favoriet</button>
        <button class="topbtn">↗ Nieuw tabblad</button>
      </div>
    </div>
    <div class="paneel" id="paneel"></div>
  </main>
</div>

<script>
/* ══════════════════════════════════════════════════════════════
   PRODUCTCATALOGUS — één bron voor sidebar, home én zoeken.
   sub[] = subproducten die nu alleen ná een klik zichtbaar zijn.
   ══════════════════════════════════════════════════════════════ */
const P = {
  radar:      {label:"Neerslagradar", hint:"buien live"},
  nowcast:    {label:"Nowcast 15-min", hint:"komende 2 uur"},
  bliksem:    {label:"Bliksem Benelux", hint:"ontladingen"},
  satelliet:  {label:"Satellietbeelden HD", hint:"MTG"},
  waarnemingen:{label:"Waarnemingen", sub:["Nederland","Europa"]},
  toplijst:   {label:"Toplijst & kaarten", sub:["Lijst","Kaarten"]},
  synop:      {label:"Synoptisch"},
  hittekracht:{label:"Hittekracht", badge:"KNMI-app"},
  kust:       {label:"Kustdistricten"},
  zeetemp:    {label:"Zeewatertemperatuur"},
  rijn:       {label:"Rijnafvoer Lobith"},

  weerkaarten:{label:"Weerkaarten", sub:["Significant kaart","Hoge resolutie modellen","Wolkenverdeling","Convectietemperatuur","Hoge resolutie 4-luik","Significant 4-luik","ECMWF HRES 10-daags","ECMWF 9 panel","ECMWF Fronten 10 dagen","ECMWF Clusters"]},
  mosmix:     {label:"MOS/MIX 10 dagen", sub:["Overzicht","9-daagse kaarten","Per parameter","Trend per station","Verificatie","Multi Europe"]},
  pluim:      {label:"Pluimen", sub:["Pluim viewer","Ensemble 6 pluim","Ensemble 6 pluim+","Pluim-trend"]},
  pascal:     {label:"PASCAL Extreem Weer"},
  verwachting:{label:"KNMI weersverwachting"},
  modellen:   {label:"Modellenbespreking", badge:"4×/dag"},
  guidance:   {label:"Guidance KNMI/DWD"},

  maandbeeld: {label:"Maandbeeld Nederland"},
  maandstand: {label:"Maandstanden per station"},
  zomerstat:  {label:"Zomerstatistieken 2026"},
  droogte:    {label:"Droogtemonitor"},
  p13:        {label:"P13 Neerslag"},
  neerslag668:{label:"KNMI Neerslagstations"},
  archief:    {label:"Archief waarnemingen"},

  hittegolven:{label:"Hittegolven"},
  records:    {label:"Weerrecords"},
  dagrecords: {label:"Dagrecords", sub:["6 dagen","Per jaar"]},
  extremen:   {label:"Extremenzoeker"},
  eerstelaatste:{label:"Eerste & Laatste"},
  feestdagen: {label:"Feestdagen Weer"},
  normalen:   {label:"Klimaatnormalen"},

  skewt:      {label:"Skew-T sounding"},
  metar:      {label:"METAR / TAF"},
  weerbewaking:{label:"Weerbewaking", badge:"🔒"},
  beta:       {label:"Beta tools", badge:"BETA"}
};

/* ── NIEUW: 5 rubrieken op tijd/vraag, overal dezelfde woorden ── */
const NIEUW = [
  {id:"nu", ico:"◉", titel:"Nu", onder:"Wat gebeurt er op dit moment",
   delen:[{kop:"Beeld", items:["radar","nowcast","bliksem","satelliet"]},
          {kop:"Metingen", items:["waarnemingen","toplijst","synop","hittekracht"]},
          {kop:"Water & kust", items:["kust","zeetemp","rijn"]}]},
  {id:"komend", ico:"→", titel:"Komende dagen", onder:"Verwachting, modellen en teksten",
   delen:[{kop:"Kaarten & modellen", items:["weerkaarten","mosmix","pluim","pascal"]},
          {kop:"Teksten", items:["verwachting","modellen","guidance"]}]},
  {id:"terug", ico:"↺", titel:"Terugkijken", onder:"Deze maand, dit seizoen, archief",
   delen:[{kop:"Maand & seizoen", items:["maandbeeld","maandstand","zomerstat"]},
          {kop:"Neerslag & droogte", items:["droogte","p13","neerslag668"]},
          {kop:"Archief", items:["archief"]}]},
  {id:"klimaat", ico:"▲", titel:"Records & klimaat", onder:"Extremen en langjarige reeksen",
   delen:[{kop:"", items:["hittegolven","records","dagrecords","extremen","eerstelaatste","feestdagen","normalen"]}]},
  {id:"vak", ico:"⚙", titel:"Vakmatig", onder:"Luchtvaart, analyse, bewaking",
   delen:[{kop:"", items:["skewt","metar","weerbewaking","beta"]}]}
];

/* ── HUIDIG: zoals index.html nu is (ter vergelijking) ── */
const HUIDIG = [
  {id:"h1", ico:"·", titel:"Verwachting & modellen", onder:"",
   delen:[{kop:"", items:["weerkaarten","mosmix","pluim","pascal"]}]},
  {id:"h2", ico:"·", titel:"Nu & metingen", onder:"",
   delen:[{kop:"", items:["hittekracht"]},{kop:"Beeld", items:["radar","nowcast","bliksem","satelliet"]},
          {kop:"Metingen", items:["waarnemingen","toplijst","synop"]},
          {kop:"Zee & kust", items:["kust","zeetemp"]}]},
  {id:"h3", ico:"·", titel:"Weerdiensten & vakinfo", onder:"",
   delen:[{kop:"", items:["verwachting","modellen","guidance","skewt","metar"]}]},
  {id:"h4", ico:"·", titel:"Seizoen & maand", onder:"",
   delen:[{kop:"", items:["maandbeeld","maandstand","zomerstat"]}]},
  {id:"h5", ico:"·", titel:"Klimaat & historie", onder:"",
   delen:[{kop:"Hitte & records", items:["hittegolven","records","dagrecords","extremen","eerstelaatste"]},
          {kop:"Neerslag & droogte", items:["p13","droogte","neerslag668","rijn"]},
          {kop:"Archief & klimaat", items:["archief","feestdagen","normalen"]}]}
];

let MODE = "nieuw";
let ACTIEF = {rub:null, prod:null, sub:null};
const RUBS = () => MODE === "nieuw" ? NIEUW : HUIDIG;

/* ── sidebar opbouwen ── */
function bouwSidebar(){
  const s = document.getElementById("sidebar");
  s.innerHTML = `
    <div class="merkblok">
      <div class="merk">Weerlab<span>.nl</span></div>
      <div class="merksub">Ed Aldus · weerdata & visualisaties</div>
    </div>
    <div class="zoek"><span>🔍</span><input placeholder="Zoek product of onderwerp…"><span class="kbd">/</span></div>
    <div class="ws-nav"><span class="ws-dot"></span><span><b>KNMI Waarschuwingen</b><small>code groen · geen waarschuwing</small></span></div>
    <div class="item" style="padding-left:13px" onclick="openHome()"><span>⌂</span><span>Overzicht</span><span class="badge">start</span></div>
  `;
  RUBS().forEach(r => {
    const rub = document.createElement("div");
    rub.className = "rub" + (ACTIEF.rub === r.id ? "" : " dicht");
    const aantal = r.delen.reduce((n,d) => n + d.items.reduce((m,k) => m + 1 + (P[k].sub?P[k].sub.length:0), 0), 0);
    rub.innerHTML = `<button class="rub-kop"><span class="ico">${r.ico}</span>${r.titel}
       <span class="tel">${aantal}</span><span class="chev">▾</span></button><div class="rub-body"></div>`;
    rub.querySelector(".rub-kop").onclick = () => { rub.classList.toggle("dicht"); };
    const body = rub.querySelector(".rub-body");
    r.delen.forEach(d => {
      if (d.kop) { const k = document.createElement("div"); k.className = "subkop"; k.textContent = d.kop; body.appendChild(k); }
      d.items.forEach(key => body.appendChild(navItem(r, key)));
    });
    s.appendChild(rub);
  });
  const voet = document.createElement("div");
  voet.className = "sb-voet";
  voet.innerHTML = `<div class="item">⎋ <span>Uitloggen</span></div>`;
  s.appendChild(voet);
}

function navItem(r, key){
  const p = P[key];
  const heeftSub = MODE === "nieuw" && p.sub;
  const wrap = document.createElement("div");
  wrap.className = "item-groep" + (ACTIEF.prod === key && heeftSub ? " open" : "");
  const el = document.createElement("div");
  el.className = "item" + (ACTIEF.prod === key ? " aan" : "");
  el.innerHTML = `<span>${p.label}</span>` +
    (heeftSub ? `<span class="uit">▶</span>` :
     p.badge ? `<span class="badge">${p.badge}</span>` :
     p.sub ? `<span class="badge">${p.sub.length}</span>` : "");
  el.onclick = (e) => {
    if (heeftSub) { wrap.classList.toggle("open"); }
    toonProduct(r.id, key, p.sub ? p.sub[0] : null);
    e.stopPropagation();
  };
  wrap.appendChild(el);
  if (heeftSub) {
    const box = document.createElement("div");
    box.className = "subitems";
    p.sub.forEach(sn => {
      const si = document.createElement("div");
      si.className = "subitem" + (ACTIEF.prod === key && ACTIEF.sub === sn ? " aan" : "");
      si.textContent = sn;
      si.onclick = (e) => { toonProduct(r.id, key, sn); e.stopPropagation(); };
      box.appendChild(si);
    });
    wrap.appendChild(box);
  }
  return wrap;
}

/* ── panelen ── */
function toonProduct(rubId, key, sub){
  ACTIEF = {rub:rubId, prod:key, sub:sub||null};
  const r = RUBS().find(x => x.id === rubId), p = P[key];
  document.getElementById("titel").textContent = p.label + (sub ? " · " + sub : "");
  document.getElementById("kruimel").innerHTML =
    `<a onclick="openHome()">Overzicht</a> ›
     <a onclick="openRubriek('${rubId}')">${r.titel}</a> ›
     ${sub ? `<a onclick="toonProduct('${rubId}','${key}',null)">${p.label}</a> › <span class="nu">${sub}</span>`
           : `<span class="nu">${p.label}</span>`}`;
  document.getElementById("paneel").innerHTML =
    `<div class="stub"><b>${p.label}${sub ? " — " + sub : ""}</b>
      Hier staat in de echte site het product (iframe/canvas).<br>
      Deze demo laat alleen de <em>indeling</em> zien.</div>`;
  bouwSidebar();
  window.scrollTo(0,0);
}

function openRubriek(rubId){
  const r = RUBS().find(x => x.id === rubId);
  ACTIEF = {rub:rubId, prod:null, sub:null};
  document.getElementById("titel").textContent = r.titel;
  document.getElementById("kruimel").innerHTML =
    `<a onclick="openHome()">Overzicht</a> › <span class="nu">${r.titel}</span>`;
  document.getElementById("paneel").innerHTML =
    `<div class="blokkop"><h3>${r.titel}</h3><span>${r.onder}</span></div>
     <div class="catalogus">${r.delen.map(d => catBlok(r, d)).join("")}</div>`;
  bouwSidebar();
}

function catBlok(r, d){
  return `<div class="cat">
    <div class="cat-kop"><span class="ico">${r.ico}</span><span><b>${d.kop || r.titel}</b>
      <small>${d.kop ? r.titel : r.onder}</small></span></div>
    ${d.items.map(k => link(r.id, k)).join("")}</div>`;
}

function link(rubId, key){
  const p = P[key];
  return `<a onclick="toonProduct('${rubId}','${key}',null)">${p.label}
    ${p.sub ? `<span class="n">${p.sub.length}</span>` : p.badge ? `<span class="n">${p.badge}</span>` : ""}</a>`;
}

/* ── HOME = volledige catalogus ── */
function openHome(){
  ACTIEF = {rub:null, prod:null, sub:null};
  document.getElementById("titel").textContent = "Overzicht";
  document.getElementById("kruimel").innerHTML = `<span class="nu">Start</span>`;
  const snel = [["🌧","Neerslagradar","buien nu","radar","nu"],["◈","Modellenbespreking","4× per dag","modellen","komend"],
                ["▦","Weerkaarten","10 kaartproducten","weerkaarten","komend"],["●","Waarnemingen","stations NL","waarnemingen","nu"],
                ["⌁","Pluimen","spreiding ECMWF","pluim","komend"],["↕","Toplijst","warmst · natst","toplijst","nu"]];
  document.getElementById("paneel").innerHTML = `
    <div class="hero">
      <div>
        <h2>Wat wil je bekijken?</h2>
        <p>Alles op Weerlab staat in vijf rubrieken: <b>nu</b>, <b>komende dagen</b>, <b>terugkijken</b>,
           <b>records &amp; klimaat</b> en <b>vakmatig</b>. Dezelfde vijf woorden gebruikt het menu links.</p>
      </div>
      <div class="status"><span class="ws-dot"></span><span><b>Code groen</b><small>geen KNMI-waarschuwingen</small></span></div>
    </div>
    <div class="snelrij">${snel.map(([i,t,s,k,r]) =>
      `<button class="snel" onclick="toonProduct('${r}','${k}',null)"><span class="ic">${i}</span>
        <span><b>${t}</b><small>${s}</small></span></button>`).join("")}</div>

    <div class="blokkop"><h3>Alle producten</h3><span>de hele site in één scherm — ${telAlles()} producten</span></div>
    <div class="catalogus">${RUBS().map(r => `
      <div class="cat">
        <div class="cat-kop"><span class="ico">${r.ico}</span><span><b>${r.titel}</b><small>${r.onder||"&nbsp;"}</small></span></div>
        ${r.delen.map(d => (d.kop ? `<div class="cat-sub">${d.kop}</div>` : "") +
          d.items.map(k => link(r.id, k)).join("")).join("")}
      </div>`).join("")}</div>

    <div class="note"><b>Wat is er anders dan nu?</b>
      <ul>
        <li>Menu en startpagina gebruiken <b>dezelfde vijf rubrieksnamen</b> (nu: sidebar zegt "Verwachting &amp; modellen", home zegt "Vooruit").</li>
        <li>De startpagina toont <b>alle</b> producten, niet 7 snelkoppelingen + 16 links van de ~35.</li>
        <li>Subproducten (10 weerkaarten, 6 MOS/MIX, 4 pluimen) staan <b>uitklapbaar in het menu</b> in plaats van verstopt achter een dropdown.</li>
        <li>Overlap weg: "Seizoen &amp; maand" en "Klimaat &amp; historie" worden <b>Terugkijken</b> (recent) en <b>Records &amp; klimaat</b> (ooit).</li>
        <li>Kruimelpad bovenin: Overzicht › rubriek › product › subproduct.</li>
      </ul>
    </div>`;
  bouwSidebar();
}

function telAlles(){
  return RUBS().reduce((n,r) => n + r.delen.reduce((m,d) => m + d.items.length, 0), 0);
}

document.getElementById("schakel").onclick = (e) => {
  const b = e.target.closest("button"); if (!b) return;
  MODE = b.dataset.mode;
  [...e.currentTarget.children].forEach(x => x.classList.toggle("aan", x === b));
  document.getElementById("modeinfo").textContent =
    MODE === "huidig" ? "= zoals weerlab.nl nu is" : "= voorstel";
  openHome();
};

openHome();
</script>
</body>
</html>
