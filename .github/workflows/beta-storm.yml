name: Beta ECMWF storm ENS
on:
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: beta-storm-ens
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /beta-storm/
            /tests/test_beta_storm.py
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install storm dependencies
        run: pip install -r beta-storm/requirements.txt
      - name: Test meteorological calculations
        run: python -m unittest discover -s tests -p test_beta_storm.py
      - name: Retrieve real ECMWF fields and build beta data
        run: python beta-storm/build.py --hours 72
      - name: Publish only beta storm data
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'weerlab-storm-bot'
          git config user.email 'storm-bot@users.noreply.github.com'
          git add beta-storm/data
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Werk beta ECMWF storm ENS bij'
          git pull --rebase origin main
          git push origin HEAD:main
          gh workflow run pages.yml --ref main
