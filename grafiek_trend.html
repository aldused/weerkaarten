<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>10-daagse verwachting – Ed Aldus WM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "DM Sans", ui-sans-serif, system-ui, sans-serif;
    background: #f6f8fb;
    color: #0f172a;
    font-size: 13px;
    font-feature-settings: "ss01","cv11";
  }

  .header {
    background: #ffffff;
    border-bottom: 1px solid #e3e8ef;
    padding: 12px 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 8px;
  }
  .header-links { display: flex; gap: 16px; align-items: center; }
  .header-left h1 { color: #0f172a; font-size: 15px; font-weight: 700; letter-spacing: -0.01em; }
  .header-left p  { color: #64748b; font-size: 11px; margin-top: 2px; font-family: "DM Mono", ui-monospace, monospace; font-weight: 500; }
  .header-right   { color: #64748b; font-size: 11px; text-align: right; line-height: 1.6; font-family: "DM Mono", ui-monospace, monospace; }
  .header-right strong { color: #0f172a; }
  .run-lbl { color: #00205b; font-size: 11px; font-weight: 600; }

  .content { padding: 14px 16px; max-width: 1200px; margin: 0 auto; }

  /* Legenda toggle knoppen */
  .legenda-hint {
    font-size: 12px;
    color: #78350f;
    margin-bottom: 10px;
    padding: 8px 12px;
    background: #fef3c7;
    border-radius: 8px;
    border: 1px solid #fde68a;
  }

  .legenda-rij {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-bottom: 10px;
    align-items: center;
  }
  .legenda-rij .lbl {
    font-size: 10.5px;
    font-weight: 600;
    color: #94a3b8;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    margin-right: 4px;
  }
  .station-btn {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 5px 11px;
    border-radius: 8px;
    border: 1px solid #e3e8ef;
    cursor: pointer;
    font-size: 12px;
    font-weight: 600;
    background: white;
    color: #334155;
    transition: all 0.15s;
    user-select: none;
    font-family: "DM Sans", ui-sans-serif, system-ui, sans-serif;
  }
  .station-btn:hover { border-color: #94a3b8; color: #0f172a; }
  .station-btn.uit { opacity: 0.4; }
  .station-btn .kleur-dot {
    width: 10px; height: 10px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  /* Grafiek kaart */
  .grafiek-kaart {
    background: white;
    border: 1px solid #e3e8ef;
    border-radius: 12px;
    box-shadow: 0 1px 2px rgba(15,23,42,0.04);
    padding: 16px;
    margin-bottom: 14px;
  }
  .grafiek-titel {
    font-size: 14px;
    font-weight: 700;
    color: #0f172a;
    margin-bottom: 10px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 4px;
    letter-spacing: -0.01em;
  }
  .grafiek-sub {
    font-size: 11px;
    color: #64748b;
    font-weight: 500;
    font-family: "DM Mono", ui-monospace, monospace;
  }
  .canvas-wrapper { position: relative; }

  .download-btn {
    padding: 5px 11px;
    border-radius: 8px;
    border: 1px solid #e3e8ef;
    background: white;
    color: #334155;
    font-size: 11.5px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.15s;
    white-space: nowrap;
    font-family: "DM Sans", ui-sans-serif, system-ui, sans-serif;
  }
  .download-btn:hover { background: #eef2f7; border-color: #94a3b8; color: #0f172a; }

  .footer {
    text-align: right;
    font-size: 11px;
    color: #94a3b8;
    margin-top: 6px;
    padding-bottom: 8px;
    font-family: "DM Mono", ui-monospace, monospace;
  }

  .laden { text-align: center; padding: 60px; color: #94a3b8; font-family: "DM Mono", ui-monospace, monospace; }
  .fout  { text-align: center; padding: 40px; color: #dc2626; }

  /* ── DARK MODE ── */
  [data-theme="dark"] body { background:#0b1220 !important; color:#f1f5f9 !important; }
  [data-theme="dark"] .header { background:#111a2e !important; border-color:rgba(255,255,255,0.08) !important; }
  [data-theme="dark"] .header-left h1 { color:#f1f5f9 !important; }
  [data-theme="dark"] .header-left p,
  [data-theme="dark"] .header-right { color:#94a3b8 !important; }
  [data-theme="dark"] .header-right strong { color:#f1f5f9 !important; }
  [data-theme="dark"] .run-lbl { color:#2ec4e8 !important; }
  [data-theme="dark"] .legenda-hint { background:rgba(245,158,11,0.12) !important; border-color:rgba(245,158,11,0.3) !important; color:#fde68a !important; }
  [data-theme="dark"] .legenda-rij .lbl { color:#64748b !important; }
  [data-theme="dark"] .station-btn { background:#0e1629 !important; color:#cbd5e1 !important; border-color:rgba(255,255,255,0.08) !important; }
  [data-theme="dark"] .station-btn:hover { border-color:rgba(255,255,255,0.2) !important; color:#f1f5f9 !important; }
  /* Grafiek-kaarten blijven LICHT (leesbaarheid pluimen/lijnen) */
  [data-theme="dark"] .grafiek-kaart { background:#ffffff !important; border-color:rgba(255,255,255,0.12) !important; }
  [data-theme="dark"] .grafiek-titel { color:#0f172a !important; }
  [data-theme="dark"] .grafiek-sub { color:#64748b !important; }
  [data-theme="dark"] .download-btn { background:#ffffff !important; color:#334155 !important; border-color:#e3e8ef !important; }
  [data-theme="dark"] .footer { color:#64748b !important; }
</style>
<script>
  (function(){
    function apply(t){ document.documentElement.setAttribute("data-theme", t === "dark" ? "dark" : "light"); }
    var saved = "light"; try { saved = localStorage.getItem("weerlab_theme") || "light"; } catch {}
    apply(saved);
    window.addEventListener("storage", function(e){ if (e.key === "weerlab_theme") apply(e.newValue); });
  })();
</script>
</head>
<body>

<div class="header">
  <div class="header-left">
    <h1>Ed Aldus WM</h1>
    <p>MOS ECMWF/ICON · 10-daagse verwachting</p>
  </div>
  <div class="header-right">
    <strong>DWD MOSMIX</strong><br>
    <span class="run-lbl" id="run-lbl">laden...</span>
  </div>
</div>

<div class="content" id="content">
  <div class="laden">Gegevens laden...</div>
</div>

<script>
const JSON_URL = "grafiek_trend.json?t=" + Date.now();

// Smooth via moving average
function smooth(arr, sigma=1.5) {
  const out = [...arr];
  for (let i = 0; i < arr.length; i++) {
    if (arr[i] === null) continue;
    let sum = 0, wsum = 0;
    for (let j = 0; j < arr.length; j++) {
      if (arr[j] === null) continue;
      const w = Math.exp(-0.5 * ((i-j)/sigma)**2);
      sum  += arr[j] * w;
      wsum += w;
    }
    out[i] = wsum > 0 ? Math.round(sum/wsum * 10)/10 : arr[i];
  }
  return out;
}

function maakTempGrafiek(data, zichtbaar) {
  const datasets = [];
  for (const [naam, sd] of Object.entries(data.temp)) {
    const k = sd.kleur;
    const hidden = !zichtbaar[naam];
    datasets.push({
      label: naam + " TX",
      data: sd.tx,
      borderColor: k,
      backgroundColor: "transparent",
      borderWidth: 2,
      pointRadius: 4,
      pointBackgroundColor: k,
      tension: 0.4,
      hidden,
      station: naam,
      type_: "tx",
    });
    datasets.push({
      label: naam + " TN",
      data: sd.tn,
      borderColor: k,
      backgroundColor: "transparent",
      borderWidth: 1.5,
      borderDash: [5,3],
      pointRadius: 3,
      pointBackgroundColor: k,
      tension: 0.4,
      hidden,
      station: naam,
      type_: "tn",
    });
  }
  return {
    type: "line",
    data: { labels: data.dag_labels, datasets },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      interaction: { mode: "index", intersect: false },
      plugins: {
        legend: { display: false },
        tooltip: {
          callbacks: {
            label: ctx => {
              if (ctx.parsed.y === null) return null;
              const type = ctx.dataset.type_ === "tx" ? "TX" : "TN";
              return `${ctx.dataset.station} ${type}: ${ctx.parsed.y.toFixed(1)}°C`;
            }
          }
        }
      },
      scales: {
        x: { grid: { color: "#eeeeee" }, ticks: { color: "#5a7090", font: { size: 10 } } },
        y: {
          grid: { color: "#eeeeee" },
          ticks: { color: "#5a7090", font: { size: 10 }, callback: v => v + "°C" }
        }
      }
    }
  };
}

function maakRRGrafiek(data, zichtbaar) {
  const stations = Object.keys(data.rr);
  const n = stations.length;
  const datasets = stations.map((naam, idx) => ({
    label: naam,
    data: data.rr[naam].rr,
    backgroundColor: data.rr[naam].kleur + "cc",
    borderColor: data.rr[naam].kleur,
    borderWidth: 1,
    borderRadius: 2,
    hidden: !zichtbaar[naam],
    station: naam,
  }));
  return {
    type: "bar",
    data: { labels: data.dag_labels, datasets },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      interaction: { mode: "index", intersect: false },
      plugins: {
        legend: { display: false },
        tooltip: {
          callbacks: {
            label: ctx => ctx.parsed.y > 0 ? `${ctx.dataset.label}: ${ctx.parsed.y.toFixed(1)} mm` : null,
            filter: item => item.parsed.y > 0,
          }
        }
      },
      scales: {
        x: { grid: { color: "#eeeeee" }, ticks: { color: "#5a7090", font: { size: 10 } } },
        y: {
          grid: { color: "#eeeeee" },
          ticks: { color: "#5a7090", font: { size: 10 }, callback: v => v + " mm" },
          beginAtZero: true,
        }
      }
    }
  };
}

function maakWindGrafiek(data, zichtbaar) {
  const datasets = Object.entries(data.wind).map(([naam, wd]) => ({
    label: naam,
    data: wd.bft,
    borderColor: wd.kleur,
    backgroundColor: "transparent",
    borderWidth: 2,
    pointRadius: 4,
    pointBackgroundColor: wd.kleur,
    tension: 0.4,
    hidden: !zichtbaar[naam],
    station: naam,
  }));
  return {
    type: "line",
    data: { labels: data.dag_labels, datasets },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      interaction: { mode: "index", intersect: false },
      plugins: {
        legend: { display: false },
        tooltip: {
          callbacks: {
            label: ctx => ctx.parsed.y !== null ? `${ctx.dataset.label}: Bft ${ctx.parsed.y}` : null,
          }
        }
      },
      scales: {
        x: { grid: { color: "#eeeeee" }, ticks: { color: "#5a7090", font: { size: 10 } } },
        y: {
          grid: { color: "#eeeeee" },
          ticks: { color: "#5a7090", font: { size: 10 }, callback: v => "Bft " + v, stepSize: 1 },
          min: 0, max: 12,
        }
      }
    }
  };
}

function maakLegenda(stations, kleuren, zichtbaar, onChange) {
  const div = document.createElement("div");
  div.className = "legenda-rij";
  const lbl = document.createElement("span");
  lbl.className = "lbl";
  lbl.textContent = "Stations:";
  div.appendChild(lbl);
  for (const naam of stations) {
    const btn = document.createElement("div");
    btn.className = "station-btn" + (zichtbaar[naam] ? "" : " uit");
    btn.style.borderColor = kleuren[naam];
    btn.innerHTML = `<div class="kleur-dot" style="background:${kleuren[naam]}"></div>${naam}`;
    btn.addEventListener("click", () => {
      zichtbaar[naam] = !zichtbaar[naam];
      btn.classList.toggle("uit", !zichtbaar[naam]);
      onChange(naam, zichtbaar[naam]);
    });
    div.appendChild(btn);
  }
  return div;
}

fetch(JSON_URL)
  .then(r => { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
  .then(data => {
    document.getElementById("run-lbl").textContent = "run: " + data.gegenereerd;

    const content = document.getElementById("content");
    content.innerHTML = "";

    // Zichtbaarheid state
    const alleStations = Object.keys(data.temp);
    const windStations  = Object.keys(data.wind);
    const zichtbaar = {};
    for (const s of alleStations) zichtbaar[s] = true;
    for (const s of windStations)  zichtbaar[s] = true;

    const kleuren = {};
    for (const [n, d] of Object.entries(data.temp))  kleuren[n] = d.kleur;
    for (const [n, d] of Object.entries(data.wind))  kleuren[n] = d.kleur;

    // Hint tekst
    const hint = document.createElement("div");
    hint.className = "legenda-hint";
    hint.textContent = "💡 Klik op een station om het aan of uit te zetten in alle grafieken.";
    content.appendChild(hint);

    // Helper: download knop
    function maakDownloadBtn(label, getChart) {
      const btn = document.createElement("button");
      btn.className = "download-btn";
      btn.textContent = "⬇ PNG";
      btn.addEventListener("click", () => {
        const chart = getChart();
        const link = document.createElement("a");
        link.href = chart.toBase64Image("image/png", 1.0);
        link.download = `edaldus_${label}_${data.gegenereerd.replace(/[: ]/g,"_")}.png`;
        link.click();
      });
      return btn;
    }

    // ── Temperatuur ──────────────────────────────────────────────────────
    const tempKaart = document.createElement("div");
    tempKaart.className = "grafiek-kaart";

    const tempLeg = maakLegenda(alleStations, kleuren, zichtbaar, (naam, vis) => {
      tempChart.data.datasets.forEach(ds => {
        if (ds.station === naam) ds.hidden = !vis;
      });
      rrChart.data.datasets.forEach(ds => {
        if (ds.station === naam) ds.hidden = !vis;
      });
      tempChart.update();
      rrChart.update();
    });
    tempKaart.appendChild(tempLeg);

    const tempTitel = document.createElement("div");
    tempTitel.className = "grafiek-titel";
    tempTitel.innerHTML = `<span>Temperatuur <span class="grafiek-sub">— TX (max) &nbsp; - - TN (min)</span></span>`;
    tempKaart.appendChild(tempTitel);

    const tempWrapper = document.createElement("div");
    tempWrapper.className = "canvas-wrapper";
    tempWrapper.style.height = "280px";
    const tempCanvas = document.createElement("canvas");
    tempWrapper.appendChild(tempCanvas);
    tempKaart.appendChild(tempWrapper);
    content.appendChild(tempKaart);

    const tempChart = new Chart(tempCanvas, maakTempGrafiek(data, zichtbaar));
    tempTitel.appendChild(maakDownloadBtn("temperatuur", () => tempChart));
    tempKaart.appendChild(Object.assign(document.createElement("div"), {className:"footer", textContent:`© Ed Aldus | Data: DWD (MOSMIX)`}));

    // ── Neerslag ─────────────────────────────────────────────────────────
    const rrKaart = document.createElement("div");
    rrKaart.className = "grafiek-kaart";
    const rrTitel = document.createElement("div");
    rrTitel.className = "grafiek-titel";
    rrTitel.innerHTML = `<span>Neerslag <span class="grafiek-sub">(dagsom mm)</span></span>`;
    rrKaart.appendChild(rrTitel);
    const rrWrapper = document.createElement("div");
    rrWrapper.className = "canvas-wrapper";
    rrWrapper.style.height = "220px";
    const rrCanvas = document.createElement("canvas");
    rrWrapper.appendChild(rrCanvas);
    rrKaart.appendChild(rrWrapper);
    content.appendChild(rrKaart);

    const rrChart = new Chart(rrCanvas, maakRRGrafiek(data, zichtbaar));
    rrTitel.appendChild(maakDownloadBtn("neerslag", () => rrChart));
    rrKaart.appendChild(Object.assign(document.createElement("div"), {className:"footer", textContent:`© Ed Aldus | Data: DWD (MOSMIX)`}));

    // ── Wind ──────────────────────────────────────────────────────────────
    const windKaart = document.createElement("div");
    windKaart.className = "grafiek-kaart";

    const windLeg = maakLegenda(windStations, kleuren, zichtbaar, (naam, vis) => {
      windChart.data.datasets.forEach(ds => {
        if (ds.station === naam) ds.hidden = !vis;
      });
      windChart.update();
    });
    windKaart.appendChild(windLeg);

    const windTitel = document.createElement("div");
    windTitel.className = "grafiek-titel";
    windTitel.innerHTML = `<span>Wind <span class="grafiek-sub">(max Bft, kuststations)</span></span>`;
    windKaart.appendChild(windTitel);
    const windWrapper = document.createElement("div");
    windWrapper.className = "canvas-wrapper";
    windWrapper.style.height = "240px";
    const windCanvas = document.createElement("canvas");
    windWrapper.appendChild(windCanvas);
    windKaart.appendChild(windWrapper);
    content.appendChild(windKaart);

    const windChart = new Chart(windCanvas, maakWindGrafiek(data, zichtbaar));
    windTitel.appendChild(maakDownloadBtn("wind", () => windChart));
    windKaart.appendChild(Object.assign(document.createElement("div"), {className:"footer", textContent:`© Ed Aldus | Data: DWD (MOSMIX)`}));
  })
  .catch(err => {
    document.getElementById("content").innerHTML =
      `<div class="fout">Kon grafiek_trend.json niet laden.<br><small>${err.message}</small></div>`;
  });
</script>
</body>
</html>
