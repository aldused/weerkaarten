<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kaarten Editor — KNMI-metingen</title>
  <link rel="stylesheet" href="./kaarten_editor_shell.css?v=20260809-v1" />
  <script>globalThis.WEERLAB_EDITOR_MODE = 'knmi';</script>
  <script defer src="./kaarten_editor_pin.js?v=20260811-pin1965-v1"
    data-pin-hash="d7c7673ba8ca7b0f04b1af4df026cbea7fed5b8acf59b27d33ef988c60eff054"
    data-session-key="knmi_metingen_pin_ok_1965"></script>
  <script src="./pluim_run_switcher_48ffbf926db6.js" data-editor-mode-aware="true" data-required="temperature_2m,precipitation,wind_speed_10m,cloud_cover,wind_gusts_10m"></script>
  <script type="module" crossorigin src="./landelijke-editor-assets/weerbewaking_landelijke_kaart-pc6L27QC.js?v=20260823-labelafstand-v38"></script>
  <style>
    #knmi-reload-button {
      position: fixed;
      left: 18px;
      bottom: 18px;
      z-index: 9000;
      min-height: 44px;
      padding: 10px 16px;
      border: 1px solid rgba(96, 165, 250, .72);
      border-radius: 10px;
      background: rgba(15, 23, 42, .94);
      box-shadow: 0 8px 24px rgba(0, 0, 0, .34);
      color: #dbeafe;
      cursor: pointer;
      font: 800 13px/1.2 Inter, system-ui, sans-serif;
    }
    #knmi-reload-button:hover { background: #1e3a5f; border-color: #93c5fd; }
    #knmi-reload-button:focus-visible { outline: 3px solid rgba(96, 165, 250, .42); outline-offset: 2px; }
    #knmi-reload-button:disabled { cursor: wait; opacity: .72; }
    @media (max-width: 760px) {
      #knmi-reload-button { left: 10px; bottom: 10px; padding: 9px 12px; }
    }
  </style>
</head>
<body>
  <div id="pin-gate">
    <form class="pin-card" id="pin-form">
      <div class="pin-icon">🔒</div>
      <h1>KNMI-metingen</h1>
      <p>Voer de viercijferige pincode in om de meetkaarten te openen.</p>
      <input class="pin-input" id="pin-input" type="password" inputmode="numeric" pattern="[0-9]{4}" maxlength="4" autocomplete="one-time-code" aria-label="Pincode" required autofocus />
      <button class="pin-submit" type="submit">Open editor</button>
      <div id="pin-error" role="alert"></div>
    </form>
  </div>
  <button id="knmi-reload-button" type="button" title="Laad de nieuwste KNMI-metingen zonder opnieuw in te loggen" hidden>🔄 Nieuwe metingen laden</button>
  <div id="root"></div>
  <script>
    (() => {
      const gate = document.getElementById('pin-gate');
      const button = document.getElementById('knmi-reload-button');
      const syncVisibility = () => { button.hidden = gate.style.display !== 'none'; };
      new MutationObserver(syncVisibility).observe(gate, { attributes: true, attributeFilter: ['style'] });
      button.addEventListener('click', () => {
        button.disabled = true;
        button.textContent = '⏳ Nieuwe metingen laden…';
        window.location.reload();
      });
      syncVisibility();
    })();
  </script>
</body>
</html>
