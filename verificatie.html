<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Verificatie MOSMIX – Ed Aldus WM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: "DM Sans", ui-sans-serif, system-ui, sans-serif;
  background: #f6f8fb;
  color: #0f172a;
  font-size: 13px;
  font-feature-settings: "ss01","cv11";
}

header {
  background: #ffffff;
  color: #0f172a;
  padding: 12px 20px;
  border-bottom: 1px solid #e3e8ef;
}
header h1 { font-size: 15px; font-weight: 700; letter-spacing: -0.01em; }
header p  { font-size: 11px; color: #64748b; margin-top: 2px; font-family: "DM Mono", ui-monospace, monospace; font-weight: 500; }

.wrap { padding: 16px 20px; max-width: 1100px; }

/* Samenvatting-kaarten */
.samen {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
  gap: 10px;
  margin-bottom: 16px;
}
.samen-kaart {
  background: white;
  border: 1px solid #e3e8ef;
  border-radius: 12px;
  padding: 14px;
  box-shadow: 0 1px 2px rgba(15,23,42,0.04);
  text-align: center;
}
.samen-kaart .label { font-size: 10.5px; color: #94a3b8; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; }
.samen-kaart .titel { font-size: 13px; font-weight: 700; margin: 4px 0 2px; color: #0f172a; }
.samen-kaart .mae   { font-size: 24px; font-weight: 700; font-family: "DM Mono", ui-monospace, monospace; color: #00205b; }
.samen-kaart .bias  { font-size: 11px; color: #64748b; margin-top: 2px; font-family: "DM Mono", ui-monospace, monospace; }

/* Tabel */
.tabel-wrap {
  background: white;
  border: 1px solid #e3e8ef;
  border-radius: 12px;
  box-shadow: 0 1px 2px rgba(15,23,42,0.04);
  overflow-x: auto;
}
table {
  width: 100%;
  border-collapse: collapse;
  font-size: 12px;
}
thead th {
  background: #f6f8fb;
  color: #64748b;
  padding: 10px 8px;
  font-weight: 700;
  font-size: 10.5px;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  position: sticky; top: 0;
  white-space: nowrap;
  border-bottom: 1px solid #e3e8ef;
}
thead th.groep {
  background: #eef2f7;
  text-align: center;
  border-left: 1px solid #e3e8ef;
  color: #0f172a;
}
tbody td {
  padding: 6px 8px;
  border-bottom: 1px solid #eff3f8;
  text-align: center;
  white-space: nowrap;
  font-family: "DM Mono", ui-monospace, monospace;
}
tbody td:first-child {
  text-align: left;
  font-weight: 600;
  color: #0d2b5e;
  position: sticky; left: 0;
  background: white;
  z-index: 1;
}
tbody tr:hover td { background: #f0f5fc; }
tbody tr:hover td:first-child { background: #f0f5fc; }

td.verschil { font-weight: 700; }
.groen  { color: #0d9488; }
.oranje { color: #d97706; }
.rood   { color: #dc2626; }

.geen-data {
  text-align: center;
  padding: 40px 20px;
  color: #6b7c93;
  font-size: 14px;
}
.geen-data p { margin-top: 8px; font-size: 12px; opacity: 0.7; }

.dag-tabs {
  display: flex;
  gap: 4px;
  margin-bottom: 12px;
  flex-wrap: wrap;
}
.dag-tab {
  padding: 6px 13px;
  border-radius: 8px;
  background: white;
  border: 1px solid #e3e8ef;
  cursor: pointer;
  font-size: 12px;
  color: #334155;
  font-weight: 600;
  transition: all 0.15s;
  font-family: "DM Sans", ui-sans-serif, system-ui, sans-serif;
}
.dag-tab:hover { background: #eef2f7; border-color: #94a3b8; color: #0f172a; }
.dag-tab.actief {
  background: #00205b;
  color: white;
  border-color: #00205b;
}

.info {
  font-size: 11px;
  color: #6b7c93;
  margin-top: 10px;
  line-height: 1.5;
}

@media (max-width: 600px) {
  .wrap { padding: 8px; }
  .samen { grid-template-columns: repeat(2, 1fr); gap: 6px; }
  table { font-size: 11.5px; }
  thead th, tbody td { padding: 5px 6px; }
  .dag-tab { padding: 5px 10px; font-size: 11px; }
}
</style>
</head>
<body>

<header>
  <h1>Verificatie MOSMIX</h1>
  <p id="subtitel">Laden...</p>
</header>

<div class="wrap">
  <div class="dag-tabs" id="dag-tabs"></div>
  <div class="samen" id="samenvatting"></div>
  <div class="tabel-wrap" id="tabel-container">
    <div class="geen-data" id="geen-data">
      <b>Nog geen verificatie beschikbaar</b>
      <p>Het script moet eerst een dag draaien om de berekeningen te archiveren.</p>
    </div>
  </div>
  <div class="info" id="info"></div>
</div>

<script>
const PARAM_CONFIG = {
  TX: { naam: "Max temp",   eenheid: "\u00b0C",  drempel: [1, 2] },
  TN: { naam: "Min temp",   eenheid: "\u00b0C",  drempel: [1, 2] },
  RR: { naam: "Neerslag",   eenheid: "mm",  drempel: [1, 3] },
  FF: { naam: "Gem. wind",  eenheid: "km/h", drempel: [5, 10] },
};

function kleurKlasse(param, verschil) {
  const cfg = PARAM_CONFIG[param];
  if (!cfg) return "";
  const abs = Math.abs(verschil);
  if (abs <= cfg.drempel[0]) return "groen";
  if (abs <= cfg.drempel[1]) return "oranje";
  return "rood";
}

function formatVerschil(v) {
  return (v > 0 ? "+" : "") + v.toFixed(1);
}

let alleDagen = [];
let actieveDag = 0;

function toonDag(index) {
  actieveDag = index;
  const dag = alleDagen[index];
  if (!dag) return;

  // Tabs bijwerken
  document.querySelectorAll(".dag-tab").forEach((t, i) => {
    t.classList.toggle("actief", i === index);
  });

  // Subtitel
  const d = new Date(dag.datum + "T12:00:00");
  const opties = { weekday: "long", day: "numeric", month: "long", year: "numeric" };
  document.getElementById("subtitel").textContent =
    `Verwachting vs waarneming \u2014 ${d.toLocaleDateString("nl-NL", opties)}`;

  // Samenvatting-kaarten
  const samenEl = document.getElementById("samenvatting");
  const params = ["TX", "TN", "RR", "FF"];
  samenEl.innerHTML = "";
  for (const p of params) {
    const s = (dag.samenvatting || {})[p];
    if (!s) continue;
    const cfg = PARAM_CONFIG[p];
    const kleur = kleurKlasse(p, s.mae);
    samenEl.innerHTML += `
      <div class="samen-kaart">
        <div class="label">${cfg.naam} (${cfg.eenheid})</div>
        <div class="mae ${kleur}">${s.mae.toFixed(1)}</div>
        <div class="bias">bias: ${formatVerschil(s.bias)} (n=${s.n})</div>
      </div>`;
  }

  // Tabel
  const stations = dag.stations || {};
  const namen = Object.keys(stations);
  if (namen.length === 0) return;

  let html = "<table><thead><tr><th>Station</th>";
  for (const p of params) {
    const cfg = PARAM_CONFIG[p];
    html += `<th class="groep" colspan="3">${cfg.naam} (${cfg.eenheid})</th>`;
  }
  html += "</tr><tr><th></th>";
  for (let i = 0; i < params.length; i++) {
    html += `<th>Verw.</th><th>Gem.</th><th>Versch.</th>`;
  }
  html += "</tr></thead><tbody>";

  for (const naam of namen) {
    const st = stations[naam];
    html += `<tr><td>${naam}</td>`;
    for (const p of params) {
      const v = st[p];
      if (v) {
        const kl = kleurKlasse(p, v.verschil);
        html += `<td>${v.verwacht.toFixed(1)}</td>`;
        html += `<td>${v.gemeten.toFixed(1)}</td>`;
        html += `<td class="verschil ${kl}">${formatVerschil(v.verschil)}</td>`;
      } else {
        html += `<td>-</td><td>-</td><td>-</td>`;
      }
    }
    html += "</tr>";
  }
  html += "</tbody></table>";
  document.getElementById("tabel-container").innerHTML = html;

  // Info
  const runTijd = dag.mosmix_run ? new Date(dag.mosmix_run).toLocaleString("nl-NL") : "onbekend";
  document.getElementById("info").innerHTML =
    `MOSMIX-run: ${runTijd} &middot; Bijgewerkt: ${alleDagen._bijgewerkt || ""}<br>` +
    `MAE = gemiddelde absolute fout &middot; Bias = systematische afwijking (positief = te warm/veel voorspeld)<br>` +
    `FF: MOSMIX gemiddelde dagwind vs KNMI etmaalgemiddelde (FG)`;
}

async function laad() {
  let data;
  try {
    const r = await fetch("verificatie.json?" + Date.now());
    if (!r.ok) throw new Error("Niet gevonden");
    data = await r.json();
  } catch {
    return;
  }

  // Nieuw formaat: data.dagen is array
  if (data.dagen && data.dagen.length > 0) {
    alleDagen = data.dagen;
    alleDagen._bijgewerkt = data.bijgewerkt;
  } else if (data.datum) {
    // Oud formaat: enkele dag
    alleDagen = [data];
    alleDagen._bijgewerkt = data.bijgewerkt;
  } else {
    return;
  }

  document.getElementById("geen-data").style.display = "none";

  // Dag-tabs opbouwen
  const tabsEl = document.getElementById("dag-tabs");
  const dagOpties = { weekday: "short", day: "numeric", month: "short" };
  tabsEl.innerHTML = "";
  alleDagen.forEach((dag, i) => {
    const d = new Date(dag.datum + "T12:00:00");
    const label = d.toLocaleDateString("nl-NL", dagOpties);
    tabsEl.innerHTML += `<div class="dag-tab${i === 0 ? " actief" : ""}" onclick="toonDag(${i})">${label}</div>`;
  });

  toonDag(0);
}

laad();
</script>
</body>
</html>
