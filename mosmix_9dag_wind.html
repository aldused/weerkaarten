.mini-header { background: #1e293b; color: #fff; padding: 7px 10px; display: flex; justify-content: space-between; align-items: baseline; }
.mini-dag-naam { font-size: 14px; font-weight: 700; }
.mini-dag-datum { font-size: 10px; color: #94a3b8; font-family: "DM Mono", monospace; }
.mini-kaart svg { display: block; width: 100%; height: auto; background: #b8d4e8; }
.mini-footer { background: #0f172a; padding: 3px 10px; font-size: 9px; color: #475569; font-family: "DM Mono", monospace; text-align: right; }
.status { text-align: center; color: #64748b; padding: 20px; font-size: 12px; }
.footer { text-align: center; padding: 12px; font-size: 11px; color: #94a3b8; font-family: "DM Mono", monospace; }

[data-theme="dark"] body { background:#0b1220; color:#f1f5f9; }
[data-theme="dark"] .header { background:#111a2e; border-color:#2ec4e8; }
[data-theme="dark"] .toolbar { background:#111a2e; border-color:rgba(255,255,255,0.08); }
[data-theme="dark"] .toolbar label { color:#94a3b8; }
[data-theme="dark"] .toolbar span { color:#cbd5e1; }
[data-theme="dark"] .mini-kaart { background:#111a2e; }
[data-theme="dark"] .mini-header { background:#0e1629; }
</style>
</head>
<body>

<div class="header">
  <h1>9-daagse windrichting &amp; windkracht</h1>
  <p id="hdr-sub">Laden…</p>
</div>
<div class="toolbar">
  <label for="zoom-slider">Kaartgrootte</label>
  <input type="range" id="zoom-slider" min="500" max="2000" value="1100" step="20"
         oninput="stelGrootteIn(this.value)">
  <span id="zoom-label">1100px</span>
  <div class="legenda">
    <div class="legenda-item"><div class="legenda-cirkel" style="background:#b3e5fc"></div>0–2</div>
    <div class="legenda-item"><div class="legenda-cirkel" style="background:#4db6ac"></div>3</div>
    <div class="legenda-item"><div class="legenda-cirkel" style="background:#81c784"></div>4</div>
    <div class="legenda-item"><div class="legenda-cirkel" style="background:#fff176"></div>5</div>
    <div class="legenda-item"><div class="legenda-cirkel" style="background:#ffca28"></div>6</div>
    <div class="legenda-item"><div class="legenda-cirkel" style="background:#ffa726"></div>7</div>
    <div class="legenda-item"><div class="legenda-cirkel" style="background:#ef5350"></div>8+</div>
    <div class="legenda-item" style="margin-left:8px;font-size:10px;color:#64748b">· pijl mét de wind · getal = Bft</div>
  </div>
</div>

<div class="kaarten-wrap">
  <div class="kaarten-grid" id="kaarten-grid"></div>
</div>
<div class="status" id="status">Laden…</div>
<div class="footer" id="footer">weerlab.nl · © Ed Aldus WM · DWD MOSMIX</div>

<script>
(function(){
  function apply(t){ document.documentElement.setAttribute("data-theme", t==="dark"?"dark":"light"); }
  var saved="light"; try { saved=localStorage.getItem("weerlab_theme")||"light"; } catch{}
  apply(saved);
  window.addEventListener("storage",function(e){ if(e.key==="weerlab_theme") apply(e.newValue); });
})();

const LON_MIN=3.3, LON_MAX=7.4, LAT_MIN=50.45, LAT_MAX=53.8;
const SVG_W=800, SVG_H=1100;
const lonToX = lon => (lon-LON_MIN)/(LON_MAX-LON_MIN)*SVG_W;
const latToY = lat => (1-(lat-LAT_MIN)/(LAT_MAX-LAT_MIN))*SVG_H;
const NL_DAGEN = ["zo","ma","di","wo","do","vr","za"];
const NS = "http://www.w3.org/2000/svg";

const STATIONS = {
  "Eelde":            [6.586,53.123], "Terschelling":    [5.35,53.392],
  "Vlieland":         [4.92,53.25],  "Leeuwarden":       [5.774,53.224],
  "Den Helder":       [4.789,52.928],"Amsterdam":         [4.781,52.309],
  "De Bilt":          [5.178,52.101],"Deelen":            [5.885,52.06],
  "Hoogeveen":        [6.52,52.73],  "Enschede":          [6.889,52.275],
  "Vlissingen":       [3.596,51.442],"Hoek van Holland":  [4.131,51.978],
  "Rotterdam Airport":[4.437,51.957],"Gilze Rijen":       [4.931,51.567],
  "Eindhoven":        [5.377,51.451],"Maastricht":        [5.77,50.911],
  "Volkel":           [5.707,51.657],"Valkenburg":        [4.417,52.27],
};
const OFFSET = {
  "Rotterdam Airport":[0.05, -0.10],  // licht oost + licht zuid; vermijdt overlap met HvH (80px)
  "Valkenburg":       [-0.06, 0   ],  // minimaal westwaarts; vermijdt overlap met Amsterdam (84px)
};

// FF in mosmix_nl.json is km/h (parser doet m/s × 3.6)
function kmhToBft(kmh) {
  if(kmh==null) return null;
  const tabel=[1,5,11,19,28,38,49,61,74,88,102,117];
  for(let i=0;i<tabel.length;i++) if(kmh<=tabel[i]) return i;
  return 12;
}

const BFT_KLEUREN = [
  "#b3e5fc",  // 0 – windstil
  "#81d4fa",  // 1
  "#64b5f6",  // 2
  "#4db6ac",  // 3 – zwak
  "#81c784",  // 4 – matig
  "#fff176",  // 5 – vrij krachtig
  "#ffca28",  // 6 – krachtig
  "#ffa726",  // 7 – hard
  "#ef5350",  // 8 – stormachtig
  "#c62828",  // 9 – storm
  "#880e4f",  // 10 – zware storm
  "#4a148c",  // 11 – zeer zware storm
  "#1a237e",  // 12 – orkaan
];

function bftKleur(bft) {
  if(bft==null) return "#94a3b8";
  return BFT_KLEUREN[Math.min(bft,12)];
}

function lum(hex){
  const c=parseInt(hex.slice(1),16);
  return (0.299*((c>>16)&255)+0.587*((c>>8)&255)+0.114*(c&255))/255;
}

function el(tag,attrs,txt){
  const e=document.createElementNS(NS,tag);
  for(const [k,v] of Object.entries(attrs)) e.setAttribute(k,v);
  if(txt!=null) e.textContent=txt;
  return e;
}

function ringD(ring){
  return ring.map(([lo,la],i)=>
    (i?"L":"M")+lonToX(lo).toFixed(1)+" "+latToY(la).toFixed(1)
  ).join("")+"Z";
}

function bouwBasemap(svg, provincies){
  let d="";
  for(const feat of provincies.features){
    const g=feat.geometry;
    const polys=g.type==="Polygon"?[g.coordinates]:g.coordinates;
    for(const poly of polys) for(const ring of poly) d+=ringD(ring);
  }
  svg.appendChild(el("path",{d,fill:"#f5efd9","fill-rule":"evenodd"}));
  svg.appendChild(el("path",{d,fill:"none",stroke:"rgba(255,255,255,0.6)","stroke-width":"3"}));
  let db="";
  for(const ring of NL_GRENS) db+=ringD(ring);
  svg.appendChild(el("path",{d:db,fill:"none",stroke:"#fff","stroke-width":"6","stroke-linejoin":"round"}));
}

function bouwStations(svg, dagData){
  for(const [naam,coords] of Object.entries(STATIONS)){
    const off=OFFSET[naam]||[0,0];
    const cx=lonToX(coords[0]+off[0]), cy=latToY(coords[1]+off[1]);
    // Dagtijd wind 06–18: gemiddelde van ochtend (FF_O) en middag (FF_M)
    const ffO=dagData.FF_O?.[naam]??null, ffM=dagData.FF_M?.[naam]??null;
    const ff=(ffO!=null&&ffM!=null)?(ffO+ffM)/2:ffO??ffM??null;
    // Windrichting: middag (DD_M) als meest representatief voor overdag
    const dd=dagData.DD_M?.[naam]??dagData.DD_O?.[naam]??null;
    const bft=kmhToBft(ff);
    const kleur=bftKleur(bft);
    const r=36;
    const tekst=lum(kleur)>0.55?"#1e293b":"#fff";

    // Cirkel
    svg.appendChild(el("circle",{cx,cy,r,fill:kleur,stroke:"#fff","stroke-width":3,opacity:"0.93"}));

    if(bft!=null){
      if(dd!=null){
        // Windpijl: mét de wind (DD+180), gecentreerd in cirkel
        // Pijlschacht omhoog in lokale coords, rotate zorgt voor richting
        const hoek=(dd+180)%360;
        const g=document.createElementNS(NS,"g");
        g.setAttribute("transform",`translate(${cx},${cy}) rotate(${hoek})`);
        // Schacht + pijlpunt (wijs naar boven = richting wind gaat)
        const pijl=el("path",{
          d:"M0,15 L0,-10 M0,-10 L-7,-1 M0,-10 L7,-1",
          stroke:tekst,
          "stroke-width":"4.5",
          "stroke-linecap":"round",
          "stroke-linejoin":"round",
          fill:"none"
        });
        g.appendChild(pijl);
        svg.appendChild(g);
        // Bft getal: rechtsonder in cirkel (buiten rotatie-groep)
        svg.appendChild(el("text",{
          x:cx+12,y:cy+20,
          "text-anchor":"middle",
          "font-family":"DM Mono,monospace",
          "font-weight":"700",
          "font-size":18,
          fill:tekst,
          "paint-order":"stroke",
          stroke:"rgba(255,255,255,0.5)",
          "stroke-width":"2"
        }, String(bft)));
      } else {
        // Geen windrichting: alleen Bft gecentreerd
        svg.appendChild(el("text",{
          x:cx,y:cy+7,
          "text-anchor":"middle",
          "font-family":"DM Mono,monospace",
          "font-weight":"700",
          "font-size":22,
          fill:tekst,
          "paint-order":"stroke",
          stroke:"rgba(255,255,255,0.5)",
          "stroke-width":"2"
        }, String(bft)));
      }
    }
  }
}

function bouwGrid(mosmix, provincies){
  const grid=document.getElementById("kaarten-grid");
  mosmix.dagen.slice(0,9).forEach(dag=>{
    const dd=new Date(dag+"T12:00:00");
    const dagNaam=NL_DAGEN[dd.getDay()];
    const dagDatum=dag.slice(5).replace("-","/");
    const dagData=mosmix.data[dag]||{};
    const wrap=document.createElement("div");
    wrap.className="mini-kaart";
    wrap.innerHTML=`<div class="mini-header"><span class="mini-dag-naam">${dagNaam}</span><span class="mini-dag-datum">${dagDatum}</span></div>`;
    const svg=document.createElementNS(NS,"svg");
    svg.setAttribute("viewBox","0 0 800 1100");
    svg.setAttribute("preserveAspectRatio","xMidYMid meet");
    bouwBasemap(svg, provincies);
    bouwStations(svg, dagData);
    wrap.appendChild(svg);
    wrap.insertAdjacentHTML("beforeend",`<div class="mini-footer">© Ed Aldus · DWD MOSMIX · weerlab.nl</div>`);
    grid.appendChild(wrap);
  });
}

function stelGrootteIn(breedte, opslaan=true){
  document.documentElement.style.setProperty("--grid-breedte",breedte+"px");
  document.getElementById("zoom-label").textContent=breedte+"px";
  document.getElementById("zoom-slider").value=breedte;
  if(opslaan) try{ localStorage.setItem("mosmix_kaarten_breedte",breedte); }catch{}
}

Promise.all([
  fetch("https://data.weerlab.nl/mosmix_nl.json?t="+Date.now()).then(r=>r.json()),
  fetch("nl_provincies.geojson").then(r=>r.json())
]).then(([mosmix, provincies])=>{
  document.getElementById("status").textContent="";
  const upd=mosmix.bijgewerkt.replace("T"," ");
  const runRaw=mosmix.run||"";
  let runStr="";
  if(runRaw){
    const r=new Date(runRaw);
    const dd=String(r.getUTCDate()).padStart(2,"0");
    const mm=String(r.getUTCMonth()+1).padStart(2,"0");
    const yyyy=r.getUTCFullYear();
    const hh=String(r.getUTCHours()).padStart(2,"0");
    runStr=" · Run: "+dd+"-"+mm+"-"+yyyy+" "+hh+" UTC";
  }
  document.getElementById("hdr-sub").textContent="Bijgewerkt: "+upd+runStr+" · Bron: DWD MOSMIX";
  document.getElementById("footer").textContent="weerlab.nl · © Ed Aldus WM · DWD MOSMIX · "+upd;
  bouwGrid(mosmix, provincies);
  let opgeslagen=1100;
  try{ opgeslagen=parseInt(localStorage.getItem("mosmix_kaarten_breedte"))||1100; }catch{}
  stelGrootteIn(opgeslagen, false);
}).catch(e=>{
  document.getElementById("status").textContent="Kon data niet laden: "+e.message;
});
</script>
</body>
</html>
