<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Historie - Ed Aldus WM</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: Arial, sans-serif; background: #f0f4f8; }
  .header { background: #00205b; padding: 14px 24px 10px; }
  .header-titel { color: white; font-size: 1.3em; font-weight: bold; }
  .header-sub { color: #a8c4e8; font-size: 0.82em; margin-top: 3px; }
  .header-nav { margin-top: 10px; }
  .header-nav a { color: #a8c4e8; font-size: 0.82em; text-decoration: none; margin-right: 16px; }
  .dag-nav { display: flex; gap: 8px; flex-wrap: wrap; padding: 14px 20px; background: #e8eef5; border-bottom: 1px solid #ccd6e0; }
  .dag-knop { background: white; border: 2px solid #ccd6e0; border-radius: 8px; padding: 8px 14px; cursor: pointer; text-align: center; min-width: 90px; }
  .dag-knop:hover { border-color: #00205b; }
  .dag-knop.actief { border-color: #00205b; background: #00205b; color: white; }
  .dag-knop .knop-dag { font-size: 0.72em; color: #888; }
  .dag-knop.actief .knop-dag { color: #a8c4e8; }
  .dag-knop .knop-datum { font-size: 0.88em; font-weight: bold; }
  .dag-knop .knop-status { font-size: 0.65em; margin-top: 2px; padding: 1px 5px; border-radius: 8px; display: inline-block; }
  .knop-status.voorlopig { background: #f5c400; color: #333; }
  .knop-status.definitief { background: #2a7a2a; color: white; }
  .content { padding: 16px 20px; max-width: 1400px; }
  .dag-blok { display: none; }
  .dag-blok.zichtbaar { display: block; }
  .dag-titel { font-size: 1.05em; font-weight: bold; color: #00205b; border-bottom: 2px solid #00205b; padding-bottom: 4px; margin-bottom: 14px; display: flex; align-items: center; gap: 10px; }
  .dag-status { font-size: 0.72em; font-weight: normal; padding: 2px 8px; border-radius: 10px; }
  .dag-status.voorlopig { background: #f5c400; color: #333; }
  .dag-status.definitief { background: #2a7a2a; color: white; }
  .dag-update { font-size: 0.72em; color: #888; font-weight: normal; }
  .tabellen { display: flex; gap: 20px; flex-wrap: wrap; }
  .tabel-blok { flex: 1; min-width: 260px; }
  .tabel-kop { font-size: 0.85em; font-weight: bold; color: white; padding: 6px 10px; border-radius: 5px 5px 0 0; }
  .tabel-kop.max { background: #c0392b; }
  .tabel-kop.min { background: #2471a3; }
  .tabel-kop.rr { background: #1a7a4a; }
  .tabel-kop.fx { background: #6a3a9a; }
  table { width: 100%; border-collapse: collapse; background: white; box-shadow: 0 2px 6px rgba(0,0,0,0.1); }
  th { background: #f0f4f8; font-size: 0.78em; color: #555; padding: 5px 8px; text-align: left; }
  td { padding: 5px 8px; font-size: 0.82em; border-bottom: 1px solid #f0f0f0; }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: #f8f9fa; }
  .pos { color: #888; font-size: 0.78em; width: 22px; }
  .waarde-max { font-weight: bold; color: #c0392b; text-align: right; width: 50px; }
  .waarde-min { font-weight: bold; color: #2471a3; text-align: right; width: 50px; }
  .waarde-rr { font-weight: bold; color: #1a7a4a; text-align: right; width: 50px; }
  .waarde-fx { font-weight: bold; color: #6a3a9a; text-align: right; width: 60px; }
  .tijd { color: #888; font-size: 0.78em; text-align: right; width: 45px; }
  .top1 td { background: #fff8e1; }
  .geen-data { color: #888; font-size: 0.85em; padding: 20px; }
  .laden { color: #555; padding: 20px; font-size: 0.9em; }
</style>
</head>
<body>
<div class="header">
  <p class="header-titel">Ed Aldus WM</p>
  <p class="header-sub">Historie: Maximum- en minimumtemperatuur, neerslag en windstoten &nbsp;|&nbsp; Bron: KNMI</p>
  <div class="header-nav"><a href="index.html">&larr; Weerkaarten</a></div>
</div>
<div class="dag-nav" id="dag-nav"></div>
<div class="content" id="inhoud"><p class="laden">Gegevens laden...</p></div>
<script>
const maanden = ["jan","feb","mrt","apr","mei","jun","jul","aug","sep","okt","nov","dec"];
const dagen = ["zo","ma","di","wo","do","vr","za"];
function formatDatum(d) {
  const dt = new Date(d + "T12:00:00");
  return dagen[dt.getDay()] + " " + dt.getDate() + " " + maanden[dt.getMonth()];
}
function maakTabel(lijst, modus) {
  if (!lijst || !lijst.length) return '<p class="geen-data">Geen data.</p>';
  const kl = modus === "max" ? "waarde-max" : "waarde-min";
  let h = "<table><tr><th></th><th>Station</th><th style='text-align:right'>grC</th><th style='text-align:right'>Tijd</th></tr>";
  lijst.forEach((r, i) => {
    const top = i === 0 ? "top1" : "";
    h += "<tr class='" + top + "'><td class='pos'>" + (i+1) + "</td><td>" + r.station + "</td><td class='" + kl + "'>" + r.waarde.toFixed(1) + "</td><td class='tijd'>" + (r.tijdstip || "-") + "</td></tr>";
  });
  return h + "</table>";
}
function maakTabelRR(lijst) {
  if (!lijst || !lijst.length) return '<p class="geen-data">Geen data.</p>';
  let h = "<table><tr><th></th><th>Station</th><th style='text-align:right'>mm</th></tr>";
  lijst.forEach((r, i) => {
    const top = i === 0 ? "top1" : "";
    h += "<tr class='" + top + "'><td class='pos'>" + (i+1) + "</td><td>" + r.station + "</td><td class='waarde-rr'>" + r.waarde.toFixed(1) + "</td></tr>";
  });
  return h + "</table>";
}
function maakTabelFX(lijst) {
  if (!lijst || !lijst.length) return '<p class="geen-data">Geen data.</p>';
  let h = "<table><tr><th></th><th>Station</th><th style='text-align:right'>km/u</th><th style='text-align:right'>Tijd</th></tr>";
  lijst.forEach((r, i) => {
    const top = i === 0 ? "top1" : "";
    h += "<tr class='" + top + "'><td class='pos'>" + (i+1) + "</td><td>" + r.station + "</td><td class='waarde-fx'>" + r.waarde.toFixed(0) + "</td><td class='tijd'>" + (r.tijdstip || "-") + "</td></tr>";
  });
  return h + "</table>";
}
function toonDag(datum) {
  document.querySelectorAll('.dag-blok').forEach(b => b.classList.remove('zichtbaar'));
  document.querySelectorAll('.dag-knop').forEach(k => k.classList.remove('actief'));
  const blok = document.getElementById('dag-' + datum);
  const knop = document.getElementById('knop-' + datum);
  if (blok) blok.classList.add('zichtbaar');
  if (knop) knop.classList.add('actief');
}
fetch("toplijst.json?t=" + Date.now())
  .then(r => r.json())
  .then(data => {
    const datums = Object.keys(data).sort().reverse();
    if (!datums.length) { document.getElementById("inhoud").innerHTML = '<p class="geen-data">Nog geen data.</p>'; return; }
    const nav = document.getElementById("dag-nav");
    datums.forEach(datum => {
      const dag = data[datum];
      const sk = dag.status === "definitief" ? "definitief" : "voorlopig";
      const knop = document.createElement("div");
      knop.className = "dag-knop";
      knop.id = "knop-" + datum;
      knop.innerHTML = "<div class='knop-dag'>" + formatDatum(datum) + "</div><div class='knop-datum'>" + datum + "</div><div><span class='knop-status " + sk + "'>" + dag.status + "</span></div>";
      knop.onclick = () => toonDag(datum);
      nav.appendChild(knop);
    });
    let html = "";
    datums.forEach(datum => {
      const dag = data[datum];
      const sk = dag.status === "definitief" ? "definitief" : "voorlopig";
      html += "<div class='dag-blok' id='dag-" + datum + "'>" +
        "<div class='dag-titel'>" + formatDatum(datum) + " " + datum.slice(0,4) +
        "<span class='dag-status " + sk + "'>" + dag.status + "</span>" +
        "<span class='dag-update'>bijgewerkt " + dag.update + "</span></div>" +
        "<div class='tabellen'>" +
        "<div class='tabel-blok'><div class='tabel-kop max'>Maximumtemperatuur TX</div>" + maakTabel(dag.max, "max") + "</div>" +
        "<div class='tabel-blok'><div class='tabel-kop min'>Minimumtemperatuur TN</div>" + maakTabel(dag.min, "min") + "</div>" +
        "<div class='tabel-blok'><div class='tabel-kop rr'>Neerslag RR</div>" + maakTabelRR(dag.rr) + "</div>" +
        "<div class='tabel-blok'><div class='tabel-kop fx'>Max. windstoot</div>" + maakTabelFX(dag.fx) + "</div>" +
        "</div></div>";
    });
    document.getElementById("inhoud").innerHTML = html;
    toonDag(datums[0]);
  })
  .catch(() => { document.getElementById("inhoud").innerHTML = '<p class="geen-data">Kon toplijst.json niet laden.</p>'; });
</script>
</body>
</html>
