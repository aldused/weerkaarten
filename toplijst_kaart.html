<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Toplijst Kaart – Ed Aldus WM</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: Arial, sans-serif; background: #f0f4f8; color: #1a2b40; }
.header { background: #00205b; padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; }
.header-titel { color: white; font-size: 14px; font-weight: 700; }
.header-sub { color: #a8c4e8; font-size: 11px; margin-top: 2px; }
.toolbar { background: white; padding: 10px 16px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; border-bottom: 1px solid #dde6f0; }
.toolbar-groep { display: flex; gap: 4px; }
.btn-param, .btn-dag {
  padding: 5px 14px; border-radius: 16px; border: 1px solid #c5d3e3;
  background: #f0f4f8; color: #2a4a70; font-size: 12px; font-weight: 600;
  cursor: pointer; transition: all 0.12s;
}
.btn-param:hover, .btn-dag:hover { background: #dce9f7; }
.btn-param.actief { color: white; border-color: transparent; }
.btn-param.tx.actief { background: #c0392b; }
.btn-param.tn.actief { background: #2471a3; }
.btn-param.rr.actief { background: #1a7a4a; }
.btn-param.fx.actief { background: #6c3483; }
.btn-param.sq.actief { background: #e67e00; }
.btn-dag.actief { background: #003366; color: white; border-color: #003366; }
.btn-opslaan { padding: 5px 16px; border-radius: 16px; border: none; background: #003366; color: white; font-size: 12px; font-weight: 700; cursor: pointer; margin-left: auto; }
.btn-opslaan:hover { background: #0055aa; }
.kaart-wrap { display: flex; justify-content: center; padding: 16px; }
canvas { border-radius: 8px; box-shadow: 0 2px 12px rgba(0,0,0,0.12); max-width: 100%; }
.legenda { display: flex; gap: 6px; flex-wrap: wrap; padding: 0 16px 16px; justify-content: center; }
.legenda-item { display: flex; align-items: center; gap: 4px; font-size: 11px; color: #5a7090; }
.legenda-blok { width: 14px; height: 14px; border-radius: 3px; }
.status { text-align: center; padding: 12px; font-size: 12px; color: #888; }
</style>
</head>
<body>

<div class="header">
  <div>
    <div class="header-titel">Ed Aldus WM — Toplijst Kaart</div>
    <div class="header-sub">KNMI waarnemingen · <span id="hdr-datum">laden...</span></div>
  </div>
  <div id="hdr-update" style="font-size:11px;color:#a8c4e8;"></div>
</div>

<div class="toolbar">
  <div class="toolbar-groep" id="param-btns">
    <button class="btn-param tx actief" data-param="max">🌡 TX Max</button>
    <button class="btn-param tn" data-param="min">❄ TN Min</button>
    <button class="btn-param rr" data-param="rr">🌧 Neerslag</button>
    <button class="btn-param fx" data-param="fx">💨 Windstoot</button>
    <button class="btn-param sq" data-param="sq">☀ Zon</button>
  </div>
  <div class="toolbar-groep" id="dag-btns">
    <button class="btn-dag actief" data-dag="vandaag">Vandaag</button>
    <button class="btn-dag" data-dag="gisteren">Gisteren</button>
  </div>
  <button class="btn-opslaan" onclick="slaOp()">⬇ Opslaan PNG</button>
</div>

<div class="kaart-wrap">
  <canvas id="kaart" width="600" height="820"></canvas>
</div>

<div class="legenda" id="legenda"></div>
<div class="status" id="status">Laden...</div>

<script>
const EXTENT = { lonMin: 3.3, lonMax: 7.4, latMin: 50.45, latMax: 53.8 };
const CW = 600, CH = 820;
const HEADER_H = 70;
const MAP_H = CH - HEADER_H;

const COORDS = {
  "Voorschoten":[4.447,52.125],"IJmuiden":[4.555,52.458],"Texelhors":[4.862,52.982],
  "Den Helder":[4.789,52.928],"Schiphol":[4.781,52.309],"Vlieland":[4.920,53.250],
  "Wijdenes":[5.166,52.632],"Berkhout":[4.979,52.644],"Terschelling":[5.350,53.392],
  "Wijk aan Zee":[4.601,52.504],"Houtribdijk":[5.385,52.649],"De Bilt":[5.178,52.101],
  "Soesterberg":[5.276,52.128],"Stavoren":[5.362,52.882],"Lelystad":[5.521,52.458],
  "Leeuwarden":[5.774,53.224],"Marknesse":[5.888,52.703],"Deelen":[5.885,52.060],
  "Lauwersoog":[6.201,53.413],"Heino":[6.261,52.439],"Hoogeveen":[6.520,52.730],
  "Eelde":[6.586,53.123],"Hupsel":[6.657,52.069],"Nieuw Beerta":[7.150,53.197],
  "Twenthe":[6.889,52.275],"Vlissingen":[3.596,51.442],"Westdorpe":[3.861,51.226],
  "Wilhelminadorp":[3.884,51.527],"Stavenisse":[4.001,51.594],"Hoek van Holland":[4.131,51.978],
  "Tholen":[4.219,51.531],"Woensdrecht":[4.342,51.449],"Rotterdam Geulhaven":[4.320,51.893],
  "Rotterdam Airport":[4.437,51.957],"Cabauw":[4.926,51.971],"Gilze-Rijen":[4.931,51.567],
  "Herwijnen":[5.146,51.859],"Eindhoven":[5.377,51.451],"Volkel":[5.707,51.657],
  "Ell":[5.763,51.198],"Maastricht":[5.770,50.911],"Arcen":[6.196,51.500],"Horst":[6.029,51.449],
};

function lonToX(lon) { return (lon - EXTENT.lonMin) / (EXTENT.lonMax - EXTENT.lonMin) * CW; }
function latToY(lat) { return HEADER_H + (EXTENT.latMax - lat) / (EXTENT.latMax - EXTENT.latMin) * MAP_H; }

// NL outline (simplified lon/lat pairs)
const NL_OUTLINE = [
  [3.36,51.38],[3.52,51.28],[3.65,51.23],[3.83,51.22],[4.02,51.25],[4.22,51.37],
  [4.38,51.45],[4.25,51.62],[4.05,51.75],[4.10,51.98],[4.47,52.16],[4.60,52.45],
  [4.56,52.46],[4.60,52.52],[4.73,52.70],[4.81,52.95],[4.75,52.93],[4.85,52.98],
  [4.92,53.25],[5.35,53.39],[5.80,53.47],[6.20,53.41],[6.84,53.57],[7.20,53.24],
  [7.08,52.84],[7.05,52.66],[6.97,52.63],[6.74,52.11],[6.50,51.86],[6.18,51.90],
  [6.04,51.86],[5.97,51.77],[6.10,51.68],[6.16,51.41],[5.77,50.91],[5.60,50.76],
  [5.24,50.50],[5.00,50.51],[4.82,50.74],[4.15,50.75],[3.90,51.20],[3.52,51.28],
  [3.36,51.38]
];
// Texel
const TEXEL = [[4.72,52.86],[4.99,53.19],[5.14,53.18],[5.00,52.86],[4.72,52.86]];
// Vlieland
const VLIELAND = [[4.82,53.26],[5.18,53.30],[5.08,53.22],[4.82,53.26]];
// Terschelling
const TERSCHELLING = [[5.20,53.36],[5.58,53.45],[5.42,53.37],[5.20,53.36]];

const PARAMS = {
  max: { label:"TX Maximum (°C)", eenheid:"°", decimalen:1, klasse:"tx",
    kleuren:[["#084594","≤0°"],["#4292c6","5°"],["#9ecae1","10°"],["#ffffcc","15°"],["#fed976","20°"],["#fd8d3c","25°"],["#800026","30°+"]],
    schaal:[-5,30] },
  min: { label:"TN Minimum (°C)", eenheid:"°", decimalen:1, klasse:"tn",
    kleuren:[["#1a3a6b","≤-10°"],["#2980b9","-5°"],["#a8d8ea","0°"],["#ffffcc","5°"],["#fed976","10°"],["#fd8d3c","15°+"]],
    schaal:[-15,20] },
  rr: { label:"Neerslag (mm)", eenheid:" mm", decimalen:1, klasse:"rr",
    kleuren:[["#c6dbef","0.1"],["#6baed6","5"],["#2171b5","15"],["#084594","30+"]],
    schaal:[0,30] },
  fx: { label:"Max windstoot (km/h)", eenheid:" km/h", decimalen:0, klasse:"fx",
    kleuren:[["#ffffb2","<50"],["#fecc5c","60"],["#fd8d3c","70"],["#f03b20","80"],["#bd0026","90+"]],
    schaal:[0,40] },
  sq: { label:"Zonneschijn (uur)", eenheid:" u", decimalen:1, klasse:"sq",
    kleuren:[["#fffacd","1u"],["#ffe066","4u"],["#ffa500","8u"],["#ff6600","12u+"]],
    schaal:[0,12] },
};

function interpKleur(val, schaal, stops) {
  const t = Math.max(0, Math.min(1, (val - schaal[0]) / (schaal[1] - schaal[0])));
  const colors = stops.map(s => hexToRgb(s[0]));
  const idx = Math.min(colors.length - 2, Math.floor(t * (colors.length - 1)));
  const f = t * (colors.length - 1) - idx;
  const a = colors[idx], b = colors[idx + 1];
  const r = Math.round(a[0] + f * (b[0] - a[0]));
  const g = Math.round(a[1] + f * (b[1] - a[1]));
  const bl = Math.round(a[2] + f * (b[2] - a[2]));
  return [`rgb(${r},${g},${bl})`, (0.299*r + 0.587*g + 0.114*bl) / 255 < 0.55 ? "white" : "#222"];
}
function hexToRgb(hex) {
  const r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
  return [r,g,b];
}

function tekenKaart(dagData, param, dagLabel) {
  const cv = document.getElementById("kaart");
  const ctx = cv.getContext("2d");
  const p = PARAMS[param];
  ctx.clearRect(0, 0, CW, CH);

  // Header
  ctx.fillStyle = "#003366";
  ctx.fillRect(0, 0, CW, HEADER_H);
  ctx.fillStyle = "#4a90c4";
  ctx.fillRect(0, HEADER_H - 2, CW, 2);
  ctx.fillStyle = "white";
  ctx.font = "bold 16px Arial";
  ctx.fillText("Ed Aldus WM", 14, 26);
  ctx.fillStyle = "#a8c8e8";
  ctx.font = "11px Arial";
  ctx.fillText("Waarnemingen KNMI", 14, 44);
  ctx.fillStyle = "white";
  ctx.font = "bold 18px Arial";
  ctx.textAlign = "right";
  ctx.fillText(dagLabel, CW - 14, 26);
  ctx.fillStyle = "#a8c8e8";
  ctx.font = "10px Arial";
  const now = new Date().toLocaleString("nl-NL",{day:"2-digit",month:"short",year:"numeric",hour:"2-digit",minute:"2-digit"});
  ctx.fillText(`${p.label}  ·  ${now}`, CW - 14, 44);
  ctx.textAlign = "left";

  // Kaartachtergrond (zee)
  ctx.fillStyle = "#c8e0f0";
  ctx.fillRect(0, HEADER_H, CW, MAP_H);

  // NL land
  ctx.fillStyle = "#eaf3e8";
  ctx.strokeStyle = "#333333";
  ctx.lineWidth = 0.8;
  [[NL_OUTLINE],[TEXEL],[VLIELAND],[TERSCHELLING]].forEach(polys => {
    polys.forEach(poly => {
      ctx.beginPath();
      poly.forEach(([lon,lat],i) => {
        const x = lonToX(lon), y = latToY(lat);
        i === 0 ? ctx.moveTo(x,y) : ctx.lineTo(x,y);
      });
      ctx.closePath();
      ctx.fill();
      ctx.stroke();
    });
  });

  // Copyright
  ctx.fillStyle = "#888888";
  ctx.font = "italic 9px Arial";
  ctx.textAlign = "right";
  ctx.fillText(`© Ed Aldus | Data: KNMI`, CW - 10, CH - 8);
  ctx.textAlign = "left";

  // Stations
  const rijen = dagData[param] || [];
  rijen.forEach(item => {
    const naam = item[1];
    if (!COORDS[naam]) return;
    const val = item[0];
    if (param === "rr" && val <= 0) return;
    const [lon, lat] = COORDS[naam];
    const x = lonToX(lon), y = latToY(lat);
    let tekst;
    if (param === "fx") {
      tekst = (val * 3.6).toFixed(0);
    } else {
      tekst = val.toFixed(p.decimalen) + "";
    }
    const [bg, fg] = interpKleur(val, p.schaal, p.kleuren);
    const tijdstip = item[2] || null;
    const w = ctx.measureText(tekst).width + 10;
    const h = tijdstip ? 20 : 16;
    const rx = 4;
    // Rond rechthoek
    ctx.fillStyle = bg;
    ctx.beginPath();
    ctx.roundRect(x - w/2, y - h/2, w, h, rx);
    ctx.fill();
    // Tekst
    ctx.fillStyle = fg;
    ctx.font = "bold 9.5px Arial";
    ctx.textAlign = "center";
    ctx.fillText(tekst, x, y + (tijdstip ? -1 : 3));
    // Tijdstip
    if (tijdstip) {
      ctx.fillStyle = "#555";
      ctx.font = "7px Arial";
      ctx.fillRect(x - 18, y + 5, 36, 11);
      ctx.fillStyle = "white";
      ctx.fillText(`${tijdstip}`, x, y + 13);
    }
    ctx.textAlign = "left";
  });
}

function maakLegenda(param) {
  const p = PARAMS[param];
  const el = document.getElementById("legenda");
  el.innerHTML = p.kleuren.map(([kleur,lbl]) =>
    `<div class="legenda-item"><div class="legenda-blok" style="background:${kleur};border:1px solid #ccc"></div>${lbl}</div>`
  ).join("");
}

let dagData = {};
let huidigParam = "max";
let huidigDag = "vandaag";
const NL_DAGEN = ["zondag","maandag","dinsdag","woensdag","donderdag","vrijdag","zaterdag"];
const NL_MND = ["","jan","feb","mrt","apr","mei","jun","jul","aug","sep","okt","nov","dec"];

function dagLabelVan(datumStr) {
  const d = new Date(datumStr + "T12:00:00");
  return `${NL_DAGEN[d.getDay()].charAt(0).toUpperCase()+NL_DAGEN[d.getDay()].slice(1)} ${d.getDate()} ${NL_MND[d.getMonth()+1]}`;
}

function update() {
  const vandaag = new Date(); vandaag.setHours(12,0,0,0);
  const gisteren = new Date(vandaag); gisteren.setDate(vandaag.getDate()-1);
  const key = huidigDag === "vandaag"
    ? vandaag.toISOString().slice(0,10)
    : gisteren.toISOString().slice(0,10);
  const d = dagData[key];
  if (!d) { document.getElementById("status").textContent = `Geen data voor ${key}`; return; }
  document.getElementById("status").textContent = "";
  document.getElementById("hdr-datum").textContent = dagLabelVan(key);
  tekenKaart(d, huidigParam, dagLabelVan(key));
  maakLegenda(huidigParam);
}

function slaOp() {
  const cv = document.getElementById("kaart");
  const a = document.createElement("a");
  a.href = cv.toDataURL("image/png");
  const p = PARAMS[huidigParam];
  a.download = `edaldus_topkaart_${huidigParam}_${huidigDag}.png`;
  a.click();
}

document.getElementById("param-btns").addEventListener("click", e => {
  const btn = e.target.closest(".btn-param");
  if (!btn) return;
  huidigParam = btn.dataset.param;
  document.querySelectorAll(".btn-param").forEach(b => b.classList.remove("actief"));
  btn.classList.add("actief");
  update();
});
document.getElementById("dag-btns").addEventListener("click", e => {
  const btn = e.target.closest(".btn-dag");
  if (!btn) return;
  huidigDag = btn.dataset.dag;
  document.querySelectorAll(".btn-dag").forEach(b => b.classList.remove("actief"));
  btn.classList.add("actief");
  update();
});

fetch("toplijst.json?t=" + Date.now())
  .then(r => r.json())
  .then(data => {
    dagData = data;
    const laatste = Object.keys(data).sort().reverse()[0];
    if (laatste) document.getElementById("hdr-update").textContent = `Bijgewerkt: ${data[laatste].update || laatste}`;
    document.getElementById("status").textContent = "";
    update();
  })
  .catch(e => document.getElementById("status").textContent = "Kon toplijst.json niet laden: " + e.message);
</script>
</body>
</html>
