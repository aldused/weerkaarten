<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0d0d1a;--bg2:#111126;--header:#0f3460;--panel:#161630;--border:#2a2a50;--text:#ddddf0;--text2:#8888bb;--accent:#2299ff;--red:#ee3333;--green:#44ee44;--yellow:#f5e642}
body{font-family:Inter,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
.header{background:var(--header);padding:14px 20px;display:flex;align-items:center;justify-content:space-between;border-bottom:2px solid #1a4a80}
.header h1{font-family:monospace;font-size:1.1rem;font-weight:700;color:white;letter-spacing:.02em}
.header p{font-size:.72rem;color:#8aaccc;margin-top:2px}
.header-right{font-size:.72rem;color:#7a9ab8;text-align:right}
.controls{background:var(--panel);border-bottom:1px solid var(--border);padding:12px 16px;display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end}
.ctrl-groep{display:flex;flex-direction:column;gap:4px}
.ctrl-groep label{font-size:.68rem;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:.05em}
select,input[type=date]{background:var(--bg2);border:1px solid var(--border);color:var(--text);border-radius:6px;padding:6px 10px;font-size:.82rem;font-family:Inter,sans-serif;outline:none;cursor:pointer;min-width:160px}
.periode-btns,.type-btns{display:flex;gap:5px}
.periode-btn,.type-btn{padding:6px 12px;border-radius:6px;border:1px solid var(--border);background:var(--bg2);color:var(--text2);font-size:.78rem;font-weight:600;cursor:pointer;transition:all .15s}
.type-btn{padding:6px 14px}
.periode-btn.actief,.type-btn.actief{background:var(--accent);border-color:var(--accent);color:white}
.periode-btn:hover,.type-btn:hover{border-color:var(--accent);color:var(--text)}
.datum-range{display:flex;align-items:center;gap:6px}
.datum-range span{color:var(--text2);font-size:.8rem}
.btn-laden{padding:7px 18px;border-radius:6px;background:var(--accent);border:none;color:white;font-size:.82rem;font-weight:600;cursor:pointer;font-family:Inter,sans-serif;transition:opacity .15s}
.btn-laden:hover{opacity:.85}
.btn-laden:disabled{opacity:.4;cursor:wait}
.btn-download{padding:7px 18px;border-radius:6px;background:#1a5a30;border:1px solid #2a7a40;color:#66dd88;font-size:.82rem;font-weight:600;cursor:pointer;font-family:Inter,sans-serif}
#grafiek-wrap{padding:12px 16px}
.grafiek-blok{margin-bottom:8px}
.grafiek-titel{font-size:.9rem;font-weight:600;color:white;margin-bottom:5px}
.legenda{display:flex;flex-wrap:wrap;gap:12px;font-size:.75rem;color:var(--text2);margin-bottom:6px}
.legenda span{display:flex;align-items:center;gap:5px}
.leg-lijn{display:inline-block;width:20px;height:3px;border-radius:2px;flex-shrink:0}
.leg-blok{display:inline-block;width:10px;height:10px;border-radius:2px;flex-shrink:0}
#status{text-align:center;padding:60px;color:var(--text2);font-size:.9rem}
.spinner{display:inline-block;width:20px;height:20px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;vertical-align:middle;margin-right:8px}
@keyframes spin{to{transform:rotate(360deg)}}
#copyright{text-align:center;font-size:.7rem;color:#44445a;padding:6px 0 12px;font-family:monospace}
.verg-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:12px 16px}
.verg-cel{background:#111126;border-radius:8px;padding:10px}
.zoek-item{padding:8px 12px;cursor:pointer;font-size:.82rem;color:var(--text);border-bottom:1px solid #2a2a50}
.zoek-item:hover{background:#1e1e40}
.zoek-item:last-child{border-bottom:none}
.verg-cel-titel{font-size:.82rem;font-weight:600;color:white;margin-bottom:4px}
@media(max-width:900px){.type-btns{flex-wrap:wrap}}
@media(max-width:600px){.controls{flex-direction:column}.verg-grid{grid-template-columns:1fr}}
</style>

<script>
const NL_DAGEN = ['Zo','Ma','Di','Wo','Do','Vr','Za'];
const NL_MND   = ['Jan','Feb','Mrt','Apr','Mei','Jun','Jul','Aug','Sep','Okt','Nov','Dec'];
const GRID='#1e1e35', TICK='#8888bb';
const PAAS_DAGEN = [{datum:'2026-04-03',naam:'Goede Vrijdag'},{datum:'2026-04-04',naam:'Stille Zaterdag'},{datum:'2026-04-05',naam:'1e Paasdag'},{datum:'2026-04-06',naam:'2e Paasdag'}];



let actieveType = 'temp';
let actievePreset = '7';
let actieveCharts = {};

// ── Klok ──
function updateKlok(){
  document.getElementById('klok').textContent =
    new Date().toLocaleString('nl-NL',{timeZone:'Europe/Amsterdam',day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'});
}
updateKlok(); setInterval(updateKlok,30000);

function bepaalRun(){
  const h=parseInt(new Date().toLocaleString('nl-NL',{timeZone:'Europe/Amsterdam',hour:'2-digit',hour12:false}));
  let ru,rd=new Date();
  if(h>=21)ru=12;
  else if(h>=9)ru=0;
  else{ru=12;rd=new Date(+rd-86400000);}
  const dag=rd.toLocaleDateString('nl-NL',{timeZone:'Europe/Amsterdam',day:'2-digit',month:'short'});
  return `Run: ${dag} ${String(ru).padStart(2,'0')}:00 UTC`;
}

const VERG_STATIONS_HTML=`<option value="52.101,5.178,De Bilt" selected>De Bilt</option>
<option value="52.928,4.789,Den Helder">Den Helder</option>
<option value="53.123,6.586,Eelde">Eelde</option>
<option value="52.275,6.889,Enschede">Enschede</option>
<option value="53.224,5.774,Leeuwarden">Leeuwarden</option>
<option value="50.911,5.770,Maastricht">Maastricht</option>
<option value="53.392,5.350,Terschelling">Terschelling</option>
<option value="51.442,3.596,Vlissingen">Vlissingen</option>
<option value="52.309,4.781,Amsterdam">Amsterdam</option>
<option value="51.978,4.131,Hoek van Holland">Hoek van Holland</option>
<option value="51.857,4.327,Rotterdam Airport">Rotterdam Airport</option>
<option value="51.9225,4.4792,Rotterdam">Rotterdam</option>
<option value="51.845,4.534,Barendrecht">Barendrecht</option>
<option value="51.818,3.917,Ouddorp">Ouddorp</option>
<option value="51.858,4.417,Rhoon">Rhoon</option>
<option value="51.866,4.600,Ridderkerk">Ridderkerk</option>
<option value="51.833,4.967,Gorinchem">Gorinchem</option>
<option value="51.451,5.377,Eindhoven">Eindhoven</option>
<option value="51.567,4.931,Gilze-Rijen">Gilze-Rijen</option>
<option value="51.567,5.081,Tilburg">Tilburg</option>
<option value="52.065,4.311,Den Haag">Den Haag</option>
<option value="51.814,4.669,Dordrecht">Dordrecht</option>
<option value="52.370,4.895,Amsterdam Centrum">Amsterdam Centrum</option>
<option value="53.219,6.567,Groningen">Groningen</option>
<option value="52.519,6.083,Zwolle">Zwolle</option>
<option value="51.989,5.938,Arnhem">Arnhem</option>
<option value="51.692,5.304,s-Hertogenbosch">'s-Hertogenbosch</option>
<option value="51.221,4.400,Antwerpen">Antwerpen</option>
<option value="50.850,4.351,Brussel">Brussel</option>
<option value="51.054,3.717,Gent">Gent</option>
<option value="50.633,5.567,Luik">Luik</option>`;

// ── Station / zoekfunctie ──
let huidigStation={lat:'52.101',lon:'5.178',naam:'De Bilt'};
let zoekTimer=null;

function getStationInfo(){ return huidigStation; }

function setStation(lat,lon,naam){
  huidigStation={lat:parseFloat(lat).toFixed(4),lon:parseFloat(lon).toFixed(4),naam};
  document.getElementById('huidig-station').textContent=`${naam} · ${parseFloat(lat).toFixed(3)}° N, ${parseFloat(lon).toFixed(3)}° E`;
  document.getElementById('zoek-input').value='';
  sluitZoek();
}

function sluitZoek(){
  document.getElementById('zoek-resultaten').style.display='none';
}

function zoekDebounce(){
  clearTimeout(zoekTimer);
  zoekTimer=setTimeout(zoekPlaats,400);
}

async function zoekPlaats(){
  const q=document.getElementById('zoek-input').value.trim();
  if(q.length<2)return;
  const res=document.getElementById('zoek-resultaten');
  res.innerHTML='<div class="zoek-item" style="color:#8888bb">Zoeken…</div>';
  res.style.display='';
  try{
    const r=await fetch(`https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(q)}&format=json&limit=6&accept-language=nl`,{headers:{'Accept-Language':'nl'}});
    const data=await r.json();
    if(!data.length){res.innerHTML='<div class="zoek-item" style="color:#8888bb">Niets gevonden</div>';return;}
    res.innerHTML=data.map(d=>`<div class="zoek-item" onclick="setStation('${d.lat}','${d.lon}','${d.display_name.split(',')[0].trim().replace(/'/g,"\'")}')"><strong>${d.display_name.split(',')[0]}</strong> <span style="color:#8888bb;font-size:.75rem">${d.display_name.split(',').slice(1,3).join(',').trim()}</span></div>`).join('');
  }catch(e){res.innerHTML='<div class="zoek-item" style="color:#ee4444">Zoekfout</div>';}
}

document.addEventListener('click',e=>{
  if(!e.target.closest('.ctrl-groep'))sluitZoek();
});

// ── Helpers ──
function maakLabels(times){
  return times.map(t=>{
    const d=new Date(t);
    const h=d.getHours();
    if(h===0)return `${NL_DAGEN[d.getDay()]} ${d.getDate()} ${NL_MND[d.getMonth()]}`;
    if(h===12)return '12:00';
    return null;
  });
}

function maakLabelsPasen(times){
  return times.map(t=>{
    const d=new Date(t);
    const h=d.getHours();
    const dp=t.slice(0,10);
    const paas=PAAS_DAGEN.find(p=>p.datum===dp);
    if(h===0)return paas?paas.naam:`${NL_DAGEN[d.getDay()]} ${d.getDate()} ${NL_MND[d.getMonth()]}`;
    if(h===12)return '12:00';
    return null;
  });
}

function getLab(times){return actievePreset==='pasen'?maakLabelsPasen(times):maakLabels(times);}



function medC(arr,j){
  const v=arr.map(m=>m[j]).filter(x=>x!=null).sort((a,b)=>a-b);
  if(!v.length)return null;
  const mid=Math.floor(v.length/2);
  return v.length%2?v[mid]:(v[mid-1]+v[mid])/2;
}
function pctC(arr,j,p){
  const v=arr.map(m=>m[j]).filter(x=>x!=null).sort((a,b)=>a-b);
  if(!v.length)return null;
  const i=(p/100)*(v.length-1),lo=Math.floor(i),hi=Math.ceil(i);
  return v[lo]+(v[hi]-v[lo])*(i-lo);
}

async function fetchT(url,ms=25000){
  const ctrl=new AbortController();
  const id=setTimeout(()=>ctrl.abort(),ms);
  try{
    const r=await fetch(url,{signal:ctrl.signal});
    clearTimeout(id);
    if(!r.ok)throw new Error(`HTTP ${r.status}`);
    return await r.json();
  }catch(e){clearTimeout(id);throw new Error(e.name==='AbortError'?'Time-out':e.message);}
}

function filterT(times,van,tot){
  if(!van||!tot)return times.map((_,i)=>i);
  const v=new Date(van+'T00:00:00'),t=new Date(tot+'T23:59:59');
  return times.map((ts,i)=>new Date(ts)>=v&&new Date(ts)<=t?i:-1).filter(i=>i>=0);
}

function datumRange(){
  const nu=new Date();
  if(actievePreset==='pasen')return{van:'2026-04-03',tot:'2026-04-06',dagen:16};
  if(actievePreset==='custom')return{van:document.getElementById('datum-van').value,tot:document.getElementById('datum-tot').value,dagen:16};
  const dagen=parseInt(actievePreset);
  return{van:null,tot:null,dagen};
}

function verwijderAlles(){
  Object.values(actieveCharts).forEach(c=>{try{c.destroy();}catch(e){}});
  actieveCharts={};
  ['temp','neerslag','cloud','wind','winddir','sneeuw','onweer','hoogte','icon','icon-neerslag','vergelijking','verg-neerslag','verg-wind'].forEach(id=>{
    document.getElementById('blok-'+id).style.display='none';
  });
}

function legHtml(items){
  return items.map(([kleur,tekst,vorm])=>{
    const el=vorm==='blok'
      ?`<span class="leg-blok" style="background:${kleur}"></span>`
      :`<span class="leg-lijn" style="background:${kleur}${vorm==='dash'?';border-top:2px dashed '+kleur+';background:transparent':''}"></span>`;
    return `<span>${el}${tekst}</span>`;
  }).join('');
}

const cfgBase={
  responsive:true,maintainAspectRatio:false,animation:false,
  interaction:{mode:'index',intersect:false},
  plugins:{legend:{display:false}},
  scales:{
    x:{grid:{color:GRID},ticks:{color:TICK,font:{size:10},maxRotation:0,autoSkip:true,maxTicksLimit:34},border:{color:GRID}},
  }
};

function yAs(pos,unit,kleur,extra={}){
  return{position:pos,grid:{color:pos==='left'?GRID:'transparent'},
    ticks:{color:kleur||TICK,font:{size:10},callback:v=>v+(unit||'')},
    border:{color:GRID},...extra};
}

async function laadData(){
  const btn=document.getElementById('btn-laden');
  btn.disabled=true;btn.textContent='Ophalen…';
  document.getElementById('vergelijking-wrap').style.display='none';
  document.getElementById('grafiek-wrap').style.display='';
  document.getElementById('status').innerHTML='<span class="spinner"></span>Data ophalen…';
  document.getElementById('status').style.display='';
  document.getElementById('btn-download').style.display='none';
  const pf=document.getElementById('png-formaat');if(pf)pf.style.display='none';
  document.getElementById('btn-reset').style.display='none';
  verwijderAlles();

  const{lat,lon,naam}=getStationInfo();
  const{van,tot,dagen}=datumRange();

  try{
    if(actieveType==='temp') await laadTemp(lat,lon,naam,dagen,van,tot);
    else if(actieveType==='cloud') await laadBewolking(lat,lon,naam,dagen,van,tot);
    else if(actieveType==='wind') await laadWind(lat,lon,naam,dagen,van,tot);
    else if(actieveType==='winddir') await laadWindrichting(lat,lon,naam,dagen,van,tot);
    else if(actieveType==='sneeuw') await laadSneeuw(lat,lon,naam,dagen,van,tot);
    else if(actieveType==='onweer') await laadOnweer(lat,lon,naam,dagen,van,tot);
    else if(actieveType==='hoogte') await laadHoogte(lat,lon,naam,dagen,van,tot);
    else if(actieveType==='icon') await laadIcon(lat,lon,naam,dagen,van,tot);
    else if(actieveType==='vergelijking') await laadVergelijkingModel(lat,lon,naam,dagen,van,tot);
    document.getElementById('status').style.display='none';
    document.getElementById('btn-download').style.display='';
    document.getElementById('png-formaat').style.display='';
    document.getElementById('btn-reset').style.display='';
    document.getElementById('run-info').textContent=bepaalRun();
  }catch(e){
    document.getElementById('status').innerHTML=`<span style="color:#ee4444">Fout: ${e.message}</span>`;
  }
  btn.disabled=false;btn.textContent='▶ Ophalen';
}

  document.getElementById('header-sub').textContent='51 ensembleleden · Open-Meteo · HRES operationeel';
  const[ens,hres]=await Promise.all([

// ── Windrichting ──
async function laadWindrichting(lat,lon,naam,dagen,van,tot){
  const ens=await fetchT(`https://ensemble-api.open-meteo.com/v1/ensemble?latitude=${lat}&longitude=${lon}&hourly=winddirection_10m,windspeed_10m&models=ecmwf_ifs025&windspeed_unit=kmh&timezone=Europe%2FAmsterdam&forecast_days=${dagen}`);
  const times=ens.hourly.time;
  const idx=filterT(times,van,tot),ts=idx.map(i=>times[i]);
  const ddK=Object.keys(ens.hourly).filter(k=>k.startsWith('winddirection_10m_member'));
  const ffK=Object.keys(ens.hourly).filter(k=>k.startsWith('windspeed_10m_member'));
  const ddA=ddK.map(k=>idx.map(i=>ens.hourly[k][i]));
  const ffA=ffK.map(k=>idx.map(i=>ens.hourly[k][i]));
  const ddMed=ts.map((_,j)=>{
    const v=ddA.map(m=>m[j]).filter(x=>x!=null);
    if(!v.length)return null;
    const sinM=v.reduce((s,d)=>s+Math.sin(d*Math.PI/180),0)/v.length;
    const cosM=v.reduce((s,d)=>s+Math.cos(d*Math.PI/180),0)/v.length;
    return(Math.atan2(sinM,cosM)*180/Math.PI+360)%360;
  });
  const spread=ts.map((_,j)=>{
    const v=ddA.map(m=>m[j]).filter(x=>x!=null);
    if(v.length<2)return 0;
    const sinM=v.reduce((s,d)=>s+Math.sin(d*Math.PI/180),0)/v.length;
    const cosM=v.reduce((s,d)=>s+Math.cos(d*Math.PI/180),0)/v.length;
    return Math.round((1-Math.sqrt(sinM**2+cosM**2))*180);
  });
  const ffMed=ts.map((_,j)=>medC(ffA,j));
  const lab=getLab(ts);
  document.getElementById('blok-winddir').style.display='';
  document.getElementById('titel-winddir').textContent=`ECMWF – ${naam}  Windrichting`;
  document.getElementById('leg-winddir').innerHTML=legHtml([
    ['#f5e642','Mediaan richting','lijn'],['rgba(245,230,66,0.25)','Spreiding (°)','blok'],
  ]);
  actieveCharts.winddir=new Chart(document.getElementById('canvas-winddir'),{
    data:{labels:lab,datasets:[
      {type:'bar',data:spread,backgroundColor:'rgba(245,230,66,0.18)',yAxisID:'y2',order:3},
      {type:'line',data:ddMed,borderColor:'#f5e642',borderWidth:2,pointRadius:3,pointBackgroundColor:'#f5e642',fill:false,tension:0.1,yAxisID:'y1',order:1},
    ]},
    options:{...cfgBase,
      plugins:{legend:{display:false},tooltip:{
        backgroundColor:'rgba(13,13,26,0.97)',titleColor:'#ddddf0',bodyColor:'#aabbcc',borderColor:'#334466',borderWidth:1,
        callbacks:{label:ctx=>{
          if(ctx.datasetIndex===1)return ` Richting: ${ctx.parsed.y!=null?ctx.parsed.y.toFixed(0):'-'}°`;
          if(ctx.datasetIndex===0)return ` Spreiding: ±${ctx.parsed.y.toFixed(0)}°`;
        }}
      }},
      scales:{
        x:cfgBase.scales.x,
        y1:{...yAs('left','°'),min:0,max:360,ticks:{...yAs('left','°').ticks,callback:v=>{
          const dir=['N','NO','O','ZO','Z','ZW','W','NW','N'];
          return `${dir[Math.round(v/45)%9]} (${v}°)`;
        },stepSize:45}},
        y2:{...yAs('right','°','rgba(245,230,66,0.6)'),grid:{display:false},max:180},
      }
    }
  });
}

async function laadOnweer(lat,lon,naam,dagen,van,tot){

  const times=ens.hourly.time;
  const idx=filterT(times,van,tot),ts=idx.map(i=>times[i]);
  const capeK=Object.keys(ens.hourly).filter(k=>k.startsWith('cape_member'));

  const capeMed=ts.map((_,j)=>medC(capeA,j));
  const kL=ts.map((_,j)=>capeA.map(m=>m[j]).filter(v=>v!=null&&v>100).length/(capeA.length||1)*100);

      {type:'bar',data:kM,backgroundColor:'rgba(255,120,30,0.5)',yAxisID:'y2',order:2},

let vergCharts={};

function setVergModel(m,btn){

  if(btn){btn.style.background='#2299ff';btn.style.color='white';btn.style.border='none';}

function openVergelijking(){
  // Gebruik vaste stations lijst voor 4-pluimen dropdowns
  const stnHTML=VERG_STATIONS_HTML;
  document.getElementById('grafiek-wrap').style.display='none';
  document.getElementById('vergelijking-wrap').style.display='';
  document.getElementById('btn-reset').style.display='';
  window.scrollTo({top:0,behavior:'smooth'});

  const bestaand=document.getElementById('verg-controls');
  if(bestaand)bestaand.remove();

  const ctrls=document.createElement('div');
  ctrls.id='verg-controls';
  ctrls.style.cssText='padding:12px 16px;background:#161630;border-bottom:1px solid #2a2a50;display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end';

  const types=[{val:'temp',lbl:'&#127777; Temp'},{val:'wind',lbl:'&#128168; Wind'},{val:'cloud',lbl:'&#9729;&#65039; Bewolking'},{val:'neerslag',lbl:'&#127783; Neerslag'},{val:'onweer',lbl:'&#9928;&#65039; Onweer'}];
  const btnStyle='padding:5px 10px;border-radius:5px;font-size:.75rem;font-weight:600;cursor:pointer';

  let html='<div style="font-size:.75rem;color:#8888bb;font-weight:700;text-transform:uppercase;letter-spacing:.05em">4 Pluimen</div>';
  html+=`<div style="display:flex;flex-direction:column;gap:4px"><label style="font-size:.65rem;color:#8888bb;text-transform:uppercase">Periode</label><div style="display:flex;gap:4px">
    <button onclick="setVergPeriode(7,this)" class="vbtn" style="${btnStyle};background:#2299ff;border:none;color:white">7d</button>
    <button onclick="setVergPeriode(10,this)" class="vbtn" style="${btnStyle};background:#1e3a5a;border:1px solid #2a2a50;color:#aaa">10d</button>
    <button onclick="setVergPeriode(16,this)" class="vbtn" style="${btnStyle};background:#1e3a5a;border:1px solid #2a2a50;color:#aaa">16d</button>
  </div></div>`;
  html+=`<div style="display:flex;flex-direction:column;gap:4px"><label style="font-size:.65rem;color:#8888bb;text-transform:uppercase">Model</label><div style="display:flex;gap:4px">
    <button onclick="setVergModel('ecmwf',this)" class="vmbtn" style="${btnStyle};background:#2299ff;border:none;color:white">ECMWF</button>
    <button onclick="setVergModel('icon',this)" class="vmbtn" style="${btnStyle};background:#1e3a5a;border:1px solid #2a2a50;color:#aaa">ICON</button>
  </div></div>`;

  for(let i=0;i<4;i++){
    html+=`<div style="display:flex;flex-direction:column;gap:4px">
      <label style="font-size:.65rem;color:#8888bb;text-transform:uppercase">Pluim ${i+1}</label>
      <select id="verg-stn-${i}" style="background:#0d0d1a;border:1px solid #2a2a50;color:#ddddf0;border-radius:6px;padding:5px 8px;font-size:.78rem">${stnHTML}</select>
      <select id="verg-type-${i}" style="background:#0d0d1a;border:1px solid #2a2a50;color:#ddddf0;border-radius:6px;padding:5px 8px;font-size:.78rem">
        ${types.map(t=>`<option value="${t.val}">${t.lbl}</option>`).join('')}
      </select>
    </div>`;
  }
  html+=`<div style="display:flex;gap:8px;align-items:flex-end">
    <button onclick="laadVergelijking()" style="${btnStyle};background:#2299ff;border:none;color:white;padding:7px 16px">&#9654; Laden</button>
    <button onclick="downloadVergelijking()" style="${btnStyle};background:#1a5a30;border:1px solid #2a7a40;color:#66dd88;padding:7px 16px">&#11015; PNG</button>
  </div>`;
  ctrls.innerHTML=html;
  document.querySelector('.controls').after(ctrls);

  for(let i=0;i<4;i++){
    const se=document.getElementById(`verg-stn-${i}`);
    const te=document.getElementById(`verg-type-${i}`);
    const os=localStorage.getItem(`verg-stn-${i}`);
    const ot=localStorage.getItem(`verg-type-${i}`);
    // Probeer opgeslagen waarde; als die niet in de lijst staat gebruik huidigStation
    if(os){
      se.value=os;
      if(!se.value) se.value=`${huidigStation.lat},${huidigStation.lon},${huidigStation.naam}`;
    }
    if(ot) te.value=ot;
    se.addEventListener('change',()=>localStorage.setItem(`verg-stn-${i}`,se.value));
    te.addEventListener('change',()=>localStorage.setItem(`verg-type-${i}`,te.value));
  }
}

async function laadVergelijking(){
  Object.values(vergCharts).forEach(c=>{try{c.destroy();}catch(e){}});
  vergCharts={};
  const wrap=document.getElementById('vergelijking-wrap');
  const oudGrid=document.getElementById('verg-grid');
  if(oudGrid)oudGrid.remove();
  const grid=document.createElement('div');
  grid.id='verg-grid';grid.className='verg-grid';
  wrap.appendChild(grid);

  for(let i=0;i<4;i++){
    const div=document.createElement('div');
    div.id=`verg-cel-${i}`;div.className='verg-cel';
    div.innerHTML=`<div class="verg-cel-titel">Pluim ${i+1} laden…</div><div style="position:relative;width:100%;height:300px"><canvas id="verg-canvas-${i}"></canvas></div>`;
    grid.appendChild(div);
  }
  setTimeout(()=>grid.scrollIntoView({behavior:'smooth',block:'start'}),100);

  for(let i=0;i<4;i++){
    const se=document.getElementById(`verg-stn-${i}`);
    const te=document.getElementById(`verg-type-${i}`);
    if(!se||!te)continue;
    const sv=se.value.split(',');
    const lat=sv[0],lon=sv[1],naam=sv[2];
    try{
      await laadVergPluim(i,lat,lon,naam,te.value,vergDagen,vergModel);
    }catch(e){
      document.getElementById(`verg-cel-${i}`).innerHTML=`<div style="color:#ee4444;padding:20px;font-size:.85rem">&#9888;&#65039; Fout bij ${naam}: ${e.message}</div>`;
    }
  }
}

async function laadVergPluim(idx,lat,lon,naam,type,dagen,model){
  const ensModel=model==='icon'?'icon_seamless':'ecmwf_ifs025';
  // GFS ensemble ondersteunt alleen temp en neerslag (geen wind/cloud members)
  if(model==='gfs'&&(type==='wind'||type==='cloud'||type==='onweer')){
    const cel=document.getElementById(`verg-cel-${idx}`);
    if(cel)cel.innerHTML=`<div style="color:#ffaa44;padding:20px;font-size:.85rem">⚠️ GFS ondersteunt geen ${type} ensembleleden. Kies Temp of Neerslag.</div>`;
    return;
  }
  let apiTimes=[];
  const mLbl=model==='icon'?'ICON':'ECMWF';
  const medK=model==='icon'?'#22ddaa':'#ee3333';

// ── PNG download met formaat-opties ──
function maakPngCanvas(canvasList,naam,typeLabel,modelLabel){
  const HDR=56,PAD=8,FOOT=20;
  const W=canvasList[0].width;
  const totH=HDR+canvasList.reduce((s,c)=>s+c.height+PAD,0)-PAD+FOOT;
  const out=document.createElement('canvas');
  out.width=W; out.height=totH;
  const ctx=out.getContext('2d');

  // Achtergrond
  ctx.fillStyle='#0d0d1a';
  ctx.fillRect(0,0,W,totH);

  // Header
  ctx.fillStyle='#0f3460';
  ctx.fillRect(0,0,W,HDR);
  ctx.fillStyle='white';
  ctx.font='bold 16px Inter,sans-serif';
  ctx.fillText('Ed Aldus WM',14,24);
  ctx.fillStyle='#8aaccc';
  ctx.font='12px Inter,sans-serif';
  ctx.fillText(`${naam} · ${typeLabel} · ${modelLabel}`,14,42);
  const datStr=new Date().toLocaleString('nl-NL',{timeZone:'Europe/Amsterdam',day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'});
  ctx.textAlign='right';
  ctx.fillText(datStr,W-14,24);
  ctx.fillText('© Ed Aldus WM | open-meteo.com',W-14,42);
  ctx.textAlign='left';
  ctx.fillStyle='#4a90c4';
  ctx.fillRect(0,HDR-2,W,2);

  // Charts
  let y=HDR;
  canvasList.forEach((c,i)=>{ctx.drawImage(c,0,y);y+=c.height+(i<canvasList.length-1?PAD:0);});

  // Footer
  ctx.fillStyle='rgba(10,10,28,0.85)';
  ctx.fillRect(0,totH-FOOT,W,FOOT);
  ctx.fillStyle='#445566';
  ctx.font='10px Inter,sans-serif';
  ctx.fillText('© Ed Aldus WM | Data: Open-Meteo | weerlab.nl',8,totH-6);
  return out;
}

function schaalCanvas(src,doelW,doelH){
  const out=document.createElement('canvas');
  out.width=doelW; out.height=doelH;
  const ctx=out.getContext('2d');
  ctx.fillStyle='#0d0d1a';
  ctx.fillRect(0,0,doelW,doelH);
  const schaal=Math.min(doelW/src.width,doelH/src.height);
  const w=src.width*schaal,h=src.height*schaal;
  ctx.drawImage(src,(doelW-w)/2,(doelH-h)/2,w,h);
  return out;
}

function downloadPng(){
  const{naam}=getStationInfo();
  const ts=new Date().toISOString().slice(0,16).replace('T','_').replace(':','');
  const formaat=document.getElementById('png-formaat')?.value||'auto';
  const ids={temp:'canvas-temp',cloud:'canvas-cloud',wind:'canvas-wind',winddir:'canvas-winddir',
             sneeuw:'canvas-sneeuw',onweer:'canvas-onweer',hoogte:'canvas-hoogte',
             icon:'canvas-icon',vergelijking:'canvas-vergelijking'};
  const neerslagIds={temp:'canvas-neerslag',icon:'canvas-icon-neerslag',vergelijking:'canvas-verg-neerslag'};
  const windIds={vergelijking:'canvas-verg-wind'};
  const modelNamen={temp:'ECMWF ENS',icon:'ICON ENS',cloud:'ECMWF ENS',wind:'ECMWF ENS',winddir:'ECMWF ENS',sneeuw:'ECMWF ENS',onweer:'ECMWF ENS',hoogte:'ECMWF ENS',vergelijking:'ECMWF vs ICON'};
  const typeNamen={temp:'Temp & Neerslag',icon:'ICON Temp & Neerslag',cloud:'Bewolking',wind:'Wind',winddir:'Windrichting',sneeuw:'Sneeuwkans',onweer:'Onweer',hoogte:'850/500 hPa',vergelijking:'Temp · Neerslag · Wind'};

  const mainC=document.getElementById(ids[actieveType]||'canvas-temp');
  if(!mainC)return;
  const canvassen=[mainC];
  const nC=document.getElementById(neerslagIds[actieveType]);
  if(nC) canvassen.push(nC);
  const wC=document.getElementById(windIds[actieveType]);
  if(wC) canvassen.push(wC);

  let uit=maakPngCanvas(canvassen,naam,typeNamen[actieveType]||'',modelNamen[actieveType]||'ECMWF ENS');

  if(formaat==='social') uit=schaalCanvas(uit,1200,630);
  else if(formaat==='square') uit=schaalCanvas(uit,1080,1080);
  else if(formaat==='story') uit=schaalCanvas(uit,1080,1920);

  const a=document.createElement('a');
  a.href=uit.toDataURL('image/png');
  a.download=`pluim_${naam.toLowerCase().replace(/\s+/g,'_')}_${actieveType}_${formaat}_${ts}.png`;
  a.click();
}

      a.href=c.toDataURL('image/png');
      a.download=`vergelijking_${i+1}.png`;
      a.click();
    },i*500);
  }
}

// ── Reset ──
function resetAlles(){
  document.getElementById('vergelijking-wrap').style.display='none';
  document.getElementById('grafiek-wrap').style.display='';
  const c=document.getElementById('verg-controls');
  if(c)c.remove();
  verwijderAlles();
  document.getElementById('status').innerHTML='Selecteer een station en klik op <strong>Ophalen</strong>';
  document.getElementById('status').style.display='';
  document.getElementById('btn-download').style.display='none';
  const pf=document.getElementById('png-formaat');if(pf)pf.style.display='none';
  document.getElementById('btn-reset').style.display='none';
  document.getElementById('run-info').textContent='–';
  document.querySelectorAll('.type-btn').forEach((b,i)=>b.classList.toggle('actief',i===0));
  actieveType='temp';
  window.scrollTo({top:0,behavior:'smooth'});
}

// ── Init ──
window.addEventListener('load',()=>{
  document.getElementById('run-info').textContent=bepaalRun();
  setTimeout(laadData,300);
});
</script>
