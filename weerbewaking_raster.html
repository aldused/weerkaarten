<!doctype html>
<html lang="nl">
<head><script src="/weerlab-native-only.js?v=20261027-audit2"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Weerbewaking – Weekraster</title>
<link rel="stylesheet" href="weerbewaking_raster.css?v=20261026-1">
<style>
</style>
</head>
<body>
<div id="defs"></div>
<header id="bar">
  <div class="titlewrap"><a class="back" href="weerbewaking.html" onclick="if(window.parent!==window){try{window.parent.openWeerbewakingSubpage('home',false);return false}catch(e){}}">← Overzicht</a><div class="title">Weekraster</div></div>
  <div class="tools">
    <span class="viewwrap"><button id="viewBtn" title="Onderdelen in het raster aan of uit zetten">👁</button><div id="viewMenu" hidden></div></span>
    <button id="report" title="Weerbericht, kopiëren en exporteren">📝</button>
    <button id="tgLeft" title="Paneel met huidig weer tonen/verbergen">◧</button>
    <button id="tgRight" title="Plaatsenlijst tonen/verbergen">◨</button>
    <button id="prev" title="Eerder">‹</button>
    <button id="next" title="Later">›</button>
    <select id="selSrc" title="Gegevensbron"></select>
    <select id="selDays" title="Aantal dagen"><option value="7">7 dagen</option><option value="10">10 dagen</option></select>
    <select id="selWind" title="Wind"></select>
    <select id="selTemp" title="Temperatuur"><option value="c">°C</option><option value="f">°F</option></select>
    <button id="refresh" title="Vernieuwen (Ctrl+R)">⟳</button>
    <button id="gear" title="Voorkeuren">⚙</button>
  </div>
</header>
<main>
  <aside id="left"></aside>
  <section id="grid"></section>
  <aside id="right">
    <div class="search"><span>🔍</span><input id="q" placeholder="Zoek een plaats" autocomplete="off"></div>
    <div id="list"></div>
  </aside>
</main>
<div id="pop" hidden></div>
<div id="ctx" hidden></div>
<div id="modal" hidden><div class="card" id="prefs"></div></div>
<script>
(function () {
  var LIBS = ['weerbewaking_raster_core.js','weerbewaking_raster_icons.js','weerbewaking_raster_grid.js','weerbewaking_raster_app.js'], V = '20261027-native-audit2';
  function boot() {
    var i = 0; (function next() { if (i >= LIBS.length) return; var s = document.createElement('script'); s.src = LIBS[i++] + '?v=' + V; s.onload = next; s.onerror = function(){ document.getElementById('grid').innerHTML = '<div class="empty">Kon ' + s.src + ' niet laden.</div>'; }; document.body.appendChild(s); })();
  }
  boot();
})();
</script>
</body>
</html>
