<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Temperaturen · Weerlab</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0d1420;color:#e6ecf5;font-family:system-ui,sans-serif;height:100vh;display:flex;flex-direction:column}nav{display:flex;gap:8px;flex-wrap:wrap;padding:12px;background:#172235;border-bottom:1px solid #2a3a55}button{font:inherit;font-size:13px;padding:10px 14px;border:1px solid #40516e;border-radius:8px;color:#e6ecf5;background:transparent;cursor:pointer}button[aria-pressed=true]{background:#88aaff;color:#0d1420;border-color:#88aaff}button:focus-visible{outline:2px solid white;outline-offset:2px}iframe{width:100%;flex:1;min-height:0;border:0}
</style>
</head>
<body>
<nav aria-label="Temperatuur kiezen">
<button type="button" data-view="grondtemp" aria-pressed="true">Grondtemperatuur · 10 cm</button>
<button type="button" data-view="tn" aria-pressed="false">Minimumtemperatuur · 2 m</button>
<button type="button" data-view="tx" aria-pressed="false">Maximumtemperatuur</button>
<button type="button" data-view="mos" aria-pressed="false">Grondvorst &amp; verificatie</button>
</nav>
<iframe title="Grondtemperatuur op 10 cm" id="temperature"></iframe>
<script>
const views={grondtemp:'demo_wgt_grondtemp.html?v=20261027-mos-v21',tn:'demo_wgt_grondtemp.html?laag=tn&v=20261027-mos-v21',tx:'demo_wgt_tx.html?v=20261027-mos-v21',mos:'demo_wgt_mos.html?v=20261027-mos-v21'};
function show(){const key=Object.hasOwn(views,location.hash.slice(1))?location.hash.slice(1):'grondtemp';const frame=document.getElementById('temperature');document.querySelectorAll('[data-view]').forEach(button=>{button.setAttribute('aria-pressed',String(button.dataset.view===key));if(button.dataset.view===key)frame.title=button.textContent;});frame.src=views[key];}
document.querySelectorAll('[data-view]').forEach(button=>button.addEventListener('click',()=>{location.hash=button.dataset.view;}));window.addEventListener('hashchange',show);show();
</script>
</body>
</html>
