<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ensemble 6 pluim+ · Ed Aldus WM</title>
<style>
  :root{
    --brand:#00205b; --brand-2:#003366; --accent:#2ec4e8;
    --bg:#f0f4f8; --panel:#ffffff;
    --ink:#1a2b40; --ink-3:#5a7090; --line:#dde6f0; --chip:#f0f4f8;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:Arial,sans-serif;background:var(--bg);color:var(--ink);display:flex;flex-direction:column}

  .header-bg{padding:14px 20px 0}
  .header{
    background:linear-gradient(180deg,#003d8a 0%,#00205b 100%);
    padding:16px 24px;border-radius:12px;
    display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:12px;
    box-shadow:0 2px 4px rgba(0,32,91,.15),0 10px 24px rgba(0,32,91,.10);
    border:1px solid rgba(46,196,232,.25);
  }
  .header-titel{color:#fff;font-size:20px;font-weight:800}
  .header-sub{color:#a8c4e8;font-size:12px;margin-top:4px;font-weight:500}
  .header-rechts{text-align:right;color:#fff}
  .header-rechts .datum{font-size:14px;font-weight:700;color:#fff}
  .header-rechts .omschr{font-size:11.5px;color:#a8c4e8;margin-top:3px}
  .header-rechts a{color:#a8c4e8;text-decoration:none;font-size:11px}

  .toolbar{
    background:#fff;padding:10px 18px;display:flex;gap:12px;flex-wrap:wrap;align-items:center;
    border-bottom:1px solid var(--line);margin:14px 20px 0;border-radius:10px;
    box-shadow:0 1px 2px rgba(15,23,42,.04);
  }
  .lbl{font-size:11px;color:var(--ink-3);font-weight:700;text-transform:uppercase;letter-spacing:.05em}
  select, button.btn{
    padding:6px 12px;border-radius:14px;border:1px solid #c5d3e3;background:var(--chip);
    color:#2a4a70;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;
  }
  button.btn-primair{background:var(--brand-2);color:#fff;border-color:var(--brand-2)}
  button.btn-primair:hover{background:#0055aa}
  button.btn:disabled{opacity:0.5;cursor:wait}
  .runinfo{font-size:11px;color:var(--ink-3);font-weight:600;margin-left:auto}

  .page-wrap{padding:14px 20px;background:var(--bg)}
  .page-card{background:#fff;border-radius:10px;box-shadow:0 1px 2px rgba(15,23,42,.04),0 6px 20px rgba(15,23,42,.04);overflow:hidden;position:relative;min-height:360px}
  .page-card svg{display:block;width:100%;height:auto}
  .loader{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:rgba(247,250,255,0.92);z-index:20}
  .loader.verborgen{display:none}
  .spinner{width:38px;height:38px;border:4px solid #dce9f7;border-top-color:#0067cc;border-radius:50%;animation:draaien 0.8s linear infinite}
  @keyframes draaien{to{transform:rotate(360deg)}}
  .err{color:#cc2222;font-size:13px;font-weight:600;text-align:center;padding:0 20px}
</style>
</head>
<body>

<div class="header-bg">
  <div class="header">
    <div>
      <div class="header-titel">📊 Ensemble 6 pluim+</div>
      <div class="header-sub">Bewolking (fan + categorieën) · Windrichting · Onweer · 850 hPa T · 500 hPa T</div>
    </div>
    <div class="header-rechts">
      <div class="datum" id="hdrDatum">—</div>

</div>

<div class="toolbar">
  <span class="lbl" id="lblStation">Station</span>
  <select id="stSel"></select>
  <span class="lbl" id="lblPlaats">Of plaats</span>
  <input id="plaatsInput" type="text" placeholder="bv. Parijs, New York" style="padding:6px 10px;border-radius:14px;border:1px solid #c5d3e3;background:var(--chip);color:#2a4a70;font-size:12px;font-weight:600;font-family:inherit;min-width:160px">

<div class="page-wrap">

    </div>
    <div id="pageHost"></div>
  </div>
</div>

<script>
const STATIONS = [
  { name:"Rotterdam",        lat:51.9244, lon:4.4777 },
  { name:"De Bilt",          lat:52.1010, lon:5.1800 },
  { name:"Den Helder",       lat:52.9230, lon:4.7800 },
  { name:"Hoek van Holland", lat:51.9789, lon:4.1336 },
  { name:"Maastricht",       lat:50.9100, lon:5.7700 },
  { name:"Enschede",         lat:52.2700, lon:6.8900 },
  { name:"Eindhoven",        lat:51.4416, lon:5.4697 },
  { name:"Wateringen",       lat:52.0244, lon:4.2867 },
  { name:"Dordrecht",        lat:51.8133, lon:4.6900 },
  { name:"Soestdijk",        lat:52.1797, lon:5.2872 },
  { name:"Rhoon",            lat:51.8650, lon:4.4267 },
  { name:"Ridderkerk",       lat:51.8722, lon:4.6075 },
  { name:"Londen",           lat:51.5074, lon:-0.1278 },
];

const DAGEN_KORT = ["zo","ma","di","wo","do","vr","za"];
const DAGEN_LANG = ["zondag","maandag","dinsdag","woensdag","donderdag","vrijdag","zaterdag"];
const MAANDEN = ["jan","feb","mrt","apr","mei","jun","jul","aug","sep","okt","nov","dec"];
const MAANDEN_LANG = ["januari","februari","maart","april","mei","juni","juli","augustus","september","oktober","november","december"];

function beschikbareHoofdRun(nu = new Date()) {
  const HALFDAG = 12 * 3600 * 1000;
  const kandidaat = new Date(Math.floor(nu.getTime() / HALFDAG) * HALFDAG);
  return nu.getTime() >= kandidaat.getTime() + 7 * 3600 * 1000
    ? kandidaat : new Date(kandidaat.getTime() - HALFDAG);
}

const C_GREEN="#2e8b3e", C_BLACK="#1a1a1a", C_RED="#cc0000", C_DARKRED="#8b1414";
const C_NACHT="#ededed", C_GRID="#cccccc", C_AXIS="#333";

let pageSvgString = "";

const urlParams = new URLSearchParams(window.location.search);
const lockMode = urlParams.get('lock') === '1';
const wantedStation = (urlParams.get('station') || urlParams.get('st') || '').toLowerCase().replace(/[\s_-]/g,'');
let initialIdx = 0;
if (wantedStation) {
  const m = STATIONS.findIndex(s => s.name.toLowerCase().replace(/[\s_-]/g,'') === wantedStation);
  if (m >= 0) initialIdx = m;
}
let currentStation = STATIONS[initialIdx];

if (lockMode) {
  document.getElementById('lblStation').style.display = 'none';
  document.getElementById('stSel').style.display = 'none';
  document.getElementById('lblPlaats').textContent = 'Plaats';
}

const stSel = document.getElementById('stSel');
STATIONS.forEach((s,i) => {
  const o = document.createElement('option');
  o.value = i; o.textContent = s.name;
  if (i === initialIdx) o.selected = true;
  stSel.appendChild(o);
});
stSel.addEventListener('change', () => {
  currentStation = STATIONS[stSel.value];
  const u = new URL(window.location);
  u.searchParams.set('station', currentStation.name);
  history.replaceState(null, '', u);
  loadAndRender();
});
document.getElementById('btnRefresh').addEventListener('click', loadAndRender);
document.getElementById('btnPng').addEventListener('click', exportPng);

async function zoekPlaats() {
  const inp = document.getElementById('plaatsInput');
  const err = document.getElementById('plaatsFout');
  err.textContent = '';
  const q = inp.value.trim();
  if (!q) return;
  try {
    const r = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(q)}&count=1&language=nl&format=json`);
    if (!r.ok) throw new Error('HTTP '+r.status);
    const j = await r.json();
    if (!j.results || !j.results.length) { err.textContent = 'Niet gevonden'; return; }
    const hit = j.results[0];
    const label = hit.country_code && hit.country_code !== 'NL' ? `${hit.name} (${hit.country_code})` : hit.name;
    const existing = STATIONS.findIndex(s => Math.abs(s.lat-hit.latitude)<0.01 && Math.abs(s.lon-hit.longitude)<0.01);
    let idx;
    if (existing >= 0) {
      idx = existing;
    } else {
      STATIONS.push({ name: label, lat: hit.latitude, lon: hit.longitude });
      idx = STATIONS.length - 1;
      const o = document.createElement('option');
      o.value = idx; o.textContent = label;
      stSel.appendChild(o);
    }
    stSel.value = idx;
    currentStation = STATIONS[idx];
    const u = new URL(window.location);
    u.searchParams.set('station', currentStation.name);
    history.replaceState(null, '', u);
    loadAndRender();
  } catch(e) {
    err.textContent = 'Zoekfout: '+e.message;
  }
}
document.getElementById('btnZoek').addEventListener('click', zoekPlaats);
document.getElementById('plaatsInput').addEventListener('keydown', e => { if (e.key === 'Enter') zoekPlaats(); });

function nlDate(d, langDay=true) {
  return `${langDay ? DAGEN_LANG[d.getDay()] : DAGEN_KORT[d.getDay()]} ${d.getDate()} ${MAANDEN_LANG[d.getMonth()]} ${d.getFullYear()}`;
}
function nlShortDM(d) { return `${String(d.getDate()).padStart(2,'0')}-${String(d.getMonth()+1).padStart(2,'0')}`; }

async function fetchEnsemble(lat, lon) {
  const url = `https://ensemble-api.open-meteo.com/v1/ensemble?latitude=${lat}&longitude=${lon}`
    + `&hourly=cloudcover,winddirection_10m,cape,temperature_850hPa,temperature_500hPa`
    + `&models=ecmwf_ifs025&forecast_days=15&timezone=Europe%2FAmsterdam`;
  const r = await fetch(url);
  if (!r.ok) throw new Error("Ensemble HTTP "+r.status);
  return r.json();
}
async function fetchHres(lat, lon) {
  const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}`
    + `&hourly=cloudcover,winddirection_10m,cape,temperature_850hPa,temperature_500hPa`
    + `&models=ecmwf_ifs&forecast_days=15&timezone=Europe%2FAmsterdam`;
  const r = await fetch(url);
  if (!r.ok) throw new Error("HRES HTTP "+r.status);
  return r.json();
}

function membersOf(hourly, key) {
  const arrs = [];
  if (hourly[key]) arrs.push(hourly[key].slice());
  for (let i=1; i<=50; i++) {
    const k = `${key}_member${String(i).padStart(2,'0')}`;
    if (hourly[k]) arrs.push(hourly[k].slice());
  }
  return arrs;
}
function fillNaN(arr) { return arr.map(v => (v==null || isNaN(v)) ? 0 : v); }
function trimTrailingZeros(matrix) {
  if (!matrix.length) return matrix;
  const N = matrix[0].length;
  let last = -1;
  for (let t = N-1; t >= 0; t--) {
    let any = false;
    for (const m of matrix) { if (Math.abs(m[t]) > 1e-9) { any = true; break; } }
    if (any) { last = t; break; }
  }
  if (last < 0) last = N - 1;
  return matrix.map(m => m.slice(0, last+1));
}
function agg6(a) {
  const n = Math.floor(a.length / 6) * 6;
  const out = [];
  for (let i=0; i<n; i+=6) {
    let s=0; for (let j=i; j<i+6; j++) s+=a[j]; out.push(s);
  }
  return out;
}
function cumsum(a) { const o=new Array(a.length); let s=0; for (let i=0;i<a.length;i++){s+=a[i]; o[i]=s;} return o; }
function percentile(arrs, p) {
  const N = arrs[0].length, out = new Array(N);
  for (let t=0; t<N; t++) {
    const v = arrs.map(a => a[t]).sort((a,b)=>a-b);
    const idx = (v.length-1)*p, lo=Math.floor(idx), hi=Math.ceil(idx);
    out[t] = v[lo] + (v[hi]-v[lo])*(idx-lo);
  }
  return out;
}
function circMedian(arrs) {
  const N = arrs[0].length, out = new Array(N);
  for (let t=0; t<N; t++) {
    let sx=0, sy=0;
    for (const a of arrs) { const r = (a[t]||0)*Math.PI/180; sx += Math.cos(r); sy += Math.sin(r); }
    let deg = Math.atan2(sy/arrs.length, sx/arrs.length)*180/Math.PI;
    if (deg < 0) deg += 360;
    out[t] = deg;
  }
  return out;
}
function circQuantile(arrs, q) {
  const med = circMedian(arrs);
  const N = arrs[0].length, out = new Array(N);
  for (let t=0; t<N; t++) {
    const deltas = arrs.map(a => {
      let d = ((a[t]||0) - med[t] + 540) % 360 - 180;
      return d;
    }).sort((a,b)=>a-b);
    const idx = (deltas.length-1)*q, lo=Math.floor(idx), hi=Math.ceil(idx);
    const delta = deltas[lo] + (deltas[hi]-deltas[lo])*(idx-lo);
    let val = (med[t] + delta + 360) % 360;
    out[t] = val;
  }
  return out;
}

const CLOUD_CATS = [
  {label:'Onbewolkt',     lo:0,  hi:12,  color:'#f5e642'},
  {label:'Licht bewolkt', lo:12, hi:37,  color:'#dcd28c'},
  {label:'Half bewolkt',  lo:37, hi:62,  color:'#a09464'},
  {label:'Zwaar bewolkt', lo:62, hi:87,  color:'#828296'},
  {label:'Geheel bewolkt',lo:87, hi:101, color:'#373746'},
];
function cloudStackSeries(members) {
  const N = members[0].length;
  return CLOUD_CATS.map(c => {
    const vals = new Array(N);
    for (let t=0; t<N; t++) {
      const col = members.map(m => m[t]).filter(v => v!=null && !isNaN(v));
      vals[t] = col.length ? col.filter(v => v>=c.lo && v<c.hi).length/col.length*100 : 0;
    }
    return { label:c.label, color:c.color, values:vals };
  });
}

const WINDDIR_SECTORS = ['N','NO','O','ZO','Z','ZW','W','NW'];
const WINDDIR_COLORS = {
  N:'#2c8a3a', NO:'#5ec3eb', O:'#3b46c8', ZO:'#d18ad6',
  Z:'#d83333', ZW:'#e69b3a', W:'#f5d142', NW:'#9bd17e'
};
function windDirStackSeries(members) {
  const N = members[0].length;
  return WINDDIR_SECTORS.map((s, si) => {
    const vals = new Array(N);
    for (let t=0; t<N; t++) {
      const col = members.map(m => m[t]).filter(v => v!=null && !isNaN(v));
      if (!col.length) { vals[t] = 0; continue; }
      const cnt = col.filter(d => Math.floor(((d+22.5)%360)/45) === si).length;
      vals[t] = cnt/col.length*100;
    }
    return { label:s, color:WINDDIR_COLORS[s], values:vals };
  });
}

function weatherCategory(code) {
  if (code == null || isNaN(code)) return 'onbekend';
  if (code === 0) return 'helder';
  if (code <= 3) return 'bewolkt';
  if (code <= 49) return 'mist';
  if (code <= 67) return 'regen';
  if (code <= 77) return 'sneeuw';
  if (code <= 82) return 'bui';
  if (code <= 86) return 'sneeuwbui';
  if (code <= 99) return 'onweer';
  return 'onbekend';
}
function weatherCodeFraction(members) {
  const N = members[0].length, M = members.length;
  const cats = ['helder','bewolkt','regen','bui','onweer','sneeuw','sneeuwbui','mist','onbekend'];
  const out = {};
  for (const c of cats) out[c] = new Array(N).fill(0);
  for (let t=0; t<N; t++) {
    for (const m of members) {
      const c = weatherCategory(m[t]);
      out[c][t] += 100/M;
    }
  }
  const droogTotaal = new Array(N), natTotaal = new Array(N), onweerArr = out['onweer'].slice();
  for (let t=0; t<N; t++) {
    droogTotaal[t] = out['helder'][t] + out['bewolkt'][t] + out['mist'][t];
    natTotaal[t]   = out['regen'][t] + out['bui'][t] + out['sneeuw'][t] + out['sneeuwbui'][t];
  }
  return { p10: onweerArr.map(()=>0), p25: onweerArr.map(()=>0), p50: natTotaal, p75: onweerArr.slice().map((v,i)=>natTotaal[i]+v), p90: onweerArr.map(()=>100), categorieën: out };
}

function niceTicks(min, max, count=6) {
  const range = max-min; if (range <= 0) return [min];
  const rough = range/count, mag = Math.pow(10, Math.floor(Math.log10(rough))), norm = rough/mag;
  let step;
  if (norm < 1.5) step = mag; else if (norm < 3) step = 2*mag; else if (norm < 7) step = 5*mag; else step = 10*mag;
  const start = Math.ceil(min/step)*step, ticks=[];
  for (let v=start; v<=max+1e-9; v+=step) ticks.push(Number(v.toFixed(10)));
  return ticks;
}
function pad(min, max, padFrac=0.08, floorZero=false) {
  const r = max-min || 1; let lo = min - r*padFrac;
  if (floorZero && lo < 0) lo = 0;
  return [lo, max + r*padFrac];
}
function rangeOf(arrs, extra=[]) {
  let mn=Infinity, mx=-Infinity;
  for (const a of arrs) for (const v of a) { if (v<mn) mn=v; if (v>mx) mx=v; }
  for (const v of extra) { if (v<mn) mn=v; if (v>mx) mx=v; }
  return [mn, mx];
}

const PAGE_W=2970, PAGE_H=2100;
const PAGE_MARGIN_X=30, PAGE_HEADER_H=110, PAGE_FOOTER_H=40;
const PANEL_GAP=16;
const COLS=2, ROWS=3;
const PANEL_W = (PAGE_W - 2*PAGE_MARGIN_X - (COLS-1)*PANEL_GAP) / COLS;
const GRID_H = PAGE_H - PAGE_HEADER_H - PAGE_FOOTER_H - 2*PAGE_MARGIN_X;
const PANEL_H = (GRID_H - (ROWS-1)*PANEL_GAP) / ROWS;
const PM = { l: 80, r: 80, t: 92, b: 165 };
const PLOT_W = PANEL_W - PM.l - PM.r;
const PLOT_H = PANEL_H - PM.t - PM.b;

function buildPanelSvg({ox, oy, title, ensemble, ctrl, hres, p10, p25, p50, p75, p90, hres2, p502, yMin2, yMax2, fanColor, xMode, yMin, yMax, station, datumTxt, runLabel, footLeft, footRight, nDays, times, valueFmt}) {
  const xMax = xMode==='6h' ? nDays*4 : times.length;
  const xToPx = x => ox + PM.l + (x/xMax)*PLOT_W;
  const yToPx = y => oy + PM.t + (1 - (y-yMin)/(yMax-yMin))*PLOT_H;
  const yToPx2 = y => oy + PM.t + (1 - (y-yMin2)/(yMax2-yMin2))*PLOT_H;
  let s = '';

  s += `<rect x="${ox}" y="${oy}" width="${PANEL_W}" height="${PANEL_H}" fill="#ffffff"/>`;

  const nightBlocks = computeNightBlocks(times, xMode);
  for (const [a,b] of nightBlocks) {
    const x0 = Math.max(ox+PM.l, xToPx(a));
    const x1 = Math.min(ox+PM.l+PLOT_W, xToPx(b));
    if (x1>x0) s += `<rect x="${x0.toFixed(1)}" y="${oy+PM.t}" width="${(x1-x0).toFixed(1)}" height="${PLOT_H}" fill="${C_NACHT}"/>`;
  }

  for (let d=0; d<=nDays; d++) {
    const xv = xMode==='6h' ? d*4 : d*24;
    if (xv > xMax) break;
    const px = xToPx(xv);
    s += `<line x1="${px.toFixed(1)}" y1="${oy+PM.t}" x2="${px.toFixed(1)}" y2="${oy+PM.t+PLOT_H}" stroke="${C_GRID}" stroke-width="1"/>`;
  }

  const fmt = valueFmt || (v => Math.round(v));
  const yticks = niceTicks(yMin, yMax, 6);
  for (const yt of yticks) {
    const py = yToPx(yt);
    s += `<line x1="${ox+PM.l}" y1="${py.toFixed(1)}" x2="${ox+PM.l+PLOT_W}" y2="${py.toFixed(1)}" stroke="${C_GRID}" stroke-width="0.7"/>`;
    s += `<text x="${ox+PM.l-8}" y="${(py+5).toFixed(1)}" font-size="20" text-anchor="end" fill="${C_AXIS}">${fmt(yt)}</text>`;
  }
  if (yMin2 !== undefined) {
    const yticks2 = niceTicks(yMin2, yMax2, 6);
    for (const yt of yticks2) {
      const py = yToPx2(yt);
      s += `<text x="${ox+PM.l+PLOT_W+8}" y="${(py+5).toFixed(1)}" font-size="20" text-anchor="start" fill="#003366">${Math.round(yt)}</text>`;
    }
  } else {
    for (const yt of yticks) {
      const py = yToPx(yt);
      s += `<text x="${ox+PM.l+PLOT_W+8}" y="${(py+5).toFixed(1)}" font-size="20" text-anchor="start" fill="${C_AXIS}">${fmt(yt)}</text>`;
    }
  }

  const pathOf = (arr, yFn) => {
    const f = yFn || yToPx;
    let d=''; let started=false;
    for (let i=0;i<arr.length;i++) {
      const v = arr[i];
      if (v == null || isNaN(v)) { started = false; continue; }
      const px=xToPx(i), py=f(v);
      d += (started?'L':'M')+px.toFixed(1)+','+py.toFixed(1);
      started = true;
    }
    return d;
  };

  const bandPath = (lo, hi, yFn) => {
    const f = yFn || yToPx;
    let d='';
    for (let i=0;i<lo.length;i++) {
      if (lo[i]==null||isNaN(lo[i])) continue;
      d += (i===0?'M':'L')+xToPx(i).toFixed(1)+','+f(hi[i]).toFixed(1);
    }
    for (let i=lo.length-1;i>=0;i--) {
      if (lo[i]==null||isNaN(lo[i])) continue;
      d += 'L'+xToPx(i).toFixed(1)+','+f(lo[i]).toFixed(1);
    }
    d += 'Z';
    return d;
  };

  const fc = fanColor || '#3a7bbf';

  if (arguments[0].stacked) {
    const series = arguments[0].stacked;
    const N = series[0].values.length;
    const bw = PLOT_W / N;
    for (let i=0; i<N; i++) {
      let acc = 0;
      const px = xToPx(i);
      for (const sv of series) {
        const v = sv.values[i];
        if (v == null || isNaN(v) || v <= 0) continue;
        const y1 = yToPx(acc), y2 = yToPx(acc + v);
        s += `<rect x="${px.toFixed(1)}" y="${y2.toFixed(1)}" width="${bw.toFixed(2)}" height="${(y1-y2).toFixed(1)}" fill="${sv.color}"/>`;
        acc += v;
      }
    }
  } else {
    if (p10 && p90) s += `<path d="${bandPath(p10,p90)}" fill="${fc}" fill-opacity="0.18" stroke="none"/>`;
    if (p25 && p75) s += `<path d="${bandPath(p25,p75)}" fill="${fc}" fill-opacity="0.32" stroke="none"/>`;
    if (p50)  s += `<path d="${pathOf(p50)}" fill="none" stroke="${fc}" stroke-width="2.6" stroke-linejoin="round"/>`;
    if (hres) s += `<path d="${pathOf(hres)}" fill="none" stroke="${C_RED}" stroke-width="3.2" stroke-linejoin="round"/>`;

    if (p502) s += `<path d="${pathOf(p502, yToPx2)}" fill="none" stroke="#003366" stroke-width="2.6" stroke-dasharray="10 6" stroke-linejoin="round"/>`;
    if (hres2) s += `<path d="${pathOf(hres2, yToPx2)}" fill="none" stroke="#0066cc" stroke-width="3.2" stroke-dasharray="10 6" stroke-linejoin="round"/>`;
  }

  s += `<rect x="${ox+PM.l}" y="${oy+PM.t}" width="${PLOT_W}" height="${PLOT_H}" fill="none" stroke="${C_AXIS}" stroke-width="1.2"/>`;

  for (let d=0; d<nDays; d++) {
    const xv = xMode==='6h' ? d*4+2 : d*24+12;
    if (xv > xMax) break;
    const labelX = xToPx(xv);
    const dt = new Date(times[0].getTime() + d*86400000);
    const ly = oy+PM.t+PLOT_H+22;
    s += `<text x="${labelX.toFixed(1)}" y="${ly}" font-size="20" text-anchor="middle" fill="${C_AXIS}">${DAGEN_KORT[dt.getDay()]}</text>`;
    s += `<text x="${labelX.toFixed(1)}" y="${ly+22}" font-size="20" text-anchor="middle" fill="${C_AXIS}">${nlShortDM(dt)}</text>`;
  }

  const cx = ox + PANEL_W/2;
  s += `<text x="${cx}" y="${oy+30}" font-size="30" font-weight="700" text-anchor="middle" fill="#1a1a1a">${title}</text>`;
  s += `<text x="${cx}" y="${oy+58}" font-size="20" text-anchor="middle" fill="#444">${station}, ${datumTxt} (Versie ${runLabel})</text>`;

  const legY = oy + PANEL_H - 75;
  const legItems = arguments[0].stacked ? arguments[0].stacked.map(sv => ({color:sv.color, swatch:'block', txt:sv.label})) : p502 ? [
    {color:fc, swatch:'band', txt:"P10–P90 / P25–P75"},
    {color:fc, swatch:'line', txt:"Mediaan"},
    {color:C_RED, swatch:'line', txt:"HRES"},
    {color:'#003366', swatch:'dash', txt:"500 hPa mediaan"},
    {color:'#0066cc', swatch:'dash', txt:"500 hPa HRES"},
  ] : [
    {color:fc, swatch:'band', txt:"P10–P90 (80% kans)"},
    {color:fc, swatch:'band2', txt:"P25–P75 (50% kans)"},
    {color:fc, swatch:'line', txt:"Mediaan (P50)"},
    {color:C_RED, swatch:'line', txt:"HRES"},
  ];
  const totalW = PANEL_W - 80, itemW = totalW / legItems.length;
  legItems.forEach((it,i) => {
    const cxL = ox + 40 + i*itemW + 12;
    if (it.swatch === 'band') {
      s += `<rect x="${cxL}" y="${legY-9}" width="50" height="18" fill="${it.color}" fill-opacity="0.18"/>`;
    } else if (it.swatch === 'band2') {
      s += `<rect x="${cxL}" y="${legY-9}" width="50" height="18" fill="${it.color}" fill-opacity="0.32"/>`;
    } else if (it.swatch === 'block') {
      s += `<rect x="${cxL}" y="${legY-9}" width="22" height="18" fill="${it.color}"/>`;
    } else if (it.swatch === 'dash') {
      s += `<line x1="${cxL}" y1="${legY}" x2="${cxL+50}" y2="${legY}" stroke="${it.color}" stroke-width="2.6" stroke-dasharray="10 6"/>`;
    } else {
      s += `<line x1="${cxL}" y1="${legY}" x2="${cxL+50}" y2="${legY}" stroke="${it.color}" stroke-width="3"/>`;
    }
    const txtX = it.swatch === 'block' ? cxL+28 : cxL+58;
    s += `<text x="${txtX}" y="${legY+6}" font-size="${it.swatch==='block'?16:19}" fill="#222">${it.txt}</text>`;
  });

  const footY = oy + PANEL_H - 18;
  s += `<text x="${ox+20}" y="${footY}" font-size="15" font-style="italic" fill="#666">${footLeft}</text>`;
  s += `<text x="${ox+PANEL_W-20}" y="${footY}" font-size="15" font-style="italic" text-anchor="end" fill="#666">${footRight}</text>`;
  s += `<rect x="${ox}" y="${oy}" width="${PANEL_W}" height="${PANEL_H}" fill="none" stroke="#aaaaaa" stroke-width="1"/>`;
  return s;
}

function computeNightBlocks(times, xMode) {
  const blocks = [];
  for (let i=0; i<times.length; i++) {
    if (times[i].getHours() === 18) {
      let j = i+1;
      while (j < times.length && times[j].getHours() !== 6) j++;
      const a = xMode==='6h' ? i/6 : i;
      const b = xMode==='6h' ? Math.min(j, times.length)/6 : Math.min(j, times.length);
      blocks.push([a, b]);
      i = j-1;
    }
  }
  return blocks;
}

function buildPageSvg(model) {
  let s = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${PAGE_W} ${PAGE_H}" font-family="Arial, sans-serif">`;
  s += `<rect x="0" y="0" width="${PAGE_W}" height="${PAGE_H}" fill="#ffffff"/>`;
  s += `<text x="${PAGE_W/2}" y="60" font-size="42" font-weight="700" text-anchor="middle" fill="#1a1a1a">Ensemble 6 pluim+ — ${model.station}</text>`;
  s += `<text x="${PAGE_W/2}" y="92" font-size="22" text-anchor="middle" fill="#555">ECMWF IFS-ENS · ${model.nMembers} leden + Controle + HRES · ${model.datumTxt} (Versie ${model.runLabel})</text>`;

  for (let i=0; i<model.panels.length; i++) {
    const r = Math.floor(i/COLS), c = i%COLS;
    const ox = PAGE_MARGIN_X + c*(PANEL_W+PANEL_GAP);
    const oy = PAGE_HEADER_H + PAGE_MARGIN_X + r*(PANEL_H+PANEL_GAP);
    s += buildPanelSvg({ ox, oy, station: model.station, datumTxt: model.datumTxt, runLabel: model.runLabel, footLeft: model.footLeft, footRight: model.footRight, nDays: model.nDays, times: model.times, ...model.panels[i] });
  }
  s += `<text x="${PAGE_W/2}" y="${PAGE_H-15}" font-size="16" text-anchor="middle" fill="#777" font-style="italic">© Weerlab.nl · Data: ECMWF IFS-ENS via Open-Meteo · A4 landscape</text>`;
  s += `</svg>`;
  return s;
}

async function loadAndRender() {
  const loader = document.getElementById('loader');
  const host = document.getElementById('pageHost');
  loader.classList.remove('verborgen');
  loader.innerHTML = `<div class="spinner"></div><div style="font-size:13px;font-weight:600;color:#2a4a70">Ensemble laden voor ${currentStation.name}…</div>`;
  host.innerHTML = '';

  try {
    const [ens, hres] = await Promise.all([
      fetchEnsemble(currentStation.lat, currentStation.lon),
      fetchHres(currentStation.lat, currentStation.lon),
    ]);
    const model = buildModel(ens, hres);
    pageSvgString = buildPageSvg(model);
    host.innerHTML = pageSvgString;

    document.getElementById('hdrDatum').textContent = model.datumTxt.charAt(0).toUpperCase() + model.datumTxt.slice(1);
    document.getElementById('hdrRun').textContent = `Versie ${model.runLabel} · ${model.nMembers} leden`;
    document.getElementById('runinfo').textContent = `Run: ${model.runLabel} · ${currentStation.name} (${currentStation.lat.toFixed(3)}, ${currentStation.lon.toFixed(3)})`;
    loader.classList.add('verborgen');
  } catch (e) {
    loader.innerHTML = `<div class="err">⚠ ${e.message}</div><button class="btn btn-primair" onclick="loadAndRender()">Opnieuw</button>`;
  }
}

function buildModel(ens, hres) {
  const hourly = ens.hourly;
  const times = hourly.time.map(t => new Date(t));

  const cloudMembers = trimTrailingZeros(membersOf(hourly, 'cloudcover').map(fillNaN));
  const wdirMembers  = trimTrailingZeros(membersOf(hourly, 'winddirection_10m').map(fillNaN));
  const capeMembers  = trimTrailingZeros(membersOf(hourly, 'cape').map(fillNaN));
  const t850Members  = trimTrailingZeros(membersOf(hourly, 'temperature_850hPa').map(fillNaN));
  const t500Members  = trimTrailingZeros(membersOf(hourly, 'temperature_500hPa').map(fillNaN));

  const N = cloudMembers[0].length;
  const useTimes = times.slice(0, N);
  const nDays = Math.floor(N / 24);

  const hr = hres.hourly;
  const sliceN = arr => arr.slice(0, N).map(v => v==null||isNaN(v) ? 0 : v);
  const cloudHres = sliceN(hr.cloudcover || []);
  const capeHres  = sliceN(hr.cape || []);
  const t850Hres  = sliceN(hr.temperature_850hPa || []);
  const t500Hres  = sliceN(hr.temperature_500hPa || []);

  const cloudEns = cloudMembers.slice(1);
  const capeEns  = capeMembers.slice(1);
  const t850Ens  = t850Members.slice(1);
  const t500Ens  = t500Members.slice(1);

  const pct = (arrs, p) => percentile(arrs, p);
  const pcts = arrs => ({ p10:pct(arrs,0.1), p25:pct(arrs,0.25), p50:pct(arrs,0.5), p75:pct(arrs,0.75), p90:pct(arrs,0.9) });

  const cloudP = pcts(cloudEns);
  const capeP  = pcts(capeEns);
  const t850P  = pcts(t850Ens);
  const t500P  = pcts(t500Ens);

  const [t850Mn, t850Mx] = pad(...rangeOf([t850P.p10, t850P.p90], t850Hres), 0.08);
  const [t500Mn, t500Mx] = pad(...rangeOf([t500P.p10, t500P.p90], t500Hres), 0.08);

  const runDate = useTimes[0];
  const hoofdRun = beschikbareHoofdRun();
  const runLabel = `${DAGEN_KORT[hoofdRun.getUTCDay()]} ${String(hoofdRun.getUTCHours()).padStart(2,'0')} UTC`;
  const datumTxt = `${DAGEN_LANG[runDate.getDay()]} ${runDate.getDate()} ${MAANDEN_LANG[runDate.getMonth()]} ${runDate.getFullYear()}`;
  const todayStr = `${String(runDate.getDate()).padStart(2,'0')}-${String(runDate.getMonth()+1).padStart(2,'0')}-${runDate.getFullYear()}`;

  const cloudStack = cloudStackSeries(cloudMembers);
  const wdirStack  = windDirStackSeries(wdirMembers);

  const panels = [
    { title:"Bewolking (%) — fanplot", ...cloudP, hres:cloudHres, fanColor:'#5a7ba8', xMode:'1h', yMin:0, yMax:100, valueFmt:v=>Math.round(v) },
    { title:"Bewolking — kans per categorie", stacked:cloudStack, xMode:'1h', yMin:0, yMax:100, valueFmt:v=>Math.round(v) },
    { title:"Windrichting — kans per sector", stacked:wdirStack, xMode:'1h', yMin:0, yMax:100, valueFmt:v=>Math.round(v) },
    { title:"Onweer — CAPE (J/kg)", ...capeP, hres:capeHres, fanColor:'#cc6600', xMode:'1h', yMin:0, yMax:5000 },
    { title:"Temperatuur 850 hPa (°C)", ...t850P, hres:t850Hres, fanColor:'#cc0033', xMode:'1h', yMin:Math.floor(t850Mn/2)*2, yMax:Math.ceil(t850Mx/2)*2, valueFmt:v=>v.toFixed(0)+"°" },
    { title:"Temperatuur 500 hPa (°C)", ...t500P, hres:t500Hres, fanColor:'#5566cc', xMode:'1h', yMin:Math.floor(t500Mn/2)*2, yMax:Math.ceil(t500Mx/2)*2, valueFmt:v=>v.toFixed(0)+"°" },
  ];

  return {
    station: currentStation.name,
    nMembers: cloudEns.length,
    datumTxt, runLabel,
    footLeft: `Weerlab.nl ${todayStr}, gegenereerd op basis van ECMWF/Open-Meteo`,
    footRight: `Bron: ECMWF IFS-ENS`,
    nDays, times: useTimes, panels,
  };
}

function exportPng() {
  const btn = document.getElementById('btnPng');
  if (!pageSvgString) { alert("Pluim eerst laden"); return; }
  btn.disabled = true; const old = btn.textContent; btn.textContent = "PNG renderen…";
  const blob = new Blob([pageSvgString], { type:'image/svg+xml;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const img = new Image();
  img.onload = () => {
    const SCALE = 1.18;
    const w = Math.round(PAGE_W * SCALE);
    const h = Math.round(PAGE_H * SCALE);
    const canvas = document.createElement('canvas');
    canvas.width = w; canvas.height = h;
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = "#ffffff"; ctx.fillRect(0,0,w,h);
    ctx.drawImage(img, 0, 0, w, h);
    canvas.toBlob(b => {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(b);
      a.download = `pluim_${currentStation.name.toLowerCase().replace(/\s+/g,'_')}_a4.png`;
      a.click();
      URL.revokeObjectURL(url);
      btn.disabled = false; btn.textContent = old;
    }, 'image/png');
  };
  img.onerror = () => { alert("PNG-render mislukt"); btn.disabled = false; btn.textContent = old; };
  img.src = url;
}

loadAndRender();
</script>
