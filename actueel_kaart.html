<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Actuele Waarnemingen – Ed Aldus WM</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: Arial, sans-serif; background: #f0f4f8; color: #1a2b40; }
.header { background: #00205b; padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; border-bottom: 2px solid #2ec4e8; }
.header-titel { color: white; font-size: 14px; font-weight: 700; }
.header-sub { color: #a8c4e8; font-size: 11px; margin-top: 2px; }
.toolbar { background: white; padding: 10px 16px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; border-bottom: 1px solid #dde6f0; }
.btn { padding: 5px 14px; border-radius: 16px; border: 1px solid #c5d3e3; background: #f0f4f8; color: #2a4a70; font-size: 12px; font-weight: 600; cursor: pointer; transition: all 0.12s; }
.btn:hover { background: #dce9f7; }
.btn.actief { color: white; border-color: transparent; }
.btn.ta.actief   { background: #c0392b; }
.btn.ff.actief   { background: #2471a3; }
.btn.fx.actief   { background: #6c3483; }
.btn.t10n.actief { background: #1a7a4a; }
.btn.vv.actief   { background: #5d4037; }
.btn.uu.actief   { background: #0277bd; }
.btn-save { padding: 5px 16px; border-radius: 16px; border: none; background: #003366; color: white; font-size: 12px; font-weight: 700; cursor: pointer; margin-left: auto; }
.kaart-wrap { display: flex; justify-content: center; padding: 12px 16px; }
.kaart-outer { width: 100%; max-width: 560px; }
.kaart-header { background: #003366; color: white; padding: 8px 14px; border-radius: 4px 4px 0 0; display: flex; justify-content: space-between; align-items: center; }
.kh-links { font-size: 13px; font-weight: 700; }
.kh-sub { font-size: 10px; color: #a8c8e8; margin-top: 1px; }
.kh-rechts { font-size: 13px; font-weight: 700; text-align: right; }
.kh-rechts-sub { font-size: 10px; color: #a8c8e8; }
.kaart-container { position: relative; width: 100%; }
.kaart-container img { width: 100%; display: block; }
.kaart-container svg { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
.zoom-hint { text-align: center; font-size: 11px; color: #888; padding: 4px 0 0; cursor: pointer; }
.legenda { display: flex; gap: 6px; flex-wrap: wrap; padding: 0 16px 16px; justify-content: center; }
.leg-item { display: flex; align-items: center; gap: 4px; font-size: 11px; color: #5a7090; }
.leg-blok { width: 14px; height: 14px; border-radius: 3px; border: 1px solid #ccc; }
.status { text-align: center; padding: 12px; font-size: 12px; color: #888; }
#lightbox { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.88); z-index: 1000; justify-content: center; align-items: center; }
#lightbox.actief { display: flex; }
#lightbox img { max-width: 95vw; max-height: 95vh; border-radius: 6px; }
#lb-sluit { position: fixed; top: 16px; right: 22px; font-size: 2em; color: white; cursor: pointer; }
</style>
</head>
<body>

<div class="header">
  <div>
    <div class="header-titel">Ed Aldus WM — Actuele Waarnemingen</div>
    <div class="header-sub">KNMI 10-minuten metingen · <span id="hdr-update">laden...</span></div>
  </div>
</div>

<div class="toolbar">
  <div style="display:flex;gap:4px;flex-wrap:wrap;" id="param-btns">
    <button class="btn ta actief" data-param="ta">🌡 Temperatuur</button>
    <button class="btn ff" data-param="ff">💨 Wind</button>
    <button class="btn fx" data-param="fx">⚡ Windstoot</button>
    <button class="btn t10n" data-param="t10n">🌿 Grastemperatuur</button>
    <button class="btn vv" data-param="vv">👁 Zicht</button>
    <button class="btn uu" data-param="uu">💧 Vochtigheid</button>
  </div>
  <button class="btn-save" onclick="slaOp()">⬇ Opslaan</button>
</div>

<div class="kaart-wrap">
  <div class="kaart-outer">
    <div class="kaart-header" id="kaart-header">
      <div>
        <div class="kh-links">Ed Aldus WM</div>
        <div class="kh-sub">Waarnemingen KNMI</div>
      </div>
      <div style="text-align:right">
        <div class="kh-rechts" id="kh-dag">–</div>
        <div class="kh-rechts-sub" id="kh-param">Temperatuur (°C)</div>
      </div>
    </div>
    <div class="kaart-container" id="kaart-container" onclick="openZoom()" style="cursor:zoom-in">
      <img src="kaart_basis_nl.png" id="kaart-basis" alt="Basiskaart">
      <svg id="nl-kaart" viewBox="0 0 800 1100" xmlns="http://www.w3.org/2000/svg"></svg>
    </div>
    <div class="zoom-hint" onclick="openZoom()">🔍 klik voor vergroting</div>
  </div>
</div>

<div class="legenda" id="legenda"></div>
<div class="status" id="status">Laden...</div>

<div id="lightbox" onclick="sluitZoom()">
  <span id="lb-sluit" onclick="sluitZoom()">✕</span>
  <img id="lb-img" src="" alt="">
</div>

<script>
const LON_MIN=3.3, LON_MAX=7.4, LAT_MIN=50.45, LAT_MAX=53.8;
const SVG_W=800, SVG_H=1100;
function lonToX(lon) { return (lon-LON_MIN)/(LON_MAX-LON_MIN)*SVG_W; }
function latToY(lat) { return (1-(lat-LAT_MIN)/(LAT_MAX-LAT_MIN))*SVG_H; }

const BFT = [0.3,1.6,3.4,5.5,8.0,10.8,13.9,17.2,20.8,24.5,28.5,32.7];
function msToBft(ms) {
  if (ms==null) return 0;
  let b=0; for(let i=0;i<BFT.length;i++){if(ms>=BFT[i])b=i+1;else break;} return b;
}
function windpijl(dd) {
  if (dd==null) return '';
  const p=['↓','↙','←','↖','↑','↗','→','↘'];
  return p[Math.round(dd/45)%8];
}

const PARAMS = {
  ta:   { label:"Temperatuur (°C)",       eenheid:"°",    decimalen:1,
          kleuren:[["#084594","≤0°"],["#4292c6","5°"],["#9ecae1","10°"],["#ffffcc","15°"],["#fed976","20°"],["#fd8d3c","25°"],["#800026","30°+"]],
          schaal:[-5,30] },
  ff:   { label:"Gem. windsnelheid (m/s)",eenheid:"m/s",  decimalen:1,
          kleuren:[["#f7fbff","0"],["#c6dbef","2"],["#6baed6","5"],["#2171b5","8"],["#08306b","12+"]],
          schaal:[0,15] },
  fx:   { label:"Max windstoot (m/s)",    eenheid:"m/s",  decimalen:1,
          kleuren:[["#d4b896","<5"],["#b5835a","10"],["#8b5e3c","15"],["#6b3a1f","20"],["#3d1a08","25+"]],
          schaal:[0,30] },
  t10n: { label:"Grastemperatuur (°C)",   eenheid:"°",    decimalen:1,
          kleuren:[["#1a3a6b","≤-5°"],["#2980b9","0°"],["#a8d8ea","5°"],["#ffffcc","10°"],["#fed976","15°"],["#fd8d3c","20°+"]],
          schaal:[-10,25] },
  vv:   { label:"Zicht (m)",              eenheid:"m",    decimalen:0,
          kleuren:[["#800026","<200m"],["#e31a1c","500m"],["#fd8d3c","1km"],["#fecc5c","5km"],["#ffffb2","10km+"]],
          schaal:[0,10000] },
  uu:   { label:"Relatieve vochtigheid (%)", eenheid:"%",  decimalen:0,
          kleuren:[["#fff7bc","30%"],["#fec44f","50%"],["#d95f0e","70%"],["#993404","85%"],["#4d1600","100%"]],
          schaal:[20,100] },
};


let stationData = {}, huidigParam = "ta";

function hexToRgb(hex) {
  return [parseInt(hex.slice(1,3),16),parseInt(hex.slice(3,5),16),parseInt(hex.slice(5,7),16)];
}
function interpKleur(val, schaal, stops) {
  const t = Math.max(0,Math.min(1,(val-schaal[0])/(schaal[1]-schaal[0])));
  const colors = stops.map(s=>hexToRgb(s[0]));
  const idx = Math.min(colors.length-2, Math.floor(t*(colors.length-1)));
  const f = t*(colors.length-1)-idx;
  const a=colors[idx], b=colors[idx+1];
  const r=Math.round(a[0]+f*(b[0]-a[0])), g=Math.round(a[1]+f*(b[1]-a[1])), bl=Math.round(a[2]+f*(b[2]-a[2]));
  const lum=(0.299*r+0.587*g+0.114*bl)/255;
  return [`rgb(${r},${g},${bl})`, lum<0.55?"white":"#222"];
}

function ns(tag) { return document.createElementNS("http://www.w3.org/2000/svg",tag); }

function tekenKaart() {
  const svg = document.getElementById("nl-kaart");
  svg.innerHTML = "";
  const p = PARAMS[huidigParam];
  if (!p) return;

  const namen = Object.keys(stationData);
  namen.forEach(naam => {
    const st = stationData[naam];
    if (!st || st.lon==null || st.lat==null) return;
    const val = st[huidigParam];
    if (val == null) return;

    const cx = lonToX(st.lon), cy = latToY(st.lat);
    const [bg, fg] = interpKleur(val, p.schaal, p.kleuren);

    const g = ns("g");
    const r = 22;
    const circle = ns("circle");
    circle.setAttribute("cx", cx); circle.setAttribute("cy", cy);
    circle.setAttribute("r", r);
    circle.setAttribute("fill", bg);
    circle.setAttribute("stroke", "white");
    circle.setAttribute("stroke-width", "1.5");
    g.appendChild(circle);

    // Waarde tekst
    let tekst;
    if (huidigParam === "ff") {
      const bft = msToBft(val);
      tekst = `${windpijl(st.dd)} ${bft}`;
    } else if (huidigParam === "fx") {
      tekst = (val * 3.6).toFixed(0);
    } else if (huidigParam === "vv") {
      tekst = val >= 10000 ? "10+" : val >= 1000 ? (val/1000).toFixed(1)+"k" : val.toFixed(0);
    } else if (huidigParam === "uu") {
      tekst = val.toFixed(0) + "%";
    } else {
      tekst = val.toFixed(p.decimalen) + (huidigParam==="ta"||huidigParam==="t10n" ? "°" : "");
    }

    const txt = ns("text");
    txt.setAttribute("x", cx); txt.setAttribute("y", cy+4);
    txt.setAttribute("text-anchor", "middle");
    txt.setAttribute("font-size", huidigParam==="ff" ? "13" : "12");
    txt.setAttribute("font-weight", "bold");
    txt.setAttribute("font-family", "Arial,sans-serif");
    txt.setAttribute("fill", fg);
    txt.textContent = tekst;
    g.appendChild(txt);
    svg.appendChild(g);
  });

  // Copyright + tijdstempel
  const cr = ns("text");
  cr.setAttribute("x", SVG_W-10); cr.setAttribute("y", SVG_H-12);
  cr.setAttribute("text-anchor","end"); cr.setAttribute("font-size","18");
  cr.setAttribute("font-family","Arial,sans-serif"); cr.setAttribute("font-style","italic");
  cr.setAttribute("fill","#888888");
  cr.textContent = "© Ed Aldus / KNMI";
  svg.appendChild(cr);

  const ts = ns("text");
  ts.setAttribute("x", 10); ts.setAttribute("y", SVG_H-12);
  ts.setAttribute("text-anchor","start"); ts.setAttribute("font-size","18");
  ts.setAttribute("font-family","Arial,sans-serif"); ts.setAttribute("font-style","italic");
  ts.setAttribute("fill","#888888");
  ts.textContent = "Stand: " + document.getElementById("hdr-update").textContent;
  svg.appendChild(ts);
}

function maakLegenda() {
  const p = PARAMS[huidigParam];
  if (!p) return;
  document.getElementById("legenda").innerHTML = p.kleuren.map(([k,l]) =>
    `<div class="leg-item"><div class="leg-blok" style="background:${k}"></div>${l}</div>`
  ).join("");
}

function update() {
  const p = PARAMS[huidigParam];
  document.getElementById("kh-param").textContent = p ? p.label : "";
  const nu = new Date();
  document.getElementById("kh-dag").textContent =
    nu.toLocaleDateString("nl-NL",{weekday:"long",day:"numeric",month:"short"});
  tekenKaart();
  maakLegenda();
  document.getElementById("status").textContent = "";
}

function laad() {
  fetch("actueel.json?t=" + Date.now())
    .then(r => r.json())
    .then(json => {
      stationData = json.stations || {};
      document.getElementById("hdr-update").textContent = json.bijgewerkt || "";
      document.getElementById("status").textContent = "";
      update();
    })
    .catch(e => {
      document.getElementById("status").textContent = "Kon actueel.json niet laden: " + e.message;
    });
}

function tekenHeader(ctx, breedte, hoogte) {
  ctx.fillStyle = "#003366"; ctx.fillRect(0,0,breedte,hoogte);
  ctx.fillStyle="#4a90c4"; ctx.fillRect(0,hoogte-2,breedte,2);
  ctx.fillStyle="white"; ctx.font="bold 14px Arial"; ctx.textAlign="left";
  ctx.fillText("Ed Aldus WM",14,20);
  ctx.fillStyle="#a8c8e8"; ctx.font="10px Arial";
  ctx.fillText("Waarnemingen KNMI",14,34);
  ctx.fillStyle="white"; ctx.font="bold 14px Arial"; ctx.textAlign="right";
  ctx.fillText(document.getElementById("kh-dag").textContent,breedte-14,20);
  ctx.fillStyle="#a8c8e8"; ctx.font="10px Arial";
  ctx.fillText(document.getElementById("kh-param").textContent,breedte-14,34);
  ctx.textAlign="left";
}

function openZoom() {
  const img=document.getElementById("kaart-basis");
  const svg=document.getElementById("nl-kaart");
  const header=document.getElementById("kaart-header");
  const canvas=document.createElement("canvas");
  const scale=2;
  canvas.width=img.naturalWidth*scale;
  canvas.height=(img.naturalHeight+header.offsetHeight)*scale;
  const ctx=canvas.getContext("2d");
  ctx.scale(scale,scale);
  tekenHeader(ctx,img.naturalWidth,header.offsetHeight);
  ctx.drawImage(img,0,header.offsetHeight);
  const serializer=new XMLSerializer();
  const svgStr=serializer.serializeToString(svg);
  const blob=new Blob([svgStr],{type:"image/svg+xml"});
  const url=URL.createObjectURL(blob);
  const svgImg=new Image();
  svgImg.onload=()=>{
    ctx.drawImage(svgImg,0,header.offsetHeight,img.naturalWidth,img.naturalHeight);
    URL.revokeObjectURL(url);
    document.getElementById("lb-img").src=canvas.toDataURL("image/png");
    document.getElementById("lightbox").classList.add("actief");
  };
  svgImg.src=url;
}

function sluitZoom() { document.getElementById("lightbox").classList.remove("actief"); }
document.addEventListener("keydown",e=>{if(e.key==="Escape")sluitZoom();});

function slaOp() {
  const img=document.getElementById("kaart-basis");
  const svg=document.getElementById("nl-kaart");
  const header=document.getElementById("kaart-header");
  const canvas=document.createElement("canvas");
  const scale=2;
  canvas.width=img.naturalWidth*scale;
  canvas.height=(img.naturalHeight+header.offsetHeight)*scale;
  const ctx=canvas.getContext("2d");
  ctx.scale(scale,scale);
  tekenHeader(ctx,img.naturalWidth,header.offsetHeight);
  ctx.drawImage(img,0,header.offsetHeight);
  const serializer=new XMLSerializer();
  const svgStr=serializer.serializeToString(svg);
  const blob=new Blob([svgStr],{type:"image/svg+xml"});
  const url=URL.createObjectURL(blob);
  const svgImg=new Image();
  svgImg.onload=()=>{
    ctx.drawImage(svgImg,0,header.offsetHeight,img.naturalWidth,img.naturalHeight);
    URL.revokeObjectURL(url);
    const a=document.createElement("a");
    a.href=canvas.toDataURL("image/png");
    a.download=`edaldus_actueel_${huidigParam}_${new Date().toISOString().slice(0,16).replace(':','-')}.png`;
    a.click();
  };
  svgImg.src=url;
}

document.getElementById("param-btns").addEventListener("click", e => {
  const btn = e.target.closest(".btn"); if (!btn) return;
  huidigParam = btn.dataset.param;
  document.querySelectorAll(".btn").forEach(b => b.classList.remove("actief"));
  btn.classList.add("actief");
  update();
});

const imgEl = document.getElementById("kaart-basis");
if (imgEl.complete) laad(); else imgEl.onload = laad;

// Auto-refresh elke 10 minuten
setInterval(laad, 10 * 60 * 1000);
</script>
</body>
</html>
