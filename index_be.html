<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <title>Ed Aldus WM – Weerkaarten België</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #f0f4f8; color: #222; }

    .header {
      background: #003366;
      color: white;
      padding: 14px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }
    .header-titel { font-size: 1.1em; font-weight: bold; }
    .header-sub { font-size: 0.75em; color: #a8c4e8; margin-top: 3px; }
    .header-sub a { color: #a8c4e8; }

    .toolbar {
      background: white;
      border-bottom: 1px solid #dde6f0;
      padding: 10px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }
    .btn-groen {
      background: #27ae60;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      font-size: 0.85em;
    }

    .tabs {
      display: flex;
      border-bottom: 2px solid #c5d3e3;
      background: #e4eaf2;
      overflow-x: auto;
    }
    .tab {
      padding: 12px 20px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.88em;
      color: #5a7090;
      border-bottom: 3px solid transparent;
      white-space: nowrap;
      transition: color 0.15s;
    }
    .tab:hover { color: #003366; }
    .tab.actief { color: #003366; border-bottom-color: #003366; background: white; }

    .tab-inhoud { display: none; padding: 16px; }
    .tab-inhoud.actief { display: block; }

    .kaarten {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
    }
    .kaart-item {
      background: white;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.15s, box-shadow 0.15s;
      width: 280px;
    }
    .kaart-item:hover { transform: translateY(-2px); box-shadow: 0 4px 16px rgba(0,0,0,0.14); }
    .kaart-item img { width: 100%; display: block; }
    .kaart-label {
      padding: 8px 10px;
      font-size: 0.78em;
      color: #5a7090;
      font-weight: 600;
      text-align: center;
    }

    /* Lightbox */
    .lightbox {
      display: none;
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.88);
      z-index: 1000;
      justify-content: center;
      align-items: center;
    }
    .lightbox img {
      max-width: 95vw;
      max-height: 95vh;
      border-radius: 6px;
    }
    .lightbox-sluit {
      position: absolute; top: 16px; right: 20px;
      color: white; font-size: 2em; cursor: pointer; font-weight: bold;
    }
    .lightbox-nav {
      position: absolute;
      top: 50%; transform: translateY(-50%);
      background: rgba(255,255,255,0.15);
      color: white; font-size: 2em;
      border: none; cursor: pointer;
      padding: 12px 18px; border-radius: 6px;
    }
    #lb-prev { left: 10px; }
    #lb-next { right: 10px; }

    .geen-kaarten { color: #888; font-style: italic; padding: 20px; }
    .subtab { padding: 6px 16px; background: #eef3fa; border: 1px solid #c0d0e4; border-radius: 5px; cursor: pointer; font-size: 0.8em; color: #444; font-weight: 600; }
    .subtab:hover { background: #d8e6f5; }
    .subtab.actief { background: #003366; color: white; border-color: #003366; }
    .kaart-footer { padding: 10px 12px; display: flex; justify-content: space-between; align-items: center; background: #f8f9fa; border-top: 1px solid #e0e0e0; gap: 8px; }
  .kaart-naam { font-size: 0.80em; color: #333; font-weight: 600; }
  .btn-down { background: #003366; color: white; border: none; padding: 5px 12px; border-radius: 4px; cursor: pointer; font-size: 0.78em; text-decoration: none; }
  .btn-down:hover { background: #0055aa; }
</style>
</head>
<body>

<div class="header">
  <div>
    <div class="header-titel">Ed Aldus WM</div>
    <div class="header-sub">
      MOS kaarten ECMWF/ICON · DWD MOSMIX &nbsp;|&nbsp;
      <a href="index.html">🇳🇱 Nederland</a> &nbsp;·&nbsp;
      <strong style="color:white;">🇧🇪 België</strong>
    </div>
  </div>
  <div style="display:flex;align-items:center;gap:10px;">
    <span id="update-lbl" style="font-size:0.75em;color:#a8c4e8;"></span>
  </div>
</div>

<div class="toolbar">
  <button class="btn-groen" onclick="downloadAlles()">⬇ Download alle kaarten</button>
  <span style="font-size:0.78em;color:#777;">of download per kaart hieronder</span>
</div>

<div class="tabs">
  <div class="tab actief" id="tab-be-temp" onclick="wisselTab('be-temp')">🌡️ Temperatuur</div>
  <div class="tab" id="tab-be-wind" onclick="wisselTab('be-wind')">💨 Wind</div>
</div>

<div class="tab-inhoud actief" id="inhoud-be-temp">
  <div style="display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap;">
    <div class="subtab actief" id="subtab-be-temp"       onclick="wisselSubtab('be-temp')">🌡️ Temp</div>
    <div class="subtab"        id="subtab-be-temp-dag"   onclick="wisselSubtab('be-temp-dag')">☀️ Max 06-18</div>
    <div class="subtab"        id="subtab-be-temp-nacht" onclick="wisselSubtab('be-temp-nacht')">🌙 Min 18-06</div>
    <div class="subtab"        id="subtab-be-gevoels"    onclick="wisselSubtab('be-gevoels')">🧥 Gevoels</div>
    <div class="subtab"        id="subtab-be-dauwpunt"   onclick="wisselSubtab('be-dauwpunt')">💧 Dauwpunt</div>
    <div class="subtab"        id="subtab-be-t5cm"       onclick="wisselSubtab('be-t5cm')">🌱 Grondvorst</div>
  </div>
  <div id="subinhoud-be-temp"       style="display:block"><div class="kaarten" id="kaarten-be-temp"><p class="geen-kaarten">Kaarten laden...</p></div></div>
  <div id="subinhoud-be-temp-dag"   style="display:none" ><div class="kaarten" id="kaarten-be-temp-dag"></div></div>
  <div id="subinhoud-be-temp-nacht" style="display:none" ><div class="kaarten" id="kaarten-be-temp-nacht"></div></div>
  <div id="subinhoud-be-gevoels"    style="display:none" ><div class="kaarten" id="kaarten-be-gevoels"></div></div>
  <div id="subinhoud-be-dauwpunt"   style="display:none" ><div class="kaarten" id="kaarten-be-dauwpunt"></div></div>
  <div id="subinhoud-be-t5cm"       style="display:none" ><div class="kaarten" id="kaarten-be-t5cm"></div></div>
</div>

<div class="tab-inhoud" id="inhoud-be-wind">
  <div style="display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap;">
    <div class="subtab actief" id="subtab-be-wind-dag"   onclick="wisselSubtab('be-wind-dag')">☀️ Dag 06-18</div>
    <div class="subtab"        id="subtab-be-wind-nacht" onclick="wisselSubtab('be-wind-nacht')">🌙 Nacht 18-06</div>
  </div>
  <div id="subinhoud-be-wind-dag"   style="display:block"><div class="kaarten" id="kaarten-be-wind-dag"></div></div>
  <div id="subinhoud-be-wind-nacht" style="display:none" ><div class="kaarten" id="kaarten-be-wind-nacht"></div></div>
</div>

<!-- Lightbox -->
<div class="lightbox" id="lightbox" onclick="sluitLightbox()">
  <span class="lightbox-sluit" onclick="sluitLightbox()">✕</span>
  <button class="lightbox-nav" id="lb-prev" onclick="event.stopPropagation();navLightbox(-1)">◀</button>
  <img id="lightbox-img" src="" alt="">
  <button class="lightbox-nav" id="lb-next" onclick="event.stopPropagation();navLightbox(1)">▶</button>
</div>

<script>
let beTempLijst = [], beTempDagLijst = [], beTempNachtLijst = [];
let beWindDagLijst = [], beWindNachtLijst = [];
let beGevoelsLijst = [], beDauwpuntLijst = [], beT5cmLijst = [];
let activeLijst = [];
let huidigIndex = 0;

const NL_DAGEN   = ["Zondag","Maandag","Dinsdag","Woensdag","Donderdag","Vrijdag","Zaterdag"];
const NL_MAANDEN = ["","jan","feb","mrt","apr","mei","jun","jul","aug","sep","okt","nov","dec"];
const MND_MAP = {jan:1,feb:2,mrt:3,mar:3,apr:4,mei:5,may:5,jun:6,jul:7,aug:8,sep:9,okt:10,oct:10,nov:11,dec:12};

function wisselTab(tab) {
  document.querySelectorAll(".tab").forEach(t => t.classList.remove("actief"));
  document.querySelectorAll(".tab-inhoud").forEach(t => t.classList.remove("actief"));
  document.getElementById("tab-" + tab).classList.add("actief");
  document.getElementById("inhoud-" + tab).classList.add("actief");
  if (tab === "be-temp")      activeLijst = beTempLijst;
  else if (tab === "be-wind") activeLijst = beWindDagLijst;
}

function wisselSubtab(sub) {
  const subs = ["be-temp","be-temp-dag","be-temp-nacht","be-gevoels","be-dauwpunt","be-t5cm",
                "be-wind-dag","be-wind-nacht"];
  subs.forEach(s => {
    const btn = document.getElementById("subtab-" + s);
    const div = document.getElementById("subinhoud-" + s);
    if (btn) btn.classList.toggle("actief", s === sub);
    if (div) div.style.display = (s === sub) ? "block" : "none";
  });
  if      (sub === "be-temp")       activeLijst = beTempLijst;
  else if (sub === "be-temp-dag")   activeLijst = beTempDagLijst;
  else if (sub === "be-temp-nacht") activeLijst = beTempNachtLijst;
  else if (sub === "be-gevoels")    activeLijst = beGevoelsLijst;
  else if (sub === "be-dauwpunt")   activeLijst = beDauwpuntLijst;
  else if (sub === "be-t5cm")       activeLijst = beT5cmLijst;
  else if (sub === "be-wind-dag")   activeLijst = beWindDagLijst;
  else if (sub === "be-wind-nacht") activeLijst = beWindNachtLijst;
}

function datumUitNaam(naam) {
  const m = naam.match(/(\d{2})([a-z]{3})(\d{4})/);
  if (!m) return null;
  const mnd = MND_MAP[m[2]];
  if (!mnd) return null;
  return new Date(parseInt(m[3]), mnd - 1, parseInt(m[1]));
}

function dagLabel(naam) {
  const d = datumUitNaam(naam);
  if (!d) return naam.replace("kaart_be_temp_","").replace(".png","");
  if (naam.includes("kaart_be_temp_nacht_")) {
    const volgende = new Date(d); volgende.setDate(d.getDate() + 1);
    return `Nacht naar ${NL_DAGEN[volgende.getDay()]} ${volgende.getDate()} ${NL_MAANDEN[volgende.getMonth()+1]} ${volgende.getFullYear()}`;
  }
  return `${NL_DAGEN[d.getDay()]} ${d.getDate()} ${NL_MAANDEN[d.getMonth()+1]} ${d.getFullYear()}`;
}

function maakKaartItem(naam, lijst) {
  const label = dagLabel(naam);
  const item = document.createElement("div"); item.className = "kaart-item";
  const hint = document.createElement("span");
  hint.style.cssText = "font-size:0.72em;color:#666;background:#f0f4f8;padding:4px 10px;display:block;text-align:right;border-bottom:1px solid #e0e0e0;";
  hint.textContent = "🔍 klik voor vergroting";
  const img = document.createElement("img");
  img.src = naam; img.alt = label; img.loading = "lazy";
  img.onclick = function(){ openLightbox(naam, lijst); };
  img.onerror = function(){ item.style.display="none"; };
  const footer = document.createElement("div"); footer.className = "kaart-footer";
  const lbl = document.createElement("span"); lbl.className = "kaart-naam"; lbl.textContent = label;
  const btn = document.createElement("a"); btn.className = "btn-down"; btn.href = naam; btn.download = naam; btn.textContent = "⬇ Download";
  footer.appendChild(lbl); footer.appendChild(btn);
  item.appendChild(hint); item.appendChild(img); item.appendChild(footer);
  return item;
}

function openLightbox(naam, lijst) {
  activeLijst = lijst;
  huidigIndex = lijst.indexOf(naam);
  document.getElementById("lightbox-img").src = naam;
  document.getElementById("lightbox").style.display = "flex";
  document.getElementById("lb-prev").style.opacity = huidigIndex === 0 ? "0.3" : "1";
  document.getElementById("lb-next").style.opacity = huidigIndex === lijst.length-1 ? "0.3" : "1";
}

function sluitLightbox() {
  document.getElementById("lightbox").style.display = "none";
}

function navLightbox(richting) {
  huidigIndex = Math.max(0, Math.min(activeLijst.length-1, huidigIndex + richting));
  document.getElementById("lightbox-img").src = activeLijst[huidigIndex];
  document.getElementById("lb-prev").style.opacity = huidigIndex === 0 ? "0.3" : "1";
  document.getElementById("lb-next").style.opacity = huidigIndex === activeLijst.length-1 ? "0.3" : "1";
}

document.addEventListener("keydown", e => {
  if (document.getElementById("lightbox").style.display === "flex") {
    if (e.key === "ArrowLeft")  navLightbox(-1);
    if (e.key === "ArrowRight") navLightbox(1);
    if (e.key === "Escape") sluitLightbox();
  }
});

async function downloadAlles() {
  for (const naam of beTempLijst) {
    const a = document.createElement("a");
    a.href = naam; a.download = naam;
    document.body.appendChild(a); a.click();
    document.body.removeChild(a);
    await new Promise(res => setTimeout(res, 400));
  }
}

// Laad kaarten uit index.json
fetch("index.json?t=" + Date.now())
  .then(r => r.json())
  .then(data => {
    const kaarten = Array.isArray(data) ? data : (data.kaarten || []);
    beTempLijst = kaarten
      .filter(n => n.startsWith("kaart_be_temp_") && !n.startsWith("kaart_be_temp_dag_") && !n.startsWith("kaart_be_temp_nacht_"))
      .sort((a, b) => { const da = datumUitNaam(a), db = datumUitNaam(b); return (!da||!db) ? 0 : da-db; });
    beTempDagLijst = kaarten
      .filter(n => n.startsWith("kaart_be_temp_dag_"))
      .sort((a, b) => { const da = datumUitNaam(a), db = datumUitNaam(b); return (!da||!db) ? 0 : da-db; });
    beTempNachtLijst = kaarten
      .filter(n => n.startsWith("kaart_be_temp_nacht_"))
      .sort((a, b) => { const da = datumUitNaam(a), db = datumUitNaam(b); return (!da||!db) ? 0 : da-db; });
    activeLijst = beTempLijst;

    const container = document.getElementById("kaarten-be-temp");
    container.innerHTML = "";
    if (beTempLijst.length === 0) {
      container.innerHTML = "<p class='geen-kaarten'>Nog geen Belgische kaarten beschikbaar.</p>";
    } else {
      beTempLijst.forEach(n => container.appendChild(maakKaartItem(n, beTempLijst)));
    }
    beTempDagLijst.forEach(n => document.getElementById("kaarten-be-temp-dag").appendChild(maakKaartItem(n, beTempDagLijst)));
    beTempNachtLijst.forEach(n => document.getElementById("kaarten-be-temp-nacht").appendChild(maakKaartItem(n, beTempNachtLijst)));

    beWindDagLijst = kaarten
      .filter(n => n.startsWith("kaart_be_wind_") && !n.startsWith("kaart_be_wind_nacht_"))
      .sort((a, b) => { const da = datumUitNaam(a), db = datumUitNaam(b); return (!da||!db) ? 0 : da-db; });
    beWindNachtLijst = kaarten
      .filter(n => n.startsWith("kaart_be_wind_nacht_"))
      .sort((a, b) => { const da = datumUitNaam(a), db = datumUitNaam(b); return (!da||!db) ? 0 : da-db; });
    beGevoelsLijst = kaarten
      .filter(n => n.startsWith("kaart_be_gevoels_"))
      .sort((a, b) => { const da = datumUitNaam(a), db = datumUitNaam(b); return (!da||!db) ? 0 : da-db; });
    beDauwpuntLijst = kaarten
      .filter(n => n.startsWith("kaart_be_dauwpunt_"))
      .sort((a, b) => { const da = datumUitNaam(a), db = datumUitNaam(b); return (!da||!db) ? 0 : da-db; });
    beT5cmLijst = kaarten
      .filter(n => n.startsWith("kaart_be_t5cm_"))
      .sort((a, b) => { const da = datumUitNaam(a), db = datumUitNaam(b); return (!da||!db) ? 0 : da-db; });

    beWindDagLijst.forEach(n => document.getElementById("kaarten-be-wind-dag").appendChild(maakKaartItem(n, beWindDagLijst)));
    beWindNachtLijst.forEach(n => document.getElementById("kaarten-be-wind-nacht").appendChild(maakKaartItem(n, beWindNachtLijst)));
    beGevoelsLijst.forEach(n => document.getElementById("kaarten-be-gevoels").appendChild(maakKaartItem(n, beGevoelsLijst)));
    beDauwpuntLijst.forEach(n => document.getElementById("kaarten-be-dauwpunt").appendChild(maakKaartItem(n, beDauwpuntLijst)));
    beT5cmLijst.forEach(n => document.getElementById("kaarten-be-t5cm").appendChild(maakKaartItem(n, beT5cmLijst)));
  })
  .catch(() => {
    document.getElementById("kaarten-be-temp").innerHTML =
      "<p class='geen-kaarten'>Kon kaartlijst niet laden.</p>";
  });
</script>
</body>
</html>
