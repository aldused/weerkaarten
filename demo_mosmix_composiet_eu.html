<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MOSMIX Europa — landenmenu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<script>
  (function(){
    function apply(t){ document.documentElement.setAttribute("data-theme", t === "dark" ? "dark" : "light"); }
    var saved = "light"; try { saved = localStorage.getItem("weerlab_theme") || "light"; } catch {}
    apply(saved);
    window.addEventListener("storage", function(e){ if (e.key === "weerlab_theme") apply(e.newValue); });
  })();
</script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: "DM Sans", ui-sans-serif, system-ui, sans-serif; background: #f6f8fb; color: #0f172a; min-height: 100vh; }

  .page-header { background: #fff; padding: 20px 24px; border-bottom: 1px solid #e3e8ef; }
  .page-header h1 { font-size: 22px; font-weight: 700; letter-spacing: -0.01em; }
  .page-header .sub { color: #64748b; font-size: 12px; margin-top: 4px; font-family: "DM Mono", monospace; }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 16px;
    padding: 24px;
    max-width: 1400px;
    margin: 0 auto;
  }

  .card {
    position: relative;
    background: #fff;
    border: 1px solid #e3e8ef;
    border-radius: 12px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    text-decoration: none;
    color: inherit;
    transition: transform 0.12s, box-shadow 0.12s, border-color 0.12s;
    cursor: pointer;
  }
  .card:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 20px rgba(15,23,42,0.08);
    border-color: #cbd5e1;
  }

  .card-band {
    color: #fff;
    padding: 14px 16px 12px;
    position: relative;
    overflow: hidden;
  }
  .card-band .vlag {
    font-size: 28px;
    line-height: 1;
    display: block;
    margin-bottom: 8px;
  }
  .card-band .naam {
    font-size: 17px;
    font-weight: 700;
    letter-spacing: -0.01em;
  }
  .card-band .aantal {
    font-size: 11px;
    opacity: 0.8;
    margin-top: 2px;
    font-family: "DM Mono", monospace;
  }

  .card-body {
    padding: 12px 16px 14px;
    flex: 1;
  }
  .card-stat {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 4px 0;
    font-size: 12px;
    color: #475569;
  }
  .card-stat b { color: #0f172a; font-weight: 600; }
  .card-stat .val { font-family: "DM Mono", monospace; font-size: 12px; }
  .card-stat .hot  { color: #c0392b; font-weight: 700; }
  .card-stat .cold { color: #1565c0; font-weight: 700; }
  .card-stat .wet  { color: #0d47a1; font-weight: 700; }

  .card-footer {
    padding: 8px 16px;
    border-top: 1px solid #eef2f7;
    font-size: 11px;
    color: #94a3b8;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .card-footer .pijl { font-weight: 700; color: #334155; }
  .card:hover .pijl { color: #0f172a; }

  .card.disabled { opacity: 0.55; cursor: not-allowed; }
  .card.disabled:hover { transform: none; box-shadow: none; border-color: #e3e8ef; }
  .card .badge-status {
    position: absolute;
    top: 10px;
    right: 10px;
    background: rgba(255,255,255,0.9);
    color: #334155;
    font-size: 10px;
    font-weight: 700;
    padding: 3px 8px;
    border-radius: 10px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }

  /* Kleurenschemas per land (matcht hun standalone pagina) */
  .card[data-land="nl"]  .card-band { background: linear-gradient(135deg, #00205b, #1e3a8a); }
  .card[data-land="be"]  .card-band { background: linear-gradient(135deg, #4a0c0c, #991b1b); }
  .card[data-land="fr"]  .card-band { background: linear-gradient(135deg, #0a2463, #1d4ed8); }
  .card[data-land="ibe"] .card-band { background: linear-gradient(135deg, #7c2d12, #c2410c); }
  .card[data-land="de"]  .card-band { background: linear-gradient(135deg, #422006, #a16207); }
  .card[data-land="gb"]  .card-band { background: linear-gradient(135deg, #064e3b, #047857); }

  [data-theme="dark"] body { background:#0b1220 !important; color:#f1f5f9 !important; }
  [data-theme="dark"] .page-header { background:#111a2e !important; border-color:rgba(255,255,255,0.08) !important; }
  [data-theme="dark"] .page-header h1 { color:#f1f5f9 !important; }
  [data-theme="dark"] .page-header .sub { color:#94a3b8 !important; }
  [data-theme="dark"] .card { background:#111a2e !important; border-color:rgba(255,255,255,0.08) !important; }
  [data-theme="dark"] .card-stat { color:#94a3b8 !important; }
  [data-theme="dark"] .card-stat b { color:#f1f5f9 !important; }
  [data-theme="dark"] .card-footer { border-color:rgba(255,255,255,0.06) !important; color:#64748b !important; }
  [data-theme="dark"] .card-footer .pijl { color:#cbd5e1 !important; }
  [data-theme="dark"] .card .badge-status { background:rgba(30,41,59,0.9) !important; color:#cbd5e1 !important; }
</style>
</head>
<body>

<!-- Pincode-gate (test-fase) -->
<div id="pinOverlay" style="position:fixed;inset:0;background:#1f2937;display:none;z-index:999;align-items:center;justify-content:center;font-family:-apple-system,sans-serif">
  <div style="background:#fff;padding:26px 32px;border-radius:12px;max-width:360px;text-align:center">
    <h3 style="margin:0 0 8px 0">MOS/MIX Multi Europe</h3>
    <p style="color:#6b7280;margin:0 0 16px 0;font-size:13px">Testpagina — vul pincode in om verder te gaan</p>
    <input id="pinInput" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="5"
           style="font-size:18px;text-align:center;padding:8px 12px;width:120px;border:1px solid #d1d5db;border-radius:6px;letter-spacing:4px">
    <div id="pinErr" style="color:#b91c1c;font-size:12px;min-height:16px;margin:6px 0"></div>
    <button id="pinOk" style="margin-top:4px;padding:6px 18px;background:#0f766e;color:#fff;border:none;border-radius:6px;font-size:14px;cursor:pointer">OK</button>
  </div>
</div>
<script>
document.addEventListener('DOMContentLoaded', function(){
  const PIN = "19976";
  const gate = document.getElementById('pinOverlay');
  const input = document.getElementById('pinInput');
  const err = document.getElementById('pinErr');
  const ok = document.getElementById('pinOk');
  function show(){ gate.style.display='flex'; document.body.style.overflow='hidden'; setTimeout(()=>input.focus(),50); }
  function hide(){ gate.style.display='none'; document.body.style.overflow=''; }
  function tryPin(){
    if(input.value === PIN){
      try{ sessionStorage.setItem('mosmix_eu_ok','1'); }catch(e){}
      hide();
    }else{
      err.textContent='Onjuiste pincode'; input.value=''; input.focus();
    }
  }
  ok.addEventListener('click', tryPin);
  input.addEventListener('keydown', e => { if(e.key==='Enter') tryPin(); });
  let unlocked = false;
  try{ unlocked = sessionStorage.getItem('mosmix_eu_ok')==='1'; }catch(e){}
  if(!unlocked) show();
});
</script>

<div class="page-header">
  <h1>MOSMIX Europa — landenmenu</h1>
  <div class="sub" id="page-sub">Kies een land voor het volledige composiet (DWD MOSMIX)</div>
</div>

<div class="grid" id="grid">
  <!-- kaarten worden door JS gevuld zodra JSON-data geladen is -->
</div>

<script>
// Per land: alleen eigen-land stations meetellen voor de warmst/koudst/natst-stats
// (composiet-JSONs bevatten bewust grensstations t.b.v. de kaart — die tellen hier niet mee)
const EIGEN_NL = ["Eelde","Terschelling","Vlieland","Leeuwarden","Den Helder","Amsterdam","De Bilt","Deelen","Hoogeveen","Enschede","Vlissingen","Hoek van Holland","Rotterdam Airport","Gilze Rijen","Eindhoven","Maastricht","Valkenburg","Volkel","IJsselmeer"];
const EIGEN_BE = ["Brussel","Gent","Antwerpen","Kleine Brogel","Oostende","Charleroi","Bierset","Spa","St-Hubert","Florennes","Beauvechain","Brugge"];

const LANDEN = [
  { tag:"nl",  vlag:"🇳🇱", naam:"Nederland",         json:"mosmix_nl.json",  page:"demo_mosmix_composiet.html",         eigen: EIGEN_NL },
  { tag:"be",  vlag:"🇧🇪", naam:"België",            json:"mosmix_be.json",  page:"demo_mosmix_composiet_be.html",      eigen: EIGEN_BE },
  { tag:"fr",  vlag:"🇫🇷", naam:"Frankrijk",         json:"mosmix_fr.json",  page:"demo_mosmix_composiet_fr.html"     },
  { tag:"ibe", vlag:"🇪🇸🇵🇹", naam:"Iberia",         json:"mosmix_ibe.json", page:"demo_mosmix_composiet_iberia.html" },
  { tag:"de",  vlag:"🇩🇪", naam:"Duitsland",         json:"mosmix_de.json",  page:"demo_mosmix_composiet_de.html"     },
  { tag:"gb",  vlag:"🇬🇧🇮🇪", naam:"Britse Eilanden", json:"mosmix_gb.json", page:"demo_mosmix_composiet_gb.html"     },
];

const NL_DAGEN_FULL = ["zondag","maandag","dinsdag","woensdag","donderdag","vrijdag","zaterdag"];

function fmt(v, eenheid="", dec=1){
  if(v == null) return "–";
  const n = typeof v === "number" ? v.toFixed(dec).replace(".",",") : v;
  return n + eenheid;
}

function vandaagStats(data, eigen){
  const dag = data.dagen[0];
  const d = data.data[dag];
  if(!d) return null;
  const alle = Object.keys(data.stations);
  const namen = eigen ? alle.filter(n => eigen.includes(n)) : alle;
  let warmst=null, koudst=null, natst=null;
  for(const n of namen){
    const tx = d.TX?.[n], rr = d.RR?.[n];
    if(tx != null){
      if(warmst == null || tx > d.TX[warmst]) warmst = n;
      if(koudst == null || tx < d.TX[koudst]) koudst = n;
    }
    if(rr != null && rr > 0 && (natst == null || rr > d.RR[natst])) natst = n;
  }
  return {
    dag,
    warmst: warmst && { naam: warmst, tx: d.TX[warmst] },
    koudst: koudst && { naam: koudst, tx: d.TX[koudst] },
    natst:  natst  && { naam: natst,  rr: d.RR[natst]  },
    aantal: namen.length,
    bijgewerkt: data.bijgewerkt,
  };
}

function bouwKaart(land, stats){
  const a = document.createElement("a");
  a.className = "card";
  a.dataset.land = land.tag;
  a.href = land.page + "?from=eu";

  const band = document.createElement("div");
  band.className = "card-band";
  band.innerHTML = `
    <span class="vlag">${land.vlag}</span>
    <div class="naam">${land.naam}</div>
    <div class="aantal">${stats ? stats.aantal + " stations" : "geen data"}</div>
  `;
  a.appendChild(band);

  const body = document.createElement("div");
  body.className = "card-body";
  if(stats){
    const dd = new Date(stats.dag + "T12:00:00");
    const dagL = NL_DAGEN_FULL[dd.getDay()] + " " + dd.getDate() + "/" + (dd.getMonth()+1);
    body.innerHTML = `
      <div class="card-stat"><b>${dagL}</b><span class="val"></span></div>
      ${stats.warmst ? `<div class="card-stat"><span>Warmst</span><span class="val"><b>${stats.warmst.naam}</b> <span class="hot">${fmt(stats.warmst.tx,"°")}</span></span></div>` : ""}
      ${stats.koudst ? `<div class="card-stat"><span>Koudst</span><span class="val"><b>${stats.koudst.naam}</b> <span class="cold">${fmt(stats.koudst.tx,"°")}</span></span></div>` : ""}
      ${stats.natst  ? `<div class="card-stat"><span>Natst</span><span class="val"><b>${stats.natst.naam}</b> <span class="wet">${fmt(stats.natst.rr," mm")}</span></span></div>` : `<div class="card-stat"><span>Neerslag</span><span class="val"><span class="wet">${fmt(0," mm")}</span></span></div>`}
    `;
  } else {
    a.classList.add("disabled");
    a.removeAttribute("href");
    const tag = document.createElement("div");
    tag.className = "badge-status";
    tag.textContent = "in opbouw";
    a.appendChild(tag);
    body.innerHTML = `<div class="card-stat"><span>Data nog niet beschikbaar</span><span class="val">–</span></div>`;
  }
  a.appendChild(body);

  const foot = document.createElement("div");
  foot.className = "card-footer";
  foot.innerHTML = `
    <span>${stats ? "Bijgewerkt " + stats.bijgewerkt.replace("T"," ").slice(0,16) : "—"}</span>
    <span class="pijl">open →</span>
  `;
  a.appendChild(foot);

  return a;
}

Promise.all(LANDEN.map(l =>
  fetch(l.json + "?t=" + Date.now())
    .then(r => r.ok ? r.json() : null)
    .catch(() => null)
)).then(resultaten => {
  const grid = document.getElementById("grid");
  LANDEN.forEach((land, i) => {
    const data = resultaten[i];
    const stats = data ? vandaagStats(data, land.eigen) : null;
    grid.appendChild(bouwKaart(land, stats));
  });
  const ok = resultaten.filter(r => r).length;
  document.getElementById("page-sub").textContent =
    `${ok} van ${LANDEN.length} landen beschikbaar — kies er één voor het volledige composiet (DWD MOSMIX)`;
});
</script>
</body>
</html>
