<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Weerkaarten - Ed Aldus WM</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<style>
  * { box-sizing: border-box; }
  body { font-family: Arial, sans-serif; background: #f0f4f8; margin: 0; padding: 0; }
  .header { background: #00205b; padding: 14px 24px 10px; }
  .header-titel { color: white; font-size: 1.3em; font-weight: bold; letter-spacing: 0.04em; margin: 0; }
  .header-sub { color: #a8c4e8; font-size: 0.82em; margin: 3px 0 0; }
  .header-nav { margin-top: 8px; }
  .header-nav a { color: #a8c4e8; font-size: 0.82em; text-decoration: none; margin-right: 16px; }
  .header-nav a:hover { color: white; }
  .content { padding: 16px 20px; }
  .toolbar { display: flex; align-items: center; gap: 10px; margin: 16px 0; flex-wrap: wrap; }
  .btn { background: #003366; color: white; border: none; padding: 8px 16px; border-radius: 5px; cursor: pointer; font-size: 0.85em; }
  .btn:hover { background: #0055aa; }
  .btn.groen { background: #2a7a2a; }
  .btn.groen:hover { background: #3a9a3a; }
  .updates { background: white; border: 1px solid #ccd6e0; border-radius: 6px; padding: 7px 12px; font-size: 0.78em; color: #444; line-height: 1.7; }
  .kaarten { display: flex; flex-wrap: wrap; gap: 16px; margin-top: 10px; }
  .kaart-item { background: white; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.12); overflow: hidden; width: 100%; max-width: 420px; }
  .kaart-item img { width: 100%; display: block; cursor: zoom-in; }
  .kaart-footer { padding: 8px 10px; display: flex; justify-content: space-between; align-items: center; background: #f8f9fa; border-top: 1px solid #e0e0e0; }
  .kaart-naam { font-size: 0.78em; color: #444; }
  .btn-down { background: #003366; color: white; border: none; padding: 5px 12px; border-radius: 4px; cursor: pointer; font-size: 0.78em; text-decoration: none; }
  .btn-down:hover { background: #0055aa; }
  .tabs { display: flex; gap: 4px; margin-bottom: 0; }
  .tab { padding: 9px 20px; background: #dce6f0; border: 1px solid #b0c4d8; border-bottom: none; border-radius: 6px 6px 0 0; cursor: pointer; font-size: 0.88em; color: #333; font-weight: bold; }
  .tab:hover { background: #c8d8ec; }
  .tab.actief { background: white; border-bottom: 1px solid white; color: #00205b; }
  .tab-inhoud { display: none; background: white; border: 1px solid #b0c4d8; border-radius: 0 6px 6px 6px; padding: 16px; }
  .tab-inhoud.actief { display: block; }
  #lightbox { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 1000; justify-content: center; align-items: center; }
  #lightbox.actief { display: flex; }
  #lightbox img { max-width: 95vw; max-height: 95vh; border-radius: 6px; }
  #lightbox-sluit { position: fixed; top: 16px; right: 22px; font-size: 2.2em; color: white; cursor: pointer; }
</style>
</head>
<body>
<div class="header">
  <p class="header-titel">Ed Aldus WM</p>
  <p class="header-sub">MOS kaarten ECMWF/ICON van de DWD &nbsp;|&nbsp; Temperatuur, wind, bewolking, zon en neerslag</p>

</div>
<div class="content">
  <div class="toolbar">
    <button class="btn groen" onclick="downloadAlles()">⬇ Download alle kaarten</button>
    <span style="font-size:0.8em;color:#777;">of download per kaart hieronder</span>
    <div class="updates">🕐 <strong>Updates:</strong><br>04:30 &nbsp;&middot;&nbsp; 10:30 &nbsp;&middot;&nbsp; 16:30 &nbsp;&middot;&nbsp; 22:30</div>
  </div>

  <div class="tabs">
    <div class="tab actief" id="tab-temp" onclick="wisselTab('temp')">🌡️ Temperatuur</div>
    <div class="tab" id="tab-wind" onclick="wisselTab('wind')">💨 Wind</div>
    <div class="tab" id="tab-zon" onclick="wisselTab('zon')">☀️ Bewolking &amp; zon</div>
    <div class="tab" id="tab-regen" onclick="wisselTab('regen')">🌧️ Neerslag</div>
    <div class="tab" id="tab-waarnemingen" onclick="window.location='toplijst.html'">📊 Waarnemingen</div>
  </div>

  <div class="tab-inhoud actief" id="inhoud-temp">
    <div class="kaarten" id="kaarten-temp"></div>
  </div>
  <div class="tab-inhoud" id="inhoud-wind">
    <div class="kaarten" id="kaarten-wind"></div>
  </div>
  <div class="tab-inhoud" id="inhoud-zon">
    <div class="kaarten" id="kaarten-zon"></div>
  </div>
  <div class="tab-inhoud" id="inhoud-regen">
    <div class="kaarten" id="kaarten-regen"></div>
  </div>
</div>

<div id="lightbox" onclick="sluitLightbox()">
  <span id="lightbox-sluit" onclick="sluitLightbox()">&#10005;</span>
  <span id="lightbox-prev" onclick="event.stopPropagation();vorigeLightbox()" style="position:fixed;left:16px;top:50%;transform:translateY(-50%);font-size:2.5em;color:white;cursor:pointer;user-select:none;">&#8249;</span>
  <span id="lightbox-next" onclick="event.stopPropagation();volgendeLightbox()" style="position:fixed;right:16px;top:50%;transform:translateY(-50%);font-size:2.5em;color:white;cursor:pointer;user-select:none;">&#8250;</span>
  <img id="lightbox-img" src="" alt="">
</div>

<script>
let activeLijst = [];
let huidigIndex = 0;
let tempLijst = [];
let windLijst = [];
let zonLijst  = [];
let regenLijst = [];

function wisselTab(tab) {
  ["temp","wind","zon","regen"].forEach(t => {
    document.getElementById("tab-" + t).classList.toggle("actief", t === tab);
    document.getElementById("inhoud-" + t).classList.toggle("actief", t === tab);
  });
  if (tab === "temp") activeLijst = tempLijst;
  else if (tab === "wind") activeLijst = windLijst;
  else if (tab === "zon") activeLijst = zonLijst;
  else activeLijst = regenLijst;
}

function openLightbox(src, lijst) {
  activeLijst = lijst;
  huidigIndex = activeLijst.indexOf(src);
  document.getElementById("lightbox-img").src = src;
  document.getElementById("lightbox").classList.add("actief");
}
function sluitLightbox() {
  document.getElementById("lightbox").classList.remove("actief");
}
function volgendeLightbox() {
  if (huidigIndex < activeLijst.length - 1) {
    huidigIndex++;
    document.getElementById("lightbox-img").src = activeLijst[huidigIndex];
  }
}
function vorigeLightbox() {
  if (huidigIndex > 0) {
    huidigIndex--;
    document.getElementById("lightbox-img").src = activeLijst[huidigIndex];
  }
}
document.addEventListener("keydown", e => {
  if(e.key === "Escape") sluitLightbox();
  if(e.key === "ArrowRight") volgendeLightbox();
  if(e.key === "ArrowLeft") vorigeLightbox();
});
let touchStartX = 0;
document.getElementById("lightbox").addEventListener("touchstart", e => {
  touchStartX = e.touches[0].clientX;
}, {passive: true});
document.getElementById("lightbox").addEventListener("touchend", e => {
  const dx = e.changedTouches[0].clientX - touchStartX;
  if (Math.abs(dx) > 50) {
    if (dx < 0) volgendeLightbox();
    else vorigeLightbox();
  }
}, {passive: true});

function maakKaartItem(naam, lijst) {
  const dagNaam = naam.replace("kaart_wind_","").replace("kaart_zon_","").replace("kaart_regen_","").replace("kaart_","").replace(".png","").replace(/_/g," ");
  const item = document.createElement("div");
  item.className = "kaart-item";
  const hint = document.createElement("span");
  hint.style.cssText = "font-size:0.72em;color:#666;background:#f0f4f8;padding:4px 10px;display:block;text-align:right;border-bottom:1px solid #e0e0e0;";
  hint.textContent = "🔍 klik voor vergroting";
  const img = document.createElement("img");
  img.src = naam; img.alt = dagNaam;
  img.onclick = function(){ openLightbox(naam, lijst); };
  img.onerror = function(){ item.style.display="none"; };
  const footer = document.createElement("div");
  footer.className = "kaart-footer";
  const label = document.createElement("span");
  label.className = "kaart-naam"; label.textContent = dagNaam;
  const btn = document.createElement("a");
  btn.className = "btn-down"; btn.href = naam;
  btn.download = naam; btn.textContent = "⬇ Download";
  footer.appendChild(label); footer.appendChild(btn);
  item.appendChild(hint); item.appendChild(img); item.appendChild(footer);
  return item;
}

fetch("index.json?t=" + Date.now())
  .then(r => r.json())
  .then(kaarten => {
    tempLijst = kaarten.filter(n => !n.startsWith("kaart_zon_") && !n.startsWith("kaart_wind_") && !n.startsWith("kaart_regen_"));
    windLijst = kaarten.filter(n => n.startsWith("kaart_wind_"));
    zonLijst   = kaarten.filter(n => n.startsWith("kaart_zon_"));
    regenLijst = kaarten.filter(n => n.startsWith("kaart_regen_"));
    activeLijst = tempLijst;

    tempLijst.forEach(n => document.getElementById("kaarten-temp").appendChild(maakKaartItem(n, tempLijst)));
    windLijst.forEach(n => document.getElementById("kaarten-wind").appendChild(maakKaartItem(n, windLijst)));
    zonLijst.forEach(n   => document.getElementById("kaarten-zon").appendChild(maakKaartItem(n, zonLijst)));
    regenLijst.forEach(n => document.getElementById("kaarten-regen").appendChild(maakKaartItem(n, regenLijst)));
  })
  .catch(() => {
    document.getElementById("kaarten-temp").innerHTML = "<p style='color:red'>Kon kaartlijst niet laden.</p>";
  });

async function downloadAlles() {
  try {
    const kaarten = await fetch("index.json").then(r => r.json());
    for (const naam of kaarten) {
      const a = document.createElement("a");
      a.href = naam; a.download = naam;
      document.body.appendChild(a); a.click();
      document.body.removeChild(a);
      await new Promise(res => setTimeout(res, 400));
    }
  } catch(e) { alert("Kon kaartlijst niet laden."); }
}
</script>
</body>
</html>
