<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Atmosferisch profiel (Sounding) - weerlab.nl</title>
<style>
:root {
  --bg: #f0f3f7; --header: #003366; --border: #d0d8e4;
  --text: #1a2b40; --accent: #0066cc; --teal: #2ec4e8;
}
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family: Inter, -apple-system, sans-serif; background: var(--bg); color: var(--text); }

.header {
  background: var(--header); color: #fff; padding: 10px 20px;
  display: flex; align-items: center; justify-content: space-between;
  border-bottom: 3px solid var(--teal);
}
.header h1 { font-size: 16px; font-family: monospace; letter-spacing: 1px; }
.header .meta { font-size: 11px; color: #8ab4e0; }

.controls {
  display: flex; gap: 6px; align-items: center; flex-wrap: wrap;
  padding: 12px 20px; background: #fff; border-bottom: 1px solid var(--border);
}

.station-btn {
  padding: 7px 14px; border: 2px solid var(--border); border-radius: 8px;
  background: #fff; font-size: 13px; cursor: pointer; font-weight: 500;
  color: var(--text); transition: all 0.15s;
}
.station-btn:hover { border-color: var(--accent); color: var(--accent); }
.station-btn.active {
  background: var(--accent); color: #fff; border-color: var(--accent);
}

.time-controls {
  display: flex; gap: 6px; align-items: center; margin-left: auto;
}
.time-controls select {
  padding: 7px 12px; border: 2px solid var(--border); border-radius: 8px;
  font-size: 13px; background: #fff; cursor: pointer;
}
.nav-btn {
  width: 34px; height: 34px; border: 2px solid var(--border); border-radius: 8px;
  background: #fff; font-size: 16px; cursor: pointer; color: var(--text);
  display: flex; align-items: center; justify-content: center;
}
.nav-btn:hover { border-color: var(--accent); color: var(--accent); }

.content {
  display: flex; justify-content: center; padding: 16px;
  min-height: calc(100vh - 110px);
}

.sounding-img {
  max-width: 100%; max-height: calc(100vh - 130px);
  border-radius: 8px; box-shadow: 0 2px 12px rgba(0,0,0,0.08);
  background: #fff;
}

.loading {
  display: flex; align-items: center; justify-content: center;
  height: 400px; color: #999; font-size: 14px;
}
</style>
</head>
<body>

<div class="header">
  <h1>Atmosferisch profiel (Sounding)</h1>
  <div class="meta">ECMWF IFS 0.25&deg; &middot; weerlab.nl</div>
</div>

<div class="controls" id="controls">
  <div class="loading">Laden...</div>
</div>

<div class="content" id="content">
  <div class="loading">Kies een station...</div>
</div>

<script>
let META = null;
let currentStation = null;
let currentFileIdx = 0;

// R2 base URL (of lokaal voor test)
const IS_LOCAL = location.hostname === 'localhost' || location.protocol === 'file:';
const BASE_URL = IS_LOCAL ? '' : 'https://pub-xxxxxxxxx.r2.dev/';

async function init() {
  try {
    const r = await fetch('sounding_meta.json');
    META = await r.json();
  } catch (e) {
    document.getElementById('controls').innerHTML = '<div class="loading" style="color:red">Kan metadata niet laden</div>';
    return;
  }
  renderControls();
  // Selecteer eerste station
  const first = Object.keys(META.stations)[0];
  if (first) selectStation(first);
}

function renderControls() {
  const stations = META.stations;
  const stationBtns = Object.entries(stations).map(([id, s]) =>
    `<button class="station-btn" id="btn-${id}" onclick="selectStation('${id}')">${s.name}</button>`
  ).join('');

  document.getElementById('controls').innerHTML = `
    ${stationBtns}
    <div class="time-controls">
      <button class="nav-btn" onclick="navTime(-1)" title="Vorige">&larr;</button>
      <select id="time-select" onchange="selectTime(this.value)"></select>
      <button class="nav-btn" onclick="navTime(1)" title="Volgende">&rarr;</button>
    </div>
  `;
}

function selectStation(id) {
  currentStation = id;
  currentFileIdx = 0;

  // Buttons updaten
  document.querySelectorAll('.station-btn').forEach(b => b.classList.remove('active'));
  const btn = document.getElementById('btn-' + id);
  if (btn) btn.classList.add('active');

  // Tijdselector vullen
  const files = META.stations[id].files;
  const sel = document.getElementById('time-select');

  // Groepeer per dag
  const nl_dagen = ['zo','ma','di','wo','do','vr','za'];
  sel.innerHTML = files.map((f, i) => {
    const lt = f.valid_lt; // "2026-04-07 14:00"
    const d = new Date(lt.replace(' ', 'T'));
    const dag = nl_dagen[d.getDay()];
    const datum = lt.substring(5, 10).replace('-', '/');
    const uur = lt.substring(11, 16);
    return `<option value="${i}">${dag} ${datum} ${uur} LT</option>`;
  }).join('');

  // Zoek dichtsbijzijnde tijdstip bij 12:00 vandaag
  const now = new Date();
  let bestIdx = 0, bestDiff = Infinity;
  files.forEach((f, i) => {
    const d = new Date(f.valid_lt.replace(' ', 'T'));
    const diff = Math.abs(d - now);
    if (diff < bestDiff) { bestDiff = diff; bestIdx = i; }
  });
  currentFileIdx = bestIdx;
  sel.value = bestIdx;
  showImage();
}

function selectTime(idx) {
  currentFileIdx = parseInt(idx);
  showImage();
}

function navTime(delta) {
  const files = META.stations[currentStation].files;
  currentFileIdx = Math.max(0, Math.min(files.length - 1, currentFileIdx + delta));
  document.getElementById('time-select').value = currentFileIdx;
  showImage();
}

function showImage() {
  const f = META.stations[currentStation].files[currentFileIdx];
  const url = BASE_URL + f.file;
  document.getElementById('content').innerHTML =
    `<img class="sounding-img" src="${url}" alt="Sounding ${META.stations[currentStation].name}"
          onerror="this.outerHTML='<div class=loading style=color:red>Afbeelding niet gevonden</div>'" />`;
}

// Keyboard navigatie
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft') navTime(-1);
  else if (e.key === 'ArrowRight') navTime(1);
});

init();
</script>
</body>
</html>
