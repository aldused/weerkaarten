<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kleurpluimen - Weerlab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
  background: #8a8070;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: clamp(18px, 4vw, 44px) 14px;
}
.kaart {
  background: #b0a488;
  border-radius: 8px;
  padding: clamp(18px, 3vw, 30px) clamp(16px, 3vw, 34px) 26px;
  width: 100%;
  max-width: 1080px;
  box-shadow: 0 8px 40px rgba(0,0,0,0.32);
}
.terug-rij {
  display: flex;
  margin-bottom: 12px;
}
.terug-link {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  color: rgba(255,255,255,0.86);
  background: rgba(255,255,255,0.14);
  border: 1px solid rgba(255,255,255,0.26);
  border-radius: 999px;
  padding: 7px 12px;
  font-size: 0.78rem;
  font-weight: 900;
  text-decoration: none;
}
.terug-link:hover {
  color: white;
  background: rgba(255,255,255,0.22);
}
h1 {
  font-size: clamp(2rem, 5vw, 3.8rem);
  font-weight: 900;
  color: white;
  letter-spacing: 0;
  line-height: 1.05;
  margin-bottom: 2px;
}
h1 .stn { font-weight: 500; opacity: 0.82; }
.run-strip {
  display: inline-flex;
  align-items: center;
  max-width: 100%;
  margin-top: 8px;
  padding: 7px 11px;
  border: 1px solid rgba(255,255,255,0.34);
  border-radius: 8px;
  background: rgba(7,24,45,0.22);
  color: rgba(255,255,255,0.94);
  font-size: clamp(0.7rem, 1.7vw, 0.82rem);
  font-weight: 850;
  line-height: 1.3;
}
.lijn {
  height: 1.5px;
  background: rgba(255,255,255,0.35);
  margin: 14px 0 18px;
}
.balk {
  display: grid;
  grid-template-columns: minmax(240px, 1fr) auto auto;
  gap: 8px;
  align-items: start;
  margin-bottom: 10px;
}
.zoek-wrap { position: relative; min-width: 0; }
.zoek-rij {
  display: flex;
  align-items: center;
  gap: 8px;
  background: rgba(255,255,255,0.16);
  border: 1.5px solid rgba(255,255,255,0.34);
  border-radius: 8px;
  padding: 6px;
}
#zoek-input,
#extra-input {
  min-width: 0;
  flex: 1;
  border: none;
  outline: none;
  color: white;
  background: transparent;
  font: 700 0.9rem/1.2 Inter, sans-serif;
}
#zoek-input::placeholder,
#extra-input::placeholder { color: rgba(255,255,255,0.62); }
.extra-rij {
  margin-top: 6px;
  display: flex;
  align-items: center;
  gap: 8px;
  background: rgba(255,255,255,0.11);
  border: 1.5px solid rgba(255,255,255,0.24);
  border-radius: 8px;
  padding: 7px 9px;
}
.extra-rij::before {
  content: "Extra";
  color: rgba(255,255,255,0.72);
  font: 900 0.68rem/1 Inter, sans-serif;
  text-transform: uppercase;
}
.zoek-btn {
  border: 1px solid rgba(255,255,255,0.32);
  background: rgba(255,255,255,0.18);
  color: white;
  border-radius: 6px;
  padding: 7px 11px;
  font: 800 0.78rem/1 Inter, sans-serif;
  cursor: pointer;
}
.zoek-btn:hover { background: rgba(255,255,255,0.26); }
#zoek-resultaten {
  display: none;
  position: absolute;
  z-index: 20;
  top: calc(100% + 5px);
  left: 0;
  right: 0;
  overflow: hidden;
  border-radius: 8px;
  background: #6f6554;
  border: 1px solid rgba(255,255,255,0.22);
  box-shadow: 0 12px 28px rgba(0,0,0,0.24);
}
.zoek-item {
  padding: 9px 12px;
  color: rgba(255,255,255,0.9);
  font-size: 0.82rem;
  line-height: 1.25;
  cursor: pointer;
  border-bottom: 1px solid rgba(255,255,255,0.1);
}
.zoek-item:last-child { border-bottom: none; }
.zoek-item:hover { background: rgba(255,255,255,0.12); }
.zoek-item span { color: rgba(255,255,255,0.58); font-size: 0.75rem; }
.datum-controls {
  display: flex;
  align-items: stretch;
  justify-content: flex-end;
  gap: 8px;
  flex-wrap: wrap;
}
.range-wrap,
.highlight-wrap {
  display: flex;
  align-items: center;
  gap: 8px;
  background: rgba(255,255,255,0.16);
  border: 1.5px solid rgba(255,255,255,0.34);
  border-radius: 8px;
  padding: 6px 8px;
  color: rgba(255,255,255,0.82);
  font: 800 0.72rem/1 Inter, sans-serif;
  white-space: nowrap;
}
.range-wrap label,
.highlight-wrap label {
  display: flex;
  align-items: center;
  gap: 5px;
}
.range-wrap input,
.highlight-wrap input,
.highlight-wrap select {
  width: 118px;
  border: none;
  outline: none;
  border-radius: 6px;
  padding: 6px 4px;
  color: white;
  background: rgba(255,255,255,0.08);
  font: 800 0.72rem/1 Inter, sans-serif;
  color-scheme: dark;
}
.highlight-wrap select { width: 82px; cursor: pointer; }
.range-wrap input:focus,
.highlight-wrap input:focus,
.highlight-wrap select:focus,
.highlight-clear:focus { box-shadow: 0 0 0 2px rgba(255,255,255,0.32); }
.highlight-clear {
  width: 26px;
  height: 26px;
  border: 1px solid rgba(255,255,255,0.28);
  border-radius: 6px;
  background: rgba(255,255,255,0.12);
  color: rgba(255,255,255,0.86);
  font: 900 1rem/1 Inter, sans-serif;
  cursor: pointer;
}
.highlight-clear:hover { background: rgba(255,255,255,0.22); color: white; }
#laadstatus {
  grid-column: 1 / -1;
  justify-self: end;
  align-self: center;
  color: rgba(255,255,255,0.68);
  font-size: 0.78rem;
  font-weight: 700;
  text-align: right;
  white-space: normal;
}
.param-tabs {
  display: flex;
  flex-wrap: wrap;
  gap: 7px;
  margin: 0 0 12px;
  padding: 0 2px 4px;
}
.param-btn {
  flex: 0 0 auto;
  border: 1px solid rgba(255,255,255,0.28);
  background: rgba(255,255,255,0.14);
  color: rgba(255,255,255,0.82);
  border-radius: 999px;
  padding: 7px 12px;
  font: 800 0.78rem/1 Inter, sans-serif;
  cursor: pointer;
  white-space: nowrap;
}
.param-btn:hover { background: rgba(255,255,255,0.22); color: white; }
.param-btn.actief {
  background: white;
  color: #5f5649;
  border-color: rgba(255,255,255,0.9);
}
.download-btn {
  flex: 0 0 auto;
  margin-left: auto;
  border: 1px solid rgba(255,255,255,0.48);
  background: rgba(255,255,255,0.88);
  color: #5f5649;
  border-radius: 999px;
  padding: 7px 13px;
  font: 900 0.78rem/1 Inter, sans-serif;
  cursor: pointer;
  white-space: nowrap;
}
.download-btn:hover { background: white; }
.download-btn:disabled {
  cursor: wait;
  opacity: 0.58;
}
.download-btn[hidden] { display: none !important; }
.download-actions {
  display: flex;
  flex-direction: column;
  gap: 7px;
  margin-left: auto;
}
.download-actions[hidden] { display: none !important; }
.download-actions .download-btn { margin-left: 0; }
.download-all-btn {
  background: rgba(255,255,255,0.16);
  color: white;
}
.download-all-btn:hover { background: rgba(255,255,255,0.25); }
.samenvatting {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin: 0 0 12px;
}
.chip {
  background: rgba(255,255,255,0.16);
  border: 1px solid rgba(255,255,255,0.24);
  color: rgba(255,255,255,0.92);
  border-radius: 999px;
  padding: 6px 11px;
  font-size: 0.76rem;
  font-weight: 800;
  line-height: 1.2;
}
.chart-wrap {
  width: 100%;
  border-radius: 6px;
  overflow: hidden;
  box-shadow: 0 2px 12px rgba(0,0,0,0.2);
}
.chart-wrap svg { display: block; width: 100%; height: auto; }
.thunder-card[hidden] { display: none !important; }
.thunder-card {
  margin-top: 12px;
  display: grid;
  grid-template-columns: auto minmax(0, 1fr);
  gap: 12px;
  align-items: start;
  padding: 12px;
  border-radius: 8px;
  border: 1px solid rgba(255,255,255,0.24);
  background: rgba(34,24,42,0.42);
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.10);
}
.thunder-bolt {
  width: 42px;
  height: 42px;
  display: grid;
  place-items: center;
  border-radius: 8px;
  background: linear-gradient(145deg, rgba(255,226,86,0.96), rgba(236,127,54,0.94));
  color: #2d1c08;
  font-size: 1.6rem;
  font-weight: 900;
  text-shadow: 0 1px 0 rgba(255,255,255,0.42);
  box-shadow: 0 5px 18px rgba(39,21,12,0.22);
}
.thunder-copy { min-width: 0; }
.thunder-kop {
  display: flex;
  justify-content: space-between;
  gap: 10px;
  flex-wrap: wrap;
  color: white;
  font-weight: 900;
  line-height: 1.2;
}
.thunder-kop span {
  color: rgba(255,255,255,0.70);
  font-size: 0.78rem;
  font-weight: 800;
}
.thunder-days {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(78px, 1fr));
  gap: 6px;
  margin-top: 10px;
}
.thunder-basis {
  margin-top: 9px;
  color: rgba(255,255,255,0.70);
  font-size: 0.72rem;
  font-weight: 750;
  line-height: 1.35;
}
.thunder-day {
  min-height: 50px;
  border-radius: 7px;
  border: 1px solid var(--risk-stroke);
  background: var(--risk-fill);
  color: var(--risk-text);
  padding: 6px 7px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.12);
}
.thunder-day .d {
  display: block;
  font-size: 0.60rem;
  font-weight: 900;
  opacity: 0.82;
  white-space: nowrap;
}
.thunder-day strong {
  display: block;
  margin-top: 2px;
  font-size: 0.96rem;
  line-height: 1;
}
.single-view[hidden], .multi-view[hidden] { display: none !important; }
.multi-view {
  display: grid;
  gap: 14px;
}
.multi-card {
  background: rgba(255,255,255,0.08);
  border: 1px solid rgba(255,255,255,0.18);
  border-radius: 8px;
  padding: 12px;
}
.multi-head {
  display: flex;
  gap: 10px;
  justify-content: space-between;
  align-items: baseline;
  margin-bottom: 8px;
}
.multi-title {
  color: white;
  font-size: 1.05rem;
  font-weight: 900;
}
.multi-status {
  color: rgba(255,255,255,0.64);
  font-size: 0.72rem;
  font-weight: 800;
  text-align: right;
}
.multi-card .samenvatting { margin: 0 0 10px; }
.multi-card .legenda { margin-top: 10px; }
.legenda {
  display: flex;
  gap: 20px;
  flex-wrap: wrap;
  margin-top: 14px;
  font-size: 0.76rem;
  color: rgba(255,255,255,0.78);
  align-items: center;
  font-weight: 700;
}
.leg-item { display: flex; align-items: center; gap: 7px; }
.leg-ln { width: 24px; height: 3px; border-radius: 2px; flex-shrink: 0; }
.leg-bnd { width: 18px; height: 11px; border-radius: 3px; flex-shrink: 0; }
.leg-swatch { width: 18px; height: 12px; border-radius: 3px; border: 1px solid rgba(255,255,255,0.42); flex-shrink: 0; }
.voet {
  margin-top: 12px;
  color: rgba(255,255,255,0.54);
  font-size: 0.7rem;
  font-weight: 700;
}
@media (max-width: 560px) {
  body { padding: 0; background: #b0a488; }
  .kaart { border-radius: 0; min-height: 100vh; box-shadow: none; }
  .balk { grid-template-columns: 1fr; }
  .datum-controls { justify-content: stretch; }
  .range-wrap { flex-wrap: wrap; }
  .highlight-wrap { flex-wrap: wrap; }
  .range-wrap label { flex: 1 1 130px; }
  .highlight-wrap label { flex: 1 1 150px; }
  .range-wrap input { width: 100%; }
  .highlight-wrap input { width: 100%; }
  #laadstatus { white-space: normal; }
  .param-btn { flex: 1 1 auto; }
  .download-actions { flex: 1 1 100%; margin-left: 0; }
  .download-actions .download-btn { width: 100%; }
  .thunder-card { grid-template-columns: 1fr; }
  .thunder-bolt { width: 100%; height: 34px; }
  .legenda { gap: 10px 14px; }
  .multi-head { align-items: flex-start; flex-direction: column; }
  .multi-status { text-align: left; }
}
body.embedded { padding: 0; background: #eef4f9; }
body.embedded .kaart {
  border-radius: 0;
  box-shadow: none;
  min-height: 0;
  background:
    linear-gradient(90deg, rgba(255,255,255,0.035) 1px, transparent 1px),
    linear-gradient(0deg, rgba(255,255,255,0.035) 1px, transparent 1px),
    linear-gradient(145deg, #10243e, #1a5260);
  background-size: 42px 42px, 42px 42px, auto;
}
body.embedded .terug-rij { display: flex; }
body.embedded .kaart { padding: 18px; }
body.embedded h1 { font-size: clamp(1.35rem, 3.2vw, 2.15rem); margin-top: 0; }
body.embedded .voet { display: none; }
body.embedded .multi-card,
body.embedded .zoek-rij,
body.embedded .chip {
  background: rgba(255,255,255,0.10);
  border-color: rgba(255,255,255,0.18);
}
body.embedded .param-btn,
body.embedded .download-btn {
  border-color: rgba(255,255,255,0.22);
}
</style>
</head>
<body>
<div class="kaart">
  <div class="terug-rij">
    <a class="terug-link" href="index.html#weerbewaking" onclick="gaTerugKleurpluim();return false;">← Terug naar weerbewaking</a>
  </div>
  <h1><span id="pluim-titel">Temperatuurpluim</span> <span class="stn" id="stn-label">Rotterdam</span></h1>
  <div class="run-strip" id="run-label" aria-live="polite">ECMWF ENS-run controleren…</div>
  <div class="lijn"></div>

  <div class="balk">
    <div class="zoek-wrap">
      <div class="zoek-rij">
        <input id="zoek-input" type="text" value="Rotterdam" placeholder="Zoek plaats..." autocomplete="off">
        <button class="zoek-btn" id="zoek-btn" type="button">Zoek</button>
      </div>
      <div id="zoek-resultaten"></div>
      <div class="extra-rij">

          <option value="blue">Blauw</option>

        <span class="tgl-lbl">MOS/MIX Tx</span> <span style="opacity:.6;font-size:.72em">10 dagen</span>

  <div id="multi-view" class="multi-view" hidden></div>

<script>
const NS = 'http://www.w3.org/2000/svg';
const DOW_NL = ['zo','ma','di','wo','do','vr','za'];
const MAAND_NL = ['jan','feb','mrt','apr','mei','jun','jul','aug','sep','okt','nov','dec'];
let plumeRunShort = 'ENS-run niet geverifieerd';
let plumeCoverageShort = 'dekking niet geverifieerd';
const ROTTERDAM = { lat: 51.9244, lon: 4.4777, naam: 'Rotterdam' };
// De bediening toont maximaal 15 kalenderdagen. Voor rechts-gelabelde
// neerslag is ook 00 UTC van dag 16 nodig om het laatste vak 18–24 UTC af te
// maken; die extra brondag wordt nooit als forecastdag getoond.
const MAX_FORECAST_DAYS = 15;
const SOURCE_FORECAST_DAYS = MAX_FORECAST_DAYS + 1;
const MS_DAY = 24 * 60 * 60 * 1000;
const CLOUD_CATS = [
  { label: 'Onbewolkt', lo: 0, hi: 12, color: '#f5e642' },
  { label: 'Licht bewolkt', lo: 12, hi: 37, color: '#dcd28c' },
  { label: 'Half bewolkt', lo: 37, hi: 62, color: '#a09464' },
  { label: 'Zwaar bewolkt', lo: 62, hi: 87, color: '#828296' },
  { label: 'Geheel bewolkt', lo: 87, hi: 101, color: '#373746' },
];
const SPATIAL_SAMPLE_OFFSETS_KM = [
  [0, 0],
  [10, 0], [-10, 0], [0, 10], [0, -10],
];
const SPATIAL_FETCH_CONCURRENCY = 5;

const _fetchCache = {};
const _fetchInflight = {};
const _statsCache = {};
const _statsInflight = {};
const CACHE_TTL = 10 * 60 * 1000;
const OM_PROXY_BASE = (location.protocol === 'https:' && /(^|\.)weerlab\.nl$/.test(location.hostname))
  ? 'https://om.weerlab.nl/om'
  : null;
const FAST_UPDATE_WINDOWS = [
  { start: 5 * 60 + 30, end: 12 * 60 },
  { start: 17 * 60 + 30, end: 23 * 60 + 59 },
];
const FAST_UPDATE_INTERVAL_MS = 2 * 60 * 1000;
const NORMAL_UPDATE_INTERVAL_MS = 15 * 60 * 1000;
let autoRefreshTimer = null;
const ECMWF_ENS_META_URL = 'https://ensemble-api.open-meteo.com/data/ecmwf_ifs025_ensemble/static/meta.json';
let activeEnsMetaSentinel = '';

function rewriteOM(url) {
  if (!OM_PROXY_BASE) return url;
  const map = [
    ['https://ensemble-api.open-meteo.com/v1/ensemble', `${OM_PROXY_BASE}/ensemble`],
    ['https://api.open-meteo.com/v1/forecast', `${OM_PROXY_BASE}/forecast`],
  ];
  for (const [from, to] of map) {
    if (url.startsWith(from)) return to + url.slice(from.length);
  }
  return url;
}

function addFreshParam(url) {
  if (!OM_PROXY_BASE) return url;
  const u = new URL(url, location.href);
  u.searchParams.set('_weerlab_fresh', '1');
  return u.toString();
}

function isFastUpdateWindow(d = new Date()) {
  const m = d.getHours() * 60 + d.getMinutes();
  return FAST_UPDATE_WINDOWS.some(w => m >= w.start && m <= w.end);
}

function verifiedEnsRunMeta(meta) {
  const init = Number(meta?.last_run_initialisation_time);
  const end = Number(meta?.data_end_time);
  if (!Number.isFinite(init) || init <= 0 || !Number.isFinite(end) || end < init) {
    throw new Error('ECMWF ENS-metadata bevat geen geldig runvenster.');
  }
  const cycleHour = new Date(init * 1000).getUTCHours();
  if (![0, 6, 12, 18].includes(cycleHour)) {
    throw new Error(`ECMWF ENS-metadata bevat een ongeldige cyclus (${cycleHour} UTC).`);
  }
  return { ...meta, last_run_initialisation_time: init, data_end_time: end };
}

function ensMetaSentinel(meta) {
  const verified = verifiedEnsRunMeta(meta);
  return `${verified.last_run_initialisation_time}:${verified.data_end_time}:${String(verified.last_run_modification_time || '')}`;
}

function ensRunDateBounds(meta) {
  const verified = verifiedEnsRunMeta(meta);
  return {
    startDate: new Date(verified.last_run_initialisation_time * 1000).toISOString().slice(0, 10),
    endDate: new Date(verified.data_end_time * 1000).toISOString().slice(0, 10),
  };
}

async function fetchEnsRunMeta() {
  const separator = ECMWF_ENS_META_URL.includes('?') ? '&' : '?';
  const r = await fetch(`${ECMWF_ENS_META_URL}${separator}_weerlab_meta=${Date.now()}`, { cache: 'no-store' });
  if (!r.ok) throw new Error(`ECMWF ENS-metadata HTTP ${r.status}`);
  return verifiedEnsRunMeta(await r.json());
}

function sameEnsCycle(before, after) {
  return Number(before?.last_run_initialisation_time) === Number(after?.last_run_initialisation_time)
    && Number(before?.data_end_time) === Number(after?.data_end_time)
    && String(before?.last_run_modification_time || '') === String(after?.last_run_modification_time || '');
}

function fmtEnsRun(epochSeconds) {
  const d = new Date(Number(epochSeconds) * 1000);
  return `${DOW_NL[d.getUTCDay()]} ${d.getUTCDate()} ${MAAND_NL[d.getUTCMonth()]} ${String(d.getUTCHours()).padStart(2, '0')} UTC`;
}

function updatePlumeRunInfo(meta) {
  const el = document.getElementById('run-label');
  try {
    const verified = verifiedEnsRunMeta(meta);
    const init = new Date(verified.last_run_initialisation_time * 1000);
    const availS = Number(verified.last_run_availability_time) || verified.last_run_initialisation_time;
    const fmtT = d => d.toLocaleTimeString('nl-NL', { timeZone: 'Europe/Amsterdam', hour: '2-digit', minute: '2-digit' });
    const coverageHours = Math.max(0, Math.round((verified.data_end_time - verified.last_run_initialisation_time) / 3600));
    const isIntermediate = [6, 18].includes(init.getUTCHours());
    plumeRunShort = `ENS-run ${fmtEnsRun(verified.last_run_initialisation_time)}`;
    plumeCoverageShort = `${isIntermediate ? 'tussenrun · ' : ''}actuele dekking ${coverageHours} uur t/m ${fmtEnsRun(verified.data_end_time)}`;
    if (el) el.textContent = `${plumeRunShort} · ${plumeCoverageShort} · bron beschikbaar ${fmtT(new Date(availS * 1000))}`;
    return verified;
  } catch (e) {
    plumeRunShort = 'ENS-run niet geverifieerd';
    plumeCoverageShort = 'dekking niet geverifieerd';
    if (el) el.textContent = `${plumeRunShort} · ${plumeCoverageShort}`;
    return null;
  }
}

function clampPlumeRangeToRun(meta) {
  const startEl = document.getElementById('range-start');
  const endEl = document.getElementById('range-end');
  if (!startEl || !endEl) return;
  const verified = verifiedEnsRunMeta(meta);
  const lastForecastMs = verified.data_end_time * 1000 - 1;
  const runMaxIso = new Date(lastForecastMs).toISOString().slice(0, 10);
  const configuredMax = endEl.dataset.configuredMax || endEl.max || runMaxIso;
  if (!endEl.dataset.configuredMax) endEl.dataset.configuredMax = configuredMax;
  const maxIso = runMaxIso < configuredMax ? runMaxIso : configuredMax;
  startEl.max = maxIso;
  endEl.max = maxIso;
  if (!startEl.value || startEl.value > maxIso) startEl.value = maxIso;
  if (!endEl.value || endEl.value > maxIso) endEl.value = maxIso;
  if (endEl.value < startEl.value) endEl.value = startEl.value;
  syncHighlightBounds();
}

function clearPlumeDataCaches() {
  Object.keys(_fetchCache).forEach(key => delete _fetchCache[key]);
  Object.keys(_statsCache).forEach(key => delete _statsCache[key]);
}

function activateEnsMeta(meta) {
  const sentinel = ensMetaSentinel(meta);
  if (activeEnsMetaSentinel && activeEnsMetaSentinel !== sentinel) clearPlumeDataCaches();
  activeEnsMetaSentinel = sentinel;
  updatePlumeRunInfo(meta);
  clampPlumeRangeToRun(meta);
}

async function loadStableEnsBatch(loader, { force = false, edgeFresh = false, onCycleChange = null } = {}) {
  await window.WeerlabPlumeRuns?.ensureLocation?.(currentStation.lat, currentStation.lon);
  for (let attempt = 0; attempt < 2; attempt++) {
    const metaBefore = await fetchEnsRunMeta();
    activateEnsMeta(metaBefore);
    // De ensemble-endpoint heeft geen run-selector. Een nog niet lokaal
    // gecachte parameter wordt daarom na de meta-sentinel altijd met een verse
    // edge-URL opgehaald; bij een cyclusretry ook zonder browsercache.
    const value = await loader(metaBefore, force || attempt > 0, true);
    const metaAfter = await fetchEnsRunMeta();
    if (sameEnsCycle(metaBefore, metaAfter)) {
      return { value, runMeta: metaBefore };
    }
    clearPlumeDataCaches();
    activeEnsMetaSentinel = '';
    if (typeof onCycleChange === 'function') onCycleChange(metaBefore, metaAfter);
  }
  throw new Error('ECMWF ENS-cyclus wisselde tijdens het laden; de volledige pluim moet opnieuw worden geladen.');
}

async function fetchJson(url, ms = 30000, retries = 3, force = false, edgeFresh = false) {
  const cacheKey = rewriteOM(url);
  const requestUrl = edgeFresh ? addFreshParam(cacheKey) : cacheKey;
  const cached = _fetchCache[cacheKey];
  if (!force && cached && Date.now() - cached.ts < CACHE_TTL) return cached.data;
  if (!force && _fetchInflight[cacheKey]) return _fetchInflight[cacheKey];

  _fetchInflight[cacheKey] = (async () => {
    for (let poging = 0; poging < retries; poging++) {
      const ctrl = new AbortController();
      const id = setTimeout(() => ctrl.abort(), ms);
      try {
        const r = await fetch(requestUrl, { signal: ctrl.signal, cache: force || edgeFresh ? 'no-store' : 'default' });
        clearTimeout(id);
        if (r.status === 429 && poging < retries - 1) {
          await new Promise(res => setTimeout(res, 2000 * (poging + 1)));
          continue;
        }
        if (!r.ok) throw new Error(`HTTP ${r.status}`);
        const data = await r.json();
        _fetchCache[cacheKey] = { data, ts: Date.now() };
        return data;
      } catch (e) {
        clearTimeout(id);
        if (poging === retries - 1) throw new Error(e.name === 'AbortError' ? 'time-out' : e.message);
        await new Promise(res => setTimeout(res, 1200 * (poging + 1)));
      }
    }
  })().finally(() => { delete _fetchInflight[cacheKey]; });
  return _fetchInflight[cacheKey];
}

function lerp(a, b, t) { return a + (b - a) * t; }
function hexToRgb(h) { return [parseInt(h.slice(1,3),16), parseInt(h.slice(3,5),16), parseInt(h.slice(5,7),16)]; }
function colorFromScale(scale, value) {
  for (let i = 0; i < scale.length - 1; i++) {
    const [v0, c0] = scale[i];
    const [v1, c1] = scale[i + 1];
    if (value <= v1) {
      const f = Math.max(0, Math.min(1, (value - v0) / (v1 - v0)));
      const [r0,g0,b0] = hexToRgb(c0);
      const [r1,g1,b1] = hexToRgb(c1);
      return `rgb(${Math.round(lerp(r0,r1,f))},${Math.round(lerp(g0,g1,f))},${Math.round(lerp(b0,b1,f))})`;
    }
  }
  return scale[scale.length - 1][1];
}

function scaleStops(scale, yMin, yMax) {
  const range = yMax - yMin || 1;
  return Array.from(new Set([
    yMin,
    yMax,
    ...scale.map(([value]) => Math.max(yMin, Math.min(yMax, value))),
  ]))
    .sort((a, b) => b - a)
    .map(value => ({
      offset: Math.max(0, Math.min(1, (yMax - value) / range)),
      color: colorFromScale(scale, value),
    }));
}

function mk(parent, tag, attrs, text) {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (text != null) e.textContent = text;
  parent.appendChild(e);
  return e;
}

function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

function percentiel(arr, p) {
  const s = arr.filter(Number.isFinite).sort((a, b) => a - b);
  if (!s.length) return null;
  const idx = (p / 100) * (s.length - 1);
  const lo = Math.floor(idx), hi = Math.ceil(idx);
  return s[lo] + (s[hi] - s[lo]) * (idx - lo);
}

function isoDateLocal(d) {
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
}

function parseIsoDate(iso) {
  const parts = String(iso || '').split('-').map(Number);
  if (parts.length !== 3 || parts.some(n => !Number.isFinite(n))) return null;
  return new Date(parts[0], parts[1] - 1, parts[2]);
}

function addDays(date, days) {
  const d = new Date(date);
  d.setDate(d.getDate() + days);
  return d;
}

function isoDateTimeLocal(d) {
  return `${isoDateLocal(d)}T${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
}

function afstandKm(lat1, lon1, lat2, lon2) {
  const rad = Math.PI / 180;
  const p1 = lat1 * rad;
  const p2 = lat2 * rad;
  const dp = (lat2 - lat1) * rad;
  const dl = (lon2 - lon1) * rad;
  const a = Math.sin(dp / 2) ** 2 + Math.cos(p1) * Math.cos(p2) * Math.sin(dl / 2) ** 2;
  return 6371 * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
}

function offsetPointKm(lat, lon, northKm, eastKm) {
  const dLat = northKm / 111.32;
  const cosLat = Math.max(0.2, Math.cos(lat * Math.PI / 180));
  const dLon = eastKm / (111.32 * cosLat);
  return { lat: lat + dLat, lon: lon + dLon };
}

function spatialSamplePoints(station = currentStation) {
  return SPATIAL_SAMPLE_OFFSETS_KM.map(([northKm, eastKm], idx) => ({
    ...offsetPointKm(station.lat, station.lon, northKm, eastKm),
    idx,
    northKm,
    eastKm,
  }));
}

function requireEnsembleMemberKeys(hourly, base) {
  const keys = WeerlabPlumeMath.ensembleMemberKeys(hourly, base);
  if (keys.length !== 51) {
    throw new Error(`${base}: ${keys.length} ensembleleden ontvangen; exact 51 vereist`);
  }
  return keys;
}

function completeMemberWindow(times, memberMatrices) {
  const members = memberMatrices.flat();
  if (!Array.isArray(times) || !times.length || !members.length || members.some(member => !Array.isArray(member))) {
    throw new Error('Geen volledige ensemblematrix ontvangen');
  }
  const limit = Math.min(times.length, ...members.map(member => member.length));
  let first = -1;
  let lastExclusive = limit;
  for (let index = 0; index < limit; index++) {
    const complete = members.every(member => Number.isFinite(member[index]));
    if (first < 0) {
      if (complete) first = index;
    } else if (!complete) {
      lastExclusive = index;
      break;
    }
  }
  if (first < 0 || lastExclusive - first < 2) {
    throw new Error('Ensemble bevat te weinig tijdstappen met alle 51 leden compleet');
  }
  return { first, lastExclusive };
}

function aggregateMembersByHours(times, members, hours = 6) {
  return WeerlabPlumeMath.aggregatePrecedingHours(times, members, hours, { keepInitialZero: false });
}

function cumulativeMembers(members) {
  return WeerlabPlumeMath.cumulativeMembers(members);
}

function precedingIntervalHours(times, index) {
  if (index <= 0) return null;
  const current = new Date(times?.[index]).getTime();
  const adjacent = new Date(times[index - 1]).getTime();
  if (!Number.isFinite(current) || !Number.isFinite(adjacent)) return null;
  const hours = Math.abs(current - adjacent) / 3600000;
  return hours > 0 && hours <= 6 ? hours : null;
}

function initRangeInputs() {
  const startEl = document.getElementById('range-start');
  const endEl = document.getElementById('range-end');
  const today = new Date();
  const minIso = isoDateLocal(today);
  const maxIso = isoDateLocal(addDays(today, MAX_FORECAST_DAYS - 1));
  [startEl, endEl].forEach(el => {
    el.min = minIso;
    el.max = maxIso;
  });
  startEl.value = minIso;
  endEl.value = maxIso;
  syncHighlightBounds();
}

function selectedRange() {
  const startEl = document.getElementById('range-start');
  const endEl = document.getElementById('range-end');
  const today = new Date();
  const minDate = parseIsoDate(startEl.min) || today;
  const maxDate = parseIsoDate(endEl.max) || addDays(today, MAX_FORECAST_DAYS - 1);
  let start = parseIsoDate(startEl.value) || minDate;
  let end = parseIsoDate(endEl.value) || maxDate;
  if (start < minDate) start = minDate;
  if (start > maxDate) start = maxDate;
  if (end < start) end = start;
  if (end > maxDate) end = maxDate;
  startEl.value = isoDateLocal(start);
  endEl.value = isoDateLocal(end);
  return {
    start,
    end,
    startIso: isoDateLocal(start),
    endIso: isoDateLocal(end),
    endExclusive: addDays(end, 1),
  };
}

function selectedRangeDays() {
  const { start, end } = selectedRange();
  return Math.max(1, Math.round((end - start) / MS_DAY) + 1);
}

function dateInputShouldWait(el) {
  if (!el) return false;
  if (!el.value) return document.activeElement === el;
  if (!/^\d{4}-\d{2}-\d{2}$/.test(el.value)) return true;
  return el.validity && !el.validity.valid;
}

function bindDateCommit(ids, commit) {
  ids.forEach(id => {
    const el = document.getElementById(id);
    el.addEventListener('change', () => {
      if (dateInputShouldWait(el)) {
        el.dataset.pendingDateCommit = '1';
        return;
      }
      delete el.dataset.pendingDateCommit;
      commit(id);
    });
    el.addEventListener('blur', () => {
      delete el.dataset.pendingDateCommit;
      commit(id);
    });
    el.addEventListener('keydown', e => {
      if (e.key === 'Enter') {
        e.preventDefault();
        el.blur();
      }
    });
  });
}

const DAY_HIGHLIGHT_COLORS = {
  red: { fill: 'rgba(225, 70, 70, 0.30)', stroke: 'rgba(255, 255, 255, 0.42)' },
  blue: { fill: 'rgba(70, 165, 255, 0.28)', stroke: 'rgba(255, 255, 255, 0.42)' },
  yellow: { fill: 'rgba(255, 214, 80, 0.28)', stroke: 'rgba(255, 255, 255, 0.42)' },
  purple: { fill: 'rgba(170, 95, 255, 0.28)', stroke: 'rgba(255, 255, 255, 0.42)' },
};

function syncHighlightBounds() {
  const inputs = ['highlight-start', 'highlight-end']
    .map(id => document.getElementById(id))
    .filter(Boolean);
  if (!inputs.length) return;
  const { startIso, endIso } = selectedRange();
  inputs.forEach(el => {
    el.min = startIso;
    el.max = endIso;
    if (el.value && (el.value < startIso || el.value > endIso)) el.value = '';
  });
}

function syncHighlightPeriod(changedId) {
  const startEl = document.getElementById('highlight-start');
  const endEl = document.getElementById('highlight-end');
  if (!startEl || !endEl) return;
  if (changedId === 'highlight-start' && startEl.value && !endEl.value) endEl.value = startEl.value;
  if (changedId === 'highlight-end' && endEl.value && !startEl.value) startEl.value = endEl.value;
  if (startEl.value && endEl.value && endEl.value < startEl.value) {
    const oldStart = startEl.value;
    startEl.value = endEl.value;
    endEl.value = oldStart;
  }
}

function selectedHighlight() {
  const startEl = document.getElementById('highlight-start');
  const endEl = document.getElementById('highlight-end');
  const startValue = startEl?.value || endEl?.value;
  const endValue = endEl?.value || startEl?.value;
  if (!startValue || !endValue) return null;
  const startIso = startValue <= endValue ? startValue : endValue;
  const endIso = startValue <= endValue ? endValue : startValue;
  const palette = DAY_HIGHLIGHT_COLORS[document.getElementById('highlight-color')?.value] || DAY_HIGHLIGHT_COLORS.red;
  return { startIso, endIso, ...palette };
}

function highlightBoundsForTimes(ts, startIso, endIso, xF, leftEdge, rightEdge) {
  if (!ts.length) return null;
  const timeAt = index => new Date(ts[index]).getTime();
  const xAt = targetTime => {
    const firstTime = timeAt(0);
    const lastTime = timeAt(ts.length - 1);
    if (targetTime <= firstTime) return leftEdge;
    if (targetTime >= lastTime) return rightEdge;
    for (let i = 1; i < ts.length; i++) {
      const previousTime = timeAt(i - 1);
      const nextTime = timeAt(i);
      if (targetTime <= nextTime) {
        const fraction = (targetTime - previousTime) / (nextTime - previousTime);
        return xF(i - 1) + fraction * (xF(i) - xF(i - 1));
      }
    }
    return rightEdge;
  };
  const start = parseIsoDate(startIso);
  const endDate = parseIsoDate(endIso);
  if (!start || !endDate) return null;
  const end = addDays(endDate, 1);
  const left = xAt(start.getTime());
  const right = xAt(end.getTime());
  if (right <= left) return null;
  return { left, right };
}

function drawNightBands(bg, ts, xF, top, IH, IW, leftEdge) {
  let nightStart = null;
  for (let i = 0; i <= ts.length; i++) {
    const h = i < ts.length ? new Date(ts[i]).getHours() : -1;
    const isNight = h < 6 || h >= 21;
    if (isNight && nightStart === null) {
      nightStart = i === 0 ? leftEdge : xF(i);
    } else if (!isNight && nightStart !== null) {
      mk(bg, 'rect', { x: nightStart.toFixed(1), y: top, width: Math.max(0, xF(i) - nightStart).toFixed(1), height: IH, fill: 'rgba(0,0,0,0.20)', 'pointer-events': 'none' });
      nightStart = null;
    }
    if (i === ts.length && nightStart !== null) {
      mk(bg, 'rect', { x: nightStart.toFixed(1), y: top, width: Math.max(0, leftEdge + IW - nightStart).toFixed(1), height: IH, fill: 'rgba(0,0,0,0.20)', 'pointer-events': 'none' });
    }
  }
}

function drawDayHighlight(group, ts, xF, leftEdge, rightEdge, top, height) {
  const highlight = selectedHighlight();
  const bounds = highlight && highlightBoundsForTimes(ts, highlight.startIso, highlight.endIso, xF, leftEdge, rightEdge);
  if (!bounds) return;
  const x = bounds.left;
  const width = Math.max(0, bounds.right - bounds.left);
  mk(group, 'rect', {
    x: x.toFixed(1),
    y: top,
    width: width.toFixed(1),
    height,
    fill: highlight.fill,
    stroke: highlight.stroke,
    'stroke-width': 1.2,
    'pointer-events': 'none',
  });
  [x, x + width].forEach(xx => {
    mk(group, 'line', {
      x1: xx.toFixed(1),
      y1: top,
      x2: xx.toFixed(1),
      y2: top + height,
      stroke: 'rgba(255,255,255,0.62)',
      'stroke-width': 1.8,
      'pointer-events': 'none',
    });
  });
}

function smoothPath(pts) {
  if (pts.length < 2) return '';
  let d = `M${pts[0][0].toFixed(2)},${pts[0][1].toFixed(2)}`;
  for (let i = 1; i < pts.length; i++) {
    d += ` L${pts[i][0].toFixed(2)},${pts[i][1].toFixed(2)}`;
  }
  return d;
}

function smoothPointsY(pts, passes = 0) {
  if (!passes || pts.length < 5) return pts;
  let out = pts.map(p => [p[0], p[1]]);
  for (let pass = 0; pass < passes; pass++) {
    out = out.map((p, i, arr) => {
      if (i < 2 || i > arr.length - 3) return p;
      const y = (arr[i - 2][1] + arr[i - 1][1] * 2 + arr[i][1] * 3 + arr[i + 1][1] * 2 + arr[i + 2][1]) / 9;
      return [p[0], y];
    });
  }
  return out;
}

function bandPath(topPts, botPts) {
  if (topPts.length < 2 || botPts.length < 2) return '';
  return smoothPath(topPts) + ' L' +
    [...botPts].reverse().map(p => `${p[0].toFixed(2)},${p[1].toFixed(2)}`).join(' L') + ' Z';
}

function linearAreaPath(topPts, botPts) {
  if (topPts.length < 2 || botPts.length < 2) return '';
  const top = topPts.map((p, i) => `${i ? 'L' : 'M'}${p[0].toFixed(2)},${p[1].toFixed(2)}`).join(' ');
  const bot = [...botPts].reverse().map(p => `L${p[0].toFixed(2)},${p[1].toFixed(2)}`).join(' ');
  return `${top} ${bot} Z`;
}

function fmtDag(t) {
  const d = new Date(t);
  return `${DOW_NL[d.getDay()]} ${d.getDate()} ${MAAND_NL[d.getMonth()]}`;
}

function fmtValue(v, cfg) {
  if (!Number.isFinite(v)) return '-';
  const n = cfg.decimals == null ? Math.round(v) : v.toFixed(cfg.decimals);
  return `${n}${cfg.unit}`;
}

function kmhToBft(kmh) {
  const limits = [1, 6, 12, 20, 29, 39, 50, 62, 75, 89, 103, 118];
  for (let i = 0; i < limits.length; i++) {
    if (kmh < limits[i]) return i;
  }
  return 12;
}

function capeDuiding(cape) {
  if (!Number.isFinite(cape) || cape < 100) return 'stabiel';
  if (cape < 500) return 'licht onstabiel';
  if (cape < 1000) return 'matig onstabiel';
  if (cape < 2000) return 'flink onstabiel';
  if (cape < 3000) return 'zeer onstabiel';
  if (cape < 4000) return 'extreem onstabiel';
  return 'uitzonderlijk onstabiel';
}

function thunderChanceColor(chance) {
  if (!Number.isFinite(chance) || chance < 10) return { fill: 'rgba(255,255,255,0.32)', stroke: 'rgba(255,255,255,0.50)', text: '#26323c' };
  if (chance < 25) return { fill: 'rgba(241,216,99,0.92)', stroke: 'rgba(255,255,255,0.72)', text: '#2e2b16' };
  if (chance < 50) return { fill: 'rgba(239,161,64,0.94)', stroke: 'rgba(255,255,255,0.72)', text: '#2e1c0e' };
  if (chance < 75) return { fill: 'rgba(217,87,59,0.94)', stroke: 'rgba(255,255,255,0.76)', text: '#ffffff' };
  return { fill: 'rgba(115,46,135,0.94)', stroke: 'rgba(255,255,255,0.78)', text: '#ffffff' };
}

function makeDailyThunderStats(stats) {
  const days = new Map();
  stats.forEach(s => {
    const dayIso = isoDateLocal(new Date(s.t));
    const chance = s.extra?.thunderChance;
    const cape = s.p90;
    if (!days.has(dayIso)) {
      days.set(dayIso, { t: s.t, iso: dayIso, chance: 0, cape: 0 });
    }
    const day = days.get(dayIso);
    if (Number.isFinite(chance) && chance > day.chance) {
      day.chance = chance;
      day.t = s.t;
    }
    if (Number.isFinite(cape) && cape > day.cape) day.cape = cape;
  });
  return [...days.values()];
}

function makeDefaultStats(times, members) {
  return times.map((t, i) => {
    const vals = members.map(m => m[i]).filter(Number.isFinite);
    return {
      t,
      p10: percentiel(vals, 10),
      p25: percentiel(vals, 25),
      p50: percentiel(vals, 50),
      p75: percentiel(vals, 75),
      p90: percentiel(vals, 90),
    };
  });
}

function makeDailyMaxStats(times, members) {
  const days = [];
  const byDay = new Map();
  times.forEach((t, i) => {
    const d = new Date(t);
    const key = `${d.getFullYear()}-${d.getMonth()}-${d.getDate()}`;
    if (!byDay.has(key)) {
      const entry = { t, idxs: [] };
      byDay.set(key, entry);
      days.push(entry);
    }
    byDay.get(key).idxs.push(i);
  });
  return days.map(day => {
    const maxima = members.map(member => {
      const vals = day.idxs.map(i => member[i]).filter(Number.isFinite);
      return vals.length ? Math.max(...vals) : null;
    }).filter(Number.isFinite);
    if (!maxima.length) return null;
    return {
      t: day.t,
      pMin: Math.min(...maxima),
      p10: percentiel(maxima, 10),
      p50: percentiel(maxima, 50),
      p90: percentiel(maxima, 90),
      pMax: Math.max(...maxima),
    };
  }).filter(s => s && Number.isFinite(s.p50));
}

function sliceForSelectedRange(times, stats) {
  const { start, endExclusive, startIso, endIso } = selectedRange();
  const cumulativeMembersForRange = stats.rebaseCumulative && Array.isArray(stats.memberCumulative)
    ? stats.memberCumulative
    : null;
  const precedingHours = Number(stats.precedingHours);
  const hasPrecedingIntervals = Number.isFinite(precedingHours) && precedingHours > 0;
  const precedingMs = hasPrecedingIntervals ? precedingHours * 3600000 : 0;
  // Neerslagvakken zijn in UTC opgebouwd en rechts gelabeld. Gebruik daarom
  // ook UTC-kalendergrenzen bij het trimmen: 06, 12, 18 en 00 UTC leveren exact
  // vier complete 6-uursvakken per gekozen dag, inclusief het laatste 18–24-vak.
  const startMs = hasPrecedingIntervals
    ? Date.parse(`${startIso}T00:00:00Z`)
    : start.getTime();
  const endMs = hasPrecedingIntervals
    ? Date.parse(`${endIso}T00:00:00Z`) + MS_DAY
    : endExclusive.getTime();
  // Een rechts-gelabeld 6-uursvak hoort alleen bij de selectie als het hele
  // interval erin valt. Instantane parameters blijven gewoon op hun tijdstip
  // geselecteerd worden.
  let first = times.findIndex(t => new Date(t).getTime() >= startMs + precedingMs);
  if (first < 0) first = times.length;
  let last = first;
  while (last < times.length && (
    hasPrecedingIntervals
      ? new Date(times[last]).getTime() <= endMs
      : new Date(times[last]).getTime() < endMs
  )) last++;
  const slicedTimes = times.slice(first, last);
  let slicedStats;
  if (cumulativeMembersForRange) {
    const rebasedMembers = cumulativeMembersForRange.map(member => {
      const baseline = first > 0 && Number.isFinite(member?.[first - 1]) ? member[first - 1] : 0;
      return member.slice(first, last).map(value => (
        Number.isFinite(value) ? Math.max(0, value - baseline) : null
      ));
    });
    // Cruciaal: eerst ieder lid herijken, daarna de percentielen. Afzonderlijk
    // P10/P50/P90 aftrekken levert bij rangwissels een fysisch onmogelijke band.
    slicedStats = makeDefaultStats(slicedTimes, rebasedMembers);
    slicedStats.rebaseCumulative = true;
    slicedStats.precedingHours = stats.precedingHours;
    slicedStats.memberCumulative = rebasedMembers;
  } else {
    slicedStats = stats.slice(first, last).map(s => ({ ...s, extra: s.extra ? { ...s.extra } : s.extra }));
  }
  if (hasPrecedingIntervals) slicedStats.precedingHours = precedingHours;
  if (stats.dailyMax) {
    slicedStats.dailyMax = stats.dailyMax.filter(s => {
      const t = new Date(s.t).getTime();
      return t >= startMs && t < endMs;
    });
  }
  if (stats.dailyThunder) {
    slicedStats.dailyThunder = stats.dailyThunder.filter(s => {
      const t = new Date(s.t).getTime();
      return t >= startMs && t < endMs;
    });
  }
  if (stats.spatialPoints) slicedStats.spatialPoints = stats.spatialPoints;
  if (stats.spatialRadiusKm) slicedStats.spatialRadiusKm = stats.spatialRadiusKm;
  return { times: slicedTimes, stats: slicedStats };
}

function updateSummary(stats, cfg, el = document.getElementById('samenvatting')) {
  const valid = stats.some(s => Number.isFinite(s.p50));
  if (!valid) { el.innerHTML = ''; return; }
  el.innerHTML = cfg.summary(stats).map(t => `<span class="chip">${escHtml(t)}</span>`).join('');
}

function makeThunderCardData(stats, cfg) {
  if (!cfg.dailyThunderLabels) return null;
  const days = stats.dailyThunder?.length ? stats.dailyThunder : makeDailyThunderStats(stats);
  if (!days.length) return null;
  const best = days.reduce((a, b) => {
    if (Math.round(b.chance) !== Math.round(a.chance)) return b.chance > a.chance ? b : a;
    return b.cape > a.cape ? b : a;
  }, days[0]);
  return {
    title: `Onweerskans per dag in ${currentStation?.naam || 'Rotterdam'}`,
    bestLabel: `hoogste: ${Math.round(best.chance)}% · ${fmtDag(best.t)}`,
    basis: `${stats.spatialPoints > 1 ? `Gebiedsgemiddelde van ${stats.spatialPoints} punten rond de gekozen plaats. ` : ''}Gebaseerd op ECMWF-ensembleleden met tegelijk voldoende buienenergie (CAPE ≥ 500 J/kg) en neerslagsignaal. De native 3- of 6-uursintervalsom wordt daarvoor omgerekend naar ≥ 0,1 mm/uur. De dagkans is het hoogste modelstapsignaal van die dag.`,
    days: days.map(day => {
      const dt = parseIsoDate(day.iso) || new Date(day.t);
      const chance = Math.round(day.chance);
      const color = thunderChanceColor(chance);
      return {
        label: `${DOW_NL[dt.getDay()]} ${dt.getDate()} ${MAAND_NL[dt.getMonth()]}`,
        chance,
        cape: day.cape,
        fill: color.fill,
        stroke: color.stroke,
        text: color.text,
      };
    }),
  };
}

function renderThunderCard(stats, cfg, el) {
  if (!el) return;
  const card = makeThunderCardData(stats, cfg);
  if (!card) {
    el.hidden = true;
    el.innerHTML = '';
    return;
  }
  const dayHtml = card.days.map(day => {
    const style = `--risk-fill:${day.fill};--risk-stroke:${day.stroke};--risk-text:${day.text};`;
    return `
      <div class="thunder-day" style="${style}" title="Onweerkans ${day.chance}% · ${capeDuiding(day.cape)}">
        <span class="d">${escHtml(day.label)}</span>
        <strong>${day.chance}%</strong>
      </div>`;
  }).join('');
  el.innerHTML = `
    <div class="thunder-bolt" aria-hidden="true">⚡</div>
    <div class="thunder-copy">
      <div class="thunder-kop">
        <div>${escHtml(card.title)}</div>
        <span>${escHtml(card.bestLabel)}</span>
      </div>
      <div class="thunder-days">${dayHtml}</div>
      <div class="thunder-basis">${escHtml(card.basis)}</div>
    </div>`;
  el.hidden = false;
}

function updateLegend(cfg, el = document.getElementById('legenda')) {
  if (cfg.render === 'stacked') {
    const items = cfg.legendItems || cfg.stackItems || [];
    el.innerHTML = items.map(item => `
      <div class="leg-item">
        <div class="leg-swatch" style="background:${item.color};"></div>
        ${escHtml(item.label)}
      </div>`).join('');
    return;
  }
  if (cfg.render === 'bars') {
    let html = `
      <div class="leg-item">
        <div class="leg-bnd" style="background:rgba(255,255,255,0.7); border:1px solid rgba(0,0,0,.18);"></div>
        ${escHtml(cfg.barLabel || 'Staafjes')}
      </div>`;
    const items = cfg.legendItems ? [...cfg.legendItems] : [
      { color: '#f0c84a', label: 'weinig bewolking / zonnig' },
      { color: '#4b5563', label: 'veel bewolking' },
    ];
    if (cfg.percentLine) {
      items.push({ type: 'line', color: cfg.percentLine.color || 'white', label: cfg.percentLine.label });
    }
    html += items.map(item => `
      <div class="leg-item">
        ${item.type === 'line'
          ? `<div class="leg-ln" style="background:${item.color}; box-shadow:0 1px 4px rgba(0,0,0,.5);"></div>`
          : `<div class="leg-swatch" style="background:${item.color};"></div>`}
        ${escHtml(item.label)}
      </div>`).join('');
    el.innerHTML = html;
    return;
  }
  el.innerHTML = `
    <div class="leg-item">
      <div class="leg-ln" style="background:${cfg.medianColor || 'white'}; box-shadow:0 0 0 2px ${cfg.medianHaloColor || 'rgba(0,0,0,.5)'},0 1px 4px rgba(0,0,0,.5);"></div>
      ${escHtml(cfg.lineLabel)}
    </div>
    <div class="leg-item">
      <div class="leg-bnd" style="background:${cfg.bandFill || 'rgba(0,0,0,0.28)'}; border:1px solid ${cfg.bandEdgeColor || 'rgba(0,0,0,.15)'};"></div>
      ${escHtml(cfg.bandLabel)}
    </div>
    ${/P10-P90/.test(cfg.bandLabel || '') ? `
    <div class="leg-item">
      <div class="leg-bnd" style="background:${cfg.innerBandFill || cfg.bandFill || 'rgba(0,0,0,0.28)'}; border:1px solid ${cfg.bandEdgeColor || 'rgba(0,0,0,.15)'}; filter:brightness(1.12) saturate(1.15);"></div>
      Kern P25-P75 (helft van de leden)
    </div>` : ''}
    ${showDailyTxRange && cfg.hourly === 'temperature_2m' ? `
    <div class="leg-item">
      <div class="leg-ln" style="background:#ffd264; box-shadow:0 1px 4px rgba(0,0,0,.5);"></div>
      MOS/MIX maximumtemperatuur (10 dagen)
    </div>` : ''}`;
}

function calcRange(stats, cfg) {
  if (cfg.yMin != null && cfg.yMax != null) return { yMin: cfg.yMin, yMax: cfg.yMax };
  const rangeKeys = Array.isArray(cfg.rangeKeys) && cfg.rangeKeys.length ? cfg.rangeKeys : ['p10', 'p90'];
  const all = stats.flatMap(s => rangeKeys.map(key => s[key])).filter(Number.isFinite);
  if (cfg.hourly === 'temperature_2m' && showDailyTxRange && stats.dailyMax) {
    stats.dailyMax.forEach(s => {
      const v = mosmixDailyTx[isoDateLocal(new Date(s.t))];
      if (Number.isFinite(v)) all.push(v);
    });
  }
  if (!all.length) throw new Error('Geen data ontvangen');
  const pad = cfg.rangePad ?? 0;
  let yMin = cfg.yMin ?? Math.floor((Math.min(...all) - pad) / cfg.yStep) * cfg.yStep;
  let yMax = cfg.yMax ?? Math.ceil((Math.max(...all) + pad) / cfg.yStep) * cfg.yStep;
  if (cfg.yMin === 0) yMin = 0;
  while (yMax - yMin < (cfg.minRange || cfg.yStep * 4)) { yMax += cfg.yStep; if (cfg.yMin !== 0) yMin -= cfg.yStep; }
  return { yMin, yMax };
}

const Y_AXIS_FONT = '800 12.5px Inter, sans-serif';
const Y_AXIS_GAP = 7;
let axisMeasureCtx = null;

// Breedste y-as-label bepaalt de linkermarge. Met een vaste marge valt
// "40 km/u" of "14.0 mm" links buiten de viewBox en knipt de SVG het
// eerste cijfer af.
function yAxisLabelWidth(yMin, yMax, cfg) {
  if (!(cfg.yStep > 0)) return 0;
  if (!axisMeasureCtx) axisMeasureCtx = document.createElement('canvas').getContext('2d');
  if (!axisMeasureCtx) return 0;
  axisMeasureCtx.font = Y_AXIS_FONT;
  let maxW = 0, steps = 0;
  for (let v = Math.ceil(yMin / cfg.yStep) * cfg.yStep; v <= yMax && steps < 200; v += cfg.yStep, steps++) {
    maxW = Math.max(maxW, axisMeasureCtx.measureText(fmtValue(v, cfg)).width);
  }
  return maxW;
}

function drawChart(svg, times, stats, cfg, opts = {}) {
  while (svg.firstChild) svg.removeChild(svg.firstChild);

  const W = 820, H = opts.height || 350;
  svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
  const ranged = sliceForSelectedRange(times, stats);
  const ts = ranged.times;
  const st = ranged.stats;
  const nMax = ts.length;
  const { yMin, yMax } = calcRange(st, cfg);
  const leftAxisMin = Math.ceil(yAxisLabelWidth(yMin, yMax, cfg) + Y_AXIS_GAP + 3);
  const M = { top: 16, right: cfg.rightAxis ? 58 : 20, bottom: 68, left: Math.max(cfg.leftAxis || 58, leftAxisMin) };
  const IW = W - M.left - M.right;
  const IH = H - M.top - M.bottom;
  const yRange = yMax - yMin || 1;
  const timeValues = ts.map(t => new Date(t).getTime());
  const timeStart = timeValues[0];
  const timeEnd = timeValues[timeValues.length - 1];
  const timeRange = Math.max(1, timeEnd - timeStart);
  // ECMWF gaat later in de run van 3- naar 6-uursstappen. Gebruik daarom de
  // echte tijd in plaats van het puntnummer, anders wordt de staart ingedrukt.
  const xF = i => M.left + ((timeValues[i] - timeStart) / timeRange) * IW;
  const yF = v => M.top + (1 - (v - yMin) / yRange) * IH;
  const yPercentF = v => M.top + (1 - Math.max(0, Math.min(100, v)) / 100) * IH;

  updateSummary(st, cfg, opts.summaryEl);
  updateLegend(cfg, opts.legendEl);
  if (Object.prototype.hasOwnProperty.call(opts, 'thunderCardEl')) {
    renderThunderCard(st, cfg, opts.thunderCardEl);
  }

  const defs = mk(svg, 'defs', {});
  const clipId = opts.clipId || `chartClip-${Math.random().toString(36).slice(2)}`;
  const clipPath = mk(defs, 'clipPath', { id: clipId });
  mk(clipPath, 'rect', { x: M.left, y: M.top, width: IW, height: IH });

  const bg = mk(svg, 'g', { 'clip-path': `url(#${clipId})` });
  if (cfg.smoothScale) {
    const gradId = `${clipId}-scale`;
    const grad = mk(defs, 'linearGradient', {
      id: gradId,
      x1: 0, y1: M.top, x2: 0, y2: M.top + IH,
      gradientUnits: 'userSpaceOnUse',
    });
    scaleStops(cfg.scale, yMin, yMax).forEach(stop => {
      mk(grad, 'stop', {
        offset: `${(stop.offset * 100).toFixed(2)}%`,
        'stop-color': stop.color,
      });
    });
    mk(bg, 'rect', {
      x: M.left, y: M.top, width: IW, height: IH,
      fill: `url(#${gradId})`,
      opacity: cfg.backgroundOpacity ?? 0.82,
    });
  } else if (Array.isArray(cfg.beaufortBands)) {
    cfg.beaufortBands.forEach(band => {
      const low = Math.max(yMin, band.min);
      const high = Math.min(yMax, band.max);
      if (high <= low) return;
      const yy = yF(high);
      mk(bg, 'rect', {
        x: M.left,
        y: yy.toFixed(1),
        width: IW,
        height: Math.max(0, yF(low) - yy).toFixed(1),
        fill: band.color,
        opacity: 0.9,
      });
    });
  } else {
    for (let v = yMin; v < yMax; v += cfg.yStep) {
      const bandTop = Math.min(yMax, v + cfg.yStep);
      const yy = yF(bandTop);
      const hh = yF(v) - yy;
      mk(bg, 'rect', {
        x: M.left, y: yy.toFixed(1), width: IW, height: Math.max(0, hh).toFixed(1),
        fill: colorFromScale(cfg.scale, v + cfg.yStep / 2),
        opacity: cfg.render === 'bars' ? 0.28 : (cfg.render === 'stacked' ? 0.16 : 0.88),
      });
    }
  }

  for (let i = 1; i < ts.length; i++) {
    const t = new Date(ts[i]);
    if (t.getHours() === 0) {
      const xx = xF(i).toFixed(1);
      mk(bg, 'line', { x1: xx, y1: M.top, x2: xx, y2: M.top + IH, stroke: cfg.dayLineColor || 'rgba(0,0,0,0.28)', 'stroke-width': 1.5 });
    }
  }

  const sampledPoints = key => st.map((s, i) => (
    Number.isFinite(s[key]) ? [xF(i), yF(s[key])] : null
  )).filter(Boolean);
  const sampledBand = () => st.map((s, i) => (
    Number.isFinite(s.p90) && Number.isFinite(s.p10)
      ? { top: [xF(i), yF(s.p90)], bot: [xF(i), yF(s.p10)] }
      : null
  )).filter(Boolean);

  if (cfg.render === 'stacked') {
    const stackItems = cfg.stackItems || cfg.legendItems || [];
    for (let catIdx = 0; catIdx < stackItems.length; catIdx++) {
      const topPts = [];
      const botPts = [];
      st.forEach((s, i) => {
        const stack = s.extra?.stack;
        if (!Array.isArray(stack)) return;
        const base = Math.max(0, Math.min(100, stack.slice(0, catIdx).reduce((sum, value) => sum + (Number.isFinite(value) ? value : 0), 0)));
        const top = Math.max(0, Math.min(100, base + (Number.isFinite(stack[catIdx]) ? stack[catIdx] : 0)));
        topPts.push([xF(i), yPercentF(top)]);
        botPts.push([xF(i), yPercentF(base)]);
      });
      const d = linearAreaPath(topPts, botPts);
      if (d) mk(bg, 'path', { d, fill: stackItems[catIdx]?.color || '#dfe5de', opacity: 0.95, stroke: 'none' });
    }
    for (let i = 1; i < ts.length; i++) {
      const t = new Date(ts[i]);
      if (t.getHours() === 0) {
        const xx = xF(i).toFixed(1);
        mk(bg, 'line', { x1: xx, y1: M.top, x2: xx, y2: M.top + IH, stroke: 'rgba(255,255,255,0.46)', 'stroke-width': 1 });
      }
    }
  } else if (cfg.render === 'bars') {
    const spacing = IW / Math.max(1, nMax - 1);
    const rangeW = cfg.barRange
      ? Math.max(5, spacing * (cfg.rangeWidthFactor ?? 0.78))
      : Math.max(3, spacing * 2.25);
    const fullRangeW = cfg.barFullRange
      ? Math.max(rangeW + 1, spacing * (cfg.fullRangeWidthFactor ?? 0.95))
      : rangeW;
    const barW = cfg.barRange
      ? Math.max(3, spacing * (cfg.barWidthFactor ?? 0.38))
      : Math.max(3, spacing * 2.25);
    st.forEach((s, i) => {
      const barValue = cfg.barValue ? s[cfg.barValue] : s.p50;
      if (!Number.isFinite(barValue)) return;
      const fill = cfg.barColor ? cfg.barColor(s, barValue) : colorFromScale(cfg.scale, barValue);
      const rangeValue = cfg.rangeColorValue && Number.isFinite(s[cfg.rangeColorValue]) ? s[cfg.rangeColorValue] : barValue;
      const rangeFill = cfg.barColor ? cfg.barColor(s, rangeValue) : colorFromScale(cfg.scale, rangeValue);
      const drawRange = (low, high, width, opacity, stroke, capStroke, haloStroke) => {
        if (!Number.isFinite(low) || !Number.isFinite(high)) return;
        const hi = Math.max(low, high);
        const lo = Math.max(yMin, Math.min(low, high));
        const rangeTop = yF(hi);
        const rangeBot = yF(lo);
        const rangeH = Math.max(1.6, rangeBot - rangeTop);
        mk(bg, 'rect', {
          x: (xF(i) - width / 2).toFixed(1),
          y: rangeTop.toFixed(1),
          width: width.toFixed(1),
          height: rangeH.toFixed(1),
          rx: 2,
          fill: rangeFill,
          opacity,
          stroke,
          'stroke-width': 0.9,
        });
        const capY = [yF(hi), yF(lo)];
        capY.forEach(yy => {
          mk(bg, 'line', {
            x1: (xF(i) - width / 2).toFixed(1),
            y1: yy.toFixed(1),
            x2: (xF(i) + width / 2).toFixed(1),
            y2: yy.toFixed(1),
            stroke: haloStroke,
            'stroke-width': 2.6,
          });
          mk(bg, 'line', {
            x1: (xF(i) - width / 2).toFixed(1),
            y1: yy.toFixed(1),
            x2: (xF(i) + width / 2).toFixed(1),
            y2: yy.toFixed(1),
            stroke: capStroke,
            'stroke-width': 1.35,
          });
        });
      };
      if (cfg.barFullRange && Number.isFinite(s.pMin) && Number.isFinite(s.pMax)) {
        drawRange(s.pMin, s.pMax, fullRangeW, cfg.fullRangeOpacity ?? 0.2, cfg.fullRangeStroke || 'rgba(3,23,15,0.66)', cfg.rangeCapStroke || 'rgba(255,255,255,0.86)', cfg.rangeHaloStroke || 'rgba(0,0,0,0.34)');
      }
      if (cfg.barRange && Number.isFinite(s.p10) && Number.isFinite(s.p90)) {
        drawRange(s.p10, s.p90, rangeW, cfg.rangeOpacity ?? 0.52, cfg.rangeStroke || 'rgba(6,38,25,0.72)', cfg.rangeCapStroke || 'rgba(255,255,255,0.92)', cfg.rangeHaloStroke || 'rgba(0,0,0,0.38)');
      }
      // Main bar (P50 or barValue)
      const h = M.top + IH - yF(barValue);
      if (h > 0.5) mk(bg, 'rect', {
        x: (xF(i) - barW / 2).toFixed(1),
        y: yF(barValue).toFixed(1),
        width: barW.toFixed(1),
        height: h.toFixed(1),
        rx: 1.5,
        fill,
        stroke: 'rgba(255,255,255,0.46)',
        'stroke-width': 0.6,
        opacity: 0.96,
      });
    });
    if (cfg.percentLine) {
      const pctPts = st.map((s, i) => {
        const v = s.extra?.[cfg.percentLine.key];
        return Number.isFinite(v) ? [xF(i), yPercentF(v)] : null;
      }).filter(Boolean);
      const pctD = smoothPath(pctPts);
      if (pctD) {
        mk(bg, 'path', { d: pctD, fill: 'none', stroke: 'rgba(0,0,0,0.48)', 'stroke-width': 3.4, 'stroke-linecap': 'butt', 'stroke-linejoin': 'miter' });
        mk(bg, 'path', { d: pctD, fill: 'none', stroke: cfg.percentLine.color || 'white', 'stroke-width': 1.8, 'stroke-linecap': 'butt', 'stroke-linejoin': 'miter' });
      }
    }
  } else {
    const bandPts = sampledBand();
    const smoothPasses = cfg.curveSmoothPasses || 0;
    const topPts = smoothPointsY(bandPts.map(p => p.top), smoothPasses);
    const botPts = smoothPointsY(bandPts.map(p => p.bot), smoothPasses);
    const bandD = bandPath(topPts, botPts);
    if (bandD) mk(bg, 'path', { d: bandD, fill: cfg.bandFill || 'rgba(0,0,0,0.27)', stroke: 'none' });
    const topD = smoothPath(topPts);
    const botD = smoothPath(botPts);
    if (cfg.bandEdgeColor && topD && botD) {
      const edgeAttrs = {
        fill: 'none',
        stroke: cfg.bandEdgeColor,
        'stroke-width': cfg.bandEdgeWidth || 1.4,
        'stroke-linecap': 'butt',
        'stroke-linejoin': 'miter',
      };
      mk(bg, 'path', { d: topD, ...edgeAttrs });
      mk(bg, 'path', { d: botD, ...edgeAttrs });
    }
    // Kernband P25-P75: zelfde vulling bovenop de buitenband → dubbele dichtheid
    // in het hart van de pluim, zonder extra kleuren (detail, maar eenvoudig).
    const innerBandPts = st.map((s, i) => (
      Number.isFinite(s.p75) && Number.isFinite(s.p25)
        ? { top: [xF(i), yF(s.p75)], bot: [xF(i), yF(s.p25)] }
        : null
    )).filter(Boolean);
    if (innerBandPts.length > 1) {
      const innerTop = smoothPointsY(innerBandPts.map(p => p.top), smoothPasses);
      const innerBot = smoothPointsY(innerBandPts.map(p => p.bot), smoothPasses);
      const innerD = bandPath(innerTop, innerBot);
      if (innerD) mk(bg, 'path', { d: innerD, fill: cfg.innerBandFill || cfg.bandFill || 'rgba(0,0,0,0.27)', stroke: 'none' });
    }

    (cfg.referenceLines || []).forEach(line => {
      if (!Number.isFinite(line.value) || line.value < yMin || line.value > yMax) return;
      const yy = yF(line.value).toFixed(1);
      mk(bg, 'line', {
        x1: M.left, y1: yy, x2: M.left + IW, y2: yy,
        stroke: line.color || 'rgba(7,24,45,0.55)',
        'stroke-width': line.width || 1,
        'stroke-dasharray': line.dash || '5 6',
        'stroke-linecap': 'round',
      });
    });

    const medPts = smoothPointsY(sampledPoints('p50'), smoothPasses);
    const medD = smoothPath(medPts);
    if (medD) {
      mk(bg, 'path', { d: medD, fill: 'none', stroke: cfg.medianHaloColor || 'rgba(0,0,0,0.45)', 'stroke-width': cfg.medianHaloWidth || 4, 'stroke-linecap': 'butt', 'stroke-linejoin': 'miter' });
      mk(bg, 'path', { d: medD, fill: 'none', stroke: cfg.medianColor || 'white', 'stroke-width': cfg.medianWidth || 2.1, 'stroke-linecap': 'butt', 'stroke-linejoin': 'miter' });
    }
  }

  // ─── MOS/MIX maximumtemperatuur (toggle) ───────────────────────────────
  if (showDailyTxRange && ranged.stats.dailyMax?.length) {
    // Bouw noon-index per dag
    const noonByDay = new Map();
    for (let i = 0; i < ts.length; i++) {
      const t = new Date(ts[i]);
      const key = `${t.getFullYear()}-${t.getMonth()}-${t.getDate()}`;
      const dist = Math.abs(t.getHours() - 12);
      if (!noonByDay.has(key) || dist < noonByDay.get(key).dist) noonByDay.set(key, { idx: i, dist });
    }
    const bh = 5; // half-breedte box (10px totaal)
    for (const day of ranged.stats.dailyMax) {
      const dt = new Date(day.t);
      const key = `${dt.getFullYear()}-${dt.getMonth()}-${dt.getDate()}`;
      const isoDay = `${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,'0')}-${String(dt.getDate()).padStart(2,'0')}`;
      const noon = noonByDay.get(key);
      if (!noon) continue;
      const xx = xF(noon.idx);
      const mosTx = mosmixDailyTx[isoDay];
      if (Number.isFinite(mosTx)) {
        const yyTx = yF(mosTx);
        mk(bg, 'line', {
          x1: (xx - bh - 3).toFixed(1), y1: yyTx.toFixed(1),
          x2: (xx + bh + 3).toFixed(1), y2: yyTx.toFixed(1),
          stroke: '#ffd264', 'stroke-width': 2.4, 'stroke-linecap': 'round',
        });
        const labelTxt = `${Math.round(mosTx)}°`;
        let chipY = yyTx - 10;
        if (chipY - 8 < M.top + 2) chipY = yyTx + 18;
        if (chipY + 5 > M.top + IH - 2) chipY = yyTx - 10;
        mk(bg, 'rect', {
          x: (xx - 11).toFixed(1), y: (chipY - 8).toFixed(1),
          width: 22, height: 13, rx: 3,
          fill: 'rgba(0,0,0,0.55)',
        });
        mk(bg, 'text', {
          x: xx.toFixed(1), y: chipY.toFixed(1),
          'text-anchor': 'middle', 'dominant-baseline': 'auto',
          'font-size': 9.5, 'font-weight': 800, 'font-family': 'Inter,sans-serif',
          fill: '#ffd264',
        }, labelTxt);
      }
    }
  }
  // ────────────────────────────────────────────────────────────────────────────

  drawDayHighlight(bg, ts, xF, M.left, M.left + IW, M.top, IH);

  mk(svg, 'rect', { x: M.left, y: M.top, width: IW, height: IH, fill: 'none', stroke: 'rgba(0,0,0,0.35)', 'stroke-width': 1.2 });

  for (let v = Math.ceil(yMin / cfg.yStep) * cfg.yStep; v <= yMax; v += cfg.yStep) {
    const yy = yF(v);
    const gridAttrs = {
      x1: M.left,
      y1: yy.toFixed(1),
      x2: M.left + IW,
      y2: yy.toFixed(1),
      stroke: cfg.gridLineColor || 'rgba(255,255,255,0.09)',
      'stroke-width': cfg.gridLineWidth ?? 0.5,
    };
    if (cfg.gridLineDash) gridAttrs['stroke-dasharray'] = cfg.gridLineDash;
    mk(svg, 'line', gridAttrs);
    mk(svg, 'text', {
      x: M.left - Y_AXIS_GAP, y: (yy + 4.5).toFixed(1),
      'text-anchor': 'end', 'font-size': 12.5, 'font-weight': 800,
      'font-family': 'Inter, sans-serif', fill: 'white',
      style: 'text-shadow:0 1px 4px rgba(0,0,0,0.6)',
    }, fmtValue(v, cfg));
  }
  if (cfg.rightAxis === 'bft') {
    const bands = Array.isArray(cfg.beaufortBands) ? cfg.beaufortBands : [];
    bands.forEach(band => {
      const low = Math.max(yMin, band.min);
      const high = Math.min(yMax, band.max);
      if (high <= low) return;
      const pixelHeight = yF(low) - yF(high);
      if (pixelHeight < 15) return;
      const yy = (yF(low) + yF(high)) / 2;
      mk(svg, 'text', {
        x: M.left + IW + 7, y: (yy + 4.5).toFixed(1),
        'text-anchor': 'start', 'font-size': 12.5, 'font-weight': 800,
        'font-family': 'Inter, sans-serif', fill: 'white',
        style: 'text-shadow:0 1px 4px rgba(0,0,0,0.6)',
      }, `${band.bft} Bft`);
    });
  }
  if (cfg.rightAxis === 'percent') {
    for (let p = 0; p <= 100; p += 20) {
      const yy = yPercentF(p);
      mk(svg, 'text', {
        x: M.left + IW + 7, y: (yy + 4.5).toFixed(1),
        'text-anchor': 'start', 'font-size': 12.5, 'font-weight': 800,
        'font-family': 'Inter, sans-serif', fill: 'white',
        style: 'text-shadow:0 1px 4px rgba(0,0,0,0.6)',
      }, `${p}%`);
    }
  }

  const dagSet = new Set();
  let dagIndex = 0;
  for (let i = 0; i < ts.length; i++) {
    const t = new Date(ts[i]);
    const dagKey = `${t.getFullYear()}-${t.getMonth()}-${t.getDate()}`;
    if (dagSet.has(dagKey)) continue;
    dagSet.add(dagKey);
    let bestIdx = i, bestDist = Infinity;
    for (let j = i; j < Math.min(i + 24, ts.length); j++) {
      const d = Math.abs(new Date(ts[j]).getHours() - 12);
      if (d < bestDist) { bestDist = d; bestIdx = j; }
    }
    const xx = xF(bestIdx);
    const dag = new Date(ts[bestIdx]);
    mk(svg, 'line', { x1: xx.toFixed(1), y1: M.top + IH, x2: xx.toFixed(1), y2: M.top + IH + 6, stroke: 'rgba(255,255,255,0.4)', 'stroke-width': 1.2 });
    mk(svg, 'text', {
      x: xx.toFixed(1), y: (M.top + IH + 40).toFixed(1),
      'text-anchor': 'middle', 'font-size': 14, 'font-weight': 800,
      'font-family': 'Inter, sans-serif', fill: 'white',
      style: 'text-shadow:0 1px 4px rgba(0,0,0,0.5)',
    }, DOW_NL[dag.getDay()]);
    if (dagIndex === 0 || (dagIndex + 1) % 5 === 0) {
      mk(svg, 'text', {
        x: xx.toFixed(1), y: (M.top + IH + 56).toFixed(1),
        'text-anchor': 'middle', 'font-size': 11.5, 'font-weight': 800,
        'font-family': 'Inter, sans-serif', fill: 'rgba(255,255,255,0.72)',
        style: 'text-shadow:0 1px 4px rgba(0,0,0,0.45)',
      }, `${dag.getDate()} ${MAAND_NL[dag.getMonth()]}`);
    }
    dagIndex++;
  }
  for (let i = 1; i < ts.length; i++) {
    const t = new Date(ts[i]);
    const h = t.getHours();
    if (h === 0 || h === 12) {
      const xx = xF(i);
      mk(svg, 'line', { x1: xx.toFixed(1), y1: (M.top + IH).toFixed(1), x2: xx.toFixed(1), y2: (M.top + IH + 5).toFixed(1), stroke: 'rgba(255,255,255,0.45)', 'stroke-width': 1 });
      mk(svg, 'text', {
        x: xx.toFixed(1), y: (M.top + IH + 16).toFixed(1),
        'text-anchor': 'middle', 'font-size': 9, 'font-weight': 600,
        'font-family': 'Inter, sans-serif', fill: 'rgba(255,255,255,0.52)',
        style: 'text-shadow:0 1px 3px rgba(0,0,0,0.4)',
      }, h === 0 ? '0h' : '12h');
    }
  }
}

function getMemberKeys(hourly, cfg) {
  const base = String(cfg?.prefix || cfg?.hourly || '').replace(/_member$/, '');
  return WeerlabPlumeMath.ensembleMemberKeys(hourly, base);
}

function chartTimesForStats(times, stats) {
  return stats.length === times.length ? times : stats.map(s => s.t);
}

function buildDataUrl(cfg, point = currentStation, runMeta) {
  const { startDate, endDate } = ensRunDateBounds(runMeta);
  return `https://ensemble-api.open-meteo.com/v1/ensemble?latitude=${point.lat}&longitude=${point.lon}` +
    `&hourly=${cfg.hourlyQuery || cfg.hourly}&models=ecmwf_ifs025&temporal_resolution=native&timezone=GMT` +
    `&start_date=${startDate}&end_date=${endDate}${cfg.extraQuery || ''}`;
}

function boundHourlyToRunMeta(hourly, runMeta) {
  const verified = verifiedEnsRunMeta(runMeta);
  const rawTimes = Array.isArray(hourly?.time) ? hourly.time : [];
  if (!rawTimes.length) throw new Error('Ensembledata bevat geen tijdas.');
  const seriesEntries = Object.entries(hourly || {})
    .filter(([key, values]) => key !== 'time' && Array.isArray(values));
  const seriesLengths = new Set(seriesEntries.map(([, values]) => values.length));
  if (!seriesEntries.length || seriesLengths.size !== 1) {
    throw new Error('Ensembledata heeft variabelen met verschillende lengtes.');
  }
  const valueCount = seriesEntries[0][1].length;
  // Open-Meteo gebruikt bij sommige native reeksen een exclusieve laatste
  // tijdgrens: de tijdas heeft dan precies één element meer dan de waarden.
  if (rawTimes.length < valueCount || rawTimes.length > valueCount + 1) {
    throw new Error('Ensembledata heeft een afwijkende tijdas.');
  }
  const valueTimes = rawTimes.slice(0, valueCount);
  const runStartMs = verified.last_run_initialisation_time * 1000;
  const dataEndMs = verified.data_end_time * 1000;
  const first = valueTimes.findIndex(value => {
    const time = new Date(value).getTime();
    return Number.isFinite(time) && time >= runStartMs;
  });
  if (first < 0) throw new Error('Ensembledata bevat geen tijdstappen binnen de geverifieerde ECMWF-run.');
  let lastExclusive = first;
  while (lastExclusive < valueTimes.length) {
    const time = new Date(valueTimes[lastExclusive]).getTime();
    if (!Number.isFinite(time) || time > dataEndMs) break;
    lastExclusive++;
  }
  if (lastExclusive <= first) throw new Error('ECMWF ENS-run heeft geen bruikbare actuele dekking.');
  const firstMs = new Date(valueTimes[first]).getTime();
  const lastValueMs = new Date(valueTimes[lastExclusive - 1]).getTime();
  const boundaryMs = rawTimes.length === valueCount + 1
    ? new Date(rawTimes[valueCount]).getTime()
    : lastValueMs;
  if (firstMs !== runStartMs || boundaryMs !== dataEndMs) {
    throw new Error('Ensembledata dekt niet exact het geverifieerde ECMWF-runvenster.');
  }
  const bounded = { time: valueTimes.slice(first, lastExclusive) };
  seriesEntries.forEach(([key, values]) => {
    bounded[key] = values.slice(first, lastExclusive);
  });
  return bounded;
}

async function loadPointStatsForParam(param, cfg, runMeta, point = currentStation, force = false, edgeFresh = false) {
  const raw = await loadPointRawForParam(param, cfg, runMeta, point, force, edgeFresh);
  const stats = cfg.makeStats ? cfg.makeStats(raw.times, raw.members, raw.hourly) : makeDefaultStats(raw.times, raw.members);
  return { times: chartTimesForStats(raw.times, stats), stats, keys: raw.keys, runMeta };
}

async function loadPointRawForParam(param, cfg, runMeta, point = currentStation, force = false, edgeFresh = false) {
  const data = await fetchJson(buildDataUrl(cfg, point, runMeta), 30000, 3, force, edgeFresh);
  if (!data?.hourly?.time) throw new Error('Geen ensembledata ontvangen');
  const requiredBases = [...new Set(String(cfg.hourlyQuery || cfg.hourly).split(',').map(value => value.trim()).filter(Boolean))];
  if (!requiredBases.includes(cfg.hourly)) requiredBases.unshift(cfg.hourly);
  const archivedMissing = Array.isArray(data.weerlab_unavailable_variables)
    ? requiredBases.filter(base => data.weerlab_unavailable_variables.includes(base))
    : [];
  if (archivedMissing.length) {
    const fields = archivedMissing.map(base => base === 'wind_gusts_10m' ? 'windstoten' : base === 'cape' ? 'CAPE/onweer' : base).join(' en ');
    throw new Error(`${cfg.title} is niet beschikbaar in deze opgeslagen run (${fields} ontbreekt). De overige kleurpluimen blijven wel exact bruikbaar.`);
  }
  WeerlabPlumeMath.markUtcTimes(data);
  const boundedHourly = boundHourlyToRunMeta(data.hourly, runMeta);
  const keys = requireEnsembleMemberKeys(boundedHourly, cfg.hourly);
  const requiredMatrices = requiredBases.map(base =>
    requireEnsembleMemberKeys(boundedHourly, base).map(key => boundedHourly[key])
  );
  const window = completeMemberWindow(boundedHourly.time, requiredMatrices);
  if (window.first !== 0 || window.lastExclusive !== boundedHourly.time.length) {
    throw new Error(`${cfg.title} is nog niet volledig geladen voor de geverifieerde ECMWF-run; probeer opnieuw.`);
  }
  const times = boundedHourly.time.slice(window.first, window.lastExclusive);
  const members = keys.map(key => boundedHourly[key].slice(window.first, window.lastExclusive));
  const hourly = {};
  Object.keys(boundedHourly).forEach(key => {
    hourly[key] = Array.isArray(boundedHourly[key])
      ? boundedHourly[key].slice(window.first, window.lastExclusive)
      : boundedHourly[key];
  });
  hourly.time = times.slice();
  const gridKey = `${Number(data.latitude).toFixed(5)},${Number(data.longitude).toFixed(5)}`;
  return { times, members, keys, hourly, gridKey, runMeta };
}

function averageNumber(values) {
  const finite = values.filter(Number.isFinite);
  if (!finite.length) return null;
  return finite.reduce((a, b) => a + b, 0) / finite.length;
}

function averageStatsByTime(statsList, cfg, spatialPoints) {
  const usable = statsList.filter(stats => Array.isArray(stats) && stats.length);
  if (!usable.length) return [];
  const len = Math.min(...usable.map(stats => stats.length));
  const averaged = [];
  for (let i = 0; i < len; i++) {
    const rowStats = usable.map(stats => stats[i]).filter(Boolean);
    const row = { t: rowStats[0].t };
    ['p10', 'p50', 'p90', 'pMin', 'pMax'].forEach(key => {
      const v = averageNumber(rowStats.map(s => s[key]));
      if (Number.isFinite(v)) row[key] = v;
    });
    const extraKeys = new Set();
    rowStats.forEach(s => Object.keys(s.extra || {}).forEach(key => {
      if (Number.isFinite(s.extra[key])) extraKeys.add(key);
    }));
    if (extraKeys.size) {
      row.extra = {};
      extraKeys.forEach(key => {
        const v = averageNumber(rowStats.map(s => s.extra?.[key]));
        if (Number.isFinite(v)) row.extra[key] = v;
      });
    }
    averaged.push(row);
  }
  averaged.spatialPoints = spatialPoints;
  averaged.spatialRadiusKm = 10;
  if (cfg.rebaseCumulative) averaged.rebaseCumulative = true;
  if (cfg.dailyThunderLabels) averaged.dailyThunder = makeDailyThunderStats(averaged);
  return averaged;
}

async function settleWithConcurrency(items, limit, mapper) {
  const settled = new Array(items.length);
  let next = 0;
  const workers = Array.from({ length: Math.min(limit, items.length) }, async () => {
    while (next < items.length) {
      const idx = next++;
      try {
        settled[idx] = { status: 'fulfilled', value: await mapper(items[idx], idx) };
      } catch (reason) {
        settled[idx] = { status: 'rejected', reason };
      }
    }
  });
  await Promise.all(workers);
  return settled;
}

async function loadSpatialStatsForParam(param, cfg, runMeta, force = false, edgeFresh = false) {
  const points = spatialSamplePoints();
  const settled = await settleWithConcurrency(
    points,
    SPATIAL_FETCH_CONCURRENCY,
    point => loadPointRawForParam(param, cfg, runMeta, point, force, edgeFresh)
  );
  const loaded = settled.filter(result => result.status === 'fulfilled').map(result => result.value);
  const seenGridCells = new Set();
  const results = loaded.filter(result => {
    if (seenGridCells.has(result.gridKey)) return false;
    seenGridCells.add(result.gridKey);
    return true;
  });
  if (results.length < 3) throw new Error(`Te weinig unieke roosterpunten geladen (${results.length}/${points.length})`);
  const timeIndexes = results.map(result => new Map(result.times.map((time, index) => [new Date(time).getTime(), index])));
  const times = results[0].times.filter(time => {
    const epoch = new Date(time).getTime();
    return Number.isFinite(epoch) && timeIndexes.every(index => index.has(epoch));
  });
  if (times.length < 2) throw new Error('Roosterpunten hebben geen gemeenschappelijk compleet tijdvenster');
  const keyIndexes = results.map(result => new Map(result.keys.map((key, idx) => [key, idx])));
  const keys = results[0].keys.filter(key => keyIndexes.every(index => index.has(key)));
  if (keys.length !== 51) throw new Error(`Slechts ${keys.length} gemeenschappelijke ensembleleden ontvangen; exact 51 vereist`);
  const members = keys.map(key => times.map(time => {
    const epoch = new Date(time).getTime();
    const vals = results.map((result, resultIdx) => {
      const idx = keyIndexes[resultIdx].get(key);
      const timeIdx = timeIndexes[resultIdx].get(epoch);
      return idx == null || timeIdx == null ? null : result.members[idx]?.[timeIdx];
    });
    return vals.length === results.length && vals.every(Number.isFinite)
      ? vals.reduce((a, b) => a + b, 0) / vals.length
      : null;
  }));
  const hourly = { time: times.slice() };
  const hourlyKeys = Object.keys(results[0].hourly || {}).filter(key =>
    key !== 'time' &&
    Array.isArray(results[0].hourly[key]) &&
    results.every(result => Array.isArray(result.hourly?.[key]))
  );
  hourlyKeys.forEach(key => {
    hourly[key] = times.map(time => {
      const epoch = new Date(time).getTime();
      const vals = results.map((result, resultIdx) => {
        const timeIdx = timeIndexes[resultIdx].get(epoch);
        return timeIdx == null ? null : result.hourly[key]?.[timeIdx];
      });
      return vals.length === results.length && vals.every(Number.isFinite)
        ? vals.reduce((a, b) => a + b, 0) / vals.length
        : null;
    });
  });
  const stats = cfg.makeStats ? cfg.makeStats(times, members, hourly) : makeDefaultStats(times, members);
  stats.spatialPoints = results.length;
  stats.spatialRadiusKm = 10;
  if (cfg.rebaseCumulative) stats.rebaseCumulative = true;
  if (cfg.dailyThunderLabels && !stats.dailyThunder) stats.dailyThunder = makeDailyThunderStats(stats);
  return {
    param,
    cfg,
    times: chartTimesForStats(times, stats),
    stats,
    keys,
    spatialPoints: results.length,
    runMeta,
  };
}

async function loadStatsForParam(param, runMeta, force = false, edgeFresh = false) {
  const cfg = PARAMS[param];
  const point = currentStation;
  const key = [
    param,
    Number(point.lat).toFixed(4),
    Number(point.lon).toFixed(4),
    SOURCE_FORECAST_DAYS,
    ensMetaSentinel(runMeta),
  ].join('|');
  const cached = _statsCache[key];
  if (!force && cached && Date.now() - cached.ts < CACHE_TTL) return cached.data;
  if (!force && _statsInflight[key]) return _statsInflight[key];

  _statsInflight[key] = (async () => {
    // Een oude exacte run bevat alleen het gearchiveerde centrale roosterpunt.
    // Omliggende punten zouden uit de actuele cyclus komen en mogen dus nooit
    // met deze run worden gemengd. Nieuwe live runs blijven ruimtelijk middelen.
    const useSpatialAverage = cfg.spatialAverage && !runMeta?.weerlab_archived_run;
    const data = useSpatialAverage
      ? await loadSpatialStatsForParam(param, cfg, runMeta, force, edgeFresh)
      : { param, cfg, ...(await loadPointStatsForParam(param, cfg, runMeta, currentStation, force, edgeFresh)), spatialPoints: 1, runMeta };
    _statsCache[key] = { data, ts: Date.now() };
    return data;
  })().finally(() => { delete _statsInflight[key]; });
  return _statsInflight[key];
}

function statusTextForResult(result, memberLabel = 'ensemble-leden') {
