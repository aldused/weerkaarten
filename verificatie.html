<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Verificatie MOSMIX – Ed Aldus WM</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Segoe UI', Arial, sans-serif;
  background: #f0f4f8;
  color: #1a2b40;
  font-size: 13px;
}

header {
  background: #0d2b5e;
  color: white;
  padding: 14px 20px 10px;
}
header h1 { font-size: 1.25rem; font-weight: 700; }
header p  { font-size: 0.78rem; opacity: 0.75; margin-top: 2px; }

.wrap { padding: 12px 16px; max-width: 1100px; }

/* Samenvatting-kaarten */
.samen {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
  gap: 10px;
  margin-bottom: 16px;
}
.samen-kaart {
  background: white;
  border-radius: 10px;
  padding: 12px 14px;
  box-shadow: 0 1px 4px rgba(0,0,0,0.08);
  text-align: center;
}
.samen-kaart .label { font-size: 11px; color: #6b7c93; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; }
.samen-kaart .titel { font-size: 13px; font-weight: 700; margin: 4px 0 2px; color: #0d2b5e; }
.samen-kaart .mae   { font-size: 22px; font-weight: 800; }
.samen-kaart .bias  { font-size: 11px; color: #6b7c93; margin-top: 2px; }

/* Tabel */
.tabel-wrap {
  background: white;
  border-radius: 10px;
  box-shadow: 0 1px 4px rgba(0,0,0,0.08);
  overflow-x: auto;
}
table {
  width: 100%;
  border-collapse: collapse;
  font-size: 12px;
}
thead th {
  background: #0d2b5e;
  color: white;
  padding: 6px 6px;
  font-weight: 700;
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  position: sticky; top: 0;
  white-space: nowrap;
}
thead th.groep {
  background: #1e3f70;
  text-align: center;
  border-left: 2px solid #0d2b5e;
}
tbody td {
  padding: 5px 6px;
  border-bottom: 1px solid #e8ecf1;
  text-align: center;
  white-space: nowrap;
}
tbody td:first-child {
  text-align: left;
  font-weight: 600;
  color: #0d2b5e;
  position: sticky; left: 0;
  background: white;
  z-index: 1;
}
tbody tr:hover td { background: #f0f5fc; }
tbody tr:hover td:first-child { background: #f0f5fc; }

td.verschil { font-weight: 700; }
.groen  { color: #0d9488; }
.oranje { color: #d97706; }
.rood   { color: #dc2626; }

.geen-data {
  text-align: center;
  padding: 40px 20px;
  color: #6b7c93;
  font-size: 14px;
}
.geen-data p { margin-top: 8px; font-size: 12px; opacity: 0.7; }

.info {
  font-size: 11px;
  color: #6b7c93;
  margin-top: 10px;
  line-height: 1.5;
}

@media (max-width: 600px) {
  .wrap { padding: 8px; }
  .samen { grid-template-columns: repeat(2, 1fr); gap: 6px; }
  table { font-size: 11.5px; }
  thead th, tbody td { padding: 5px 6px; }
}
</style>
</head>
<body>

<header>
  <h1>Verificatie MOSMIX</h1>
  <p id="subtitel">Laden...</p>
</header>

<div class="wrap">
  <div class="samen" id="samenvatting"></div>
  <div class="tabel-wrap" id="tabel-container">
    <div class="geen-data" id="geen-data">
      <b>Nog geen verificatie beschikbaar</b>
      <p>Het script moet eerst een dag draaien om een voorspelling te archiveren.</p>
    </div>
  </div>
  <div class="info" id="info"></div>
</div>

<script>
const PARAM_CONFIG = {
  TX: { naam: "Max temp",   eenheid: "\u00b0C",  drempel: [1, 2] },
  TN: { naam: "Min temp",   eenheid: "\u00b0C",  drempel: [1, 2] },
  RR: { naam: "Neerslag",   eenheid: "mm",  drempel: [1, 3] },
  FF: { naam: "Gem. wind",  eenheid: "km/h", drempel: [5, 10] },
};

function kleurKlasse(param, verschil) {
  const cfg = PARAM_CONFIG[param];
  if (!cfg) return "";
  const abs = Math.abs(verschil);
  if (abs <= cfg.drempel[0]) return "groen";
  if (abs <= cfg.drempel[1]) return "oranje";
  return "rood";
}

function formatVerschil(v) {
  return (v > 0 ? "+" : "") + v.toFixed(1);
}

async function laad() {
  let data;
  try {
    const r = await fetch("verificatie.json?" + Date.now());
    if (!r.ok) throw new Error("Niet gevonden");
    data = await r.json();
  } catch {
    return; // geen-data div blijft zichtbaar
  }

  // Subtitel
  const d = new Date(data.datum + "T12:00:00");
  const opties = { weekday: "long", day: "numeric", month: "long", year: "numeric" };
  document.getElementById("subtitel").textContent =
    `Verwachting vs waarneming \u2014 ${d.toLocaleDateString("nl-NL", opties)}`;

  // Samenvatting-kaarten
  const samenEl = document.getElementById("samenvatting");
  const params = ["TX", "TN", "RR", "FF"];
  samenEl.innerHTML = "";
  for (const p of params) {
    const s = (data.samenvatting || {})[p];
    if (!s) continue;
    const cfg = PARAM_CONFIG[p];
    const kleur = kleurKlasse(p, s.mae);
    samenEl.innerHTML += `
      <div class="samen-kaart">
        <div class="label">${cfg.naam} (${cfg.eenheid})</div>
        <div class="mae ${kleur}">${s.mae.toFixed(1)}</div>
        <div class="bias">bias: ${formatVerschil(s.bias)} (n=${s.n})</div>
      </div>`;
  }

  // Tabel opbouwen
  const stations = data.stations || {};
  const namen = Object.keys(stations);
  if (namen.length === 0) return;

  document.getElementById("geen-data").style.display = "none";

  let html = "<table><thead><tr><th>Station</th>";
  for (const p of params) {
    const cfg = PARAM_CONFIG[p];
    html += `<th class="groep" colspan="3">${cfg.naam} (${cfg.eenheid})</th>`;
  }
  html += "</tr><tr><th></th>";
  for (let i = 0; i < params.length; i++) {
    html += `<th>Verw.</th><th>Gem.</th><th>Versch.</th>`;
  }
  html += "</tr></thead><tbody>";

  for (const naam of namen) {
    const st = stations[naam];
    html += `<tr><td>${naam}</td>`;
    for (const p of params) {
      const d = st[p];
      if (d) {
        const kl = kleurKlasse(p, d.verschil);
        html += `<td>${d.verwacht.toFixed(1)}</td>`;
        html += `<td>${d.gemeten.toFixed(1)}</td>`;
        html += `<td class="verschil ${kl}">${formatVerschil(d.verschil)}</td>`;
      } else {
        html += `<td>-</td><td>-</td><td>-</td>`;
      }
    }
    html += "</tr>";
  }
  html += "</tbody></table>";

  document.getElementById("tabel-container").innerHTML = html;

  // Info
  const runTijd = data.mosmix_run ? new Date(data.mosmix_run).toLocaleString("nl-NL") : "onbekend";
  document.getElementById("info").innerHTML =
    `MOSMIX-run: ${runTijd} &middot; Bijgewerkt: ${data.bijgewerkt}<br>` +
    `MAE = gemiddelde absolute fout &middot; Bias = systematische afwijking (positief = te warm/veel voorspeld)<br>` +
    `FF: MOSMIX gemiddelde dagwind vs KNMI etmaalgemiddelde (FG)`;
}

laad();
</script>
</body>
</html>
