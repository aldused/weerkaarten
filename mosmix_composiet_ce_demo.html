function kmhToBft(kmh){
  if(kmh == null) return null;
  const tabel = [1,5,11,19,28,38,49,61,74,88,102,117];
  let b=0; while(b<tabel.length && kmh>tabel[b]) b++; return b;
}

function bouwBasemap(){
  const svg = document.getElementById("basemap-svg");
  while(svg.firstChild) svg.removeChild(svg.firstChild);
  if(!provincies) return;
  const ringD = ring => ring.map(([lo,la],i)=>(i?"L":"M")+lonToX(lo).toFixed(1)+" "+latToY(la).toFixed(1)).join("")+"Z";
  let d = "";
  for(const f of provincies.features){
    const polys = f.geometry.type==="Polygon" ? [f.geometry.coordinates] : f.geometry.coordinates;
    for(const poly of polys) for(const ring of poly) d += ringD(ring);
  }
  const land = document.createElementNS("http://www.w3.org/2000/svg","path");
  land.setAttribute("d",d); land.setAttribute("class","basemap-land"); land.setAttribute("fill-rule","evenodd");
  svg.appendChild(land);
  const prov = document.createElementNS("http://www.w3.org/2000/svg","path");
  prov.setAttribute("d",d); prov.setAttribute("class","basemap-prov"); svg.appendChild(prov);
  let db = "";
  for(const f of provincies.features){
    const polys = f.geometry.type==="Polygon" ? [f.geometry.coordinates] : f.geometry.coordinates;
    for(const poly of polys) db += ringD(poly[0]);
  }
  const bg = document.createElementNS("http://www.w3.org/2000/svg","path");
  bg.setAttribute("d",db); bg.setAttribute("class","ce-buitengrens"); svg.appendChild(bg);

  const label = (x,y,tekst,anchor,size,kleur,opacity) => {
    const t = document.createElementNS("http://www.w3.org/2000/svg","text");
    t.setAttribute("x",x); t.setAttribute("y",y);
    t.setAttribute("text-anchor", anchor||"middle");
    t.setAttribute("font-family","DM Sans, sans-serif"); t.setAttribute("font-weight","700");
    t.setAttribute("font-size", size||22); t.setAttribute("fill", kleur||"#ffffff");
    t.setAttribute("opacity", opacity||"0.72"); t.setAttribute("letter-spacing","2");
    t.textContent = tekst; svg.appendChild(t);
  };
  label(lonToX(19.5),latToY(52.0),"Polen",     "middle",28);
  label(lonToX(15.8),latToY(49.8),"Tsjechië",  "middle",20);
  label(lonToX(19.5),latToY(48.7),"Slowakije", "middle",18);

function tekenOverlay(){

  const stations = mosmixData.stations;
  const lijst = Object.keys(stations).filter(n => toonAlle || KERN.has(n));
  const extremen = { warmst:null, koudst:null, natst:null };
  for(const n of lijst){
    const tx = dag.TX?.[n], rr = dag.RR?.[n];
    if(tx != null){
      if(extremen.warmst==null||tx>dag.TX[extremen.warmst]) extremen.warmst=n;
      if(extremen.koudst==null||tx<dag.TX[extremen.koudst]) extremen.koudst=n;
    }
    if(rr!=null&&rr>0&&(extremen.natst==null||rr>dag.RR[extremen.natst])) extremen.natst=n;
  }
  for(const naam of lijst){
    const [lon,lat] = stations[naam];
    const [dlo,dla] = OFFSET[naam]||[0,0];
    const ax=lonToX(lon), ay=latToY(lat);
    const cx=lonToX(lon+dlo), cy=latToY(lat+dla);
    tekenBadge(svg,naam,cx,cy,dag,ax,ay,extremen);
  }
}

  const halo=document.createElementNS("http://www.w3.org/2000/svg","circle");

function dagLabel(d){ return NL_DAGEN[d.getDay()]+" "+d.getDate()+"/"+(d.getMonth()+1); }
function update(){
  tekenOverlay();
  const d=new Date(huidigDag+"T12:00:00");
  const full=["zondag","maandag","dinsdag","woensdag","donderdag","vrijdag","zaterdag"][d.getDay()];
  document.getElementById("kaart-sub").textContent=
    `${full} ${d.getDate()}/${d.getMonth()+1} — min-temp = nacht van ${dagLabel(new Date(d-86400000))} op ${full}`;
}
document.getElementById("chk-all").onchange=e=>{toonAlle=e.target.checked;update();};

function fmt(v,eenheid="",dec=1){
  if(v==null)return"–";
  const n=typeof v==="number"?v.toFixed(dec).replace(".",","):v;
  return n+eenheid;
}
function toonStation(naam){
  const tt=document.getElementById("station-tooltip");
  const d=mosmixData.data[huidigDag];
  if(!d){tt.classList.remove("zichtbaar");return;}
  const bft=kmhToBft(d.FF?.[naam]);
  tt.innerHTML=`
    <h5>${naam}<span class="sluit" onclick="document.getElementById('station-tooltip').classList.remove('zichtbaar')">×</span></h5>
    <div class="rij"><b>Max / min</b><span>${fmt(d.TX?.[naam],"°")} / ${fmt(d.TN?.[naam],"°")}</span></div>
    <div class="rij"><b>Wind / stoot</b><span>${fmt(d.FF?.[naam]," km/u",0)} · ${bft!=null?bft+" Bft":"–"}</span></div>
    <div class="rij"><b>Neerslag kans</b><span>${fmt(d.R101?.[naam],"%",0)}</span></div>
  `;
  tt.classList.add("zichtbaar");
}
