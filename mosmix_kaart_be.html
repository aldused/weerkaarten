<script>
// België extent
const LON_MIN=1.5, LON_MAX=6.6, LAT_MIN=49.2, LAT_MAX=51.7;
const SVG_W=1000, SVG_H=770;  // geo-aspect BE (lat 50.45°): 1/cos × (lat/lon) ≈ 1.30
function lonToX(lon) { return (lon - LON_MIN) / (LON_MAX - LON_MIN) * SVG_W; }
function latToY(lat) { return (1 - (lat - LAT_MIN) / (LAT_MAX - LAT_MIN)) * SVG_H; }

const PARAMS = {
  TX:  { label:"Maximum temperatuur (°C)", eenheid:"°", decimalen:1,
    kleuren:[["#084594",-5],["#1565c0",-3],["#64b5f6",0],["#a5d6a7",2],["#2e8b57",4],["#388e3c",6],["#43a047",8],["#66bb6a",9],["#7cb342",10],["#8bc34a",11],["#aed581",12],["#c5e17a",13],["#dce775",14],["#f0ef80",15],["#fff176",16],["#ffee58",17],["#fdd835",18],["#fbc02d",19],["#f9a825",20],["#ffa726",21],["#ff8f00",24],["#fb8c00",27],["#ef6c00",30],["#e65100",33],["#d84315",36],["#4a148c",40]],
    schaal:[-5,40] },
  TN:  { label:"Minimum temperatuur (°C)", eenheid:"°", decimalen:1,
    kleuren:[["#084594",-12],["#1565c0",-9],["#1e88e5",-6],["#42a5f5",-3],["#90caf9",-1],["#b2dfdb",0],["#2e8b57",3],["#66bb6a",6],["#cddc39",9],["#ffeb3b",12],["#fbc02d",15],["#f57f17",18],["#ef6c00",21]],
    schaal:[-10,20] },
  RR:  { label:"Neerslag (mm)", eenheid:" mm", decimalen:1,
    kleuren:[["#f7fbff","0"],["#c6dbef","2"],["#6baed6","5"],["#2171b5","10"],["#084594","20"],["#4a0080","30+"]],
    schaal:[0,30] },
  FF:  { label:"Max. windsnelheid (Bft)", eenheid:" Bft", decimalen:0, bft:true,
    kleuren:[["#ffffff",0],["#c8e6c9",6],["#81c784",12],["#4caf50",20],["#ffee58",29],["#ffa726",39],["#ff7043",50],["#e53935",62],["#b71c1c",75],["#7b1fa2",89]],
    schaal:[0,103] },
  FX:  { label:"Max windstoot (km/h)", eenheid:" km/h", decimalen:0,
    kleuren:[["#ffffff",20],["#c8e6c9",30],["#81c784",40],["#4caf50",50],["#ffee58",62],["#ffa726",75],["#ff7043",89],["#e53935",103],["#b71c1c",118]],
    schaal:[20,120] },
  DD:  { label:"Windrichting (°)", eenheid:"°", decimalen:0,
    kleuren:[["#42a5f5","N"],["#66bb6a","O"],["#ffa726","Z"],["#ef5350","W"],["#42a5f5","N"]],
    schaal:[0,360] },
  SQ:  { label:"Zonneschijn (uur)", eenheid:" u", decimalen:1,
    kleuren:[["#888888","0u"],["#c8c8c8","2u"],["#FFB347","5u"],["#FFC200","8u"],["#FFD700","12u+"]],
    schaal:[0,12] },
  TTD: { label:"Dauwpunt min (°C)", eenheid:"°", decimalen:1,
    kleuren:[["#1a3a6b","≤-5°"],["#2980b9","0°"],["#a8d8ea","5°"],["#ffffcc","10°"],["#fed976","15°"],["#fd8d3c","20°+"]],
    schaal:[-5,20] },
  Neff:{ label:"Bewolking (%)", eenheid:"%", decimalen:0,
    kleuren:[["#FFD700","0%"],["#ffe066","25%"],["#c8c8c8","50%"],["#888888","75%"],["#444444","100%"]],
    schaal:[0,100] },
  gevoels: { label:"Gevoelstemperatuur min (°C)", eenheid:"°", decimalen:1,
    kleuren:[["#4a0080","≤-15°"],["#1a3a6b","-10°"],["#2980b9","-5°"],["#a8d8ea","0°"],["#e8f4f8","5°"],["#ffffcc","10°+"]],
    schaal:[-15,10] },
  wwM: { label:"Mistkans (%)", eenheid:"%", decimalen:0,
    kleuren:[["#f7fbff","0%"],["#c6dbef","10%"],["#6baed6","30%"],["#2171b5","50%"],["#084594","70%"],["#4a0080","90%+"]],
    schaal:[0,90] },
  VV:  { label:"Minimum zicht (km)", eenheid:" km", decimalen:1,
    kleuren:[["#4a0080","≤0.2"],["#084594","0.5"],["#6baed6","1"],["#c6dbef","2"],["#ffffcc","5"],["#f7fbff","10+"]],
    schaal:[0,10] },
  wwZ: { label:"Hagelkans (%)", eenheid:"%", decimalen:0,
    kleuren:[["#f7fbff","0%"],["#c6dbef","5%"],["#ffeb3b","15%"],["#ff9800","30%"],["#f44336","50%"],["#b71c1c","70%+"]],
    schaal:[0,70] },
};

function hexToRgb(hex) {
  return [parseInt(hex.slice(1,3),16),parseInt(hex.slice(3,5),16),parseInt(hex.slice(5,7),16)];
}
function interpKleur(val, schaal, stops) {
  const colors = stops.map(s=>hexToRgb(s[0]));
  let idx, f;
  if(typeof stops[0][1]==='number'){
    const temps=stops.map(s=>s[1]);
    const v=Math.max(temps[0],Math.min(temps[temps.length-1],val));
    idx=temps.length-2;
    for(let i=0;i<temps.length-1;i++){if(v<=temps[i+1]){idx=i;break;}}
    f=(v-temps[idx])/(temps[idx+1]-temps[idx]);
  } else {
    const t=Math.max(0,Math.min(1,(val-schaal[0])/(schaal[1]-schaal[0])));
    idx=Math.min(colors.length-2,Math.floor(t*(colors.length-1)));
    f=t*(colors.length-1)-idx;
  }
  const a=colors[idx],b=colors[idx+1];
  const r=Math.round(a[0]+f*(b[0]-a[0])), g=Math.round(a[1]+f*(b[1]-a[1])), bl=Math.round(a[2]+f*(b[2]-a[2]));
  const lum=(0.299*r+0.587*g+0.114*bl)/255;
  return [`rgb(${r},${g},${bl})`, lum<0.55?"white":"#222"];
}

function ns(tag) { return document.createElementNS("http://www.w3.org/2000/svg",tag); }

// ── Heatmap: Modified Shepard + Gaussian blur (TX/TN/FF/FX) ─────────────────
const HEATMAP_RES = 3;
const BASEMAP_W = 2000;
const BASEMAP_H = 1540;  // 2× SVG_H (770) — zelfde geo-aspect
const SHEPARD_POWER = 2.5;
const SHEPARD_KNN = 8;
const BLUR_SIGMA = 2;
const HEATMAP_ALPHA = 0.55;
const HEATMAP_PARAMS_BE = new Set(["TX","TN","FF","FX"]);
let landMask = null;
let provincies = null;

function bouwBasemap(svg){
  while(svg.firstChild) svg.removeChild(svg.firstChild);
  if(!provincies) return;
  const ringD = (ring) => {
    let d = "";
    ring.forEach(([lon,lat], i) => {
      const x = lonToX(lon), y = latToY(lat);
      d += (i===0?"M":"L") + x.toFixed(1) + " " + y.toFixed(1);
    });
    return d + "Z";
  };
  let d = "";
  for(const feat of provincies.features){
    const g = feat.geometry;
    const polys = g.type==="Polygon" ? [g.coordinates] : g.coordinates;
    for(const poly of polys){
      for(const ring of poly) d += ringD(ring);
    }
  }
  const landPath = document.createElementNS("http://www.w3.org/2000/svg","path");
  landPath.setAttribute("d", d);
  landPath.setAttribute("class","basemap-land");
  landPath.setAttribute("fill-rule","evenodd");
  svg.appendChild(landPath);
  const provPath = document.createElementNS("http://www.w3.org/2000/svg","path");
  provPath.setAttribute("d", d);
  provPath.setAttribute("class","basemap-prov");
  svg.appendChild(provPath);
}

function tekenBuitengrens(svg){
  if(!provincies) return;
  const ringD = (ring) => {
    let d = "";
    ring.forEach(([lon,lat], i) => {
      const x = lonToX(lon), y = latToY(lat);
      d += (i===0?"M":"L") + x.toFixed(1) + " " + y.toFixed(1);
    });
    return d + "Z";
  };
  let d = "";
  for(const feat of provincies.features){
    const g = feat.geometry;
    const polys = g.type==="Polygon" ? [g.coordinates] : g.coordinates;
    for(const poly of polys) d += ringD(poly[0]);
  }
  const p = document.createElementNS("http://www.w3.org/2000/svg","path");
  p.setAttribute("d", d);
  p.setAttribute("class","be-buitengrens");
  svg.appendChild(p);
}

function maakLandMask(){
  if(!provincies) return;
  const c = document.createElement("canvas");
  c.width = BASEMAP_W; c.height = BASEMAP_H;
  const ctx = c.getContext("2d");
  ctx.fillStyle = "#000";
  ctx.beginPath();
  for(const feat of provincies.features){
    const g = feat.geometry;
    const polys = g.type==="Polygon" ? [g.coordinates] : g.coordinates;
    for(const poly of polys){
      for(const ring of poly){
        ring.forEach(([lon,lat], i) => {
          const x = lonToX(lon)/SVG_W * BASEMAP_W;
          const y = latToY(lat)/SVG_H * BASEMAP_H;
          if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
        });
        ctx.closePath();
      }
    }
  }
  ctx.fill("evenodd");
  const px = ctx.getImageData(0,0,BASEMAP_W,BASEMAP_H).data;
  const R = HEATMAP_RES;
  const w = Math.ceil(BASEMAP_W/R), h = Math.ceil(BASEMAP_H/R);
  const data = new Uint8Array(w*h);
  for(let y=0;y<h;y++) for(let x=0;x<w;x++){
    let isLand=false;
    for(let dy=0; dy<R && !isLand; dy++) for(let dx=0; dx<R && !isLand; dx++){
      const sx = Math.min(x*R+dx, BASEMAP_W-1), sy = Math.min(y*R+dy, BASEMAP_H-1);
      if(px[(sy*BASEMAP_W+sx)*4+3] > 0) isLand=true;
    }
    data[y*w+x] = isLand ? 1 : 0;
  }
  landMask = {w, h, data};
}

function _shepardVeld(paramData, stations, p){
  const w=landMask.w, h=landMask.h;
  const punten = [];
  Object.entries(paramData).forEach(([naam, val]) => {
    if(!stations[naam] || val == null) return;
    const [lon, lat] = stations[naam];
    punten.push({x: lonToX(lon)/SVG_W * w, y: latToY(lat)/SVG_H * h, val});
  });
  if(punten.length < 3) return null;
  const N = punten.length;
  const K = Math.min(SHEPARD_KNN, N);
  const veld = new Float32Array(w*h);
  for(let y=0;y<h;y++) for(let x=0;x<w;x++){
    const idx = y*w+x;
    if(!landMask.data[idx]) continue;
    const dArr = new Float64Array(N);
    for(let i=0;i<N;i++){
      const dx=x-punten[i].x, dy=y-punten[i].y;
      dArr[i] = Math.sqrt(dx*dx+dy*dy);
    }
    const idxs = new Int32Array(N); for(let i=0;i<N;i++) idxs[i]=i;
    for(let k=0;k<K;k++){
      let mi=k;
      for(let j=k+1;j<N;j++) if(dArr[idxs[j]]<dArr[idxs[mi]]) mi=j;
      const t=idxs[k]; idxs[k]=idxs[mi]; idxs[mi]=t;
    }
    const R = dArr[idxs[K-1]] + 1e-6;
    let sumW=0, sumWV=0;
    for(let k=0;k<K;k++){
      const i=idxs[k], d=dArr[i];
      if(d<0.7){ sumWV=punten[i].val; sumW=1; break; }
      const num = (R-d)/(R*d);
      const wi = Math.pow(num, SHEPARD_POWER);
      sumW+=wi; sumWV+=wi*punten[i].val;
    }
    veld[idx] = sumWV/sumW;
  }
  return veld;
}

function _blurVeld(veld){
  const sigma = BLUR_SIGMA;
  if(sigma<=0) return veld;
  const w=landMask.w, h=landMask.h, mask=landMask.data;
  const radius = Math.max(1, Math.ceil(sigma*3));
  const kernel = new Float32Array(radius*2+1);
  let ks=0;
  for(let i=-radius;i<=radius;i++){
    const v = Math.exp(-(i*i)/(2*sigma*sigma));
    kernel[i+radius]=v; ks+=v;
  }
  for(let i=0;i<kernel.length;i++) kernel[i]/=ks;
  const tmp = new Float32Array(w*h);
  for(let y=0;y<h;y++) for(let x=0;x<w;x++){
    if(!mask[y*w+x]){ tmp[y*w+x]=0; continue; }
    let s=0, ws=0;
    for(let k=-radius;k<=radius;k++){
      const xx=x+k; if(xx<0||xx>=w) continue;
      if(!mask[y*w+xx]) continue;
      const wt=kernel[k+radius];
      s+=veld[y*w+xx]*wt; ws+=wt;
    }
    tmp[y*w+x] = ws>0 ? s/ws : veld[y*w+x];
  }
  const out = new Float32Array(w*h);
  for(let y=0;y<h;y++) for(let x=0;x<w;x++){
    if(!mask[y*w+x]){ out[y*w+x]=0; continue; }
    let s=0, ws=0;
    for(let k=-radius;k<=radius;k++){
      const yy=y+k; if(yy<0||yy>=h) continue;
      if(!mask[yy*w+x]) continue;
      const wt=kernel[k+radius];
      s+=tmp[yy*w+x]*wt; ws+=wt;
    }
    out[y*w+x] = ws>0 ? s/ws : tmp[y*w+x];
  }
  return out;
}

function tekenHeatmapOpCanvas(hc, dagKey, param){
  const p = PARAMS[param];
  if(!p || !HEATMAP_PARAMS_BE.has(param)){ hc.width=1; hc.height=1; return; }
  if(!landMask) maakLandMask();
  if(!landMask){ hc.width=1; hc.height=1; return; }

  const dagObj = mosmixData?.data?.[dagKey];
  const paramData = dagObj ? dagObj[param] : null;
  if(!paramData) return;
  const stations = mosmixData.stations;

  let veld = _shepardVeld(paramData, stations, p);
  if(!veld) return;
  veld = _blurVeld(veld);

  const w = landMask.w, h = landMask.h;
  hc.width = BASEMAP_W; hc.height = BASEMAP_H;
  const ctx = hc.getContext("2d");
  ctx.clearRect(0, 0, hc.width, hc.height);

  const tmpC = document.createElement("canvas");
  tmpC.width = w; tmpC.height = h;
  const tctx = tmpC.getContext("2d");
  const imgData = tctx.createImageData(w, h);
  const buf = imgData.data;
  for(let i=0;i<w*h;i++){
    if(!landMask.data[i]){ buf[i*4+3]=0; continue; }
    let v = veld[i];
    if(p.bft) v = kmhNaarBft(v);
    const [bg] = interpKleur(v, p.schaal, p.kleuren);
    const m = bg.match(/\d+/g);
    buf[i*4]=+m[0]; buf[i*4+1]=+m[1]; buf[i*4+2]=+m[2];
    buf[i*4+3] = Math.round(HEATMAP_ALPHA*255);
  }
  tctx.putImageData(imgData, 0, 0);
  ctx.imageSmoothingEnabled = true;
  ctx.imageSmoothingQuality = "high";
  ctx.drawImage(tmpC, 0, 0, hc.width, hc.height);
}

function tekenHeatmap(){
  const hc = document.getElementById("heatmap");
  if(!HEATMAP_PARAMS_BE.has(huidigParam)){ hc.width=1; hc.height=1; return; }
  if(!landMask) maakLandMask();
  tekenHeatmapOpCanvas(hc, huidigDag, huidigParam);
}

function windpijl(graden) {
  // Pijl wijst waarheen de wind WAAIT (NW-wind → pijl ↘)
  const pijlen = ["↓","↙","←","↖","↑","↗","→","↘","↓"];
  if (graden == null) return "";
  return pijlen[Math.round(graden/45) % 8];
}

function kmhNaarBft(kmh) {
  const grenzen = [1,6,12,20,29,39,50,62,75,89,103,118];
  for (let i = 0; i < grenzen.length; i++) { if (kmh < grenzen[i]) return i; }
  return 12;
}

function tekenKaart() {
  const svg = document.getElementById("be-kaart");
  svg.innerHTML = "";
  const p = PARAMS[huidigParam];
  if (!p) return;

  // Witte BE-buitengrens onderaan overlay
  tekenBuitengrens(svg);

  const dagObj = mosmixData.data[huidigDag];
  if (!dagObj || !dagObj[huidigParam]) return;

  const paramData = dagObj[huidigParam];
  const stations = mosmixData.stations;
  const isHeatmap = HEATMAP_PARAMS_BE.has(huidigParam);

  let items = Object.entries(paramData)
    .filter(([naam]) => stations[naam])
    .map(([naam, val]) => ({naam, val, lon: stations[naam][0], lat: stations[naam][1]}));

  // Sorteer: hoog→laag voor de meeste, laag→hoog voor bewolking-inverse
  const invertSort = ["TN","TTD","gevoels","VV"];
  items.sort((a,b) => invertSort.includes(huidigParam) ? a.val - b.val : b.val - a.val);

  if(isHeatmap){
    items.forEach(item => tekenHeatmapStation(svg, item, p, dagObj));
    tekenCopyright(svg);
    return;
  }

  // Teken elk station (klassieke stijl)
  items.forEach((item, idx) => {
    const cx = lonToX(item.lon), cy = latToY(item.lat);
    const [bg, fg] = interpKleur(item.val, p.schaal, p.kleuren);

    let tekst;
    if (huidigParam === "DD") {
      tekst = windpijl(item.val) + " " + item.val.toFixed(0);
    } else if (p.bft) {
      tekst = kmhNaarBft(item.val) + " Bft";
    } else if (huidigParam === "VV" && item.val < 10) {
      tekst = Math.round(item.val * 1000) + "m";
    } else {
      tekst = item.val.toFixed(p.decimalen);
    }

    const g = ns("g");
    const r = 22;

    // Cirkel
    const circle = ns("circle");
    circle.setAttribute("cx", cx); circle.setAttribute("cy", cy);
    circle.setAttribute("r", r);
    circle.setAttribute("fill", bg); circle.setAttribute("fill-opacity", "0.72");
    circle.setAttribute("stroke", idx === 0 ? "#cc0000" : idx === 1 ? "#e6a800" : idx === 2 ? "#888" : "white");
    circle.setAttribute("stroke-width", idx <= 2 ? "3" : "1.5");
    g.appendChild(circle);

    // Buitenste ring top 2
    if (idx <= 1) {
      const ring = ns("circle");
      ring.setAttribute("cx", cx); ring.setAttribute("cy", cy);
      ring.setAttribute("r", r + 5);
      ring.setAttribute("fill", "none");
      ring.setAttribute("stroke", idx === 0 ? "#cc0000" : "#e6a800");
      ring.setAttribute("stroke-width", "2");
      ring.setAttribute("stroke-dasharray", idx === 0 ? "5,3" : "4,4");
      g.appendChild(ring);
    }

    // Windpijl naast cirkel (alleen bij FF/FX)
    if (p.bft) {
      const ddData = dagObj["DD"];
      const dd = ddData ? ddData[item.naam] : null;
      const pijl = windpijl(dd);
      if (pijl) {
        const pijlText = ns("text");
        pijlText.setAttribute("x", cx + r + 10); pijlText.setAttribute("y", cy + 6);
        pijlText.setAttribute("text-anchor", "middle");
        pijlText.setAttribute("font-size", "24"); pijlText.setAttribute("font-weight", "900");
        pijlText.setAttribute("font-family", "Arial,sans-serif");
        pijlText.setAttribute("fill", "#222");
        pijlText.setAttribute("stroke", "#222"); pijlText.setAttribute("stroke-width", "1");
        pijlText.textContent = pijl;
        g.appendChild(pijlText);
      }
    }

    // Waarde tekst
    const text = ns("text");
    text.setAttribute("x", cx); text.setAttribute("y", cy + 4);
    text.setAttribute("text-anchor", "middle");
    const klein = (huidigParam === "VV" && item.val < 10);
    text.setAttribute("font-size", klein ? "9" : "12"); text.setAttribute("font-weight", "bold");
    text.setAttribute("font-family", "Arial,sans-serif");
    text.setAttribute("fill", fg);
    text.textContent = tekst;
    g.appendChild(text);

    svg.appendChild(g);
  });

  // Top 3 paneel
  const top3 = items.slice(0, 3);
  const top3Kleuren = ["#cc0000","#8B6914","#888888"];
  const paneel_x = 10, paneel_y = 10;
  const paneel_b = 180, rij_h = 38, paneel_h = 20 + top3.length * rij_h;

  const pRect = ns("rect");
  pRect.setAttribute("x", paneel_x); pRect.setAttribute("y", paneel_y);
  pRect.setAttribute("width", paneel_b); pRect.setAttribute("height", paneel_h);
  pRect.setAttribute("rx", 6); pRect.setAttribute("fill", "white");
  pRect.setAttribute("fill-opacity", "0.88");
  pRect.setAttribute("stroke", "#ccc"); pRect.setAttribute("stroke-width", "0.8");
  svg.appendChild(pRect);

  const pTitel = ns("text");
  pTitel.setAttribute("x", paneel_x + paneel_b/2); pTitel.setAttribute("y", paneel_y + 14);
  pTitel.setAttribute("text-anchor", "middle");
  pTitel.setAttribute("font-size", "11"); pTitel.setAttribute("font-weight", "bold");
  pTitel.setAttribute("font-family", "Arial,sans-serif"); pTitel.setAttribute("fill", "#003366");
  pTitel.textContent = "Top 3";
  svg.appendChild(pTitel);

  top3.forEach((item, idx) => {
    const ry = paneel_y + 22 + idx * rij_h;
    const medKleur = top3Kleuren[idx];

    const med = ns("circle");
    med.setAttribute("cx", paneel_x + 18); med.setAttribute("cy", ry + 12);
    med.setAttribute("r", 12); med.setAttribute("fill", medKleur);
    svg.appendChild(med);
    const medTxt = ns("text");
    medTxt.setAttribute("x", paneel_x + 18); medTxt.setAttribute("y", ry + 17);
    medTxt.setAttribute("text-anchor", "middle"); medTxt.setAttribute("font-size", "13");
    medTxt.setAttribute("font-weight", "bold"); medTxt.setAttribute("font-family", "Arial,sans-serif");
    medTxt.setAttribute("fill", "white"); medTxt.textContent = String(idx + 1);
    svg.appendChild(medTxt);

    const stn = ns("text");
    stn.setAttribute("x", paneel_x + 35); stn.setAttribute("y", ry + 10);
    stn.setAttribute("font-size", "11"); stn.setAttribute("font-weight", "bold");
    stn.setAttribute("font-family", "Arial,sans-serif"); stn.setAttribute("fill", "#222");
    stn.textContent = item.naam;
    svg.appendChild(stn);

    let waardeTxt;
    if (huidigParam === "VV" && item.val < 10) {
      waardeTxt = Math.round(item.val * 1000) + " m";
    } else {
      waardeTxt = item.val.toFixed(p.decimalen) + (p.eenheid || "");
    }
    const wrd = ns("text");
    wrd.setAttribute("x", paneel_x + 35); wrd.setAttribute("y", ry + 24);
    wrd.setAttribute("font-size", "10"); wrd.setAttribute("font-family", "Arial,sans-serif");
    wrd.setAttribute("fill", medKleur); wrd.setAttribute("font-weight", "bold");
    wrd.textContent = waardeTxt;
    svg.appendChild(wrd);
  });

  // Copyright
  const cr = ns("text");
  cr.setAttribute("x", SVG_W - 10); cr.setAttribute("y", SVG_H - 8);
  cr.setAttribute("text-anchor", "end"); cr.setAttribute("font-size", "13");
  cr.setAttribute("font-family", "Arial,sans-serif"); cr.setAttribute("font-style", "italic");
  cr.setAttribute("fill", "#888");
  cr.textContent = "© Ed Aldus / DWD MOSMIX";
  svg.appendChild(cr);
}

function toggleWeergave() {
  if (kwamuUitGrid && !gridModus) {
    gridModus = true;
    kwamuUitGrid = false;
  } else {
    gridModus = !gridModus;
    kwamuUitGrid = false;
  }
  document.getElementById("single-view").style.display = gridModus ? "none" : "flex";
  document.getElementById("grid-view").style.display = gridModus ? "grid" : "none";
  const btn = document.getElementById("btn-weergave");

}

function tekenGrid() {
  if (!mosmixData) return;
  const container = document.getElementById("grid-view");
  container.innerHTML = "";
  const p = PARAMS[huidigParam];
  if (!p) return;

  mosmixData.dagen.forEach(dagKey => {
    const dagObj = mosmixData.data[dagKey];
    if (!dagObj || !dagObj[huidigParam]) return;
    const d = new Date(dagKey + "T12:00:00");
    const label = dagLabel(d);

    const card = document.createElement("div");
    card.className = "grid-card";
    card.onclick = () => {
      gridModus = false;
      kwamuUitGrid = true;
      document.getElementById("single-view").style.display = "flex";
      document.getElementById("grid-view").style.display = "none";
      document.getElementById("btn-weergave").textContent = "← Terug naar alle dagen";
      document.getElementById("btn-weergave").classList.add("actief");
      document.getElementById("btn-weergave").classList.remove("actief");
      document.querySelectorAll(".btn-dag").forEach(b => b.style.opacity = "1");
      huidigDag = dagKey;
      document.querySelectorAll(".btn-dag").forEach(b => b.classList.toggle("actief", b.dataset.dag === dagKey));
      update();
    };

    const header = document.createElement("div");
    header.className = "grid-card-header";
    header.innerHTML = `<span>${label}</span><span class="sub">${p.label}</span>`;
    card.appendChild(header);

    const body = document.createElement("div");
    body.className = "grid-card-body";
    const baseSvg = document.createElementNS("http://www.w3.org/2000/svg","svg");
    baseSvg.setAttribute("viewBox","0 0 1000 770");
    baseSvg.setAttribute("preserveAspectRatio","xMidYMid meet");
    baseSvg.setAttribute("class","basemap");

    bouwBasemap(baseSvg);

    if(HEATMAP_PARAMS_BE.has(huidigParam)){

function _exportCanvas(callback) {
  const baseSvg = document.getElementById("basemap-svg");
  const hc  = document.getElementById("heatmap");
  const overlay = document.getElementById("be-kaart");
  const header = document.getElementById("kaart-header");
  const W = BASEMAP_W, H = BASEMAP_H;
  const canvas = document.createElement("canvas");
  canvas.width = W;
  const headerH = 120;
  canvas.height = H + headerH;
  const ctx = canvas.getContext("2d");
  tekenHeaderCanvas(ctx, W, headerH);

  const svgToImg = (svg, extraStyle) => new Promise(res => {
    const clone = svg.cloneNode(true);
    if(extraStyle){
      const st = document.createElementNS("http://www.w3.org/2000/svg","style");
      st.textContent = extraStyle;
      clone.insertBefore(st, clone.firstChild);
    }
    clone.setAttribute("xmlns","http://www.w3.org/2000/svg");
    clone.setAttribute("width", W);
    clone.setAttribute("height", H);
    const blob = new Blob([new XMLSerializer().serializeToString(clone)], {type:"image/svg+xml"});
    const url = URL.createObjectURL(blob);
    const im = new Image();
    im.onload = () => { URL.revokeObjectURL(url); res(im); };
    im.src = url;
  });

  const baseStyle = `
    svg { background: #b8d4e8; }
    .basemap-land { fill: #f5efd9; }
    .basemap-prov { fill: none; stroke: rgba(255,255,255,0.7); stroke-width: 0.6; }
  `;
  const overlayStyle = `
    .be-buitengrens { fill: none; stroke: white; stroke-width: 2; stroke-linejoin: round; }
  `;

  Promise.all([svgToImg(baseSvg, baseStyle), svgToImg(overlay, overlayStyle)]).then(([baseImg, ovImg]) => {
    ctx.fillStyle = "#b8d4e8";
    ctx.fillRect(0, headerH, W, H);
    ctx.drawImage(baseImg, 0, headerH, W, H);
    if(hc.width > 1) ctx.drawImage(hc, 0, headerH, W, H);
    ctx.drawImage(ovImg, 0, headerH, W, H);
    callback(canvas);
  });
}

function slaOp() {
  _exportCanvas(canvas => {
    const a = document.createElement("a");
    a.href = canvas.toDataURL("image/png");
    a.download = `mosmix_be_${huidigParam}_${huidigDag}.png`;
    a.click();
  });
}

function openZoom() {
  _exportCanvas(canvas => {
    document.getElementById("lightbox-img").src = canvas.toDataURL("image/png");
    document.getElementById("lightbox").classList.add("actief");
  });
}
function sluitZoom() { document.getElementById("lightbox").classList.remove("actief"); }
document.addEventListener("keydown", e => { if(e.key==="Escape") sluitZoom(); });

function tekenHeaderCanvas(ctx, breedte, hoogte) {
  ctx.fillStyle = "#003366";
  ctx.fillRect(0, 0, breedte, hoogte);
  ctx.fillStyle = "#4a90c4";
  ctx.fillRect(0, hoogte-4, breedte, 4);
  const pad = 28;
  ctx.fillStyle = "white"; ctx.font = "bold 44px Arial"; ctx.textAlign = "left"; ctx.textBaseline = "alphabetic";
  ctx.fillText("Ed Aldus WM", pad, 56);
  ctx.fillStyle = "#a8c8e8"; ctx.font = "26px Arial";
  ctx.fillText(runLabel(), pad, 94);
  ctx.fillStyle = "white"; ctx.font = "bold 44px Arial"; ctx.textAlign = "right";
  ctx.fillText(document.getElementById("kaart-dag-label").textContent, breedte-pad, 56);
  ctx.fillStyle = "#a8c8e8"; ctx.font = "26px Arial";
  ctx.fillText(document.getElementById("kaart-subtitel").textContent, breedte-pad, 94);
  ctx.textAlign = "left";
}

document.getElementById("param-btns").addEventListener("click", e => {
  const btn = e.target.closest(".btn-param"); if (!btn) return;
  huidigParam = btn.dataset.param;
  document.querySelectorAll(".btn-param").forEach(b => b.classList.remove("actief"));
  btn.classList.add("actief"); update();
});

function leesUrlParams() {
  const params = new URLSearchParams(window.location.search);
  if (params.get("param") && PARAMS[params.get("param")]) {
    huidigParam = params.get("param");
    document.querySelectorAll(".btn-param").forEach(b => {
      b.classList.toggle("actief", b.dataset.param === huidigParam);
    });
  }
}

function startLaad() {
  leesUrlParams();
  Promise.all([
    fetch("mosmix_be.json?t="+Date.now()).then(r=>r.json()),
    fetch("be_provincies.geojson").then(r=>r.json())
  ]).then(([data, prov]) => {
    provincies = prov;
    bouwBasemap(document.getElementById("basemap-svg"));
    maakLandMask();
    mosmixData = data;
    // Run-info tonen
    let updateTekst = "Bijgewerkt: " + data.bijgewerkt.replace("T"," ");
    if (data.run) {
      const rd = new Date(data.run);
      const runUur = rd.getUTCHours().toString().padStart(2,"0");
      const runDag = rd.getUTCDate() + "-" + (rd.getUTCMonth()+1) + "-" + rd.getUTCFullYear();
      updateTekst += "  ·  Run: " + runDag + " " + runUur + " UTC";
    }
    document.getElementById("hdr-update").textContent = updateTekst;
    document.getElementById("status").textContent = "";

    const dagBtns = document.getElementById("dag-btns");
    const vandaag = new Date().toISOString().slice(0,10);
    data.dagen.forEach((key, i) => {
      const d = new Date(key + "T12:00:00");
      let lbl;
      if (key === vandaag) lbl = "Vandaag";
      else if (i === 0 || (i === 1 && data.dagen[0] === vandaag)) {
        const diff = Math.round((d - new Date(vandaag+"T12:00:00")) / 86400000);
        lbl = diff === 1 ? "Morgen" : dagLabel(d);
      } else {
        lbl = NL_DAGEN[d.getDay()].slice(0,2) + " " + d.getDate() + "/" + (d.getMonth()+1);
      }
      const btn = document.createElement("button");
      btn.className = "btn-dag" + (i === 0 ? " actief" : "");
      btn.dataset.dag = key;
      btn.textContent = lbl;
      btn.onclick = () => {
        huidigDag = key;
        document.querySelectorAll(".btn-dag").forEach(b => b.classList.remove("actief"));
        btn.classList.add("actief");
        update();
      };
      dagBtns.appendChild(btn);
    });

    huidigDag = data.dagen[0];
    update();
  }).catch(e => {
    document.getElementById("status").textContent = "Kon data niet laden: " + e.message;
  });
}
startLaad();
</script>
</body>
</html>
