<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Neerslagkaarten · Weerlab</title>

<style>
*{box-sizing:border-box}
body{margin:0;color:#e6ecf5;background:#0d1420;font:15px/1.45 system-ui,sans-serif}
main{max-width:1150px;margin:auto;padding:16px;display:grid;gap:12px}
h1,p{margin:0}
h1{font-size:clamp(22px,4vw,32px)}
.controls,#legend{display:flex;align-items:center;flex-wrap:wrap;gap:8px 12px}
label{display:inline-flex;align-items:center;gap:6px}
select{font:inherit;color:inherit;background:#172235;border:1px solid #536885;border-radius:6px;padding:7px}
#map{position:relative;width:min(100%,1000px);margin:auto;overflow:hidden;border-radius:9px;background:#cfe2ee}
#map canvas{display:block;width:100%;height:auto}
#map.landelijk{max-width:690px}
.maximum{position:absolute;pointer-events:none;transform:translate(-50%,-50%);width:14px;height:14px;border:3px solid white;border-radius:50%;background:#121d30;box-shadow:0 0 0 1px #121d30}
.maximum b{position:absolute;top:50%;left:16px;transform:translateY(-50%);width:max-content;max-width:min(42vw,210px);background:#121d30;color:white;padding:4px 7px;border-radius:5px;font-size:13px}
.maximum.links b{left:auto;right:16px}
#legend span{display:inline-flex;gap:5px;align-items:center;font-size:13px}
#legend i{width:15px;height:13px;border:1px solid #8895a7}
#source,#status,#point{color:#c2cfe1;font-size:14px}
</style>
<script defer src="accumulatie_core.js?v=20261028"></script>
<script defer src="neerslagkaarten-core.js?v=kaartrespons"></script>
<script defer src="neerslagkaarten-map.js?v=kaartrespons"></script>
</head>
<body>
<main>
<h1>Neerslagverwachting</h1>
<div class="controls">
<label>Gebied <select id="region"><option>Rijnmond</option><option>Nederland</option></select></label>
<label>Datum <select id="date"></select></label>
<label>Dagdeel <select id="part"></select></label>

</div>
<p id="status" role="status">Modelgegevens laden…</p>
<button id="retry" type="button" hidden>Opnieuw laden</button>
<div id="map"><canvas aria-label="Kaart van de verwachte neerslagsom"></canvas><span id="maximum-markers"></span></div>
<p id="maximum-summary"></p>
<p id="background-status" role="status"></p>
<div id="legend" aria-label="Legenda in millimeter"></div>
<p id="point" aria-live="polite">Klik op de kaart voor de waarde van het modelroosterpunt.</p>
<p id="source"></p>
<p>De kaart telt de uursommen op in millimeters. Bij onvolledige dekking toont de kaart een deelsom voor de vermelde uren. Het tijdvak 18–06 eindigt de volgende ochtend.</p>
</main>
</body>
</html>
