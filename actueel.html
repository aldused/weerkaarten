<style>

<div style="text-align:center;font-size:11px;color:#888;padding:6px 0;">© Ed Aldus WM · Data: KNMI</div>

<script>
const LON_MIN=3.3, LON_MAX=7.4, LAT_MIN=50.45, LAT_MAX=53.8;
const SVG_W=800, SVG_H=1100;
function lonToX(lon){return (lon-LON_MIN)/(LON_MAX-LON_MIN)*SVG_W;}
function latToY(lat){return (1-(lat-LAT_MIN)/(LAT_MAX-LAT_MIN))*SVG_H;}
function ns(tag){return document.createElementNS("http://www.w3.org/2000/svg",tag);}

const BFT=[0.3,1.6,3.4,5.5,8.0,10.8,13.9,17.2,20.8,24.5,28.5,32.7];
function msToBft(ms){if(!ms&&ms!==0)return 0;let b=0;for(let i=0;i<BFT.length;i++){if(ms>=BFT[i])b=i+1;else break;}return b;}
function windpijl(dd){if(dd==null)return "";const p=["↓","↙","←","↖","↑","↗","→","↘"];return p[Math.round(dd/45)%8];}

const PARAMS = {
  ta:  {label:"Temperatuur (°C)",         eenheid:"°",     decimalen:1,
        kleuren:[["#084594",-5],["#1565c0",-3],["#64b5f6",0],["#a5d6a7",2],["#2e8b57",4],["#388e3c",6],["#43a047",8],["#66bb6a",9],["#7cb342",10],["#8bc34a",11],["#aed581",12],["#c5e17a",13],["#dce775",14],["#f0ef80",15],["#fff176",16],["#ffee58",17],["#fdd835",18],["#fbc02d",19],["#f9a825",20],["#ffa726",21],["#ff8f00",24],["#fb8c00",27],["#ef6c00",30],["#e65100",33],["#d84315",36],["#4a148c",40]],schaal:[-5,40]},
  td:  {label:"Dauwpunt (°C)",            eenheid:"°",     decimalen:1,
        kleuren:[["#1a3a6b","≤-5°"],["#2980b9","0°"],["#a8d8ea","5°"],["#ffffcc","10°"],["#fed976","15°"],["#fd8d3c","20°+"]],schaal:[-5,20]},
  ff:  {label:"Windsnelheid (Bft)",        eenheid:"bft",   decimalen:0,
        kleuren:[["#ffffff",0],["#c8e6c9",1],["#81c784",2],["#4caf50",3],["#ffee58",4],["#ffa726",5],["#ff7043",6],["#e53935",7],["#b71c1c",8],["#7b1fa2",9],["#4a148c",12]],schaal:[0,12]},
  fx:  {label:"Max windstoot (km/h)",      eenheid:" km/h", decimalen:0,
        kleuren:[["#ffffff",20],["#c8e6c9",30],["#81c784",40],["#4caf50",50],["#ffee58",62],["#ffa726",75],["#ff7043",89],["#e53935",103],["#b71c1c",118]],schaal:[20,120]},
  n:   {label:"Bewolking (okta's)",        eenheid:"",      decimalen:0,
        kleuren:[["#FFD700","0"],["#ffe066","2"],["#c8c8c8","4"],["#888888","6"],["#444444","8"]],schaal:[0,8]},
  rh:  {label:"Relatieve vochtigheid (%)", eenheid:"%",     decimalen:0,
        kleuren:[["#fff7bc","30%"],["#fec44f","50%"],["#d95f0e","70%"],["#993404","85%"],["#4d1600","100%"]],schaal:[20,100]},
  vv:  {label:"Zicht",                    eenheid:"",      decimalen:0,
        kleuren:[["#800026","<200m"],["#e31a1c","500m"],["#fd8d3c","1km"],["#fecc5c","5km"],["#ffffb2","10km+"]],schaal:[0,10000]},
  tg:  {label:"Grastemperatuur (°C)",      eenheid:"°",     decimalen:1,
        kleuren:[["#1a3a6b",-10],["#2980b9",-5],["#a8d8ea",0],["#ffffcc",5],["#fed976",10],["#fd8d3c",15],["#e65100",20]],schaal:[-15,25]},
  p0:  {label:"Luchtdruk (hPa)",           eenheid:" hPa",  decimalen:1,
        kleuren:[["#4a0080","≤990"],["#2171b5","1000"],["#6baed6","1010"],["#c6dbef","1020"],["#f7fbff","1030+"]],schaal:[990,1030]}
};

function hexToRgb(hex){return [parseInt(hex.slice(1,3),16),parseInt(hex.slice(3,5),16),parseInt(hex.slice(5,7),16)];}
function interpKleur(val,schaal,stops){
  const colors=stops.map(s=>hexToRgb(s[0]));
  let idx,f;
  if(typeof stops[0][1]==='number'){
    const temps=stops.map(s=>s[1]);
    const v=Math.max(temps[0],Math.min(temps[temps.length-1],val));
    idx=temps.length-2;
    for(let i=0;i<temps.length-1;i++){if(v<=temps[i+1]){idx=i;break;}}
    f=(v-temps[idx])/(temps[idx+1]-temps[idx]);
  } else {
    const t=Math.max(0,Math.min(1,(val-schaal[0])/(schaal[1]-schaal[0])));
    idx=Math.min(colors.length-2,Math.floor(t*(colors.length-1)));
    f=t*(colors.length-1)-idx;
  }
  const a=colors[idx],b=colors[idx+1];
  const r=Math.round(a[0]+f*(b[0]-a[0])),g=Math.round(a[1]+f*(b[1]-a[1])),bl=Math.round(a[2]+f*(b[2]-a[2]));
  const lum=(0.299*r+0.587*g+0.114*bl)/255;
  return [`rgb(${r},${g},${bl})`,lum<0.55?"white":"#222"];
}

let stationData = {}, huidigParam = "ta";

// ── Heatmap: Modified Shepard + Gaussian blur ───────────────────────────────
const HEATMAP_RES = 3;
const BASEMAP_W = 1600;
const BASEMAP_H = 2200;
const SHEPARD_POWER = 2.5;
const SHEPARD_KNN = 8;
const BLUR_SIGMA = 2;
const HEATMAP_ALPHA = 0.55;
const HEATMAP_PARAMS = new Set(["ta","td","tg","ff","fx","rh"]);
let landMask = null;
let provincies = null;

function bouwBasemap(svg){
  while(svg.firstChild) svg.removeChild(svg.firstChild);
  if(!provincies) return;
  const ringD = (ring) => {
    let d = "";
    ring.forEach(([lon,lat], i) => {
      const x = lonToX(lon), y = latToY(lat);
      d += (i===0?"M":"L") + x.toFixed(1) + " " + y.toFixed(1);
    });
    return d + "Z";
  };
  let d = "";
  for(const feat of provincies.features){
    const g = feat.geometry;
    const polys = g.type==="Polygon" ? [g.coordinates] : g.coordinates;
    for(const poly of polys){
      for(const ring of poly) d += ringD(ring);
    }
  }
  const landPath = ns("path");
  landPath.setAttribute("d", d);
  landPath.setAttribute("class","basemap-land");
  landPath.setAttribute("fill-rule","evenodd");
  svg.appendChild(landPath);
  const provPath = ns("path");
  provPath.setAttribute("d", d);
  provPath.setAttribute("class","basemap-prov");
  svg.appendChild(provPath);
}

function tekenBuitengrens(svg){
  if(!provincies) return;
  const ringD = (ring) => {
    let d = "";
    ring.forEach(([lon,lat], i) => {
      const x = lonToX(lon), y = latToY(lat);
      d += (i===0?"M":"L") + x.toFixed(1) + " " + y.toFixed(1);
    });
    return d + "Z";
  };
  let d = "";
  for(const feat of provincies.features){
    const g = feat.geometry;
    const polys = g.type==="Polygon" ? [g.coordinates] : g.coordinates;
    for(const poly of polys) d += ringD(poly[0]);
  }
  const p = ns("path");
  p.setAttribute("d", d);
  p.setAttribute("class","nl-buitengrens");
  svg.appendChild(p);
}

function maakLandMask(){
  if(!provincies) return;
  const c = document.createElement("canvas");
  c.width = BASEMAP_W; c.height = BASEMAP_H;
  const ctx = c.getContext("2d");
  ctx.fillStyle = "#000";
  ctx.beginPath();
  for(const feat of provincies.features){
    const g = feat.geometry;
    const polys = g.type==="Polygon" ? [g.coordinates] : g.coordinates;
    for(const poly of polys){
      for(const ring of poly){
        ring.forEach(([lon,lat], i) => {
          const x = lonToX(lon)/SVG_W * BASEMAP_W;
          const y = latToY(lat)/SVG_H * BASEMAP_H;
          if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
        });
        ctx.closePath();
      }
    }
  }
  ctx.fill("evenodd");
  const px = ctx.getImageData(0,0,BASEMAP_W,BASEMAP_H).data;
  const R = HEATMAP_RES;
  const w = Math.ceil(BASEMAP_W/R), h = Math.ceil(BASEMAP_H/R);
  const data = new Uint8Array(w*h);
  for(let y=0;y<h;y++) for(let x=0;x<w;x++){
    let isLand=false;
    for(let dy=0; dy<R && !isLand; dy++) for(let dx=0; dx<R && !isLand; dx++){
      const sx = Math.min(x*R+dx, BASEMAP_W-1), sy = Math.min(y*R+dy, BASEMAP_H-1);
      if(px[(sy*BASEMAP_W+sx)*4+3] > 0) isLand=true;
    }
    data[y*w+x] = isLand ? 1 : 0;
  }
  landMask = {w, h, data};
}

function _shepardVeld(punten){
  const w=landMask.w, h=landMask.h;
  if(punten.length < 3) return null;
  const N = punten.length;
  const K = Math.min(SHEPARD_KNN, N);
  const veld = new Float32Array(w*h);
  for(let y=0;y<h;y++) for(let x=0;x<w;x++){
    const idx = y*w+x;
    if(!landMask.data[idx]) continue;
    const dArr = new Float64Array(N);
    for(let i=0;i<N;i++){
      const dx=x-punten[i].x, dy=y-punten[i].y;
      dArr[i] = Math.sqrt(dx*dx+dy*dy);
    }
    const idxs = new Int32Array(N); for(let i=0;i<N;i++) idxs[i]=i;
    for(let k=0;k<K;k++){
      let mi=k;
      for(let j=k+1;j<N;j++) if(dArr[idxs[j]]<dArr[idxs[mi]]) mi=j;
      const t=idxs[k]; idxs[k]=idxs[mi]; idxs[mi]=t;
    }
    const R = dArr[idxs[K-1]] + 1e-6;
    let sumW=0, sumWV=0;
    for(let k=0;k<K;k++){
      const i=idxs[k], d=dArr[i];
      if(d<0.7){ sumWV=punten[i].val; sumW=1; break; }
      const num = (R-d)/(R*d);
      const wi = Math.pow(num, SHEPARD_POWER);
      sumW+=wi; sumWV+=wi*punten[i].val;
    }
    veld[idx] = sumWV/sumW;
  }
  return veld;
}

function _blurVeld(veld){
  const sigma = BLUR_SIGMA;
  if(sigma<=0) return veld;
  const w=landMask.w, h=landMask.h, mask=landMask.data;
  const radius = Math.max(1, Math.ceil(sigma*3));
  const kernel = new Float32Array(radius*2+1);
  let ks=0;
  for(let i=-radius;i<=radius;i++){
    const v = Math.exp(-(i*i)/(2*sigma*sigma));
    kernel[i+radius]=v; ks+=v;
  }
  for(let i=0;i<kernel.length;i++) kernel[i]/=ks;
  const tmp = new Float32Array(w*h);
  for(let y=0;y<h;y++) for(let x=0;x<w;x++){
    if(!mask[y*w+x]){ tmp[y*w+x]=0; continue; }
    let s=0, ws=0;
    for(let k=-radius;k<=radius;k++){
      const xx=x+k; if(xx<0||xx>=w) continue;
      if(!mask[y*w+xx]) continue;
      const wt=kernel[k+radius];
      s+=veld[y*w+xx]*wt; ws+=wt;
    }
    tmp[y*w+x] = ws>0 ? s/ws : veld[y*w+x];
  }
  const out = new Float32Array(w*h);
  for(let y=0;y<h;y++) for(let x=0;x<w;x++){
    if(!mask[y*w+x]){ out[y*w+x]=0; continue; }
    let s=0, ws=0;
    for(let k=-radius;k<=radius;k++){
      const yy=y+k; if(yy<0||yy>=h) continue;
      if(!mask[yy*w+x]) continue;
      const wt=kernel[k+radius];
      s+=tmp[yy*w+x]*wt; ws+=wt;
    }
    out[y*w+x] = ws>0 ? s/ws : tmp[y*w+x];
  }
  return out;
}

function _stationVal(st, param){
  if(param === "tg") return st.tg != null ? st.tg : st.tgn;
  return st[param];
}

function tekenHeatmap(){
  const hc = document.getElementById("heatmap");
  const p = PARAMS[huidigParam];
  if(!p || !HEATMAP_PARAMS.has(huidigParam)){ hc.width=1; hc.height=1; return; }
  if(!landMask) maakLandMask();
  if(!landMask){ hc.width=1; hc.height=1; return; }

  const w = landMask.w, h = landMask.h;
  const punten = [];
  Object.values(stationData).forEach(st => {
    if(!st || st.lon==null || st.lat==null) return;
    const val = _stationVal(st, huidigParam);
    if(val == null) return;
    punten.push({x: lonToX(st.lon)/SVG_W*w, y: latToY(st.lat)/SVG_H*h, val});
  });
  let veld = _shepardVeld(punten);
  if(!veld) return;
  veld = _blurVeld(veld);

  hc.width = BASEMAP_W; hc.height = BASEMAP_H;
  const ctx = hc.getContext("2d");
  ctx.clearRect(0, 0, hc.width, hc.height);

  const tmpC = document.createElement("canvas");
  tmpC.width = w; tmpC.height = h;
  const tctx = tmpC.getContext("2d");
  const imgData = tctx.createImageData(w, h);
  const buf = imgData.data;
  for(let i=0;i<w*h;i++){
    if(!landMask.data[i]){ buf[i*4+3]=0; continue; }
    let v = veld[i];
    if(huidigParam==="ff") v = msToBft(v);
    else if(huidigParam==="fx") v = v*3.6;
    const [bg] = interpKleur(v, p.schaal, p.kleuren);
    const m = bg.match(/\d+/g);
    buf[i*4]=+m[0]; buf[i*4+1]=+m[1]; buf[i*4+2]=+m[2];
    buf[i*4+3] = Math.round(HEATMAP_ALPHA*255);
  }
  tctx.putImageData(imgData, 0, 0);
  ctx.imageSmoothingEnabled = true;
  ctx.imageSmoothingQuality = "high";
  ctx.drawImage(tmpC, 0, 0, hc.width, hc.height);
}

// Heatmap-stationsstijl: kleine dot + groot getal met witte halo
function tekenHeatmapStation(svg, st){
  const cx = lonToX(st.lon), cy = latToY(st.lat);
  const val = _stationVal(st, huidigParam);
  const g = ns("g");
  const dot = ns("circle");
  dot.setAttribute("cx", cx.toFixed(1)); dot.setAttribute("cy", cy.toFixed(1));
  dot.setAttribute("r","2"); dot.setAttribute("fill","#1a1a1a");
  g.appendChild(dot);

  let tekst;
  if(huidigParam==="ff") tekst = msToBft(val) + "";
  else if(huidigParam==="fx") tekst = Math.round(val*3.6) + "";
  else if(huidigParam==="rh") tekst = Math.round(val) + "%";
  else tekst = val.toFixed(1);

  const t = ns("text");
  t.setAttribute("x", cx.toFixed(1)); t.setAttribute("y", (cy-7).toFixed(1));
  t.setAttribute("text-anchor","middle");
  t.setAttribute("font-family","Arial,sans-serif");
  t.setAttribute("font-weight","700");
  t.setAttribute("font-size","20");
  t.setAttribute("fill","#1a1a1a");
  t.setAttribute("paint-order","stroke");
  t.setAttribute("stroke","white");
  t.setAttribute("stroke-width","4");
  t.setAttribute("stroke-linejoin","round");
  t.textContent = tekst;
  g.appendChild(t);

  if(huidigParam==="ff" || huidigParam==="fx"){
    const pijl = windpijl(st.dd);
    if(pijl){
      const pt = ns("text");
      pt.setAttribute("x", (cx+12).toFixed(1)); pt.setAttribute("y", (cy+5).toFixed(1));
      pt.setAttribute("text-anchor","middle");
      pt.setAttribute("font-family","Arial,sans-serif");
      pt.setAttribute("font-weight","900");
      pt.setAttribute("font-size","18");
      pt.setAttribute("fill","#1a1a1a");
      pt.setAttribute("paint-order","stroke");
      pt.setAttribute("stroke","white");
      pt.setAttribute("stroke-width","3.5");
      pt.setAttribute("stroke-linejoin","round");
      pt.textContent = pijl;
      g.appendChild(pt);
    }
  }
  svg.appendChild(g);
}

function getVal(st, param) {
  let val = st[param];
  if (val == null) return null;
  if (param === "ff") return msToBft(val);
  if (param === "fx") return Math.round(val * 3.6);
  if (param === "tg") return st.tg != null ? st.tg : st.tgn;
  return val;
}

function formatVal(st, param) {
  const raw = st[param];
  if (raw == null) return "–";
  const p = PARAMS[param];
  if (param === "ff") return windpijl(st.dd) + " " + raw.toFixed(1) + " m/s (" + msToBft(raw) + " Bft)";
  if (param === "fx") return Math.round(raw * 3.6) + " km/h";
  if (param === "vv") return raw >= 10000 ? ">10 km" : raw >= 1000 ? (raw/1000).toFixed(1) + " km" : Math.round(raw) + " m";
  if (param === "n") return raw + "/8";
  if (param === "p0") return raw != null ? raw.toFixed(1) + " hPa" : "–";
  return raw.toFixed(p.decimalen) + (p.eenheid || "");
}

function formatKaart(st, param) {
  const raw = st[param];
  if (raw == null) return null;
  if (param === "ff") return windpijl(st.dd) + " " + raw.toFixed(1);
  if (param === "fx") return Math.round(raw * 3.6) + "";
  if (param === "vv") return raw >= 10000 ? "10+" : raw >= 1000 ? (raw/1000).toFixed(1) + "k" : Math.round(raw) + "m";
  if (param === "n") return Math.round(raw) + "/8";
  if (param === "p0") return raw.toFixed(0);
  if (param === "rh") return Math.round(raw) + "%";
  return raw.toFixed(PARAMS[param].decimalen) + (param === "ta" || param === "td" || param === "tg" ? "°" : "");
}

function tekenKaart() {
  const svg = document.getElementById("nl-kaart");
  svg.innerHTML = "";
  const p = PARAMS[huidigParam];

  tekenBuitengrens(svg);
  tekenHeatmap();

  const isHeatmap = HEATMAP_PARAMS.has(huidigParam);

  Object.values(stationData).forEach(st => {
    if (!st || st.lon == null || st.lat == null) return;
    const val = getVal(st, huidigParam);
    if (val == null) return;

    if(isHeatmap){
      tekenHeatmapStation(svg, st);
      return;
    }

    const tekst = formatKaart(st, huidigParam);
    if (tekst == null) return;

    const cx = lonToX(st.lon), cy = latToY(st.lat);
    const [bg, fg] = interpKleur(val, p.schaal, p.kleuren);

    const g = ns("g");
    const circle = ns("circle");
    circle.setAttribute("cx", cx); circle.setAttribute("cy", cy);
    circle.setAttribute("r", 22); circle.setAttribute("fill", bg); circle.setAttribute("fill-opacity", "0.72");
    circle.setAttribute("stroke", "white"); circle.setAttribute("stroke-width", "1.5");
    g.appendChild(circle);

    const text = ns("text");
    text.setAttribute("x", cx); text.setAttribute("y", cy + 4);
    text.setAttribute("text-anchor", "middle");
    text.setAttribute("font-size", tekst.length > 5 ? "9" : "12");
    text.setAttribute("font-weight", "bold");
    text.setAttribute("font-family", "Arial,sans-serif");
    text.setAttribute("fill", fg);
    text.textContent = tekst;
    g.appendChild(text);

    svg.appendChild(g);
  });

  // Copyright
  const cr = ns("text");
  cr.setAttribute("x", SVG_W - 10); cr.setAttribute("y", SVG_H - 12);
  cr.setAttribute("text-anchor", "end"); cr.setAttribute("font-size", "16");
  cr.setAttribute("font-family", "Arial,sans-serif"); cr.setAttribute("font-style", "italic");
  cr.setAttribute("fill", "#888"); cr.textContent = "© Ed Aldus / KNMI";
  svg.appendChild(cr);
}

function tekenLijst() {
  const lijst = document.getElementById("stations-lijst");
  const sorteer = document.getElementById("sorteer").value;
  const items = Object.values(stationData).filter(st => st && st.lon != null);

  if (sorteer === "naam") {
    items.sort((a, b) => a.naam.localeCompare(b.naam));
  } else {
    items.sort((a, b) => {
      const va = getVal(a, huidigParam), vb = getVal(b, huidigParam);
      if (va == null && vb == null) return 0;
      if (va == null) return 1;
      if (vb == null) return -1;
      return sorteer === "param-asc" ? va - vb : vb - va;
    });
  }

  // Bepaal hoogste en laagste voor highlight
  const vals = items.map(st => getVal(st, huidigParam)).filter(v => v != null);
  const maxVal = Math.max(...vals), minVal = Math.min(...vals);

  // Kolommen
  const KOLOMMEN = [
    { key: "naam", lbl: "Station",   eenheid: "" },
    { key: "ta",   lbl: "T",         eenheid: "°C" },
    { key: "td",   lbl: "Td",        eenheid: "°C" },
    { key: "ff",   lbl: "Wind",      eenheid: "Bft" },
    { key: "fx",   lbl: "Stoot",     eenheid: "km/h" },
    { key: "n",    lbl: "Bew",       eenheid: "/8" },
    { key: "rh",   lbl: "RV",        eenheid: "%" },
    { key: "vv",   lbl: "Zicht",     eenheid: "" },
    { key: "tg",   lbl: "GrasT",     eenheid: "°C" },
    { key: "p0",   lbl: "Druk",      eenheid: "hPa" },
  ];
  function fmt(st, key) {
    const v = key === "tg" ? (st.tg ?? st.tgn) : st[key];
    if (v == null) return "–";
    if (key === "ta" || key === "td" || key === "tg") return v.toFixed(1);
    if (key === "ff") return msToBft(v);
    if (key === "fx") return Math.round(v * 3.6);
    if (key === "n")  return v;
    if (key === "rh") return Math.round(v);
    if (key === "vv") return v >= 10000 ? ">10k" : v >= 1000 ? (v/1000).toFixed(1) + "k" : Math.round(v);
    if (key === "p0") return v.toFixed(1);
    return v;
  }

  let html = '<table class="tabel-stations"><thead><tr>';
  KOLOMMEN.forEach(k => {
    const cls = k.key === huidigParam ? " actief" : "";
    const sub = k.eenheid ? `<small style="display:block;font-size:9px;font-weight:500;opacity:0.7;text-transform:none;letter-spacing:0;">${k.eenheid}</small>` : "";
    html += `<th class="th-${k.key}${cls}" data-key="${k.key}" onclick="kolomKlik('${k.key}')">${k.lbl}${sub}</th>`;
  });
  html += '</tr></thead><tbody>';

  items.forEach(st => {
    const val = getVal(st, huidigParam);
    const isTop = val != null && val === maxVal;
    const isBottom = val != null && val === minVal;
    const rowCls = isTop ? "top" : isBottom ? "bottom" : "";
    html += `<tr class="${rowCls}">`;
    KOLOMMEN.forEach(k => {
      if (k.key === "naam") { html += `<td>${st.naam}</td>`; return; }
      const txt = fmt(st, k.key);
      const cls = (k.key === huidigParam ? "actief" : "") + (txt === "–" ? " leeg" : "");
      html += `<td class="${cls.trim()}">${txt}</td>`;
    });
    html += `</tr>`;
  });
  html += "</tbody></table>";

  lijst.innerHTML = html;
  document.getElementById("n-stations").textContent = items.length;
}

function tekenLegenda() {
  const p = PARAMS[huidigParam];
  document.getElementById("legenda").innerHTML = p.kleuren.map(([k,l],i,arr)=>{
    const label=typeof l==='number'?(i===0?`≤${l}°`:i===arr.length-1?`${l}°+`:`${l}°`):l;
    return `<div class="legenda-item"><div class="legenda-blok" style="background:${k}"></div>${label}</div>`;
  }).join("");
}

function tekenAlles() {
  document.getElementById("kaart-dag").textContent =
    new Date().toLocaleDateString("nl-NL", {weekday: "long", day: "numeric", month: "short"});
  document.getElementById("kaart-param-label").textContent = PARAMS[huidigParam]?.label || "";
  tekenKaart();
  tekenLijst();
  tekenLegenda();
}

function laadActueel() {
  const fActueel = fetch("actueel.json?t=" + Date.now()).then(r => r.json());
  const fGeo = provincies ? Promise.resolve(provincies) :
    fetch("nl_provincies.geojson").then(r => r.json());
  Promise.all([fActueel, fGeo])
    .then(([json, geo]) => {
      stationData = json.stations || {};
      const bw = json.bijgewerkt || "";
      const tijdMatch = bw.match(/(\d{2}:\d{2})$/);
      document.getElementById("klok-stand").textContent = tijdMatch ? tijdMatch[1] + " uur" : bw;
      if(!provincies){
        provincies = geo;
        bouwBasemap(document.getElementById("basemap-svg"));
        maakLandMask();
      }
      tekenAlles();
    })
    .catch(e => console.error("Laden mislukt:", e));
}

// Parameter knoppen
document.querySelectorAll(".btn-param").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".btn-param").forEach(b => b.classList.remove("actief"));
    btn.classList.add("actief");
    huidigParam = btn.dataset.param;
    document.getElementById("sorteer").value = "param-desc";
    tekenAlles();
  });
});

// Klik op kolomkop in stations-tabel: switch param + toggle hoog/laag
function kolomKlik(key) {
  if (key === "naam") {
    document.getElementById("sorteer").value = "naam";
    tekenAlles();
    return;
  }
  const sortSel = document.getElementById("sorteer");
  if (key === huidigParam) {
    // Toggle richting
    sortSel.value = sortSel.value === "param-desc" ? "param-asc" : "param-desc";
  } else {
    huidigParam = key;
    document.querySelectorAll(".btn-param").forEach(b => {
      b.classList.toggle("actief", b.dataset.param === key);
    });
    sortSel.value = "param-desc";
  }
  tekenAlles();
}

// ── Download kaart als PNG (basemap-SVG + heatmap-canvas + overlay-SVG) ──
function downloadKaart() {
  const baseSvg = document.getElementById("basemap-svg");
  const overlay = document.getElementById("nl-kaart");
  const W = BASEMAP_W, H = BASEMAP_H;
  const hdrH = 110;
  const canvas = document.createElement("canvas");
  canvas.width = W;
  canvas.height = H + hdrH;
  const ctx = canvas.getContext("2d");

  // Header
  ctx.fillStyle = "#003366"; ctx.fillRect(0, 0, W, hdrH);
  ctx.fillStyle = "#4a90c4"; ctx.fillRect(0, hdrH-4, W, 4);
  ctx.fillStyle = "white"; ctx.font = "bold 40px Arial"; ctx.textAlign = "left";
  ctx.fillText("Ed Aldus WM — Actuele Waarnemingen", 28, 55);
  ctx.fillStyle = "#a8c8e8"; ctx.font = "26px Arial";
  ctx.fillText(PARAMS[huidigParam]?.label || "", 28, 90);
  ctx.textAlign = "right"; ctx.fillStyle = "white"; ctx.font = "bold 40px Arial";
  ctx.fillText(document.getElementById("klok-stand").textContent, W - 28, 55);
  ctx.fillStyle = "#a8c8e8"; ctx.font = "26px Arial";
  ctx.fillText(document.getElementById("kaart-dag").textContent, W - 28, 90);
  ctx.textAlign = "left";

  const svgToImg = (svg, extraStyle) => new Promise(res => {
    const clone = svg.cloneNode(true);
    if(extraStyle){
      const st = document.createElementNS("http://www.w3.org/2000/svg","style");
      st.textContent = extraStyle;
      clone.insertBefore(st, clone.firstChild);
    }
    clone.setAttribute("xmlns","http://www.w3.org/2000/svg");
    clone.setAttribute("width", W);
    clone.setAttribute("height", H);
    const blob = new Blob([new XMLSerializer().serializeToString(clone)], {type:"image/svg+xml"});
    const url = URL.createObjectURL(blob);
    const im = new Image();
    im.onload = () => { URL.revokeObjectURL(url); res(im); };
    im.src = url;
  });

  const baseStyle = `
    svg { background: #b8d4e8; }
    .basemap-land { fill: #f5efd9; }
    .basemap-prov { fill: none; stroke: rgba(255,255,255,0.7); stroke-width: 0.6; }
  `;
  const overlayStyle = `
    .nl-buitengrens { fill: none; stroke: white; stroke-width: 2; stroke-linejoin: round; }
  `;

  Promise.all([svgToImg(baseSvg, baseStyle), svgToImg(overlay, overlayStyle)]).then(([baseImg, ovImg]) => {
    ctx.fillStyle = "#b8d4e8";
    ctx.fillRect(0, hdrH, W, H);
    ctx.drawImage(baseImg, 0, hdrH, W, H);
    const hc = document.getElementById("heatmap");
    if(hc.width > 1) ctx.drawImage(hc, 0, hdrH, W, H);
    ctx.drawImage(ovImg, 0, hdrH, W, H);
    const a = document.createElement("a");
    a.download = "actueel_" + huidigParam + "_" + new Date().toISOString().slice(0,16).replace(/[T:]/g,"-") + ".png";
    a.href = canvas.toDataURL("image/png");
    a.click();
  });
}

// ── Download lijst als CSV ──
function downloadCSV() {
  const items = Object.values(stationData).filter(st => st && st.lon != null);
  const stand = document.getElementById("klok-stand").textContent;
  let csv = "Station;Temp (°C);Dauwpunt (°C);Wind (m/s);Bft;Richting (°);Stoot (km/h);Bewolking;Vochtigheid (%);Zicht (m);Gras (°C);Luchtdruk (hPa)\n";
  items.sort((a, b) => a.naam.localeCompare(b.naam));
  items.forEach(st => {
    csv += [
      st.naam,
      st.ta != null ? st.ta.toFixed(1) : "",
      st.td != null ? st.td.toFixed(1) : "",
      st.ff != null ? st.ff.toFixed(1) : "",
      st.ff != null ? msToBft(st.ff) : "",
      st.dd != null ? Math.round(st.dd) : "",
      st.fx != null ? Math.round(st.fx * 3.6) : "",
      st.n != null ? st.n + "/8" : "",
      st.rh != null ? Math.round(st.rh) : "",
      st.vv != null ? Math.round(st.vv) : "",
      (st.tg ?? st.tgn) != null ? (st.tg ?? st.tgn).toFixed(1) : "",
      st.p0 != null ? st.p0.toFixed(1) : "",
    ].join(";") + "\n";
  });
  const blob = new Blob(["\ufeff" + csv], {type: "text/csv;charset=utf-8"});
  const a = document.createElement("a");
  a.download = "actueel_waarnemingen_" + new Date().toISOString().slice(0,16).replace(/[T:]/g,"-") + ".csv";
  a.href = URL.createObjectURL(blob);
  a.click();
}

// Init
laadActueel();
setInterval(laadActueel, 10 * 60 * 1000);
