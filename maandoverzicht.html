<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Maandoverzicht – Ed Aldus WM</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Segoe UI', Arial, sans-serif; background: #f0f4f8; color: #1a2b40; font-size: 13px; }
.header { background: #00205b; padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #2ec4e8; }
.header-titel { color: white; font-size: 14px; font-weight: 700; }
.header-sub { color: #a8c4e8; font-size: 11px; margin-top: 2px; }
.maand-nav { background: #1a3a6b; padding: 8px 20px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.nav-pijl { font-size: 16px; color: #2ec4e8; cursor: pointer; user-select: none; }
.nav-pijl:hover { color: white; }
select { background: #1a3a6b; color: white; border: 1px solid #2ec4e8; border-radius: 4px; padding: 4px 8px; font-size: 13px; font-weight: 600; cursor: pointer; }
.stats { display: flex; flex-wrap: wrap; gap: 10px; padding: 12px 16px; background: white; border-bottom: 1px solid #dde6f0; }
.stat { background: #f7fafc; border-radius: 8px; padding: 10px 14px; border-left: 3px solid #ccc; min-width: 130px; }
.stat.tx { border-left-color: #c0392b; }
.stat.tn { border-left-color: #2471a3; }
.stat.tg { border-left-color: #555; }
.stat.rr { border-left-color: #1a7a4a; }
.stat.sq { border-left-color: #e67e00; }
.stat-lbl { font-size: 10px; color: #7a90a8; font-weight: 600; text-transform: uppercase; }
.stat-val { font-size: 20px; font-weight: 700; margin: 2px 0; }
.stat.tx .stat-val { color: #c0392b; }
.stat.tn .stat-val { color: #2471a3; }
.stat.rr .stat-val { color: #1a7a4a; }
.stat.sq .stat-val { color: #e67e00; }
.stat-norm { font-size: 10px; color: #aaa; }
.dp { color: #c0392b; font-weight: 700; }
.dm { color: #2471a3; font-weight: 700; }
.tbl-wrap { padding: 12px 16px; overflow-x: auto; }
table { width: 100%; border-collapse: collapse; background: white; border-radius: 8px; overflow: hidden; box-shadow: 0 1px 4px rgba(0,0,0,0.07); min-width: 500px; }
thead tr { background: #0d2b5e; color: white; }
thead th { padding: 8px 10px; font-size: 11px; font-weight: 600; text-align: center; }
thead th:first-child { text-align: left; }
tbody tr:nth-child(even) { background: #f7f9fc; }
tbody tr:hover { background: #eef3fa; }
tbody tr.vd { background: #fff8e1 !important; font-weight: 600; }
tbody tr.tk { opacity: 0.35; }
td { padding: 5px 10px; border-bottom: 1px solid #eef1f5; text-align: center; white-space: nowrap; }
td:first-child { text-align: left; color: #2a4a70; font-weight: 600; }
td.tx { color: #c0392b; font-weight: 700; }
td.tn { color: #2471a3; font-weight: 700; }
td.rr { color: #1a7a4a; font-weight: 600; }
td.sq { color: #e67e00; font-weight: 600; }
.bar { display: inline-block; height: 9px; border-radius: 2px; vertical-align: middle; margin-right: 4px; }
.brr { background: #1a7a4a; }
.bsq { background: #e67e00; }
tfoot td { background: #0d2b5e; color: white; font-weight: 700; padding: 7px 10px; border: none; text-align: center; }
tfoot td:first-child { text-align: left; }
tfoot td.tx { color: #ffaaaa; }
tfoot td.tn { color: #aaccff; }
tfoot td.rr { color: #88ddaa; }
tfoot td.sq { color: #ffcc66; }
.rng { font-size: 10px; font-weight: 400; opacity: 0.75; margin-left: 3px; }
.status { padding: 40px; text-align: center; color: #7a90a8; font-size: 14px; }
</style>
</head>
<body>
<div class="header">
  <div>
    <div class="header-titel">Ed Aldus WM — Maandoverzicht</div>
    <div class="header-sub">Rotterdam Airport (06344) · KNMI daggegevens</div>
  </div>
  <div id="bw" style="font-size:11px;color:#a8c4e8;"></div>
</div>
<div class="maand-nav">
  <span class="nav-pijl" onclick="nav(-1)">&#9664;</span>
  <select id="sm" onchange="sel()">
    <option value="1">Januari</option><option value="2">Februari</option>
    <option value="3">Maart</option><option value="4">April</option>
    <option value="5">Mei</option><option value="6">Juni</option>
    <option value="7">Juli</option><option value="8">Augustus</option>
    <option value="9">September</option><option value="10">Oktober</option>
    <option value="11">November</option><option value="12">December</option>
  </select>
  <select id="sj" onchange="sel()"></select>
  <span class="nav-pijl" onclick="nav(1)">&#9654;</span>
</div>
<div class="stats" id="st"></div>
<div class="tbl-wrap">
  <div class="status" id="msg">Laden...</div>
  <table id="tbl" style="display:none">
    <thead><tr>
      <th>Dag</th>
      <th style="color:#ffaaaa">TX max</th>
      <th style="color:#aaccff">TN min</th>
      <th>TG gem</th>
      <th style="color:#88ddaa">Neerslag</th>
      <th style="color:#ffcc66">Zon</th>
    </tr></thead>
    <tbody id="tb"></tbody>
    <tfoot id="tf"></tfoot>
  </table>
</div>
<script>
var NM = {
  1:{tx:6.4,tn:1.3,tg:4.0,rr:70.8,sq:69.6},
  2:{tx:7.1,tn:1.1,tg:4.3,rr:65.9,sq:89.9},
  3:{tx:10.3,tn:2.7,tg:6.7,rr:56.5,sq:143.4},
  4:{tx:14.3,tn:4.8,tg:9.7,rr:42.1,sq:192.9},
  5:{tx:17.9,tn:8.1,tg:13.2,rr:55.7,sq:226.2},
  6:{tx:20.6,tn:11.0,tg:16.0,rr:68.6,sq:216.0},
  7:{tx:22.7,tn:13.4,tg:18.2,rr:78.6,sq:221.2},
  8:{tx:22.6,tn:13.2,tg:18.0,rr:91.9,sq:202.5},
  9:{tx:19.3,tn:10.7,tg:15.1,rr:90.3,sq:152.9},
  10:{tx:14.9,tn:7.6,tg:11.4,rr:87.3,sq:115.1},
  11:{tx:10.2,tn:4.4,tg:7.5,rr:87.6,sq:66.8},
  12:{tx:7.0,tn:1.9,tg:4.7,rr:86.2,sq:55.5}
};
var ND=['zo','ma','di','wo','do','vr','za'];
var D={}, J=new Date().getFullYear(), M=new Date().getMonth()+1;

(function(){
  var s=document.getElementById('sj');
  for(var j=J;j>=1957;j--){var o=document.createElement('option');o.value=o.textContent=j;s.appendChild(o);}
})();

function sync(){document.getElementById('sm').value=M;document.getElementById('sj').value=J;}
function sel(){M=+document.getElementById('sm').value;J=+document.getElementById('sj').value;toon();}
function nav(d){M+=d;if(M>12){M=1;J++;}if(M<1){M=12;J--;}sync();toon();}

function idx(){
  var ms=String(M).padStart(2,'0'), ix={}, ks=Object.keys(D);
  for(var i=0;i<ks.length;i++){
    var k=ks[i]; if(k.slice(5,7)!==ms) continue;
    var j=+k.slice(0,4); if(j===J) continue;
    if(!ix[j]) ix[j]={tx:[],tn:[],tg:[],rr:[],sq:[]};
    var o=D[k];
    if(o.tx!=null)ix[j].tx.push(o.tx);
    if(o.tn!=null)ix[j].tn.push(o.tn);
    if(o.tg!=null)ix[j].tg.push(o.tg);
    if(o.rr!=null)ix[j].rr.push(o.rr);
    if(o.sq!=null)ix[j].sq.push(o.sq);
  }
  return ix;
}

function rang(val,veld,hoger,ix){
  if(val==null) return '';
  var v=[], ks=Object.keys(ix);
  for(var i=0;i<ks.length;i++){
    var a=ix[ks[i]][veld]||[];
    if(a.length<25) continue;
    var s=0; for(var j=0;j<a.length;j++) s+=a[j];
    v.push(['tx','tn','tg'].indexOf(veld)>=0 ? s/a.length : s);
  }
  if(!v.length) return '';
  var r=1; for(var i=0;i<v.length;i++){if(hoger&&v[i]>val)r++;if(!hoger&&v[i]<val)r++;}
  return '<span class="rng">#'+r+'/'+(v.length+1)+'</span>';
}

function ds(val,nm){
  if(val==null||nm==null) return '';
  var d=val-nm, s=d>=0?'+':'', c=d>0.05?'dp':d<-0.05?'dm':'';
  return ' <span class="'+c+'">'+s+d.toFixed(1)+'</span>';
}

function f(v){return v!=null?v.toFixed(1):'&#8211;';}

function toon(){
  sync();
  var vd=new Date().toISOString().slice(0,10);
  var n=NM[M]||{}, ad=new Date(J,M,0).getDate(), ms=String(M).padStart(2,'0');
  var tx=[],tn=[],tg=[],rr=[],sq=[];
  var rows=[];
  for(var d=1;d<=ad;d++){
    var k=J+'-'+ms+'-'+String(d).padStart(2,'0');
    var o=D[k]||null;
    rows.push({d:d,k:k,o:o,vd:k===vd,tk:k>vd});
    if(!o) continue;
    if(o.tx!=null)tx.push(o.tx);
    if(o.tn!=null)tn.push(o.tn);
    if(o.tg!=null)tg.push(o.tg);
    if(o.rr!=null)rr.push(o.rr);
    if(o.sq!=null)sq.push(o.sq);
  }
  function gm(a){if(!a.length)return null;var s=0;for(var i=0;i<a.length;i++)s+=a[i];return s/a.length;}
  function sm(a){if(!a.length)return null;var s=0;for(var i=0;i<a.length;i++)s+=a[i];return s;}
  var txG=gm(tx),tnG=gm(tn),tgG=gm(tg),rrS=sm(rr),sqS=sm(sq);

  document.getElementById('st').innerHTML=[
    {c:'tx',l:'Gem. TX',v:txG,e:'°',nm:n.tx},
    {c:'tn',l:'Gem. TN',v:tnG,e:'°',nm:n.tn},
    {c:'tg',l:'Gem. TG',v:tgG,e:'°',nm:n.tg},
    {c:'rr',l:'Neerslag',v:rrS,e:' mm',nm:n.rr},
    {c:'sq',l:'Zonneschijn',v:sqS,e:' u',nm:n.sq}
  ].map(function(s){
    return '<div class="stat '+s.c+'"><div class="stat-lbl">'+s.l+'</div>'+
      '<div class="stat-val">'+(s.v!=null?s.v.toFixed(1)+s.e:'&#8211;')+'</div>'+
      (s.nm!=null?'<div class="stat-norm">Normaal: '+s.nm+s.e+ds(s.v,s.nm)+'</div>':'')+
      '</div>';
  }).join('');

  var mxR=Math.max.apply(null,rr.length?rr:[0.1]);
  var mxS=Math.max.apply(null,sq.length?sq:[0.1]);
  var h='';
  for(var i=0;i<rows.length;i++){
    var r=rows[i], dt=new Date(r.k+'T12:00:00');
    var cl=r.vd?'vd':r.tk?'tk':'';
    var dn=ND[dt.getDay()]+' '+r.d+(r.vd?' &#8592;':'');
    if(!r.o){h+='<tr class="'+cl+'"><td>'+dn+'</td><td>&#8211;</td><td>&#8211;</td><td>&#8211;</td><td>&#8211;</td><td>&#8211;</td></tr>';continue;}
    var o=r.o;
    var rB=o.rr!=null?'<span class="bar brr" style="width:'+Math.min(o.rr/mxR*50,50).toFixed(0)+'px"></span>'+o.rr.toFixed(1):'&#8211;';
    var sB=o.sq!=null?'<span class="bar bsq" style="width:'+Math.min(o.sq/mxS*50,50).toFixed(0)+'px"></span>'+o.sq.toFixed(1)+'u':'&#8211;';
    h+='<tr class="'+cl+'"><td>'+dn+'</td><td class="tx">'+f(o.tx)+'°</td><td class="tn">'+f(o.tn)+'°</td><td>'+(o.tg!=null?o.tg.toFixed(1)+'°':'&#8211;')+'</td><td class="rr">'+rB+'</td><td class="sq">'+sB+'</td></tr>';
  }
  document.getElementById('tb').innerHTML=h;

  var ix=idx();
  document.getElementById('tf').innerHTML='<tr>'+
    '<td>Gem/som ('+tx.length+' dgn)</td>'+
    '<td class="tx">'+(txG!=null?txG.toFixed(1)+'°'+rang(txG,'tx',true,ix):'&#8211;')+'</td>'+
    '<td class="tn">'+(tnG!=null?tnG.toFixed(1)+'°'+rang(tnG,'tn',true,ix):'&#8211;')+'</td>'+
    '<td>'+(tgG!=null?tgG.toFixed(1)+'°'+rang(tgG,'tg',true,ix):'&#8211;')+'</td>'+
    '<td class="rr">'+(rrS!=null?rrS.toFixed(1)+' mm'+rang(rrS,'rr',false,ix):'&#8211;')+'</td>'+
    '<td class="sq">'+(sqS!=null?sqS.toFixed(1)+' u'+rang(sqS,'sq',true,ix):'&#8211;')+'</td>'+
    '</tr>';

  document.getElementById('msg').style.display='none';
  document.getElementById('tbl').style.display='';
}

sync();
fetch('maanddata_344.json?t='+Date.now())
  .then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.json();})
  .then(function(j){D=j.data||{};document.getElementById('bw').textContent='Bijgewerkt: '+(j.bijgewerkt||'');toon();})
  .catch(function(e){document.getElementById('msg').textContent='Fout: '+e.message;});
</script>
</body>
</html>
