  // ── Tick-rail onder slider (responsief, klikbaar) ─────────────────────────
  var tickRail = document.getElementById("tick-rail");
  function renderTickRail() {
    if (!tickRail) return;
    tickRail.innerHTML = "";
    var tijdMeta = (vergelijkModus && modelData["harmonie"]) ? modelData["harmonie"].meta : meta;
    if (!tijdMeta || !tijdMeta.tijden || !aantalUren) return;
    var sliderRect = slider.getBoundingClientRect();
    var wrapRect = tickRail.parentElement.getBoundingClientRect();
    var halfThumb = 8;
    var offsetLeft = sliderRect.left - wrapRect.left + halfThumb;
    var trackWidth = sliderRect.width - halfThumb * 2;
    if (trackWidth <= 0) return;
    tickRail.style.marginLeft = offsetLeft + "px";
    tickRail.style.width = trackWidth + "px";
    var maxLabels = Math.max(3, Math.floor(trackWidth / 55));
    var compactRail = aantalUren > 120 || actiefModel === "ecmwf_om";
    tickRail.classList.toggle("compact", compactRail);
    var kandidaten = [1, 3, 6, 12, 24];
    var stap = 24;
    for (var k = 0; k < kandidaten.length; k++) {
      if ((aantalUren / kandidaten[k]) <= maxLabels) { stap = kandidaten[k]; break; }
    }
    var DAGEN = ["zo","ma","di","wo","do","vr","za"];
    var pad2 = function(n) { return String(n).padStart(2, "0"); };
    var dagKeys = [];
    var seenDag = {};
    for (var diRail = 0; diRail < aantalUren; diRail++) {
      if (!tijdMeta.tijden[diRail]) continue;
      var dRail = new Date(tijdMeta.tijden[diRail]);
      var dagKeyRail = dRail.getFullYear() + "-" + dRail.getMonth() + "-" + dRail.getDate();
      if (!seenDag[dagKeyRail]) {
        seenDag[dagKeyRail] = true;
        dagKeys.push(dagKeyRail);
      }
    }
    var dagLabelStap = compactRail ? Math.max(1, Math.ceil(dagKeys.length / maxLabels)) : 1;
    var vorigeDagKey = "";
    var dagIndex = -1;
    for (var i = 0; i < aantalUren; i++) {
      if (!tijdMeta.tijden[i]) continue;
      var dt = new Date(tijdMeta.tijden[i]);
      var uur = dt.getHours();
      var dagKey = dt.getFullYear() + "-" + dt.getMonth() + "-" + dt.getDate();
      var isNewDay = dagKey !== vorigeDagKey;
      if (isNewDay) {
        vorigeDagKey = dagKey;
        dagIndex++;
      }
      var isMidnight = (uur === 0);
      var toonLabel = false, klasse = "";
      if (compactRail && isNewDay) { toonLabel = dagIndex % dagLabelStap === 0; klasse = "dag"; }
      else if (compactRail) continue;
      else if (isMidnight) { toonLabel = true; klasse = "dag"; }
      else if (stap <= 6) {
        if (uur % stap === 0) { toonLabel = true; klasse = "major"; }
        else if (stap === 3) continue;
        else if (stap === 6 && uur % 3 === 0) { /* minor streepje zonder label */ }
        else continue;
      } else if (stap === 12 && uur === 12) { toonLabel = true; klasse = "major"; }
      else continue;
      var pos = (i / (aantalUren - 1)) * 100;
      var tick = document.createElement("div");
      tick.className = "tick" + (klasse ? " " + klasse : "");
      tick.style.left = pos + "%";
      tick.title = DAGEN[dt.getDay()] + " " + pad2(dt.getDate()) + " " + pad2(uur) + ":00 LT";
      var streep = document.createElement("div");
      streep.className = "streep";
      tick.appendChild(streep);
      if (toonLabel) {
        var lbl = document.createElement("div");
        lbl.className = "label";
        if (isMidnight) lbl.innerHTML = '<span class="dagnaam">' + DAGEN[dt.getDay()] + " " + pad2(dt.getDate()) + "</span>";
        else lbl.textContent = pad2(uur) + "h";
        tick.appendChild(lbl);
      }
      (function(idx) {
        tick.addEventListener("click", function() { stopSpelen(); updateAlle(idx); });
      })(i);
      tickRail.appendChild(tick);
    }
  }

  function leesFilmSettings() {

  function clampFilmIndex(value, fallback) {
    var n = parseInt(value);
    if (!Number.isFinite(n)) n = fallback;
    if (!Number.isFinite(n)) n = 0;
    return Math.max(0, Math.min(aantalUren - 1, n));
  }

  function pasFilmSettingsToe(cur) {
    var saved = leesFilmSettings();
    var startFallback = clampFilmIndex(cur, 0);
    var start = clampFilmIndex(saved.start, startFallback);
    var end = clampFilmIndex(saved.end, Math.min(aantalUren - 1, start + 24));
    if (end < start) end = start;
    filmStart.value = start;
    filmEnd.value = end;

    var fps = parseInt(saved.fps);
    if (Number.isFinite(fps)) {
      var minFps = parseInt(filmFps.min) || 2;
      var maxFps = parseInt(filmFps.max) || 20;
      filmFps.value = Math.max(minFps, Math.min(maxFps, fps));
    }
    if (saved.format && filmFormat.querySelector('option[value="' + saved.format + '"]')) {
      filmFormat.value = saved.format;
    }
    filmFpsVal.textContent = filmFps.value + " fps";

  function pickMimeType(voorkeur) {
    var kandidaten = (voorkeur === "mp4")
      ? ["video/mp4;codecs=avc1.42E01E","video/mp4;codecs=avc1","video/mp4","video/webm;codecs=vp9","video/webm;codecs=vp8","video/webm"]
      : ["video/webm;codecs=vp9","video/webm;codecs=vp8","video/webm","video/mp4;codecs=avc1.42E01E","video/mp4"];
    for (var i = 0; i < kandidaten.length; i++) {
      if (window.MediaRecorder && MediaRecorder.isTypeSupported(kandidaten[i])) return kandidaten[i];
    }
    return null;
  }

  function downloadBlob(blob, ext) {
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    var param = (panelParams && panelParams[0]) ? panelParams[0] : "kaart";
    var naam = actiefModel + "_" + param + "_" + new Date().toISOString().replace(/[:T]/g,"-").slice(0,16) + "." + ext;
    a.href = url; a.download = naam;
    document.body.appendChild(a); a.click();
    setTimeout(function() { URL.revokeObjectURL(url); a.remove(); }, 2000);
    return naam;
  }

  function roundUpMult16(n) { return Math.ceil(n / 16) * 16; } // H.264 macroblocks = 16×16; NAAR BOVEN afronden zodat er niks wegvalt

  // MP4/H.264 via WebCodecs + mp4-muxer — X/Twitter/Instagram compatibel
  async function filmMp4(s0, s1, fps, srcCanvas) {
    if (!window.VideoEncoder || !window.Mp4Muxer) {
      throw new Error("WebCodecs/mp4-muxer niet beschikbaar — gebruik WebM");
    }
    // Scale zodat max-breedte ≤1440
    var MAX = 1440;
    var srcW = srcCanvas.width, srcH = srcCanvas.height;
    var scale = srcW > MAX ? (MAX / srcW) : 1;
    var drawW = Math.round(srcW * scale);
    var drawH = Math.round(srcH * scale);

    // Genereuze witte marges — voorkomt dat rode tijd + titel tegen rand lopen en
    // dat H.264-encoder door macroblock-alignment pixels wegsnijdt of mediaplayers
    // met overscan de tekst croppen.
    var padTop = 48, padBot = 24, padX = 16;
    var W = roundUpMult16(drawW + padX * 2);
    var H = roundUpMult16(drawH + padTop + padBot);

    var capCanvas = document.createElement("canvas");
    capCanvas.width = W; capCanvas.height = H;
    var capCtx = capCanvas.getContext("2d");
    capCtx.fillStyle = "#ffffff";
    capCtx.fillRect(0, 0, W, H);

    // Probeer meerdere H.264 profielen/levels tot er een past bij de frame-afmetingen.
    // Onze frames (tot ~1440×1800) passen pas vanaf level 4.0 — level 3.1 is te klein.
    var kandidaten = [
      "avc1.640028", // High 4.0 (tot 1920×1080) — breed ondersteund sinds 2010
      "avc1.4D0028", // Main 4.0
      "avc1.42002A", // Baseline 4.2
      "avc1.640033", // High 5.1 (tot ~4K) — nieuwere hardware
      "avc1.64001F", // High 3.1 — alleen als frames klein genoeg
      "avc1.42001F"  // Baseline 3.1
    ];
    // Hoge bitrate i.v.m. smooth blauw/grijs gradiënten in wolken — anders block-artefacten.
    // Bij lage fps (≤8) loont het om elk frame een I-frame te maken: grotere file maar
    // geen inter-frame quantisatie-verlies.
    var bitrate = 18000000;
    var codec = null;
    for (var ki = 0; ki < kandidaten.length; ki++) {
      try {
        var sup = await VideoEncoder.isConfigSupported({
          codec: kandidaten[ki], width: W, height: H, bitrate: bitrate, framerate: fps
        });
        if (sup && sup.supported) { codec = kandidaten[ki]; break; }
      } catch (e) { /* volgende kandidaat */ }
    }
    if (!codec) throw new Error("H.264 encoding niet ondersteund (frame " + W + "×" + H + ") — probeer WebM");

    var muxer = new Mp4Muxer.Muxer({
      target: new Mp4Muxer.ArrayBufferTarget(),
      video: { codec: "avc", width: W, height: H, frameRate: fps },
      fastStart: "in-memory"
    });
    var encoder = new VideoEncoder({
      output: function(chunk, meta) { muxer.addVideoChunk(chunk, meta); },
      error: function(e) { console.error("Encoder error:", e); }
    });
    encoder.configure({
      codec: codec, width: W, height: H,
      bitrate: bitrate, framerate: fps,
      bitrateMode: "variable",
      latencyMode: "quality",
      hardwareAcceleration: "prefer-hardware",
      avc: { format: "avc" }
    });
    // Bij lage fps: elk frame keyframe (betere kwaliteit per-frame). Bij hogere fps: elke seconde.
    var keyEveryN = (fps <= 8) ? 1 : fps;

    // Eerste frame pre-renderen
    updateAlle(s0);
    await new Promise(function(r) { setTimeout(r, 400); });

    var frameMs = Math.max(60, Math.round(1000 / fps));
    var totaal = s1 - s0 + 1;
    var frameDur = Math.round(1000000 / fps); // microseconden
    var frameIdx = 0;

    for (var s = s0; s <= s1; s++) {
      if (!filmRecording) break;
      updateAlle(s);
      await new Promise(function(r) { setTimeout(r, frameMs); });
      capCtx.fillStyle = "#ffffff"; capCtx.fillRect(0, 0, W, H);
      capCtx.drawImage(srcCanvas, padX, padTop, drawW, drawH);
      var vf = new VideoFrame(capCanvas, { timestamp: frameIdx * frameDur, duration: frameDur });
      encoder.encode(vf, { keyFrame: (frameIdx % keyEveryN === 0) });
      vf.close();
      frameIdx++;
      filmStatus.textContent = "MP4-encode: frame " + (s - s0 + 1) + " / " + totaal + "…";
    }
    // Hold-frames
    for (var h = 0; h < Math.max(3, Math.round(fps * 0.8)); h++) {
      capCtx.fillStyle = "#ffffff"; capCtx.fillRect(0, 0, W, H);
      capCtx.drawImage(srcCanvas, padX, padTop, drawW, drawH);
      var vfh = new VideoFrame(capCanvas, { timestamp: frameIdx * frameDur, duration: frameDur });
      encoder.encode(vfh); vfh.close(); frameIdx++;
    }

    await encoder.flush();
    muxer.finalize();
    encoder.close();

    return new Blob([muxer.target.buffer], { type: "video/mp4" });
  }

  // WebM via MediaRecorder
  async function filmWebm(s0, s1, fps, srcCanvas) {
    var mime = pickMimeType("webm");
    if (!mime) throw new Error("Geen video-codec beschikbaar");

    var capCanvas = document.createElement("canvas");
    capCanvas.width = srcCanvas.width;
    capCanvas.height = srcCanvas.height;
    var capCtx = capCanvas.getContext("2d");

    updateAlle(s0);
    await new Promise(function(r) { setTimeout(r, 400); });
    capCtx.drawImage(srcCanvas, 0, 0);

    var stream = capCanvas.captureStream(0);
    var track = stream.getVideoTracks()[0];
    var recorder = new MediaRecorder(stream, { mimeType: mime, videoBitsPerSecond: 8000000 });
    var chunks = [];
    recorder.ondataavailable = function(e) { if (e.data && e.data.size > 0) chunks.push(e.data); };
    var klaar = new Promise(function(resolve) { recorder.onstop = resolve; });
    recorder.start(200);
    if (track.requestFrame) track.requestFrame();

    var frameMs = Math.max(60, Math.round(1000 / fps));
    var totaal = s1 - s0 + 1;

    for (var s = s0; s <= s1; s++) {
      if (!filmRecording) break;
      updateAlle(s);
      await new Promise(function(r) { setTimeout(r, frameMs); });
      capCtx.drawImage(srcCanvas, 0, 0);
      if (track.requestFrame) track.requestFrame();
      filmStatus.textContent = "WebM-opname: frame " + (s - s0 + 1) + " / " + totaal + "…";
    }
    for (var h = 0; h < Math.max(3, Math.round(fps * 0.8)); h++) {
      await new Promise(function(r) { setTimeout(r, frameMs); });
      if (track.requestFrame) track.requestFrame();
    }
    recorder.stop();
    await klaar;
    track.stop();
    return new Blob(chunks, { type: mime });
  }

  // 🔥 Zoom op de warmste plek per land (NL/DE/BE) — punt-in-polygoon met landgrenzen
  var LANDNAAM = { NL: "Nederland", DE: "Duitsland", BE: "België" };
  var _grensOK = (typeof NL_GRENS !== "undefined" && typeof BE_GRENS !== "undefined" && typeof LU_GRENS !== "undefined");
  var _bboxCache = {};
  function inRing(ring, x, y) {
    var inside = false;
    for (var i = 0, j = ring.length - 1; i < ring.length; j = i++) {
      var xi = ring[i][0], yi = ring[i][1], xj = ring[j][0], yj = ring[j][1];
      if (((yi > y) !== (yj > y)) && (x < (xj - xi) * (y - yi) / (yj - yi) + xi)) inside = !inside;
    }
    return inside;
  }
  function inAny(rings, x, y) {                 // rings = array van losse ringen (geen gaten)
    for (var i = 0; i < rings.length; i++) { if (inRing(rings[i], x, y)) return true; }
    return false;
  }
  function ringsBbox(code, rings) {
    if (_bboxCache[code]) return _bboxCache[code];
    var b = { x0: Infinity, y0: Infinity, x1: -Infinity, y1: -Infinity };
    rings.forEach(function(r) { r.forEach(function(p) {
      if (p[0] < b.x0) b.x0 = p[0]; if (p[0] > b.x1) b.x1 = p[0];
      if (p[1] < b.y0) b.y0 = p[1]; if (p[1] > b.y1) b.y1 = p[1];
    }); });
    _bboxCache[code] = b; return b;
  }
  // Duitsland heeft geen eigen polygoon → bbox van west/midden-Europa minus NL/BE/LU
  var DE_BBOX = { x0: 5.85, y0: 47.1, x1: 15.25, y1: 55.15 };
  function landBbox(code) {
    if (code === "DE") return DE_BBOX;
    return ringsBbox(code, code === "NL" ? NL_GRENS : BE_GRENS);
  }
  function landTest(code) {
    if (code === "NL") return function(lo, la) { return inAny(NL_GRENS, lo, la); };
    if (code === "BE") return function(lo, la) { return inAny(BE_GRENS, lo, la); };
    return function(lo, la) {                   // DE: in bbox én niet NL/BE/LU
      return !inAny(NL_GRENS, lo, la) && !inAny(BE_GRENS, lo, la) && !inAny(LU_GRENS, lo, la);
    };
  }

  function zoomWarmste(code) {
    var hint = document.getElementById("zoom-hint");
    if (!meta || !meta.parameters || !meta.parameters.temp) { hint.textContent = "temp niet beschikbaar"; return; }
    if (!_grensOK) { hint.textContent = "grensdata mist"; return; }
    hint.textContent = "Warmste plek in " + LANDNAAM[code] + " zoeken…";
    laadParam("temp").then(function(tp) {
      if (!tp || !tp.data) { hint.textContent = "temp niet beschikbaar"; return; }
      var nLat = tp.nLat, nLon = tp.nLon, g = tp.grid || meta.grid;
      var stepIdx = parseInt(slider.value) - 1; if (stepIdx < 0) stepIdx = 0;
      var base = stepIdx * nLat * nLon;
      var test = landTest(code), bb = landBbox(code);
      var maxV = -Infinity, maxI = -1;
      for (var rr = 0; rr < nLat; rr++) {
        var la = g.lat_min + (rr + 0.5) / nLat * (g.lat_max - g.lat_min);
        if (la < bb.y0 || la > bb.y1) continue;
        for (var xx = 0; xx < nLon; xx++) {
          var v = tp.data[base + rr * nLon + xx];
          if (!(v === v) || v <= maxV) continue;          // skip NaN + niet-beter (test pas daarna = goedkoop)
          var lo = g.lon_min + (xx + 0.5) / nLon * (g.lon_max - g.lon_min);
          if (lo < bb.x0 || lo > bb.x1) continue;
          if (!test(lo, la)) continue;
          maxV = v; maxI = rr * nLon + xx;
        }
      }
      if (maxI < 0) { hint.textContent = LANDNAAM[code] + " niet in beeld"; return; }
      var r = Math.floor(maxI / nLon), x = maxI % nLon;
      var cx = (x + 0.5) / nLon, cy = (nLat - 1 - r + 0.5) / nLat;
      var lat = g.lat_min + (r + 0.5) / nLat * (g.lat_max - g.lat_min);
      var lon = g.lon_min + (x + 0.5) / nLon * (g.lon_max - g.lon_min);
      // Rode pin + label (dichtstbijzijnde plaats of landnaam) + temp
      var beste = null, bd = 999;
      for (var pj = 0; pj < PLAATSEN.length; pj++) {
        var dl = PLAATSEN[pj][0] - lat, dn = PLAATSEN[pj][1] - lon;
        var dd = Math.sqrt(dl * dl + dn * dn * 0.5);
        if (dd < bd) { bd = dd; beste = PLAATSEN[pj]; }
      }
      pinPlaats = [lat, lon, (beste && bd < 0.6 ? beste[2] : LANDNAAM[code]) + " " + Math.round(maxV) + "°C"];
      var zoomNiveau = 4;
      for (var pi = 0; pi < panelParams.length; pi++) {
        var zs = getZoom(pi); zs.zoom = zoomNiveau; zs.cx = cx; zs.cy = cy;
      }
      document.querySelectorAll(".zoom-btn").forEach(function(b) {
        b.classList.toggle("actief", parseInt(b.dataset.zoom) === zoomNiveau);
      });
      hint.textContent = "Warmste plek " + LANDNAAM[code] + ": " + Math.round(maxV) + "°C bij " + dichtstbijzijnde(lat, lon);
      updateAlle(stepIdx);
    }).catch(function() { hint.textContent = "temp niet beschikbaar"; });
  }

  // ── Plaats zoeken + rode pin ──
  var zoekInput = document.getElementById("plaats-zoek");
  var suggestBox = document.getElementById("plaats-suggest");

  function zoekPlaatsen(query) {
    if (!query || query.length < 1) return [];
    var q = query.toLowerCase();
    var matches = [];
    for (var i = 0; i < PLAATSEN.length; i++) {
      if (PLAATSEN[i][2].toLowerCase().indexOf(q) >= 0) {
        matches.push(PLAATSEN[i]);
      }
    }
    // Sorteer: begint-met eerst, dan bevat
    matches.sort(function(a, b) {
      var aStart = a[2].toLowerCase().indexOf(q) === 0 ? 0 : 1;
      var bStart = b[2].toLowerCase().indexOf(q) === 0 ? 0 : 1;
      return aStart - bStart || a[2].localeCompare(b[2]);
    });
    return matches.slice(0, 8);
  }

  function gaNaarPlaats(plaats) {
    pinPlaats = plaats;
    zoekInput.value = plaats[2];
    suggestBox.style.display = "none";

    // Bereken positie in 0-1 space
    var latFrac = (plaats[0] - meta.grid.lat_min) / (meta.grid.lat_max - meta.grid.lat_min);
    var lonFrac = (plaats[1] - meta.grid.lon_min) / (meta.grid.lon_max - meta.grid.lon_min);
    var cx = lonFrac, cy = 1 - latFrac;

    // Zoom in naar niveau 5
    var zoomNiveau = 5;
    for (var pi = 0; pi < panelParams.length; pi++) {
      var zs = getZoom(pi);
      zs.zoom = zoomNiveau;
      zs.cx = cx;
      zs.cy = cy;

    document.querySelectorAll(".zoom-btn").forEach(function(b) {
      b.classList.toggle("actief", parseInt(b.dataset.zoom) === zoomNiveau);
    });

  function positioneerSuggestBox() {
    var rect = zoekInput.getBoundingClientRect();
    suggestBox.style.position = "fixed";
    suggestBox.style.top = rect.bottom + 2 + "px";
    suggestBox.style.left = rect.left + "px";
    suggestBox.style.width = Math.max(rect.width, 160) + "px";
    suggestBox.style.right = "auto";
    suggestBox.style.marginTop = "0";
    suggestBox.style.zIndex = "9999";
    suggestBox.style.boxShadow = "0 4px 12px rgba(0,0,0,0.15)";
    suggestBox.style.borderRadius = "6px";
    suggestBox.style.border = "1px solid #dbe4ef";
  }

  function toonSuggesties(matches) {
    suggestBox.innerHTML = "";
    if (matches.length === 0) { suggestBox.style.display = "none"; return; }
    positioneerSuggestBox();
    for (var i = 0; i < matches.length; i++) {
      var div = document.createElement("div");
      div.textContent = matches[i][2];
      div.style.cssText = "padding:6px 10px;cursor:pointer;font-size:12px;border-bottom:1px solid #eee;color:#1a2b40;";
      div.dataset.idx = i;
      div.addEventListener("mouseenter", function() { this.style.background = "#e8f0f8"; });
      div.addEventListener("mouseleave", function() { this.style.background = ""; });
      (function(plaats) {
        div.addEventListener("mousedown", function(e) {
          e.preventDefault();
          gaNaarPlaats(plaats);
        });
      })(matches[i]);
      suggestBox.appendChild(div);
    }
    suggestBox.style.display = "block";
  }

  // Model selector
  document.getElementById("model-select").addEventListener("change", function() {
    var oudeStep = Math.max(0, parseInt(slider.value) - 1);
    var oudeTijd = meta && meta.tijden && meta.tijden[oudeStep] ? new Date(meta.tijden[oudeStep]).getTime() : NaN;
    var doelStep = 0;
    // Verlaat vergelijkmodus bij model-wissel
    if (vergelijkModus) {
      vergelijkModus = false;
      document.getElementById("btn-vergelijk").classList.remove("actief");
    }
    actiefModel = this.value;
    bewaarUiState();
    // Check of we al gecachte data hebben voor dit model
    var cached = modelData[actiefModel];
    if (cached && cached.meta) {
      meta = cached.meta;
      paramCache = cached.paramCache;
    } else {
      paramCache = {};
    }
    statusEl.textContent = "Model wisselen...";
    laadMeta().then(function() {
      addDerivedParams(meta);
      modelData[actiefModel] = { meta: meta, paramCache: paramCache };
      return laadOverlay();
    }).then(function() {
      aantalUren = meta.uren;
      slider.max = aantalUren;
      if (isFinite(oudeTijd) && meta.tijden && meta.tijden.length) {
        var kleinsteVerschil = Infinity;
        for (var ti = 0; ti < meta.tijden.length; ti++) {
          var kandidaatTijd = new Date(meta.tijden[ti]).getTime();
          var verschil = Math.abs(kandidaatTijd - oudeTijd);
          if (isFinite(verschil) && verschil < kleinsteVerschil) {
            kleinsteVerschil = verschil;
            doelStep = ti;
          }
        }
      }
      slider.value = doelStep + 1;
      document.getElementById("hdr-run").textContent = "run: " + meta.run;
      document.getElementById("hdr-update").textContent = "Bijgewerkt: " + meta.bijgewerkt;
      // Dag-knoppen opnieuw bouwen
      var dagDiv = document.getElementById("dag-knoppen");
      dagDiv.innerHTML = '<span class="toolbar-label">Dag:</span>';
      var dagGroep = document.createElement("div");
      dagGroep.className = "btn-groep";
      var nlDag2 = ["zo","ma","di","wo","do","vr","za"]; // kort voor knoppen
      var gezien2 = {};
      for (var di2 = 0; di2 < meta.tijden.length; di2++) {
        var ddt2 = new Date(meta.tijden[di2]);
        var dagKey2 = ddt2.getFullYear() + "-" + ddt2.getMonth() + "-" + ddt2.getDate();
        if (!(dagKey2 in gezien2)) {
          gezien2[dagKey2] = di2;
          var dbtn2 = document.createElement("button");
          dbtn2.className = "btn";
          dbtn2.textContent = nlDag2[ddt2.getDay()] + " " + ddt2.getDate();
          dbtn2.dataset.step = di2;
          dbtn2.addEventListener("click", function() { updateAlle(parseInt(this.dataset.step)); });
          dagGroep.appendChild(dbtn2);
        }
      }
      dagDiv.appendChild(dagGroep);
      statusEl.textContent = "";
      bouwUurSidebar();
      bouwPanels();
      // Laad eerste parameter en render
      return laadRenderParam(panelParams[0]);
    }).then(function() {
      updateAlle(doelStep);
      renderTickRail();
    }).catch(function(e) {
      statusEl.textContent = "Model kon niet laden — probeer Vernieuwen";
      console.error("model wisselen:", e);
    });
  });

  function updateNsomVisibility() {}
  document.querySelectorAll(".snelheid").forEach(function(b){
    b.classList.toggle("actief", parseInt(b.dataset.ms) === speelSnelheid);
    b.addEventListener("click",function(){ document.querySelectorAll(".snelheid").forEach(function(x){x.classList.remove("actief");}); this.classList.add("actief"); speelSnelheid=parseInt(this.dataset.ms); bewaarUiState(); if(speelInterval){stopSpelen();startSpelen();} });
  });

  document.addEventListener("keydown", function(e) {
    var tag = e.target && e.target.tagName ? e.target.tagName.toUpperCase() : "";
    if (tag === "INPUT" || tag === "SELECT" || tag === "TEXTAREA" || tag === "BUTTON" || (e.target && e.target.isContentEditable)) return;
    if(e.key==="ArrowLeft"){e.preventDefault();var s=parseInt(slider.value)-2;if(s<0)s=aantalUren-1;updateAlle(s);}
    else if(e.key==="ArrowRight"){e.preventDefault();var s=parseInt(slider.value);if(s>=aantalUren)s=0;updateAlle(s);}
    else if(e.key===" "){e.preventDefault();if(speelInterval)stopSpelen();else startSpelen();}
    else if(e.key==="1")setLayout(1);
    else if(e.key==="2")setLayout(2);
    else if(e.key==="3")setLayout(3);
  });

  // ═══════════════════════════════════════════════════════════════════════════
  // CROSS-SECTION (grenslaag doorsnede)
  // ═══════════════════════════════════════════════════════════════════════════


  // ═══════════════════════════════════════════════════════════════════════════
  // METEOGRAM (tijdreeks popup)
  // ═══════════════════════════════════════════════════════════════════════════

  var meteoOverlay = document.getElementById("meteogram-overlay");
  var meteoCanvas = document.getElementById("meteogram-canvas");
  var meteoTitel = document.getElementById("meteogram-titel");
  document.getElementById("meteogram-sluit").addEventListener("click", function() {
    meteoOverlay.style.display = "none";
  });
  meteoOverlay.addEventListener("click", function(e) {
    if (e.target === meteoOverlay) meteoOverlay.style.display = "none";
  });

  function toonMeteogram(gx, gy) {
    var gi = gy * meta.grid.n_lon + gx;
    var lat = meta.grid.lat_min + gy * (meta.grid.lat_max - meta.grid.lat_min) / (meta.grid.n_lat - 1);
    var lon = meta.grid.lon_min + gx * (meta.grid.lon_max - meta.grid.lon_min) / (meta.grid.n_lon - 1);

    meteoTitel.textContent = "Meteogram " + dichtstbijzijnde(lat, lon);
    meteoOverlay.style.display = "flex";

    var nSteps = meta.uren;
    var cw2 = 860, ch2 = 500;
    meteoCanvas.width = cw2;
    meteoCanvas.height = ch2;
    var ctx2 = meteoCanvas.getContext("2d");
    ctx2.fillStyle = "white";
    ctx2.fillRect(0, 0, cw2, ch2);

    var ml = 50, mr = 40, mt = 10, mb = 55; // marges
    var pw = cw2 - ml - mr, ph = ch2 - mt - mb;

    // Verzamel data per parameter
    var series = [];

    function addSeries(paramKey, label, kleur, yMin, yMax, fmt, dash, transform) {
      var pd2 = paramCache[paramKey];
      if (!pd2) return;
      var vals = [];
      var nPts = pd2.nLat * pd2.nLon;
      for (var s = 0; s < nSteps; s++) {
        var raw;
        if (pd2.nComp === 1) {
          raw = pd2.data[s * nPts + gi];
        } else {
          var u3 = pd2.data[s * nPts * 2 + gi];
          var v3 = pd2.data[s * nPts * 2 + nPts + gi];
          raw = Math.sqrt(u3*u3 + v3*v3);
        }
        vals.push(transform ? transform(raw) : raw);
      }
      series.push({label:label, kleur:kleur, vals:vals, yMin:yMin, yMax:yMax, fmt:fmt, dash:dash||[]});
    }

    addSeries("temp", "Temp (\u00b0C)", "#cc3300", -5, 35, function(v){return v.toFixed(1);});
    addSeries("rv", "RV (%)", "#0077cc", 0, 100, function(v){return Math.round(v);}, [4,2]);
    addSeries("neerslag", "Neerslag (mm)", "#1a7a4a", 0, null, function(v){return v.toFixed(1);});
    addSeries("wind", "Wind (Bft)", "#5d4037", 0, 12, function(v){return Math.round(v);}, [6,3], msNaarBft);

    // Bepaal y-assen: links = temp, rechts = RV (of auto)
    // Teken alles met eigen schaal

    // X-as: uren
    var xStep = pw / nSteps;

    // Achtergrond dag/nacht
    for (var s2 = 0; s2 < nSteps; s2++) {
      var tstr2 = meta.tijden[s2] || "";
      if (tstr2) {
        var dt2 = new Date(tstr2);
        var hr = dt2.getHours();
        if (hr >= 21 || hr < 6) {
          ctx2.fillStyle = "rgba(0,0,50,0.06)";
          ctx2.fillRect(ml + s2 * xStep, mt, xStep, ph);
        }
      }
    }

    // Y-as links: Temperatuur (-5 tot 35°C)
    var tMin = -5, tMax = 35;
    // Zoek werkelijke temp range
    if (paramCache["temp"]) {
      var tpd3 = paramCache["temp"], nPts3 = tpd3.nLat * tpd3.nLon;
      var tVals = [];
      for (var s9 = 0; s9 < nSteps; s9++) tVals.push(tpd3.data[s9 * nPts3 + gi]);
      tMin = Math.floor(Math.min.apply(null, tVals)) - 2;
      tMax = Math.ceil(Math.max.apply(null, tVals)) + 2;
    }
    // Update temp series range
    for (var si9 = 0; si9 < series.length; si9++) {
      if (series[si9].label.indexOf("Temp") >= 0) { series[si9].yMin = tMin; series[si9].yMax = tMax; }
    }

    // Y-as rechts: RV (0-100%)
    var rvMin = 0, rvMax = 100;

    // Grid horizontaal + Y-as labels
    ctx2.font = "10px Arial";
    for (var g2 = 0; g2 <= 5; g2++) {
      var gy2 = mt + (g2/5) * ph;
      ctx2.strokeStyle = "#eee";
      ctx2.lineWidth = 0.5;
      ctx2.beginPath(); ctx2.moveTo(ml, gy2); ctx2.lineTo(ml+pw, gy2); ctx2.stroke();

      // Links: temp
      var tVal2 = tMax - (g2/5) * (tMax - tMin);
      ctx2.fillStyle = "#cc3300";
      ctx2.textAlign = "right";
      ctx2.fillText(Math.round(tVal2) + "\u00b0", ml - 5, gy2 + 4);

      // Rechts: RV
      var rvVal = rvMax - (g2/5) * (rvMax - rvMin);
      ctx2.fillStyle = "#0077cc";
      ctx2.textAlign = "left";
      ctx2.fillText(Math.round(rvVal) + "%", ml + pw + 5, gy2 + 4);
    }

    // As-lijnen
    ctx2.strokeStyle = "#999";
    ctx2.lineWidth = 1;
    ctx2.beginPath(); ctx2.moveTo(ml, mt); ctx2.lineTo(ml, mt+ph); ctx2.stroke(); // links
    ctx2.beginPath(); ctx2.moveTo(ml+pw, mt); ctx2.lineTo(ml+pw, mt+ph); ctx2.stroke(); // rechts

    // Teken series
    var kleuren = ["#cc3300", "#0077cc", "#1a7a4a", "#5d4037"];
    for (var si = 0; si < series.length; si++) {
      var sr = series[si];
      var vmin = sr.yMin !== null ? sr.yMin : 0;
      var vmax = sr.yMax;
      if (vmax === null) {
        vmax = 0;
        for (var vi = 0; vi < sr.vals.length; vi++) vmax = Math.max(vmax, sr.vals[vi]);
        vmax = Math.max(vmax * 1.2, 1);
      }

      ctx2.strokeStyle = sr.kleur;
      ctx2.lineWidth = 2;
      ctx2.setLineDash(sr.dash);
      ctx2.beginPath();
      for (var s3 = 0; s3 < sr.vals.length; s3++) {
        var vx = ml + (s3 + 0.5) * xStep;
        var vy = mt + ph - ((sr.vals[s3] - vmin) / (vmax - vmin)) * ph;
        vy = Math.max(mt, Math.min(mt + ph, vy));

        // Neerslag als staafjes
        if (sr.label.indexOf("Neerslag") >= 0) {
          ctx2.setLineDash([]);
          ctx2.fillStyle = "rgba(26,122,74,0.5)";
          var barH = ((sr.vals[s3] - vmin) / (vmax - vmin)) * ph;
          ctx2.fillRect(vx - xStep*0.3, mt + ph - barH, xStep*0.6, barH);
        } else {
          if (s3 === 0) ctx2.moveTo(vx, vy);
          else ctx2.lineTo(vx, vy);
        }
      }
      if (sr.label.indexOf("Neerslag") < 0) ctx2.stroke();
      ctx2.setLineDash([]);
    }

    // X-as labels (elke 6 uur)
    ctx2.fillStyle = "#333";
    ctx2.font = "10px Arial";
    ctx2.textAlign = "center";
    for (var s4 = 0; s4 < nSteps; s4 += 6) {
      var vx2 = ml + (s4 + 0.5) * xStep;
      var tstr3 = meta.tijden[s4] || "";
      if (tstr3) {
        var dt3 = new Date(tstr3);
        var dag = ["zo","ma","di","wo","do","vr","za"][dt3.getDay()];
        var uur2 = String(dt3.getHours()).padStart(2,"0") + ":00";
        ctx2.fillText(uur2, vx2, ch2 - mb + 15);
        if (dt3.getHours() === 0 || s4 === 0) {
          ctx2.font = "bold 10px Arial";
          ctx2.fillText(dag + " " + dt3.getDate(), vx2, ch2 - mb + 28);
          ctx2.font = "10px Arial";
        }
      }
      // Verticale lijn
      ctx2.strokeStyle = "#ddd";
      ctx2.lineWidth = 0.5;
      ctx2.beginPath(); ctx2.moveTo(vx2, mt); ctx2.lineTo(vx2, mt+ph); ctx2.stroke();
    }

    // Legenda onderaan
    ctx2.font = "bold 11px Arial";
    var legX = ml;
    for (var si2 = 0; si2 < series.length; si2++) {
      ctx2.fillStyle = series[si2].kleur;
      ctx2.fillRect(legX, ch2 - 18, 12, 12);
      ctx2.fillStyle = "#333";
      ctx2.textAlign = "left";
      ctx2.fillText(series[si2].label, legX + 16, ch2 - 8);
      legX += ctx2.measureText(series[si2].label).width + 30;
    }

    // Huidige tijdstap markeren
    var curStep = parseInt(slider.value) - 1;
    if (curStep >= 0 && curStep < nSteps) {
      var cx = ml + (curStep + 0.5) * xStep;
      ctx2.strokeStyle = "rgba(255,0,0,0.5)";
      ctx2.lineWidth = 2;
      ctx2.setLineDash([4,2]);
      ctx2.beginPath(); ctx2.moveTo(cx, mt); ctx2.lineTo(cx, mt+ph); ctx2.stroke();
      ctx2.setLineDash([]);
    }
  }

  // ═══════════════════════════════════════════════════════════════════════════
  // INIT
  // ═══════════════════════════════════════════════════════════════════════════

  function herbouwDagknoppen() {
    var dagDiv = document.getElementById("dag-knoppen");
    // Verwijder alle knoppen maar bewaar het label
    var bestaande = dagDiv.querySelectorAll("button");
    bestaande.forEach(function(b) { b.remove(); });
    var nlDag = ["zo","ma","di","wo","do","vr","za"];
    var gezien = {};
    for (var di = 0; di < meta.tijden.length; di++) {
      var ddt = new Date(meta.tijden[di]);
      var dagKey = ddt.getFullYear() + "-" + ddt.getMonth() + "-" + ddt.getDate();
      if (!(dagKey in gezien)) {
        gezien[dagKey] = di;
        var dbtn = document.createElement("button");
        dbtn.className = "btn";
        dbtn.textContent = nlDag[ddt.getDay()] + " " + ddt.getDate();
        dbtn.dataset.step = di;
        dbtn.style.fontSize = "12px";
        dbtn.addEventListener("click", function() {
          updateAlle(parseInt(this.dataset.step));
        });
        dagDiv.appendChild(dbtn);
      }
    }
  }

  function herlaadData() {
    // Snapshot oude state: bij netwerk-fout zetten we alles weer terug zodat
    // de gebruiker zijn layout / parameters / zoom niet kwijt is.
    var snap = {
      meta: meta,
      paramCache: paramCache,
      modelData: modelData,
      lsmData: lsmData,
      overlayCache: overlayCache,
    };
    var bewaarLayout = layout;
    var bewaarParams = panelParams.slice();
    var bewaarStep  = parseInt(slider.value) - 1;
    var bewaarZoom  = JSON.parse(JSON.stringify(panelZoom));

    var btn = document.getElementById("btn-herlaad");
    btn.textContent = "↻";
    btn.disabled = true;
    btn.style.opacity = "0.5";
    statusEl.textContent = "Vernieuwen...";

    // Caches NIET vooraf legen — pas wisselen als nieuwe data binnen is.
    Promise.all([laadMeta(), laadOverlay(), laadLSM()]).then(function() {
      // Nieuwe meta is nu actief; param-cache van vorige run weggooien
      // zodat we verse arrays ophalen.
      paramCache = {};
      modelData  = {};
      addDerivedParams(meta);
      modelData[actiefModel] = { meta: meta, paramCache: paramCache };
      aantalUren = meta.uren;
      slider.max = aantalUren;
      document.getElementById("hdr-run").textContent = "run: " + meta.run;
      document.getElementById("hdr-update").textContent = "Bijgewerkt: " + meta.bijgewerkt;
      statusEl.textContent = "";
      herbouwDagknoppen();
      bouwUurSidebar();

      // Alle zichtbare parameters herladen
      var uniekeParams = [];
      bewaarParams.forEach(function(p) { if (uniekeParams.indexOf(p) === -1) uniekeParams.push(p); });
      return Promise.all(uniekeParams.map(function(p) { return laadRenderParam(p).catch(function(){}); }));
    }).then(function() {
      // State herstellen zonder setLayout(1) reset
      layout = bewaarLayout;
      panelParams = bewaarParams;
      panelZoom = bewaarZoom;
      grid.className = "kaart-grid layout-" + bewaarLayout;
      document.body.classList.toggle("scroll-mode", bewaarLayout === 1);
      document.querySelectorAll(".layout-btn").forEach(function(b) {
        b.classList.toggle("actief", parseInt(b.dataset.layout) === bewaarLayout);
      });
      bouwPanels();
      // Slider positie bewaren (max kan veranderd zijn)
      var nieuweMax = parseInt(slider.max);
      slider.value = Math.min(bewaarStep + 1, nieuweMax);
      updateAlle(parseInt(slider.value) - 1);
      renderTickRail();
      btn.textContent = "↻";
      btn.disabled = false;
      btn.style.opacity = "1";
    }).catch(function(e) {
      // Iets ging mis (CORS, netwerk, tijdelijke 404 bij publish-window).
      // Zet alles terug zodat panelen / parameters / zoom intact blijven.
      meta         = snap.meta;
      paramCache   = snap.paramCache;
      modelData    = snap.modelData;
      lsmData      = snap.lsmData;
      overlayCache = snap.overlayCache;
      statusEl.textContent = "Vernieuwen mislukt — probeer het zo opnieuw";
      btn.textContent = "↻";
      btn.disabled = false;
      btn.style.opacity = "1";
      console.error("herlaadData:", e);
    });
  }

  document.getElementById("btn-herlaad").addEventListener("click", herlaadData);

  Promise.all([laadMeta(), laadOverlay(), laadLSM()]).then(function() {
    // Voeg afgeleide parameters toe aan metadata
    addDerivedParams(meta);
    // Sla op in modelData voor vergelijkmodus
    modelData[actiefModel] = { meta: meta, paramCache: paramCache };
    aantalUren = meta.uren;
    slider.max = aantalUren;
    // Run-tijd — staat al in lokale tijd in meta.run
    document.getElementById("hdr-run").textContent = "run: " + meta.run;
    document.getElementById("hdr-update").textContent = "Bijgewerkt: " + meta.bijgewerkt;
    statusEl.textContent = "";

    // Meld de beginstand aan de weerkaartenpagina (facetbalk)
    meldStandAanOuder();

    // Dag-knoppen bouwen
    herbouwDagknoppen();

    // Uur-sidebar bouwen
    bouwUurSidebar();

    // Laad eerste parameter
    return laadRenderParam(panelParams[0]);
  }).then(function() {
    setLayout(layout);
    statusEl.textContent = "";
    renderTickRail();
  }).catch(function(e) {
    statusEl.textContent = "Fout: " + e;
    console.error(e);
  });

})();
</script>
