<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KNMI Guidance – Ed Aldus WM</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; }
body { font-family: "DM Sans", ui-sans-serif, system-ui, sans-serif; background: #f6f8fb; margin: 0; padding: 0; color: #0f172a; font-feature-settings: "ss01","cv11"; }
.header { background: #ffffff; border-bottom: 1px solid #e3e8ef; padding: 12px 24px; }
.header-titel { color: #0f172a; font-size: 15px; font-weight: 700; margin: 0; letter-spacing: -0.01em; }
.header-sub { color: #64748b; font-size: 11px; margin: 3px 0 0; font-family: "DM Mono", ui-monospace, monospace; font-weight: 500; }
.header-sub a { color: #00205b; text-decoration: none; font-weight: 600; }
.header-sub a:hover { text-decoration: underline; }
.content { padding: 20px; max-width: 900px; margin: 0 auto; }

.guidance-kaart { background: white; border: 1px solid #e3e8ef; border-radius: 12px; box-shadow: 0 1px 2px rgba(15,23,42,0.04); padding: 20px 24px; margin-bottom: 16px; }
.guidance-label { display: inline-block; font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; padding: 3px 10px; border-radius: 6px; margin-bottom: 10px; border: 1px solid transparent; }
.label-kort { background: #eff6ff; color: #1e40af; border-color: #dbeafe; }
.label-lang { background: #dcfce7; color: #166534; border-color: #bbf7d0; }
.guidance-titel { font-size: 16px; font-weight: 700; color: #0f172a; margin: 0 0 6px; letter-spacing: -0.01em; }
.guidance-geldig { font-size: 12px; color: #64748b; margin-bottom: 14px; border-bottom: 1px solid #eff3f8; padding-bottom: 10px; font-family: "DM Mono", ui-monospace, monospace; }
.guidance-tekst { font-size: 14px; line-height: 1.7; color: #334155; white-space: pre-wrap; }
.guidance-tekst h3 { font-size: 14px; font-weight: 700; color: #0f172a; margin: 14px 0 4px; }
.guidance-tekst strong { color: #0f172a; }
.guidance-paraaf { font-size: 12px; color: #64748b; margin-top: 14px; padding-top: 10px; border-top: 1px solid #eff3f8; font-style: italic; }
.bron { font-size: 11px; color: #94a3b8; margin-top: 6px; font-family: "DM Mono", ui-monospace, monospace; }
.bron a { color: #00205b; text-decoration: none; font-weight: 600; }
.bron a:hover { text-decoration: underline; }
.bijgewerkt { font-size: 11px; color: #94a3b8; text-align: right; margin-bottom: 16px; font-family: "DM Mono", ui-monospace, monospace; }
.laden { text-align: center; color: #94a3b8; padding: 40px; font-size: 13px; font-family: "DM Mono", ui-monospace, monospace; }

/* ── DARK MODE ── */
[data-theme="dark"] body { background:#0b1220 !important; color:#f1f5f9 !important; }
[data-theme="dark"] .header { background:#111a2e !important; border-color:rgba(255,255,255,0.08) !important; }
[data-theme="dark"] .header-titel { color:#f1f5f9 !important; }
[data-theme="dark"] .header-sub { color:#94a3b8 !important; }
[data-theme="dark"] .header-sub a { color:#2ec4e8 !important; }
[data-theme="dark"] .guidance-kaart { background:#111a2e !important; border-color:rgba(255,255,255,0.08) !important; }
[data-theme="dark"] .label-kort { background:rgba(46,196,232,0.15) !important; color:#7dd3fc !important; border-color:rgba(46,196,232,0.3) !important; }
[data-theme="dark"] .label-lang { background:rgba(34,197,94,0.15) !important; color:#86efac !important; border-color:rgba(34,197,94,0.3) !important; }
[data-theme="dark"] .guidance-titel { color:#f1f5f9 !important; }
[data-theme="dark"] .guidance-geldig { color:#94a3b8 !important; border-color:rgba(255,255,255,0.08) !important; }
[data-theme="dark"] .guidance-tekst { color:#cbd5e1 !important; }
[data-theme="dark"] .guidance-tekst strong,
[data-theme="dark"] .guidance-tekst h3 { color:#f1f5f9 !important; }
[data-theme="dark"] .guidance-paraaf { color:#94a3b8 !important; border-color:rgba(255,255,255,0.08) !important; }
[data-theme="dark"] .bron { color:#64748b !important; }
[data-theme="dark"] .bron a { color:#2ec4e8 !important; }
[data-theme="dark"] .bijgewerkt { color:#64748b !important; }
</style>
<script>
  (function(){
    function apply(t){ document.documentElement.setAttribute("data-theme", t === "dark" ? "dark" : "light"); }
    var saved = "light"; try { saved = localStorage.getItem("weerlab_theme") || "light"; } catch {}
    apply(saved);
    window.addEventListener("storage", function(e){ if (e.key === "weerlab_theme") apply(e.newValue); });
  })();
</script>
</head>
<body>

<div class="header">
  <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;">
    <div>
      <p class="header-titel">📋 Korte en Lange Guidance van het KNMI</p>
      <p class="header-sub">Modelbeoordeling &amp; Meerdaagse verwachting</p>
    </div>
  </div>
</div>

<div class="content">
  <div class="bijgewerkt" id="bijgewerkt">Laden...</div>
  <div id="laden" class="laden">⏳ Guidance ophalen...</div>
  <div id="guidance-inhoud" style="display:none;">

    <!-- KORT: Modelbeoordeling -->
    <div class="guidance-kaart">
      <div class="guidance-label label-kort">⚡ Kort — Modelbeoordeling +48u</div>
      <h2 class="guidance-titel" id="kort-titel"></h2>
      <div class="guidance-geldig" id="kort-geldig"></div>
      <div class="guidance-tekst" id="kort-tekst"></div>
      <div class="guidance-paraaf" id="kort-paraaf"></div>
      <div class="bron">Bron: <a href="https://www.knmi.nl/nederland-nu/weer/waarschuwingen-en-verwachtingen/extra/guidance-modelbeoordeling" target="_blank">KNMI Guidance modelbeoordeling</a> · © KNMI</div>
    </div>

    <!-- LANG: Meerdaagse -->
    <div class="guidance-kaart">
      <div class="guidance-label label-lang">🔭 Lang — Meerdaagse verwachting</div>
      <h2 class="guidance-titel" id="lang-titel"></h2>
      <div class="guidance-geldig" id="lang-geldig"></div>
      <div class="guidance-tekst" id="lang-tekst"></div>
      <div class="guidance-paraaf" id="lang-paraaf"></div>
      <div class="bron">Bron: <a href="https://www.knmi.nl/nederland-nu/weer/waarschuwingen-en-verwachtingen/extra/guidance-meerdaagse" target="_blank">KNMI Guidance meerdaagse</a> · © KNMI</div>
    </div>

  </div>
</div>

<script>
function formatTekst(tekst) {
  // Verwijder overbodige lege regels
  tekst = tekst.replace(/\n{3,}/g, '\n\n').trim();
  // Markdown eerst (zolang \n nog bestaat)
  tekst = tekst.replace(/^#{1,6}\s*(.+)$/gm, '<h3>$1</h3>');
  tekst = tekst.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  // Paragrafen
  tekst = tekst.replace(/\n\n/g, '</p><p>');
  tekst = tekst.replace(/\n/g, ' ');
  tekst = '<p>' + tekst + '</p>';
  tekst = tekst.replace(/<p>\s*<\/p>/g, '');
  tekst = tekst.replace(/<p>(<h3>)/g, '$1');
  tekst = tekst.replace(/(<\/h3>)<\/p>/g, '$1');
  return tekst;
}

fetch('guidance.json?t=' + Date.now())
  .then(r => r.json())
  .then(d => {
    document.getElementById('laden').style.display = 'none';
    document.getElementById('guidance-inhoud').style.display = 'block';

    const bw = d.bijgewerkt ? d.bijgewerkt.substring(0,16).replace('T',' ') : '';
    document.getElementById('bijgewerkt').textContent = 'Bijgewerkt: ' + bw;

    ['kort','lang'].forEach(type => {
      const g = d[type];
      if (!g) return;
      document.getElementById(type+'-titel').textContent = g.titel || '';
      document.getElementById(type+'-geldig').textContent = g.geldig || '';
      document.getElementById(type+'-tekst').innerHTML = formatTekst(g.tekst || '');
      document.getElementById(type+'-paraaf').textContent = g.paraaf || '';
    });
  })
  .catch(e => {
    document.getElementById('laden').textContent = 'Fout bij laden: ' + e.message;
  });
</script>
</body>
</html>
