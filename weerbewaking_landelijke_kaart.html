<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Landelijke weerkaart · Weerlab Kaartenstudio</title>
  <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="./editor-src/landelijke-studio.css?v=20260909-studio1" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { overflow: hidden; background: #0f172a; }
    #root { display: none; }
    #pin-gate {
      position: fixed; inset: 0; z-index: 9999; display: grid; place-items: center;
      padding: 24px; color: #e5eefc; font-family: Inter, system-ui, sans-serif;
      background: radial-gradient(circle at 50% 32%, #18345f 0%, #0f172a 48%, #070b14 100%);
    }
    .pin-card {
      width: min(390px, 100%); padding: 30px; border-radius: 18px; text-align: center;
      background: rgba(15, 23, 42, .94); border: 1px solid rgba(96, 165, 250, .38);
      box-shadow: 0 24px 70px rgba(0, 0, 0, .46);
    }
    .pin-icon { display: grid; place-items: center; width: 60px; height: 60px; margin: 0 auto 20px; border-radius: 16px; background: #19394e; color: #84e0de; }
    .pin-card h1 { font-size: 21px; margin-bottom: 7px; }
    .pin-card p { color: #a9bacb; font-size: 14px; line-height: 1.6; margin-bottom: 22px; }
    .pin-input {
      width: 100%; height: 54px; border-radius: 10px; border: 1px solid #475569;
      background: #111c31; color: #fff; text-align: center; letter-spacing: 12px;
      font: 800 24px/1 Inter, system-ui, sans-serif; outline: none;
    }
    .pin-input:focus { border-color: #60a5fa; box-shadow: 0 0 0 3px rgba(96, 165, 250, .18); }
    .pin-submit {
      width: 100%; height: 46px; margin-top: 12px; border: 0; border-radius: 10px;
      background: #84e0de; color: #073b44; font: 700 14px/1 Inter, system-ui, sans-serif;
      cursor: pointer;
    }
    .pin-submit:hover { background: #a5efed; }
    #pin-error { min-height: 20px; margin-top: 10px; color: #fca5a5; font-size: 12px; }
  </style>
  <script src="./pluim_run_switcher_48ffbf926db6.js" data-editor-mode-aware="true" data-required="temperature_2m,precipitation,wind_speed_10m,cloud_cover,wind_gusts_10m"></script>
  <script type="module" crossorigin src="./landelijke-editor-assets/weerbewaking_landelijke_kaart-pc6L27QC.js?v=20260909-studio1"></script>
</head>
<body>
  <div id="pin-gate">
    <form class="pin-card" id="pin-form">
      <div class="pin-icon"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="10" width="14" height="11" rx="3"/><path d="M8 10V7a4 4 0 0 1 8 0v3m-4 5v2"/></svg></div>
      <h1>Landelijke weerkaart</h1>
      <p>Voer je viercijferige pincode in om de Weerlab Kaartenstudio te openen.</p>
      <input class="pin-input" id="pin-input" type="password" inputmode="numeric" pattern="[0-9]{4}" maxlength="4" autocomplete="one-time-code" aria-label="Pincode" required autofocus />
      <button class="pin-submit" type="submit">Open editor</button>
      <div id="pin-error" role="alert"></div>
    </form>
  </div>
  <div id="root"></div>
  <script>
    (() => {
      const PIN_HASH = 'd7c7673ba8ca7b0f04b1af4df026cbea7fed5b8acf59b27d33ef988c60eff054';
      const SESSION_KEY = 'landelijke_kaart_pin_ok_1965';
      const gate = document.getElementById('pin-gate');
      const root = document.getElementById('root');
      const form = document.getElementById('pin-form');
      const input = document.getElementById('pin-input');
      const error = document.getElementById('pin-error');
      const unlock = () => {
        gate.style.display = 'none';
        root.style.display = 'block';
      };
      try {
        if (sessionStorage.getItem(SESSION_KEY) === '1') unlock();
      } catch (_) {}
      form.addEventListener('submit', async event => {
        event.preventDefault();
        const value = input.value.trim();
        if (!/^\d{4}$/.test(value)) {
          error.textContent = 'Vul vier cijfers in.';
          input.focus();
          return;
        }
        const bytes = new TextEncoder().encode(value);
        const digest = await crypto.subtle.digest('SHA-256', bytes);
        const hash = Array.from(new Uint8Array(digest), byte => byte.toString(16).padStart(2, '0')).join('');
        if (hash === PIN_HASH) {
          try { sessionStorage.setItem(SESSION_KEY, '1'); } catch (_) {}
          error.textContent = '';
          unlock();
        } else {
          error.textContent = 'Onjuiste pincode.';
          input.value = '';
          input.focus();
        }
      });
    })();
  </script>
</body>
</html>
