name = "open-meteo-proxy"
main = "open-meteo-proxy.js"
compatibility_date = "2026-04-10"
account_id = "05da71c7c88b8ce49fbb2c2d0a570416"

# Gebruik een apart subdomein — NIET weerlab.nl/om/* omdat Cloudflare
# Access dat pad afvangt voordat de Worker aan het woord komt. Een custom
# domain maakt automatisch het DNS-record + SSL-cert aan.
routes = [
  { pattern = "om.weerlab.nl", custom_domain = true },
]

# De API-key wordt apart toegevoegd als secret via:
#   wrangler secret put OPEN_METEO_KEY
# (NIET hier in de toml zetten — zou gecommit worden!)
