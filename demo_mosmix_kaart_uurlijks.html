<style>

<script>
// ── Projectie ──
const LON_MIN=3.3, LON_MAX=7.4, LAT_MIN=50.45, LAT_MAX=53.8;
const SVG_W=800, SVG_H=1100;
function lonToX(lon) { return (lon - LON_MIN) / (LON_MAX - LON_MIN) * SVG_W; }
function latToY(lat) { return (1 - (lat - LAT_MIN) / (LAT_MAX - LAT_MIN)) * SVG_H; }

// ── Param-definities ──
// Elke param: eenheid, decimalen, kleurstops [[hex, waarde], ...], optioneel bft/vvConvertm/eenheidFmt
const PARAMS = {
  TTT:  { label:"Temperatuur (°C)", eenheid:"°", decimalen:1,
    kleuren:[["#084594",-5],["#1565c0",-3],["#64b5f6",0],["#a5d6a7",2],["#2e8b57",4],["#388e3c",6],["#43a047",8],["#66bb6a",9],["#7cb342",10],["#8bc34a",11],["#aed581",12],["#c5e17a",13],["#dce775",14],["#f0ef80",15],["#fff176",16],["#ffee58",17],["#fdd835",18],["#fbc02d",19],["#f9a825",20],["#ffa726",21],["#ff8f00",24],["#fb8c00",27],["#ef6c00",30],["#e65100",33],["#d84315",36],["#4a148c",40]] },
  Td:   { label:"Dauwpunt (°C)", eenheid:"°", decimalen:1,
    kleuren:[["#1a3a6b",-10],["#2980b9",-5],["#a8d8ea",0],["#ffffcc",10],["#fed976",15],["#fd8d3c",20]] },
  RV:   { label:"Rel. vochtigheid (%)", eenheid:"%", decimalen:0,
    kleuren:[["#f4511e",20],["#ffa726",40],["#ffee58",60],["#81c784",80],["#42a5f5",100]] },
  FF:   { label:"Windsnelheid (Bft)", eenheid:" Bft", decimalen:0, bft:true,
    kleuren:[["#ffffff",0],["#c8e6c9",6],["#81c784",12],["#4caf50",20],["#ffee58",29],["#ffa726",39],["#ff7043",50],["#e53935",62],["#b71c1c",75],["#7b1fa2",89]] },
  FX1:  { label:"Windstoot (km/u)", eenheid:" km/u", decimalen:0,
    kleuren:[["#ffffff",0],["#c8e6c9",20],["#81c784",35],["#ffee58",50],["#ffa726",65],["#ff7043",80],["#e53935",100],["#b71c1c",120]] },
  RR1c: { label:"Neerslag (mm/u)", eenheid:" mm/u", decimalen:1,
    kleuren:[["#f7fbff",0],["#c6dbef",0.2],["#9ecae1",0.5],["#6baed6",1],["#4292c6",2],["#2171b5",5],["#084594",10],["#4a0080",20]] },
  Neff: { label:"Bewolking totaal (%)", eenheid:"%", decimalen:0,
    kleuren:[["#FFD700",0],["#ffe066",25],["#c8c8c8",50],["#888888",75],["#444444",100]] },
  Nl:   { label:"Lage bewolking (%)", eenheid:"%", decimalen:0,
    kleuren:[["#ffffff",0],["#dde5ef",20],["#b4c9e0",40],["#8ba8d4",60],["#5f85b8",80],["#3a5e92",100]] },
  Nm:   { label:"Middelhoge bewolking (%)", eenheid:"%", decimalen:0,
    kleuren:[["#ffffff",0],["#e6ecf4",20],["#c5d2e2",40],["#9fb4cc",60],["#7690b0",80],["#526e90",100]] },
  Nh:   { label:"Hoge bewolking (%)", eenheid:"%", decimalen:0,
    kleuren:[["#ffffff",0],["#f0f3f8",20],["#dde3ec",40],["#c1c9d6",60],["#a0aabc",80],["#7b8598",100]] },
  VV:   { label:"Zicht (km)", eenheid:" km", decimalen:1, vvConvertm:true,
    kleuren:[["#4a0080",0],["#084594",0.5],["#6baed6",1],["#c6dbef",2],["#ffffcc",5],["#f7fbff",10]] },
};
const PARAM_VOLGORDE = ["TTT","RR1c","FF","FX1","Neff","Nl","Nm","Nh","Td","RV","VV"];

// ── Heatmap (Modified Shepard + Gaussian) ──
const HEATMAP_RES = 4;
const BASEMAP_W = 1200, BASEMAP_H = 1650;
const SHEPARD_POWER = 2.5, SHEPARD_KNN = 8;
const BLUR_SIGMA = 2;
const HEATMAP_ALPHA = 0.55;

let provincies = null;
let landMask = null;

function hexToRgb(hex) { return [parseInt(hex.slice(1,3),16),parseInt(hex.slice(3,5),16),parseInt(hex.slice(5,7),16)]; }
function interpKleur(val, stops) {
  const colors = stops.map(s=>hexToRgb(s[0]));
  const waarden = stops.map(s=>s[1]);
  const v = Math.max(waarden[0], Math.min(waarden[waarden.length-1], val));
  let idx = waarden.length-2;
  for(let i=0;i<waarden.length-1;i++){ if(v<=waarden[i+1]){ idx=i; break; } }
  const f = (v-waarden[idx])/(waarden[idx+1]-waarden[idx]);
  const a=colors[idx], b=colors[idx+1];
  const r=Math.round(a[0]+f*(b[0]-a[0])), g=Math.round(a[1]+f*(b[1]-a[1])), bl=Math.round(a[2]+f*(b[2]-a[2]));
  const lum=(0.299*r+0.587*g+0.114*bl)/255;
  return [`rgb(${r},${g},${bl})`, lum<0.55?"white":"#222"];
}
function kmhNaarBft(kmh){
  const v=[1,5,11,19,28,38,49,61,74,88,102,117];
  for(let b=0;b<v.length;b++) if(kmh<=v[b]) return b; return 12;
}

function bouwBasemap(svg){
  while(svg.firstChild) svg.removeChild(svg.firstChild);
  if(!provincies) return;
  const ringD = (ring) => {
    let d = "";
    ring.forEach(([lon,lat], i) => {
      const x = lonToX(lon), y = latToY(lat);
      d += (i===0?"M":"L") + x.toFixed(1) + " " + y.toFixed(1);
    });
    return d + "Z";
  };
  let d = "";
  for(const feat of provincies.features){
    const g = feat.geometry;
    const polys = g.type==="Polygon" ? [g.coordinates] : g.coordinates;
    for(const poly of polys) for(const ring of poly) d += ringD(ring);
  }
  const p = document.createElementNS("http://www.w3.org/2000/svg","path");
  p.setAttribute("d", d); p.setAttribute("class","basemap-land"); p.setAttribute("fill-rule","evenodd");
  svg.appendChild(p);
}
function tekenBuitengrens(svg){
  if(!provincies) return;
  const ringD = (ring) => {
    let d = "";
    ring.forEach(([lon,lat], i) => {
      const x = lonToX(lon), y = latToY(lat);
      d += (i===0?"M":"L") + x.toFixed(1) + " " + y.toFixed(1);
    });
    return d + "Z";
  };
  let d = "";
  for(const feat of provincies.features){
    const g = feat.geometry;
    const polys = g.type==="Polygon" ? [g.coordinates] : g.coordinates;
    for(const poly of polys) d += ringD(poly[0]);
  }
  const p = document.createElementNS("http://www.w3.org/2000/svg","path");
  p.setAttribute("d", d); p.setAttribute("class","nl-buitengrens");
  svg.appendChild(p);
}
function maakLandMask(){
  if(!provincies) return;
  const c = document.createElement("canvas");
  c.width = BASEMAP_W; c.height = BASEMAP_H;
  const ctx = c.getContext("2d");
  ctx.fillStyle = "#000"; ctx.beginPath();
  for(const feat of provincies.features){
    const g = feat.geometry;
    const polys = g.type==="Polygon" ? [g.coordinates] : g.coordinates;
    for(const poly of polys) for(const ring of poly){
      ring.forEach(([lon,lat], i) => {
        const x = lonToX(lon)/SVG_W * BASEMAP_W;
        const y = latToY(lat)/SVG_H * BASEMAP_H;
        if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
      });
      ctx.closePath();
    }
  }
  ctx.fill("evenodd");
  const px = ctx.getImageData(0,0,BASEMAP_W,BASEMAP_H).data;
  const R = HEATMAP_RES;
  const w = Math.ceil(BASEMAP_W/R), h = Math.ceil(BASEMAP_H/R);
  const data = new Uint8Array(w*h);
  for(let y=0;y<h;y++) for(let x=0;x<w;x++){
    let isLand=false;
    for(let dy=0; dy<R && !isLand; dy++) for(let dx=0; dx<R && !isLand; dx++){
      const sx = Math.min(x*R+dx, BASEMAP_W-1), sy = Math.min(y*R+dy, BASEMAP_H-1);
      if(px[(sy*BASEMAP_W+sx)*4+3] > 0) isLand=true;
    }
    data[y*w+x] = isLand ? 1 : 0;
  }
  landMask = {w, h, data};
}

function shepardVeld(paramData, stations){
  const w=landMask.w, h=landMask.h;
  const punten = [];
  Object.entries(paramData).forEach(([naam, val]) => {
    if(!stations[naam] || val == null) return;
    const [lon, lat] = stations[naam];
    punten.push({x: lonToX(lon)/SVG_W * w, y: latToY(lat)/SVG_H * h, val});
  });
  if(punten.length < 3) return null;
  const N = punten.length, K = Math.min(SHEPARD_KNN, N);
  const veld = new Float32Array(w*h);
  for(let y=0;y<h;y++) for(let x=0;x<w;x++){
    const idx = y*w+x;
    if(!landMask.data[idx]) continue;
    const dArr = new Float64Array(N);
    for(let i=0;i<N;i++){ const dx=x-punten[i].x, dy=y-punten[i].y; dArr[i] = Math.sqrt(dx*dx+dy*dy); }
    const idxs = new Int32Array(N); for(let i=0;i<N;i++) idxs[i]=i;
    for(let k=0;k<K;k++){
      let mi=k;
      for(let j=k+1;j<N;j++) if(dArr[idxs[j]]<dArr[idxs[mi]]) mi=j;
      const t=idxs[k]; idxs[k]=idxs[mi]; idxs[mi]=t;
    }
    const R = dArr[idxs[K-1]] + 1e-6;
    let sumW=0, sumWV=0;
    for(let k=0;k<K;k++){
      const i=idxs[k], d=dArr[i];
      if(d<0.7){ sumWV=punten[i].val; sumW=1; break; }
      const num = (R-d)/(R*d);
      const wi = Math.pow(num, SHEPARD_POWER);
      sumW+=wi; sumWV+=wi*punten[i].val;
    }
    veld[idx] = sumWV/sumW;
  }
  return veld;
}
function blurVeld(veld){
  const sigma = BLUR_SIGMA;
  if(sigma<=0) return veld;
  const w=landMask.w, h=landMask.h, mask=landMask.data;
  const radius = Math.max(1, Math.ceil(sigma*3));
  const kernel = new Float32Array(radius*2+1);
  let ks=0;
  for(let i=-radius;i<=radius;i++){
    const v = Math.exp(-(i*i)/(2*sigma*sigma)); kernel[i+radius]=v; ks+=v;
  }
  for(let i=0;i<kernel.length;i++) kernel[i]/=ks;
  const tmp = new Float32Array(w*h);
  for(let y=0;y<h;y++) for(let x=0;x<w;x++){
    if(!mask[y*w+x]){ tmp[y*w+x]=0; continue; }
    let s=0, ws=0;
    for(let k=-radius;k<=radius;k++){
      const xx=x+k; if(xx<0||xx>=w) continue;
      if(!mask[y*w+xx]) continue;
      const wt=kernel[k+radius]; s+=veld[y*w+xx]*wt; ws+=wt;
    }
    tmp[y*w+x] = ws>0 ? s/ws : veld[y*w+x];
  }
  const out = new Float32Array(w*h);
  for(let y=0;y<h;y++) for(let x=0;x<w;x++){
    if(!mask[y*w+x]){ out[y*w+x]=0; continue; }
    let s=0, ws=0;
    for(let k=-radius;k<=radius;k++){
      const yy=y+k; if(yy<0||yy>=h) continue;
      if(!mask[yy*w+x]) continue;
      const wt=kernel[k+radius]; s+=tmp[yy*w+x]*wt; ws+=wt;
    }
    out[y*w+x] = ws>0 ? s/ws : tmp[y*w+x];
  }
  return out;
}

function tekenHeatmapOpCanvas(hc, veld, param){
  const p = PARAMS[param];
  const w = landMask.w, h = landMask.h;
  hc.width = BASEMAP_W; hc.height = BASEMAP_H;
  const ctx = hc.getContext("2d");
  ctx.clearRect(0, 0, hc.width, hc.height);
  const tmpC = document.createElement("canvas");
  tmpC.width = w; tmpC.height = h;
  const tctx = tmpC.getContext("2d");
  const imgData = tctx.createImageData(w, h);
  const buf = imgData.data;
  for(let i=0;i<w*h;i++){
    if(!landMask.data[i]){ buf[i*4+3]=0; continue; }
    let v = veld[i];
    if(p.bft) v = kmhNaarBft(v);
    if(p.vvConvertm) v = v/1000;
    const [bg] = interpKleur(v, p.kleuren);
    const m = bg.match(/\d+/g);
    buf[i*4]=+m[0]; buf[i*4+1]=+m[1]; buf[i*4+2]=+m[2];
    buf[i*4+3] = Math.round(HEATMAP_ALPHA*255);
  }
  tctx.putImageData(imgData, 0, 0);
  ctx.imageSmoothingEnabled = true;
  ctx.imageSmoothingQuality = "high";
  ctx.drawImage(tmpC, 0, 0, hc.width, hc.height);
}

// ── Data ──
let DATA_NL = null, DATA_BE = null;
let TIJDEN = [];          // gemeenschappelijke tijdlijn (lokaal ISO)
let STATIONS = {};        // {naam: [lon, lat]}
let DATA = {};            // {naam: {param: array (aligned met TIJDEN)}}
let HUIDIG_IDX = 0;
let HUIDIG_PARAM = "TTT";
let PLAY_TIMER = null;
let CACHE = new Map();     // key = param + "|" + idx → veld

function combineerData(nl, be){
  // Gebruik NL-tijden als master
  const t = nl.data[Object.keys(nl.data)[0]].tijden;
  TIJDEN = t;
  STATIONS = {...nl.stations, ...be.stations};
  DATA = {};
  const alle = {...nl.data, ...be.data};
  // Align BE-tijden met NL-tijden (BE kan een offset hebben)
  for (const [naam, series] of Object.entries(alle)){
    const offset = t[0] === series.tijden[0] ? 0 :
      t.findIndex(x => x === series.tijden[0]);
    // Als tijden exact matchen, direct gebruiken
    if (offset === 0 && series.tijden.length === t.length){
      DATA[naam] = series;
    } else {
      // Anders per tijd zoeken (traag maar robuust)
      const nieuw = {tijden: t};
      for (const p of Object.keys(series)){
        if (p === "tijden") continue;
        const arr = new Array(t.length).fill(null);
        const map = new Map();
        series.tijden.forEach((ts, i) => map.set(ts, series[p][i]));
        for (let i=0;i<t.length;i++) arr[i] = map.get(t[i]) ?? null;
        nieuw[p] = arr;
      }
      DATA[naam] = nieuw;
    }
  }
}

function paramDataVoorTijd(param, idx){
  // Retourneert {stationnaam: waarde} voor gegeven tijd-idx
  const out = {};
  for (const [naam, s] of Object.entries(DATA)){
    const v = s[param]?.[idx];
    if (v != null) out[naam] = v;
  }
  return out;
}

function bouwVeld(param, idx){
  const k = param + "|" + idx;
  if (CACHE.has(k)) return CACHE.get(k);
  const pd = paramDataVoorTijd(param, idx);
  let veld = shepardVeld(pd, STATIONS);
  if (veld) veld = blurVeld(veld);
  // Houd cache beperkt (max 60 items ≈ 60 MB)
  if (CACHE.size > 60) {
    const eerste = CACHE.keys().next().value;
    CACHE.delete(eerste);
  }
  CACHE.set(k, veld);
  return veld;
}

// ── Legenda ──
function tekenLegenda(param){
  const p = PARAMS[param];
  document.getElementById("legenda-titel").textContent = p.label;
  const staaf = document.getElementById("legenda-staaf");
  staaf.innerHTML = "";
  p.kleuren.forEach(([kl, w]) => {
    const rij = document.createElement("div");
    rij.className = "legenda-rij";
    const sw = p.bft ? `Bft ${w}` : (w + (typeof w === "number" && param==="RR1c" ? " mm" : (typeof w === "number" && param==="TTT" ? "°" : "")));
    rij.innerHTML = `<div class="kl" style="background:${kl}"></div><span>${sw}</span>`;
    staaf.appendChild(rij);
  });
  document.getElementById("legenda-info").innerHTML = {
    TTT:"Temperatuur op 2 m (uurlijks gemiddeld).",
    Td:"Dauwpunt op 2 m.",
    RV:"Relatieve vochtigheid op 2 m.",
    FF:"Gemiddelde wind op 10 m, omgerekend naar Beaufort.",
    FX1:"Maximale windstoot afgelopen uur.",
    RR1c:"Totale neerslag afgelopen uur (vloeibaar + smeltend sneeuw equivalent).",
    Neff:"Effectieve bewolking — totaaldekking.",
    Nl:"Lage bewolking — onder 2 km.",
    Nm:"Middelhoge bewolking — 2 tot 7 km.",
    Nh:"Hoge bewolking — boven 7 km.",
    VV:"Horizontaal zicht.",
  }[param] || "";
  document.getElementById("param-overlay").textContent = p.label;
}

// ── Stations-overlay ──
function tekenStations(idx, param){
  const svg = document.getElementById("overlay-svg");
  while(svg.firstChild) svg.removeChild(svg.firstChild);
  tekenBuitengrens(svg);
  const p = PARAMS[param];
  for (const [naam, coords] of Object.entries(STATIONS)){
    const val = DATA[naam]?.[param]?.[idx];
    if (val == null) continue;
    const cx = lonToX(coords[0]), cy = latToY(coords[1]);
    if (cx < 0 || cx > SVG_W || cy < 0 || cy > SVG_H) continue;
    let toon = val;
    if (p.bft) toon = kmhNaarBft(val);
    if (p.vvConvertm) toon = val/1000;
    const txt = toon.toFixed(p.decimalen) + (p.eenheid||"");
    const [bg, fg] = interpKleur(toon, p.kleuren);
    // Achtergrond-pil
    const rect = document.createElementNS("http://www.w3.org/2000/svg","rect");
    const w = 48, h = 16;
    rect.setAttribute("x", cx-w/2); rect.setAttribute("y", cy-h/2);
    rect.setAttribute("width", w); rect.setAttribute("height", h);
    rect.setAttribute("rx", 3); rect.setAttribute("fill", bg); rect.setAttribute("stroke", "#fff"); rect.setAttribute("stroke-width", "0.7");
    svg.appendChild(rect);
    const tv = document.createElementNS("http://www.w3.org/2000/svg","text");
    tv.setAttribute("x", cx); tv.setAttribute("y", cy+4);
    tv.setAttribute("class","station-val"); tv.setAttribute("style",`fill:${fg};stroke-width:0`);
    tv.textContent = txt;
    svg.appendChild(tv);
  }
}

// ── Render huidige frame ──
function renderFrame(){
  if (!TIJDEN.length || !landMask) return;
  const param = HUIDIG_PARAM;
  const idx = HUIDIG_IDX;
  const veld = bouwVeld(param, idx);
  if (veld) tekenHeatmapOpCanvas(document.getElementById("heatmap"), veld, param);
  tekenStations(idx, param);

  // Tijd-overlay
  const t = new Date(TIJDEN[idx]);
  const dagNamen = ["Zondag","Maandag","Dinsdag","Woensdag","Donderdag","Vrijdag","Zaterdag"];
  const maanden = ["jan","feb","mrt","apr","mei","jun","jul","aug","sep","okt","nov","dec"];
  document.getElementById("tijd-overlay").innerHTML =
    `${String(t.getHours()).padStart(2,'0')}:00<span class="dagteken" id="dagteken">${dagNamen[t.getDay()]} ${t.getDate()} ${maanden[t.getMonth()]}</span>`;
  document.getElementById("tel").textContent = (idx+1) + " / " + TIJDEN.length;
  document.getElementById("slider").value = idx;
}

// ── Play/pause ──
function setIdx(i){
  HUIDIG_IDX = Math.max(0, Math.min(TIJDEN.length-1, i));
  renderFrame();
}
function play(){
  const btn = document.getElementById("btn-play");
  if (PLAY_TIMER){
    clearInterval(PLAY_TIMER); PLAY_TIMER = null;
    btn.innerHTML = "▶ Afspelen"; btn.classList.add("primary"); return;
  }
  const speed = parseInt(document.getElementById("sel-speed").value, 10);
  btn.innerHTML = "⏸ Pauze"; btn.classList.remove("primary");
  PLAY_TIMER = setInterval(() => {
    if (HUIDIG_IDX >= TIJDEN.length-1){
      clearInterval(PLAY_TIMER); PLAY_TIMER = null;
      btn.innerHTML = "▶ Afspelen"; btn.classList.add("primary");
      return;
    }
    setIdx(HUIDIG_IDX+1);
  }, speed);
}

// ── Init ──
async function init(){
  try {
    const [nl, be, prov] = await Promise.all([
      fetch("mosmix_uurlijks_nl.json?cb="+Date.now()).then(r=>r.json()),
      fetch("mosmix_uurlijks_be.json?cb="+Date.now()).then(r=>r.json()),
      fetch("nl_provincies.geojson").then(r=>r.json()),
    ]);
    DATA_NL = nl; DATA_BE = be; provincies = prov;

    bouwBasemap(document.getElementById("basemap-svg"));
    maakLandMask();
    combineerData(nl, be);

    // Param-dropdown vullen
    const sel = document.getElementById("sel-param");
    sel.innerHTML = PARAM_VOLGORDE.map(p => `<option value="${p}">${PARAMS[p].label}</option>`).join('');
    sel.value = HUIDIG_PARAM;

    // Slider
    const slider = document.getElementById("slider");
    slider.max = TIJDEN.length - 1;

    // Zoek "nu" als startpositie
    const nu = new Date();
    const nuIso = nu.getFullYear()+"-"+String(nu.getMonth()+1).padStart(2,"0")+"-"+String(nu.getDate()).padStart(2,"0")+"T"+String(nu.getHours()).padStart(2,"0")+":00";
    const startIdx = TIJDEN.findIndex(t => t >= nuIso);
    HUIDIG_IDX = startIdx >= 0 ? startIdx : 0;

    // Copyright run-info
    const cr = nl.run ? new Date(nl.run) : null;
    if (cr) {
      const maanden = ["jan","feb","mrt","apr","mei","jun","jul","aug","sep","okt","nov","dec"];
      document.getElementById("cr-run").textContent =
        `MOSMIX-run ${cr.getUTCDate()} ${maanden[cr.getUTCMonth()]} ${String(cr.getUTCHours()).padStart(2,"0")} UTC`;
    }

    tekenLegenda(HUIDIG_PARAM);
    renderFrame();
    document.getElementById("status").style.display = "none";

    // Listeners
    sel.addEventListener("change", e => {
      HUIDIG_PARAM = e.target.value;
      tekenLegenda(HUIDIG_PARAM);
      renderFrame();
    });
    slider.addEventListener("input", e => setIdx(parseInt(e.target.value, 10)));
    document.getElementById("btn-prev").addEventListener("click", () => setIdx(HUIDIG_IDX-1));
    document.getElementById("btn-next").addEventListener("click", () => setIdx(HUIDIG_IDX+1));
    document.getElementById("btn-play").addEventListener("click", play);
    document.getElementById("btn-nu").addEventListener("click", () => {
      const n = new Date();
      const nuIso = n.getFullYear()+"-"+String(n.getMonth()+1).padStart(2,"0")+"-"+String(n.getDate()).padStart(2,"0")+"T"+String(n.getHours()).padStart(2,"0")+":00";
      const i = TIJDEN.findIndex(t => t >= nuIso);
      if (i >= 0) setIdx(i);
    });
    document.getElementById("sel-speed").addEventListener("change", () => {
      if (PLAY_TIMER){ // opnieuw opstarten met nieuwe snelheid
        clearInterval(PLAY_TIMER); PLAY_TIMER = null;
        document.getElementById("btn-play").innerHTML = "▶ Afspelen";
        document.getElementById("btn-play").classList.add("primary");
        play();
      }
    });
    // Keyboard: pijltjes + spatie
    document.addEventListener("keydown", e => {
      if (e.target.tagName === "SELECT" || e.target.tagName === "INPUT") return;
      if (e.key === "ArrowLeft") setIdx(HUIDIG_IDX-1);
      else if (e.key === "ArrowRight") setIdx(HUIDIG_IDX+1);
      else if (e.key === " ") { e.preventDefault(); play(); }
    });
  } catch (e) {
    console.error(e);
    document.getElementById("status").innerHTML = "Kon data niet laden: " + e.message;
  }
}
init();
</script>
