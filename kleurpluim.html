function drawRoundRect(ctx, x, y, w, h, r) {
  const rr = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + rr, y);
  ctx.arcTo(x + w, y, x + w, y + h, rr);
  ctx.arcTo(x + w, y + h, x, y + h, rr);
  ctx.arcTo(x, y + h, x, y, rr);
  ctx.arcTo(x, y, x + w, y, rr);
  ctx.closePath();
}

function drawRoundedChartImage(ctx, img, x, y, w, h) {
  ctx.save();
  ctx.shadowColor = 'rgba(0,0,0,0.24)';
  ctx.shadowBlur = 20;
  ctx.shadowOffsetY = 4;
  drawRoundRect(ctx, x, y, w, h, 8);
  ctx.fillStyle = 'rgba(255,255,255,0.07)';
  ctx.fill();
  ctx.restore();

  ctx.save();
  drawRoundRect(ctx, x, y, w, h, 8);
  ctx.clip();
  ctx.drawImage(img, x, y, w, h);
  ctx.restore();

  drawRoundRect(ctx, x, y, w, h, 8);
  ctx.strokeStyle = 'rgba(255,255,255,0.16)';
  ctx.lineWidth = 1;
  ctx.stroke();
}

function drawChipRow(ctx, chips, x, y, maxW) {
  let cx = x;
  let cy = y;
  const h = 30;
  ctx.font = '800 17px Inter, sans-serif';
  chips.forEach(chip => {
    const w = Math.min(maxW, Math.ceil(ctx.measureText(chip).width + 28));
    if (cx > x && cx + w > x + maxW) {
      cx = x;
      cy += h + 8;
    }
    drawRoundRect(ctx, cx, cy, w, h, 15);
    ctx.fillStyle = 'rgba(255,255,255,0.16)';
    ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.25)';
    ctx.lineWidth = 1;
    ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,0.92)';
    ctx.fillText(chip, cx + 14, cy + 21);
    cx += w + 8;
  });
  return cy + h;
}

function drawWrappedPngText(ctx, text, x, y, maxW, lineH, maxLines = 3) {
  const words = String(text || '').split(/\s+/).filter(Boolean);
  const lines = [];
  let line = '';
  words.forEach(word => {
    const test = line ? `${line} ${word}` : word;
    if (line && ctx.measureText(test).width > maxW) {
      lines.push(line);
      line = word;
    } else {
      line = test;
    }
  });
  if (line) lines.push(line);
  const visible = lines.slice(0, maxLines);
  visible.forEach((txt, idx) => ctx.fillText(txt, x, y + idx * lineH));
  return y + Math.max(1, visible.length) * lineH;
}

function measureThunderPngCard(card, maxW) {
  if (!card) return 0;
  const pad = 16;
  const contentW = Math.max(220, maxW - pad * 2 - 58);
  const tileGap = 8;
  const minTileW = 76;
  const cols = Math.max(1, Math.min(card.days.length, Math.floor((contentW + tileGap) / (minTileW + tileGap))));
  const rows = Math.ceil(card.days.length / cols);
  return pad + 26 + 12 + rows * 48 + Math.max(0, rows - 1) * tileGap + 12 + 38 + pad;
}

function drawThunderPngCard(ctx, card, x, y, w) {
  if (!card) return y;
  const h = measureThunderPngCard(card, w);
  const pad = 16;
  const bolt = 46;
  const gap = 14;
  drawRoundRect(ctx, x, y, w, h, 10);
  ctx.fillStyle = 'rgba(34,24,42,0.44)';
  ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,0.22)';
  ctx.lineWidth = 1;
  ctx.stroke();

  drawRoundRect(ctx, x + pad, y + pad, bolt, bolt, 8);
  ctx.fillStyle = '#f3b342';
  ctx.fill();
  ctx.fillStyle = '#2d1c08';
  ctx.font = '900 30px Inter, sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('⚡', x + pad + bolt / 2, y + pad + 33);
  ctx.textAlign = 'left';

  const contentX = x + pad + bolt + gap;
  const contentW = w - pad * 2 - bolt - gap;
  ctx.fillStyle = 'white';
  ctx.font = '900 22px Inter, sans-serif';
  ctx.fillText(card.title, contentX, y + pad + 20);
  ctx.fillStyle = 'rgba(255,255,255,0.70)';
  ctx.font = '800 16px Inter, sans-serif';
  ctx.textAlign = 'right';
  ctx.fillText(card.bestLabel, x + w - pad, y + pad + 20);
  ctx.textAlign = 'left';

  const tileGap = 8;
  const cols = Math.max(1, Math.min(card.days.length, Math.floor((contentW + tileGap) / (76 + tileGap))));
  const tileW = (contentW - tileGap * Math.max(0, cols - 1)) / cols;
  const tileH = 48;
  let ty = y + pad + 38;
  card.days.forEach((day, idx) => {
    const col = idx % cols;
    const row = Math.floor(idx / cols);
    const tx = contentX + col * (tileW + tileGap);
    const tileY = ty + row * (tileH + tileGap);
    drawRoundRect(ctx, tx, tileY, tileW, tileH, 7);
    ctx.fillStyle = day.fill;
    ctx.fill();
    ctx.strokeStyle = day.stroke;
    ctx.lineWidth = 1;
    ctx.stroke();
    ctx.fillStyle = day.text;
    ctx.font = '900 11px Inter, sans-serif';
    ctx.fillText(day.label, tx + 7, tileY + 15);
    ctx.font = '900 20px Inter, sans-serif';
    ctx.fillText(`${day.chance}%`, tx + 7, tileY + 38);
  });

  const rows = Math.ceil(card.days.length / cols);
  ctx.fillStyle = 'rgba(255,255,255,0.70)';
  ctx.font = '800 14px Inter, sans-serif';
  drawWrappedPngText(ctx, card.basis, contentX, ty + rows * tileH + Math.max(0, rows - 1) * tileGap + 22, contentW, 18, 2);
  return y + h;
}

function svgToImage(svg, width = 820, height = 290) {
  let source = new XMLSerializer().serializeToString(svg);
  if (!/^<svg[^>]+xmlns=/.test(source)) {
    source = source.replace('<svg', '<svg xmlns="http://www.w3.org/2000/svg"');
  }
  if (!/^<svg[^>]+width=/.test(source)) {
    source = source.replace('<svg', `<svg width="${width}" height="${height}"`);
  }
  const blob = new Blob([source], { type: 'image/svg+xml;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const img = new Image();
  return new Promise((resolve, reject) => {
    img.onload = () => {
      URL.revokeObjectURL(url);
      resolve(img);
    };
    img.onerror = () => {
      URL.revokeObjectURL(url);
      reject(new Error('PNG kon grafiek niet lezen'));
    };
    img.src = url;
  });
}

function slugTekst(value) {
  return String(value || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '')
    .replace(/[^a-z0-9]+/g, '_').replace(/^_+|_+$/g, '') || 'plaats';
}

function extraTekst() {

}

function displayStationNaam() {

function shortDateFromIso(iso) {

function drawPngHeader(ctx, title, station, x, y, maxW) {
  let titleSize = 64;
  let stationSize = 46;
  while (titleSize > 42) {
    ctx.font = `900 ${Math.round(titleSize)}px Inter, sans-serif`;
    const titleW = ctx.measureText(title).width;
    ctx.font = `500 ${Math.round(stationSize)}px Inter, sans-serif`;
    const stationW = ctx.measureText(station).width;
    if (titleW + 30 + stationW <= maxW) break;
    titleSize -= 2;
    stationSize -= 1.5;
  }

  ctx.fillStyle = 'white';
  ctx.font = `900 ${Math.round(titleSize)}px Inter, sans-serif`;
  ctx.fillText(title, x, y);
  const titleW = ctx.measureText(title).width;
  ctx.font = `500 ${Math.round(stationSize)}px Inter, sans-serif`;
  ctx.fillStyle = 'rgba(255,255,255,0.84)';
  ctx.fillText(station, x + titleW + 30, y);
}

function drawLegendLine(ctx, legends, x, y, maxW) {
  ctx.fillStyle = 'rgba(255,255,255,0.76)';
  ctx.font = '800 17px Inter, sans-serif';
  let lx = x;
  let ly = y;
  legends.forEach(label => {
    const text = `• ${label}`;
    const tw = ctx.measureText(text).width + 26;
    if (lx > x && lx + tw > x + maxW) {
      lx = x;
      ly += 28;
    }
    if (tw <= maxW) {
      ctx.fillText(text, lx, ly);
      lx += tw;
    }
  });
  return ly;
}

function downloadBlob(blob, filename) {
  if (!blob) throw new Error('PNG kon niet worden gemaakt');
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
}

const ZIP_ENCODER = new TextEncoder();
let zipCrcTable = null;

function getZipCrcTable() {
  if (zipCrcTable) return zipCrcTable;
  zipCrcTable = new Uint32Array(256);
  for (let n = 0; n < 256; n++) {
    let c = n;
    for (let k = 0; k < 8; k++) c = (c & 1) ? (0xedb88320 ^ (c >>> 1)) : (c >>> 1);
    zipCrcTable[n] = c >>> 0;
  }
  return zipCrcTable;
}

function crc32(bytes) {
  const table = getZipCrcTable();
  let c = 0xffffffff;
  for (const b of bytes) c = table[(c ^ b) & 0xff] ^ (c >>> 8);
  return (c ^ 0xffffffff) >>> 0;
}

function zipDateTime(date = new Date()) {
  const time = (date.getHours() << 11) | (date.getMinutes() << 5) | Math.floor(date.getSeconds() / 2);
  const dosDate = ((date.getFullYear() - 1980) << 9) | ((date.getMonth() + 1) << 5) | date.getDate();
  return { time, date: dosDate };
}

async function makeZip(entries) {
  const chunks = [];
  const central = [];
  let offset = 0;
  const stamp = zipDateTime();

  for (const entry of entries) {
    const nameBytes = ZIP_ENCODER.encode(entry.path.replace(/^\/+/, ''));
    const data = new Uint8Array(await entry.blob.arrayBuffer());
    const crc = crc32(data);
    const local = new Uint8Array(30 + nameBytes.length);
    const localView = new DataView(local.buffer);
    localView.setUint32(0, 0x04034b50, true);
    localView.setUint16(4, 20, true);
    localView.setUint16(6, 0x0800, true);
    localView.setUint16(8, 0, true);
    localView.setUint16(10, stamp.time, true);
    localView.setUint16(12, stamp.date, true);
    localView.setUint32(14, crc, true);
    localView.setUint32(18, data.length, true);
    localView.setUint32(22, data.length, true);
    localView.setUint16(26, nameBytes.length, true);
    local.set(nameBytes, 30);
    chunks.push(local, data);
    central.push({ nameBytes, crc, size: data.length, offset });
    offset += local.length + data.length;
  }

  const centralStart = offset;
  for (const entry of central) {
    const header = new Uint8Array(46 + entry.nameBytes.length);
    const view = new DataView(header.buffer);
    view.setUint32(0, 0x02014b50, true);
    view.setUint16(4, 20, true);
    view.setUint16(6, 20, true);
    view.setUint16(8, 0x0800, true);
    view.setUint16(10, 0, true);
    view.setUint16(12, stamp.time, true);
    view.setUint16(14, stamp.date, true);
    view.setUint32(16, entry.crc, true);
    view.setUint32(20, entry.size, true);
    view.setUint32(24, entry.size, true);
    view.setUint16(28, entry.nameBytes.length, true);
    view.setUint32(42, entry.offset, true);
    header.set(entry.nameBytes, 46);
    chunks.push(header);
    offset += header.length;
  }

  const centralSize = offset - centralStart;
  const end = new Uint8Array(22);
  const endView = new DataView(end.buffer);
  endView.setUint32(0, 0x06054b50, true);
  endView.setUint16(8, central.length, true);
  endView.setUint16(10, central.length, true);
  endView.setUint32(12, centralSize, true);
  endView.setUint32(16, centralStart, true);
  chunks.push(end);
  return new Blob(chunks, { type: 'application/zip' });
}

async function renderSinglePngBlob({ cfg, svg, chips, legends, status, thunderCard }) {
  const scale = 2;
  const W = 1400;
  const margin = 64;
  const headerH = 152;
  const chartW = W - margin * 2 - 36;
  const chartH = Math.round(chartW * 350 / 820);
  const thunderH = thunderCard ? measureThunderPngCard(thunderCard, W - margin * 2) + 18 : 0;
  const cardH = chartH + 206 + thunderH;
  const footerH = 70;
  const H = headerH + cardH + footerH;
  const canvas = document.createElement('canvas');
  canvas.width = W * scale;
  canvas.height = H * scale;
  const ctx = canvas.getContext('2d');
  ctx.scale(scale, scale);

  ctx.fillStyle = '#8a8070';
  ctx.fillRect(0, 0, W, H);
  drawRoundRect(ctx, 28, 28, W - 56, H - 56, 14);
  ctx.fillStyle = '#b0a488';
  ctx.fill();

  drawPngHeader(ctx, cfg.title, displayStationNaam(), margin, 92, W - margin * 2);
  ctx.fillStyle = 'rgba(255,255,255,0.36)';
  ctx.fillRect(margin, 118, W - margin * 2, 2);

  const cardY = headerH;
  drawRoundRect(ctx, margin - 18, cardY, W - margin * 2 + 36, cardH, 10);
  ctx.fillStyle = 'rgba(255,255,255,0.08)';
  ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,0.18)';
  ctx.lineWidth = 1;
  ctx.stroke();

  ctx.fillStyle = 'rgba(255,255,255,0.68)';
  ctx.font = '800 17px Inter, sans-serif';
  ctx.textAlign = 'right';
  ctx.fillText(status || '', W - margin, cardY + 36);
  ctx.textAlign = 'left';

  const chipBottom = drawChipRow(ctx, chips, margin, cardY + 58, W - margin * 2);
  const chartY = Math.max(cardY + 100, chipBottom + 14);
  const img = await svgToImage(svg, 820, 350);
  drawRoundedChartImage(ctx, img, margin, chartY, chartW, chartH);

  let detailY = chartY + chartH + 28;
  if (thunderCard) {
    detailY = drawThunderPngCard(ctx, thunderCard, margin, detailY, W - margin * 2) + 22;
  }
  drawLegendLine(ctx, legends, margin, detailY + 6, W - margin * 2);

  ctx.fillStyle = 'rgba(255,255,255,0.56)';
  ctx.font = '800 16px Inter, sans-serif';
  ctx.fillText('Ed Aldus WM · Data: ECMWF Open Data / Open-Meteo · IFS ENS · native modelstappen', margin, H - 36);

  return new Promise(resolve => canvas.toBlob(resolve, 'image/png', 0.95));
}

function buildDetachedSingleChart(param, cfg, times, stats) {
  const svg = document.createElementNS(NS, 'svg');
  const summaryEl = document.createElement('div');
  const legendEl = document.createElement('div');
  drawChart(svg, times, stats, cfg, {
    height: 350,
    summaryEl,
    legendEl,
    clipId: `downloadClip-${param}-${Date.now()}`,
  });
  return {
    svg,
    chips: Array.from(summaryEl.querySelectorAll('.chip')).map(chip => chip.textContent || ''),
    legends: Array.from(legendEl.querySelectorAll('.leg-item')).map(el => el.textContent.replace(/\s+/g, ' ').trim()),
    thunderCard: makeThunderCardData(sliceForSelectedRange(times, stats).stats, cfg),
  };
}

      const chips = Array.from(card.querySelectorAll('.chip')).map(chip => chip.textContent || '');
      const chipBottom = drawChipRow(ctx, chips, margin, y + 54, W - margin * 2);

      drawRoundedChartImage(ctx, img, margin, chartY, chartW, chartH);

      const legends = Array.from(card.querySelectorAll('.leg-item')).map(el => el.textContent.replace(/\s+/g, ' ').trim());
      drawLegendLine(ctx, legends, margin, chartY + chartH + 34, W - margin * 2);
    }

    ctx.fillStyle = 'rgba(255,255,255,0.56)';
    ctx.font = '800 16px Inter, sans-serif';
    ctx.fillText('Ed Aldus WM · Data: ECMWF Open Data / Open-Meteo · IFS ENS · native modelstappen', margin, H - 36);

    const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/png', 0.95));
    const url = blob ? URL.createObjectURL(blob) : canvas.toDataURL('image/png');
    const a = document.createElement('a');

async function downloadAllPngs() {
  const status = document.getElementById('laadstatus');
  setDownloadButtons({
    mainDisabled: true,
    mainLabel: 'Even wachten...',
    allDisabled: true,
    allLabel: 'ZIP maken...',
  });
  try {
    const entries = [];
    const plaats = slugTekst(displayStationNaam());
    status.textContent = '8 pluimen laden...';
    const [stable] = await Promise.all([
      loadStableEnsBatch(
        (runMeta, batchForce, batchFresh) => settleWithConcurrency(
          ALL_DOWNLOAD_PARAMS,
          4,
          param => loadStatsForParam(param, runMeta, batchForce, batchFresh),
        ),
      ),
      showDailyTxRange ? fetchMosmixTx(currentStation.lat, currentStation.lon) : Promise.resolve(),
    ]);
    const results = stable.value;
    let unavailable = 0;
    for (let i = 0; i < ALL_DOWNLOAD_PARAMS.length; i++) {
      const param = ALL_DOWNLOAD_PARAMS[i];
      const settled = results[i];
      if (!settled || settled.status !== 'fulfilled') {
        unavailable++;
        continue;
      }
      const result = settled.value;
      const { cfg, times, stats } = result;
      status.textContent = `${cfg.title} PNG maken...`;
      setDownloadButtons({
        mainDisabled: true,
        mainLabel: 'Even wachten...',
        allDisabled: true,
        allLabel: `${entries.length + 1}/${ALL_DOWNLOAD_PARAMS.length} in ZIP...`,
      });
      const { svg, chips, legends, thunderCard } = buildDetachedSingleChart(param, cfg, times, stats);
      const statusText = statusTextForResult(result);
      const blob = await renderSinglePngBlob({ cfg, svg, chips, legends, status: statusText, thunderCard });
      const filename = downloadName(param);
      entries.push({ path: filename, blob });
    }
    if (!entries.length) throw new Error('Geen enkele kleurpluim is in deze opgeslagen run beschikbaar.');
    const zipBlob = await makeZip(entries);
    downloadBlob(zipBlob, `${plaats}_pluimen.zip`);
    status.textContent = unavailable
      ? `ZIP opgeslagen met ${entries.length} correcte PNG's · ${unavailable} onderdelen ontbreken in deze oudere run`
      : `ZIP opgeslagen met ${entries.length} PNG's`;
  } catch (e) {
    console.error(e);
    status.textContent = 'ZIP maken mislukt: ' + e.message;
  } finally {
    syncDownloadButton(false);
  }
}

async function loadMulti(seq, runMeta, force = false, edgeFresh = false) {
  const status = document.getElementById('laadstatus');
  document.getElementById('pluim-titel').textContent = '8-pluim';
  syncStationLabel();
  document.getElementById('single-view').hidden = true;
  document.getElementById('multi-view').hidden = false;
  renderMultiShell();
  syncDownloadButton(true, 'Laden...');
  status.textContent = '8 pluimen laden...';

  const results = [];
  let completed = 0;
  let failed = 0;
  const mosmixPromise = showDailyTxRange
    ? fetchMosmixTx(currentStation.lat, currentStation.lon)
    : Promise.resolve();

  const updateMultiProgress = () => {
    if (seq !== loadSeq) return;
    const suffix = failed ? ` · ${failed} niet geladen` : '';
    status.textContent = `${completed}/${MULTI_PARAMS.length} pluimen geladen${suffix}`;
  };

  try {
    await Promise.all(MULTI_PARAMS.map(async param => {
      try {
        if (param === 'temp') await mosmixPromise;
        const result = await loadStatsForParam(param, runMeta, force, edgeFresh);
        if (seq !== loadSeq) return;
        results.push(result);
      } catch (e) {
        if (seq !== loadSeq) return;
        failed++;
        const cardStatus = document.getElementById(`multi-status-${param}`);
        if (cardStatus) cardStatus.textContent = e.message || 'Niet beschikbaar';
        const chart = document.getElementById(`multi-chart-${param}`);
        if (chart) chart.innerHTML = `<text x="410" y="132" text-anchor="middle" fill="rgba(255,255,255,.92)" font-size="18" font-weight="800">Niet beschikbaar in deze opgeslagen run</text><text x="410" y="164" text-anchor="middle" fill="rgba(255,255,255,.65)" font-size="13">Geen waarden uit een andere ECMWF-cyclus ingevuld</text>`;
        console.error(e);
      } finally {
        if (seq === loadSeq) {
          completed++;
          updateMultiProgress();
        }
      }
    }));
    if (seq !== loadSeq) return;
    if (!results.length) throw new Error('Geen kleurpluimen beschikbaar in deze opgeslagen run');
    results.failedCount = failed;
    return results;
  } catch (e) {
    if (seq !== loadSeq) return;
    status.textContent = 'Fout bij laden: ' + e.message;
    document.querySelectorAll('.multi-status').forEach(el => { el.textContent = 'Niet geladen'; });
    syncDownloadButton(true, 'Download PNG');
    console.error(e);
    throw e;
  }
}

function renderMultiResults(seq, results) {
  if (seq !== loadSeq) return;
  results.forEach(result => {
    const { param, cfg, times, stats } = result;
    drawChart(
      document.getElementById(`multi-chart-${param}`),
      times,
      stats,
      cfg,
      {
        height: 290,
        summaryEl: document.getElementById(`multi-summary-${param}`),
        legendEl: document.getElementById(`multi-legend-${param}`),
        clipId: `multiClip-${param}`,
      }
    );
    document.getElementById(`multi-status-${param}`).textContent = statusTextForResult(result, 'leden');
  });
  const memberCount = Math.max(...results.map(r => r.keys.length));
  const spatialMax = Math.max(...results.map(r => r.spatialPoints || 1));
  const spatialText = spatialMax > 1 ? ` · tot ${spatialMax} omgevingspunten` : '';
  const failed = Number(results.failedCount) || 0;
  document.getElementById('laadstatus').textContent = failed
    ? `${plumeRunShort} · ${results.length} van 8 kleurpluimen exact geladen · ${failed} ontbreken in deze opgeslagen run`
    : `${plumeRunShort} · ${plumeCoverageShort} · ${memberCount} ensemble-leden${spatialText} · selectie ${selectedRangeDays()} dagen · native modelstappen · 8-pluim onder elkaar`;
  setDownloadButtons({
    mainDisabled: false,
    mainLabel: 'Download PNG',
    allDisabled: false,
    allLabel: failed ? `Download ${results.length} beschikbare als ZIP` : 'Download alle 8 als ZIP',
  });
}

let showDailyTxRange = false;
let mosmixDailyCache = null;   // ruwe JSON van mosmix_nl.json
let mosmixHourlyCache = null;  // fallback: mosmix_uurlijks_nl.json
let mosmixDailyTx = {};        // { 'YYYY-MM-DD': Tx_waarde }
let mosmixStationName = '';

function mosmixStatusInfo() {
  if (!mosmixStationName) return '';
  const dagen = Object.keys(mosmixDailyTx).length || 10;
  return ` · MOS/MIX: ${mosmixStationName} (${Math.min(10, dagen)} dagen)`;
}

async function fetchMosmixTx(lat, lon) {
  // Alleen voor NL-gebied
  if (lat < 50.4 || lat > 54.0 || lon < 2.5 || lon > 8.0) {
    mosmixDailyTx = {};
    mosmixStationName = '';
    return;
  }
  try {
    if (!mosmixDailyCache) {
      const r = await fetch('mosmix_nl.json');
      if (!r.ok) throw new Error('MOSMIX niet beschikbaar');
      mosmixDailyCache = await r.json();
    }
    const coords = mosmixDailyCache.stations;  // { naam: [lon, lat] }
    if (!coords) { mosmixDailyTx = {}; mosmixStationName = ''; return; }

    let best = null, bestDist = Infinity;
    for (const [naam, [slon, slat]] of Object.entries(coords)) {
      const d = afstandKm(lat, lon, slat, slon);
      if (d < bestDist) { bestDist = d; best = naam; }
    }
    mosmixStationName = best || '';

    const byDay = {};
    for (const day of mosmixDailyCache.dagen || []) {
      const v = mosmixDailyCache.data?.[day]?.TX?.[best];
      if (Number.isFinite(v)) byDay[day] = v;
    }
    if (Object.keys(byDay).length) {
      mosmixDailyTx = byDay;
      return;
    }

    if (!mosmixHourlyCache) {
      const r = await fetch('https://data.weerlab.nl/mosmix_uurlijks_nl.json?t=' + Date.now());
      if (!r.ok) throw new Error('MOSMIX uurlijk niet beschikbaar');
      mosmixHourlyCache = await r.json();
    }
    const st = mosmixHourlyCache.data?.[best];
    if (!st) { mosmixDailyTx = {}; return; }
    const tijden = st.tijden || [], ttt = st.TTT || [];
    tijden.forEach((t, i) => {
      const day = t.slice(0, 10);
      const hour = parseInt(t.slice(11, 13), 10);
      if (hour < 6 || hour > 20) return;
      const v = ttt[i];
      if (Number.isFinite(v) && (byDay[day] === undefined || v > byDay[day])) byDay[day] = v;
    });
    mosmixDailyTx = byDay;
  } catch {
    mosmixDailyTx = {};
    mosmixStationName = '';
  }
}

function toggleDailyTxRange() {
  showDailyTxRange = !showDailyTxRange;
  const btn = document.getElementById('tgl-tx-dag');
  if (btn) {
    btn.classList.toggle('actief', showDailyTxRange);
    btn.querySelector('.tgl-lbl').textContent = showDailyTxRange ? 'MOS/MIX Tx aan' : 'MOS/MIX Tx';
  }
  loadCurrent();
}

async function loadCurrent(force = false, edgeFresh = false) {
  const seq = ++loadSeq;
  if (currentParam === 'multi') {
    lastSingleChartData = null;
    try {
      const stable = await loadStableEnsBatch(
        (runMeta, batchForce, batchFresh) => loadMulti(seq, runMeta, batchForce, batchFresh),
        {
          force,
          edgeFresh,
          onCycleChange: () => {
            if (seq === loadSeq) document.getElementById('laadstatus').textContent = 'Nieuwe ECMWF ENS-cyclus gevonden · volledige 8-pluim herladen...';
          },
        }
      );
      if (seq !== loadSeq || !stable.value) return;
      renderMultiResults(seq, stable.value);
    } catch (e) {
      if (seq !== loadSeq) return;
      document.getElementById('laadstatus').textContent = 'Fout bij laden: ' + e.message;
      syncDownloadButton(true, 'Download PNG');
    }
    return;
  }

  const cfg = PARAMS[currentParam];
  const status = document.getElementById('laadstatus');
  document.getElementById('pluim-titel').textContent = cfg.title;
  syncStationLabel();
  document.getElementById('single-view').hidden = false;
  document.getElementById('multi-view').hidden = true;
  document.getElementById('tx-toggle-row').hidden = currentParam !== 'temp';
  syncDownloadButton(true, 'Laden...');
  status.textContent = 'Laden...';

  try {
    const [stable] = await Promise.all([
      loadStableEnsBatch(
        (runMeta, batchForce, batchFresh) => loadStatsForParam(currentParam, runMeta, batchForce, batchFresh),
        {
          force,
          edgeFresh,
          onCycleChange: () => {
            if (seq === loadSeq) status.textContent = 'Nieuwe ECMWF ENS-cyclus gevonden · pluim volledig herladen...';
          },
        }
      ),
      currentParam === 'temp' ? fetchMosmixTx(currentStation.lat, currentStation.lon) : Promise.resolve(),
    ]);
    if (seq !== loadSeq) return;
    const result = stable.value;
    const { times, stats } = result;
    lastSingleChartData = { param: currentParam, times, stats };
    drawChart(document.getElementById('chart'), times, stats, cfg, {
      thunderCardEl: document.getElementById('thunder-card'),
    });
    const mosInfo = currentParam === 'temp' && showDailyTxRange ? mosmixStatusInfo() : '';
    status.textContent = `${statusTextForResult(result)}${mosInfo}`;
    syncDownloadButton(false);
  } catch (e) {
    if (seq !== loadSeq) return;
    document.getElementById('samenvatting').innerHTML = '';
    document.getElementById('legenda').innerHTML = '';
    lastSingleChartData = null;
    renderThunderCard([], {}, document.getElementById('thunder-card'));
    status.textContent = /niet beschikbaar in deze opgeslagen run/i.test(e.message)
      ? e.message
      : 'Fout bij laden: ' + e.message;
    syncDownloadButton(true, 'Download PNG');
    console.error(e);
  }
}

function setParam(param) {
  if (param !== 'multi' && !PARAMS[param]) return;
  currentParam = param;
  document.querySelectorAll('.param-btn').forEach(btn => btn.classList.toggle('actief', btn.dataset.param === param));
  loadCurrent(isFastUpdateWindow());
}

function setStation(lat, lon, naam) {
  currentStation = { lat: Number(lat), lon: Number(lon), naam };
  document.getElementById('zoek-input').value = naam;
  sluitZoek();
  loadCurrent(isFastUpdateWindow());
}

function sluitZoek() {
  document.getElementById('zoek-resultaten').style.display = 'none';
}

async function zoekPlaats(neemEerste = false) {
  const q = document.getElementById('zoek-input').value.trim();
  const res = document.getElementById('zoek-resultaten');
  if (q.length < 2) return;
  res.innerHTML = '<div class="zoek-item">Zoeken...</div>';
  res.style.display = 'block';
  try {
    const ctrl = new AbortController();
    setTimeout(() => ctrl.abort(), 10000);
    const url = `https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(q)}&format=json&limit=6&accept-language=nl`;
    const r = await fetch(url, { headers: { 'Accept-Language': 'nl' }, signal: ctrl.signal });
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    const data = await r.json();
    if (!data.length) {
      res.innerHTML = '<div class="zoek-item">Niets gevonden</div>';
      return;
    }
    if (neemEerste) {
      const d = data[0];
      setStation(d.lat, d.lon, d.display_name.split(',')[0].trim());
      return;
    }
    res.innerHTML = '';
    data.forEach(d => {
      const naam = d.display_name.split(',')[0].trim();
      const extra = d.display_name.split(',').slice(1, 3).join(',').trim();
      const div = document.createElement('div');
      div.className = 'zoek-item';
      div.innerHTML = `<strong>${escHtml(naam)}</strong> <span>${escHtml(extra)}</span>`;
      div.addEventListener('click', () => setStation(d.lat, d.lon, naam));
      res.appendChild(div);
    });
  } catch (e) {
    res.innerHTML = '<div class="zoek-item">Zoekfout</div>';
  }
}

document.querySelectorAll('.param-btn').forEach(btn => {
  btn.addEventListener('click', () => setParam(btn.dataset.param));
});

document.getElementById('zoek-input').addEventListener('input', () => {
  clearTimeout(zoekTimer);
  zoekTimer = setTimeout(() => zoekPlaats(false), 350);
});

document.getElementById('zoek-input').addEventListener('keydown', e => {
  if (e.key === 'Enter') {
    e.preventDefault();
    zoekPlaats(true);
  }
  if (e.key === 'Escape') sluitZoek();
});

document.getElementById('zoek-btn').addEventListener('click', () => zoekPlaats(true));
document.getElementById('extra-input').addEventListener('input', syncStationLabel);
document.getElementById('download-4pluim').addEventListener('click', downloadCurrentPng);
document.getElementById('download-all-pluimen').addEventListener('click', downloadAllPngs);
bindDateCommit(['range-start', 'range-end'], () => {
  selectedRange();
  syncHighlightBounds();
  loadCurrent();
});
bindDateCommit(['highlight-start', 'highlight-end'], id => {
  syncHighlightBounds();
  syncHighlightPeriod(id);
  loadCurrent();
});
document.getElementById('highlight-color').addEventListener('change', () => {
  loadCurrent();
});
document.getElementById('highlight-clear').addEventListener('click', () => {
  document.getElementById('highlight-start').value = '';
  document.getElementById('highlight-end').value = '';
  loadCurrent();
});

document.addEventListener('click', e => {
  if (!e.target.closest('.zoek-wrap')) sluitZoek();
});

initRangeInputs();
document.querySelectorAll('.param-btn').forEach(btn => btn.classList.toggle('actief', btn.dataset.param === currentParam));
function scheduleAutoRefresh() {
  if (autoRefreshTimer) clearTimeout(autoRefreshTimer);
  const delay = isFastUpdateWindow() ? FAST_UPDATE_INTERVAL_MS : NORMAL_UPDATE_INTERVAL_MS;
  autoRefreshTimer = setTimeout(async () => {
    const force = isFastUpdateWindow();
    if (!document.hidden) {
      try { await loadCurrent(force); } catch (_) {}
    }
    scheduleAutoRefresh();
  }, delay);
}

document.addEventListener('visibilitychange', () => {
  if (!document.hidden && isFastUpdateWindow()) loadCurrent(true);
});

loadCurrent(isFastUpdateWindow());
scheduleAutoRefresh();
</script>
