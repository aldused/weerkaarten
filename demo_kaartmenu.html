<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mockup · Kaartmenu weerlab</title>
<link rel="stylesheet" href="weerlab_design_tokens.css">
<style>
  * { box-sizing: border-box; }
  body { margin:0; font: var(--wl-text-body-md); color: var(--wl-color-text); background: var(--wl-color-background); }
  header.mk { background: var(--wl-color-primary); color:#fff; padding: 14px 18px; }
  header.mk h1 { font: var(--wl-text-headline-md); margin:0 0 4px; }
  header.mk p { margin:0; font: var(--wl-text-body-sm); opacity:.8; }
  .varbar { display:flex; gap:8px; padding:12px 18px; background: var(--wl-color-surface); border-bottom:1px solid var(--wl-color-border); flex-wrap:wrap; align-items:center; }
  .varbar b { font: var(--wl-text-label-md); margin-right:4px; }
  .vbtn { font: var(--wl-text-label-md); padding:7px 12px; border:1px solid var(--wl-color-border-strong); background:#fff; border-radius: var(--wl-radius-full); cursor:pointer; }
  .vbtn.on { background: var(--wl-color-primary); border-color: var(--wl-color-primary); color:#fff; }
  .wrap { display:flex; min-height: 560px; }
  /* sidebar */
  .side { width: 268px; flex:0 0 268px; background: var(--wl-color-surface); border-right:1px solid var(--wl-color-border); padding:10px 0 20px; }
  .side .grp { padding: 12px 14px 4px; font: var(--wl-text-label-md); color: var(--wl-color-text-muted); text-transform:uppercase; letter-spacing:.04em; font-size:11px; }
  .side .grp small { display:block; text-transform:none; letter-spacing:0; font-weight:400; color: var(--wl-color-text-soft); font-size:11px; margin-top:2px; }
  .side .it { display:flex; align-items:center; gap:8px; padding:7px 14px; cursor:pointer; font-size:13.5px; border-left:3px solid transparent; }
  .side .it:hover { background: var(--wl-color-primary-soft); }
  .side .it.on { background: var(--wl-color-primary-soft); border-left-color: var(--wl-color-primary); font-weight:600; }
  .side .it .ic { width:18px; text-align:center; opacity:.75; }
  .side .it .badge { margin-left:auto; font: var(--wl-text-data-sm); color: var(--wl-color-text-soft); }
  .side:empty { display:none; }
  .side hr { border:0; border-top:1px solid var(--wl-color-border); margin:10px 14px; }
  /* main */
  .main { flex:1; padding:0; display:flex; flex-direction:column; min-width:0; }
  .facets { background: var(--wl-color-surface); border-bottom:1px solid var(--wl-color-border); padding:10px 14px; display:flex; gap:18px; flex-wrap:wrap; align-items:flex-start; }
  .fgrp { min-width:0; }
  .fgrp > label { display:block; font-size:10.5px; text-transform:uppercase; letter-spacing:.05em; color: var(--wl-color-text-soft); margin-bottom:5px; font-weight:600; }
  .chips { display:flex; gap:5px; flex-wrap:wrap; }
  .chip { font-size:12.5px; padding:5px 10px; border-radius: var(--wl-radius-full); border:1px solid var(--wl-color-border-strong); background:#fff; cursor:pointer; white-space:nowrap; }
  .chip.on { background: var(--wl-color-primary); border-color: var(--wl-color-primary); color:#fff; font-weight:600; }
  .chip.dim { opacity:.38; cursor:not-allowed; }
  select.f { font-size:13px; padding:5px 8px; border:1px solid var(--wl-color-border-strong); border-radius: var(--wl-radius-sm); background:#fff; max-width:230px; }
  .kruim { padding:8px 14px; font: var(--wl-text-body-sm); color: var(--wl-color-text-muted); background: var(--wl-color-background-soft); border-bottom:1px solid var(--wl-color-border); }
  .kruim b { color: var(--wl-color-text); }
  .stage { flex:1; padding:14px; }
  .kaart { height:100%; min-height:330px; border-radius: var(--wl-radius-lg); border:1px solid var(--wl-color-border);
           background: linear-gradient(140deg,#dbeafe,#bfdbfe 40%,#a7f3d0 78%,#fde68a); display:flex; align-items:center; justify-content:center; text-align:center; box-shadow: var(--wl-shadow-1); }
  .kaart div { background: rgba(255,255,255,.86); border-radius: var(--wl-radius-md); padding:16px 22px; }
  .kaart .t { font: var(--wl-text-headline-md); }
  .kaart .s { font: var(--wl-text-data-sm); color: var(--wl-color-text-muted); margin-top:6px; }
  .kaart.vier { display:grid; grid-template-columns:1fr 1fr; grid-template-rows:1fr 1fr; gap:6px; padding:6px; background:#eef2f7; }
  .kaart.vier > div { background: linear-gradient(140deg,#dbeafe,#a7f3d0); display:flex; align-items:center; justify-content:center; border-radius: var(--wl-radius-sm); font: var(--wl-text-data-sm); }
  .tijdbalk { padding:10px 14px; background: var(--wl-color-surface); border-top:1px solid var(--wl-color-border); display:flex; gap:10px; align-items:center; }
  .tijdbalk input { flex:1; }
  .tijdbalk .lbl { font: var(--wl-text-data-sm); min-width:150px; }
  .note { padding:14px 18px; font: var(--wl-text-body-sm); color: var(--wl-color-text-muted); background: var(--wl-color-surface); border-top:1px solid var(--wl-color-border); }
  .note b { color: var(--wl-color-text); }
  .oud .it { border-left-color:transparent; }
  .oud .waarschuw { margin:10px 14px; padding:8px 10px; border-radius: var(--wl-radius-sm); background:#fff5f5; border:1px solid #fecaca; font-size:12px; color:#991b1b; }
  @media (max-width: 820px) {
    .wrap { flex-direction:column; }
    .side { width:100%; flex:none; border-right:0; border-bottom:1px solid var(--wl-color-border); }
    .facets { overflow-x:auto; }
  }
</style>
</head>
<body>
<header class="mk">
  <h1>Kaartmenu · mockup met voorbeelddata</h1>
  <p>Drie varianten naast elkaar. Klikbaar; geen echte data.</p>
</header>

<div class="varbar">
  <b>Variant:</b>
  <button class="vbtn" data-v="oud" onclick="zetVariant('oud')">0 · Huidig (13 platte items)</button>
  <button class="vbtn on" data-v="a" onclick="zetVariant('a')">A · Gegroepeerd op vraag</button>
  <button class="vbtn" data-v="b" onclick="zetVariant('b')">B · Facetbalk (1 viewer)</button>
  <button class="vbtn" data-v="c" onclick="zetVariant('c')">C · Hybride (aanbevolen)</button>
</div>

<div class="wrap">
  <div class="side" id="side"></div>
  <div class="main">
    <div class="facets" id="facets"></div>
    <div class="kruim" id="kruim"></div>
    <div class="stage"><div class="kaart" id="kaart"><div><div class="t" id="kt">—</div><div class="s" id="ks"></div></div></div></div>
    <div class="tijdbalk">
      <span class="lbl" id="tlabel">di 18 aug · 12 UTC (+0 u)</span>
      <input type="range" min="0" max="144" step="3" value="0" oninput="zetUur(this.value)">
      <span class="lbl" style="min-width:auto">run 18 aug 06z</span>
    </div>
  </div>
</div>

<div class="note" id="uitleg"></div>

<script>
const S = { model:'harmonie', gebied:'nl', veld:'significant', layout:'1', uur:0, variant:'a', oudItem:'Significant kaart' };

const MODELLEN = [
  { k:'harmonie', l:'HARMONIE', g:'Hoge resolutie (NL/Benelux)', gebied:['nl','benelux'] },
  { k:'icond2',   l:'ICON-D2',  g:'Hoge resolutie (NL/Benelux)', gebied:['nl','benelux'] },
  { k:'ruc',      l:'ICON-D2-RUC', g:'Hoge resolutie (NL/Benelux)', gebied:['nl','benelux'] },
  { k:'arome',    l:'AROME',    g:'Hoge resolutie (NL/Benelux)', gebied:['nl','benelux'] },
  { k:'ecmwf',    l:'ECMWF HRES', g:'Globaal (Europa, 10 dagen)', gebied:['nl','benelux','europa'] },
  { k:'gfs',      l:'GFS',      g:'Globaal (Europa, 10 dagen)', gebied:['europa'] },
  { k:'iconeu',   l:'ICON-EU',  g:'Globaal (Europa, 10 dagen)', gebied:['europa'] },
  { k:'eps',      l:'ECMWF ENS', g:'Ensemble (onzekerheid)', gebied:['europa'] },
];
const VELDEN = [
  { g:'Overzicht', items:[
    ['significant','Significant weer',['harmonie','icond2','ruc','arome']],
    ['overview','Overzichtskaart',['ecmwf','gfs','iconeu']],
    ['fronten','Fronten & druk',['ecmwf']],
  ]},
  { g:'Temperatuur', items:[
    ['t2m','Temp 2 m',['harmonie','icond2','ruc','arome','ecmwf','gfs','iconeu']],
    ['t850','Temp 850 hPa',['ecmwf','gfs','iconeu']],
    ['convectietemp','Convectietemperatuur',['harmonie']],
  ]},
  { g:'Neerslag', items:[
    ['precip','Neerslag / som 24 u',['harmonie','icond2','ruc','arome','ecmwf','gfs','iconeu']],
    ['sneeuw','Sneeuwdek',['ecmwf','gfs','iconeu']],
  ]},
  { g:'Wind & druk', items:[
    ['wind','Wind 10 m',['harmonie','icond2','ruc','arome','ecmwf','gfs','iconeu']],
    ['z500','Geopot. 500 hPa',['ecmwf','gfs','iconeu']],
  ]},
  { g:'Bewolking', items:[
    ['bewolking','Wolkenverdeling',['harmonie','icond2']],
  ]},
  { g:'Onweer & instabiliteit', items:[
    ['cape','CAPE',['harmonie','icond2','ecmwf','gfs','iconeu']],
  ]},
  { g:'Onzekerheid & extremen', items:[
    ['efi','Extreme Forecast Index',['eps']],
    ['clusters','Clusters 500 hPa',['eps']],
    ['spread','Spread / pluimkaart',['eps']],
  ]},
];
const GEBIEDEN = [['nl','Nederland'],['benelux','Benelux'],['europa','Europa']];
const LAYOUTS = [['1','1 kaart'],['4','4-luik'],['9','9 panelen']];

const NAV_A = [
  { g:'Vandaag & morgen', s:'hoge resolutie, 0–48 u', items:[
    ['Significant weer','▦','HARMONIE · ICON-D2 · RUC · AROME'],
    ['Modelkaarten Nederland','▤','4 modellen × 8 velden'],
    ['Wolkenverdeling','☁','HARMONIE · ICON-D2'],
    ['Convectietemperatuur','🌡','HARMONIE'],
  ]},
  { g:'De komende 10 dagen', s:'Europa, globale modellen', items:[
    ['Modelkaarten Europa','🗺','ECMWF · GFS · ICON-EU'],
    ['Fronten & druk','〰','ECMWF · 10 dagen'],
    ['Druk 9-panel','▩','ECMWF'],
  ]},
  { g:'Hoe zeker is het?', s:'ensemble', items:[
    ['Extreme Forecast Index','⚠','ECMWF ENS'],
    ['Clusters','◈','ECMWF ENS'],
  ]},
  { g:'Vergelijken', s:'meerdere modellen naast elkaar', items:[
    ['4-luik hoge resolutie','⊞','HARMONIE · ICON-D2 · RUC · AROME'],
    ['4-luik globale modellen','⊞','ECMWF · GFS · ICON-EU · UKMO'],
    ['4-luik significant','⊞','4 modellen synchroon'],
  ]},
];
const NAV_OUD = ['Hoge resolutie 4-luik','Globale modellen 4-luik','Significant 4-luik','Significant kaart','Hoge resolutie modellen','Bewolking HARMONIE','Bewolking ICON-D2','Convectietemperatuur','ECMWF HRES 10-daags','ECMWF 9 panel','ECMWF Fronten · 10 dagen','ECMWF Extreme forecast index','ECMWF Clusters'];

function zetKaart(cls, html){ const k=document.getElementById('kaart'); k.className=cls; k.style.gridTemplateColumns=''; k.style.gridTemplateRows=''; k.innerHTML=html; }
function paneel(t,s2){ return `<div><div class="t">${t}</div><div class="s">${s2||''}</div></div>`; }
function veldLabel(k){ for (const g of VELDEN) for (const it of g.items) if (it[0]===k) return it[1]; return k; }
function modelLabel(k){ return (MODELLEN.find(m=>m.k===k)||{}).l || k; }
function veldModellen(k){ for (const g of VELDEN) for (const it of g.items) if (it[0]===k) return it[2]; return []; }

function zetVariant(v){ S.variant=v; document.querySelectorAll('.vbtn').forEach(b=>b.classList.toggle('on', b.dataset.v===v)); teken(); }
function zetUur(u){ S.uur=+u; tekenTijd(); }
function tekenTijd(){
  const d=new Date(Date.UTC(2026,7,18,6+ +S.uur));
  const dag=['zo','ma','di','wo','do','vr','za'][d.getUTCDay()];
  document.getElementById('tlabel').textContent = `${dag} ${d.getUTCDate()} aug · ${String(d.getUTCHours()).padStart(2,'0')} UTC (+${S.uur} u)`;
}

function teken(){
  const side=document.getElementById('side'), fac=document.getElementById('facets');
  side.className='side'; side.innerHTML=''; fac.innerHTML='';

  if (S.variant==='oud'){
    side.classList.add('oud');
    side.innerHTML = '<div class="grp">Weerkaarten</div>' +
      NAV_OUD.map(n=>`<div class="it ${n===S.oudItem?'on':''}" onclick="S.oudItem='${n}';teken()"><span class="ic">·</span>${n}</div>`).join('') +
      '<div class="waarschuw">4 assen door elkaar: layout (4-luik), model (ECMWF), veld (bewolking) en dracht (10-daags) staan als gelijke items. “ECMWF HRES 10-daags” opent in werkelijkheid de multi-model Europa-viewer.</div>';
    document.getElementById('kruim').innerHTML = `Weerkaarten › <b>${S.oudItem}</b>`;
    zetKaart('kaart', paneel(S.oudItem, 'elke keuze = andere pagina, met eigen knoppen erin'));
  }

  if (S.variant==='a' || S.variant==='c'){
    NAV_A.forEach(g=>{
      side.insertAdjacentHTML('beforeend', `<div class="grp">${g.g}<small>${g.s}</small></div>`);
      g.items.forEach(it=>{
        const on = it[0]===S.navA;
        side.insertAdjacentHTML('beforeend',
          `<div class="it ${on?'on':''}" title="${it[2]}" onclick="S.navA='${it[0]}';teken()"><span class="ic">${it[1]}</span>${it[0]}</div>`);
      });
    });
    if (!S.navA) S.navA='Significant weer';
    document.getElementById('kruim').innerHTML = `Weerkaarten › <b>${S.navA}</b>`;
    const sub = (NAV_A.flatMap(g=>g.items).find(i=>i[0]===S.navA)||[])[2]||'';
    if (/4-luik/.test(S.navA)) zetKaart('kaart vier', sub.split(' · ').map(m=>`<div>${m}</div>`).join(''));
    else zetKaart('kaart', paneel(S.navA, sub));
  }

  if (S.variant==='b' || S.variant==='c'){
    const gGroepen = [...new Set(MODELLEN.map(m=>m.g))];
    let h = `<div class="fgrp"><label>Model</label><select class="f" onchange="S.model=this.value;teken()">`;
    gGroepen.forEach(g=>{
      h += `<optgroup label="${g}">` + MODELLEN.filter(m=>m.g===g)
        .map(m=>`<option value="${m.k}" ${m.k===S.model?'selected':''}>${m.l}</option>`).join('') + `</optgroup>`;
    });
    h += `</select></div>`;
    h += `<div class="fgrp"><label>Gebied</label><div class="chips">` + GEBIEDEN.map(([k,l])=>{
      const kan=(MODELLEN.find(m=>m.k===S.model)||{gebied:[]}).gebied.includes(k);
      return `<span class="chip ${k===S.gebied?'on':''} ${kan?'':'dim'}" onclick="${kan?`S.gebied='${k}';teken()`:''}">${l}</span>`;
    }).join('') + `</div></div>`;
    h += `<div class="fgrp"><label>Veld</label><select class="f" onchange="S.veld=this.value;teken()">` +
      VELDEN.map(g=>`<optgroup label="${g.g}">` + g.items.map(it=>{
        const kan = it[2].includes(S.model);
        return `<option value="${it[0]}" ${it[0]===S.veld?'selected':''} ${kan?'':'disabled'}>${it[1]}${kan?'':' — n.v.t.'}</option>`;
      }).join('') + `</optgroup>`).join('') + `</select></div>`;
    h += `<div class="fgrp"><label>Weergave</label><div class="chips">` + LAYOUTS.map(([k,l])=>
      `<span class="chip ${k===S.layout?'on':''}" onclick="S.layout='${k}';teken()">${l}</span>`).join('') + `</div></div>`;
    fac.innerHTML = h;

    const gb=(MODELLEN.find(m=>m.k===S.model)||{gebied:[]}).gebied;
    if (!gb.includes(S.gebied)) { S.gebied = gb[gb.length-1]; fac.innerHTML=''; teken(); return; }
    if (!veldModellen(S.veld).includes(S.model)) {
      for (const g of VELDEN) for (const it of g.items) if (it[2].includes(S.model)) { S.veld=it[0]; break; }
      fac.innerHTML=''; teken(); return;
    }
    if (S.variant==='c'){
      document.getElementById('kruim').innerHTML =
        `Weerkaarten › <b>${S.navA}</b> · ${modelLabel(S.model)} · ${GEBIEDEN.find(g=>g[0]===S.gebied)[1]} · +${S.uur} u`;
    }
    if (S.variant==='b'){
      document.getElementById('kruim').innerHTML =
        `Weerkaarten › <b>${modelLabel(S.model)}</b> › ${GEBIEDEN.find(g=>g[0]===S.gebied)[1]} › <b>${veldLabel(S.veld)}</b>`;
      if (S.layout==='1') zetKaart('kaart', paneel(veldLabel(S.veld), modelLabel(S.model)+' · '+GEBIEDEN.find(g=>g[0]===S.gebied)[1]));
      else { const n=S.layout==='4'?4:9;
        zetKaart('kaart vier', Array.from({length:n},(_,i)=>`<div>+${i*24} u</div>`).join(''));
        const kaart=document.getElementById('kaart');
        kaart.style.gridTemplateColumns = n===9?'1fr 1fr 1fr':'1fr 1fr';
        kaart.style.gridTemplateRows = n===9?'1fr 1fr 1fr':'1fr 1fr'; }
    }
  }

  document.getElementById('uitleg').innerHTML = {
    oud:'<b>Nu:</b> 13 items op één niveau, vier verschillende assen door elkaar. Je moet de itemnaam kennen om te weten wat erachter zit, en dezelfde parameter (neerslag) zit in vier verschillende items.',
    a:'<b>Variant A:</b> zelfde 13 pagina\'s, maar gegroepeerd op de vraag die je stelt (dracht/schaal) in plaats van op techniek. Alleen menuwerk, geen refactor van de kaartpagina\'s.',
    b:'<b>Variant B:</b> één viewer, keuze via facetten — precies het patroon van wxcharts, Wetterzentrale, Meteociel en Pivotal. Onmogelijke combinaties worden grijs. Vergt wél samenvoegen van de losse pagina\'s.',
    c:'<b>Variant C (aanbevolen):</b> gegroepeerde zijbalk als instap + facetbalk boven de kaart om te schakelen zonder terug te gaan. Zijbalk voor ontdekken, facetten voor doorklikken.'
  }[S.variant];
}
zetVariant('a'); tekenTijd();
</script>
</body>
</html>
