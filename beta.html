<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Beta — weerlab.nl</title>
<style>
  :root {
    --bg:     #0d1420;
    --panel:  #172235;
    --border: #2a3a55;
    --accent: #88aaff;
    --gold:   #ffcc66;
    --text:   #e6ecf5;
    --muted:  #8899bb;
    --danger: #e04040;
    --green:  #4ade80;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text);
         font-family: -apple-system, "Helvetica Neue", Arial, sans-serif;
         min-height: 100vh; height:100dvh; }

  /* ── App ──────────────────────────────────────────────── */
  #app { display: flex; flex-direction: column; height: 100vh; }

  /* Header */
  .header {
    background: var(--panel); border-bottom: 1px solid var(--border);
    padding: 10px 20px; display: flex; align-items: center; gap: 14px;
    flex-shrink: 0;
  }
  .header-logo { font-size: 18px; font-weight: 800; color: var(--gold); letter-spacing: -.5px; }
  .header-sub  { font-size: 12px; color: var(--muted); }
  .beta-badge {
    background: #c02020; color: #fff; font-size: 9px; font-weight: 800;
    padding: 2px 6px; border-radius: 3px; letter-spacing: 1px;
  }

  .share-tools[hidden] { display: none; }
  .share-tools { margin-left: auto; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  #copy-url { background: transparent; color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 8px 12px; font-family: inherit; font-size: 12px; font-weight: 600; cursor: pointer; white-space: nowrap; }
  #copy-url:hover { background: #24334c; border-color: var(--accent); }
  #copy-url:focus-visible, #direct-url:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  #copy-status { color: var(--muted); font-size: 12px; }
  #direct-url { width: min(340px, 100%); background: var(--bg); color: var(--text); border: 1px solid var(--accent); border-radius: 5px; padding: 8px; font-size: 12px; }
  @media (max-width: 650px) { .header { flex-wrap: wrap; gap: 8px; padding: 10px 12px; } .share-tools { width: 100%; margin-left: 0; } }

  /* Gegroepeerde toolkeuze, zonder horizontale tabrij. */
  .tool-picker{display:flex;align-items:center;gap:12px;padding:8px 20px;background:var(--panel);border-bottom:1px solid var(--border);flex-shrink:0;min-width:0}
  .tool-picker label{font-size:12px;font-weight:600;color:var(--muted);white-space:nowrap}
  #beta-tool{width:min(380px,100%);min-width:0;padding:7px 10px;border:1px solid var(--border);border-radius:6px;background:var(--bg);color:var(--text);font-family:inherit;font-size:13px;font-weight:600;cursor:pointer}
  #beta-tool:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  #beta-tool optgroup{color:var(--gold);font-weight:700}#beta-tool option{color:var(--text);background:var(--panel);font-weight:400}
  @media(max-width:650px){.tool-picker{padding:7px 12px;gap:8px}#beta-tool{flex:1;width:auto;min-height:36px;font-size:12px}.header-sub{font-size:11px}}

  /* Content area */
  .content { flex: 1; min-height:0; overflow: hidden; display: flex; flex-direction: column; }
  .tab-panel { display: none; flex: 1; min-height:0; overflow-y: auto; height: 100%; }
  .tab-panel.actief { display: flex; flex-direction: column; }

  /* iframe panels */
  .tab-panel iframe { width:100%; flex:1 1 0; height:0; border:none; min-height:0; }

  /* ── Weerkaarten panel ─────────────────────────────────── */
  .kaarten-wrap {
    padding: 20px; max-width: 1400px; margin: 0 auto; width: 100%;
  }
  .kaarten-header {
    display: flex; align-items: baseline; gap: 12px; margin-bottom: 16px;
  }
  .kaarten-header h2 { font-size: 16px; font-weight: 700; }
  .run-info { font-size: 11px; color: var(--muted); }
  #meta-error { color: var(--danger); font-size: 12px; }

  /* Panel-overzichten */
  .panel-blok { margin-bottom: 28px; }
  .panel-titel {
    font-size: 12px; font-weight: 700; color: var(--muted);
    text-transform: uppercase; letter-spacing: .06em; margin-bottom: 8px;
  }
  .overzicht-img {
    width: 100%; border-radius: 8px; border: 1px solid var(--border);
    display: block; cursor: zoom-in; transition: width .1s;
  }

  /* Zoom slider */
  .zoom-bar {
    display: flex; align-items: center; gap: 10px; margin-bottom: 14px;
  }
  .zoom-bar label { font-size: 11px; color: var(--muted); white-space: nowrap; }
  .zoom-bar input[type=range] {
    flex: 1; max-width: 260px; accent-color: var(--accent); cursor: pointer;
  }
  #zoom-pct { font-size: 11px; color: var(--accent); min-width: 36px; }

  /* Lightbox */
  #lightbox {
    display: none; position: fixed; inset: 0; background: rgba(0,0,0,.85);
    z-index: 500; align-items: center; justify-content: center; cursor: zoom-out;
  }
  #lightbox.open { display: flex; }
  #lightbox img { max-width: 95vw; max-height: 95vh; border-radius: 6px; }
</style>
</head>
<body>

<!-- App -->
<div id="app">
  <div class="header">
    <span class="header-logo">weerlab<span style="color:var(--muted)">.nl</span></span>
    <span class="beta-badge">BETA</span>
    <span class="header-sub">Experimentele tools</span>
    <div class="share-tools">
      <button id="copy-url" type="button">Kopieer directe URL</button>
      <span id="copy-status" role="status" aria-live="polite"></span>
      <input id="direct-url" type="url" readonly hidden aria-label="Directe URL van dit BETA-tabblad">
    </div>
  </div>

  <nav class="tool-picker" aria-label="Beta tools"><label for="beta-tool">Kies een tool</label><select id="beta-tool" aria-label="Kies een Beta-tool">
    <optgroup label="Weerbeeld en kaarten">
      <option class="tab actief" data-tab="synoptisch" value="synoptisch" selected>Weerbeeld Europa</option>
      <option class="tab" data-tab="hres10" value="hres10">Weerkaarten Europa</option>
      <option class="tab" data-tab="multitemp" value="multitemp">Opers-Multi</option>
    </optgroup>
    <optgroup label="Verwachtingen en extremen">
      <option class="tab" data-tab="storm" value="storm">Stormbanen · ECMWF ENS</option>
      <option class="tab" data-tab="windplaat" value="windplaat">Weergrafieken</option>
      <option class="tab" data-tab="windensemble" value="windensemble">Wind · zesluik</option>
    </optgroup>
    <optgroup label="Temperatuur en modelcontrole">
      <option class="tab" data-tab="temperaturen" value="temperaturen">Temperaturen</option>
      <option class="tab" data-tab="wegdek" value="wegdek">Wegdektemperaturen</option>
      <option class="tab" data-tab="modelcheck" value="modelcheck">Modelcheck</option>
    </optgroup>
    <optgroup label="Neerslag">
      <option class="tab" data-tab="neerslagstations" value="neerslagstations">Neerslagstations</option>
    </optgroup>
    <optgroup label="Klimaat">
      <option class="tab" data-tab="klimaat" value="klimaat">Klimaat · ENSO en zeeijs</option>
    </optgroup>
  </select></nav>

  <div class="content">
    <div class="tab-panel" id="tab-storm"><iframe id="iframe-storm" src="" title="Stormbanen en windstootkansen ECMWF ENS"></iframe></div>

    <div class="tab-panel" id="tab-windplaat"><iframe id="iframe-windplaat" src="" title="Weergrafieken: wind, neerslag, temperatuur en meer"></iframe></div>
    <div class="tab-panel" id="tab-windensemble"><iframe id="iframe-windensemble" src="" title="ECMWF wind en windstoten, zes kaarten"></iframe></div>
    <div class="tab-panel actief" id="tab-synoptisch"><iframe id="iframe-synoptisch" src="beta-synoptisch/index.html?v=20261018-start" title="Weerbeeld Europa" allowfullscreen></iframe></div>
    <div class="tab-panel" id="tab-temperaturen"><iframe id="iframe-temperaturen" src="" title="Grond-, minimum- en maximumtemperatuur"></iframe></div>
    <div class="tab-panel" id="tab-klimaat"><iframe id="iframe-klimaat" src="" title="Klimaatdashboard ENSO en zeeijs"></iframe></div>
    <div class="tab-panel" id="tab-wegdek"><iframe id="iframe-wegdek" src="" title="Wegdektemperaturen Nederland"></iframe></div>

    <!-- Tab: Weerkaarten Europa -->
    <div class="tab-panel" id="tab-hres10">
      <iframe id="iframe-hres10" src="" title="Weerkaarten Europa"></iframe>
    </div>


    <!-- Tab: Modelcheck -->
    <div class="tab-panel" id="tab-modelcheck">
      <iframe id="iframe-modelcheck" src="" title="Modelcheck: meting en model"></iframe>
    </div>

    <!-- Tab: Opers-Multi -->
    <div class="tab-panel" id="tab-multitemp">
      <iframe id="iframe-multitemp" src="" title="Opers-Multi"></iframe>
    </div>


    <!-- Tab: KNMI-neerslagstations -->
    <div class="tab-panel" id="tab-neerslagstations">
      <iframe id="iframe-neerslagstations" src="" title="Neerslag per KNMI-neerslagstation"></iframe>
    </div>



  </div>
</div>

<!-- Lightbox -->
<div id="lightbox" onclick="closeLightbox()">
  <img id="lightbox-img" src="" alt="">
</div>

<script>
// Lazy-load de iframe van de tab die bij opstart actief is
function loadActivePanel() {
  const panel = document.querySelector('.tab-panel.actief');
  if (!panel) return;
  const name = panel.id.replace('tab-', '');
  if (IFRAME_SRCS[name] && !iframeLoaded[name]) {
    document.getElementById('iframe-' + name).src = IFRAME_SRCS[name];
    iframeLoaded[name] = true;
  }
}

// Open the active tab immediately; no password or stored login required.
window.addEventListener('DOMContentLoaded', () => {
  restoreTabFromHash();
  loadActivePanel();
});

// ── Tabs ──────────────────────────────────────────────────
const IFRAME_SRCS = {
  storm: 'beta-storm/index.html?v=20261024-4',
  windplaat: 'windplaat.html?v=20261024-windstijl',
  windensemble: 'wind-ensemble/index.html?v=20261019-1',
  synoptisch: 'beta-synoptisch/index.html?v=20261015-1',
  klimaat: 'beta-klimaat/index.html?v=20261013-1',
  wegdek: 'beta-wegdek/index.html?v=20261011-auto-temp',
  hres10:   'weerkaarten_europa.html?v=20261021-model-switch',
  modelcheck: 'beta_modelcheck.html?v=20261022-meting-min-model',
  multitemp:'demo_multimodel_temp.html',
  neerslagstations: 'beta_neerslagstations.html?v=20260922-7',
  temperaturen: 'beta_temperaturen.html?v=20261015-1'
};
const iframeLoaded = {synoptisch:true};

function openTab(name, el, updateHash = true) {
  if (!IFRAME_SRCS[name]) return;
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('actief'));
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('actief'));
  el.classList.add('actief');
  document.getElementById('beta-tool').value = name;
  document.getElementById('tab-' + name).classList.add('actief');

  // Laad iframe lazy
  if (IFRAME_SRCS[name] && !iframeLoaded[name]) {
    const iframe = document.getElementById('iframe-' + name);
    iframe.src = IFRAME_SRCS[name];
    iframeLoaded[name] = true;
  }
  if (updateHash && location.hash !== '#' + name) history.replaceState(null, '', '#' + name);
  updateDirectURL();
}

document.getElementById('beta-tool').addEventListener('change',event=>{openTab(event.target.value,event.target.selectedOptions[0]);});

function restoreTabFromHash() {
  let name = location.hash.slice(1);
  if (['grondtemp', 'tn', 'tx'].includes(name)) {
    IFRAME_SRCS.temperaturen = 'beta_temperaturen.html?v=20261015-1#' + name;
    name = 'temperaturen';
  }
  if (name === 'winterarchief') { location.replace('index.html#klimaatarchief'); return; }
  if (!IFRAME_SRCS[name]) return;
  const tab = document.querySelector(`.tab[data-tab="${name}"]`);
  if (tab) openTab(name, tab, false);
}
window.addEventListener('hashchange', restoreTabFromHash);
window.addEventListener('DOMContentLoaded', restoreTabFromHash);

// A shared link opens this BETA tool directly, also outside the main-site iframe.
function directURL() {
  const tab = document.querySelector('.tab.actief');
  const url = new URL('index.html', location.href), params = new URLSearchParams({tab:tab.dataset.tab});
  try {
    const child = document.querySelector('.tab-panel.actief iframe');
    const view = new URL(child.contentWindow.location.href);
    view.searchParams.delete('v');
    if (view.origin === location.origin && (view.search || view.hash)) params.set('view',view.pathname+view.search+view.hash);
  } catch (_) {}
  url.hash = 'beta?' + params;
  return url.href;
}
try { if (window.parent !== window && window.parent.document.getElementById('page-actions')) document.querySelector('.share-tools').hidden = true; } catch (_) {}
function updateDirectURL() {
  const input = document.getElementById('direct-url');
  input.value = directURL();
  input.hidden = true;
  document.getElementById('copy-url').textContent = 'Kopieer directe URL';
  document.getElementById('copy-url').title = input.value;
  document.getElementById('copy-status').textContent = '';
}
document.getElementById('copy-url').addEventListener('click', async () => {
  const button = document.getElementById('copy-url');
  const input = document.getElementById('direct-url');
  const url = directURL();
  let copied = false;
  try { await navigator.clipboard.writeText(url); copied = true; } catch (_) {
    input.value = url;
    input.hidden = false;
    input.focus();
    input.select();
    try { copied = document.execCommand('copy'); } catch (_) {}
    if (copied) { input.hidden = true; button.focus(); }
  }
  // A tab change while permission is pending must not show success for another URL.
  if (url !== directURL()) return;
  button.textContent = copied ? '✓ URL gekopieerd' : 'Kopieer directe URL';
  document.getElementById('copy-status').textContent = copied ? 'Link naar dit tabblad gekopieerd.' : 'Selecteer de link en kopieer met Ctrl+C of ⌘C.';
});
document.getElementById('direct-url').addEventListener('click', event => event.target.select());
updateDirectURL();

// ── Zoom ──────────────────────────────────────────────────
function setZoom(v) {
  document.querySelectorAll('.overzicht-img').forEach(img => img.style.width = v + '%');
  document.getElementById('zoom-pct').textContent = v + '%';
}

// ── Lightbox ──────────────────────────────────────────────
function openLightbox(src) {
  document.getElementById('lightbox-img').src = src;
  document.getElementById('lightbox').classList.add('open');
}
function closeLightbox() {
  document.getElementById('lightbox').classList.remove('open');
}
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeLightbox(); });
</script>
</body>
</html>
