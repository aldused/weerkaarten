<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: "DM Sans", ui-sans-serif, system-ui, sans-serif; background: #f6f8fb; color: #0f172a; font-feature-settings: "ss01","cv11"; }

.toolbar { background: #ffffff; padding: 10px 20px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; border-bottom: 1px solid #e3e8ef; }

}

.nl-buitengrens { fill: none; stroke: white; stroke-width: 2; stroke-linejoin: round; }
.legenda { display: flex; gap: 6px; flex-wrap: wrap; padding: 0 16px 16px; justify-content: center; }

<script>
// ── Projectie (zelfde als mosmix_kaart_hittekracht.html) ─────────────────────
const SVG_W = 800, SVG_H = 1100;
const LON_MIN = 3.3, LON_MAX = 7.4, LAT_MIN = 50.45, LAT_MAX = 53.8;
function lonToX(lon) { return (lon - LON_MIN) / (LON_MAX - LON_MIN) * SVG_W; }
function latToY(lat) { return (1 - (lat - LAT_MIN) / (LAT_MAX - LAT_MIN)) * SVG_H; }

// ── Hittekracht kleurschaal (0-10) ────────────────────────────────────────────
const HK_STOPS = [
  [0,   [220, 242, 255]],
  [1,   [180, 230, 250]],
  [2,   [140, 215, 180]],
  [3,   [160, 220, 120]],
  [4,   [220, 235,  80]],
  [5,   [255, 235,  60]],
  [6,   [255, 185,  30]],
  [7,   [255, 125,   0]],
  [8,   [230,  50,   0]],
  [9,   [180,   0,  30]],
  [10,  [110,  20, 140]],
];

function hkRgb(v) {
  v = Math.max(0, Math.min(10, isFinite(v) ? v : 0));
  for (let i = 0; i < HK_STOPS.length - 1; i++) {
    const [v0, c0] = HK_STOPS[i], [v1, c1] = HK_STOPS[i + 1];
    if (v >= v0 && v <= v1) {
      const t = (v - v0) / (v1 - v0);
      return [0,1,2].map(j => Math.round(c0[j] + t * (c1[j] - c0[j])));
    }
  }
  return HK_STOPS[HK_STOPS.length - 1][1];
}

const HK_LEGENDA = [
  { v: 0.5, label: "0–1 · Geen" },
  { v: 2,   label: "2–3 · Minimaal" },
  { v: 4,   label: "4 · Licht" },
  { v: 5,   label: "5 · Matig-licht" },
  { v: 6,   label: "6 · Matig" },
  { v: 7,   label: "7 · Hoog" },
  { v: 8,   label: "8 · Erg hoog" },
  { v: 9,   label: "9 · Extreem" },
  { v: 10,  label: "10 · Zeer extreem" },
];

// ── Data globals ──────────────────────────────────────────────────────────────
let gemeten = null;
let provincies = null;
let activeWeergave = "nu";
let highlightStation = null;   // naam van het gehighlighte station (rode ring)
let highlightManual = false;   // true zodra gebruiker zelf koos (dan niet meer op #1 zetten)

// ── Basemap (provincie-GeoJSON) ───────────────────────────────────────────────
function _provRingD(ring) {
  let d = "";
  ring.forEach(([lon, lat], i) => {
    const x = lonToX(lon).toFixed(1), y = latToY(lat).toFixed(1);
    d += (i === 0 ? "M" : "L") + x + " " + y;
  });
  return d + "Z";
}

function _provAllD() {
  let d = "";
  for (const feat of provincies.features) {
    const g = feat.geometry;
    const polys = g.type === "Polygon" ? [g.coordinates] : g.coordinates;
    for (const poly of polys) for (const ring of poly) d += _provRingD(ring);
  }
  return d;
}

function bouwBasemap() {
  const svg = document.getElementById("basemap-svg");
  while (svg.firstChild) svg.removeChild(svg.firstChild);
  if (!provincies) return;
  const d = _provAllD();
  const land = document.createElementNS("http://www.w3.org/2000/svg", "path");
  land.setAttribute("d", d);
  land.setAttribute("class", "basemap-land");
  land.setAttribute("fill-rule", "evenodd");
  svg.appendChild(land);
  const prov = document.createElementNS("http://www.w3.org/2000/svg", "path");
  prov.setAttribute("d", d);
  prov.setAttribute("class", "basemap-prov");
  svg.appendChild(prov);
}

function tekenBuitengrens(svg) {
  // NB: wist niet meer de svg — tekenLabels leegt zelf en tekent eerst contouren.
  if (!provincies) return;
  let d = "";
  for (const feat of provincies.features) {
    const g = feat.geometry;
    const polys = g.type === "Polygon" ? [g.coordinates] : g.coordinates;
    for (const poly of polys) d += _provRingD(poly[0]);
  }
  const p = document.createElementNS("http://www.w3.org/2000/svg", "path");
  p.setAttribute("d", d);
  p.setAttribute("class", "nl-buitengrens");
  svg.appendChild(p);
}

// ── Waarden per weergave ──────────────────────────────────────────────────────
// weergave "vandaag"/"morgen"/"overmorgen" → datumsleutel in het app-JSON.
function dagKeyVoor(weergave) {
  if (weergave === "morgen") return gemeten.morgen;
  if (weergave === "overmorgen") return gemeten.overmorgen;
  return gemeten.vandaag;
}

function stationWaarden(weergave) {
  const dagKey = dagKeyVoor(weergave);
  const uit = [];
  for (const [sid, s] of Object.entries(gemeten.stations || {})) {
    const hk = s.hk ? s.hk[dagKey] : undefined;
    if (!Number.isFinite(hk)) continue;
    uit.push({ sid, naam: s.naam, lat: s.lat, lon: s.lon, hk, cel: s.cel });
  }
  return uit;
}

// ── IDW heatmap ───────────────────────────────────────────────────────────────
const CANVAS_W = 800, CANVAS_H = 1100;
function buildProvCanvasPath(ctx) {
  ctx.beginPath();
  for (const feat of provincies.features) {
    const g = feat.geometry;
    const polys = g.type === "Polygon" ? [g.coordinates] : g.coordinates;
    for (const poly of polys) {
      for (const ring of poly) {
        ring.forEach(([lon, lat], i) => {
          const x = lonToX(lon) / SVG_W * CANVAS_W;
          const y = latToY(lat) / SVG_H * CANVAS_H;
          if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
        });
        ctx.closePath();
      }
    }
  }
}

function tekenHeatmap() {
  const canvas = document.getElementById("heatmap");
  const ctx = canvas.getContext("2d");
  ctx.clearRect(0, 0, CANVAS_W, CANVAS_H);
  if (!veldNu || !landMask) return;

  // Gebruik hetzelfde geïnterpoleerde veld als de isolijnen. De oude versie
  // berekende hier per kaartpixel nogmaals IDW en deed bijna 100.000 losse
  // fillRect()-aanroepen. Een klein raster + één drawImage() is veel sneller.
  const raster = document.createElement("canvas");
  raster.width = FW; raster.height = FH;
  const rctx = raster.getContext("2d");
  const image = rctx.createImageData(FW, FH);
  for (let i = 0; i < veldNu.length; i++) {
    if (!landMask.data[i]) continue;
    const [r, g, b] = hkRgb(veldNu[i]);
    const p = i * 4;
    image.data[p] = r; image.data[p + 1] = g; image.data[p + 2] = b;
    image.data[p + 3] = 184; // circa 0,72 dekking, gelijk aan de oude heatmap
  }
  rctx.putImageData(image, 0, 0);

  ctx.save();
  buildProvCanvasPath(ctx);
  ctx.clip("evenodd");
  ctx.imageSmoothingEnabled = true;
  ctx.drawImage(raster, 0, 0, CANVAS_W, CANVAS_H);
  ctx.restore();
}

// ── Veld + landmask (voor isolijnen) ──────────────────────────────────────────
// Overgenomen uit mosmix_kaart.html, aangepast aan dit 800×1100-stelsel.
function ns(tag) { return document.createElementNS("http://www.w3.org/2000/svg", tag); }

const FIELD_RES = 4;                              // grid-stap in SVG-pixels
const FW = Math.ceil(CANVAS_W / FIELD_RES);
const FH = Math.ceil(CANVAS_H / FIELD_RES);
let landMask = null;   // {w,h,data:Uint8Array}
let veldNu = null;     // Float32Array van het geïnterpoleerde hittekracht-veld
const veldCache = new Map();

function maakLandMask() {
  if (!provincies) return;
  const c = document.createElement("canvas");
  c.width = FW; c.height = FH;
  const ctx = c.getContext("2d");
  ctx.scale(1 / FIELD_RES, 1 / FIELD_RES);
  ctx.fillStyle = "#000";
  buildProvCanvasPath(ctx);
  ctx.fill("evenodd");
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  const px = ctx.getImageData(0, 0, FW, FH).data;
  const data = new Uint8Array(FW * FH);
  for (let i = 0; i < data.length; i++) data[i] = px[i * 4 + 3] > 0 ? 1 : 0;
  landMask = { w: FW, h: FH, data };
}

function bouwVeld(weergave) {
  if (!landMask) maakLandMask();
  if (!landMask) { veldNu = null; return; }
  const cacheKey = dagKeyVoor(weergave);
  if (veldCache.has(cacheKey)) { veldNu = veldCache.get(cacheKey); return; }
  const punten = stationWaarden(weergave).map(s => ({
    x: lonToX(s.lon) / FIELD_RES, y: latToY(s.lat) / FIELD_RES, hk: s.hk
  }));
  if (punten.length < 3) { veldNu = null; return; }
  const veld = new Float32Array(FW * FH);
  for (let y = 0; y < FH; y++) for (let x = 0; x < FW; x++) {
    const idx = y * FW + x;
    if (!landMask.data[idx]) continue;
    let num = 0, den = 0, hit = -1;
    for (const p of punten) {
      const d2 = (x - p.x) ** 2 + (y - p.y) ** 2;
      if (d2 < 0.25) { hit = p.hk; break; }
      const w = 1 / (d2 * d2);          // power ~4 → strak bij station, glad ertussen
      num += w * p.hk; den += w;
    }
    veld[idx] = hit >= 0 ? hit : num / den;
  }
  // Lichte box-blur (2×) voor rustige isolijnen.
  veldNu = _blurVeld(_blurVeld(veld));
  veldCache.set(cacheKey, veldNu);
}

function _blurVeld(veld) {
  const w = FW, h = FH, mask = landMask.data, out = new Float32Array(w * h);
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    const idx = y * w + x;
    if (!mask[idx]) continue;
    let s = 0, n = 0;
    for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
      const xx = x + dx, yy = y + dy;
      if (xx < 0 || yy < 0 || xx >= w || yy >= h) continue;
      if (!mask[yy * w + xx]) continue;
      s += veld[yy * w + xx]; n++;
    }
    out[idx] = n ? s / n : veld[idx];
  }
  return out;
}

function _chainSegments(segs) {
  const key = p => p[0].toFixed(2) + "," + p[1].toFixed(2);
  const map = new Map();
  const used = new Uint8Array(segs.length);
  segs.forEach((s, i) => {
    for (let e = 0; e < 2; e++) {
      const k = key(s[e]);
      if (!map.has(k)) map.set(k, []);
      map.get(k).push({ seg: i, end: e });
    }
  });
  const lines = [];
  for (let i = 0; i < segs.length; i++) {
    if (used[i]) continue;
    used[i] = 1;
    const line = [segs[i][0].slice(), segs[i][1].slice()];
    let curKey = key(segs[i][1]);
    while (true) {
      const cands = map.get(curKey) || [];
      let next = null;
      for (const c of cands) { if (!used[c.seg]) { next = c; break; } }
      if (!next) break;
      used[next.seg] = 1;
      const np = segs[next.seg][1 - next.end];
      line.push(np.slice()); curKey = key(np);
    }
    curKey = key(segs[i][0]);
    while (true) {
      const cands = map.get(curKey) || [];
      let next = null;
      for (const c of cands) { if (!used[c.seg]) { next = c; break; } }
      if (!next) break;
      used[next.seg] = 1;
      const np = segs[next.seg][1 - next.end];
      line.unshift(np.slice()); curKey = key(np);
    }
    lines.push(line);
  }
  return lines;
}

function _polylineLength(pl) {
  let L = 0;
  for (let i = 1; i < pl.length; i++) L += Math.hypot(pl[i][0] - pl[i - 1][0], pl[i][1] - pl[i - 1][1]);
  return L;
}

// Isolijnen van het hittekracht-veld (marching squares).
const CONTOUR_STEP = 0.5;   // lijn elke 0,5 hittekracht; hele getallen = major (gelabeld)
function tekenContouren(svg) {
  if (!veldNu || !landMask) return;
  const w = FW, h = FH, veld = veldNu, mask = landMask.data;
  let vmin = Infinity, vmax = -Infinity;
  for (let i = 0; i < w * h; i++) { if (!mask[i]) continue; const v = veld[i]; if (v < vmin) vmin = v; if (v > vmax) vmax = v; }
  if (!isFinite(vmin)) return;
  const lMin = Math.ceil((vmin + 1e-6) / CONTOUR_STEP) * CONTOUR_STEP;
  const lMax = Math.floor((vmax - 1e-6) / CONTOUR_STEP) * CONTOUR_STEP;
  if (lMin > lMax) return;

  const cellX = x => x * FIELD_RES + FIELD_RES / 2;
  const cellY = y => y * FIELD_RES + FIELD_RES / 2;
  const cw = FIELD_RES, ch = FIELD_RES;
  const gLines = ns("g");
  gLines.setAttribute("pointer-events", "none");
  const labels = [];

  for (let li = Math.round(lMin / CONTOUR_STEP); li <= Math.round(lMax / CONTOUR_STEP); li++) {
    const level = li * CONTOUR_STEP;
    const isMajor = Number.isInteger(level);
    const segs = [];
    for (let y = 0; y < h - 1; y++) {
      const row0 = y * w, row1 = (y + 1) * w;
      for (let x = 0; x < w - 1; x++) {
        const i00 = row0 + x, i10 = row0 + x + 1, i01 = row1 + x, i11 = row1 + x + 1;
        if (!mask[i00] || !mask[i10] || !mask[i01] || !mask[i11]) continue;
        const v00 = veld[i00], v10 = veld[i10], v01 = veld[i01], v11 = veld[i11];
        let code = 0;
        if (v00 >= level) code |= 1;
        if (v10 >= level) code |= 2;
        if (v11 >= level) code |= 4;
        if (v01 >= level) code |= 8;
        if (code === 0 || code === 15) continue;
        const px = cellX(x), py = cellY(y);
        const lerp = (a, b) => { const d = b - a; return Math.abs(d) < 1e-9 ? 0.5 : (level - a) / d; };
        const eTop = () => [px + lerp(v00, v10) * cw, py];
        const eRight = () => [px + cw, py + lerp(v10, v11) * ch];
        const eBot = () => [px + lerp(v01, v11) * cw, py + ch];
        const eLeft = () => [px, py + lerp(v00, v01) * ch];
        switch (code) {
          case 1: case 14: segs.push([eLeft(), eTop()]); break;
          case 2: case 13: segs.push([eTop(), eRight()]); break;
          case 3: case 12: segs.push([eLeft(), eRight()]); break;
          case 4: case 11: segs.push([eRight(), eBot()]); break;
          case 6: case 9: segs.push([eTop(), eBot()]); break;
          case 7: case 8: segs.push([eLeft(), eBot()]); break;
          case 5: { const avg = (v00 + v10 + v01 + v11) / 4;
            if (avg >= level) { segs.push([eLeft(), eTop()]); segs.push([eRight(), eBot()]); }
            else { segs.push([eLeft(), eBot()]); segs.push([eTop(), eRight()]); } break; }
          case 10: { const avg = (v00 + v10 + v01 + v11) / 4;
            if (avg >= level) { segs.push([eTop(), eRight()]); segs.push([eLeft(), eBot()]); }
            else { segs.push([eLeft(), eTop()]); segs.push([eRight(), eBot()]); } break; }
        }
      }
    }
    if (!segs.length) continue;
    const polylines = _chainSegments(segs);
    let d = "";
    for (const line of polylines) {
      if (line.length < 2) continue;
      d += `M${line[0][0].toFixed(2)} ${line[0][1].toFixed(2)}`;
      for (let i = 1; i < line.length; i++) d += `L${line[i][0].toFixed(2)} ${line[i][1].toFixed(2)}`;
    }
    const path = ns("path");
    path.setAttribute("d", d);
    path.setAttribute("fill", "none");
    path.setAttribute("stroke", isMajor ? "rgba(15,23,42,0.72)" : "rgba(15,23,42,0.42)");
    path.setAttribute("stroke-width", isMajor ? "1.4" : "0.8");
    path.setAttribute("stroke-linecap", "round");
    path.setAttribute("stroke-linejoin", "round");
    gLines.appendChild(path);

    if (isMajor) {
      const cand = polylines.map(pl => ({ pl, len: _polylineLength(pl) }))
        .filter(o => o.len > 80).sort((a, b) => b.len - a.len);
      const placed = [];
      for (const o of cand) {
        if (placed.length >= 2) break;
        const pl = o.pl, midIdx = Math.floor(pl.length / 2), mid = pl[midIdx];
        if (placed.some(q => Math.hypot(q[0] - mid[0], q[1] - mid[1]) < 120)) continue;
        placed.push(mid);
        const i0 = Math.max(0, midIdx - 3), i1 = Math.min(pl.length - 1, midIdx + 3);
        const ang = Math.atan2(pl[i1][1] - pl[i0][1], pl[i1][0] - pl[i0][0]);
        labels.push({ x: mid[0], y: mid[1], text: String(level), ang });
      }
    }
  }
  svg.appendChild(gLines);

  for (const lb of labels) {
    let deg = lb.ang * 180 / Math.PI;
    if (deg > 90) deg -= 180; if (deg < -90) deg += 180;
    const t = ns("text");
    t.setAttribute("x", lb.x.toFixed(1)); t.setAttribute("y", lb.y.toFixed(1));
    t.setAttribute("text-anchor", "middle"); t.setAttribute("dominant-baseline", "middle");
    t.setAttribute("font-family", "DM Mono, monospace"); t.setAttribute("font-weight", "700");
    t.setAttribute("font-size", "11"); t.setAttribute("fill", "#0f172a");
    t.setAttribute("paint-order", "stroke"); t.setAttribute("stroke", "white");
    t.setAttribute("stroke-width", "3"); t.setAttribute("stroke-linejoin", "round");
    t.setAttribute("transform", `rotate(${deg.toFixed(1)} ${lb.x.toFixed(1)} ${lb.y.toFixed(1)})`);
    t.textContent = lb.text;
    svg.appendChild(t);
  }
}

// ── Top-3 paneel (leaderboard linksboven) ─────────────────────────────────────
function tekenTop3Paneel(svg, items) {
  const top3 = items.slice(0, 3);
  if (!top3.length) return;
  const kleuren = ["#cc0000", "#8B6914", "#888888"];
  const px = 12, py = 12, pb = 210, rijH = 40, ph = 30 + top3.length * rijH;

  const rect = ns("rect");
  rect.setAttribute("x", px); rect.setAttribute("y", py);
  rect.setAttribute("width", pb); rect.setAttribute("height", ph);
  rect.setAttribute("rx", 8); rect.setAttribute("fill", "white"); rect.setAttribute("fill-opacity", "0.9");
  rect.setAttribute("stroke", "#cbd5e1"); rect.setAttribute("stroke-width", "1");
  svg.appendChild(rect);

  const titel = ns("text");
  titel.setAttribute("x", px + 14); titel.setAttribute("y", py + 19);
  titel.setAttribute("font-size", "12.5"); titel.setAttribute("font-weight", "700");
  titel.setAttribute("font-family", "DM Sans, sans-serif"); titel.setAttribute("fill", "#003366");
  titel.textContent = "Top 3 · Hittekracht (app KNMI)";
  svg.appendChild(titel);

  top3.forEach((item, idx) => {
    const ry = py + 30 + idx * rijH;
    const kleur = kleuren[idx];
    const med = ns("circle");
    med.setAttribute("cx", px + 20); med.setAttribute("cy", ry + 14);
    med.setAttribute("r", 13); med.setAttribute("fill", kleur);
    svg.appendChild(med);
    const medTxt = ns("text");
    medTxt.setAttribute("x", px + 20); medTxt.setAttribute("y", ry + 19);
    medTxt.setAttribute("text-anchor", "middle"); medTxt.setAttribute("font-size", "14");
    medTxt.setAttribute("font-weight", "700"); medTxt.setAttribute("font-family", "DM Sans, sans-serif");
    medTxt.setAttribute("fill", "white"); medTxt.textContent = String(idx + 1);
    svg.appendChild(medTxt);

    const stn = ns("text");
    stn.setAttribute("x", px + 40); stn.setAttribute("y", ry + 11);
    stn.setAttribute("font-size", "12.5"); stn.setAttribute("font-weight", "700");
    stn.setAttribute("font-family", "DM Sans, sans-serif"); stn.setAttribute("fill", "#1e293b");
    stn.textContent = item.naam;
    svg.appendChild(stn);

    const wrd = ns("text");
    wrd.setAttribute("x", px + 40); wrd.setAttribute("y", ry + 27);
    wrd.setAttribute("font-size", "11"); wrd.setAttribute("font-family", "DM Sans, sans-serif");
    wrd.setAttribute("fill", kleur); wrd.setAttribute("font-weight", "700");
    wrd.textContent = "hittekracht " + item.hk;
    svg.appendChild(wrd);
  });
}

// ── Station labels in SVG overlay ─────────────────────────────────────────────
function tekenLabels(weergave) {
  const svg = document.getElementById("nl-overlay");
  while (svg.firstChild) svg.removeChild(svg.firstChild);

  tekenContouren(svg);      // isolijnen onder de grens en stations
  tekenBuitengrens(svg);

  // Items gesorteerd hoog→laag voor Top-3 en highlight-default.
  const items = stationWaarden(weergave).slice().sort((a, b) => b.hk - a.hk || a.naam.localeCompare(b.naam));

  for (const st of items) {
    const cx = lonToX(st.lon), cy = latToY(st.lat);
    const [r, g, b] = hkRgb(st.hk);
    const lum = (0.299 * r + 0.587 * g + 0.114 * b) / 255;
    const txtKleur = lum < 0.55 ? "white" : "#111";
    const isHigh = st.naam === highlightStation;

    const g_el = document.createElementNS("http://www.w3.org/2000/svg", "g");

    if (isHigh) {
      const ring = document.createElementNS("http://www.w3.org/2000/svg", "circle");
      ring.setAttribute("cx", cx); ring.setAttribute("cy", cy); ring.setAttribute("r", 22);
      ring.setAttribute("fill", "none"); ring.setAttribute("stroke", "#cc0000");
      ring.setAttribute("stroke-width", "2.5"); ring.setAttribute("stroke-dasharray", "4 3");
      g_el.appendChild(ring);
    }

    const circle = document.createElementNS("http://www.w3.org/2000/svg", "circle");
    circle.setAttribute("cx", cx);
    circle.setAttribute("cy", cy);
    circle.setAttribute("r", isHigh ? 17 : 14);
    circle.setAttribute("fill", `rgb(${r},${g},${b})`);
    circle.setAttribute("stroke", isHigh ? "#cc0000" : "rgba(255,255,255,0.85)");
    circle.setAttribute("stroke-width", isHigh ? "3" : "1.8");
    g_el.appendChild(circle);

    const tv = document.createElementNS("http://www.w3.org/2000/svg", "text");
    tv.setAttribute("x", cx);
    tv.setAttribute("y", cy + 1);
    tv.setAttribute("text-anchor", "middle");
    tv.setAttribute("dominant-baseline", "middle");
    tv.setAttribute("font-size", isHigh ? "13" : "11");
    tv.setAttribute("font-weight", "700");
    tv.setAttribute("font-family", "DM Mono, monospace");
    tv.setAttribute("fill", txtKleur);
    tv.textContent = st.hk;
    g_el.appendChild(tv);

    const tn = document.createElementNS("http://www.w3.org/2000/svg", "text");
    tn.setAttribute("x", cx);
    tn.setAttribute("y", cy - (isHigh ? 22 : 18));
    tn.setAttribute("text-anchor", "middle");
    tn.setAttribute("font-size", isHigh ? "10" : "9");
    tn.setAttribute("font-weight", isHigh ? "700" : "500");
    tn.setAttribute("font-family", "DM Sans, sans-serif");
    tn.setAttribute("fill", isHigh ? "#cc0000" : "rgba(15,23,42,0.8)");
    tn.textContent = st.naam;
    g_el.appendChild(tn);

    const titel = document.createElementNS("http://www.w3.org/2000/svg", "title");
    titel.textContent = `${st.naam}: hittekracht ${st.hk}` + (st.cel ? ` (cel ${st.cel})` : "");
    g_el.appendChild(titel);

    svg.appendChild(g_el);
  }

  tekenTop3Paneel(svg, items);   // bovenop, linksboven
}

// ── Tijd & labels ─────────────────────────────────────────────────────────────
function utcNaarLokaal(iso) {
  try {
    return new Intl.DateTimeFormat("nl-NL", {
      timeZone: "Europe/Amsterdam", hour: "2-digit", minute: "2-digit"
    }).format(new Date(iso));
  } catch { return iso; }
}

const DAGNAMEN_VOLUIT = ["zondag","maandag","dinsdag","woensdag","donderdag","vrijdag","zaterdag"];
const MAANDEN = ["januari","februari","maart","april","mei","juni","juli","augustus","september","oktober","november","december"];

function dagVoluitLabel(dagKey) {
  const d = new Date(dagKey + "T12:00:00Z");
  return `${DAGNAMEN_VOLUIT[d.getUTCDay()]} ${d.getUTCDate()} ${MAANDEN[d.getUTCMonth()]}`;
}

// ── Highlight-station ─────────────────────────────────────────────────────────
function vulHighlightSelect() {
  const sel = document.getElementById("highlight-select");
  if (!sel) return;
  const namen = Object.values(gemeten.stations || {}).map(s => s.naam).sort((a, b) => a.localeCompare(b));
  sel.innerHTML = `<option value="">— hoogste (auto) —</option>` +
    namen.map(n => `<option value="${n}">${n}</option>`).join("");
  sel.onchange = () => {
    highlightManual = sel.value !== "";
    highlightStation = sel.value || null;
    if (!highlightManual) syncHighlightDefault(activeWeergave); // terug naar auto = #1
    tekenLabels(activeWeergave);
  };
}

function syncHighlightDefault(w) {
  // Zonder handmatige keuze: highlight = #1 (hoogste) van de dag.
  if (highlightManual) return;
  const items = stationWaarden(w).slice().sort((a, b) => b.hk - a.hk || a.naam.localeCompare(b.naam));
  highlightStation = items.length ? items[0].naam : null;
}

// ── Weergave-knoppen ──────────────────────────────────────────────────────────
function selectWeergave(w) {
  activeWeergave = w;
  document.querySelectorAll("#weergave-btns button").forEach(b =>
    b.classList.toggle("actief", b.dataset.w === w));
  bouwVeld(w);              // veld voor isolijnen
  syncHighlightDefault(w); // auto-highlight #1 als geen handmatige keuze
  tekenHeatmap();
  tekenLabels(w);
  const dagKey = dagKeyVoor(w);
  document.getElementById("kaart-dag-label").textContent = dagVoluitLabel(dagKey);
  document.getElementById("kaart-sub-label").textContent =
    w === "overmorgen" ? "Maximum hittekracht · indicatief (ensemble)"
                       : "Maximum hittekracht (KNMI-app)";
  document.getElementById("kaart-run-label").textContent =
    "KNMI-app · hittekracht-tegel per station";
  const opgehaald = utcNaarLokaal(gemeten.gegenereerd);
  document.getElementById("footer-run").textContent =
    `©Ed Aldus/KNMI · opgehaald ${opgehaald} uur`;
}

function bouwLegenda() {
  const wrap = document.getElementById("legenda-items");
  wrap.innerHTML = "";
  for (const { v, label } of HK_LEGENDA) {
    const [r, g, b] = hkRgb(v);
    const el = document.createElement("div");
    el.className = "legenda-item";
    el.innerHTML = `<span class="legenda-blok" style="background:rgb(${r},${g},${b})"></span>${label}`;
    wrap.appendChild(el);
  }
  document.getElementById("legenda-wrap").style.display = "";
}

// ── PNG export (zelfde opzet als mosmix_kaart_hittekracht.html) ───────────────
function svgDataUrl(svg, cssText = "") {
  const clone = svg.cloneNode(true);
  clone.setAttribute("xmlns", "http://www.w3.org/2000/svg");
  if (cssText) {
    const style = document.createElementNS("http://www.w3.org/2000/svg", "style");
    style.textContent = cssText;
    clone.insertBefore(style, clone.firstChild);
  }
  const xml = new XMLSerializer().serializeToString(clone);
  return "data:image/svg+xml;charset=utf-8," + encodeURIComponent(xml);
}

function laadImage(src) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => resolve(img);
    img.onerror = reject;
    img.src = src;
  });
}

function pasCanvasTekst(ctx, tekst, maxBreedte) {
  const str = String(tekst || "");
  if (ctx.measureText(str).width <= maxBreedte) return str;
  let kort = str;
  while (kort.length > 1 && ctx.measureText(kort + "...").width > maxBreedte) {
    kort = kort.slice(0, -1);
  }
  return kort + "...";
}

async function slaOp() {
  const ratio = 2;
  const w = 800, headerH = 86, mapH = 1100, footerH = 44, legendH = 54;
  const out = document.createElement("canvas");
  out.width = w * ratio;
  out.height = (headerH + mapH + footerH + legendH) * ratio;
  const ctx = out.getContext("2d");
  ctx.scale(ratio, ratio);

  ctx.fillStyle = "#1e293b";
  ctx.fillRect(0, 0, w, headerH);
  ctx.fillStyle = "#2ec4e8";
  ctx.fillRect(0, headerH - 3, w, 3);
  ctx.fillStyle = "#ffffff";
  ctx.font = "800 16px 'DM Sans', Arial, sans-serif";
  ctx.fillText("Ed Aldus WM", 20, 32);
  ctx.fillStyle = "#94a3b8";
  ctx.font = "500 11px 'DM Mono', monospace";
  ctx.fillText(pasCanvasTekst(ctx, document.getElementById("kaart-run-label").textContent || "KNMI-waarnemingen", 500), 20, 54);
  ctx.textAlign = "right";
  ctx.fillStyle = "#ffffff";
  ctx.font = "800 18px 'DM Sans', Arial, sans-serif";
  ctx.fillText(pasCanvasTekst(ctx, document.getElementById("kaart-dag-label").textContent || "", 260), w - 20, 32);
  ctx.fillStyle = "#cbd5e1";
  ctx.font = "500 11px 'DM Sans', Arial, sans-serif";
  ctx.fillText(pasCanvasTekst(ctx, document.getElementById("kaart-sub-label").textContent || "Gemeten hittekracht", 300), w - 20, 54);
  ctx.textAlign = "left";

  ctx.fillStyle = "#b8d4e8";
  ctx.fillRect(0, headerH, w, mapH);
  const svgCss = ".basemap-land{fill:#f5efd9}.basemap-prov{fill:none;stroke:rgba(255,255,255,0.7);stroke-width:0.6}.nl-buitengrens{fill:none;stroke:white;stroke-width:2;stroke-linejoin:round}";
  const baseImg = await laadImage(svgDataUrl(document.getElementById("basemap-svg"), svgCss));
  const overlayImg = await laadImage(svgDataUrl(document.getElementById("nl-overlay"), svgCss));
  ctx.drawImage(baseImg, 0, headerH, w, mapH);
  ctx.drawImage(document.getElementById("heatmap"), 0, headerH, w, mapH);
  ctx.drawImage(overlayImg, 0, headerH, w, mapH);

  const footerY = headerH + mapH;
  ctx.fillStyle = "#0f172a";
  ctx.fillRect(0, footerY, w, footerH);
  ctx.fillStyle = "#f1f5f9";
  ctx.font = "600 11px 'DM Sans', Arial, sans-serif";
  ctx.fillText("weerlab.nl", 20, footerY + 27);
  ctx.textAlign = "center";
  ctx.fillStyle = "#7dd3fc";
  ctx.font = "600 10px 'DM Mono', monospace";
  ctx.fillText(document.getElementById("kaart-bron-pill").textContent || "HITTEKRACHT · GEMETEN", w / 2, footerY + 27);
  ctx.textAlign = "right";
  ctx.fillStyle = "#94a3b8";
  ctx.font = "400 11px 'DM Sans', Arial, sans-serif";
  ctx.fillText(pasCanvasTekst(ctx, document.getElementById("footer-run").textContent || "KNMI Dataplatform", 410), w - 20, footerY + 27);
  ctx.textAlign = "left";

  const legendY = footerY + footerH;
  ctx.fillStyle = "#f6f8fb";
  ctx.fillRect(0, legendY, w, legendH);
  ctx.font = "400 10px 'DM Sans', Arial, sans-serif";
  const legendItems = HK_LEGENDA.map(({ v, label }) => {
    const [r, g, b] = hkRgb(v);
    return { label, kleur: `rgb(${r},${g},${b})`, width: 18 + ctx.measureText(label).width + 10 };
  });
  const legendTotal = legendItems.reduce((sum, item) => sum + item.width, 0) - 10;
  let lx = Math.max(16, (w - legendTotal) / 2);
  const ly = legendY + 22;
  for (const item of legendItems) {
    ctx.fillStyle = item.kleur;
    ctx.fillRect(lx, ly - 9, 12, 12);
    ctx.strokeStyle = "rgba(15,23,42,0.18)";
    ctx.strokeRect(lx, ly - 9, 12, 12);
    ctx.fillStyle = "#5a7090";
    ctx.fillText(item.label, lx + 18, ly + 1);
    lx += item.width;
  }

  const a = document.createElement("a");
  a.download = `hittekracht_app_${activeWeergave}_${dagKeyVoor(activeWeergave) || "kaart"}.png`;
  a.href = out.toDataURL("image/png");
  a.click();
}

// ── Init ──────────────────────────────────────────────────────────────────────
// Absolute URL t.o.v. het huidige document, zodat fetch ook werkt in contexten
// zonder geldige base-URL (relatieve fetch faalt daar met "Failed to parse URL").
function absUrl(pad) {
  const basis = document.baseURI || location.href;
  return new URL(pad, basis).href;
}

const DATA_CACHE_BUCKET = Math.floor(Date.now() / 300000);
let warmData = null;
try {
  if (parent !== window) warmData = parent.weerlabHittekrachtWarmPromise;
} catch {}
function laadHittekrachtData() {
  return Promise.all([
    fetch(absUrl("hittekracht_app.json?cb=" + DATA_CACHE_BUCKET)).then(r => {
      if (!r.ok) throw new Error("hittekrachtdata " + r.status);
      return r.json();
    }),
    fetch(absUrl("nl_provincies.geojson")).then(r => {
      if (!r.ok) throw new Error("provinciekaart " + r.status);
      return r.json();
    }),
  ]);
}
const dataPromise = warmData
  ? Promise.resolve(warmData).catch(() => laadHittekrachtData())
  : laadHittekrachtData();
dataPromise.then(([g, prov]) => {
  gemeten = g;
  provincies = prov;
  bouwBasemap();
  maakLandMask();
  bouwLegenda();
  vulHighlightSelect();
  document.getElementById("hdr-datum").textContent =
    `vandaag ${dagVoluitLabel(g.vandaag)} · opgehaald ${utcNaarLokaal(g.gegenereerd)} uur`;
  document.getElementById("status").style.display = "none";
  document.getElementById("kaart-wrap").style.display = "";
  document.querySelectorAll("#weergave-btns button").forEach(b =>
    b.addEventListener("click", () => selectWeergave(b.dataset.w)));
  selectWeergave("vandaag");
}).catch(e => {
  const s = document.getElementById("status");
  if (location.protocol === "file:") {
    s.textContent = "Open deze pagina via http (weerlab.nl of een lokale server) — " +
      "een los bestand (file://) mag geen data laden.";
  } else {
    s.textContent = "Laden mislukt: " + e.message;
  }
});
