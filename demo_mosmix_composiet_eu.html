<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MOSMIX Europa — alle composieten</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<script>
  (function(){
    function apply(t){ document.documentElement.setAttribute("data-theme", t === "dark" ? "dark" : "light"); }
    var saved = "light"; try { saved = localStorage.getItem("weerlab_theme") || "light"; } catch {}
    apply(saved);
    window.addEventListener("storage", function(e){ if (e.key === "weerlab_theme") apply(e.newValue); });
  })();
</script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: "DM Sans", ui-sans-serif, system-ui, sans-serif; background: #f6f8fb; color: #0f172a; }
  .page-header { background: #fff; padding: 14px 20px; border-bottom: 1px solid #e3e8ef; }
  .page-header h1 { font-size: 17px; font-weight: 700; }
  .page-header .sub { color: #64748b; font-size: 11px; margin-top: 2px; font-family: "DM Mono", monospace; }

  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; padding: 16px; max-width: 2200px; margin: 0 auto; }
  .tegel { background: #fff; border: 1px solid #e3e8ef; border-radius: 10px; overflow: hidden; display: flex; flex-direction: column; }
  .tegel-kop { display: flex; align-items: center; justify-content: space-between; padding: 10px 14px; border-bottom: 1px solid #e3e8ef; background: #fbfcfe; }
  .tegel-kop .titel { font-size: 13px; font-weight: 700; color: #0f172a; }
  .tegel-kop .acties { display: flex; gap: 10px; font-size: 11px; }
  .tegel-kop a { color: #1e40af; text-decoration: none; font-weight: 600; }
  .tegel-kop a:hover { text-decoration: underline; }
  .tegel iframe { width: 100%; height: 1100px; border: 0; display: block; background: #f6f8fb; }

  @media (max-width: 1100px){ .grid { grid-template-columns: 1fr; } }

  [data-theme="dark"] body { background:#0b1220 !important; color:#f1f5f9 !important; }
  [data-theme="dark"] .page-header { background:#111a2e !important; border-color:rgba(255,255,255,0.08) !important; }
  [data-theme="dark"] .page-header h1 { color:#f1f5f9 !important; }
  [data-theme="dark"] .page-header .sub { color:#94a3b8 !important; }
  [data-theme="dark"] .tegel { background:#111a2e !important; border-color:rgba(255,255,255,0.08) !important; }
  [data-theme="dark"] .tegel-kop { background:#0e1629 !important; border-color:rgba(255,255,255,0.08) !important; }
  [data-theme="dark"] .tegel-kop .titel { color:#f1f5f9 !important; }
  [data-theme="dark"] .tegel-kop a { color:#7dd3fc !important; }
</style>
</head>
<body>

<div class="page-header">
  <h1>MOSMIX Europa — alle composieten</h1>
  <div class="sub">Nederland · België · Frankrijk · Iberia (DWD MOSMIX, per land apart)</div>
</div>

<div class="grid">
  <div class="tegel">
    <div class="tegel-kop">
      <div class="titel">🇳🇱 Nederland</div>
      <div class="acties"><a href="demo_mosmix_composiet.html" target="_blank">open volledig ↗</a></div>
    </div>
    <iframe src="demo_mosmix_composiet.html" loading="lazy" title="MOSMIX Nederland"></iframe>
  </div>
  <div class="tegel">
    <div class="tegel-kop">
      <div class="titel">🇧🇪 België</div>
      <div class="acties"><a href="demo_mosmix_composiet_be.html" target="_blank">open volledig ↗</a></div>
    </div>
    <iframe src="demo_mosmix_composiet_be.html" loading="lazy" title="MOSMIX België"></iframe>
  </div>
  <div class="tegel">
    <div class="tegel-kop">
      <div class="titel">🇫🇷 Frankrijk</div>
      <div class="acties"><a href="demo_mosmix_composiet_fr.html" target="_blank">open volledig ↗</a></div>
    </div>
    <iframe src="demo_mosmix_composiet_fr.html" loading="lazy" title="MOSMIX Frankrijk"></iframe>
  </div>
  <div class="tegel">
    <div class="tegel-kop">
      <div class="titel">🇪🇸🇵🇹 Iberia (Spanje + Portugal)</div>
      <div class="acties"><a href="demo_mosmix_composiet_iberia.html" target="_blank">open volledig ↗</a></div>
    </div>
    <iframe src="demo_mosmix_composiet_iberia.html" loading="lazy" title="MOSMIX Iberia"></iframe>
  </div>
</div>

</body>
</html>
