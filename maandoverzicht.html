<style>

.stat.tx .stat-val { color: #c0392b; }
.stat.tn .stat-val { color: #2471a3; }
.stat.rr .stat-val { color: #1a7a4a; }
.stat.sq .stat-val { color: #e67e00; }
.stat-norm { font-size: 10px; color: #aaa; }
.dp { color: #c0392b; font-weight: 700; }
.dm { color: #2471a3; font-weight: 700; }
.tbl-wrap { padding: 12px 16px; overflow-x: auto; }
table { width: 100%; border-collapse: collapse; background: white; border-radius: 8px; overflow: hidden; box-shadow: 0 1px 4px rgba(0,0,0,0.07); min-width: 500px; }
thead tr { background: #0d2b5e; color: white; }
thead th { padding: 8px 10px; font-size: 11px; font-weight: 600; text-align: center; }

tbody tr.vd { background: #fff8e1 !important; font-weight: 600; }

.brr { background: #1a7a4a; }

  280:{1:{tx:5.2,tn:0.1,tg:2.8,rr:72.7,sq:60.7},2:{tx:6.0,tn:-0.1,tg:3.0,rr:54.7,sq:86.1},3:{tx:9.5,tn:1.4,tg:5.5,rr:54.1,sq:139.0},4:{tx:14.2,tn:3.7,tg:9.0,rr:41.3,sq:188.7},5:{tx:17.6,tn:7.0,tg:12.5,rr:57.9,sq:218.0},6:{tx:20.4,tn:9.9,tg:15.4,rr:65.0,sq:198.6},7:{tx:22.7,tn:12.2,tg:17.5,rr:85.0,sq:212.3},8:{tx:22.6,tn:11.9,tg:17.3,rr:77.8,sq:196.3},9:{tx:19.0,tn:9.4,tg:14.1,rr:75.4,sq:150.7},10:{tx:14.2,tn:6.3,tg:10.3,rr:71.4,sq:112.9},11:{tx:9.0,tn:3.2,tg:6.3,rr:70.0,sq:63.4},12:{tx:5.9,tn:0.8,tg:3.5,rr:79.4,sq:56.1}},

};

var ND=['zo','ma','di','wo','do','vr','za'];
var D={}, J=new Date().getFullYear(), M=new Date().getMonth()+1;
var hSt = STATIONS[6]; // Rotterdam default

function vulStations() {
  var sel = document.getElementById('ss');
  for (var i = 0; i < STATIONS.length; i++) {
    var o = document.createElement('option');
    o.value = i; o.textContent = STATIONS[i].naam;
    if (STATIONS[i].nr === 344) o.selected = true;
    sel.appendChild(o);
  }
}

function vulJaren() {
  var sel = document.getElementById('sj');
  for (var j = J; j >= 1957; j--) {
    var o = document.createElement('option');
    o.value = o.textContent = j;
    sel.appendChild(o);
  }
}

function sync() {
  document.getElementById('sm').value = M;
  document.getElementById('sj').value = J;
}

function sel() {
  M = +document.getElementById('sm').value;
  J = +document.getElementById('sj').value;
  toon();
}

function nav(d) {
  M += d;
  if (M > 12) { M = 1; J++; }
  if (M < 1)  { M = 12; J--; }
  sync(); toon();
}

function wisselStation() {
  var i = +document.getElementById('ss').value;
  hSt = STATIONS[i];
  laadData();
}

function laadData() {
  document.getElementById('msg').style.display = '';
  document.getElementById('msg').textContent = 'Laden...';
  document.getElementById('tbl').style.display = 'none';
  D = {};
  fetch(hSt.file + '?t=' + Date.now())
    .then(function(r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
    .then(function(j) {
      D = j.data || {};
      document.getElementById('bw').textContent = hSt.naam + ' (0' + hSt.nr + ') · ' + (j.bijgewerkt || '');
      toon();
    })
    .catch(function(e) { document.getElementById('msg').textContent = 'Fout: ' + e.message; });
}

function bouwIdx() {
  var ms = String(M).padStart(2,'0'), ix = {}, ks = Object.keys(D);
  for (var i = 0; i < ks.length; i++) {
    var k = ks[i];
    if (k.slice(5,7) !== ms) continue;
    var j = +k.slice(0,4);
    if (j === J) continue;
    if (!ix[j]) ix[j] = {tx:[],tn:[],tg:[],rr:[],sq:[]};
    var o = D[k];
    if (o.tx!=null) ix[j].tx.push(o.tx);
    if (o.tn!=null) ix[j].tn.push(o.tn);
    if (o.tg!=null) ix[j].tg.push(o.tg);
    if (o.rr!=null) ix[j].rr.push(o.rr);
    if (o.sq!=null) ix[j].sq.push(o.sq);
  }
  return ix;
}

function rang(val, veld, hoger, ix) {
  if (val == null) return '';
  var v = [], ks = Object.keys(ix);
  for (var i = 0; i < ks.length; i++) {
    var a = ix[ks[i]][veld] || [];
    if (a.length < 25) continue;
    var s = 0; for (var j = 0; j < a.length; j++) s += a[j];
    v.push(['tx','tn','tg'].indexOf(veld) >= 0 ? s/a.length : s);
  }
  if (!v.length) return '';
  var r = 1;
  for (var i = 0; i < v.length; i++) {
    if (hoger && v[i] > val) r++;
    if (!hoger && v[i] < val) r++;
  }
  return '<span class="rng">#' + r + '/' + (v.length + 1) + '</span>';
}

function ds(val, nm) {
  if (val == null || nm == null) return '';
  var d = val - nm, s = d >= 0 ? '+' : '', c = d > 0.05 ? 'dp' : d < -0.05 ? 'dm' : '';
  return ' <span class="' + c + '">' + s + d.toFixed(1) + '</span>';
}

function f(v) { return v != null ? v.toFixed(1) : '&#8211;'; }

function toon() {
  sync();
  var vd = new Date().toISOString().slice(0,10);
  var nm = (ALLE_NM[hSt.nr] || {})[M] || {};
  var ad = new Date(J, M, 0).getDate();
  var ms = String(M).padStart(2,'0');
  var tx=[],tn=[],tg=[],rr=[],sq=[], rows=[];

  for (var d = 1; d <= ad; d++) {
    var k = J + '-' + ms + '-' + String(d).padStart(2,'0');
    var o = D[k] || null;
    rows.push({d:d, k:k, o:o, vd:k===vd, tk:k>vd});
    if (!o) continue;
    if (o.tx!=null) tx.push(o.tx);
    if (o.tn!=null) tn.push(o.tn);
    if (o.tg!=null) tg.push(o.tg);
    if (o.rr!=null) rr.push(o.rr);
    if (o.sq!=null) sq.push(o.sq);
  }

  function gm(a) { if (!a.length) return null; var s=0; for(var i=0;i<a.length;i++) s+=a[i]; return s/a.length; }
  function sm(a) { if (!a.length) return null; var s=0; for(var i=0;i<a.length;i++) s+=a[i]; return s; }

  var txG=gm(tx), tnG=gm(tn), tgG=gm(tg), rrS=sm(rr), sqS=sm(sq);

  document.getElementById('st').innerHTML = [
    {c:'tx',l:'Gem. TX',v:txG,e:'°',nm:nm.tx},
    {c:'tn',l:'Gem. TN',v:tnG,e:'°',nm:nm.tn},
    {c:'tg',l:'Gem. TG',v:tgG,e:'°',nm:nm.tg},
    {c:'rr',l:'Neerslag',v:rrS,e:' mm',nm:nm.rr},
    {c:'sq',l:'Zonneschijn',v:sqS,e:' u',nm:nm.sq}
  ].map(function(s) {
    return '<div class="stat ' + s.c + '"><div class="stat-lbl">' + s.l + '</div>' +
      '<div class="stat-val">' + (s.v!=null ? s.v.toFixed(1)+s.e : '&#8211;') + '</div>' +
      (s.nm!=null ? '<div class="stat-norm">Normaal: ' + s.nm + s.e + ds(s.v,s.nm) + '</div>' : '') +
      '</div>';
  }).join('');

  var mxR = Math.max.apply(null, rr.length ? rr : [0.1]);
  var mxS = Math.max.apply(null, sq.length ? sq : [0.1]);
  var h = '';
  for (var i = 0; i < rows.length; i++) {
    var r = rows[i], dt = new Date(r.k+'T12:00:00');
    var cl = r.vd ? 'vd' : r.tk ? 'tk' : '';
    var dn = ND[dt.getDay()] + ' ' + r.d + (r.vd ? ' &#8592;' : '');
    if (!r.o) { h += '<tr class="'+cl+'"><td>'+dn+'</td><td>&#8211;</td><td>&#8211;</td><td>&#8211;</td><td>&#8211;</td><td>&#8211;</td></tr>'; continue; }
    var o = r.o;
    var rB = o.rr!=null ? '<span class="bar brr" style="width:'+Math.min(o.rr/mxR*50,50).toFixed(0)+'px"></span>'+o.rr.toFixed(1) : '&#8211;';
    var sB = o.sq!=null ? '<span class="bar bsq" style="width:'+Math.min(o.sq/mxS*50,50).toFixed(0)+'px"></span>'+o.sq.toFixed(1)+'u' : '&#8211;';
    h += '<tr class="'+cl+'"><td>'+dn+'</td><td class="tx">'+f(o.tx)+'°</td><td class="tn">'+f(o.tn)+'°</td><td>'+(o.tg!=null?o.tg.toFixed(1)+'°':'&#8211;')+'</td><td class="rr">'+rB+'</td><td class="sq">'+sB+'</td></tr>';
  }
  document.getElementById('tb').innerHTML = h;

  var ix = bouwIdx();
  document.getElementById('tf').innerHTML = '<tr>' +
    '<td>Gem/som ('+tx.length+' dgn)</td>' +
    '<td class="tx">'+(txG!=null?txG.toFixed(1)+'°'+rang(txG,'tx',true,ix):'&#8211;')+'</td>' +
    '<td class="tn">'+(tnG!=null?tnG.toFixed(1)+'°'+rang(tnG,'tn',true,ix):'&#8211;')+'</td>' +
    '<td>'+(tgG!=null?tgG.toFixed(1)+'°'+rang(tgG,'tg',true,ix):'&#8211;')+'</td>' +
    '<td class="rr">'+(rrS!=null?rrS.toFixed(1)+' mm'+rang(rrS,'rr',false,ix):'&#8211;')+'</td>' +
    '<td class="sq">'+(sqS!=null?sqS.toFixed(1)+' u'+rang(sqS,'sq',true,ix):'&#8211;')+'</td>' +
    '</tr>';

  document.getElementById('msg').style.display = 'none';
  document.getElementById('tbl').style.display = '';
  tekenGrafiek();
}

vulStations();
vulJaren();
sync();
laadData();

// ── Grafiek ───────────────────────────────────────────────────────────────────
var grafiek = null;
var grafiekLijnen = { tx: true, tn: true, tg: false, rr: true, sq: true };
var NL_MAANDEN_LANG = ["","januari","februari","maart","april","mei","juni","juli","augustus","september","oktober","november","december"];

function toggleGrafiekLijn(key, el) {
  grafiekLijnen[key] = !grafiekLijnen[key];
  el.classList.toggle('act', grafiekLijnen[key]);
  tekenGrafiek();
}

function tekenGrafiek() {
  var ms = String(M).padStart(2,'0');
  var ad = new Date(J, M, 0).getDate();
  var labels = [], tx = [], tn = [], tg = [], rr = [], sq = [];

  for (var d = 1; d <= ad; d++) {
    var k = J + '-' + ms + '-' + String(d).padStart(2,'0');
    labels.push(d);
    var o = D[k] || null;
    tx.push(o && o.tx != null ? o.tx : null);
    tn.push(o && o.tn != null ? o.tn : null);
    tg.push(o && o.tg != null ? o.tg : null);
    rr.push(o && o.rr != null ? o.rr : null);
    sq.push(o && o.sq != null ? o.sq : null);
  }

  var nm = (ALLE_NM[hSt.nr] || {})[M] || {};

  var datasets = [];

  if (grafiekLijnen.tx) datasets.push({
    label: 'TX max (°C)', data: tx, type: 'line',
    borderColor: '#c0392b', backgroundColor: 'rgba(192,57,43,0.08)',
    borderWidth: 2, pointRadius: 3, pointHoverRadius: 5,
    tension: 0.3, yAxisID: 'yTemp', spanGaps: true,
  });
  if (grafiekLijnen.tn) datasets.push({
    label: 'TN min (°C)', data: tn, type: 'line',
    borderColor: '#2471a3', backgroundColor: 'rgba(36,113,163,0.08)',
    borderWidth: 2, pointRadius: 3, pointHoverRadius: 5,
    tension: 0.3, yAxisID: 'yTemp', spanGaps: true,
  });
  if (grafiekLijnen.tg) datasets.push({
    label: 'TG gem (°C)', data: tg, type: 'line',
    borderColor: '#888', backgroundColor: 'rgba(100,100,100,0.05)',
    borderWidth: 1.5, pointRadius: 2, borderDash: [4,3],
    tension: 0.3, yAxisID: 'yTemp', spanGaps: true,
  });
  if (grafiekLijnen.rr) datasets.push({
    label: 'Neerslag (mm)', data: rr, type: 'bar',
    backgroundColor: 'rgba(26,122,74,0.7)', borderColor: '#1a7a4a',
    borderWidth: 1, yAxisID: 'yBar', order: 2,
  });
  if (grafiekLijnen.sq) datasets.push({
    label: 'Zon (uur)', data: sq, type: 'bar',
    backgroundColor: 'rgba(230,126,0,0.6)', borderColor: '#e67e00',
    borderWidth: 1, yAxisID: 'yBar', order: 3,
  });

  // Normaallijnen als annotatie via horizontale dataset
  if (grafiekLijnen.tx && nm.tx != null) datasets.push({
    label: 'Normaal TX', data: Array(ad).fill(nm.tx), type: 'line',
    borderColor: 'rgba(192,57,43,0.35)', borderWidth: 1, borderDash: [5,4],
    pointRadius: 0, yAxisID: 'yTemp', spanGaps: true,
  });
  if (grafiekLijnen.tn && nm.tn != null) datasets.push({
    label: 'Normaal TN', data: Array(ad).fill(nm.tn), type: 'line',
    borderColor: 'rgba(36,113,163,0.35)', borderWidth: 1, borderDash: [5,4],
    pointRadius: 0, yAxisID: 'yTemp', spanGaps: true,
  });

  var heeftTemp = grafiekLijnen.tx || grafiekLijnen.tn || grafiekLijnen.tg;
  var heeftBar  = grafiekLijnen.rr || grafiekLijnen.sq;

  var ctx = document.getElementById('grafiek-canvas').getContext('2d');
  if (grafiek) { grafiek.destroy(); grafiek = null; }

  grafiek = new Chart(ctx, {
    data: { labels: labels, datasets: datasets },
    options: {
      responsive: true, maintainAspectRatio: true,
      interaction: { mode: 'index', intersect: false },
      plugins: {
        legend: {
          display: true,
          labels: { font: { size: 11 }, boxWidth: 14, padding: 10,
            filter: function(item) { return !item.text.startsWith('Normaal'); }
          }
        },
        tooltip: {
          callbacks: {
            label: function(c) {
              if (c.parsed.y == null) return null;
              return c.dataset.label + ': ' + c.parsed.y.toFixed(1);
            }
          }
        }
      },
      scales: {
        x: {
          grid: { color: 'rgba(0,0,0,0.06)' },
          ticks: { color: '#7a90a8', font: { size: 10 } }
        },
        yTemp: {
          display: heeftTemp,
          position: 'left',
          grid: { color: 'rgba(0,0,0,0.06)' },
          ticks: { color: '#7a90a8', font: { size: 10 },
            callback: function(v) { return v.toFixed(0) + '°'; }
          },
          title: { display: true, text: 'Temperatuur (°C)', color: '#7a90a8', font: { size: 10 } }
        },
        yBar: {
          display: heeftBar,
          position: 'right',
          min: 0,
          grid: { drawOnChartArea: false },
          ticks: { color: '#7a90a8', font: { size: 10 } },
          title: { display: true, text: 'mm / uur', color: '#7a90a8', font: { size: 10 } }
        }
      }
    }
  });

  document.getElementById('grafiek-wrap').style.display = 'block';
  var mnaam = NL_MAANDEN_LANG[M];
  document.getElementById('grafiek-titel').textContent =
    hSt.naam + ' – ' + mnaam.charAt(0).toUpperCase() + mnaam.slice(1) + ' ' + J;
}

function downloadGrafiek() {
  var canvas = document.getElementById('grafiek-canvas');
  var mnaam = NL_MAANDEN_LANG[M];
  // Maak tijdelijk canvas met witte achtergrond
  var tmp = document.createElement('canvas');
  tmp.width = canvas.width;
  tmp.height = canvas.height;
  var ctx2 = tmp.getContext('2d');
  ctx2.fillStyle = 'white';
  ctx2.fillRect(0, 0, tmp.width, tmp.height);
  ctx2.drawImage(canvas, 0, 0);
  var a = document.createElement('a');
  a.download = hSt.naam + '_' + mnaam + '_' + J + '.png';
  a.href = tmp.toDataURL('image/png');
  a.click();
}
</script>
