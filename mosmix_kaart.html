<script>
const LON_MIN=3.3, LON_MAX=7.4, LAT_MIN=50.45, LAT_MAX=53.8;
const SVG_W=800, SVG_H=1100;
function lonToX(lon) { return (lon - LON_MIN) / (LON_MAX - LON_MIN) * SVG_W; }
function latToY(lat) { return (1 - (lat - LAT_MIN) / (LAT_MAX - LAT_MIN)) * SVG_H; }

const PARAMS = {
  TX:  { label:"Maximum temperatuur (°C)", eenheid:"°", decimalen:1,
    kleuren:[["#084594","≤0°"],["#4292c6","5°"],["#9ecae1","10°"],["#ffffcc","15°"],["#fed976","20°"],["#fd8d3c","25°"],["#e31a1c","30°"],["#800026","35°+"]],
    schaal:[-5,35] },
  TN:  { label:"Minimum temperatuur (°C)", eenheid:"°", decimalen:1,
    kleuren:[["#1a3a6b","≤-10°"],["#2980b9","-5°"],["#a8d8ea","0°"],["#ffffcc","5°"],["#fed976","10°"],["#fd8d3c","15°"],["#e31a1c","20°+"]],
    schaal:[-10,20] },
  RR:  { label:"Neerslag totaal (mm)", eenheid:" mm", decimalen:1,
    kleuren:[["#f7fbff","0"],["#c6dbef","2"],["#6baed6","5"],["#2171b5","10"],["#084594","20"],["#4a0080","30+"]],
    schaal:[0,30] },
  RR_D:{ label:"Neerslag dag 06–18u (mm)", eenheid:" mm", decimalen:1,
    kleuren:[["#f7fbff","0"],["#c6dbef","2"],["#6baed6","5"],["#2171b5","10"],["#084594","20"],["#4a0080","30+"]],
    schaal:[0,30] },
  RR_N:{ label:"Neerslag nacht 18–06u (mm)", eenheid:" mm", decimalen:1, nacht:true,
    kleuren:[["#f7fbff","0"],["#c6dbef","2"],["#6baed6","5"],["#2171b5","10"],["#084594","20"],["#4a0080","30+"]],
    schaal:[0,30] },
  FF:  { label:"Max. windsnelheid dag 06–18u (Bft)", eenheid:" Bft", decimalen:0, bft:true, ddParam:"DD",
    kleuren:[["#e8f5e9","1-2"],["#a5d6a7","3"],["#ffeb3b","4"],["#ff9800","5"],["#f44336","6"],["#b71c1c","7+"]],
    schaal:[0,50] },
  FF_N:{ label:"Max. windsnelheid nacht 18–06u (Bft)", eenheid:" Bft", decimalen:0, bft:true, ddParam:"DD_N", nacht:true,
    kleuren:[["#e8f5e9","1-2"],["#a5d6a7","3"],["#ffeb3b","4"],["#ff9800","5"],["#f44336","6"],["#b71c1c","7+"]],
    schaal:[0,50] },
  FX:  { label:"Max. windstoot dag 06–18u (km/h)", eenheid:" km/h", decimalen:0,
    kleuren:[["#e8f5e9","20"],["#a5d6a7","40"],["#ffeb3b","60"],["#ff9800","80"],["#f44336","100"],["#b71c1c","120+"]],
    schaal:[20,120] },
  FX_N:{ label:"Max. windstoot nacht 18–06u (km/h)", eenheid:" km/h", decimalen:0, nacht:true,
    kleuren:[["#e8f5e9","20"],["#a5d6a7","40"],["#ffeb3b","60"],["#ff9800","80"],["#f44336","100"],["#b71c1c","120+"]],
    schaal:[20,120] },
  DD:  { label:"Windrichting (°)", eenheid:"°", decimalen:0,
    kleuren:[["#42a5f5","N"],["#66bb6a","O"],["#ffa726","Z"],["#ef5350","W"],["#42a5f5","N"]],
    schaal:[0,360] },
  SQ:  { label:"Zonneschijn (uur)", eenheid:" u", decimalen:1,
    kleuren:[["#888888","0u"],["#c8c8c8","2u"],["#FFB347","5u"],["#FFC200","8u"],["#FFD700","12u+"]],
    schaal:[0,12] },
  TTD: { label:"Dauwpunt min (°C)", eenheid:"°", decimalen:1,
    kleuren:[["#1a3a6b","≤-5°"],["#2980b9","0°"],["#a8d8ea","5°"],["#ffffcc","10°"],["#fed976","15°"],["#fd8d3c","20°+"]],
    schaal:[-5,20] },
  Neff:{ label:"Bewolking (%)", eenheid:"%", decimalen:0,
    kleuren:[["#FFD700","0%"],["#ffe066","25%"],["#c8c8c8","50%"],["#888888","75%"],["#444444","100%"]],
    schaal:[0,100] },
  gevoels: { label:"Gevoelstemperatuur min (°C)", eenheid:"°", decimalen:1,
    kleuren:[["#4a0080","≤-15°"],["#1a3a6b","-10°"],["#2980b9","-5°"],["#a8d8ea","0°"],["#e8f4f8","5°"],["#ffffcc","10°+"]],
    schaal:[-15,10] },
  wwM: { label:"Mistkans (%)", eenheid:"%", decimalen:0,
    kleuren:[["#f7fbff","0%"],["#c6dbef","10%"],["#6baed6","30%"],["#2171b5","50%"],["#084594","70%"],["#4a0080","90%+"]],
    schaal:[0,90] },
  VV:  { label:"Minimum zicht (km)", eenheid:" km", decimalen:1,
    kleuren:[["#4a0080","≤0.2"],["#084594","0.5"],["#6baed6","1"],["#c6dbef","2"],["#ffffcc","5"],["#f7fbff","10+"]],
    schaal:[0,10] },
  wwZ: { label:"Hagelkans (%)", eenheid:"%", decimalen:0,
    kleuren:[["#f7fbff","0%"],["#c6dbef","5%"],["#ffeb3b","15%"],["#ff9800","30%"],["#f44336","50%"],["#b71c1c","70%+"]],
    schaal:[0,70] },
  RV_M: { label:"Laagste luchtvochtigheid middag 12–18u (%)", eenheid:"%", decimalen:0,
    kleuren:[["#b71c1c","≤20%"],["#ff9800","30%"],["#ffeb3b","40%"],["#a5d6a7","50%"],["#66bb6a","60%"],["#2171b5","80%"],["#084594","100%"]],
    schaal:[20,100] },
  WBGT_O: { label:"WBGT ochtend 06–12u (°C)", eenheid:"°", decimalen:1,
    kleuren:[["#2171b5","<10"],["#66bb6a","13"],["#ffeb3b","18"],["#ff9800","22"],["#f44336","26"],["#b71c1c","30+"]],
    schaal:[5,30] },
  WBGT_M: { label:"WBGT middag 12–18u (°C)", eenheid:"°", decimalen:1,
    kleuren:[["#2171b5","<10"],["#66bb6a","13"],["#ffeb3b","18"],["#ff9800","22"],["#f44336","26"],["#b71c1c","30+"]],
    schaal:[5,30] },
};

function hexToRgb(hex) {
  return [parseInt(hex.slice(1,3),16),parseInt(hex.slice(3,5),16),parseInt(hex.slice(5,7),16)];
}
function interpKleur(val, schaal, stops) {
  const t = Math.max(0,Math.min(1,(val-schaal[0])/(schaal[1]-schaal[0])));
  const colors = stops.map(s=>hexToRgb(s[0]));
  const idx = Math.min(colors.length-2, Math.floor(t*(colors.length-1)));
  const f = t*(colors.length-1)-idx;
  const a=colors[idx],b=colors[idx+1];
  const r=Math.round(a[0]+f*(b[0]-a[0])), g=Math.round(a[1]+f*(b[1]-a[1])), bl=Math.round(a[2]+f*(b[2]-a[2]));
  const lum=(0.299*r+0.587*g+0.114*bl)/255;
  return [`rgb(${r},${g},${bl})`, lum<0.55?"white":"#222"];
}

function ns(tag) { return document.createElementNS("http://www.w3.org/2000/svg",tag); }

function windpijl(graden) {
  // Pijl wijst waarheen de wind WAAIT (NW-wind → pijl ↘)
  const pijlen = ["↓","↙","←","↖","↑","↗","→","↘","↓"];
  if (graden == null) return "";
  return pijlen[Math.round(graden/45) % 8];
}

function kmhNaarBft(kmh) {
  const grenzen = [1,6,12,20,29,39,50,62,75,89,103,118];
  for (let i = 0; i < grenzen.length; i++) { if (kmh < grenzen[i]) return i; }
  return 12;
}

function tekenKaart() {
  const svg = document.getElementById("nl-kaart");
  svg.innerHTML = "";
  const p = PARAMS[huidigParam];
  if (!p) return;

  const dagObj = mosmixData.data[huidigDag];
  if (!dagObj || !dagObj[huidigParam]) return;

  const paramData = dagObj[huidigParam];
  const stations = mosmixData.stations;

  // Sorteer stations op waarde voor ranking
  let items = Object.entries(paramData)
    .filter(([naam]) => stations[naam])
    .map(([naam, val]) => ({naam, val, lon: stations[naam][0], lat: stations[naam][1]}));

  // Sorteer: hoog→laag voor de meeste, laag→hoog voor bewolking-inverse
  const invertSort = ["TN","TTD","gevoels","VV"];
  items.sort((a,b) => invertSort.includes(huidigParam) ? a.val - b.val : b.val - a.val);

  // Teken elk station
  items.forEach((item, idx) => {
    const cx = lonToX(item.lon), cy = latToY(item.lat);
    const [bg, fg] = interpKleur(item.val, p.schaal, p.kleuren);

    let tekst;
    if (huidigParam === "DD") {
      tekst = windpijl(item.val) + " " + item.val.toFixed(0);
    } else if (p.bft) {
      tekst = kmhNaarBft(item.val) + " Bft";
    } else if (huidigParam === "VV" && item.val < 10) {
      tekst = Math.round(item.val * 1000) + "m";
    } else {
      tekst = item.val.toFixed(p.decimalen);
    }

    const g = ns("g");
    const r = 22;

    // Cirkel
    const circle = ns("circle");
    circle.setAttribute("cx", cx); circle.setAttribute("cy", cy);
    circle.setAttribute("r", r);
    circle.setAttribute("fill", bg);
    circle.setAttribute("stroke", idx === 0 ? "#cc0000" : idx === 1 ? "#e6a800" : idx === 2 ? "#888" : "white");
    circle.setAttribute("stroke-width", idx <= 2 ? "3" : "1.5");
    g.appendChild(circle);

    // Buitenste ring top 2
    if (idx <= 1) {
      const ring = ns("circle");
      ring.setAttribute("cx", cx); ring.setAttribute("cy", cy);
      ring.setAttribute("r", r + 5);
      ring.setAttribute("fill", "none");
      ring.setAttribute("stroke", idx === 0 ? "#cc0000" : "#e6a800");
      ring.setAttribute("stroke-width", "2");
      ring.setAttribute("stroke-dasharray", idx === 0 ? "5,3" : "4,4");
      g.appendChild(ring);
    }

    // Windpijl naast cirkel (alleen bij wind parameters)
    if (p.bft) {
      const ddKey = p.ddParam || "DD";
      const ddData = dagObj[ddKey];
      const dd = ddData ? ddData[item.naam] : null;
      const pijl = windpijl(dd);
      if (pijl) {
        const pijlText = ns("text");
        pijlText.setAttribute("x", cx + r + 10); pijlText.setAttribute("y", cy + 6);
        pijlText.setAttribute("text-anchor", "middle");
        pijlText.setAttribute("font-size", "24"); pijlText.setAttribute("font-weight", "900");

const NL_DAGEN = ["Zondag","Maandag","Dinsdag","Woensdag","Donderdag","Vrijdag","Zaterdag"];
const NL_MND = ["","jan","feb","mrt","apr","mei","jun","jul","aug","sep","okt","nov","dec"];
function dagLabel(d) { return `${NL_DAGEN[d.getDay()]} ${d.getDate()} ${NL_MND[d.getMonth()+1]}`; }

let mosmixData = null, huidigParam = "TX", huidigDag = "";
let gridModus = false, kwamuUitGrid = false;

function toggleWeergave() {
  if (kwamuUitGrid && !gridModus) {
    // Terug naar grid vanuit enkele kaart
    gridModus = true;
    kwamuUitGrid = false;
  } else {
    gridModus = !gridModus;
    kwamuUitGrid = false;
  }
  document.getElementById("single-view").style.display = gridModus ? "none" : "flex";
  document.getElementById("grid-view").style.display = gridModus ? "grid" : "none";
  const btn = document.getElementById("btn-weergave");
  btn.textContent = gridModus ? "🗺 Enkele kaart" : "📊 Alle dagen";
  btn.classList.toggle("actief", gridModus);
  document.querySelectorAll(".btn-dag").forEach(b => b.style.opacity = gridModus ? "0.4" : "1");
  if (gridModus) tekenGrid();
}

function tekenGrid() {
  if (!mosmixData) return;
  const container = document.getElementById("grid-view");
  container.innerHTML = "";
  const p = PARAMS[huidigParam];
  if (!p) return;

  mosmixData.dagen.forEach(dagKey => {
    const dagObj = mosmixData.data[dagKey];
    if (!dagObj || !dagObj[huidigParam]) return;
    const d = new Date(dagKey + "T12:00:00");
    const label = dagLabel(d);

    const card = document.createElement("div");
    card.className = "grid-card";
    card.onclick = () => {
      gridModus = false;
      kwamuUitGrid = true;
      document.getElementById("single-view").style.display = "flex";
      document.getElementById("grid-view").style.display = "none";
      document.getElementById("btn-weergave").textContent = "← Terug naar alle dagen";
      document.getElementById("btn-weergave").classList.add("actief");
      document.querySelectorAll(".btn-dag").forEach(b => b.style.opacity = "1");
      huidigDag = dagKey;
      document.querySelectorAll(".btn-dag").forEach(b => b.classList.toggle("actief", b.dataset.dag === dagKey));
      update();
    };

    // Header
    const header = document.createElement("div");
    header.className = "grid-card-header";
    header.innerHTML = `<span>${label}</span><span class="sub">${p.label}</span>`;
    card.appendChild(header);

    // Body met kaart + SVG
    const body = document.createElement("div");
    body.className = "grid-card-body";
    const img = document.createElement("img");
    img.src = "kaart_basis_nl.png";
    if (p.nacht) img.style.filter = "brightness(0.55) saturate(0.7)";
    body.appendChild(img);

    const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
    svg.setAttribute("viewBox", "0 0 800 1100");
    tekenKaartOpSvg(svg, dagKey, huidigParam);
    body.appendChild(svg);
    card.appendChild(body);

    container.appendChild(card);
  });
}

function tekenKaartOpSvg(svg, dagKey, param) {
  const p = PARAMS[param];
  const dagObj = mosmixData.data[dagKey];
  if (!dagObj || !dagObj[param]) return;
  const paramData = dagObj[param];
  const stations = mosmixData.stations;

  let items = Object.entries(paramData)
    .filter(([naam]) => stations[naam])
    .map(([naam, val]) => ({naam, val, lon: stations[naam][0], lat: stations[naam][1]}));

  const invertSort = ["TN","TTD","gevoels","VV"];
  items.sort((a,b) => invertSort.includes(param) ? a.val - b.val : b.val - a.val);

  items.forEach((item, idx) => {
    const cx = lonToX(item.lon), cy = latToY(item.lat);
    const [bg, fg] = interpKleur(item.val, p.schaal, p.kleuren);

    let tekst;
    if (param === "DD") {
      tekst = windpijl(item.val) + item.val.toFixed(0);
    } else if (p.bft) {
      tekst = kmhNaarBft(item.val) + " Bft";
    } else if (param === "VV" && item.val < 10) {
      tekst = Math.round(item.val * 1000) + "m";
    } else {
      tekst = item.val.toFixed(p.decimalen);
    }

    const g = ns("g");
    const circle = ns("circle");
    circle.setAttribute("cx", cx); circle.setAttribute("cy", cy);
    circle.setAttribute("r", 22); circle.setAttribute("fill", bg);
    circle.setAttribute("stroke", idx === 0 ? "#cc0000" : idx === 1 ? "#e6a800" : "white");
    circle.setAttribute("stroke-width", idx <= 1 ? "3" : "1.5");
    g.appendChild(circle);

    // Windpijl naast cirkel
    if (p.bft) {
      const ddKey = p.ddParam || "DD";
      const ddData = dagObj[ddKey];
      const dd = ddData ? ddData[item.naam] : null;
      const pijl = windpijl(dd);
      if (pijl) {
        const pijlText = ns("text");
        pijlText.setAttribute("x", cx + 22 + 10); pijlText.setAttribute("y", cy + 6);
        pijlText.setAttribute("text-anchor", "middle");
        pijlText.setAttribute("font-size", "20"); pijlText.setAttribute("font-weight", "900");
        pijlText.setAttribute("font-family", "Arial,sans-serif");
        pijlText.setAttribute("fill", "#222");
        pijlText.setAttribute("stroke", "#222"); pijlText.setAttribute("stroke-width", "0.8");
        pijlText.textContent = pijl;
        g.appendChild(pijlText);
      }
    }

    const text = ns("text");
    text.setAttribute("x", cx); text.setAttribute("y", cy + 4);
    text.setAttribute("text-anchor", "middle");
    const klein = (param === "VV" && item.val < 10);
    text.setAttribute("font-size", klein ? "9" : "12"); text.setAttribute("font-weight", "bold");
    text.setAttribute("font-family", "Arial,sans-serif"); text.setAttribute("fill", fg);
    text.textContent = tekst;
    g.appendChild(text);
    svg.appendChild(g);
  });
}

function runLabel() {
  if (!mosmixData || !mosmixData.run) return "DWD MOSMIX voorspelling";
  const rd = new Date(mosmixData.run);
  const uur = rd.getUTCHours().toString().padStart(2,"0");
  return "DWD MOSMIX  ·  run: " + uur + " UTC";
}

function update() {
  if (!mosmixData || !huidigDag) return;
  if (gridModus) { tekenGrid(); return; }
  const d = new Date(huidigDag + "T12:00:00");
  document.getElementById("hdr-datum").textContent = dagLabel(d);
  document.getElementById("kaart-dag-label").textContent = dagLabel(d);
  document.getElementById("kaart-subtitel").textContent = PARAMS[huidigParam]?.label || huidigParam;
  document.getElementById("kaart-run-label").textContent = runLabel();
  // Donkere kaart bij nachtparameters
  const isNacht = PARAMS[huidigParam]?.nacht;
  document.getElementById("kaart-basis").style.filter = isNacht ? "brightness(0.55) saturate(0.7)" : "";
  tekenKaart();
  maakLegenda();
}

// Opslaan als PNG
function slaOp() {
  const img = document.getElementById("kaart-basis");
  const svg = document.getElementById("nl-kaart");
  const header = document.getElementById("kaart-header");
  const canvas = document.createElement("canvas");
  const scale = 2;
  canvas.width = img.naturalWidth * scale;
  canvas.height = (img.naturalHeight + header.offsetHeight) * scale;
  const ctx = canvas.getContext("2d");
  ctx.scale(scale, scale);
  tekenHeaderCanvas(ctx, img.naturalWidth, header.offsetHeight);
  ctx.drawImage(img, 0, header.offsetHeight);
  const svgStr = new XMLSerializer().serializeToString(svg);
  const blob = new Blob([svgStr],{type:"image/svg+xml"});
  const url = URL.createObjectURL(blob);
  const svgImg = new Image();
  svgImg.onload = () => {
    ctx.drawImage(svgImg, 0, header.offsetHeight, img.naturalWidth, img.naturalHeight);
    URL.revokeObjectURL(url);
    const a = document.createElement("a");
    a.href = canvas.toDataURL("image/png");
    a.download = `mosmix_${huidigParam}_${huidigDag}.png`;
    a.click();
  };
  svgImg.src = url;
}

function tekenHeaderCanvas(ctx, breedte, hoogte) {
  ctx.fillStyle = "#003366";
  ctx.fillRect(0, 0, breedte, hoogte);
  ctx.fillStyle = "#4a90c4";
  ctx.fillRect(0, hoogte-2, breedte, 2);
  ctx.fillStyle = "white"; ctx.font = "bold 14px Arial"; ctx.textAlign = "left";
  ctx.fillText("Ed Aldus WM", 14, 20);
  ctx.fillStyle = "#a8c8e8"; ctx.font = "10px Arial";
  ctx.fillText(runLabel(), 14, 34);
  ctx.fillStyle = "white"; ctx.font = "bold 14px Arial"; ctx.textAlign = "right";
  ctx.fillText(document.getElementById("kaart-dag-label").textContent, breedte-14, 20);
  ctx.fillStyle = "#a8c8e8"; ctx.font = "10px Arial";
  ctx.fillText(document.getElementById("kaart-subtitel").textContent, breedte-14, 34);
  ctx.textAlign = "left";
}

// Init
const imgEl = document.getElementById("kaart-basis");
function startLaad() {
  leesUrlParams();
  fetch("mosmix_nl.json?t="+Date.now()).then(r=>r.json()).then(data => {
    mosmixData = data;
    // Run-info tonen
    let updateTekst = "Bijgewerkt: " + data.bijgewerkt.replace("T"," ");
    if (data.run) {
      const rd = new Date(data.run);
      const runUur = rd.getUTCHours().toString().padStart(2,"0");
      const runDag = rd.getUTCDate() + "-" + (rd.getUTCMonth()+1) + "-" + rd.getUTCFullYear();
      updateTekst += "  ·  Run: " + runDag + " " + runUur + " UTC";
    }
    document.getElementById("hdr-update").textContent = updateTekst;
    document.getElementById("status").textContent = "";

    // Dag-knoppen
    const dagBtns = document.getElementById("dag-btns");
    const vandaag = new Date().toISOString().slice(0,10);
    data.dagen.forEach((key, i) => {
      const d = new Date(key + "T12:00:00");
      let lbl;
      if (key === vandaag) lbl = "Vandaag";
      else if (i === 0 || (i === 1 && data.dagen[0] === vandaag)) {
        const diff = Math.round((d - new Date(vandaag+"T12:00:00")) / 86400000);
        lbl = diff === 1 ? "Morgen" : dagLabel(d);
      } else {
        lbl = NL_DAGEN[d.getDay()].slice(0,2) + " " + d.getDate() + "/" + (d.getMonth()+1);
      }
      const btn = document.createElement("button");
      btn.className = "btn-dag" + (i === 0 ? " actief" : "");
      btn.dataset.dag = key;
      btn.textContent = lbl;
      btn.onclick = () => {
        huidigDag = key;
        document.querySelectorAll(".btn-dag").forEach(b => b.classList.remove("actief"));
        btn.classList.add("actief");
        update();
      };
      dagBtns.appendChild(btn);
    });

    huidigDag = data.dagen[0];
    update();
  }).catch(e => {
    document.getElementById("status").textContent = "Kon mosmix_nl.json niet laden: " + e.message;
  });
}
if (imgEl.complete) startLaad();
else imgEl.onload = startLaad;

// ── WBGT Zoekfunctie (ECMWF via Open-Meteo) ──
function toggleWbgtZoek() {
  const el = document.getElementById('wbgt-zoek');
  el.style.display = el.style.display === 'none' ? '' : 'none';
}

async function wbgtZoekPlaats() {
  const q = document.getElementById('wbgt-zoek-input').value.trim();
  if (q.length < 2) return;
  const res = document.getElementById('wbgt-zoek-resultaten');
  res.innerHTML = '<div style="padding:8px;color:#888;font-size:12px">Zoeken…</div>';
  res.style.display = '';
  try {
    const r = await fetch(`https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(q)}&format=json&limit=5&accept-language=nl`);
    const data = await r.json();
    if (!data.length) { res.innerHTML = '<div style="padding:8px;color:#888;font-size:12px">Niets gevonden</div>'; return; }
    res.innerHTML = '';
    data.forEach(d => {
      const naam = d.display_name.split(',')[0].trim();
      const extra = d.display_name.split(',').slice(1,3).join(',').trim();
      const div = document.createElement('div');
      div.style.cssText = 'padding:8px 12px;cursor:pointer;font-size:12px;border-bottom:1px solid #eee';
      div.innerHTML = `<strong>${naam}</strong> <span style="color:#888;font-size:11px">${extra}</span>`;
      div.onmouseover = () => div.style.background = '#f5f5f5';
      div.onmouseout = () => div.style.background = '';
      div.onclick = () => { res.style.display = 'none'; wbgtBereken(d.lat, d.lon, naam); };
      res.appendChild(div);
    });
  } catch(e) { res.innerHTML = '<div style="padding:8px;color:#c00;font-size:12px">Zoekfout</div>'; }
}

document.addEventListener('click', e => {
  if (!e.target.closest('#wbgt-zoek')) document.getElementById('wbgt-zoek-resultaten').style.display = 'none';
});

async function wbgtBereken(lat, lon, naam) {
  document.getElementById('wbgt-zoek-status').textContent = 'Laden…';
  document.getElementById('wbgt-resultaat').style.display = 'none';
  try {
    const r = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&hourly=temperature_2m,dewpoint_2m,windspeed_10m,relative_humidity_2m,direct_radiation&models=knmi_seamless&timezone=Europe%2FAmsterdam&forecast_days=10`);
    const d = await r.json();
    const times = d.hourly.time;
    const ta = d.hourly.temperature_2m;
    const td = d.hourly.dewpoint_2m;
    const ff = d.hourly.windspeed_10m;
    const rh = d.hourly.relative_humidity_2m;
    const rad = d.hourly.direct_radiation;

    // WBGT per uur berekenen
    const wbgt = times.map((t, i) => {
      if (ta[i] == null || td[i] == null) return null;
      const T = ta[i], Td = td[i], W = (ff[i] || 1) / 3.6, R = rad[i] || 0;
      // Nat-bol (Stull 2011)
      const RH = rh[i] || 50;
      const tw = T * Math.atan(0.151977 * Math.pow(RH + 8.313659, 0.5)) + Math.atan(T + RH) - Math.atan(RH - 1.676331) + 0.00391838 * Math.pow(RH, 1.5) * Math.atan(0.023101 * RH) - 4.686035;
      // Globe temp
      const tg = T + 7.0 * (R / 1000.0) - 1.5 * Math.pow(Math.max(0.5, W), 0.6);
      return Math.round((0.7 * tw + 0.2 * tg + 0.1 * T) * 10) / 10;
    });

    // Per dag aggregeren
    const dagen = {};
    times.forEach((t, i) => {
      const dag = t.slice(0, 10);
      const uur = parseInt(t.slice(11, 13));
      if (!dagen[dag]) dagen[dag] = {ochtend: [], middag: [], uren: {}};
      if (wbgt[i] != null) {
        if (uur >= 6 && uur < 12) dagen[dag].ochtend.push(wbgt[i]);
        if (uur >= 12 && uur < 18) dagen[dag].middag.push(wbgt[i]);
        if (uur >= 8 && uur <= 20) dagen[dag].uren[uur] = wbgt[i];
      }
    });

    // Kleur per WBGT waarde
    function wbgtKleur(v) {
      if (v == null) return '#ccc';
      if (v < 10) return '#2171b5';
      if (v < 18) return '#66bb6a';
      if (v < 23) return '#ffeb3b';
      if (v < 28) return '#ff9800';
      return '#f44336';
    }
    function wbgtTekst(v) { return v != null ? v.toFixed(1) + '°' : '–'; }

    const NLD = ['Zo','Ma','Di','Wo','Do','Vr','Za'];
    const NLM = ['jan','feb','mrt','apr','mei','jun','jul','aug','sep','okt','nov','dec'];

    let html = '<table style="border-collapse:collapse;font-size:12px;width:100%">';
    html += '<tr style="background:#f5f0ea"><th style="padding:6px 8px;text-align:left">Dag</th><th>Ochtend<br><small>06–12u</small></th><th>Middag<br><small>12–18u</small></th>';
    for (let h = 10; h <= 18; h += 2) html += `<th>${h}:00</th>`;
    html += '</tr>';

    Object.entries(dagen).forEach(([dag, v]) => {
      const dt = new Date(dag + 'T12:00:00');
      const dagNaam = NLD[dt.getDay()] + ' ' + dt.getDate() + ' ' + NLM[dt.getMonth()];
      const oMax = v.ochtend.length ? Math.max(...v.ochtend) : null;
      const mMax = v.middag.length ? Math.max(...v.middag) : null;
      html += `<tr style="border-bottom:1px solid #eee">`;
      html += `<td style="padding:5px 8px;font-weight:600">${dagNaam}</td>`;
      html += `<td style="text-align:center;padding:4px;background:${wbgtKleur(oMax)};color:${oMax!=null&&oMax>=18?'#333':'white'};font-weight:700;border-radius:3px">${wbgtTekst(oMax)}</td>`;
      html += `<td style="text-align:center;padding:4px;background:${wbgtKleur(mMax)};color:${mMax!=null&&mMax>=18?'#333':'white'};font-weight:700;border-radius:3px">${wbgtTekst(mMax)}</td>`;
      for (let h = 10; h <= 18; h += 2) {
        const w = v.uren[h];
        html += `<td style="text-align:center;padding:4px;background:${wbgtKleur(w)};color:${w!=null&&w>=18?'#333':'white'};font-size:11px;border-radius:2px">${wbgtTekst(w)}</td>`;
      }
      html += '</tr>';
    });
    html += '</table>';

    document.getElementById('wbgt-titel').textContent = `🌡 WBGT ${naam} — Harmonie (dag 1-2) + ECMWF (dag 3-10)`;
    document.getElementById('wbgt-tabel').innerHTML = html;
    document.getElementById('wbgt-resultaat').style.display = '';
    document.getElementById('wbgt-zoek-status').textContent = '';
  } catch(e) {
    document.getElementById('wbgt-zoek-status').textContent = 'Fout: ' + e.message;
  }
}
</script>
</body>
</html>
