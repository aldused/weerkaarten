<script>
const STATIONS = [
  { name:"Rotterdam",        lat:51.9244, lon:4.4777 },
  { name:"De Bilt",          lat:52.1010, lon:5.1800 },
  { name:"Den Helder",       lat:52.9230, lon:4.7800 },
  { name:"Hoek van Holland", lat:51.9789, lon:4.1336 },
  { name:"Maastricht",       lat:50.9100, lon:5.7700 },
  { name:"Enschede",         lat:52.2700, lon:6.8900 },
  { name:"Eindhoven",        lat:51.4416, lon:5.4697 },
  { name:"Wateringen",       lat:52.0244, lon:4.2867 },
  { name:"Dordrecht",        lat:51.8133, lon:4.6900 },
  { name:"Soestdijk",        lat:52.1797, lon:5.2872 },
  { name:"Rhoon",            lat:51.8650, lon:4.4267 },
  { name:"Ridderkerk",       lat:51.8722, lon:4.6075 },
  { name:"Londen",           lat:51.5074, lon:-0.1278 },
];

const DAGEN_KORT = ["zo","ma","di","wo","do","vr","za"];
const DAGEN_LANG = ["zondag","maandag","dinsdag","woensdag","donderdag","vrijdag","zaterdag"];
const MAANDEN = ["jan","feb","mrt","apr","mei","jun","jul","aug","sep","okt","nov","dec"];
const MAANDEN_LANG = ["januari","februari","maart","april","mei","juni","juli","augustus","september","oktober","november","december"];
const HOUR_MS = 60 * 60 * 1000;
const DAY_MS = 24 * HOUR_MS;
const PLUME_MATH = window.WeerlabPlumeMath;
if (!PLUME_MATH) throw new Error('pluim_math.js kon niet worden geladen');

const C_GREEN="#2d8a2d", C_BLACK="#1a1a1a", C_RED="#cc0000", C_BLUE="#1111bb", C_MAGENTA="#dd00dd";
const C_NACHT="#ededed", C_GRID="#cccccc", C_GRID6="#dddddd", C_DAG="#222222", C_AXIS="#333";

let pageSvgString = "";
let currentModel = null;
let toonMosmixWaarden = true;
try { toonMosmixWaarden = localStorage.getItem('pluim_mosmix_waarden') !== 'uit'; } catch (e) {}

const OM_PROXY_BASE = (location.protocol === 'https:' && /(^|\.)weerlab\.nl$/.test(location.hostname))
  ? 'https://om.weerlab.nl/om'
  : null;
const _fetchCache = {};
const _fetchInflight = {};
const CACHE_TTL = 8 * 60 * 1000;
const SOURCE_FORECAST_DAYS = 16;
const ECMWF_ENS_META_URL = 'https://ensemble-api.open-meteo.com/data/ecmwf_ifs025_ensemble/static/meta.json';
const FAST_UPDATE_WINDOWS = [
  { start: 5 * 60 + 30, end: 12 * 60 },
  { start: 17 * 60 + 30, end: 23 * 60 + 59 },
];
const FAST_UPDATE_INTERVAL_MS = 2 * 60 * 1000;
const NORMAL_UPDATE_INTERVAL_MS = 15 * 60 * 1000;
let autoRefreshTimer = null;

function rewriteOM(url) {
  if (!OM_PROXY_BASE) return url;
  const map = [
    ['https://ensemble-api.open-meteo.com/v1/ensemble', `${OM_PROXY_BASE}/ensemble`],
  ];
  for (const [from, to] of map) {
    if (url.startsWith(from)) return to + url.slice(from.length);
  }
  return url;
}

function addFreshParam(url) {
  if (!OM_PROXY_BASE) return url;
  const u = new URL(url, location.href);
  u.searchParams.set('_weerlab_fresh', '1');
  return u.toString();
}

function isFastUpdateWindow(d = new Date()) {
  const m = d.getHours() * 60 + d.getMinutes();
  return FAST_UPDATE_WINDOWS.some(w => m >= w.start && m <= w.end);
}

async function fetchJson(url, ms = 30000, retries = 3, force = false, edgeFresh = false, cacheTag = '') {
  const rewrittenUrl = rewriteOM(url);
  const cacheKey = cacheTag ? `${rewrittenUrl}::${cacheTag}` : rewrittenUrl;
  const requestUrl = edgeFresh ? addFreshParam(rewrittenUrl) : rewrittenUrl;
  const cached = _fetchCache[cacheKey];
  if (!force && cached && Date.now() - cached.ts < CACHE_TTL) return cached.data;
  if (!force && _fetchInflight[cacheKey]) return _fetchInflight[cacheKey];

  _fetchInflight[cacheKey] = (async () => {
    for (let poging = 0; poging < retries; poging++) {
      const ctrl = new AbortController();
      const id = setTimeout(() => ctrl.abort(), ms);
      try {
        const r = await fetch(requestUrl, { signal: ctrl.signal, cache: (force || edgeFresh) ? 'no-store' : 'default' });
        clearTimeout(id);
        if (r.status === 429 && poging < retries - 1) {
          await new Promise(res => setTimeout(res, 2000 * (poging + 1)));
          continue;
        }
        if (!r.ok) throw new Error(`HTTP ${r.status}`);
        const data = await r.json();
        _fetchCache[cacheKey] = { data, ts: Date.now() };
        return data;
      } catch (e) {
        clearTimeout(id);
        if (poging === retries - 1) throw new Error(e.name === 'AbortError' ? 'time-out' : e.message);
        await new Promise(res => setTimeout(res, 1200 * (poging + 1)));
      }
    }
  })().finally(() => { delete _fetchInflight[cacheKey]; });
  return _fetchInflight[cacheKey];
}

const urlParams = new URLSearchParams(window.location.search);
const lockMode = urlParams.get('lock') === '1';
const wantedStationName = (urlParams.get('station') || urlParams.get('st') || '')
  .replace(/[<>&]/g, '').trim().slice(0, 80);
const wantedStation = wantedStationName.toLowerCase().replace(/[\s_-]/g,'');
const wantedLat = Number(urlParams.get('lat'));
const wantedLon = Number(urlParams.get('lon'));
const hasWantedCoordinates = urlParams.has('lat') && urlParams.has('lon')
  && Number.isFinite(wantedLat) && wantedLat >= -90 && wantedLat <= 90
  && Number.isFinite(wantedLon) && wantedLon >= -180 && wantedLon <= 180;
let initialIdx = 0;
if (wantedStation) {
  const m = STATIONS.findIndex(s => s.name.toLowerCase().replace(/[\s_-]/g,'') === wantedStation);
  if (m >= 0) {
    initialIdx = m;
  } else if (hasWantedCoordinates) {
    STATIONS.push({ name: wantedStationName, lat: wantedLat, lon: wantedLon });
    initialIdx = STATIONS.length - 1;
  }
}
let currentStation = STATIONS[initialIdx];

if (lockMode) {
  document.getElementById('lblStation').style.display = 'none';
  document.getElementById('stSel').style.display = 'none';
  document.getElementById('lblPlaats').textContent = 'Plaats';
}

const stSel = document.getElementById('stSel');
STATIONS.forEach((s,i) => {
  const o = document.createElement('option');
  o.value = i; o.textContent = s.name;
  if (i === initialIdx) o.selected = true;
  stSel.appendChild(o);
});
stSel.addEventListener('change', () => {
  currentStation = STATIONS[stSel.value];
  const u = new URL(window.location);
  u.searchParams.set('station', currentStation.name);
  u.searchParams.set('lat', String(currentStation.lat));
  u.searchParams.set('lon', String(currentStation.lon));
  history.replaceState(null, '', u);
  loadAndRender(isFastUpdateWindow());
});
document.getElementById('btnRefresh').addEventListener('click', () => loadAndRender(true, true));
document.getElementById('btnPng').addEventListener('click', exportPng);
const btnMosmixWaarden = document.getElementById('btnMosmixWaarden');
function updateMosmixWaardenKnop() {
  btnMosmixWaarden.setAttribute('aria-pressed', toonMosmixWaarden ? 'true' : 'false');
  btnMosmixWaarden.textContent = toonMosmixWaarden ? '🌡 Waarden aan' : '🌡 Waarden uit';
}
btnMosmixWaarden.addEventListener('click', () => {
  toonMosmixWaarden = !toonMosmixWaarden;
  try { localStorage.setItem('pluim_mosmix_waarden', toonMosmixWaarden ? 'aan' : 'uit'); } catch (e) {}
  updateMosmixWaardenKnop();
  if (currentModel) {
    pageSvgString = buildPageSvg(currentModel);
    document.getElementById('pageHost').innerHTML = pageSvgString;
  }
});
updateMosmixWaardenKnop();

async function zoekPlaats() {
  const inp = document.getElementById('plaatsInput');
  const err = document.getElementById('plaatsFout');
  err.textContent = '';
  const q = inp.value.trim();
  if (!q) return;
  try {
    const r = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(q)}&count=1&language=nl&format=json`);
    if (!r.ok) throw new Error('HTTP '+r.status);
    const j = await r.json();
    if (!j.results || !j.results.length) { err.textContent = 'Niet gevonden'; return; }
    const hit = j.results[0];
    const label = hit.country_code && hit.country_code !== 'NL' ? `${hit.name} (${hit.country_code})` : hit.name;
    const existing = STATIONS.findIndex(s => Math.abs(s.lat-hit.latitude)<0.01 && Math.abs(s.lon-hit.longitude)<0.01);
    let idx;
    if (existing >= 0) {
      idx = existing;
    } else {
      STATIONS.push({ name: label, lat: hit.latitude, lon: hit.longitude });
      idx = STATIONS.length - 1;
      const o = document.createElement('option');
      o.value = idx; o.textContent = label;
      stSel.appendChild(o);
    }
    stSel.value = idx;
    currentStation = STATIONS[idx];
    const u = new URL(window.location);
    u.searchParams.set('station', currentStation.name);
    u.searchParams.set('lat', String(currentStation.lat));
    u.searchParams.set('lon', String(currentStation.lon));
    history.replaceState(null, '', u);
    loadAndRender(isFastUpdateWindow());
  } catch(e) {
    err.textContent = 'Zoekfout: '+e.message;
  }
}
document.getElementById('btnZoek').addEventListener('click', zoekPlaats);
document.getElementById('plaatsInput').addEventListener('keydown', e => { if (e.key === 'Enter') zoekPlaats(); });

function nlDate(d, langDay=true) {
  return `${langDay ? DAGEN_LANG[d.getDay()] : DAGEN_KORT[d.getDay()]} ${d.getDate()} ${MAANDEN_LANG[d.getMonth()]} ${d.getFullYear()}`;
}
function nlShortDM(d) { return `${String(d.getDate()).padStart(2,'0')}-${String(d.getMonth()+1).padStart(2,'0')}`; }

function verifiedRunMeta(meta) {
  const initialisation = Number(meta?.last_run_initialisation_time);
  const dataEnd = Number(meta?.data_end_time);
  const modification = Number(meta?.last_run_modification_time || 0);
  if (!Number.isFinite(initialisation) || initialisation <= 0 ||
      !Number.isFinite(dataEnd) || dataEnd < initialisation) {
    throw new Error('ECMWF ENS-metadata bevat geen geldig runvenster');
  }
  const cycleHour = new Date(initialisation * 1000).getUTCHours();
  if (![0, 6, 12, 18].includes(cycleHour)) {
    throw new Error(`ECMWF ENS-metadata bevat een ongeldige cyclus (${cycleHour} UTC)`);
  }
  return {
    ...meta,
    last_run_initialisation_time: initialisation,
    data_end_time: dataEnd,
    last_run_modification_time: modification,
  };
}

function runMetaSentinel(meta) {
  const verified = verifiedRunMeta(meta);
  return `${verified.last_run_initialisation_time}:${verified.data_end_time}:${verified.last_run_modification_time}`;
}

function sameRunMeta(before, after) {
  return runMetaSentinel(before) === runMetaSentinel(after);
}

function runInitializationFromMeta(meta) {
  const verified = verifiedRunMeta(meta);
  return new Date(verified.last_run_initialisation_time * 1000).toISOString().slice(0, 16);
}

function runDateBoundsFromMeta(meta) {
  const verified = verifiedRunMeta(meta);
  const startIso = new Date(verified.last_run_initialisation_time * 1000).toISOString();
  const endIso = new Date(verified.data_end_time * 1000).toISOString();
  return {
    startDate: startIso.slice(0, 10),
    endDate: endIso.slice(0, 10),
    startHour: startIso.slice(0, 16),
    endHour: endIso.slice(0, 16),
  };
}

function trimHourlyToRunWindow(data, meta, sourceLabel, requireFullEnd = true) {
  const verified = verifiedRunMeta(meta);
  const hourly = data?.hourly;
  const rawTimes = Array.isArray(hourly?.time) ? hourly.time : [];
  if (!rawTimes.length) throw new Error(`${sourceLabel} bevat geen tijdas`);
  const seriesEntries = Object.entries(hourly)
    .filter(([key, values]) => key !== 'time' && Array.isArray(values));
  const seriesLengths = new Set(seriesEntries.map(([, values]) => values.length));
  if (!seriesEntries.length || seriesLengths.size !== 1) {
    throw new Error(`${sourceLabel} heeft variabelen met verschillende lengtes`);
  }
  const valueCount = seriesEntries[0][1].length;
  if (rawTimes.length < valueCount || rawTimes.length > valueCount + 1) {
    throw new Error(`${sourceLabel} heeft een afwijkende tijdas`);
  }
  const valueTimes = rawTimes.slice(0, valueCount);
  const startMs = verified.last_run_initialisation_time * 1000;
  const endMs = verified.data_end_time * 1000;
  const indexes = valueTimes
    .map((value, index) => ({ index, time: new Date(value).getTime() }))
    .filter(item => Number.isFinite(item.time) && item.time >= startMs && item.time <= endMs)
    .map(item => item.index);
  if (indexes.length < 2) throw new Error(`${sourceLabel} bevat geen bruikbare stappen in het geverifieerde runvenster`);
  const firstMs = new Date(valueTimes[indexes[0]]).getTime();
  const lastValueMs = new Date(valueTimes[indexes[indexes.length - 1]]).getTime();
  const exclusiveEndMs = rawTimes.length === valueCount + 1
    ? new Date(rawTimes[valueCount]).getTime()
    : lastValueMs;
  if (firstMs !== startMs || (requireFullEnd && exclusiveEndMs !== endMs)) {
    throw new Error(`${sourceLabel} dekt niet exact de geverifieerde ECMWF-run`);
  }
  const boundedHourly = { time: indexes.map(index => valueTimes[index]) };
  seriesEntries.forEach(([key, values]) => {
    boundedHourly[key] = indexes.map(index => values[index]);
  });
  return PLUME_MATH.markUtcTimes({ ...data, hourly: boundedHourly });
}

async function fetchRunMeta() {
  const separator = ECMWF_ENS_META_URL.includes('?') ? '&' : '?';
  const r = await fetch(`${ECMWF_ENS_META_URL}${separator}_weerlab_meta=${Date.now()}`, { cache: 'no-store' });
  if (!r.ok) throw new Error(`ECMWF ENS-metadata HTTP ${r.status}`);
  return verifiedRunMeta(await r.json());
}

async function fetchEnsemble(lat, lon, runMeta, force = false) {
  const { startHour, endHour } = runDateBoundsFromMeta(runMeta);
  const url = `https://ensemble-api.open-meteo.com/v1/ensemble?latitude=${lat}&longitude=${lon}`
    + `&hourly=temperature_2m,precipitation,wind_speed_10m,wind_gusts_10m,cape`
    + `&models=ecmwf_ifs025&start_hour=${encodeURIComponent(startHour)}&end_hour=${encodeURIComponent(endHour)}`
    + `&temporal_resolution=native&timezone=GMT&wind_speed_unit=kmh`;
  try {
    const sentinel = runMetaSentinel(runMeta);
    // De operationele ENS-endpoint heeft geen run-selector. Koppel de lokale
    // cache aan de metadata en omzeil bij iedere nieuwe sentinel ook de edge.
    const data = await fetchJson(url, 30000, 3, force, force, `ens:${sentinel}`);
    return trimHourlyToRunWindow(PLUME_MATH.markUtcTimes(data), runMeta, 'Ensemble');
  } catch (e) {
    throw new Error(e?.message || String(e));
  }
}
async function fetchHres(lat, lon, runMeta, force = false) {
  const runInitialization = runInitializationFromMeta(runMeta);
  const url = `https://single-runs-api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}`
    + `&hourly=temperature_2m,precipitation,wind_speed_10m,wind_gusts_10m,cape`
    + `&models=ecmwf_ifs&run=${encodeURIComponent(runInitialization)}`
    + `&forecast_days=${SOURCE_FORECAST_DAYS}&temporal_resolution=native&timezone=GMT&wind_speed_unit=kmh`;
  try {
    const sentinel = runMetaSentinel(runMeta);
    const data = await fetchJson(url, 45000, 3, force, true, `hres:${sentinel}`);
    // IFS HRES eindigt operationeel na 10 dagen, terwijl ENS 15 dagen haalt.
    // De startcyclus moet exact gelijk zijn; een kortere HRES-staart is geldig
    // en wordt later als ontbrekend op de langere ENS-as uitgelijnd.
    return trimHourlyToRunWindow(PLUME_MATH.markUtcTimes(data), runMeta, 'HRES', false);
  } catch (e) {
    throw new Error("HRES " + e.message);
  }
}

function embeddedHresFromEnsemble(ens, runMeta) {
  const embedded = ens?.weerlab_hres;
  const runMs = Number(runMeta?.last_run_initialisation_time) * 1000;
  const requiredFields = ['temperature_2m', 'precipitation', 'wind_speed_10m', 'wind_gusts_10m'];
  if (!embedded || Date.parse(embedded.run || '') !== runMs || embedded.aligned_to_ensemble !== true
      || !Array.isArray(embedded.time) || requiredFields.some(field => !Array.isArray(embedded[field]))) return null;
  const n = embedded.time.length;
  if (requiredFields.some(field => embedded[field].length !== n)) return null;
  const optionalFields = ['cape'].filter(field =>
    Array.isArray(embedded[field]) && embedded[field].length === n
      && embedded[field].every(Number.isFinite));
  const fields = [...requiredFields, ...optionalFields];
  return PLUME_MATH.markUtcTimes({
    weerlab_run: embedded.run,
    hourly: Object.fromEntries([
      ['time', embedded.time.slice()],
      ...fields.map(field => [field, embedded[field].slice()]),
    ]),
  });
}

async function fetchCoherentPlumeBatch(lat, lon, force = false) {
  const runControl = window.WeerlabPlumeRuns;
  await runControl?.ensureLocation?.(lat, lon);
  const selectedRunMs = Date.parse(runControl?.selectedRunIso?.() || '');
  const liveRunMs = Number(runControl?.state?.liveMeta?.last_run_initialisation_time) * 1000;
  if (Number.isFinite(selectedRunMs) && selectedRunMs === liveRunMs) {
    // De snelle 00/06-voorlevering bevat geen CAPE. Gebruik voor precies
    // dezelfde actuele cyclus de inmiddels complete Open-Meteo-respons, zodat
    // het zesde paneel niet structureel leeg blijft. Oudere runs blijven exact.
    await runControl?.ensureVariables?.(['cape']);
  }
  for (let attempt = 0; attempt < 2; attempt++) {
    const metaBefore = await fetchRunMeta();
    const ens = await fetchEnsemble(lat, lon, metaBefore, force || attempt > 0);
    const hres = embeddedHresFromEnsemble(ens, metaBefore)
      || await fetchHres(lat, lon, metaBefore, force || attempt > 0);
    const metaAfter = await fetchRunMeta();
    if (sameRunMeta(metaBefore, metaAfter)) return { ens, hres, runMeta: metaBefore };
  }
  throw new Error('ECMWF ENS-run wisselde tijdens het laden; probeer opnieuw');
}

async function fetchMosmix() {
  const vers = Date.now();
  const bronnen = [
    `https://data.weerlab.nl/mosmix_nl.json?t=${vers}`,
    `mosmix_nl.json?t=${vers}`,
  ];
  for (const url of bronnen) {
    try {
      const r = await fetch(url, { cache: 'no-store' });
      if (r.ok) return await r.json();
    } catch (e) {}
  }
  console.warn('MOSMIX laden mislukt via CDN en lokale kopie');
  return null;
}

function dichtstbijMosmixStation(mosmix, lat, lon) {
  if (!mosmix?.stations) return null;
  let best = null, bestDist = Infinity;
  for (const [naam, coords] of Object.entries(mosmix.stations)) {
    const dx = Number(coords[0]) - Number(lon);
    const dy = Number(coords[1]) - Number(lat);
    const dist = dx*dx + dy*dy;
    if (dist < bestDist) { bestDist = dist; best = naam; }
  }
  return best;
}

function lokaleDatumSleutel(d) {
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

function mosmixTemperatuurPunten(mosmix, station, times) {
  if (!mosmix?.data || !station || !times.length) return null;
  const tx = Array(times.length).fill(null);
  const tn = Array(times.length).fill(null);
  for (const dag of mosmix.dagen || []) {
    const txVal = mosmix.data[dag]?.TX?.[station];
    const tnVal = mosmix.data[dag]?.TN?.[station];
    let txIdx = -1, tnIdx = -1;
    for (let i=0; i<times.length; i++) {
      if (lokaleDatumSleutel(times[i]) !== dag) continue;
      const uur = times[i].getHours();
      if (uur >= 15 && uur <= 17 && txIdx < 0) txIdx = i;
      if (uur >= 4 && uur <= 6 && tnIdx < 0) tnIdx = i;
    }
    if (txVal != null && Number.isFinite(Number(txVal)) && txIdx >= 0) tx[txIdx] = Number(txVal);
    if (tnVal != null && Number.isFinite(Number(tnVal)) && tnIdx >= 0) tn[tnIdx] = Number(tnVal);
  }
  return (tx.some(v => v != null) || tn.some(v => v != null)) ? { tx, tn, station } : null;
}

function ensembleVariable(hourly, key) {
  const perturbedKeys = PLUME_MATH.perturbedMemberKeys(hourly, key);
  const statisticKeys = PLUME_MATH.ensembleMemberKeys(hourly, key);
  if (!Array.isArray(hourly?.[key])) throw new Error(`Controle ontbreekt voor ${key}`);
  if (perturbedKeys.length !== 50 || statisticKeys.length !== 51) {
    throw new Error(`${key}: ${perturbedKeys.length} verstoorde leden ontvangen; 50 verwacht`);
  }
  const read = memberKey => fillNaN(hourly[memberKey].slice());
  const control = read(key);
  const perturbed = perturbedKeys.map(read);
  return { control, perturbed, statistics: [control, ...perturbed] };
}
function optionalEnsembleVariable(hourly, key, unavailable) {
  if (unavailable?.has(key)) return null;
  try {
    const variable = ensembleVariable(hourly, key);
    const n = Array.isArray(hourly?.time) ? hourly.time.length : 0;
    return n > 0 && variable.statistics.every(series =>
      series.length === n && series.every(Number.isFinite)) ? variable : null;
  } catch (error) {
    console.warn(`Optioneel 6-luikpaneel ${key} overgeslagen:`, error.message);
    return null;
  }
}
// Ontbrekende waarden blijven null. De volledige 51-ledenset bepaalt hieronder
// één aaneengesloten, gemeenschappelijk tijdvenster voor alle zes panelen.
function fillNaN(arr) { return arr.map(v => (v==null || isNaN(v)) ? null : v); }
function completeMemberWindow(times, memberMatrices) {
  const members = memberMatrices.flat();
  if (!Array.isArray(times) || !times.length || !members.length || members.some(member => !Array.isArray(member))) {
    throw new Error('Geen volledige ensemblematrix ontvangen');
  }
  const limit = Math.min(times.length, ...members.map(member => member.length));
  let first = -1;
  let lastExclusive = limit;
  for (let index = 0; index < limit; index++) {
    const complete = members.every(member => Number.isFinite(member[index]));
    if (first < 0) {
      if (complete) first = index;
    } else if (!complete) {
      lastExclusive = index;
      break;
    }
  }
  if (first < 0 || lastExclusive - first < 2) {
    throw new Error('Ensemble bevat te weinig tijdstappen met alle 51 leden compleet');
  }
  return { first, lastExclusive };
}
function meanOf(arrs) {
  if (!arrs.length) return [];
  const N = Math.min(...arrs.map(series => series.length));
  return Array.from({length:N}, (_, t) => PLUME_MATH.mean(arrs.map(series => series[t])));
}
function percentile(arrs, p) {
  if (!arrs.length) return [];
  const N = Math.min(...arrs.map(series => series.length));
  return Array.from({length:N}, (_, t) => PLUME_MATH.quantile(arrs.map(series => series[t]), p));
}
function alignSeries(targetTimes, sourceTimes, sourceValues) {
  const byTime = new Map();
  sourceTimes.forEach((time, index) => {
    const value = sourceValues?.[index];
    byTime.set(time.getTime(), value == null || !Number.isFinite(Number(value)) ? null : Number(value));
  });
  return targetTimes.map(time => byTime.has(time.getTime()) ? byTime.get(time.getTime()) : null);
}
function niceTicks(min, max, count=6) {
  const range = max-min; if (range <= 0) return [min];
  const rough = range/count, mag = Math.pow(10, Math.floor(Math.log10(rough))), norm = rough/mag;
  let step;
  if (norm < 1.5) step = mag; else if (norm < 3) step = 2*mag; else if (norm < 7) step = 5*mag; else step = 10*mag;
  const start = Math.ceil(min/step)*step, ticks=[];
  for (let v=start; v<=max+1e-9; v+=step) ticks.push(Number(v.toFixed(10)));
  return ticks;
}
function pad(min, max, padFrac=0.08, floorZero=false) {
  const r = max-min || 1; let lo = min - r*padFrac;
  if (floorZero && lo < 0) lo = 0;
  return [lo, max + r*padFrac];
}
function rangeOf(arrs, extra=[]) {
  let mn=Infinity, mx=-Infinity;
  for (const a of arrs) for (const v of a) { if (v==null || isNaN(v)) continue; if (v<mn) mn=v; if (v>mx) mx=v; }
  for (const v of extra) { if (v==null || isNaN(v)) continue; if (v<mn) mn=v; if (v>mx) mx=v; }
  return [mn, mx];
}

const PAGE_W=2970, PAGE_H=2100;
const PAGE_MARGIN_X=30, PAGE_HEADER_H=110, PAGE_FOOTER_H=40;
const PANEL_GAP=16;
const COLS=2, ROWS=3;
const PANEL_W = (PAGE_W - 2*PAGE_MARGIN_X - (COLS-1)*PANEL_GAP) / COLS;
const GRID_H = PAGE_H - PAGE_HEADER_H - PAGE_FOOTER_H - 2*PAGE_MARGIN_X;
const PANEL_H = (GRID_H - (ROWS-1)*PANEL_GAP) / ROWS;
const PM = { l: 80, r: 80, t: 92, b: 165 };
const PLOT_W = PANEL_W - PM.l - PM.r;
const PLOT_H = PANEL_H - PM.t - PM.b;

function buildPanelSvg({ox, oy, title, ensemble, ctrl, hres, p50, mean, yMin, yMax, yStep, station, datumTxt, runLabel, footLeft, footRight, times, domainStart, domainEnd, rightAxis, refLines, markers}) {
  if (arguments[0].unavailableText) {
    const cx = ox + PANEL_W/2;
    const cy = oy + PANEL_H/2;
    return `<rect x="${ox}" y="${oy}" width="${PANEL_W}" height="${PANEL_H}" fill="#fafcff" stroke="#aaaaaa" stroke-width="1"/>`
      + `<text x="${cx}" y="${oy+42}" font-size="30" font-weight="700" text-anchor="middle" fill="#1a1a1a">${title}</text>`
      + `<text x="${cx}" y="${cy-8}" font-size="23" font-weight="700" text-anchor="middle" fill="#5a7090">Tijdelijk niet beschikbaar voor deze ECMWF-run</text>`
      + `<text x="${cx}" y="${cy+28}" font-size="18" text-anchor="middle" fill="#7a8da5">Geen nulwaarden of gegevens uit een andere cyclus ingevuld.</text>`;
  }
  const startMs = domainStart instanceof Date ? domainStart.getTime() : times[0].getTime();
  const endMsRaw = domainEnd instanceof Date ? domainEnd.getTime() : times[times.length-1].getTime();
  const endMs = Math.max(startMs + HOUR_MS, endMsRaw);
  const xToPx = value => {
    const timeMs = value instanceof Date ? value.getTime() : Number(value);
    return ox + PM.l + ((timeMs-startMs)/(endMs-startMs))*PLOT_W;
  };
  const yToPx = y => oy + PM.t + (1 - (y-yMin)/(yMax-yMin))*PLOT_H;
  let s = '';

  s += `<rect x="${ox}" y="${oy}" width="${PANEL_W}" height="${PANEL_H}" fill="#ffffff"/>`;

  const nightBlocks = computeNightBlocks(startMs, endMs);
  for (const [a,b] of nightBlocks) {
    const x0 = Math.max(ox+PM.l, xToPx(a));
    const x1 = Math.min(ox+PM.l+PLOT_W, xToPx(b));
    if (x1>x0) s += `<rect x="${x0.toFixed(1)}" y="${oy+PM.t}" width="${(x1-x0).toFixed(1)}" height="${PLOT_H}" fill="${C_NACHT}"/>`;
  }

  // Echte UTC-kloktijden: dun per 6 uur, donker op 00 UTC.
  const firstSixHour = Math.ceil(startMs/(6*HOUR_MS)) * 6*HOUR_MS;
  for (let timeMs=firstSixHour; timeMs<=endMs; timeMs+=6*HOUR_MS) {
    const isUtcDay = new Date(timeMs).getUTCHours() === 0;
    const px = xToPx(timeMs);
    s += `<line x1="${px.toFixed(1)}" y1="${oy+PM.t}" x2="${px.toFixed(1)}" y2="${oy+PM.t+PLOT_H}" stroke="${isUtcDay?C_DAG:C_GRID6}" stroke-width="${isUtcDay?1.4:0.6}"/>`;
  }

  const yticks = [];
  if (yStep) { for (let v=yMin; v<=yMax+1e-9; v+=yStep) yticks.push(Number(v.toFixed(10))); }
  else yticks.push(...niceTicks(yMin, yMax, 6));
  for (const yt of yticks) {
    const py = yToPx(yt);
    s += `<line x1="${ox+PM.l}" y1="${py.toFixed(1)}" x2="${ox+PM.l+PLOT_W}" y2="${py.toFixed(1)}" stroke="${C_GRID}" stroke-width="0.7"/>`;
    s += `<text x="${ox+PM.l-8}" y="${(py+5).toFixed(1)}" font-size="18" text-anchor="end" fill="${C_AXIS}">${yt}</text>`;
    if (rightAxis !== 'beaufort') {
      s += `<text x="${ox+PM.l+PLOT_W+8}" y="${(py+5).toFixed(1)}" font-size="18" text-anchor="start" fill="${C_AXIS}">${yt}</text>`;
    }
  }
  if (rightAxis === 'beaufort') {
    const thresholds = [0, 1, 6, 12, 20, 29, 39, 50, 62, 75, 89, 103, 118];
    thresholds.forEach((value, bft) => {
      if (value < yMin || value > yMax) return;
      const py = yToPx(value);
      s += `<text x="${ox+PM.l+PLOT_W+8}" y="${(py+5).toFixed(1)}" font-size="16" text-anchor="start" fill="${C_AXIS}">${bft} Bft</text>`;
    });
    const tx = ox + PANEL_W - 8, ty = oy + PM.t + PLOT_H/2;
    s += `<text x="${tx}" y="${ty}" font-size="15" font-weight="700" text-anchor="middle" fill="${C_AXIS}" transform="rotate(-90 ${tx} ${ty})">Beaufort-rechteras</text>`;
  }

  const pathOf = arr => {
    let d=''; let started=false;
    for (let i=0;i<arr.length;i++) {
      const v = arr[i];
      if (v == null || isNaN(v)) { started = false; continue; }
      const time = times[i];
      if (!(time instanceof Date) || !Number.isFinite(time.getTime())) { started = false; continue; }
      const px=xToPx(time), py=yToPx(v);
      d += (started?'L':'M')+px.toFixed(1)+','+py.toFixed(1);
      started = true;
    }
    return d;
  };

  const expertStroke = 'stroke-linecap="butt" stroke-linejoin="miter"';
  for (const m of ensemble) s += `<path d="${pathOf(m)}" fill="none" stroke="${C_GREEN}" stroke-width="0.75" stroke-opacity="0.62" ${expertStroke}/>`;
  if (mean) s += `<path d="${pathOf(mean)}" fill="none" stroke="${C_BLACK}" stroke-width="2" stroke-dasharray="3 5" ${expertStroke}/>`;
  if (p50)  s += `<path d="${pathOf(p50)}" fill="none" stroke="${C_MAGENTA}" stroke-width="2" stroke-dasharray="12 7" ${expertStroke}/>`;
  if (ctrl) s += `<path d="${pathOf(ctrl)}" fill="none" stroke="${C_BLUE}" stroke-width="2.1" ${expertStroke}/>`;
  if (hres) s += `<path d="${pathOf(hres)}" fill="none" stroke="${C_RED}" stroke-width="2.3" ${expertStroke}/>`;

  if (refLines) {
    for (const rl of refLines) {
      if (rl.value < yMin || rl.value > yMax) continue;
      const py = yToPx(rl.value);
      s += `<line x1="${ox+PM.l}" y1="${py.toFixed(1)}" x2="${ox+PM.l+PLOT_W}" y2="${py.toFixed(1)}" stroke="${rl.color||C_RED}" stroke-width="1.2" stroke-dasharray="6 4"/>`;
      s += `<text x="${ox+PM.l+PLOT_W-6}" y="${(py-4).toFixed(1)}" font-size="16" text-anchor="end" fill="${rl.color||C_RED}" font-weight="600">${rl.label||rl.value+"°"}</text>`;
    }
  }

  if (markers) {
    for (const marker of markers) {
      for (let i=0; i<marker.data.length; i++) {
        const v = marker.data[i];
        if (v == null || !Number.isFinite(v) || v < yMin || v > yMax) continue;
        const px = xToPx(times[i]), py = yToPx(v);
        s += `<circle cx="${px.toFixed(1)}" cy="${py.toFixed(1)}" r="7" fill="${marker.color}" fill-opacity="0.72" stroke="#ffffff" stroke-opacity="0.9" stroke-width="2"/>`;
        if (marker.showValues && toonMosmixWaarden) {
          const waarde = `${v.toFixed(1).replace('.', ',')}°`;
          s += `<text x="${px.toFixed(1)}" y="${(py + (marker.labelDy || -12)).toFixed(1)}" font-size="15" font-weight="700" text-anchor="middle" fill="${marker.color}" fill-opacity="0.92" stroke="#ffffff" stroke-opacity="0.95" stroke-width="3" paint-order="stroke" stroke-linejoin="round">${waarde}</text>`;
        }
      }
    }
  }

  s += `<rect x="${ox+PM.l}" y="${oy+PM.t}" width="${PLOT_W}" height="${PLOT_H}" fill="none" stroke="${C_AXIS}" stroke-width="1.2"/>`;

  const firstUtcDay = new Date(startMs);
  let dayMs = Date.UTC(firstUtcDay.getUTCFullYear(), firstUtcDay.getUTCMonth(), firstUtcDay.getUTCDate());
  for (; dayMs<endMs; dayMs+=DAY_MS) {
    const segmentStart = Math.max(startMs, dayMs);
    const segmentEnd = Math.min(endMs, dayMs+DAY_MS);
    if (segmentEnd <= segmentStart) continue;
    const labelX = xToPx((segmentStart+segmentEnd)/2);
    const dt = new Date(dayMs);
    const ly = oy+PM.t+PLOT_H+22;
    s += `<text x="${labelX.toFixed(1)}" y="${ly}" font-size="20" text-anchor="middle" fill="${C_AXIS}">${DAGEN_KORT[dt.getUTCDay()]}</text>`;
    s += `<text x="${labelX.toFixed(1)}" y="${ly+22}" font-size="20" text-anchor="middle" fill="${C_AXIS}">${String(dt.getUTCDate()).padStart(2,'0')}-${String(dt.getUTCMonth()+1).padStart(2,'0')}</text>`;
  }

  const cx = ox + PANEL_W/2;
  s += `<text x="${cx}" y="${oy+30}" font-size="30" font-weight="700" text-anchor="middle" fill="#1a1a1a">${title}</text>`;
  s += `<text x="${cx}" y="${oy+58}" font-size="20" text-anchor="middle" fill="#444">${station}, ${datumTxt} (ENS-run ${runLabel})</text>`;

  const legY = oy + PANEL_H - 75;
  const legItems = [
    {color:C_RED,    w:2.3,  dash:null,   txt:"Oper. (HRES)"},
    {color:C_BLUE,   w:2.1,  dash:null,   txt:"Controle"},
    {color:C_GREEN,  w:0.75, dash:null,   txt:"Verstoorde leden"},
    {color:C_BLACK,  w:2,    dash:"3 5",  txt:"gemiddelde"},
    {color:C_MAGENTA,w:2,    dash:"12 7", txt:"mediaan (P50)"},
    ...(markers || []).map(m => ({ color:m.color, txt:m.label, marker:true })),
  ];
  const totalW = PANEL_W - 80, itemW = totalW / legItems.length;
  legItems.forEach((it,i) => {
    const cxL = ox + 40 + i*itemW + 12;
    if (it.marker) {
      s += `<circle cx="${cxL+24}" cy="${legY}" r="7" fill="${it.color}" fill-opacity="0.72" stroke="#ffffff" stroke-opacity="0.9" stroke-width="2"/>`;
      s += `<text x="${cxL+42}" y="${legY+6}" font-size="19" fill="#222">${it.txt}</text>`;
    } else {
      const dash = it.dash ? `stroke-dasharray="${it.dash}"` : '';
      s += `<line x1="${cxL}" y1="${legY}" x2="${cxL+50}" y2="${legY}" stroke="${it.color}" stroke-width="${it.w}" stroke-linecap="butt" stroke-linejoin="miter" ${dash}/>`;
      s += `<text x="${cxL+58}" y="${legY+6}" font-size="19" fill="#222">${it.txt}</text>`;
    }
  });

  const footY = oy + PANEL_H - 18;
  s += `<text x="${ox+20}" y="${footY}" font-size="15" font-style="italic" fill="#666">${footLeft}</text>`;
  s += `<text x="${ox+PANEL_W-20}" y="${footY}" font-size="15" font-style="italic" text-anchor="end" fill="#666">${footRight}</text>`;
  s += `<rect x="${ox}" y="${oy}" width="${PANEL_W}" height="${PANEL_H}" fill="none" stroke="#aaaaaa" stroke-width="1"/>`;
  return s;
}

const NL_HOUR_FORMAT = new Intl.DateTimeFormat('en-GB', { timeZone:'Europe/Amsterdam', hour:'2-digit', hourCycle:'h23' });
function computeNightBlocks(startMs, endMs) {
  const blocks = [];
  let open = null;
  const firstHour = Math.floor(startMs/HOUR_MS)*HOUR_MS;
  for (let timeMs=firstHour; timeMs<endMs; timeMs+=HOUR_MS) {
    const hour = Number(NL_HOUR_FORMAT.format(new Date(timeMs)));
    const night = hour >= 18 || hour < 6;
    const a = Math.max(startMs, timeMs), b = Math.min(endMs, timeMs+HOUR_MS);
    if (night && b>a) {
      if (open == null) open = a;
    } else if (open != null) {
      blocks.push([open, a]);
      open = null;
    }
  }
  if (open != null) blocks.push([open, endMs]);
  return blocks;
}

function buildPageSvg(model) {
  let s = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${PAGE_W} ${PAGE_H}" font-family="Arial, sans-serif">`;
  s += `<rect x="0" y="0" width="${PAGE_W}" height="${PAGE_H}" fill="#ffffff"/>`;
  s += `<text x="${PAGE_W/2}" y="60" font-size="42" font-weight="700" text-anchor="middle" fill="#1a1a1a">Ensemble pluim ${model.station}</text>`;
  s += `<text x="${PAGE_W/2}" y="92" font-size="22" text-anchor="middle" fill="#555">ECMWF IFS-ENS · ${model.nMembers} verstoorde leden + Controle (${model.nStatsMembers} berekeningen) + exacte HRES · ENS-run ${model.runLabel}${model.coverageLabel ? ` · ${model.coverageLabel}` : ''}</text>`;

  for (let i=0; i<model.panels.length; i++) {
    const r = Math.floor(i/COLS), c = i%COLS;
    const ox = PAGE_MARGIN_X + c*(PANEL_W+PANEL_GAP);
    const oy = PAGE_HEADER_H + PAGE_MARGIN_X + r*(PANEL_H+PANEL_GAP);
    s += buildPanelSvg({ ox, oy, station: model.station, datumTxt: model.datumTxt, runLabel: model.runLabel, footLeft: model.footLeft, footRight: model.footRight, nDays: model.nDays, times: model.times, ...model.panels[i] });
  }
  s += `<text x="${PAGE_W/2}" y="${PAGE_H-15}" font-size="16" text-anchor="middle" fill="#777" font-style="italic">© Weerlab.nl · ECMWF IFS-ENS + aparte IFS HRES (Single Runs) via Open-Meteo · native UTC-modelstappen · A4 landscape</text>`;
  s += `</svg>`;
  return s;
}

function runMetaTeksten(meta) {
  const verified = verifiedRunMeta(meta);
  const init = new Date(verified.last_run_initialisation_time * 1000);
  const end = new Date(verified.data_end_time * 1000);
  const availS = Number(verified.last_run_availability_time) || verified.last_run_initialisation_time;
  const fmtT = d => d.toLocaleTimeString('nl-NL', { timeZone: 'Europe/Amsterdam', hour: '2-digit', minute: '2-digit' });
  const fmtRun = d => `${DAGEN_KORT[d.getUTCDay()]} ${d.getUTCDate()} ${MAANDEN[d.getUTCMonth()]} ${String(d.getUTCHours()).padStart(2,'0')} UTC`;
  const coverageHours = Math.max(0, Math.round((verified.data_end_time - verified.last_run_initialisation_time) / 3600));
  const isIntermediate = [6, 18].includes(init.getUTCHours());
  const coverageLabel = `${isIntermediate ? 'tussenrun · ' : ''}één-run-dekking ${coverageHours} uur t/m ${fmtRun(end)}`;
  return {
    runLabel: fmtRun(init),
    coverageLabel,
    detail: `${coverageLabel} · bron beschikbaar ${fmtT(new Date(availS * 1000))}`,
  };
}

async function loadAndRender(force = false, edgeFresh = false) {
  const loader = document.getElementById('loader');
  const host = document.getElementById('pageHost');
  loader.classList.remove('verborgen');
  const label = force ? 'Nieuwe ensembledata controleren' : 'Ensemble laden';
  loader.innerHTML = `<div class="spinner"></div><div style="font-size:13px;font-weight:600;color:#2a4a70">${label} voor ${currentStation.name}…</div>`;
  host.innerHTML = '';

  try {
    const [batch, mosmix] = await Promise.all([
      fetchCoherentPlumeBatch(currentStation.lat, currentStation.lon, force || edgeFresh),
      fetchMosmix(),
    ]);
    const { ens, hres, runMeta } = batch;
    const model = buildModel(ens, hres, mosmix);
    const rm = runMetaTeksten(runMeta);
    model.runLabel = rm.runLabel;
    model.coverageLabel = rm.coverageLabel;
    currentModel = model;
    pageSvgString = buildPageSvg(model);
    host.innerHTML = pageSvgString;
    ['pngVan','pngTot'].forEach(id => { const el = document.getElementById(id); el.disabled = false; el.max = model.nDays; });
    document.getElementById('pngVan').value = 1;
    document.getElementById('pngTot').value = model.nDays;

    document.getElementById('hdrDatum').textContent = model.datumTxt.charAt(0).toUpperCase() + model.datumTxt.slice(1);
    document.getElementById('hdrRun').textContent = `ENS-run ${model.runLabel} · ${model.nMembers} verstoorde leden · ${model.nStatsMembers} berekeningen incl. controle · ${rm.detail}`;
    document.getElementById('runinfo').textContent = `ENS-run: ${model.runLabel} · ${rm.detail} · ${currentStation.name} (${currentStation.lat.toFixed(3)}, ${currentStation.lon.toFixed(3)})`;
    loader.classList.add('verborgen');
  } catch (e) {
    loader.innerHTML = `<div class="err">⚠ ${e.message}</div><button class="btn btn-primair" onclick="loadAndRender(isFastUpdateWindow())">Opnieuw</button>`;
  }
}

function buildModel(ens, hres, mosmix = null) {
  const hourly = ens?.hourly;
  if (!Array.isArray(hourly?.time)) throw new Error('Ensemble bevat geen geldige tijdas');
  const times = hourly.time.map(t => new Date(t));
  if (times.some(time => !Number.isFinite(time.getTime()))) throw new Error('Ensemble bevat een ongeldige UTC-tijd');

  const unavailable = new Set(ens?.weerlab_unavailable_variables || []);
  const raw = {
    temp: ensembleVariable(hourly, 'temperature_2m'),
    wind: ensembleVariable(hourly, 'wind_speed_10m'),
    gust: optionalEnsembleVariable(hourly, 'wind_gusts_10m', unavailable),
    rain: ensembleVariable(hourly, 'precipitation'),
    cape: optionalEnsembleVariable(hourly, 'cape', unavailable),
  };
  const window = completeMemberWindow(times, Object.values(raw).filter(Boolean).map(variable => variable.statistics));
  if (window.first !== 0 || window.lastExclusive !== times.length) {
    throw new Error('De gekozen ECMWF-run is nog niet volledig geladen voor alle beschikbare panelen; er wordt geen gedeeltelijke pluim getoond');
  }
  const N = window.lastExclusive - window.first;

  const trimVariable = variable => {
    if (!variable) return null;
    const control = variable.control.slice(window.first, window.lastExclusive);
    const perturbed = variable.perturbed.map(series => series.slice(window.first, window.lastExclusive));
    return { control, perturbed, statistics:[control, ...perturbed] };
  };
  const temp = trimVariable(raw.temp);
  const wind = trimVariable(raw.wind);
  const gust = trimVariable(raw.gust);
  const rain = trimVariable(raw.rain);
  const cape = trimVariable(raw.cape);
  const useTimes = times.slice(window.first, window.lastExclusive);

  const hr = hres?.hourly || {};
  const hresTimes = (hr.time || []).map(t => new Date(t));
  if (!hresTimes.length || hresTimes.some(time => !Number.isFinite(time.getTime()))) {
    throw new Error('HRES bevat geen geldige UTC-tijdas');
  }
  const alignedHres = key => alignSeries(useTimes, hresTimes, fillNaN(hr[key] || []));
  const tempHres = alignedHres('temperature_2m');
  const windHres = alignedHres('wind_speed_10m');
  const gustHres = gust ? alignedHres('wind_gusts_10m') : [];
  const capeHres = cape ? alignedHres('cape') : [];

  // Open-Meteo-neerslag hoort bij het voorafgaande interval. Alleen complete
  // UTC-klokvakken worden op hun rechtergrens (06/12/18/00 UTC) getekend.
  const rain6 = PLUME_MATH.aggregatePrecedingHours(useTimes, rain.statistics, 6, { keepInitialZero:false });
  if (!rain6.endDates.length) throw new Error('Geen complete 6-uursneerslagvakken ontvangen');
  const rrTimes6 = rain6.endDates;
  const rrCtrl6 = rain6.members[0];
  const rrEns6 = rain6.members.slice(1);
  const rrStats6 = rain6.members;

  const hresRainNative = fillNaN(hr.precipitation || []);
  const hresRain6 = PLUME_MATH.aggregatePrecedingHours(hresTimes, [hresRainNative], 6, { keepInitialZero:false });
  const rrHres6 = alignSeries(rrTimes6, hresRain6.endDates, hresRain6.members[0] || []);

  // Cumulatief blijft een afzonderlijke lopende som per ensemblelid; control
  // zit één keer in de statistiekmatrix en HRES blijft volledig apart.
  const rrCumStats = PLUME_MATH.cumulativeMembers(rain.statistics);
  const rrCumCtrl = rrCumStats[0];
  const rrCumEns = rrCumStats.slice(1);
  const hresCumNative = PLUME_MATH.cumulativeMembers([hresRainNative])[0] || [];
  const rrCumHres = alignSeries(useTimes, hresTimes, hresCumNative);

  const tempP50 = percentile(temp.statistics, 0.5);
  const windP50 = percentile(wind.statistics, 0.5);
  const gustP50 = gust ? percentile(gust.statistics, 0.5) : [];
  const rr6P50 = percentile(rrStats6, 0.5);
  const rrCumP50 = percentile(rrCumStats, 0.5);
  const capeP50 = cape ? percentile(cape.statistics, 0.5) : [];

  const tempMean = meanOf(temp.statistics);
  const windMean = meanOf(wind.statistics);
  const gustMean = gust ? meanOf(gust.statistics) : [];
  const rr6Mean = meanOf(rrStats6);
  const rrCumMean = meanOf(rrCumStats);
  const capeMean = cape ? meanOf(cape.statistics) : [];

  const mosmixStation = dichtstbijMosmixStation(mosmix, currentStation.lat, currentStation.lon);
  const mosmixTemp = mosmixTemperatuurPunten(mosmix, mosmixStation, useTimes);
  const mosmixWaarden = mosmixTemp ? [...mosmixTemp.tx, ...mosmixTemp.tn].filter(v => v != null) : [];

  // Assen gebruiken alle echte leden, control en HRES: uitschieters blijven zichtbaar.
  const [tMn, tMx] = pad(...rangeOf(temp.statistics, [...tempHres, ...mosmixWaarden]), 0.08);
  const [, wMx] = pad(...rangeOf(wind.statistics, windHres), 0.05, true);
  const gMx = gust ? pad(...rangeOf(gust.statistics, gustHres), 0.05, true)[1] : 0;
  const [, rMx] = pad(...rangeOf(rrStats6, rrHres6), 0.08, true);
  const [, cMx] = pad(...rangeOf(rrCumStats, rrCumHres), 0.08, true);
  const caMx = cape ? pad(...rangeOf(cape.statistics, capeHres), 0.08, true)[1] : 0;

  const runDate = useTimes[0];
  const runLabel = 'niet geverifieerd';
  const datumTxt = `${DAGEN_LANG[runDate.getUTCDay()]} ${runDate.getUTCDate()} ${MAANDEN_LANG[runDate.getUTCMonth()]} ${runDate.getUTCFullYear()}`;
  const todayStr = `${String(runDate.getUTCDate()).padStart(2,'0')}-${String(runDate.getUTCMonth()+1).padStart(2,'0')}-${runDate.getUTCFullYear()}`;
  const dayStartMs = Date.UTC(runDate.getUTCFullYear(), runDate.getUTCMonth(), runDate.getUTCDate());
  const lastTimeMs = useTimes[useTimes.length-1].getTime();
  // Een tijdstap exact op 00 UTC sluit de voorafgaande forecastdag af en mag
  // geen lege extra kalenderdag in de PNG-bediening creëren.
  const nDays = Math.max(1, Math.ceil((lastTimeMs-dayStartMs)/DAY_MS));
  const domainStart = new Date(dayStartMs);
  const domainEnd = new Date(dayStartMs+nDays*DAY_MS);
  const tAxisMin = Math.floor(tMn/5)*5;
  let tAxisMax = Math.ceil(tMx/5)*5;
  if (tAxisMax <= tAxisMin) tAxisMax = tAxisMin+5;

  const panels = [
    { title:"Temperatuur (°C)", times:useTimes, domainStart, domainEnd, ensemble:temp.perturbed, ctrl:temp.control, hres:tempHres, p50:tempP50, mean:tempMean, yMin:tAxisMin, yMax:tAxisMax, yStep:5, refLines:[{value:25, label:"25°"},{value:30, label:"30°"}], markers:mosmixTemp ? [{label:"MOSMIX max", color:"#ff4444", data:mosmixTemp.tx, showValues:true, labelDy:-12},{label:"MOSMIX min", color:"#4488ff", data:mosmixTemp.tn, showValues:true, labelDy:21}] : [], footRight:mosmixTemp ? `Bron: ECMWF IFS-ENS · MOSMIX ${mosmixTemp.station}` : "Bron: ECMWF IFS-ENS" },
    { title:"Windsnelheid (km/uur)", times:useTimes, domainStart, domainEnd, ensemble:wind.perturbed, ctrl:wind.control, hres:windHres, p50:windP50, mean:windMean, yMin:0, yMax:Math.max(5, Math.ceil(wMx/5)*5), rightAxis:'beaufort' },
    { title:"Neerslag (mm, voorafgaande 6 uur)", times:rrTimes6, domainStart, domainEnd, precedingWindowHours:6, ensemble:rrEns6, ctrl:rrCtrl6, hres:rrHres6, p50:rr6P50, mean:rr6Mean, yMin:0, yMax:Math.max(8, Math.ceil(rMx/2)*2) },
    gust
      ? { title:"Windstoten (km/uur)", times:useTimes, domainStart, domainEnd, ensemble:gust.perturbed, ctrl:gust.control, hres:gustHres, p50:gustP50, mean:gustMean, yMin:0, yMax:Math.max(10, Math.ceil(gMx/10)*10) }
      : { title:"Windstoten (km/uur)", unavailableText:true },
    { title:"Neerslagsom (mm)", times:useTimes, domainStart, domainEnd, ensemble:rrCumEns, ctrl:rrCumCtrl, hres:rrCumHres, p50:rrCumP50, mean:rrCumMean, yMin:0, yMax:Math.max(10, Math.ceil(cMx/10)*10) },
    cape
      ? { title:"CAPE/Onweer (J/kg)", times:useTimes, domainStart, domainEnd, ensemble:cape.perturbed, ctrl:cape.control, hres:capeHres, p50:capeP50, mean:capeMean, yMin:0, yMax:Math.max(160, Math.ceil(caMx/160)*160) }
      : { title:"CAPE/Onweer (J/kg)", unavailableText:true },
  ];

  return {
    station: currentStation.name,
    nMembers: temp.perturbed.length,
    nStatsMembers: temp.statistics.length,
    datumTxt, runLabel,
    footLeft: `Weerlab.nl ${todayStr}, gegenereerd op basis van ECMWF/Open-Meteo`,
    footRight: `Bron: ECMWF IFS-ENS`,
    nDays, dayStartMs, domainStart, domainEnd, times: useTimes, panels,
  };
}

function sliceModel(model, dagVan, dagTot) {
  const rangeStartMs = model.dayStartMs + (dagVan-1)*DAY_MS;
  const rangeEndMs = model.dayStartMs + dagTot*DAY_MS;
  const normalIndexes = model.times
    .map((time, index) => ({time:time.getTime(), index}))
    .filter(item => item.time >= rangeStartMs && item.time < rangeEndMs)
    .map(item => item.index);
  const take = (series, indexes) => indexes.map(index => series?.[index] ?? null);
  return {
    ...model,
    nDays: dagTot - dagVan + 1,
    dayStartMs: rangeStartMs,
    domainStart: new Date(rangeStartMs),
    domainEnd: new Date(rangeEndMs),
    times: take(model.times, normalIndexes),
    panels: model.panels.map(p => {
      const indexes = p.times
        .map((time, index) => ({time:time.getTime(), index}))
        .filter(item => p.precedingWindowHours
          ? item.time > rangeStartMs && item.time <= rangeEndMs
          : item.time >= rangeStartMs && item.time < rangeEndMs)
        .map(item => item.index);
      return {
        ...p,
        domainStart:new Date(rangeStartMs),
        domainEnd:new Date(rangeEndMs),
        times:take(p.times, indexes),
        ensemble:p.ensemble.map(series => take(series, indexes)),
        ctrl:take(p.ctrl, indexes),
        hres:take(p.hres, indexes),
        p50:take(p.p50, indexes),
        mean:take(p.mean, indexes),
        markers:(p.markers || []).map(marker => ({...marker, data:take(marker.data, indexes)})),
      };
    })
  };
}

function exportPng() {
  const btn = document.getElementById('btnPng');
  if (!currentModel) { alert("Pluim eerst laden"); return; }
  const dagVan = Math.max(1, parseInt(document.getElementById('pngVan').value) || 1);
  const dagTot = Math.min(currentModel.nDays, parseInt(document.getElementById('pngTot').value) || currentModel.nDays);
  const exportModel = (dagVan === 1 && dagTot === currentModel.nDays) ? currentModel : sliceModel(currentModel, dagVan, dagTot);
  btn.disabled = true; const old = btn.textContent; btn.textContent = "PNG renderen…";
  const blob = new Blob([buildPageSvg(exportModel)], { type:'image/svg+xml;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const img = new Image();
  img.onload = () => {
    const SCALE = 1.18;
    const w = Math.round(PAGE_W * SCALE);
    const h = Math.round(PAGE_H * SCALE);
    const canvas = document.createElement('canvas');
    canvas.width = w; canvas.height = h;
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = "#ffffff"; ctx.fillRect(0,0,w,h);
    ctx.drawImage(img, 0, 0, w, h);
    canvas.toBlob(b => {
      const blobUrl = URL.createObjectURL(b);
      const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
      if(isIOS){ window.open(blobUrl, '_blank'); URL.revokeObjectURL(url); btn.disabled = false; btn.textContent = old; return; }
      const a = document.createElement('a');
      a.href = blobUrl;
      a.download = `pluim_${currentStation.name.toLowerCase().replace(/\s+/g,'_')}_a4.png`;
      a.click();
      URL.revokeObjectURL(blobUrl); URL.revokeObjectURL(url);
      btn.disabled = false; btn.textContent = old;
    }, 'image/png');
  };
  img.onerror = () => { alert("PNG-render mislukt"); btn.disabled = false; btn.textContent = old; };
  img.src = url;
}

function scheduleAutoRefresh() {
  if (autoRefreshTimer) clearTimeout(autoRefreshTimer);
  const delay = isFastUpdateWindow() ? FAST_UPDATE_INTERVAL_MS : NORMAL_UPDATE_INTERVAL_MS;
  autoRefreshTimer = setTimeout(async () => {
    const force = isFastUpdateWindow();
    if (!document.hidden) {
      try { await loadAndRender(force); } catch (_) {}
    }
    scheduleAutoRefresh();
  }, delay);
}

document.addEventListener('visibilitychange', () => {
  if (!document.hidden && isFastUpdateWindow()) loadAndRender(true);
});

// De URL bevat de exacte geverifieerde runuren en is daardoor veilig
// edge-cachebaar. Alleen een expliciete vernieuwing of achtergrondpoll omzeilt
// de cache; de eerste opening hoeft niet onnodig op de upstream te wachten.
loadAndRender(false);
scheduleAutoRefresh();
</script>
