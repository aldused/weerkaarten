<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Waarnemingen toplijst – Ed Aldus WM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: "DM Sans", ui-sans-serif, system-ui, sans-serif;
    background: #f6f8fb;
    color: #0f172a;
    font-size: 13px;
    font-feature-settings: "ss01","cv11";
  }

  header {
    background: #ffffff;
    color: #0f172a;
    padding: 12px 20px 10px;
    border-bottom: 1px solid #e3e8ef;
  }
  header h1 { font-size: 15px; font-weight: 700; letter-spacing: -0.01em; }
  header p  { font-size: 11px; color: #64748b; margin-top: 2px; font-family: "DM Mono", ui-monospace, monospace; font-weight: 500; }
  header a  { color: #00205b; text-decoration: none; font-size: 12px; display: inline-block; margin-top: 6px; font-weight: 600; }
  header a:hover { text-decoration: underline; }

  /* Maandtabs */
  .maand-tabs {
    display: flex;
    gap: 4px;
    padding: 10px 16px 0;
    background: #ffffff;
    border-bottom: 1px solid #e3e8ef;
    flex-wrap: wrap;
  }
  .maand-tab {
    padding: 7px 14px;
    border-radius: 8px 8px 0 0;
    background: transparent;
    border: none;
    cursor: pointer;
    font-size: 12px;
    color: #64748b;
    font-weight: 600;
    transition: all 0.15s;
    font-family: "DM Sans", ui-sans-serif, system-ui, sans-serif;
    border-bottom: 2px solid transparent;
    margin-bottom: -1px;
  }
  .maand-tab:hover { color: #0f172a; background: #eef2f7; }
  .maand-tab.actief {
    color: #00205b;
    border-bottom-color: #00205b;
    background: #ffffff;
  }

  /* Dagtabs */
  .dag-tabs {
    display: flex;
    gap: 3px;
    padding: 8px 16px 0;
    background: #ffffff;
    border-bottom: 1px solid #e3e8ef;
    flex-wrap: wrap;
  }
  .dag-tab {
    padding: 5px 10px;
    border-radius: 6px 6px 0 0;
    background: transparent;
    border: none;
    cursor: pointer;
    font-size: 11px;
    color: #64748b;
    font-weight: 500;
    transition: all 0.15s;
    text-align: center;
    line-height: 1.3;
    min-width: 44px;
    border-bottom: 2px solid transparent;
    margin-bottom: -1px;
    font-family: "DM Sans", ui-sans-serif, system-ui, sans-serif;
  }
  .dag-tab:hover { color: #0f172a; background: #eef2f7; }
  .dag-tab.actief {
    color: #00205b;
    font-weight: 700;
    border-bottom-color: #00205b;
  }

  /* Inhoud */
  .inhoud {
    padding: 14px;
    max-width: 1200px;
    margin: 0 auto;
  }

  .status-balk {
    font-size: 0.75rem;
    color: #5a7090;
    margin-bottom: 12px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .badge {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 10px;
    font-size: 0.7rem;
    font-weight: 600;
    background: #f0c040;
    color: #5a4000;
  }
  .badge.definitief { background: #4caf7d; color: white; }

  .grid-6 {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 10px;
  }
  @media (max-width: 1300px) { .grid-6 { grid-template-columns: repeat(3, 1fr); } }
  @media (max-width: 700px)  { .grid-6 { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 400px)  { .grid-6 { grid-template-columns: 1fr; } }

  .kolom {
    background: white;
    border-radius: 12px;
    border: 1px solid #e3e8ef;
    box-shadow: 0 1px 2px rgba(15,23,42,0.04);
    overflow: hidden;
  }
  .kolom-header {
    padding: 7px 10px;
    font-weight: 700;
    font-size: 0.8rem;
    letter-spacing: 0.02em;
  }
  .kolom-header.tx { background: #c0392b; color: white; }
  .kolom-header.tn { background: #2471a3; color: white; }
  .kolom-header.rh { background: #1a7a4a; color: white; }
  .kolom-header.fx { background: #6c3483; color: white; }
  .kolom-header.ff { background: #d35400; color: white; }
  .kolom-header.t10n { background: #0e7c4a; color: white; }
  .kolom-header.sq { background: #e67e00; color: white; }
  .kolom-header.sq { background: #e67e00; color: white; }

  table { width: 100%; border-collapse: collapse; }
  tr:nth-child(even) { background: #f7f9fc; }
  tr:hover { background: #eef3fa; }
  td {
    padding: 3px 8px;
    border-bottom: 1px solid #eef1f5;
    white-space: nowrap;
  }
  td.rang { width: 20px; color: #94a6be; font-size: 0.68rem; text-align: right; padding-right: 3px; }
  td.waarde { width: 56px; font-weight: 700; text-align: right; font-variant-numeric: tabular-nums; }
  td.waarde.tx-kleur { color: #c0392b; }
  td.waarde.tn-kleur { color: #2471a3; }
  td.waarde.rh-kleur { color: #1a7a4a; }
  td.waarde.fx-kleur { color: #6c3483; }
  td.waarde.ff-kleur { color: #d35400; }
  td.waarde.t10n-kleur { color: #0e7c4a; }
  td.station { color: #2c3e50; font-size: 0.76rem; }

  tr.top1 td { background: #fff9e6 !important; }
  tr.top2 td { background: #fffdf5 !important; }
  tr.top3 td { background: #fefef9 !important; }
  tr.top1 td.rang { font-weight: 800; color: #c8a000; }
  tr.top1 td.station { font-weight: 600; }

  .cat-tabs { display:inline-flex; margin:10px 16px 8px; background:#eef2f7; border-radius:8px; padding:2px; gap:2px; }
  .cat-tab { padding:6px 14px; border-radius:6px; background:transparent; border:none; cursor:pointer; font-size:12px; color:#334155; font-weight:600; transition:all 0.15s; font-family:"DM Sans", ui-sans-serif, system-ui, sans-serif; }
  .cat-tab:hover { color:#0f172a; background:rgba(255,255,255,0.6); }
  .cat-tab.actief { background:#ffffff; color:#0f172a; box-shadow:0 1px 2px rgba(15,23,42,0.06); }
  .laden { padding: 40px; text-align: center; color: #94a3b8; font-family: "DM Mono", ui-monospace, monospace; }
  .fout   { padding: 40px; text-align: center; color: #dc2626; }
</style>
</head>
<body>



<div class="maand-tabs" id="maand-tabs">
  <span class="laden" style="color:#7fb8f7">Laden…</span>
</div>

<div class="cat-tabs" id="cat-tabs">
  <div class="cat-tab actief" data-cat="temp">🌡 Temperatuur</div>
  <div class="cat-tab" data-cat="wind">💨 Wind</div>
  <div class="cat-tab" data-cat="neerslag">🌧 Neerslag &amp; Zon</div>
</div>
<div class="dag-tabs" id="dag-tabs"></div>

<div class="inhoud" id="inhoud">
  <div class="laden">Gegevens worden opgehaald…</div>
</div>

<script>
const JSON_URL = "toplijst.json?t=" + Date.now();
const NL_MAANDEN = ["","jan","feb","mrt","apr","mei","jun","jul","aug","sep","okt","nov","dec"];
const NL_DAGEN   = ["zo","ma","di","wo","do","vr","za"];

let dagData = {};
let actieveMaand = null;
let actieveDag = null;

function dagNaamKort(datumStr) {
  const d = new Date(datumStr + "T12:00:00");
  return `${NL_DAGEN[d.getDay()]} ${d.getDate()}`;
}

function fxKmh(ms) { return (ms * 3.6).toFixed(0); }

const BFT_THRESH = [0.3,1.6,3.4,5.5,8.0,10.8,13.9,17.2,20.8,24.5,28.5,32.7];
function msToBft(ms) {
  let b = 0;
  for (let i = 0; i < BFT_THRESH.length; i++) {
    if (ms >= BFT_THRESH[i]) b = i + 1; else break;
  }
  return b;
}
function ddNaarPijl(dd) {
  if (dd === null || dd === undefined) return '';
  const pijlen = ['↓','↙','←','↖','↑','↗','→','↘'];
  return pijlen[Math.round(dd / 45) % 8];
}

function maakTabelFF(rijen) {
  if (!rijen || rijen.length === 0) return '<p style="padding:8px;color:#aaa;font-size:0.75rem">Geen data</p>';
  let html = '<table>';
  rijen.forEach((item, i) => {
    // item = [ff, naam, tijdvak, dd]  of  [ff, naam]  (oude data)
    const waarde = Array.isArray(item) ? item[0] : item;
    const station = Array.isArray(item) ? item[1] : '';
    const tijdvak = Array.isArray(item) && item[2] ? item[2] : null;
    const dd      = Array.isArray(item) && item.length > 3 ? item[3] : null;
    const rang = i + 1;
    const topKlasse = rang === 1 ? 'top1' : rang === 2 ? 'top2' : rang === 3 ? 'top3' : '';
    const msAfgerond = Math.round(waarde);
    const bft = msToBft(msAfgerond);
    let cel = `${waarde.toFixed(2)}<small style="font-size:0.62rem;margin-left:1px">m/s</small> <span style="color:#aaa;font-size:0.68rem">Bft${bft}</span>`;
    // Top 3: tijdvak + pijltje als extra regel
    let extra = '';
    if (rang <= 3 && (tijdvak || dd !== null)) {
      const pijl = ddNaarPijl(dd);
      extra = `<div style="font-size:0.65rem;color:#888;margin-top:1px">${tijdvak || ''}${pijl ? ' ' + pijl : ''}</div>`;
    }
    html += `<tr class="${topKlasse}">
      <td class="rang">${rang}</td>
      <td class="waarde ff-kleur">${cel}${extra}</td>
      <td class="station">${station}</td>
    </tr>`;
  });
  return html + '</table>';
}


function ffWeergave(ms) {
  const msAfgerond = Math.round(ms);
  const bft = msToBft(msAfgerond);
  return `${ms.toFixed(2)}<small style="font-size:0.62rem;margin-left:1px">m/s</small> <span style="color:#aaa;font-size:0.68rem">Bft${bft}</span>`;
}

function maakTabel(rijen, klasse, eenheid, transform, htmlTransform) {
  if (!rijen || rijen.length === 0) return '<p style="padding:8px;color:#aaa;font-size:0.75rem">Geen data</p>';
  let html = '<table>';
  rijen.forEach((item, i) => {
    const waarde  = Array.isArray(item) ? item[0] : item;
    const station = Array.isArray(item) ? item[1] : '';
    const tijdstip = Array.isArray(item) && item[2] ? item[2] : null;
    const rang = i + 1;
    const topKlasse = rang === 1 ? 'top1' : rang === 2 ? 'top2' : rang === 3 ? 'top3' : '';
    let cel = htmlTransform ? htmlTransform(waarde)
            : `${transform ? transform(waarde) : waarde.toFixed(1)}<small>${eenheid}</small>`;
    const tijdEl = tijdstip ? `<span style="color:#aaa;font-size:0.65rem;margin-left:3px">om ${tijdstip}</span>` : '';
    html += `<tr class="${topKlasse}">
      <td class="rang">${rang}</td>
      <td class="waarde ${klasse}-kleur">${cel}${tijdEl}</td>
      <td class="station">${station}</td>
    </tr>`;
  });
  return html + '</table>';
}

let actieveCat = 'temp';

function toonCat(cat) {
  actieveCat = cat;
  document.querySelectorAll('.cat-tab').forEach(t =>
    t.classList.toggle('actief', t.dataset.cat === cat));
  if (actieveDag) toonDag(actieveDag);
}

function toonDag(datum) {
  actieveDag = datum;
  document.querySelectorAll('.dag-tab').forEach(t =>
    t.classList.toggle('actief', t.dataset.datum === datum));
  const dag = dagData[datum];
  const badgeKlasse = dag.status === 'definitief' ? 'definitief' : '';
  let kolommen = '';
  if (actieveCat === 'temp') {
    kolommen = `
      <div class="kolom"><div class="kolom-header tx">🌡 Maximum °C</div>${maakTabel(dag.max, 'tx', '°', v => v.toFixed(1))}</div>
      <div class="kolom"><div class="kolom-header tn">❄ Minimum °C</div>${maakTabel(dag.min, 'tn', '°', v => v.toFixed(1))}</div>
      <div class="kolom"><div class="kolom-header t10n">🌿 Min gras °C</div>${maakTabel(dag.t10n || [], 't10n', '°', v => v.toFixed(1))}</div>
      <div class="kolom"><div class="kolom-header" style="background:#5c35a0;color:white;">🥶 Min gevoels °C</div>${maakTabel(dag.gevoels || [], 'tn', '°', v => v.toFixed(1))}</div>`;
  } else if (actieveCat === 'wind') {
    kolommen = `
      <div class="kolom"><div class="kolom-header fx">💨 Windstoten km/h</div>${maakTabel(dag.fx, 'fx', ' km/h', v => fxKmh(v))}</div>
      <div class="kolom"><div class="kolom-header ff">🌬 Wind gem.<div style="font-size:0.65rem;font-weight:400;opacity:0.85">uur .10 › heel · m/s</div></div>${maakTabelFF(dag.ff || [])}</div>`;
  } else if (actieveCat === 'neerslag') {
    kolommen = `
      <div class="kolom"><div class="kolom-header rh">🌧 Neerslag mm</div>${maakTabel(dag.rr, 'rh', 'mm', v => v.toFixed(1))}</div>
      <div class="kolom"><div class="kolom-header sq">☀️ Zon uur</div>${maakTabel(dag.sq || [], 'sq', 'u', v => v.toFixed(1))}</div>`;
  }
  document.getElementById('inhoud').innerHTML = `
    <div class="status-balk">
      <span class="badge ${badgeKlasse}">${dag.status}</span>
      <span>Data van: <strong>${datum}</strong></span>
      <span style="color:#aaa;">·</span>
      <span>Bijgewerkt: <strong style="color:#2a4a70">${dag.update || '–'}</strong></span>
    </div>
    <div class="grid-6">${kolommen}</div>`;
}

function toonMaand(maand) {
  actieveMaand = maand;
  document.querySelectorAll('.maand-tab').forEach(t =>
    t.classList.toggle('actief', t.dataset.maand === maand));

  // Dagtabs voor deze maand
  const dagenInMaand = Object.keys(dagData)
    .filter(d => d.startsWith(maand))
    .sort().reverse();

  const dagTabsEl = document.getElementById('dag-tabs');
  dagTabsEl.innerHTML = dagenInMaand.map(d =>
    `<div class="dag-tab" data-datum="${d}">${dagNaamKort(d)}</div>`
  ).join('');

  dagTabsEl.querySelectorAll('.dag-tab').forEach(tab =>
    tab.addEventListener('click', () => toonDag(tab.dataset.datum)));

  // Toon eerste (meest recente) dag
  if (dagenInMaand.length > 0) toonDag(dagenInMaand[0]);
  else document.getElementById('inhoud').innerHTML = '<div class="laden">Geen data voor deze maand</div>';
}

fetch(JSON_URL)
  .then(r => { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
  .then(data => {
    dagData = data;

    // Maanden bepalen (uniek, gesorteerd aflopend)
    const maanden = [...new Set(Object.keys(data).map(d => d.slice(0,7)))]
      .sort().reverse();

    const maandTabsEl = document.getElementById('maand-tabs');
    maandTabsEl.innerHTML = maanden.map(m => {
      const [jaar, mndNr] = m.split('-');
      const label = `${NL_MAANDEN[parseInt(mndNr)]} ${jaar}`;
      return `<div class="maand-tab" data-maand="${m}">${label}</div>`;
    }).join('');

    document.getElementById('cat-tabs').querySelectorAll('.cat-tab').forEach(tab =>
      tab.addEventListener('click', () => toonCat(tab.dataset.cat)));

    maandTabsEl.querySelectorAll('.maand-tab').forEach(tab =>
      tab.addEventListener('click', () => toonMaand(tab.dataset.maand)));

    // Toon meest recente maand
    if (maanden.length > 0) toonMaand(maanden[0]);
  })
  .catch(err => {
    document.getElementById('maand-tabs').innerHTML = '';
    document.getElementById('dag-tabs').innerHTML = '';
    document.getElementById('inhoud').innerHTML =
      `<div class="fout">Kon toplijst.json niet laden.<br><small>${err.message}</small></div>`;
  });
</script>
</body>
</html>
