name: Deploy Pages

# Statische deploy met een concurrency-queue. Alle launchd-jobs pushen
# onafhankelijk naar main (wxbeta, satelliet, hittekracht, dagdata, records,
# guidance-code...). Zonder queue botsen gelijktijdige Pages-deploys en
# faalt de "Deploy to GitHub Pages"-stap. Met cancel-in-progress: false
# wachten nieuwe deploys netjes op de vorige — geen botsingen, geen falen.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Voeg actuele WeatherPro-feed toe
        run: curl --fail --silent --show-error --retry 3 "https://data.weerlab.nl/weatherpro_uur.json" --output weatherpro_uur.json
      - name: Verwijder niet-publieke buildcache
        run: rm -rf _deploy .wrangler
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      # Start deploy-pages pas nadat exact deze workflowrun de artifact via
      # dezelfde Actions-API kan teruglezen. Dit voorkomt de race waarbij de
      # upload klaar is, maar deploy-pages tijdelijk nog 0 artifacts ziet.
      - name: Wacht tot artifactmetadata beschikbaar is
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in $(seq 1 120); do
            artifact_count="$(gh api \
              "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts?per_page=100" \
              --jq '[.artifacts[] | select(.name == "github-pages" and .expired == false)] | length' \
              2>/dev/null || echo 0)"
            if [ "$artifact_count" = "1" ]; then
              echo "github-pages-artifact is zichtbaar; deploy mag starten."
              exit 0
            fi
            if [ $((attempt % 12)) -eq 0 ]; then
              echo "Artifactmetadata nog niet zichtbaar na $((attempt * 5)) seconden."
            fi
            sleep 5
          done
          echo "::error::github-pages-artifact bleef 10 minuten onzichtbaar in de Actions-API."
          exit 1
      - name: Deploy to GitHub Pages
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4
      - name: Wacht voor tweede deploypoging
        if: steps.deployment.outcome == 'failure'
        run: sleep 30
      - name: Deploy to GitHub Pages opnieuw
        id: deployment_retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
