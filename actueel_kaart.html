<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Actuele Waarnemingen – Ed Aldus WM</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: Arial, sans-serif; background: #f0f4f8; color: #1a2b40; }
.header { background: #00205b; padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; border-bottom: 2px solid #2ec4e8; }
.header-titel { color: white; font-size: 14px; font-weight: 700; }
.header-sub { color: #a8c4e8; font-size: 11px; margin-top: 2px; }
.toolbar { background: white; padding: 10px 16px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; border-bottom: 1px solid #dde6f0; }
.btn-param { padding: 5px 14px; border-radius: 16px; border: 1px solid #c5d3e3; background: #f0f4f8; color: #2a4a70; font-size: 12px; font-weight: 600; cursor: pointer; transition: all 0.12s; }
.btn-param:hover { background: #dce9f7; }
.btn-param.actief { color: white; border-color: transparent; }
.btn-param.ta.actief   { background: #c0392b; }
.btn-param.ff.actief   { background: #2471a3; }
.btn-param.fx.actief   { background: #6c3483; }
.btn-param.t10n.actief { background: #1a7a4a; }
.btn-param.vv.actief   { background: #5d4037; }
.btn-param.uu.actief   { background: #0277bd; }
.btn-opslaan { padding: 5px 16px; border-radius: 16px; border: none; background: #003366; color: white; font-size: 12px; font-weight: 700; cursor: pointer; margin-left: auto; }
.kaart-wrap { display: flex; justify-content: center; padding: 16px; }
.kaart-container { position: relative; width: 100%; max-width: 560px; }
.kaart-container img { width: 100%; display: block; border-radius: 0 0 4px 4px; }
.kaart-container svg { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
.kaart-header-band { background: #003366; color: white; padding: 8px 14px; border-radius: 4px 4px 0 0; display: flex; justify-content: space-between; align-items: center; }
.kaart-header-band .links { font-size: 13px; font-weight: 700; }
.kaart-header-band .sub { font-size: 10px; color: #a8c8e8; margin-top: 1px; }
.kaart-header-band .rechts { font-size: 13px; font-weight: 700; text-align: right; }
.kaart-header-band .rechts-sub { font-size: 10px; color: #a8c8e8; }
.legenda { display: flex; gap: 6px; flex-wrap: wrap; padding: 0 16px 16px; justify-content: center; }
.legenda-item { display: flex; align-items: center; gap: 4px; font-size: 11px; color: #5a7090; }
.legenda-blok { width: 14px; height: 14px; border-radius: 3px; border: 1px solid #ccc; }
.status { text-align: center; padding: 12px; font-size: 12px; color: #888; }
#lightbox { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.88); z-index:1000; justify-content:center; align-items:center; }
#lightbox.actief { display:flex; }
#lightbox img { max-width:95vw; max-height:95vh; border-radius:6px; }
#lightbox-sluit { position:fixed; top:16px; right:22px; font-size:2em; color:white; cursor:pointer; }
.zoom-hint { text-align:center; font-size:11px; color:#888; padding:4px 0 0; cursor:pointer; }
</style>
</head>
<body>
<div class="header">
  <div>
    <div class="header-titel">Ed Aldus WM — Actuele Waarnemingen</div>
    <div class="header-sub">KNMI 10-minuten metingen · <span id="hdr-update">laden...</span></div>
  </div>
</div>
<div class="toolbar">
  <div style="display:flex;gap:4px;flex-wrap:wrap;" id="param-btns">
    <button class="btn-param ta actief" data-param="ta">🌡 Temperatuur</button>
    <button class="btn-param ff" data-param="ff">💨 Wind</button>
    <button class="btn-param fx" data-param="fx">⚡ Windstoot</button>
    <button class="btn-param t10n" data-param="t10n">🌿 Grastemperatuur</button>
    <button class="btn-param vv" data-param="vv">👁 Zicht</button>
    <button class="btn-param uu" data-param="uu">💧 Vochtigheid</button>
  </div>
  <button class="btn-opslaan" onclick="slaOp()">⬇ Opslaan PNG</button>
</div>
<div class="kaart-wrap">
  <div style="width:100%;max-width:560px;">
    <div class="kaart-header-band" id="kaart-header">
      <div>
        <div class="links">Ed Aldus WM</div>
        <div class="sub">Waarnemingen KNMI</div>
      </div>
      <div style="text-align:right;">
        <div class="rechts" id="kaart-dag-label">–</div>
        <div class="rechts-sub" id="kaart-subtitel">Temperatuur (°C)</div>
      </div>
    </div>
    <div class="kaart-container" onclick="openZoom()" style="cursor:zoom-in;">
      <img src="kaart_basis_nl.png" id="kaart-basis" alt="Basiskaart Nederland">
      <svg id="nl-kaart" viewBox="0 0 800 1100" xmlns="http://www.w3.org/2000/svg"></svg>
    </div>
    <div class="zoom-hint" onclick="openZoom()">🔍 klik voor vergroting</div>
  </div>
</div>
<div class="legenda" id="legenda"></div>
<div class="status" id="status">Laden...</div>
<div id="lightbox" onclick="sluitZoom()">
  <span id="lightbox-sluit" onclick="sluitZoom()">✕</span>
  <img id="lightbox-img" src="" alt="">
</div>
<script>
const LON_MIN=3.3, LON_MAX=7.4, LAT_MIN=50.45, LAT_MAX=53.8;
const SVG_W=800, SVG_H=1100;
function lonToX(lon){return (lon-LON_MIN)/(LON_MAX-LON_MIN)*SVG_W;}
function latToY(lat){return (1-(lat-LAT_MIN)/(LAT_MAX-LAT_MIN))*SVG_H;}

const PARAMS = {
  ta:  {label:"Temperatuur (°C)",         eenheid:"°",     decimalen:1,
        kleuren:[["#084594","≤0°"],["#4292c6","5°"],["#9ecae1","10°"],["#ffffcc","15°"],["#fed976","20°"],["#fd8d3c","25°"],["#800026","30°+"]],schaal:[-5,30]},
  ff:  {label:"Windsnelheid (Bft)",        eenheid:"bft",   decimalen:0,
        kleuren:[["#aaaaaa","0-2"],["#4caf50","3"],["#8bc34a","4"],["#ffeb3b","5"],["#ff9800","6"],["#f44336","7"],["#b71c1c","8+"]],schaal:[0,9]},
  fx:  {label:"Max windstoot (km/h)",      eenheid:" km/h", decimalen:0,
        kleuren:[["#d4b896","<50"],["#b5835a","60"],["#8b5e3c","70"],["#6b3a1f","80"],["#3d1a08","90+"]],schaal:[0,40]},
  t10n:{label:"Grastemperatuur (°C)",      eenheid:"°",     decimalen:1,
        kleuren:[["#1a3a6b","≤-5°"],["#2980b9","0°"],["#a8d8ea","5°"],["#ffffcc","10°"],["#fed976","15°+"]],schaal:[-10,20]},
  vv:  {label:"Zicht",                     eenheid:"",      decimalen:0,
        kleuren:[["#800026","<200m"],["#e31a1c","500m"],["#fd8d3c","1km"],["#fecc5c","5km"],["#ffffb2","10km+"]],schaal:[0,10000]},
  uu:  {label:"Relatieve vochtigheid (%)", eenheid:"%",     decimalen:0,
        kleuren:[["#fff7bc","30%"],["#fec44f","50%"],["#d95f0e","70%"],["#993404","85%"],["#4d1600","100%"]],schaal:[20,100]}
};

const BFT=[0.3,1.6,3.4,5.5,8.0,10.8,13.9,17.2,20.8,24.5,28.5,32.7];
function msToBft(ms){if(!ms)return 0;let b=0;for(let i=0;i<BFT.length;i++){if(ms>=BFT[i])b=i+1;else break;}return b;}
function windpijl(dd){if(dd==null)return "";const p=["↓","↙","←","↖","↑","↗","→","↘"];return p[Math.round(dd/45)%8];}

function hexToRgb(hex){return [parseInt(hex.slice(1,3),16),parseInt(hex.slice(3,5),16),parseInt(hex.slice(5,7),16)];}
function interpKleur(val,schaal,stops){
  const t=Math.max(0,Math.min(1,(val-schaal[0])/(schaal[1]-schaal[0])));
  const colors=stops.map(s=>hexToRgb(s[0]));
  const idx=Math.min(colors.length-2,Math.floor(t*(colors.length-1)));
  const f=t*(colors.length-1)-idx;
  const a=colors[idx],b=colors[idx+1];
  const r=Math.round(a[0]+f*(b[0]-a[0])),g=Math.round(a[1]+f*(b[1]-a[1])),bl=Math.round(a[2]+f*(b[2]-a[2]));
  const lum=(0.299*r+0.587*g+0.114*bl)/255;
  return [`rgb(${r},${g},${bl})`,lum<0.55?"white":"#222"];
}

function ns(tag){return document.createElementNS("http://www.w3.org/2000/svg",tag);}

let stationData={}, huidigParam="ta";

function tekenKaart(){
  const svg=document.getElementById("nl-kaart");
  svg.innerHTML="";
  const p=PARAMS[huidigParam];
  if(!p)return;

  Object.values(stationData).forEach(st=>{
    if(!st||st.lon==null||st.lat==null)return;
    let val=st[huidigParam];
    if(val==null)return;

    const cx=lonToX(st.lon), cy=latToY(st.lat);

    // Voor ff: gebruik bft als waarde voor kleur
    let kleurVal = val;
    if(huidigParam==="ff") kleurVal = msToBft(val);
    if(huidigParam==="fx") kleurVal = val*3.6;

    const [bg,fg]=interpKleur(kleurVal, p.schaal, p.kleuren);

    let tekst;
    if(huidigParam==="ff"){tekst=windpijl(st.dd)+" "+val.toFixed(1);}
    else if(huidigParam==="fx"){tekst=(val*3.6).toFixed(0);}
    else if(huidigParam==="vv"){tekst=val>=10000?"10+":val>=1000?(val/1000).toFixed(1)+"k":val.toFixed(0);}
    else if(huidigParam==="rh"){tekst=val.toFixed(0)+"%";}
    else{tekst=val.toFixed(p.decimalen)+"°";}

    const g=ns("g");
    const circle=ns("circle");
    circle.setAttribute("cx",cx);circle.setAttribute("cy",cy);
    circle.setAttribute("r",22);circle.setAttribute("fill",bg);
    circle.setAttribute("stroke","white");circle.setAttribute("stroke-width","1.5");
    g.appendChild(circle);

    const text=ns("text");
    text.setAttribute("x",cx);text.setAttribute("y",huidigParam==="ff"?cy-3:cy+4);
    text.setAttribute("text-anchor","middle");text.setAttribute("font-size","12");
    text.setAttribute("font-weight","bold");text.setAttribute("font-family","Arial,sans-serif");
    text.setAttribute("fill",fg);text.textContent=tekst;
    g.appendChild(text);

    if(huidigParam==="ff"){
      const tr=ns("rect");
      tr.setAttribute("x",cx-18);tr.setAttribute("y",cy+6);
      tr.setAttribute("width",36);tr.setAttribute("height",13);
      tr.setAttribute("rx",3);tr.setAttribute("fill","white");
      tr.setAttribute("stroke","#ccc");tr.setAttribute("stroke-width","0.8");
      g.appendChild(tr);
      const tt=ns("text");
      tt.setAttribute("x",cx);tt.setAttribute("y",cy+15);
      tt.setAttribute("text-anchor","middle");tt.setAttribute("font-size","9");
      tt.setAttribute("font-family","Arial,sans-serif");tt.setAttribute("fill","#444");
      tt.textContent="Bft "+msToBft(val);
      g.appendChild(tt);
    }
    svg.appendChild(g);
  });

  // Copyright
  const cr=ns("text");
  cr.setAttribute("x",SVG_W-10);cr.setAttribute("y",SVG_H-12);
  cr.setAttribute("text-anchor","end");cr.setAttribute("font-size","18");
  cr.setAttribute("font-family","Arial,sans-serif");cr.setAttribute("font-style","italic");
  cr.setAttribute("fill","#888888");cr.textContent="© Ed Aldus / KNMI";
  svg.appendChild(cr);

  // Tijdstempel
  const ts=ns("text");
  ts.setAttribute("x",10);ts.setAttribute("y",SVG_H-12);
  ts.setAttribute("text-anchor","start");ts.setAttribute("font-size","18");
  ts.setAttribute("font-family","Arial,sans-serif");ts.setAttribute("font-style","italic");
  ts.setAttribute("fill","#888888");
  ts.textContent="Stand: "+document.getElementById("hdr-update").textContent;
  svg.appendChild(ts);
}

function maakLegenda(){
  const p=PARAMS[huidigParam];
  if(!p)return;
  document.getElementById("legenda").innerHTML=p.kleuren.map(([k,l])=>
    `<div class="legenda-item"><div class="legenda-blok" style="background:${k}"></div>${l}</div>`
  ).join("");
}

function update(){
  const nu=new Date();
  document.getElementById("kaart-dag-label").textContent=
    nu.toLocaleDateString("nl-NL",{weekday:"long",day:"numeric",month:"short"});
  document.getElementById("kaart-subtitel").textContent=PARAMS[huidigParam]?.label||"";
  tekenKaart();
  maakLegenda();
  document.getElementById("status").textContent="";
}

function laadActueel(){
  fetch("actueel.json?t="+Date.now())
    .then(r=>r.json())
    .then(json=>{
      stationData=json.stations||{};
      document.getElementById("hdr-update").textContent=json.bijgewerkt||"";
      update();
    })
    .catch(e=>{document.getElementById("status").textContent="Fout: "+e.message;});
}

function tekenHeader(ctx,breedte,hoogte){
  ctx.fillStyle="#003366";ctx.fillRect(0,0,breedte,hoogte);
  ctx.fillStyle="#4a90c4";ctx.fillRect(0,hoogte-2,breedte,2);
  ctx.fillStyle="white";ctx.font="bold 14px Arial";ctx.textAlign="left";
  ctx.fillText("Ed Aldus WM",14,20);
  ctx.fillStyle="#a8c8e8";ctx.font="10px Arial";
  ctx.fillText("Waarnemingen KNMI",14,34);
  ctx.fillStyle="white";ctx.font="bold 14px Arial";ctx.textAlign="right";
  ctx.fillText(document.getElementById("kaart-dag-label").textContent,breedte-14,20);
  ctx.fillStyle="#a8c8e8";ctx.font="10px Arial";
  ctx.fillText(document.getElementById("kaart-subtitel").textContent,breedte-14,34);
  ctx.textAlign="left";
}

function renderCanvas(cb){
  const img=document.getElementById("kaart-basis");
  const svg=document.getElementById("nl-kaart");
  const header=document.getElementById("kaart-header");
  const canvas=document.createElement("canvas");
  const scale=2;
  canvas.width=img.naturalWidth*scale;
  canvas.height=(img.naturalHeight+header.offsetHeight)*scale;
  const ctx=canvas.getContext("2d");
  ctx.scale(scale,scale);
  tekenHeader(ctx,img.naturalWidth,header.offsetHeight);
  ctx.drawImage(img,0,header.offsetHeight);
  const svgStr=new XMLSerializer().serializeToString(svg);
  const blob=new Blob([svgStr],{type:"image/svg+xml"});
  const url=URL.createObjectURL(blob);
  const svgImg=new Image();
  svgImg.onload=()=>{
    ctx.drawImage(svgImg,0,header.offsetHeight,img.naturalWidth,img.naturalHeight);
    URL.revokeObjectURL(url);
    cb(canvas);
  };
  svgImg.src=url;
}

function openZoom(){renderCanvas(c=>{document.getElementById("lightbox-img").src=c.toDataURL("image/png");document.getElementById("lightbox").classList.add("actief");});}
function sluitZoom(){document.getElementById("lightbox").classList.remove("actief");}
document.addEventListener("keydown",e=>{if(e.key==="Escape")sluitZoom();});

function slaOp(){renderCanvas(c=>{const a=document.createElement("a");a.href=c.toDataURL("image/png");a.download=`edaldus_actueel_${huidigParam}.png`;a.click();});}

document.getElementById("param-btns").addEventListener("click",e=>{
  const btn=e.target.closest(".btn-param");if(!btn)return;
  huidigParam=btn.dataset.param;
  document.querySelectorAll(".btn-param").forEach(b=>b.classList.remove("actief"));
  btn.classList.add("actief");
  update();
});

const imgEl=document.getElementById("kaart-basis");
if(imgEl.complete)laadActueel();else imgEl.onload=laadActueel;
setInterval(laadActueel,10*60*1000);
</script>
</body>
</html>
