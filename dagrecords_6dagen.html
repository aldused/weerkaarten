<head>

<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: "DM Sans", sans-serif; background: #f0f4f8; color: #0f172a; }
.header { background: #1e293b; color: #fff; padding: 12px 20px; border-bottom: 3px solid #2ec4e8; }
.header h1 { font-size: 16px; font-weight: 700; }
.header p { font-size: 11px; color: #94a3b8; margin-top: 2px; font-family: "DM Mono", monospace; }
.legenda { background:#fff; border-bottom:1px solid #e3e8ef; padding:7px 20px; display:flex; align-items:center; gap:2px; flex-wrap:wrap; }

.legenda .hist-key { display:inline-flex; align-items:center; gap:5px; margin-left:12px;
  font-size:10px; color:#64748b; font-weight:600; }
.legenda .hist-dot { width:10px; height:10px; border:2px dashed #0f172a; border-radius:50%; background:#dbeafe; }
.kaarten-wrap { padding: 16px; }
.kaarten-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 14px; max-width: var(--grid-breedte,1180px); margin: 0 auto; }
@media (max-width: 1000px){ .kaarten-grid { grid-template-columns: repeat(2,1fr); } }

.mini-header { background: #1e293b; color: #fff; padding: 9px 12px; display: flex; justify-content: space-between; align-items: baseline; }

.mini-max { display:flex; align-items:baseline; justify-content:center; gap:8px; padding:6px 10px;
  background: linear-gradient(90deg,#fff7ed,#ffedd5); border-bottom:1px solid #fed7aa; }

  padding:2px 6px; border-radius:9999px; text-transform:uppercase; letter-spacing:.4px; }
.mini-max .mm-historisch { font-size:9px; font-weight:700; color:#1e3a8a; background:#dbeafe;
  padding:2px 6px; border-radius:9999px; text-transform:uppercase; letter-spacing:.3px; }
.badge-lopend { display:inline-block; font-size:10px; font-weight:700; color:#fff;
  background:#dc2626; padding:2px 8px; border-radius:9999px; margin-left:6px; vertical-align:middle; }

<body>

<div class="header">
  <h1>Dagrecords maximumtemperatuur · komende 6 dagen</h1>
  <p id="hdr-sub">Laden…</p>
</div>
<div class="legenda" id="legenda"></div>
<div class="toolbar">
  <label for="zoom-slider">Kaartgrootte</label>
  <input type="range" id="zoom-slider" min="700" max="2600" value="1180" step="20"
         oninput="stelGrootteIn(this.value)">
  <span id="zoom-label">1180px</span>
</div>

<div class="kaarten-wrap">
  <div class="kaarten-grid" id="kaarten-grid"></div>
</div>
<div class="status" id="status">Laden…</div>
<div class="footer" id="footer">weerlab.nl · © Ed Aldus WM · KNMI dagrecords</div>

<script src="nl_grens_coords.js"></script>
<script>
(function(){
  function apply(t){ document.documentElement.setAttribute("data-theme", t==="dark"?"dark":"light"); }
  var saved="light"; try { saved=localStorage.getItem("weerlab_theme")||"light"; } catch{}
  apply(saved);
  window.addEventListener("storage",function(e){ if(e.key==="weerlab_theme") apply(e.newValue); });
})();

// ── Geo-projectie (zelfde als alle weerlab NL-kaarten) ───────────────────────
const LON_MIN=3.3, LON_MAX=7.4, LAT_MIN=50.45, LAT_MAX=53.8;
const SVG_W=800, SVG_H=1100;
const GRID_H=210, GRID_W=Math.round(GRID_H*SVG_W/SVG_H);   // interpolatie-raster
const DISP_W=420, DISP_H=Math.round(DISP_W*SVG_H/SVG_W);   // canvas-pixels per kaart
const NS="http://www.w3.org/2000/svg";
const NL_DAGEN=["zondag","maandag","dinsdag","woensdag","donderdag","vrijdag","zaterdag"];
const NL_MAAND=["januari","februari","maart","april","mei","juni","juli","augustus","september","oktober","november","december"];
const NL_MAAND_K=["jan","feb","mrt","apr","mei","jun","jul","aug","sep","okt","nov","dec"];

// IDW-instellingen (zoals mosmix-kaart: shepard kNN + lichte blur)
const POWER=2.5, KNN=8, BLUR=1.6, ALPHA=0.92;

// Label-offset [dlon,dlat] voor stations die te dicht op elkaar liggen: alleen het
// LABEL schuift (met leiderlijntje), de stip + interpolatie blijven op de echte plek.
// Historische locaties kunnen dicht bij een huidig station liggen. Alleen hun
// label verschuift; de meetstip en interpolatie blijven op de echte locatie.
const LABEL_OFFSET = {
  "Venlo":[-0.08,-0.04], "Arcen":[0.06,0.05],
  "Sittard":[0.08,0.04], "Maastricht":[-0.06,-0.05],
  "Soesterberg":[0.08,-0.04], "De Bilt":[-0.06,0.04]
};
const LABEL_KANDIDATEN = [[0,0]];
for(const straal of [44,88,132,176,220]){
  for(let dx=-straal;dx<=straal;dx+=44){
    LABEL_KANDIDATEN.push([dx,-straal],[dx,straal]);
  }
  for(let dy=-straal+44;dy<=straal-44;dy+=44){
    LABEL_KANDIDATEN.push([-straal,dy],[straal,dy]);
  }
}

// Kleurramp voor records (geel → oranje → rood → magenta), genormaliseerd op venster
const RAMP=[
  [0.00,"#2b83ba"],[0.12,"#80bfab"],[0.25,"#c7e8ad"],[0.38,"#edf7b3"],
  [0.50,"#ffedaa"],[0.62,"#fec980"],[0.72,"#fb9a4f"],[0.82,"#ef6548"],
  [0.90,"#d7301f"],[0.96,"#990000"],[1.00,"#67001f"]
];
let SCHAAL=[20,40];   // wordt per venster bepaald

function rampKleur(val){
  const [vmin,vmax]=SCHAAL;
  let t=(val-vmin)/(vmax-vmin); t=Math.max(0,Math.min(1,t));
  let prev=RAMP[0];
  for(const stop of RAMP){
    if(t<=stop[0]){
      const span=stop[0]-prev[0]||1, f=(t-prev[0])/span;
      const a=hex(prev[1]), b=hex(stop[1]);
      return [Math.round(a[0]+f*(b[0]-a[0])),Math.round(a[1]+f*(b[1]-a[1])),Math.round(a[2]+f*(b[2]-a[2]))];
    }
    prev=stop;
  }
  return hex(RAMP[RAMP.length-1][1]);
}
function hex(h){ h=h.replace("#",""); return [parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)]; }
function lum(r,g,b){ return (0.299*r+0.587*g+0.114*b)/255; }

// ── Land-mask uit NL_GRENS (rasteren op GRID-resolutie) ──────────────────────
let LANDMASK=null;
function maakLandMask(){
  const c=document.createElement("canvas"); c.width=GRID_W; c.height=GRID_H;
  const ctx=c.getContext("2d");
  ctx.fillStyle="#000"; ctx.beginPath();
  for(const poly of NL_GRENS){
    if(!poly||poly.length<2) continue;
    poly.forEach(([lon,lat],i)=>{
      const x=(lon-LON_MIN)/(LON_MAX-LON_MIN)*GRID_W;
      const y=(1-(lat-LAT_MIN)/(LAT_MAX-LAT_MIN))*GRID_H;
      if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
    });
    ctx.closePath();
  }
  ctx.fill("evenodd");
  const px=ctx.getImageData(0,0,GRID_W,GRID_H).data;
  const data=new Uint8Array(GRID_W*GRID_H);
  for(let i=0;i<GRID_W*GRID_H;i++) data[i]=px[i*4+3]>0?1:0;
  LANDMASK={w:GRID_W,h:GRID_H,data};
}

// ── IDW-veld (gemodificeerde Shepard, kNN) ───────────────────────────────────
function bouwVeld(punten){
  const w=LANDMASK.w,h=LANDMASK.h, N=punten.length;
  const sp=punten.map(p=>({
    x:(p.lon-LON_MIN)/(LON_MAX-LON_MIN)*w,
    y:(1-(p.lat-LAT_MIN)/(LAT_MAX-LAT_MIN))*h, val:p.val }));
  const veld=new Float32Array(w*h), mask=new Uint8Array(w*h);
  const useK=Math.min(KNN,N);
  for(let y=0;y<h;y++) for(let x=0;x<w;x++){
    const idx=y*w+x;
    if(!LANDMASK.data[idx]) continue;
    const dArr=new Float64Array(N);
    for(let i=0;i<N;i++){ const dx=x-sp[i].x, dy=y-sp[i].y; dArr[i]=Math.sqrt(dx*dx+dy*dy); }
    const idxs=new Int32Array(N); for(let i=0;i<N;i++) idxs[i]=i;
    for(let k=0;k<useK;k++){ let mi=k; for(let j=k+1;j<N;j++) if(dArr[idxs[j]]<dArr[idxs[mi]]) mi=j;
      const t=idxs[k]; idxs[k]=idxs[mi]; idxs[mi]=t; }
    const R=dArr[idxs[useK-1]]+1e-6;
    let sumW=0,sumWV=0;
    for(let k=0;k<useK;k++){
      const i=idxs[k], d=dArr[i];
      if(d<0.7){ sumWV=sp[i].val; sumW=1; break; }
      const num=(R-d)/(R*d), wi=Math.pow(num,POWER);
      sumW+=wi; sumWV+=wi*sp[i].val;
    }
    veld[idx]=sumWV/sumW; mask[idx]=1;
  }
  return {w,h,veld,mask};
}
function blurVeld(f,sigma){
  if(sigma<=0) return f;
  const {w,h,veld,mask}=f, radius=Math.max(1,Math.ceil(sigma*3));
  const kern=new Float32Array(radius*2+1); let ks=0;
  for(let i=-radius;i<=radius;i++){ const v=Math.exp(-(i*i)/(2*sigma*sigma)); kern[i+radius]=v; ks+=v; }
  for(let i=0;i<kern.length;i++) kern[i]/=ks;
  const tmp=new Float32Array(w*h), out=new Float32Array(w*h);
  for(let y=0;y<h;y++) for(let x=0;x<w;x++){ if(!mask[y*w+x]) continue;
    let s=0,ws=0; for(let k=-radius;k<=radius;k++){ const xx=x+k; if(xx<0||xx>=w||!mask[y*w+xx]) continue;
      s+=veld[y*w+xx]*kern[k+radius]; ws+=kern[k+radius]; } tmp[y*w+x]=ws>0?s/ws:veld[y*w+x]; }
  for(let y=0;y<h;y++) for(let x=0;x<w;x++){ if(!mask[y*w+x]) continue;
    let s=0,ws=0; for(let k=-radius;k<=radius;k++){ const yy=y+k; if(yy<0||yy>=h||!mask[yy*w+x]) continue;
      s+=tmp[yy*w+x]*kern[k+radius]; ws+=kern[k+radius]; } out[y*w+x]=ws>0?s/ws:tmp[y*w+x]; }
  return {w,h,veld:out,mask};
}

// ── Veld → canvas ────────────────────────────────────────────────────────────
function tekenVeld(canvas,f){
  canvas.width=DISP_W; canvas.height=DISP_H;
  const ctx=canvas.getContext("2d");
  const tmp=document.createElement("canvas"); tmp.width=f.w; tmp.height=f.h;
  const tctx=tmp.getContext("2d");
  const img=tctx.createImageData(f.w,f.h), buf=img.data;
  for(let i=0;i<f.w*f.h;i++){
    if(!f.mask[i]){ buf[i*4+3]=0; continue; }
    const [r,g,b]=rampKleur(f.veld[i]);
    buf[i*4]=r; buf[i*4+1]=g; buf[i*4+2]=b; buf[i*4+3]=Math.round(ALPHA*255);
  }
  tctx.putImageData(img,0,0);
  ctx.clearRect(0,0,DISP_W,DISP_H);
  ctx.imageSmoothingEnabled=true; ctx.imageSmoothingQuality="high";
  ctx.drawImage(tmp,0,0,DISP_W,DISP_H);
}

function nlPad(){
  let d="";
  for(const poly of NL_GRENS){ if(!poly||poly.length<2) continue;
    poly.forEach(([lon,lat],i)=>{ const x=(lon-LON_MIN)/(LON_MAX-LON_MIN)*SVG_W;
      const y=(1-(lat-LAT_MIN)/(LAT_MAX-LAT_MIN))*SVG_H; d+=(i===0?"M":"L")+x.toFixed(1)+" "+y.toFixed(1); }); d+="Z"; }
  return d;
}

// Kies per station een vrije labelpositie rondom de echte meetstip. De hoogste
// en historische records krijgen voorrang; overige labels wijken zo nodig uit.
// Daardoor blijft de kaart leesbaar als er een extra opgeheven locatie bijkomt.
function berekenLabelPosities(punten,mx){
  const geprojecteerd=punten.map(p=>({
    ...p,
    x:(p.lon-LON_MIN)/(LON_MAX-LON_MIN)*SVG_W,
    y:(1-(p.lat-LAT_MIN)/(LAT_MAX-LAT_MIN))*SVG_H
  })).sort((a,b)=>{
    const maxVerschil=Number(b.naam===mx?.naam)-Number(a.naam===mx?.naam);
    if(maxVerschil) return maxVerschil;
    const histVerschil=Number(b.historisch)-Number(a.historisch);
    return histVerschil || b.val-a.val;
  });
  const bezet=[], resultaat={};
  for(const p of geprojecteerd){
    const isMax=p.naam===mx?.naam;
    const naamHoogte=p.historisch?22:0;
    const breedte=Math.max(isMax?112:96,p.historisch?Math.min(154,p.naam.length*7.5):0), marge=6;
    const voorkeur=LABEL_OFFSET[p.naam];
    const kandidaten=voorkeur ? [[
      voorkeur[0]/(LON_MAX-LON_MIN)*SVG_W,
      -voorkeur[1]/(LAT_MAX-LAT_MIN)*SVG_H
    ],...LABEL_KANDIDATEN] : LABEL_KANDIDATEN;
    let beste=null;
    for(const [dx,dy] of kandidaten){
      const lx=Math.max(breedte/2+marge,Math.min(SVG_W-breedte/2-marge,p.x+dx));
      const ly=Math.max(34+marge,Math.min(SVG_H-24-naamHoogte-marge,p.y+dy));
      const box={l:lx-breedte/2-marge,r:lx+breedte/2+marge,
        t:ly-34-marge,b:ly+22+naamHoogte+marge};
      let overlap=0;
      for(const q of bezet){
        const ow=Math.max(0,Math.min(box.r,q.r)-Math.max(box.l,q.l));
        const oh=Math.max(0,Math.min(box.b,q.b)-Math.max(box.t,q.t));
        overlap+=ow*oh;
      }
      const afstand=Math.hypot(lx-p.x,ly-p.y);
      const score=overlap*10000+afstand;
      if(!beste||score<beste.score) beste={lx,ly,box,score};
      if(overlap===0&&afstand<1) break;
    }
    resultaat[p.naam]=beste;
    bezet.push(beste.box);
  }
  return resultaat;
}

// ── 1 kaart bouwen ───────────────────────────────────────────────────────────
function bouwKaart(stations, dagRec, datumKey, dt){
  // punten verzamelen
  const punten=[];
  for(const [naam,rec] of Object.entries(dagRec)){
    const co=stations[naam]; if(!co) continue;
    punten.push({naam, lon:co[0], lat:co[1], val:rec.t, jaar:rec.d.slice(0,4),
      lopend:!!rec.l, historisch:!!rec.h});
  }
  // hoogste
  let mx=null; for(const p of punten) if(mx===null||p.val>mx.val) mx=p;

  const dagNaam=NL_DAGEN[dt.getDay()];
  const dagLabel=dagNaam.charAt(0).toUpperCase()+dagNaam.slice(1);
  const datum=dt.getDate()+" "+NL_MAAND[dt.getMonth()];

  const wrap=document.createElement("div"); wrap.className="mini-kaart";
  wrap.innerHTML=
    `<div class="mini-header"><span class="mini-dag-naam">${dagLabel}</span>`+
    `<span class="mini-dag-datum">${datum}</span></div>`+
    (mx?`<div class="mini-max"><span class="mm-label">hoogste ooit</span>`+
        `<span class="mm-val">${mx.val.toFixed(1)}°</span>`+
        `<span class="mm-meta">${mx.naam} · ${mx.jaar}</span>`+
        (mx.historisch?`<span class="mm-historisch">historisch</span>`:``)+
        (mx.lopend?`<span class="mm-lopend">dit seizoen</span>`:``)+`</div>`
       :`<div class="mini-max"><span class="mm-label">geen data</span></div>`);

  const box=document.createElement("div"); box.className="kaart-box";
  const canvas=document.createElement("canvas");
  const svg=document.createElementNS(NS,"svg");
  svg.setAttribute("viewBox","0 0 "+SVG_W+" "+SVG_H);
  svg.setAttribute("preserveAspectRatio","xMidYMid meet");

  if(punten.length>=3){
    let f=bouwVeld(punten); f=blurVeld(f,BLUR);
    tekenVeld(canvas,f);
  } else { canvas.width=DISP_W; canvas.height=DISP_H; }

  // NL-grens
  const grens=document.createElementNS(NS,"path"); grens.setAttribute("d",nlPad());
  grens.setAttribute("class","nl-grens"); svg.appendChild(grens);

  // stationslabels: waarde groot + jaartal klein eronder
  const labelPosities=berekenLabelPosities(punten,mx);
  for(const p of punten){
    const x=(p.lon-LON_MIN)/(LON_MAX-LON_MIN)*SVG_W;
    const y=(1-(p.lat-LAT_MIN)/(LAT_MAX-LAT_MIN))*SVG_H;
    const {lx,ly}=labelPosities[p.naam]||{lx:x,ly:y};
    const isMax=(mx&&p.naam===mx.naam);
    // Witte tekst + donkere rand = leesbaar op elke veldkleur (geel→dieprood).
    // Lopend (record dit seizoen) = lichtrood jaartal i.p.v. donkerrood-op-rood.
    const HALO="#0f172a";
    // leiderlijntje stip → verschoven label
    if(Math.hypot(lx-x,ly-y)>8) svg.appendChild(node("line",{x1:x,y1:y,x2:lx,y2:ly,
      stroke:"#0f172a99","stroke-width":1.5}));
    // stip op de ECHTE plek
    svg.appendChild(node("circle",{cx:x,cy:y,r:isMax?7:4,
      fill:isMax?"#ffd24a":(p.historisch?"#dbeafe":"#ffffff"),
      stroke:isMax?"#7a1212":HALO,"stroke-width":isMax?3:1.5,
      "stroke-dasharray":p.historisch&&!isMax?"5 3":"none"}));
    // waarde
    svg.appendChild(node("text",{x:lx,y:ly-9,"text-anchor":"middle","font-family":"DM Mono,monospace",
      "font-weight":"700","font-size":isMax?28:22,fill:"#ffffff","paint-order":"stroke",
      stroke:HALO,"stroke-width":isMax?6:5,"stroke-linejoin":"round"},
      p.val.toFixed(1)+"°"));
    // jaartal klein — lopend lichtrood, anders wit; zelfde donkere rand
    svg.appendChild(node("text",{x:lx,y:ly+16,"text-anchor":"middle","font-family":"DM Mono,monospace",
      "font-weight":"700","font-size":14,fill:p.lopend?"#fda4af":"#ffffff","paint-order":"stroke",
      stroke:HALO,"stroke-width":4,"stroke-linejoin":"round"},
      p.jaar));
    // Alleen bij minder bekende historische/opgeheven locaties de plaatsnaam.
    // Actieve KNMI-stations houden zo het rustige label met waarde + jaartal.
    if(p.historisch) svg.appendChild(node("text",{x:lx,y:ly+37,"text-anchor":"middle",
      "font-family":"DM Mono,monospace","font-weight":"700","font-size":13,
      fill:"#dbeafe","paint-order":"stroke",stroke:HALO,"stroke-width":3,
      "stroke-linejoin":"round"},p.naam));
  }

  box.appendChild(canvas); box.appendChild(svg); wrap.appendChild(box);
  wrap.insertAdjacentHTML("beforeend",`<div class="mini-footer">weerlab.nl · KNMI dagrecords</div>`);
  return wrap;
}
function node(tag,attrs,txt){ const e=document.createElementNS(NS,tag);
  for(const [k,v] of Object.entries(attrs)) e.setAttribute(k,v); if(txt!=null) e.textContent=txt; return e; }

function tekenLegenda(){
  const el=document.getElementById("legenda"); el.innerHTML="";
  el.appendChild(Object.assign(document.createElement("span"),{className:"lab",textContent:"Schaal (°C):"}));
  const [vmin,vmax]=SCHAAL, n=9;
  const blkRow=document.createElement("div"); blkRow.style.display="flex"; blkRow.style.flexDirection="column";
  const blks=document.createElement("div"); blks.style.display="flex";
  const ticks=document.createElement("div"); ticks.style.display="flex";
  for(let i=0;i<n;i++){
    const v=vmin+(vmax-vmin)*i/(n-1); const [r,g,b]=rampKleur(v);
    blks.appendChild(node2("span","blk",`background:rgb(${r},${g},${b})`,""));
    ticks.appendChild(node2("span","tick","",v.toFixed(0)));
  }
  blkRow.appendChild(blks); blkRow.appendChild(ticks); el.appendChild(blkRow);
  const hist=document.createElement("span"); hist.className="hist-key";
  hist.innerHTML='<span class="hist-dot"></span>historische/opgeheven meetlocatie';
  el.appendChild(hist);
}
function node2(tag,cls,style,txt){ const e=document.createElement(tag); e.className=cls; if(style)e.style.cssText=style; e.textContent=txt; return e; }

// ── Kaartgrootte-schuif ──────────────────────────────────────────────────────
function stelGrootteIn(breedte, opslaan=true){
  document.documentElement.style.setProperty("--grid-breedte", breedte+"px");
  document.getElementById("zoom-label").textContent = breedte+"px";
  document.getElementById("zoom-slider").value = breedte;
  if(opslaan) try{ localStorage.setItem("dagrecords_breedte", breedte); }catch{}
}
(function(){ let b=1180; try{ b=parseInt(localStorage.getItem("dagrecords_breedte"))||1180; }catch{} stelGrootteIn(b, false); })();

// ── Laden ────────────────────────────────────────────────────────────────────
// Productie: R2 (data is R2-only). Localhost blokkeert CORS → val terug op het
// relatieve bestand (door launchd lokaal vers gehouden).
function haalDagrecords(){
  const lokaal=/^(localhost|127\.0\.0\.1)$/.test(location.hostname);
  const primair=lokaal?"dagrecords_nl.json":"https://data.weerlab.nl/dagrecords_nl.json";
  const fallback=lokaal?"https://data.weerlab.nl/dagrecords_nl.json":"dagrecords_nl.json";
  return fetch(primair+"?t="+Date.now())
    .then(r=>{ if(!r.ok) throw 0; return r.json(); })
    .catch(()=>fetch(fallback+"?t="+Date.now()).then(r=>r.json()));
}
haalDagrecords().then(data=>{
  maakLandMask();
  const stations=data.stations, recs=data.dagrecords;
  const grid=document.getElementById("kaarten-grid"); grid.innerHTML="";

  // 6 kalenderdagen vanaf vandaag (of ?start=YYYY-MM-DD om te previewen)
  const qStart=new URLSearchParams(location.search).get("start");
  const vandaag = qStart ? new Date(qStart+"T12:00:00") : new Date();
  vandaag.setHours(12,0,0,0);
  const dagen=[];
  for(let i=0;i<6;i++){
    const dt=new Date(vandaag); dt.setDate(dt.getDate()+i);
    const key=String(dt.getMonth()+1).padStart(2,"0")+"-"+String(dt.getDate()).padStart(2,"0");
    dagen.push({dt,key,rec:recs[key]||{}});
  }
  // gedeelde schaal over het venster (max contrast, dagen vergelijkbaar)
  let lo=Infinity,hi=-Infinity;
  for(const d of dagen) for(const v of Object.values(d.rec)){ if(v.t<lo)lo=v.t; if(v.t>hi)hi=v.t; }
  if(isFinite(lo)){ SCHAAL=[Math.floor(lo-1),Math.ceil(hi+0.5)]; }
  tekenLegenda();

  for(const d of dagen) grid.appendChild(bouwKaart(stations,d.rec,d.key,d.dt));

  document.getElementById("status").textContent="";
  const gen=(data.gegenereerd||"").replace("T"," ").replace("+00:00"," UTC");
  const lop=data.lopend||"";
  const aantallen=data.station_aantallen||{};
  const histAantal=aantallen.historisch||0;
  document.getElementById("hdr-sub").innerHTML="Hoogste max-temp ooit per kalenderdag · "+Object.keys(stations).length+" KNMI-meetlocaties"+
    (histAantal?` · incl. ${histAantal} historische/opgeheven locaties`:"")+
    (lop?` <span class="badge-lopend">incl. lopende metingen t/m ${lop}</span>`:"");
  document.getElementById("footer").textContent="weerlab.nl · © Ed Aldus WM · KNMI dagrecords (incl. lopende EDR) · "+gen;
}).catch(e=>{ document.getElementById("status").textContent="Kon data niet laden: "+e.message; });
</script>
