<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kaarten Editor — Pluim</title>
  <link rel="stylesheet" href="./kaarten_editor_shell.css?v=20260809-v1" />
  <script>globalThis.WEERLAB_EDITOR_MODE = 'plume';</script>
  <script defer src="./kaarten_editor_pin.js?v=20260809-v1"></script>
  <script src="./pluim_run_switcher_032667819e3a.js" data-editor-mode-aware="true" data-required="temperature_2m,precipitation,wind_speed_10m,cloud_cover,wind_gusts_10m"></script>
  <script type="module" crossorigin src="./landelijke-editor-assets/weerbewaking_landelijke_kaart-pc6L27QC.js?v=20260823-labelafstand-v38"></script>
</head>
<body>
  <div id="pin-gate">
    <form class="pin-card" id="pin-form">
      <div class="pin-icon">🔒</div>
      <h1>Pluim</h1>
      <p>Voer de viercijferige pincode in om de pluimeditor te openen.</p>
      <input class="pin-input" id="pin-input" type="password" inputmode="numeric" pattern="[0-9]{4}" maxlength="4" autocomplete="one-time-code" aria-label="Pincode" required autofocus />
      <button class="pin-submit" type="submit">Open editor</button>
      <div id="pin-error" role="alert"></div>
    </form>
  </div>
  <div id="root"></div>
</body>
</html>
