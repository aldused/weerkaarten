<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Waarnemingen toplijst – Ed Aldus WM</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Segoe UI', Arial, sans-serif;
    background: #f0f4f8;
    color: #1a2b40;
    font-size: 13px;
  }

  header {
    background: #0d2b5e;
    color: white;
    padding: 14px 20px 10px;
  }
  header h1 { font-size: 1.25rem; font-weight: 700; letter-spacing: 0.01em; }
  header p  { font-size: 0.78rem; opacity: 0.75; margin-top: 2px; }
  header a  { color: #7fb8f7; text-decoration: none; font-size: 0.78rem; display: inline-block; margin-top: 6px; }
  header a:hover { text-decoration: underline; }

  /* Dagtabs */
  .dag-tabs {
    display: flex;
    gap: 6px;
    padding: 12px 16px 0;
    background: #e4eaf2;
    border-bottom: 2px solid #c5d3e3;
    flex-wrap: wrap;
  }
  .dag-tab {
    padding: 6px 14px;
    border-radius: 6px 6px 0 0;
    background: #c5d3e3;
    border: 1px solid #b0c2d8;
    border-bottom: none;
    cursor: pointer;
    font-size: 0.8rem;
    color: #2a4a70;
    font-weight: 500;
    transition: background 0.15s;
  }
  .dag-tab:hover { background: #b0c2d8; }
  .dag-tab.actief {
    background: white;
    color: #0d2b5e;
    font-weight: 700;
    border-color: #c5d3e3;
  }

  /* Inhoud */
  .inhoud {
    padding: 16px;
    max-width: 1100px;
    margin: 0 auto;
  }

  .status-balk {
    font-size: 0.75rem;
    color: #5a7090;
    margin-bottom: 12px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .badge {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 10px;
    font-size: 0.7rem;
    font-weight: 600;
    background: #f0c040;
    color: #5a4000;
  }
  .badge.definitief { background: #4caf7d; color: white; }

  /* Grid met 4 kolommen */
  .grid-4 {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
  }
  @media (max-width: 900px) { .grid-4 { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 500px) { .grid-4 { grid-template-columns: 1fr; } }

  .kolom {
    background: white;
    border-radius: 8px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.08);
    overflow: hidden;
  }

  .kolom-header {
    padding: 8px 12px;
    font-weight: 700;
    font-size: 0.82rem;
    letter-spacing: 0.02em;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .kolom-header.tx { background: #c0392b; color: white; }
  .kolom-header.tn { background: #2471a3; color: white; }
  .kolom-header.rh { background: #1a7a4a; color: white; }
  .kolom-header.fx { background: #6c3483; color: white; }

  table { width: 100%; border-collapse: collapse; }
  tr:nth-child(even) { background: #f7f9fc; }
  tr:hover { background: #eef3fa; }

  td {
    padding: 4px 10px;
    border-bottom: 1px solid #eef1f5;
    white-space: nowrap;
  }
  td.rang {
    width: 22px;
    color: #94a6be;
    font-size: 0.7rem;
    text-align: right;
    padding-right: 4px;
  }
  td.waarde {
    width: 52px;
    font-weight: 700;
    text-align: right;
    font-variant-numeric: tabular-nums;
  }
  td.waarde.tx-kleur { color: #c0392b; }
  td.waarde.tn-kleur { color: #2471a3; }
  td.waarde.rh-kleur { color: #1a7a4a; }
  td.waarde.fx-kleur { color: #6c3483; }
  td.station { color: #2c3e50; font-size: 0.78rem; }

  /* Top 3 accentuering */
  tr.top1 td { background: #fff9e6 !important; }
  tr.top2 td { background: #fffdf5 !important; }
  tr.top3 td { background: #fefef9 !important; }
  tr.top1 td.rang { font-weight: 800; color: #c8a000; font-size: 0.75rem; }
  tr.top1 td.station { font-weight: 600; }

  .laden { padding: 40px; text-align: center; color: #7a90a8; }
  .fout   { padding: 40px; text-align: center; color: #c0392b; }
</style>
</head>
<body>

<div class="dag-tabs" id="dag-tabs">
  <span class="laden">Laden…</span>
</div>

<div class="inhoud" id="inhoud">
  <div class="laden">Gegevens worden opgehaald…</div>
</div>

<script>
const JSON_URL = "toplijst.json?t=" + Date.now();

let dagData = {};
let geselecteerdeDag = null;

function dagNaam(datumStr) {
  const d = new Date(datumStr + "T12:00:00");
  const dagen = ["zo","ma","di","wo","do","vr","za"];
  const mnd   = ["jan","feb","mrt","apr","mei","jun","jul","aug","sep","okt","nov","dec"];
  return `${dagen[d.getDay()]} ${d.getDate()} ${mnd[d.getMonth()]}`;
}

function fxKmh(ms) {
  return (ms * 3.6).toFixed(0);
}

function maakTabel(rijen, klasse, eenheid, transform) {
  let html = '<table>';
  rijen.forEach(([waarde, station], i) => {
    const rang = i + 1;
    const topKlasse = rang === 1 ? 'top1' : rang === 2 ? 'top2' : rang === 3 ? 'top3' : '';
    const weergave = transform ? transform(waarde) : waarde.toFixed(1);
    html += `<tr class="${topKlasse}">
      <td class="rang">${rang}</td>
      <td class="waarde ${klasse}-kleur">${weergave}<small>${eenheid}</small></td>
      <td class="station">${station}</td>
    </tr>`;
  });
  html += '</table>';
  return html;
}

function toonDag(datum) {
  geselecteerdeDag = datum;
  const dag = dagData[datum];

  // Tab actief markeren
  document.querySelectorAll('.dag-tab').forEach(t => {
    t.classList.toggle('actief', t.dataset.datum === datum);
  });

  const updateStr = dag.update || '–';
  const badgeKlasse = dag.status === 'definitief' ? 'definitief' : '';

  const inhoud = document.getElementById('inhoud');
  inhoud.innerHTML = `
    <div class="status-balk">
      <span class="badge ${badgeKlasse}">${dag.status}</span>
      <span>Bijgewerkt: ${updateStr}</span>
    </div>
    <div class="grid-4">
      <div class="kolom">
        <div class="kolom-header tx">🌡 Maximum °C</div>
        ${maakTabel(dag.max, 'tx', '°', v => v.toFixed(1))}
      </div>
      <div class="kolom">
        <div class="kolom-header tn">❄ Minimum °C</div>
        ${maakTabel(dag.min, 'tn', '°', v => v.toFixed(1))}
      </div>
      <div class="kolom">
        <div class="kolom-header rh">🌧 Neerslag mm</div>
        ${maakTabel(dag.rr, 'rh', 'mm', v => v.toFixed(1))}
      </div>
      <div class="kolom">
        <div class="kolom-header fx">💨 Windstoten</div>
        ${maakTabel(dag.fx, 'fx', ' km/h', v => fxKmh(v))}
      </div>
    </div>
  `;
}

fetch(JSON_URL)
  .then(r => {
    if (!r.ok) throw new Error("HTTP " + r.status);
    return r.json();
  })
  .then(data => {
    dagData = data;
    const datums = Object.keys(data).sort().reverse();

    // Tabs aanmaken
    const tabsEl = document.getElementById('dag-tabs');
    tabsEl.innerHTML = datums.map(d =>
      `<div class="dag-tab" data-datum="${d}">${dagNaam(d)}<br><small>${d}</small></div>`
    ).join('');

    tabsEl.querySelectorAll('.dag-tab').forEach(tab => {
      tab.addEventListener('click', () => toonDag(tab.dataset.datum));
    });

    // Eerste dag tonen
    if (datums.length > 0) toonDag(datums[0]);
  })
  .catch(err => {
    document.getElementById('dag-tabs').innerHTML = '';
    document.getElementById('inhoud').innerHTML =
      `<div class="fout">Kon toplijst.json niet laden.<br><small>${err.message}</small></div>`;
  });
</script>
</body>
</html>
