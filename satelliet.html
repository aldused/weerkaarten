// Genereer lijst van laatste 18 tijdstappen (10-min intervallen = 3 uur).
// EUMETView publiceert near-real-time, maar met verwerkingstijd. Zonder TIME
// gaf de WMS op 25-04-2026 om 14:32 NL als nieuwste beeld 14:10 NL terug.
function tijdstappen() {
  const stappen = [];
  const nu = new Date();
  // Rond af naar vorige 10 minuten, min circa 20 min vertraging.
  const basis = new Date(nu);
  basis.setUTCMinutes(Math.floor((nu.getUTCMinutes() - 20) / 10) * 10, 0, 0);
  for (let i = LAATSTE_TIJDSTAP; i >= 0; i--) {
    const t = new Date(basis.getTime() - i * 10 * 60000);
    stappen.push(t);
  }
  return stappen;
}

function formatTijd(d) {
  return d.toLocaleTimeString('nl-NL', {
    timeZone: 'Europe/Amsterdam',
    hour: '2-digit',
    minute: '2-digit',
    hour12: false
  }) + ' NL';
}

function formatDatumTijd(d) {
  return d.toLocaleString('nl-NL', {
    timeZone: 'Europe/Amsterdam',
    day: '2-digit',
    month: '2-digit',
    year: 'numeric',
    hour: '2-digit',
    minute: '2-digit',
    hour12: false
  }) + ' NL';
}

function isoTijd(d) {
  return d.toISOString().replace(/\.\d{3}Z$/, 'Z');
}

function radialen(graden) {
  return graden * Math.PI / 180;
}

function graden(radialen) {
  return radialen * 180 / Math.PI;
}

function zonhoogte(tijd, lat = 52.1, lon = 5.2) {
  const dagStart = Date.UTC(tijd.getUTCFullYear(), tijd.getUTCMonth(), tijd.getUTCDate());
  const dagNummer = Math.floor((dagStart - Date.UTC(tijd.getUTCFullYear(), 0, 0)) / 86400000);
  const uur = tijd.getUTCHours() + tijd.getUTCMinutes() / 60 + tijd.getUTCSeconds() / 3600;
  const gamma = 2 * Math.PI / 365 * (dagNummer - 1 + (uur - 12) / 24);
  const decl =
    0.006918
    - 0.399912 * Math.cos(gamma)
    + 0.070257 * Math.sin(gamma)
    - 0.006758 * Math.cos(2 * gamma)
    + 0.000907 * Math.sin(2 * gamma)
    - 0.002697 * Math.cos(3 * gamma)
    + 0.00148 * Math.sin(3 * gamma);
  const tijdCorrectie = 229.18 * (
    0.000075
    + 0.001868 * Math.cos(gamma)
    - 0.032077 * Math.sin(gamma)
    - 0.014615 * Math.cos(2 * gamma)
    - 0.040849 * Math.sin(2 * gamma)
  );
  const wareZonnetijd = uur * 60 + tijdCorrectie + 4 * lon;
  const uurhoek = radialen(wareZonnetijd / 4 - 180);
  const latRad = radialen(lat);
  return graden(Math.asin(
    Math.sin(latRad) * Math.sin(decl)
    + Math.cos(latRad) * Math.cos(decl) * Math.cos(uurhoek)
  ));
}

function productVoorTijd(tijd) {
  if (actieveLayer !== 'auto') return { layer: actieveLayer, label: actieveLabel, automatisch: false };
  return zonhoogte(tijd) >= 3
    ? { ...PRODUCTEN.truecolour, automatisch: true }
    : { ...PRODUCTEN.geocolour, automatisch: true };
}

function productLabel(product) {
  const label = product && product.label ? product.label : 'Satellietbeeld';
  return product && product.automatisch ? `Auto: ${label}` : label;
}

function productVoorLayer(layerName, tijd) {
  if (!layerName || layerName === 'auto') return productVoorTijd(tijd);
  return { layer: layerName, label: actieveLabel || 'Satellietbeeld' };
}

function wmsUrl(layerName, bbox, w, h, tijdstap) {
  const stappen = tijdstappen();
  const t = stappen[tijdstap];
  const product = productVoorLayer(layerName, t);
  const layers = product.layer;
  const styles = '';
  return WMS_URL +
    '?SERVICE=WMS&REQUEST=GetMap&VERSION=1.3.0' +
    '&LAYERS=' + encodeURIComponent(layers) +
    '&STYLES=' + encodeURIComponent(styles) +
    '&FORMAT=image/png&TRANSPARENT=FALSE' +
    '&CRS=CRS:84&BBOX=' + bbox +
    '&WIDTH=' + w + '&HEIGHT=' + h +
    '&TIME=' + isoTijd(t) +
    '&_t=' + t.getTime();
}

async function laadOverlayData() {
  try {
    const entries = await Promise.all(Object.entries(overlayBestanden).map(async ([key, url]) => {
      const r = await fetch(url + '?_=' + Date.now());
      if (!r.ok) throw new Error(url + ' ' + r.status);
      return [key, await r.json()];
    }));
    overlayData = Object.fromEntries(entries);
    overlayGeladen = true;
    tekenOverlay();
  } catch (e) {
    overlayGeladen = false;
  }
}

function actieveBboxParts() {
  return activeBbox.split(',').map(Number);
}

function beeldRect() {
  const vlak = document.querySelector('.sat-beeldvlak');
  const rect = vlak.getBoundingClientRect();
  const canvas = document.getElementById('sat-overlay');
  const dpr = window.devicePixelRatio || 1;
  const w = Math.max(1, Math.round(rect.width * dpr));
  const h = Math.max(1, Math.round(rect.height * dpr));
  if (canvas.width !== w || canvas.height !== h) {
    canvas.width = w;
    canvas.height = h;
  }
  canvas.style.width = rect.width + 'px';
  canvas.style.height = rect.height + 'px';
  const imgRatio = activeW / activeH;
  const boxRatio = rect.width / rect.height;
  let drawW, drawH, x, y;
  if (boxRatio > imgRatio) {
    drawH = rect.height;
    drawW = drawH * imgRatio;
    x = (rect.width - drawW) / 2;
    y = 0;
  } else {
    drawW = rect.width;
    drawH = drawW / imgRatio;
    x = 0;
    y = (rect.height - drawH) / 2;
  }
  return { canvas, dpr, x: x * dpr, y: y * dpr, w: drawW * dpr, h: drawH * dpr };
}

function projecteer(lon, lat, rect, bbox) {
  const [minLon, minLat, maxLon, maxLat] = bbox;
  return [
    rect.x + (lon - minLon) / (maxLon - minLon) * rect.w,
    rect.y + (maxLat - lat) / (maxLat - minLat) * rect.h
  ];
}

function tekenLijn(ctx, coords, rect, bbox) {
  let gestart = false;
  for (const p of coords) {
    if (!Array.isArray(p) || p.length < 2) continue;
    const [x, y] = projecteer(p[0], p[1], rect, bbox);
    if (!gestart) { ctx.moveTo(x, y); gestart = true; }
    else ctx.lineTo(x, y);
  }
}

function tekenGeometry(ctx, geom, rect, bbox) {
  if (!geom) return;
  if (geom.type === 'LineString') tekenLijn(ctx, geom.coordinates, rect, bbox);
  if (geom.type === 'MultiLineString') geom.coordinates.forEach(line => tekenLijn(ctx, line, rect, bbox));
  if (geom.type === 'Polygon') geom.coordinates.forEach(ring => tekenLijn(ctx, ring, rect, bbox));
  if (geom.type === 'MultiPolygon') geom.coordinates.forEach(poly => poly.forEach(ring => tekenLijn(ctx, ring, rect, bbox)));
}

function tekenFeatureSet(ctx, geojson, rect, bbox, stijl) {
  if (!geojson || !geojson.features) return;
  ctx.save();
  ctx.strokeStyle = stijl.stroke;
  ctx.lineWidth = stijl.width;
  ctx.globalAlpha = stijl.alpha ?? 1;
  ctx.lineJoin = 'round';
  ctx.lineCap = 'round';
  if (stijl.shadow) {
    ctx.shadowColor = stijl.shadow;
    ctx.shadowBlur = stijl.shadowBlur || 2;
  }
  ctx.beginPath();
  geojson.features.forEach(f => tekenGeometry(ctx, f.geometry, rect, bbox));
  ctx.stroke();
  ctx.restore();
}

function tekenCoordRingen(ctx, ringen, rect, bbox, stijl) {
  if (!Array.isArray(ringen)) return;
  ctx.save();
  ctx.strokeStyle = stijl.stroke;
  ctx.lineWidth = stijl.width;
  ctx.globalAlpha = stijl.alpha ?? 1;
  ctx.lineJoin = 'round';
  ctx.lineCap = 'round';
  if (stijl.shadow) {
    ctx.shadowColor = stijl.shadow;
    ctx.shadowBlur = stijl.shadowBlur || 2;
  }
  ctx.beginPath();
  ringen.forEach(ring => tekenLijn(ctx, ring, rect, bbox));
  ctx.stroke();
  ctx.restore();
}

function tekenNederlandContour(ctx, rect, bbox) {
  if (typeof NL_GRENS === 'undefined') return;
  const basis = Math.max(1, rect.dpr || 1);
  const isBenelux = actiefGebiedLabel === 'Benelux';
  const halo = isBenelux ? 5.4 : 3.3;
  const hoofd = isBenelux ? 2.5 : 1.45;
  const rand = isBenelux ? 0.9 : 0.55;
  const hoofdAlpha = isBenelux ? 0.94 : 0.72;
  tekenCoordRingen(ctx, NL_GRENS, rect, bbox, {
    stroke: isBenelux ? 'rgba(0,18,46,0.92)' : 'rgba(0,18,46,0.68)',
    width: halo * basis,
    alpha: isBenelux ? 1 : 0.82
  });
  tekenCoordRingen(ctx, NL_GRENS, rect, bbox, {
    stroke: `rgba(0,216,255,${hoofdAlpha})`,
    width: hoofd * basis,
    shadow: 'rgba(0,0,0,0.55)',
    shadowBlur: 1.2 * basis
  });
  tekenCoordRingen(ctx, NL_GRENS, rect, bbox, {
    stroke: isBenelux ? 'rgba(255,255,255,0.82)' : 'rgba(255,255,255,0.58)',
    width: rand * basis,
    alpha: isBenelux ? 0.95 : 0.72
  });
}

function tekenKaartOverlay(ctx, rect, bbox) {
  if (overlayGeladen) {
    tekenFeatureSet(ctx, overlayData.nl, rect, bbox, { stroke: 'rgba(255,255,255,0.23)', width: 0.62 * rect.dpr, shadow: 'rgba(0,0,0,0.45)', shadowBlur: 1 * rect.dpr });
    tekenFeatureSet(ctx, overlayData.be, rect, bbox, { stroke: 'rgba(255,255,255,0.28)', width: 0.7 * rect.dpr, shadow: 'rgba(0,0,0,0.45)', shadowBlur: 1 * rect.dpr });
    tekenFeatureSet(ctx, overlayData.rivieren, rect, bbox, { stroke: 'rgba(130,205,255,0.34)', width: 0.6 * rect.dpr });
  }
  tekenNederlandContour(ctx, rect, bbox);
}

function tekenMarker(ctx, rect, bbox) {
  if (!markerPunt) return;
  const [minLon, minLat, maxLon, maxLat] = bbox;
  if (markerPunt.lon < minLon || markerPunt.lon > maxLon || markerPunt.lat < minLat || markerPunt.lat > maxLat) return;

  const [x, y] = projecteer(markerPunt.lon, markerPunt.lat, rect, bbox);
  const dpr = rect.dpr || 1;
  const radius = 10 * dpr;
  ctx.save();
  ctx.shadowColor = 'rgba(0,0,0,0.72)';
  ctx.shadowBlur = 8 * dpr;
  ctx.beginPath();
  ctx.arc(x, y, radius + 4 * dpr, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(255,255,255,0.9)';
  ctx.fill();
  ctx.beginPath();
  ctx.arc(x, y, radius, 0, Math.PI * 2);
  ctx.fillStyle = markerPunt.kleur;
  ctx.fill();
  ctx.lineWidth = 2.4 * dpr;
  ctx.strokeStyle = 'rgba(0,32,91,0.95)';
  ctx.stroke();

  if (markerPunt.label) {
    ctx.font = `bold ${15 * dpr}px Arial, sans-serif`;
    const tekst = markerPunt.label;
    const tekstW = ctx.measureText(tekst).width;
    const labelX = x + 15 * dpr;
    const labelY = y - 30 * dpr;
    const padX = 9 * dpr;
    const padY = 6 * dpr;
    ctx.shadowBlur = 6 * dpr;
    ctx.fillStyle = 'rgba(0,32,91,0.88)';
    ctx.fillRect(labelX, labelY, tekstW + padX * 2, 27 * dpr);
    ctx.shadowBlur = 0;
    ctx.fillStyle = '#ffffff';
    ctx.fillText(tekst, labelX + padX, labelY + 19 * dpr);
  }
  ctx.restore();
}

function tekenOverlay() {
  const rect = beeldRect();
  const ctx = rect.canvas.getContext('2d');
  ctx.clearRect(0, 0, rect.canvas.width, rect.canvas.height);
  const bbox = actieveBboxParts();
  tekenKaartOverlay(ctx, rect, bbox);
  tekenMarker(ctx, rect, bbox);
}

function frameCacheKey(tijdstap) {
  const stappen = tijdstappen();
  const t = stappen[tijdstap];
  const product = productVoorLayer(actieveLayer, t);
  return [product.layer, activeBbox, activeW, activeH, isoTijd(t)].join('|');
}

function timelapseStartStap() {
  return Math.max(0, LAATSTE_TIJDSTAP - TIMELAPSE_AANTAL + 1);
}

function preloadFrame(tijdstap) {
  const key = frameCacheKey(tijdstap);
  const cached = frameCache.get(key);
  if (cached) return cached.promise;

  const url = wmsUrl(actieveLayer, activeBbox, activeW, activeH, tijdstap);
  const img = new Image();
  img.crossOrigin = 'anonymous';
  const entry = { img, url, failed: false };
  entry.promise = new Promise((resolve, reject) => {
    img.onload = () => {
      if (img.naturalWidth === 0) { entry.failed = true; reject(new Error('leeg beeld')); return; }
      resolve(img);
    };
    img.onerror = () => { entry.failed = true; reject(new Error('laadfout')); };
  });
  frameCache.set(key, entry);
  if (frameCache.size > 60) frameCache.delete(frameCache.keys().next().value);
  img.src = url;
  return entry.promise;
}

async function preloadTimelapseFrames(versie) {
  const start = timelapseStartStap();
  const stappen = [];
  for (let stap = start; stap <= LAATSTE_TIJDSTAP; stap++) stappen.push(stap);
  const resultaten = await Promise.allSettled(stappen.map(stap => preloadFrame(stap)));
  if (versie !== selectieVersie) return { ok: false, geldig: [] };
  const geldig = stappen.filter((_, i) => resultaten[i].status === 'fulfilled');
  return { ok: true, geldig };
}

function laadSatelliet(tijdstap) {
  const img = document.getElementById('satelliet-img');
  const info = document.getElementById('info-balk');
  const dot = document.getElementById('laad-dot');
  const headerProduct = document.getElementById('sat-header-product');
  const headerTijd = document.getElementById('sat-header-tijd');
  const headerGebied = document.getElementById('sat-header-gebied');
  const stappen = tijdstappen();
  const t = stappen[tijdstap];
  const isNu = tijdstap === LAATSTE_TIJDSTAP;
  const product = productVoorTijd(t);

  headerProduct.textContent = 'MTG · ' + productLabel(product);
  headerTijd.textContent = formatTijd(t) + (isNu ? ' · laatste beeld' : '');
  headerGebied.textContent = actiefGebiedLabel;
  const url = wmsUrl(actieveLayer, activeBbox, activeW, activeH, tijdstap);
  laatsteUrl = url;
  const cached = frameCache.get(frameCacheKey(tijdstap));
  if (cached && cached.img.complete && cached.img.naturalWidth > 0) {
    img.src = cached.url;
    img.classList.remove('laden');
    dot.style.display = 'none';
    info.textContent = 'Timelapse-cache · Bron: EUMETSAT EUMETView / MTG · tijden in NL-tijd';
    requestAnimationFrame(tekenOverlay);
    return;
  }
  if (cached && cached.failed) {
    img.classList.remove('laden');
    dot.style.display = 'none';
    info.textContent = productLabel(product) + ' · beeld ' + formatTijd(t) + ' niet beschikbaar';
    return;
  }

  dot.style.display = 'block';
  img.classList.add('laden');
  info.textContent = 'Bron: EUMETSAT EUMETView / MTG · © Ed Aldus / Weerlab · laden…';

  const tmp = new Image();
  tmp.crossOrigin = 'anonymous';
  tmp.onload = () => {
    img.src = url;
    frameCache.set(frameCacheKey(tijdstap), { img: tmp, promise: Promise.resolve(tmp), url });
    img.classList.remove('laden');
    dot.style.display = 'none';
    info.textContent = 'Bron: EUMETSAT EUMETView / Meteosat Third Generation · © Ed Aldus / Weerlab · tijden in NL-tijd';
    requestAnimationFrame(tekenOverlay);
  };
  tmp.onerror = () => {
    img.classList.remove('laden');
    dot.style.display = 'none';
    info.textContent = productLabel(product) + ' · laden mislukt';
  };
  tmp.src = url;
}

function toonTimelapseFrame(frame) {
  const img = document.getElementById('satelliet-img');
  const info = document.getElementById('info-balk');
  const dot = document.getElementById('laad-dot');

}

function actieveMarkerKleur() {
  return document.getElementById('marker-color').value;
}

function plaatsMarker(lon, lat, label) {
  markerPunt = { lon, lat, label, kleur: actieveMarkerKleur() };
  document.getElementById('marker-zoek').value = label || '';
  tekenOverlay();
}

function normaliseerZoektekst(tekst) {
  return tekst.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^a-z0-9]+/g, ' ').trim();
}

function alleMarkerPlaatsen() {
  const gezien = new Set();
  return [...Object.values(markerLocaties), ...markerPlaatsen].filter(p => {
    const key = normaliseerZoektekst(p.label);
    if (gezien.has(key)) return false;
    gezien.add(key);
    return true;
  });
}

function lokaleMarkerMatches(query) {
  const q = normaliseerZoektekst(query);
  if (!q) return [];
  return alleMarkerPlaatsen()
    .filter(p => normaliseerZoektekst(p.label).includes(q))
    .sort((a, b) => {
      const an = normaliseerZoektekst(a.label);
      const bn = normaliseerZoektekst(b.label);
      const as = an.startsWith(q) ? 0 : 1;
      const bs = bn.startsWith(q) ? 0 : 1;
      return as - bs || a.label.localeCompare(b.label, 'nl');
    })
    .slice(0, 6)
    .map(p => ({ label: p.label, lat: p.lat, lon: p.lon, sub: 'Bekende locatie' }));
}

function parseMarkerCoordinaten(tekst) {
  const matches = [...tekst.matchAll(/-?\d+(?:[.,]\d+)?/g)].map(m => Number(m[0].replace(',', '.')));
  if (matches.length < 2 || !matches.every(Number.isFinite)) return null;
  let lat = matches[0];
  let lon = matches[1];
  if (Math.abs(lat) <= 20 && Math.abs(lon) > 20) [lat, lon] = [lon, lat];
  if (lat < 45 || lat > 57 || lon < -8 || lon > 13) return null;
  const labelTekst = tekst.replace(/-?\d+(?:[.,]\d+)?/g, '').replace(/[(),;]/g, ' ').replace(/\s+/g, ' ').trim();
  return { label: labelTekst || 'Eigen punt', lat, lon, sub: 'Eigen coordinaten' };
}

function escapeHtml(tekst) {
  return String(tekst).replace(/[&<>"']/g, ch => ({
    '&': '&amp;',
    '<': '&lt;',
    '>': '&gt;',
    '"': '&quot;',
    "'": '&#39;'
  }[ch]));
}

function toonMarkerSuggesties(resultaten) {
  const box = document.getElementById('marker-suggest');
  markerZoekResultaten = resultaten;
  markerSuggestIndex = resultaten.length ? Math.max(0, Math.min(markerSuggestIndex, resultaten.length - 1)) : 0;
  if (!resultaten.length) {
    box.style.display = 'none';
    box.innerHTML = '';
    return;
  }
  box.innerHTML = resultaten.map((r, i) =>
    `<div class="${i === markerSuggestIndex ? 'sel' : ''}" data-idx="${i}"><div class="titel">${escapeHtml(r.label)}</div><div class="sub">${escapeHtml(r.sub || `${r.lat.toFixed(3)}°N, ${r.lon.toFixed(3)}°E`)}</div></div>`
  ).join('');
  box.style.display = 'block';
}

function kiesMarkerResultaat(idx) {
  const resultaat = markerZoekResultaten[idx];
  if (!resultaat) return;
  document.getElementById('marker-suggest').style.display = 'none';
  document.getElementById('marker-preset').value = '';
  plaatsMarker(resultaat.lon, resultaat.lat, resultaat.label);
  zetPlaatsPuntModus(false);
}

async function zoekMarkerPlaats(direct = false) {
  const input = document.getElementById('marker-zoek');
  const q = input.value.trim();
  if (q.length < 2) {
    toonMarkerSuggesties([]);
    return;
  }

  const lokaal = lokaleMarkerMatches(q);
  const coord = parseMarkerCoordinaten(q);
  const startResultaten = coord ? [coord, ...lokaal] : lokaal;
  toonMarkerSuggesties(startResultaten);
  if (direct && startResultaten.length) {
    kiesMarkerResultaat(0);
    return;
  }

  if (markerZoekCtrl) markerZoekCtrl.abort();
  markerZoekCtrl = new AbortController();
  try {
    const url = `https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(q)}&format=json&limit=6&accept-language=nl&countrycodes=nl,be,lu&addressdetails=1`;
    const r = await fetch(url, { headers: { 'Accept-Language': 'nl' }, signal: markerZoekCtrl.signal });
    if (!r.ok) throw new Error('zoekfout');
    const extern = (await r.json()).map(item => {
      const delen = item.display_name.split(',').map(s => s.trim());
      return {
        label: delen[0],
        lat: parseFloat(item.lat),
        lon: parseFloat(item.lon),
        sub: delen.slice(1, 4).join(', ')
      };
    }).filter(item => Number.isFinite(item.lat) && Number.isFinite(item.lon));
    const basis = coord ? [coord, ...lokaal] : lokaal;
    const gecombineerd = [...basis, ...extern.filter(ex => !basis.some(lo => normaliseerZoektekst(lo.label) === normaliseerZoektekst(ex.label)))].slice(0, 8);
    toonMarkerSuggesties(gecombineerd);
    if (direct && gecombineerd.length) kiesMarkerResultaat(0);
  } catch (e) {
    if (e.name !== 'AbortError' && direct && !startResultaten.length) {
      const info = document.getElementById('info-balk');
      info.textContent = 'Plaats niet gevonden. Gebruik eventueel coordinaten of Klikpunt.';
    }
  }
}

function zetPlaatsPuntModus(actief) {
  plaatsPuntModus = actief;
  const btn = document.getElementById('btn-marker-click');
  const vlak = document.querySelector('.sat-beeldvlak');
  btn.classList.toggle('actief', actief);
  btn.textContent = actief ? 'Klik nu' : 'Klikpunt';
  vlak.classList.toggle('plaats-punt', actief);
}

function schermNaarLonLat(clientX, clientY) {
  const vlak = document.querySelector('.sat-beeldvlak');
  const vlakRect = vlak.getBoundingClientRect();
  const rect = beeldRect();
  const dpr = window.devicePixelRatio || 1;
  const x = (clientX - vlakRect.left) * dpr;
  const y = (clientY - vlakRect.top) * dpr;
  if (x < rect.x || x > rect.x + rect.w || y < rect.y || y > rect.y + rect.h) return null;
  const [minLon, minLat, maxLon, maxLat] = actieveBboxParts();
  return {
    lon: minLon + (x - rect.x) / rect.w * (maxLon - minLon),
    lat: maxLat - (y - rect.y) / rect.h * (maxLat - minLat)
  };
}

  clearTimeout(markerZoekTimer);
  markerZoekTimer = setTimeout(() => zoekMarkerPlaats(false), 250);
});

document.getElementById('marker-zoek').addEventListener('keydown', e => {
  if (e.key === 'Enter') {
    e.preventDefault();
    zoekMarkerPlaats(true);
  } else if (e.key === 'ArrowDown') {
    e.preventDefault();
    markerSuggestIndex = Math.min(markerSuggestIndex + 1, Math.max(0, markerZoekResultaten.length - 1));
    toonMarkerSuggesties(markerZoekResultaten);
  } else if (e.key === 'ArrowUp') {
    e.preventDefault();
    markerSuggestIndex = Math.max(markerSuggestIndex - 1, 0);
    toonMarkerSuggesties(markerZoekResultaten);
  } else if (e.key === 'Escape') {
    document.getElementById('marker-suggest').style.display = 'none';
  }
});

document.querySelector('.sat-beeldvlak').addEventListener('click', e => {
  if (!plaatsPuntModus) return;
  const coords = schermNaarLonLat(e.clientX, e.clientY);
  if (!coords) return;
  const eigenLabel = document.getElementById('marker-zoek').value.trim();
  plaatsMarker(coords.lon, coords.lat, eigenLabel || 'Punt');
  document.getElementById('marker-preset').value = '';
  zetPlaatsPuntModus(false);
});

function bestandsNaam(t, suffix = '', ext = 'png') {
  const stamp = t.toISOString().slice(0, 16).replace(/[-:T]/g, '');
  const product = actieveLabel.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
  const gebied = actiefGebiedLabel.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
  return `weerlab-mtg-${product}-${gebied}${suffix}-${stamp}.${ext}`;
}

function laadAfbeeldingVoorCanvas(url) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.crossOrigin = 'anonymous';
    img.onload = () => resolve(img);
    img.onerror = reject;
    img.src = url;
  });
}

function tekenExportOverlay(ctx, x, y, w, h) {
  const rect = { x, y, w, h, dpr: 1 };
  const bbox = actieveBboxParts();
  tekenKaartOverlay(ctx, rect, bbox);
  tekenMarker(ctx, rect, bbox);
}

async function maakExportCanvas(social = false) {
  const stappen = tijdstappen();
  const t = stappen[actieveTijdstap];
  const product = productVoorTijd(t);
  const url = laatsteUrl || wmsUrl(actieveLayer, activeBbox, activeW, activeH, actieveTijdstap);
  const img = await laadAfbeeldingVoorCanvas(url);
  const headerH = 86;
  const footerH = 42;
  const bronW = img.naturalWidth || activeW;
  const bronH = img.naturalHeight || activeH;
  const maxBreedte = social ? 1200 : bronW;
  const schaal = Math.min(1, maxBreedte / bronW);
  const canvas = document.createElement('canvas');
  canvas.width = Math.round(bronW * schaal);
  canvas.height = Math.round((headerH + bronH + footerH) * schaal);
  const ctx = canvas.getContext('2d');
  ctx.scale(schaal, schaal);

  ctx.fillStyle = '#003366';
  ctx.fillRect(0, 0, bronW, headerH);
  ctx.fillStyle = '#2ec4e8';
  ctx.fillRect(0, headerH - 3, bronW, 3);
  ctx.fillStyle = '#ffffff';
  ctx.font = 'bold 28px Arial, sans-serif';
  ctx.fillText(`MTG · ${productLabel(product)}`, 24, 36);
  ctx.font = '18px Arial, sans-serif';
  ctx.fillStyle = '#a8c8e8';
  ctx.fillText('Bron: EUMETSAT EUMETView / Meteosat Third Generation', 24, 66);
  ctx.textAlign = 'right';
  ctx.fillStyle = '#ffffff';
  ctx.font = 'bold 26px Arial, sans-serif';
  ctx.fillText(formatDatumTijd(t) + (actieveTijdstap === LAATSTE_TIJDSTAP ? ' · laatste beeld' : ''), bronW - 24, 36);
  ctx.font = '18px Arial, sans-serif';
  ctx.fillStyle = '#a8c8e8';
  ctx.fillText(actiefGebiedLabel, bronW - 24, 66);
  ctx.textAlign = 'left';

  ctx.filter = 'contrast(1.08) saturate(1.08) brightness(1.02)';
  ctx.drawImage(img, 0, headerH);
  ctx.filter = 'none';
  tekenExportOverlay(ctx, 0, headerH, bronW, bronH);

  ctx.fillStyle = '#00142d';
  ctx.fillRect(0, headerH + bronH, bronW, footerH);
  ctx.fillStyle = '#dcecff';
  ctx.font = '18px Arial, sans-serif';
  ctx.fillText('Bron: EUMETSAT EUMETView / MTG', 24, headerH + bronH + 27);
  ctx.textAlign = 'right';
  ctx.fillText('© Ed Aldus / Weerlab', bronW - 24, headerH + bronH + 27);
  ctx.textAlign = 'left';

  return { canvas, t, url };
}

async function downloadPng(social = false) {
  const stappen = tijdstappen();
  const t = stappen[actieveTijdstap];
  const url = laatsteUrl || wmsUrl(actieveLayer, activeBbox, activeW, activeH, actieveTijdstap);
  const naam = bestandsNaam(t, social ? '-social' : '');
  const btn = document.getElementById(social ? 'btn-download-social' : 'btn-download');
  const oudeTekst = btn.textContent;
  btn.textContent = 'PNG maken…';
  btn.disabled = true;

  try {
    const { canvas } = await maakExportCanvas(social);
    const a = document.createElement('a');
    a.href = canvas.toDataURL('image/png');
    a.download = naam;
    document.body.appendChild(a);
    a.click();
    a.remove();
  } catch (err) {
    const a = document.createElement('a');
    a.href = url;
    a.download = naam;
    a.target = '_blank';
    document.body.appendChild(a);
    a.click();
    a.remove();
    alert('Canvas-export werd door de browser geblokkeerd. Ik open daarom de ruwe EUMETView-PNG; de blauwe header staat dan niet in het bestand.');
  } finally {
    btn.textContent = oudeTekst;
    btn.disabled = false;
  }
}

document.getElementById('btn-download').addEventListener('click', () => downloadPng(false));
document.getElementById('btn-download-social').addEventListener('click', () => downloadPng(true));

function dataUrlNaarBytes(dataUrl) {
  const binair = atob(dataUrl.split(',')[1]);
  const bytes = new Uint8Array(binair.length);
  for (let i = 0; i < binair.length; i++) bytes[i] = binair.charCodeAt(i);
  return bytes;
}

function maakPdfBlobVanCanvas(canvas) {
  const jpegBytes = dataUrlNaarBytes(canvas.toDataURL('image/jpeg', 0.92));
  const liggend = canvas.width >= canvas.height;
  const pageW = liggend ? 842 : 595;
  const pageH = liggend ? 595 : 842;
  const marge = 18;
  const schaal = Math.min((pageW - marge * 2) / canvas.width, (pageH - marge * 2) / canvas.height);
  const drawW = canvas.width * schaal;
  const drawH = canvas.height * schaal;
  const drawX = (pageW - drawW) / 2;
  const drawY = (pageH - drawH) / 2;
  const inhoud = `q\n${drawW.toFixed(2)} 0 0 ${drawH.toFixed(2)} ${drawX.toFixed(2)} ${drawY.toFixed(2)} cm\n/Im0 Do\nQ\n`;
  const encoder = new TextEncoder();
  const chunks = [];
  const offsets = [0];
  let positie = 0;

  function voegTekstToe(tekst) {
    const bytes = encoder.encode(tekst);
    chunks.push(bytes);
    positie += bytes.length;
  }

  function voegBytesToe(bytes) {
    chunks.push(bytes);
    positie += bytes.length;
  }

  function object(nummer, inhoudTekst) {
    offsets[nummer] = positie;
    voegTekstToe(`${nummer} 0 obj\n${inhoudTekst}\nendobj\n`);
  }

  voegTekstToe('%PDF-1.4\n');
  object(1, '<< /Type /Catalog /Pages 2 0 R >>');
  object(2, '<< /Type /Pages /Kids [3 0 R] /Count 1 >>');
  object(3, `<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${pageW} ${pageH}] /Resources << /XObject << /Im0 4 0 R >> >> /Contents 5 0 R >>`);

  offsets[4] = positie;
  voegTekstToe(`4 0 obj\n<< /Type /XObject /Subtype /Image /Width ${canvas.width} /Height ${canvas.height} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${jpegBytes.length} >>\nstream\n`);
  voegBytesToe(jpegBytes);
  voegTekstToe('\nendstream\nendobj\n');

  object(5, `<< /Length ${encoder.encode(inhoud).length} >>\nstream\n${inhoud}endstream`);
  const xrefStart = positie;
  voegTekstToe('xref\n0 6\n0000000000 65535 f \n');
  for (let i = 1; i <= 5; i++) {
    voegTekstToe(String(offsets[i]).padStart(10, '0') + ' 00000 n \n');
  }
  voegTekstToe(`trailer\n<< /Size 6 /Root 1 0 R >>\nstartxref\n${xrefStart}\n%%EOF`);

  const totaal = new Uint8Array(positie);
  let offset = 0;
  for (const chunk of chunks) {
    totaal.set(chunk, offset);
    offset += chunk.length;
  }
  return new Blob([totaal], { type: 'application/pdf' });
}

async function downloadPdf() {
  const stappen = tijdstappen();
  const t = stappen[actieveTijdstap];
  const btn = document.getElementById('btn-download-pdf');
  const oudeTekst = btn.textContent;
  btn.textContent = 'PDF maken…';
  btn.disabled = true;

  try {
    const { canvas } = await maakExportCanvas(false);
    const blob = maakPdfBlobVanCanvas(canvas);
    downloadBlob(blob, bestandsNaam(t, '', 'pdf'));
  } catch (err) {
    alert('PDF-export is niet gelukt. Mogelijk blokkeert de browser canvas-export van de EUMETView-beelden.');
  } finally {
    btn.textContent = oudeTekst;
    btn.disabled = false;
  }
}

document.getElementById('btn-download-pdf').addEventListener('click', downloadPdf);

function kiesVideoMimeType() {
  const opties = [
    'video/mp4;codecs="avc1.42E01E"',
    'video/mp4;codecs=h264',
    'video/mp4',
    'video/webm;codecs=vp9',
    'video/webm;codecs=vp8',
    'video/webm'
  ];
  return opties.find(type => window.MediaRecorder && MediaRecorder.isTypeSupported(type)) || '';
}

function downloadBlob(blob, naam) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = naam;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

function wacht(ms) {
  return new Promise(resolve => setTimeout(resolve, ms));
}

function volgendeAnimatieFrame() {
  return new Promise(resolve => requestAnimationFrame(() => resolve()));
}

async function timelapseFrames() {
  const start = timelapseStartStap();
  const frames = [];
  for (let stap = start; stap <= LAATSTE_TIJDSTAP; stap++) {
    try { await preloadFrame(stap); } catch (e) { /* skip ontbrekend beeld */ }
    const cached = frameCache.get(frameCacheKey(stap));
    if (cached && !cached.failed && cached.img.complete && cached.img.naturalWidth > 0) {
      frames.push({ stap, img: cached.img, url: cached.url });
    }
  }
  return frames;
}

function tekenVideoFrame(ctx, canvas, frame, schaal) {
  const stappen = tijdstappen();
  const t = stappen[frame.stap];
  const product = productVoorTijd(t);
  const w = canvas.width / schaal;
  const h = canvas.height / schaal;

  ctx.save();
  ctx.scale(schaal, schaal);
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, w, h);
  ctx.filter = 'contrast(1.08) saturate(1.08) brightness(1.02)';
  ctx.drawImage(frame.img, 0, 0, w, h);
  ctx.filter = 'none';
  tekenExportOverlay(ctx, 0, 0, w, h);

  ctx.fillStyle = 'rgba(0, 32, 91, 0.82)';
  ctx.fillRect(18, 18, 430, 54);
  ctx.fillStyle = '#ffffff';
  ctx.font = 'bold 22px Arial, sans-serif';
  ctx.fillText(`MTG · ${productLabel(product)}`, 34, 42);
  ctx.font = '17px Arial, sans-serif';
  ctx.fillStyle = '#dcecff';
  ctx.fillText(`${actiefGebiedLabel} · ${formatDatumTijd(t)}`, 34, 64);

  ctx.textAlign = 'right';
  ctx.fillStyle = 'rgba(0, 20, 45, 0.72)';
  ctx.fillRect(w - 306, h - 56, 288, 38);
  ctx.fillStyle = '#ffffff';
  ctx.font = '16px Arial, sans-serif';
  ctx.fillText('© Ed Aldus / Weerlab', w - 30, h - 32);
  ctx.restore();
}

async function downloadTimelapseVideo(social = false) {
  const btn = document.getElementById(social ? 'btn-video-social' : 'btn-video');
  const info = document.getElementById('info-balk');
  const dot = document.getElementById('laad-dot');
  const oudeTekst = btn.textContent;
  const mimeType = kiesVideoMimeType();
  if (!window.MediaRecorder || !HTMLCanvasElement.prototype.captureStream || !mimeType) {
    alert('Deze browser ondersteunt geen video-export via MediaRecorder. Probeer Safari of een recente Chromium-browser.');
    return;
  }

  btn.disabled = true;
  btn.textContent = 'Video maken…';
  dot.style.display = 'block';
  info.textContent = 'Laatste 10 beelden laden en video bouwen…';

  try {
    const frames = await timelapseFrames();
    if (frames.length < 2) throw new Error('Te weinig frames beschikbaar voor video-export.');

    const maxBreedte = social ? 1200 : activeW;
    const schaal = Math.min(1, maxBreedte / activeW);
    const canvas = document.createElement('canvas');
    canvas.width = Math.round(activeW * schaal);
    canvas.height = Math.round(activeH * schaal);
    const ctx = canvas.getContext('2d');
    tekenVideoFrame(ctx, canvas, frames[0], schaal);
    await volgendeAnimatieFrame();

    let stream = canvas.captureStream(0);
    let track = stream.getVideoTracks()[0];
    if (!track || typeof track.requestFrame !== 'function') {
      stream.getTracks().forEach(t => t.stop());
      stream = canvas.captureStream(2);
      track = stream.getVideoTracks()[0];
    }
    const recorder = new MediaRecorder(stream, {
      mimeType,
      videoBitsPerSecond: social ? 2500000 : 7000000
    });
    const chunks = [];
    recorder.ondataavailable = e => {
      if (e.data && e.data.size) chunks.push(e.data);
    };
    const klaar = new Promise(resolve => {
      recorder.onstop = resolve;
    });

    const gestart = new Promise(resolve => {
      recorder.onstart = resolve;
    });
    recorder.start(250);
    await gestart;

    for (const frame of frames) {
      tekenVideoFrame(ctx, canvas, frame, schaal);
      if (track && track.requestFrame) track.requestFrame();
      await volgendeAnimatieFrame();
      await wacht(650);
    }
    tekenVideoFrame(ctx, canvas, frames[frames.length - 1], schaal);
    if (track && track.requestFrame) track.requestFrame();
    await volgendeAnimatieFrame();
    await wacht(900);
    recorder.stop();
    await klaar;
    stream.getTracks().forEach(t => t.stop());

    const ext = mimeType.includes('mp4') ? 'mp4' : 'webm';
    const t = tijdstappen()[LAATSTE_TIJDSTAP];
    const blob = new Blob(chunks, { type: mimeType });
    if (!blob.size) throw new Error('Lege video-export');
    downloadBlob(blob, bestandsNaam(t, social ? '-timelapse-social' : '-timelapse', ext));
    info.textContent = `Timelapse-video klaar (${ext.toUpperCase()}) · Bron: EUMETSAT EUMETView / MTG`;
  } catch (err) {
    console.warn('Video-export mislukt', err);
    info.textContent = 'MP4-export lukt hier niet door browserbeveiliging van de EUMETView-beelden. PNG/PDF en afspelen blijven werken.';
  } finally {
    dot.style.display = 'none';
    btn.textContent = oudeTekst;
    btn.disabled = false;
  }
}

document.getElementById('btn-video').addEventListener('click', () => downloadTimelapseVideo(false));
document.getElementById('btn-video-social').addEventListener('click', () => downloadTimelapseVideo(true));

function startAutoRefresh() {
  const btn = document.getElementById('btn-auto');
  const status = document.getElementById('auto-status');
  if (autoRefreshTimer) return;
  autoRefreshTimer = setInterval(() => {
    actieveTijdstap = LAATSTE_TIJDSTAP;
    slider.value = LAATSTE_TIJDSTAP;
    updateTijdDisplay(LAATSTE_TIJDSTAP);
    selectieVersie++;
    laadSatelliet(LAATSTE_TIJDSTAP);
  }, 10 * 60 * 1000);
  btn.classList.add('actief');
  btn.textContent = '⏱ Auto aan';
  status.textContent = '● Auto-refresh elke 10 min';
}

function stopAutoRefresh() {
  const btn = document.getElementById('btn-auto');
  const status = document.getElementById('auto-status');
  if (!autoRefreshTimer) return;
  clearInterval(autoRefreshTimer);
  autoRefreshTimer = null;
  btn.classList.remove('actief');
  btn.textContent = '⏱ Auto';
  status.textContent = '';
}

// Auto-refresh (elke 10 minuten)
document.getElementById('btn-auto').addEventListener('click', () => {
  if (autoRefreshTimer) stopAutoRefresh();
  else startAutoRefresh();
});

// Timelapse van de laatste 10 beelden afspelen
document.getElementById('btn-play').addEventListener('click', async () => {
  const btn = document.getElementById('btn-play');
  const info = document.getElementById('info-balk');
  const dot = document.getElementById('laad-dot');
  if (animatieActief) {
    clearInterval(animatieTimer);
    animatieActief = false;
    btn.classList.remove('actief');
    btn.textContent = '▶';
    info.textContent = 'Timelapse gepauzeerd · Bron: EUMETSAT EUMETView / MTG';
    return;
  }

  const versie = selectieVersie;
  btn.disabled = true;
  dot.style.display = 'block';
  info.textContent = 'Laatste 10 satellietbeelden laden voor timelapse…';
  await preloadTimelapseFrames(versie);
  const frames = versie === selectieVersie ? await timelapseFrames() : [];
  btn.disabled = false;
  dot.style.display = 'none';
  if (versie !== selectieVersie) return;
  if (frames.length < 2) {
    info.textContent = frames.length === 0
      ? 'Geen beelden beschikbaar voor timelapse — probeer het later opnieuw'
      : 'Slechts 1 beeld beschikbaar — geen timelapse mogelijk';
    return;
  }
  const ontbrekend = (LAATSTE_TIJDSTAP - timelapseStartStap() + 1) - frames.length;

  animatieActief = true;
  btn.classList.add('actief');
  btn.textContent = '⏸';

  let idx = 0;
  let frame = frames[idx];
  let stap = frame.stap;
  slider.value = stap;
  actieveTijdstap = stap;
  updateTijdDisplay(stap);
  toonTimelapseFrame(frame);

  animatieTimer = setInterval(() => {
    idx++;
    if (idx >= frames.length) {
      clearInterval(animatieTimer);
      animatieActief = false;
      btn.classList.remove('actief');
      btn.textContent = '▶';
      const laatste = frames[frames.length - 1].stap;
      actieveTijdstap = laatste;
      slider.value = laatste;
      updateTijdDisplay(laatste);
      toonTimelapseFrame(frames[frames.length - 1]);
      if (ontbrekend > 0) {
        document.getElementById('info-balk').textContent = `Timelapse afgespeeld · ${ontbrekend} beeld${ontbrekend === 1 ? '' : 'en'} ontbrak${ontbrekend === 1 ? '' : 'en'} bij EUMETSAT · Bron: EUMETSAT EUMETView / MTG`;
      }
      return;
    }
    frame = frames[idx];
    stap = frame.stap;
    slider.value = stap;
    actieveTijdstap = stap;
    updateTijdDisplay(stap);
    toonTimelapseFrame(frame);
  }, 650);
});

window.addEventListener('resize', tekenOverlay);
laadOverlayData();
updateTijdDisplay(LAATSTE_TIJDSTAP);
laadSatelliet(LAATSTE_TIJDSTAP);
